依據 MBLR 14A.90：關連人士向上市發行人集團提供財務資助，若按正常商業條款進行，且發行人群組未以自身資產提供抵押，則該交易屬於全面豁免（Fully exempt）的財務資助，旨在便利大股東為公司輸血注資。","reference":"MBLR 14A.90; HKSI Paper 5 Guide Topic 2 Section 11.32"},{"id":"T2-196","topic":"Topic 2","subtopic":"Notifiable Transactions - Profit Ratio Anomaly Waiver","difficulty":"Level 2","question":"根據《上市規則》第 14.20 條，若發事人在計算須予公布交易的百分比率時，由於發行人自身基期盈利極低或虧損，導致盈利比率（Profits ratio）計算出幾千個百分點的異常結果（Anomalous result），發行人應當：","options":[{"value":"A","label":"擅自將計算公式分母人為修改為 1 億"},{"value":"B","label":"向聯交所申請寬免（Apply for a variation of the tests），要求聯交所運用酌情權排除該異常比率或採用替代測試"},{"value":"C","label":"自動將交易作為非常重大收購處理"},{"value":"D","label":"停止編制所有財務報表"}],"answer":"B","explanation":"指南 2-42 頁 11.8 節註釋 2 及 MBLR 14.20 指明：若計算百分比率產生異常結果（Anomalous result）或不切實際，發行人可向聯交所申請變更測試，聯交所可酌情准許發行人採用替代計算方法。","reference":"MBLR 14.20; HKSI Paper 5 Guide Topic 2 Section 11.8 Note 2"},{"id":"T2-197","topic":"Topic 2","subtopic":"Continuing Obligations - 10-Day Circular Rule for Auditor Removal","difficulty":"Level 2","question":"根據主板第 13.88 條，發行人擬在股東大會上提呈罷免現任核數師並更換新核數師的決議案。寄發載有核數師書面申述的股東通函，至大會召開日之間的最短法定通知期為：","options":[{"value":"A","label":"不少於 48 小時"},{"value":"B","label":"不少於 10 個營業日（Not less than ten business days before the general meeting）"},{"value":"C","label":"不少於 30 天"},{"value":"D","label":"無須寄發任何通函"}],"answer":"B","explanation":"指南 2-21 頁 3.57 節及 MBLR 13.88 明確規定：罷免核數師的通函連同核數師的任何書面申述，必須在股東大會召開前不少於 10 個營業日寄發予股東，確保股東有足夠時間審閱更換會計師的爭議細節。","reference":"MBLR 13.88; HKSI Paper 5 Guide Topic 2 Section 3.57"},{"id":"T2-198","topic":"Topic 2","subtopic":"Model Code - Notification of Directors Dealing","difficulty":"Level 2","question":"根據主板附錄 C3《標準守則》（Model Code）第 B.8 條，發行人董事在進行本公司任何證券交易之前，必須履行的前置合規程序是：","options":[{"value":"A","label":"在交易完成後第 30 天以普通平郵通知聯交所"},{"value":"B","label":"必須預先書面通知董事會主席（或指定董事），並取得註明日期的書面認可／確認函後方可進行買賣"},{"value":"C","label":"向全體公眾投資者發出公開傳真"},{"value":"D","label":"僅需口頭告知家庭成員"}],"answer":"B","explanation":"MBLR Appendix C3 Rule B.8 指明：董事在買賣本公司證券前，必須預先以書面形式知會主席（主席買賣則通知指定董事），並收到載明日期的書面接納回條（Dated written acknowledgment）後，方可執行交易。","reference":"MBLR Appendix C3; HKSI Paper 5 Guide Topic 2 Section 3.34"},{"id":"T2-199","topic":"Topic 2","subtopic":"Public Float - Rectification & Suspension","difficulty":"Level 2","question":"當上市發行人的公眾持股量跌破法定最低門檻（例如跌破 25%），且聯交所有理由相信該證券已出現虛假市場或股權過度集中時，聯交所通常採取的處置措施為：","options":[{"value":"A","label":"強制要求大股東將個人護照交由聯交所保管"},{"value":"B","label":"指示該證券短暫停牌或停牌，直至發行人採取有效補救措施恢復規定的公眾持股量百分比為止"},{"value":"C","label":"立即將發行人全部銀行存款劃撥為交易所基金"},{"value":"D","label":"允許發行人無限期維持 0% 公眾持股量運作"}],"answer":"B","explanation":"指南 2-47 頁 9.4(c) 節、2-51 頁 12.5(a) 節及 MBLR 8.08 指明：公眾持股量不足可能損害市場秩序與流動性，聯交所有權指示股票停牌，直至發行人配售新股或大股東減持恢復法定公眾持股量為止。","reference":"MBLR 8.08, 6.01; HKSI Paper 5 Guide Topic 2 Section 9.4(c), 12.5(a)"},{"id":"T2-200","topic":"Topic 2","subtopic":"Overview of Disciplinary Sanctions - Level of Severity","difficulty":"Level 2","question":"香港聯交所上市委員會對違反《上市規則》之發行人或董事可施加一系列由輕至重的紀律制裁。下列哪一組制裁措施的排序符合由輕至重的邏輯次序？","options":[{"value":"A","label":"取消上市資格 → 私下譴責 → 批評公告"},{"value":"B","label":"發出不公開譴責（Private reprimand） → 刊發涉及批評的公開聲明／公開譴責（Public censure） → 公開聲明董事不適合擔任管理職位 → 暫停或取消上市資格（Cancellation of listing）"},{"value":"C","label":"罰款 1 億元 → 監禁 5 年 → 口頭告誡"},{"value":"D","label":"公開譴責 → 內部表彰 → 轉板上市"}],"answer":"B","explanation":"指南 2-56 頁 13.4 節及 MBLR 2A.10 明確列出紀律處分階梯：私下譴責（最輕）→ 公開批評/公開譴責 → 認定損害投資者利益聲明 → 認定不適合擔任董事公開聲明 → 剝奪市場設施/暫停買賣 → 取消上市資格（除牌，最重）。","reference":"MBLR 2A.10; HKSI Paper 5 Guide Topic 2 Section 13.4"},{"id":"T2-201","topic":"Topic 2","subtopic":"Listing Procedures - Form A1 Submission Requirements","difficulty":"Level 2","question":"根據主板上市規則第 9.10A 條及第 9.11 條，新上市申請人正式呈交上市申請表格（Form A1）時，必須隨表格一併送交聯交所的文件包括下列哪一組？","options":[{"value":"A","label":"發行人的全套原始研發源代碼硬盤"},{"value":"B","label":"大致完備的上市文件申請版本（Application Proof）、保薦人確認營運資金充裕的信件草稿、所有擬申請豁免之草稿，以及首次上市費支票"},{"value":"C","label":"印發完畢的正式繁簡雙語招股章程最終版 5,000 份"},{"value":"D","label":"全體承銷商辛迪加成員已簽署的不可撤回最終包銷協議"}],"answer":"B","explanation":"指南 2-58 頁 9.45 節及 MBLR 9.10A/9.11 明確規定：遞交 Form A1 時必須附帶：(1) 格式合規的申請版本（Application Proof）；(2) 豁免申請草稿；(3) 保薦人確認營運資金充足的函件草稿；(4) 董事/監事個人資料；及 (5) 首次上市費支票。","reference":"MBLR 9.10A, 9.11; HKSI Paper 5 Guide Topic 2 Section 9.45"},{"id":"T2-202","topic":"Topic 2","subtopic":"Application Proof - Information Completeness & Accuracy","difficulty":"Level 2","question":"根據主板上市規則第 9.03(3) 條，在向聯交所呈交上市文件申請版本（Application Proof）之前，發行人董事會及保薦人必須確保該文件：","options":[{"value":"A","label":"可以遺漏全部財務數據，待上市聆訊當天才補齊"},{"value":"B","label":"在所有重大方面均屬準確及完整，不具誤導性或欺詐性，且相關呈交已獲董事會及／或股東決議案正式授權批准"},{"value":"C","label":"僅需包含發行人的公司簡介投影片即可"},{"value":"D","label":"無須經任何董事審閱即可直接送交"}],"answer":"B","explanation":"指南 2-57 頁 9.42(c) 節及 MBLR 9.03(3) 指明：在交付 Application Proof 前，各董事及監事必須確保其中資料在所有重大方面均準確完備且不具誤導性，發行人亦須確保已通過董事會或股東決議案正式授權該項呈交。","reference":"MBLR 9.03(3); HKSI Paper 5 Guide Topic 2 Section 9.42(c)"},{"id":"T2-203","topic":"Topic 2","subtopic":"Application Proof Return - Example Omissions","difficulty":"Level 3","question":"根據聯交所刊發的上市決策及指南案例，下列哪項重大資料遺漏（Material omission）曾直接導致聯交所將上市申請版本（Application Proof）退回並施加 8 週暫停期？","options":[{"value":"A","label":"遺漏了發行人辦公室前台行政人員的英文別名"},{"value":"B","label":"遺漏了關連人士提供擔保之重大貸款的關鍵資料，或遺漏了某執行董事曾任職法團被法庭頒令強制清盤及受聯交所紀律處分的紀錄"},{"value":"C","label":"遺漏了公司內部週五便服日的具體執行指引"},{"value":"D","label":"未載明發行人註冊地當地的實時天氣預報"}],"answer":"B","explanation":"指南 2-57 至 2-58 頁 9.43 節明確引述真實退回個案：(a) 遺漏關連人士擔保貸款（涉及利益衝突重大審查）；(b) 遺漏董事曾任董事之公司遭法庭頒令強制清盤及違反上市規則紀錄（直接關乎董事品行誠信）。兩者均屬重大缺陷導致退回。","reference":"HKEX Guide Annex A.21; HKSI Paper 5 Guide Topic 2 Section 9.43"},{"id":"T2-204","topic":"Topic 2","subtopic":"Listing Hearing - 4 Clear Business Days Submission Deadline","difficulty":"Level 2","question":"根據主板第 9.11 條，在上市委員會聆訊日期（Hearing date）前至少四個淨營業日（At least 4 clear business days prior），申請人必須呈交下列哪項關鍵文件？","options":[{"value":"A","label":"上市文件的最後定稿版本（Final proof of the listing document）、已簽署的各項豁免申請、整體協調人費用明細，以及（如適用）中國證監會完成備案通知書"},{"value":"B","label":"上市後首份年度財務報告的完整草案"},{"value":"C","label":"全港零售中籤散戶的身份證號碼名冊"},{"value":"D","label":"香港特區行政長官簽署的推薦信"}],"answer":"A","explanation":"指南 2-58 至 2-59 頁 9.48 節及 MBLR 9.11(18)–(23b) 指明：在聆訊日前至少 4 個淨營業日，必須呈交：上市文件最終定稿、所有正式簽署的豁免申請、整體協調人及中介人費用明細、以及 CSRC 境外上市備案通知書副本（如適用）。","reference":"MBLR 9.11; HKSI Paper 5 Guide Topic 2 Section 9.48"},{"id":"T2-205","topic":"Topic 2","subtopic":"Sponsors Declaration Form E - Timing & Content","difficulty":"Level 2","question":"根據主板上市規則第 9.11(35) 條，保薦人及整體協調人向聯交所呈交《保薦人／整體協調人聲明》（Form E）的法定時限與核心聲明內容為：","options":[{"value":"A","label":"在遞交 Form A1 當日提交，確認公司盈利預測達到 10 億港元"},{"value":"B","label":"在股份買賣開始之前（Before dealings commence）呈交，確認承配人／獲配發人數目、簿記建檔程序已按配售指引妥為執行，且上市規則獲全面遵守"},{"value":"C","label":"在上市敲鑼滿 1 年後呈交"},{"value":"D","label":"在招股章程發行前 3 個月呈交"}],"answer":"B","explanation":"指南 2-60 頁 9.52 節及 MBLR 9.11(35)–(39) 規定：在股份開始買賣前，各保薦人及整體協調人必須呈交 Form E，申報承配人與獲配人人數、獲配證券數額，整體協調人確認已執行建檔並符合配售指引，保薦人確認規則已獲遵從。","reference":"MBLR Form E; HKSI Paper 5 Guide Topic 2 Section 9.52"},{"id":"T2-206","topic":"Topic 2","subtopic":"CWUMPO - Prospectus Authorisation Registration at 11 AM","difficulty":"Level 2","question":"根據主板上市規則第 9.11(33) 條，若上市文件同時構成 CWUMPO 下的公開招股章程，發行人必須在擬定授權註冊招股章程當天的何時之前，將正式簽署的章程及授權申請呈送聯交所？","options":[{"value":"A","label":"當天下午 5 時正"},{"value":"B","label":"不得遲於當天上午 11 時正（Not later than 11:00 am on the intended date of authorisation）"},{"value":"C","label":"當天午夜 12 時正"},{"value":"D","label":"在前一個月最後一個營業日"}],"answer":"B","explanation":"指南 2-59 至 2-60 頁 9.51 節及 MBLR 9.11(33) 指明：若上市文件構成招股章程，必須在擬授權註冊當日上午 11:00 前，向聯交所送交：授權註冊申請、兩份經妥為簽署的招股章程，以及翻譯員與保薦人出具的翻譯無誤與勝任證書。","reference":"MBLR 9.11(33); HKSI Paper 5 Guide Topic 2 Section 9.51"},{"id":"T2-207","topic":"Topic 2","subtopic":"Prospectus Translation Certificate - Sponsor Duty","difficulty":"Level 2","question":"根據主板第 9.11(33)(b) 條，在就招股章程中文或英文譯本辦理註冊手續時，保薦人負有何種法定認證職責？","options":[{"value":"A","label":"保薦人負責全權逐字手寫翻譯整本章程"},{"value":"B","label":"保薦人必須出具證書，證明該翻譯員具備相應的翻譯勝任能力（Certificate issued by the sponsor that the translator is competent），並附帶翻譯員確認翻譯真實正確的證書"},{"value":"C","label":"保薦人無須出具任何證明，全憑公證處裁定"},{"value":"D","label":"保薦人須保證譯本絕無任何標點符號瑕疵"}],"answer":"B","explanation":"指南 2-60 頁 9.51(c) 節及 MBLR 9.11(33) 規定：呈交章程譯本時，除翻譯員出具核證無誤的證明外，保薦人亦必須出具證書，確認該翻譯員具備勝任能力（Translator is competent）。","reference":"MBLR 9.11(33); HKSI Paper 5 Guide Topic 2 Section 9.51(c)"},{"id":"T2-208","topic":"Topic 2","subtopic":"Listing Documents - General Overriding Disclosure Principle (SMLR)","difficulty":"Level 2","question":"根據《證券及期貨（股票市場上市）規則》（SMLR）及主板第 11 章，貫穿上市文件編制的核心「凌駕性披露原則」（Overriding principle）是：","options":[{"value":"A","label":"上市文件字數必須嚴格控制在 100 頁以內"},{"value":"B","label":"上市文件必須載有一切必需的詳細資料及詳情，使有意投資者能在掌握充分資訊的情況下，就發行人及其尋求上市的證券作出知情評估（Informed assessment）"},{"value":"C","label":"上市文件只需載列過去五年的利潤表即可"},{"value":"D","label":"上市文件必須承諾向投資者全額保本"}],"answer":"B","explanation":"指南 2-60 至 2-61 頁 9.59 節及 SMLR 第 3 條明文指明：凌駕性原則要求上市申請文件必須包含能讓投資者就發行人資產負債、經營狀況、利潤前景及證券權利作出充分知情評估（Informed decision/assessment）的一切必要資料。","reference":"SMLR s.3; MBLR 11.07; HKSI Paper 5 Guide Topic 2 Section 9.59"},{"id":"T2-209","topic":"Topic 2","subtopic":"Listing Documents - Appendix D1A vs Appendix D1B","difficulty":"Level 1","question":"根據主板上市規則第 11 章，規範「新上市申請人」（New applicant）與「已上市發行人」（Existing issuer）刊發上市文件內容要求的附錄分別為：","options":[{"value":"A","label":"新申請人適用附錄 C1；已上市發行人適用附錄 C2"},{"value":"B","label":"新申請人適用附錄 D1A（Appendix D1A）；已上市發行人適用附錄 D1B（Appendix D1B）"},{"value":"C","label":"新申請人適用附錄 F1；已上市發行人適用附錄 F2"},{"value":"D","label":"兩者均適用同一份附錄 A1"}],"answer":"B","explanation":"指南 2-60 頁 9.57 節及 MBLR 第 11 章指明：新申請人的上市文件內容具體要求載於附錄 D1A；而現有已上市發行人（如後續供股或公開發售）的上市文件內容要求則載於附錄 D1B。","reference":"MBLR Appendices D1A, D1B; HKSI Paper 5 Guide Topic 2 Section 9.57"},{"id":"T2-210","topic":"Topic 2","subtopic":"Formal Notice Publication (MBLR 12.04)","difficulty":"Level 2","question":"根據主板上市規則第 12 章，新申請人在公開發售或配售新股時刊發的「正式通告」（Formal Notice），其刊發時限與審閱要求為：","options":[{"value":"A","label":"在上市掛牌滿一週後發布"},{"value":"B","label":"必須在上市文件刊發當日（Date of issue of the listing document）在聯交所及發行人網站刊登，且在聯交所完成審閱前嚴禁擅自發布"},{"value":"C","label":"可在任何時間隨意刊發，無須經聯交所審閱"},{"value":"D","label":"僅需在香港郵政局大堂張貼紙本通告"}],"answer":"B","explanation":"指南 2-61 頁 9.63 節及 MBLR 12.02–12.04 指明：正式通告須於上市文件發行之日在發行人網站及聯交所披露易發布；且在聯交所審閱同意前，不得擅自刊登任何正式通告。","reference":"MBLR 12.02, 12.04; HKSI Paper 5 Guide Topic 2 Section 9.63"},{"id":"T2-211","topic":"Topic 2","subtopic":"Exchange Discretion to Publish Information (MBLR 13.08)","difficulty":"Level 2","question":"根據主板上市規則第 13.08 條，為維持高水平的市場透明度，聯交所有權要求上市發行人刊發特定資料。若發行人無正當理由拒絕遵從該要求，聯交所獲授權採取何種直接行動？","options":[{"value":"A","label":"聯交所可自行直接將該資料向市場公開發布（The SEHK may publish the information itself）"},{"value":"B","label":"聯交所必須向國際法庭提起跨國仲裁"},{"value":"C","label":"聯交所只能保持沉默，無任何干預權力"},{"value":"D","label":"聯交所必須強制買入發行人 10% 的股票"}],"answer":"A","explanation":"指南 2-62 頁 9.67 節及 MBLR 13.08 指明：聯交所可要求發行人刊登進一步資料；若發行人未有遵從，聯交所可在聽取其陳述後，自行將該項資料向市場公佈，以防止市場資訊受阻。","reference":"MBLR 13.08; HKSI Paper 5 Guide Topic 2 Section 9.67"},{"id":"T2-212","topic":"Topic 2","subtopic":"Connected Persons - 30% Controlled Company Definition","difficulty":"Level 3","question":"在界定關連人士的「緊密聯繫人」（Close Associate）時，根據《上市規則》第 14A.12 條，由關連人士個人直接或間接控制多少表決權的法團，會被界定為「受控公司」（Controlled Company）從而構成關連人士？","options":[{"value":"A","label":"控制 5% 或以上表決權的公司"},{"value":"B","label":"控制 30% 或以上表決權的公司（30%-controlled company），或有權控制董事會過半數組成的公司及其附屬公司"},{"value":"C","label":"必須為 100% 全資持股的公司"},{"value":"D","label":"持有 1 股優先股的公司"}],"answer":"B","explanation":"指南 2-48 頁 11.27 節註釋 1 及 MBLR 14A.12(1)(c) 指明：受控公司（Controlled company）是指由該個人單獨或連同其家屬有權在股東大會行使或控制行使 30% 或以上投票權，或控制董事會組成過半數的公司及其下屬附屬公司。","reference":"MBLR 14A.12; HKSI Paper 5 Guide Topic 2 Section 11.27 Note 1"},{"id":"T2-213","topic":"Topic 2","subtopic":"Connected Transactions - Definition of Transaction","difficulty":"Level 2","question":"根據《上市規則》第 14A.24 條，下列哪項商業安排明確屬於受第 14A 章規管的「關連交易」（Connected Transaction）範疇？","options":[{"value":"A","label":"上市發行人自關連人士處購買或出售任何資產（無論是否屬於資本性資產）"},{"value":"B","label":"發行人與關連人士訂立租賃合約、合營企業安排或提供財務資助"},{"value":"C","label":"發行人向關連人士發行新證券或轉讓庫存股份"},{"value":"D","label":"以上全部各項均屬於受規管的關連交易"}],"answer":"D","explanation":"依據 MBLR 14A.24 及指南 2-47 頁 11.25 節：關連交易的範圍極廣，包括購買/出售資產、租賃物業、提供/接受服務、設立合營、提供/獲取財務資助、以及發行新證券或庫存股份予關連人士等。","reference":"MBLR 14A.24; HKSI Paper 5 Guide Topic 2 Section 11.25"},{"id":"T2-214","topic":"Topic 2","subtopic":"Connected Transactions - Qualified Property Acquisition Exemption","difficulty":"Level 2","question":"根據主板第 14.33A 條及第 14A.101 條，合資格地產發行人（Qualified Issuer）在特定政府土地招標或拍賣中進行的「合資格物業收購」（Qualified Property Acquisition），可享有何種上市規則豁免？","options":[{"value":"A","label":"可免除遵守第 14 章須予公布交易及第 14A 章部分關連交易的股東大會批准要求（以公告及通函申報替代）"},{"value":"B","label":"完全免繳土地出讓金"},{"value":"C","label":"自動將所購土地列為永久免稅物業"},{"value":"D","label":"免除編制經審計年度財務報表"}],"answer":"A","explanation":"指南 2-49 頁 11.32 節及 MBLR 14.33A–14.33B 指出：合資格發行人參與政府土地競投或合營投標等合格物業收購，可享有豁免股東批准等特定監管便利，以配合房地產行業快速競標投地的商業常規。","reference":"MBLR 14.33A, 14.33B; HKSI Paper 5 Guide Topic 2 Section 11.32"},{"id":"T2-215","topic":"Topic 2","subtopic":"Reverse Takeovers - De Facto Control Change Indicator","difficulty":"Level 3","question":"在聯交所依據原則驗證法審查反收購（RTO）時，關於「控制權變更」（Change in control），下列哪種情況即使未涉及單一股東持股突破 30%，仍可能被聯交所判定為存在「事實上的控制權變更」（De facto control change）？","options":[{"value":"A","label":"發行人更換了辦公室接待員"},{"value":"B","label":"單一大股東將其股權轉讓予新投資者，新投資者雖僅持有 25% 股權，但獲賦權全面撤換董事會過半數成員並更換行政總裁及核心管理團隊"},{"value":"C","label":"全體獨立非執行董事連任屆滿 3 年"},{"value":"D","label":"發行人發行了為期 3 個月的商業匯票"}],"answer":"B","explanation":"指南 2-45 頁 11.17(e) 節註釋指明：控制權變動不限於《收購守則》下的 30% 法定門檻，聯交所會考量事實上的控制權變更（De facto control），包括單一大股東轉移、董事會組成實質換血、或核心最高行政管理權移交。","reference":"MBLR 14.06B; HKSI Paper 5 Guide Topic 2 Section 11.17 Note"},{"id":"T2-216","topic":"Topic 2","subtopic":"Reverse Takeovers - Reversal of Burden of Proof on Extreme Transactions","difficulty":"Level 3","question":"上市發行人若主張將一項符合反收購特徵的重大交易降級分類為「極端交易」（Extreme Transaction），其法定「舉證責任」（Burden of proof）承擔主體為：","options":[{"value":"A","label":"聯交所上市委員會負有全部舉證責任證明其不是借殼"},{"value":"B","label":"發行人自身負有舉證責任（The issuer must demonstrate that the transaction was not an attempt to circumvent），證明其無意規避新上市規定並符合長期控制與業務龐大之標準"},{"value":"C","label":"由散戶股東大會自行推舉代表舉證"},{"value":"D","label":"由公司外部印刷商代為舉證"}],"answer":"B","explanation":"指南 2-45 頁 11.19 節明確指明：尋求將 RTO 重新歸類為極端交易時，發行人自身必須向聯交所舉證證明（Demonstrate）該交易並非意圖規避新上市標準，並滿足同一控制至少 36 個月及業務具備龐大規模（收益/資產逾 10 億）的硬性標準。","reference":"MBLR 14.06C; HKSI Paper 5 Guide Topic 2 Section 11.19"},{"id":"T2-217","topic":"Topic 2","subtopic":"Notifiable Transactions - Equity Capital Ratio Calculation","difficulty":"Level 2","question":"根據《上市規則》第 14.07(5) 條，在須予公布交易的五大比率中，「股本比率」（Equity capital ratio）的分子與分母分別為：","options":[{"value":"A","label":"發行人的淨資產除以總負債"},{"value":"B","label":"發行人作為代價而發行／轉讓的股份及庫存股數目，除以緊接交易前發行人已發行股份總數（不含庫存股）"},{"value":"C","label":"控股股東名下持股數目除以公眾持股數目"},{"value":"D","label":"新股發行價除以每股面值"}],"answer":"B","explanation":"指南 2-41 頁 11.7 節及 MBLR 14.07(5) 規定：股本比率計算方式為：作為對價發行或由庫存轉讓的股份數目，除以緊接該項交易前發行人已發行股份總數（不計庫存股份）。","reference":"MBLR 14.07(5); HKSI Paper 5 Guide Topic 2 Section 11.7"},{"id":"T2-218","topic":"Topic 2","subtopic":"Trading Halt - Duration Exceeding Two Trading Days","difficulty":"Level 1","question":"根據主板第 6.02 條，上市發行人申請的「短暫停牌」（Trading Halt）若因編制公告耗時等原因持續超過了兩個交易日，該狀態將在法規程序上：","options":[{"value":"A","label":"自動解除並強制於第三天開市前復牌"},{"value":"B","label":"自動轉為正式的「停牌」（Automatically become a trading suspension）"},{"value":"C","label":"發行人董事自動喪失董事資格"},{"value":"D","label":"發行人被即時罰款 1,000 萬港元"}],"answer":"B","explanation":"指南 2-50 頁 12.2 節指明：短暫停牌是預期不超過兩個交易日的交易中斷；若短暫停牌時間超過兩個交易日，該交易中斷將自動轉換為正式「停牌」（Trading suspension）。","reference":"MBLR 6.02; HKSI Paper 5 Guide Topic 2 Section 12.2"},{"id":"T2-219","topic":"Topic 2","subtopic":"Cancellation of Listing - Remedial Period Specification","difficulty":"Level 2","question":"根據主板上市規則第 6.01A 條及第 6.10 條，當聯交所考慮取消某發行人的上市地位時（除連續停牌 18 個月自動觸發外），聯交所通常採取的程序步驟是：","options":[{"value":"A","label":"在 5 分鐘內切斷該公司所有交易系統終端"},{"value":"B","label":"透過發布公告指明發行人必須補正的具體事項（Matters required to be remedied），並訂明發行人必須採取補救行動的期限，屆滿未能達標方正式除牌"},{"value":"C","label":"強制將公司所有資產拍賣並分派予聯交所職員"},{"value":"D","label":"命令發行人遷出香港"}],"answer":"B","explanation":"指南 2-52 頁 12.13 節及 MBLR 6.10 指明：聯交所在考慮除牌時，通常會發布公告訂明發行人必須糾正的問題及具體期限（Remedial period）；若發行人在指定期限內未能完成補救，聯交所將正式發出取消上市地位通告。","reference":"MBLR 6.10; HKSI Paper 5 Guide Topic 2 Section 12.13"},{"id":"T2-220","topic":"Topic 2","subtopic":"Disciplinary Sanctions - Prejudice to Investors Statement","difficulty":"Level 2","question":"根據主板第 2A.10(c) 條，上市委員會在對違規個人施加處分時，若認為某現任或前任董事／高管的留任會損害市場，上市委員會有權發出的公開制裁聲明為：","options":[{"value":"A","label":"公開聲明該個人已被判處終身監禁"},{"value":"B","label":"發表公開聲明，指該身為發行人或其附屬公司董事或高級管理層的個人，「可能會損害投資者的利益」（May cause prejudice to the interests of investors）"},{"value":"C","label":"命令該個人的銀行賬戶對全體公眾公開"},{"value":"D","label":"沒收該個人的全部護照與旅行證件"}],"answer":"B","explanation":"指南 2-56 頁 13.4(c) 節及 MBLR 2A.10(b) 指明：聯交所可公開發表聲明，指出某董事或高級管理層個人的留任或行為可能會損害投資者利益（Prejudice to the interests of investors），作為嚴重公開制裁手段。","reference":"MBLR 2A.10; HKSI Paper 5 Guide Topic 2 Section 13.4(c)"},{"id":"T2-221","topic":"Topic 2","subtopic":"GEM Listing Division Powers - Discharge by Listing Committee","difficulty":"Level 1","question":"根據 GEM 上市規則第 3 章，香港聯交所董事會就 GEM 板塊上市事宜的所有法定權力與職能，已正式授權由下列哪一個專責架構行使？","options":[{"value":"A","label":"全權由香港警務處商業罪案調查科行使"},{"value":"B","label":"由 GEM 上市委員會（GEM Listing Committee）及／或其轉授權的上市科（Listing Division）及聯交所行政總裁行使"},{"value":"C","label":"由全港註冊會計師公會理事會行使"},{"value":"D","label":"由各上市公司獨立董事組成的互助協會行使"}],"answer":"B","explanation":"指南 2-6 頁 2.1 節及 GLR 3.01–3.02 指明：聯交所董事會已將 GEM 上市事宜的所有權力轉授予 GEM 上市委員會；該委員會再將日常管理職能轉授予上市科及聯交所行政總裁執行。","reference":"GLR 3.01, 3.02; HKSI Paper 5 Guide Topic 2 Section 2.1"},{"id":"T2-222","topic":"Topic 2","subtopic":"GEM Financial Reports Publication Deadlines","difficulty":"Level 2","question":"根據 GEM 上市規則第 18 章，GEM 上市發行人在刊發經審計年度報告及半年度中期報告時，其法定完成時限分別為：","options":[{"value":"A","label":"年報：財年結束後 1 個月內；中期報告：半年度結束後 2 週內"},{"value":"B","label":"年報：於財政年度結束後四個月內；中期報告：於財政年度前六個月結束後三個月內刊發（Annual report within 4 months; Interim report within 3 months）"},{"value":"C","label":"年報：於財年結束後 6 個月內；中期報告：於半年度結束後 5 個月內"},{"value":"D","label":"GEM 發行人完全無須刊發中期報告"}],"answer":"B","explanation":"指南 2-5 頁 1.5(b) 節註釋及 GLR Chapter 18 明確規定：GEM 發行人必須在財政年度結束後 4 個月內刊發年報，並在財政年度上半年結束後 3 個月內刊發中期報告。","reference":"GLR Chapter 18; HKSI Paper 5 Guide Topic 2 Section 1.5(b) Note"},{"id":"T2-223","topic":"Topic 2","subtopic":"GEM Statement of Business Objectives","difficulty":"Level 2","question":"根據 GEM 上市規則第 11.15 條，新申請人在 GEM 首次刊發的上市文件中，在業務規劃披露層面必須載有下列哪項專項內容？","options":[{"value":"A","label":"未來 20 年的每季固定派息承諾表"},{"value":"B","label":"詳細的「業務目標聲明」（Statement of business objectives），詳述其業務目標及上市後兩個財政年度內的落實進度計劃"},{"value":"C","label":"全體創辦人私人資產保證金收據"},{"value":"D","label":"保證首日股價不跌的書面承諾"}],"answer":"B","explanation":"指南 2-4 頁 1.5(a) 節及 GLR 11.15 指明：GEM 新申請人必須在上市文件中列載詳盡的業務目標聲明（Statement of business objectives），詳細分析其商業規劃及集資款項推進時間表。","reference":"GLR 11.15; HKSI Paper 5 Guide Topic 2 Section 1.5(a)"},{"id":"T2-224","topic":"Topic 2","subtopic":"Partly Paid Shares - Main Board vs GEM","difficulty":"Level 2","question":"關於未繳足股款股份（Partly paid shares）在聯交所的掛牌上市資格，主板與 GEM 規則的規定為：","options":[{"value":"A","label":"GEM 允許未繳足股份上市，主板嚴格禁止"},{"value":"B","label":"主板在特定條件下（轉讓不受無理限制且交易能在公開正常基礎下進行）可准許未繳足股份上市；但 GEM 規則嚴格禁止未繳足股款股份上市"},{"value":"C","label":"主板及 GEM 均全面強制所有股份必須以未繳足形式發行"},{"value":"D","label":"未繳足股份只能在香港金銀業貿易場上市"}],"answer":"B","explanation":"指南 2-47 頁 9.4(a) 節註釋及 MBLR 8.13、GLR 11.27 指明：主板可接納未繳足股份上市（前提是轉讓不受限且市場交易公開），而 GEM 規則則明確禁止未繳足股款的股份上市。","reference":"MBLR 8.13; GLR 11.27; HKSI Paper 5 Guide Topic 2 Section 9.4(a) Note"},{"id":"T2-225","topic":"Topic 2","subtopic":"GEM Transfer - Volume Weighted Average Market Capitalisation","difficulty":"Level 3","question":"在合資格 GEM 發行人依據第 9B 章申請簡化轉往主板上市時，其在市值維度上必須符合的具體標準是：","options":[{"value":"A","label":"在遞交申請當日收市時市值達到 1,000 萬港元即可"},{"value":"B","label":"在指定參考期內滿足聯交所規定的「成交量加權平均市值」（Volume weighted average market capitalisation）要求，以反映其二級市場具備真實主板體量"},{"value":"C","label":"市值必須超過 500 億港元"},{"value":"D","label":"無須任何市值標準，僅看淨利潤"}],"answer":"B","explanation":"指南 2-43 頁 8.36(b) 節及 MBLR Chapter 9B 規定：簡化轉板發行人的市值必須在整個參考期內符合聯交所制定的成交量加權平均市值（VWAM）要求，杜絕股價虛假炒作造成的單日達標。","reference":"MBLR Chapter 9B; HKSI Paper 5 Guide Topic 2 Section 8.36(b)"},{"id":"T2-226","topic":"Topic 2","subtopic":"GEM Transfer - Working Capital Confirmation","difficulty":"Level 2","question":"GEM 發行人申請簡化轉移至主板上市時，必須隨申請遞交由其財務顧問或核數師經審慎周詳考慮後出具的何種書面確認？","options":[{"value":"A","label":"確認發行人的營運資金（Working capital）足以應付目前及自轉板公告刊發之日起至少 12 個月所需"},{"value":"B","label":"確認發行人全體董事已放棄收取任何薪酬"},{"value":"C","label":"確認發行人不再從事任何商業業務"},{"value":"D","label":"確認發行人獲得了全體 GEM 投資者的口頭表決贊成"}],"answer":"A","explanation":"指南 2-44 頁 8.38 節及 MBLR Chapter 9B 指明：簡化轉板申請必須提交由財務顧問或核數師出具的書面確認函，證實發行人的營運資金充裕，足以應付現時及自公告刊發起 12 個月所需。","reference":"MBLR Chapter 9B; HKSI Paper 5 Guide Topic 2 Section 8.38"},{"id":"T2-227","topic":"Topic 2","subtopic":"GEM Transfer - Announcement Timetable","difficulty":"Level 2","question":"根據主板第 9B 章，GEM 發行人接獲聯交所就其簡化轉板申請發出的原則性正式批准後，其刊發轉板公告的時限要求為：","options":[{"value":"A","label":"在主板開始買賣滿一個月後發布"},{"value":"B","label":"在收到原則性批准後不遲於 1 個營業日內發布公告，且該公告必須在預期股份於主板開始買賣之日前至少 5 個淨營業日刊發"},{"value":"C","label":"在股東週年大會當天早晨發布"},{"value":"D","label":"公告刊發時間由經紀商自行斟酌"}],"answer":"B","explanation":"指南 2-44 頁 8.39 節及 MBLR Chapter 9B 規定：發行人接獲正式原則性批准後，須在不遲於 1 個營業日內發布公告；且該公告必須在主板開始交易前至少 5 個淨營業日（At least 5 clear business days）刊發。","reference":"MBLR Chapter 9B; HKSI Paper 5 Guide Topic 2 Section 8.39"},{"id":"T2-228","topic":"Topic 2","subtopic":"GEM Post-Listing Compliance Adviser Period","difficulty":"Level 2","question":"對於在 GEM 板塊新上市的發行人，其必須委聘合規顧問（Compliance Adviser）的法定強制期限為：","options":[{"value":"A","label":"上市後滿 3 個月為止"},{"value":"B","label":"至少持續至發行人刊發其上市後「第二個完整財政年度」（Second full financial year）的財務業績之日為止"},{"value":"C","label":"僅持續至上市後首份季度業績公布為止"},{"value":"D","label":"GEM 發行人完全無須委任合規顧問"}],"answer":"B","explanation":"GLR 6A.19 及監管指引指明：與主板（首個完整財年）不同，GEM 發行人的市場風險較高，其合規顧問的委任期必須至少持續至刊發上市後「第二個完整財政年度」（Second full financial year）之日為止。","reference":"GLR 6A.19; HKSI Paper 5 Guide Topic 2 Section 3.15"},{"id":"T2-229","topic":"Topic 2","subtopic":"PRC Issuers - Articles Quorum & Voting Appendix D1A Requirements","difficulty":"Level 2","question":"根據主板附錄 D1A 第 54 至 65 段的補充條款，中國內地註冊成立的 H 股發行人，其上市文件招股章程中必須特別詳盡載有下列哪項專門資訊？","options":[{"value":"A","label":"全體中國內地員工的戶籍證明"},{"value":"B","label":"中國證監會（CSRC）批准／備案狀況、股東大會法定開會人數（Quorum）及表決要求、適用稅率，以及是否有充足外匯派付 H 股預期股息及清償到期外債"},{"value":"C","label":"發行人所有內地工廠的電力線路分佈圖"},{"value":"D","label":"保證 H 股股價與 A 股股價完全相等的法律意見書"}],"answer":"B","explanation":"指南 2-30 頁 6.11 節及 MBLR Appendix D1A paras 54–65 列明：H 股上市文件必須專項披露：CSRC 備案核准情況、股東大會法定人數與表決機制、稅率、以及外匯充足性（用以支付 H 股外幣股息及清償外債）。","reference":"MBLR Appendix D1A; HKSI Paper 5 Guide Topic 2 Section 6.11"},{"id":"T2-230","topic":"Topic 2","subtopic":"PRC Issuers - Directors Fiduciary Duties to Conform with PRC Laws","difficulty":"Level 2","question":"根據主板上市規則第 3.09B 條，H 股上市公司董事除遵守香港法律與上市規則外，在履職過程中還負有何種特定法定義務？","options":[{"value":"A","label":"必須在香港法院提存 100 萬美元作為履職保證金"},{"value":"B","label":"必須遵守並盡最大努力確保發行人遵守中國內地現行有關境內外公眾公司管理、運作及規管的各項法律、法規及規範性文件"},{"value":"C","label":"嚴禁持有任何香港上市公司股票"},{"value":"D","label":"每週必須向香港中聯辦匯報工作"}],"answer":"B","explanation":"指南 2-29 頁 6.4 節及 MBLR 3.09B 指明：H 股發行人董事必須遵守並促使發行人遵守中國內地有關公眾公司管治、營運及規管的一切適用法律、法規及規範性文件；若接獲違規行政通知，須即時書面知會聯交所。","reference":"MBLR 3.09B; HKSI Paper 5 Guide Topic 2 Section 6.4"},{"id":"T2-231","topic":"Topic 2","subtopic":"Accountants Report - Latest Financial Period Staleness (6 Months Rule)","difficulty":"Level 2","question":"根據主板第 8.06 條（GLR 11.11 條），新上市申請人的申報會計師報告所匯報的最近一個財務期結束日，距離上市文件刊發之日：","options":[{"value":"A","label":"不得超過 1 個月"},{"value":"B","label":"不得超過六個月（Must not have ended more than six months before the date of the listing document）"},{"value":"C","label":"不得超過 12 個月"},{"value":"D","label":"無時間限制，十年前的財務數據亦可"}],"answer":"B","explanation":"指南 2-46 頁 9.2 節及 MBLR 8.06（GLR 11.11）指明：會計師報告所載最近期財務報表結束日，距上市文件刊發日不得超過 6 個月，以防財務數據過期失效（Staleness）。","reference":"MBLR 8.06; GLR 11.11; HKSI Paper 5 Guide Topic 2 Section 9.2"},{"id":"T2-232","topic":"Topic 2","subtopic":"Share Registrar in Hong Kong","difficulty":"Level 1","question":"根據主板第 8.16 條及 GEM 第 11.08 條，新上市發行人必須委聘何種機構以在香港妥為備存其股東名冊？","options":[{"value":"A","label":"香港警務處警員"},{"value":"B","label":"獲認可的股份過戶登記處（An approved share registrar to maintain its register of members in Hong Kong）"},{"value":"C","label":"任何香港註冊的旅行社"},{"value":"D","label":"全體獨立董事輪流親自擔任"}],"answer":"B","explanation":"指南 2-46 頁 9.2 節及 MBLR 8.16（GLR 11.08）指明：發行人必須聘用獲核准的香港股份過戶登記處（Approved share registrar）在香港維持其股東名冊，以確保股份過戶及過戶登記順暢合法。","reference":"MBLR 8.16; GLR 11.08; HKSI Paper 5 Guide Topic 2 Section 9.2"},{"id":"T2-233","topic":"Topic 2","subtopic":"Open Market Requirements - Public Subscription Tranche Sizing","difficulty":"Level 2","question":"根據主板《第 18 項應用指引》及 GEM《第 6 項應用指引》，新股發售若同時採用配售與公開發售架構，其公開認購檔份（Public subscription tranche）的基準規模規定為：","options":[{"value":"A","label":"公開認購檔份一律強制為 100%"},{"value":"B","label":"公開認購檔份必須至少佔發售股份的 5%（且須受回撥機制規限），或至少佔發售股份的 10%（但此情況下不設回撥機制）"},{"value":"C","label":"公開認購檔份可為 0%"},{"value":"D","label":"公開認購檔份必須嚴格固定為 50%"}],"answer":"B","explanation":"指南 2-48 頁 9.4(h) 節及 MBLR PN18、GLR PN6 規定：發售若結合配售與公開認購，公開發售檔份必須為：(i) 不得少於發售股份總數的 5% 並受制於回撥機制；或 (ii) 佔發售股份總數的 10% 且無回撥機制。","reference":"MBLR Practice Note 18; GLR Practice Note 6; HKSI Paper 5 Guide Topic 2 Section 9.4(h)"},{"id":"T2-234","topic":"Topic 2","subtopic":"Treasury Shares - Resale Pricing vs General Mandate","difficulty":"Level 2","question":"上市發行人若依據一般性授權向二級市場出售庫存股份（Treasury shares），該出售在定價折讓幅度上受到何種上市規則限制？","options":[{"value":"A","label":"出售庫存股可以按市價一折進行拋售"},{"value":"B","label":"其出售價較基準價的折讓幅度不得超過 20%（Discount of not more than 20% to benchmarked price），適用與增發新股相同的 20% 折讓上限規限"},{"value":"C","label":"出售價必須嚴格按每股淨資產原價出售"},{"value":"D","label":"完全無任何價格規限"}],"answer":"B","explanation":"指南 2-26 頁 5.9 節及 MBLR 10.06A 指出：出售庫存股份等同於發售新股，依據一般性授權出售庫存股份時，其最高折讓幅度嚴格受限於《上市規則》第 13.36(5) 條的 20% 折讓上限標準。","reference":"MBLR 10.06A, 13.36(5); HKSI Paper 5 Guide Topic 2 Section 5.9"},{"id":"T2-235","topic":"Topic 2","subtopic":"Treasury Shares - Monthly Breakdown in Annual Report","difficulty":"Level 2","question":"根據主板第 10.06B 條，上市發行人在其刊發的年報中，就該財政年度內進行的所有庫存股份出售活動，必須披露下列哪項專門資訊？","options":[{"value":"A","label":"全體買方的香港身份證號碼"},{"value":"B","label":"按月細分的庫存股份出售記錄（Monthly breakdown），包括出售股數、售價、最高及最低價、籌集資金總額、所得款項用途以及董事出售庫存股的理由"},{"value":"C","label":"全體員工股票購買意願問卷"},{"value":"D","label":"發行人在開曼群島的銀行對賬單原件"}],"answer":"B","explanation":"指南 2-26 頁 5.12 節及 MBLR 10.06B 明文規定：發行人年報必須載有按月細分的庫存股份出售明細，披露每月出售數量、價格區間、募集總額、資金用途，以及董事會進行該等出售的具體商業理由。","reference":"MBLR 10.06B; HKSI Paper 5 Guide Topic 2 Section 5.12"},{"id":"T2-236","topic":"Topic 2","subtopic":"Capital Reduction - Court Confirmed Procedure","difficulty":"Level 2","question":"香港註冊成立的上市公司若不採用無須法院認可的減資程序，而選擇採用由香港高等法院確認的減資程序（Court-confirmed procedure），其法定核心程序為：","options":[{"value":"A","label":"只需由行政總裁個人簽署命令"},{"value":"B","label":"通過股東特別決議案，並向高等法院原訟法庭申請頒令確認減資，法庭將嚴格審查債權人保護安排，以防股東私自分派資本損害債權人"},{"value":"C","label":"由證監會全權頒發減資許可，法院無權過問"},{"value":"D","label":"全體債權人必須強制轉為無表決權股東"}],"answer":"B","explanation":"指南 2-27 頁 5.14–5.16 節及《公司條例》ss. 211, 226–232 指明：經法院確認之減資程序由股東特別決議案通過後提呈法院，法庭審查重點在於確保債權人已獲償付、獲提供保證或已同意，防止損害債權人權益。","reference":"Companies Ordinance ss. 211, 226; HKSI Paper 5 Guide Topic 2 Section 5.14-5.16"},{"id":"T2-237","topic":"Topic 2","subtopic":"Variations in Shareholders Rights (MBLR 13.51(3))","difficulty":"Level 2","question":"根據主板第 13.51(3) 條及《公司條例》，上市發行人若擬更改某類別股份所附帶的權利（Variation of shareholders' rights），發行人必須：","options":[{"value":"A","label":"只需由公司秘書口頭通知交易所"},{"value":"B","label":"遵守《上市規則》第 13.51 條並及時刊登公告，且必須符合其註冊地公司法及章程細則規定的類別股東大會特別批准程序"},{"value":"C","label":"強制將該類別股份無償沒收"},{"value":"D","label":"將所有變更交由香港立法會表決"}],"answer":"B","explanation":"指南 2-27 頁 5.18 節及 MBLR 13.51(3) 指明：更改股東權利必須遵守《上市規則》並即時發布公告，且必須嚴格依循註冊成立地的法律及章程細則（香港公司適用 Cap. 622，通常須受影響類別股東 75% 特別多數批准）。","reference":"MBLR 13.51(3); HKSI Paper 5 Guide Topic 2 Section 5.18"},{"id":"T2-238","topic":"Topic 2","subtopic":"Scheme of Arrangement - Amalgamations prior to Listing","difficulty":"Level 2","question":"在擬上市公司進行上市前資本重組時，根據《公司條例》第 668 至 677 條，發行人常採納「協議安排」（Scheme of Arrangement）進行合併與重組。此類安排必須取得何種司法核准方可生效？","options":[{"value":"A","label":"必須獲得香港高等法院的正式頒令批准（Sanctioned by the court）"},{"value":"B","label":"只需由保薦人內部法務總監簽字"},{"value":"C","label":"僅需在香港警務處備案"},{"value":"D","label":"無須任何官方批准，公司自行登報即生效"}],"answer":"A","explanation":"指南 2-35 頁 7.33 節及《公司條例》ss. 668–677 指明：涉及公司合併、股本重組或業務轉移的協議安排（Scheme of arrangement），除須符合法定股東/債權人投票門檻外，依法必須獲得法院正式認可批准（Sanctioned by the court）。","reference":"Companies Ordinance ss. 668-677; HKSI Paper 5 Guide Topic 2 Section 7.33"},{"id":"T2-239","topic":"Topic 2","subtopic":"Application Monies Irrevocability Period (5 Days)","difficulty":"Level 2","question":"根據 CWUMPO 關於招股章程股份認購之法律規定，公眾投資者在遞交認購申請表格後，在認購名單開啟後的幾天內，該項申請依法是「不可撤回的」（Generally not revocable）？","options":[{"value":"A","label":"在 1 小時之內"},{"value":"B","label":"在認購名單開啟後的第五天屆滿之前不可撤回（不包括公眾假期、週六及週日）"},{"value":"C","label":"直至上市後滿三年為止"},{"value":"D","label":"投資者在任何時候均可隨時隨意單方面撤回申請"}],"answer":"B","explanation":"指南 2-33 頁 7.16 節指明：依據 CWUMPO，依招股章程提出的股份認購申請，在認購名單開啟後的第五天屆滿之前，一般不可撤回（Not revocable until expiration of 5th day after opening of subscription lists；公眾假期及週末不計入）。","reference":"CWUMPO; HKSI Paper 5 Guide Topic 2 Section 7.16"},{"id":"T2-240","topic":"Topic 2","subtopic":"Director Criminal Liability for Prospectus Misstatements","difficulty":"Level 3","question":"根據 CWUMPO 第 40A(1) 條，若招股章程中載有任何重大失實陳述，授權發行該章程的發行人董事若無法證明其具備法定免責抗辯理由，該董事所面臨的刑事法律後果為：","options":[{"value":"A","label":"只需向交易所致送書面道歉信即可免責"},{"value":"B","label":"觸犯嚴重的刑事罪行，一經定罪可被處以巨額罰款及監禁（Fine and imprisonment）"},{"value":"C","label":"自動轉任為公司的無薪行政助理"},{"value":"D","label":"刑事起訴僅適用於公司法人，董事個人絕對豁免"}],"answer":"B","explanation":"指南 2-33 頁 7.17–7.18 節及 CWUMPO s. 40A(1) 規定：凡授權發出載有未獲證實之重大失實陳述招股章程的個人（包括董事），依法構成刑事罪行，面臨監禁及罰款刑事制裁，展現香港法律對招股書真實性的極高要求。","reference":"CWUMPO s.40A(1); HKSI Paper 5 Guide Topic 2 Section 7.17-7.18"},{"id":"T2-241","topic":"Topic 2","subtopic":"SFO Section 107/108 - Inducing Investment Liability","difficulty":"Level 2","question":"根據 SFO 第 107 條（刑事）及第 108 條（民事），任何人在招股章程或公開要約中，藉欺詐或罔顧的失實陳述誘使他人投資，該人將面臨：","options":[{"value":"A","label":"僅限於被聯交所內部紀律處分"},{"value":"B","label":"承擔刑事犯罪處罰，且須對任何因依賴該失實陳述而投資並蒙受金錢損失的人士承擔民事賠償責任"},{"value":"C","label":"完全免除任何民事賠償"},{"value":"D","label":"僅需退還已收取的申請表格工本費"}],"answer":"B","explanation":"指南 2-33 頁 7.19 節及 SFO ss. 107, 108 指出：藉虛假、誤導或欺詐陳述誘使他人投資，受制於 SFO s. 107 刑事檢控，且受害者可依據 SFO s. 108 直接向相關責任人提起民事訴訟追討全部投資損失。","reference":"SFO ss. 107, 108; HKSI Paper 5 Guide Topic 2 Section 7.19"},{"id":"T2-242","topic":"Topic 2","subtopic":"Capital Market Intermediaries - Written Agreement Timing","difficulty":"Level 2","question":"根據《操守準則》第 21 段，上市申請人委聘資本市場中介人（CMI，非整體協調人）進行配售活動時，該 CMI 與發行人之間的書面協議必須在何時落實？","options":[{"value":"A","label":"在股份於二級市場買賣結束後簽訂"},{"value":"B","label":"在該 CMI 正式開展任何建檔或配售活動之前（Prior to conducting any bookbuilding or placing activities）簽訂"},{"value":"C","label":"在上市申請失效時簽署"},{"value":"D","label":"只要有口頭共識，永遠無須簽訂書面協議"}],"answer":"B","explanation":"指南 1-40 頁 4.49 節及 Code of Conduct para 21 明確規定：所有參與建檔配售的資本市場中介人（CMIs），均必須在開展任何配售或簿記活動之前，與發行人訂立正式的書面協議，訂明權責與費用標準。","reference":"Code of Conduct para 21; HKSI Paper 5 Guide Topic 1 Section 4.49"},{"id":"T2-243","topic":"Topic 2","subtopic":"GEM Listing Rules - Quarterly Reporting Removal","difficulty":"Level 1","question":"聯交所優化 GEM 上市規則後，關於 GEM 發行人的季度財務報告（Quarterly reporting）要求，現行監管常規為：","options":[{"value":"A","label":"季度報告仍為強制的法定罪行要求"},{"value":"B","label":"聯交所已取消了 GEM 強制性編制季度財務報表的要求，將其改為建議最佳常規（Recommended best practice），使 GEM 的定期報告框架與主板對齊"},{"value":"C","label":"GEM 發行人每週均必須公布未經審計的週報"},{"value":"D","label":"GEM 發行人全面免除公布年度報告"}],"answer":"B","explanation":"指南 2-5 頁 1.5(b) 節及 GLR 改革指明：為減輕中小企業合規成本，GEM 已廢除強制性季度報告制度，改為建議最佳常規，定期報告現行僅強制要求年度報告（4 個月內）及中期報告（3 個月內）。","reference":"GLR Chapter 18; HKSI Paper 5 Guide Topic 2 Section 1.5(b)"},{"id":"T2-244","topic":"Topic 2","subtopic":"GEM Public Float Sizing Minimum","difficulty":"Level 2","question":"根據 GEM 上市規則第 11.23 條，GEM 發行人在上市時由公眾人士持有的股份市值，最低絕對金額要求為：","options":[{"value":"A","label":"至少 500 萬港元"},{"value":"B","label":"至少 4,500 萬港元（At least HK$45 million，或達到發行人規定的公眾持股比例）"},{"value":"C","label":"至少 2 億港元"},{"value":"D","label":"至少 5 億港元"}],"answer":"B","explanation":"依據 GLR 11.23(7)：GEM 發行人上市時的最低預期市值為 1.5 億港元，按最低 25% 公眾持股比例計算，由公眾人士持有的股份市值在上市時最低不得少於 4,500 萬港元（HK$45 million）。","reference":"GLR 11.23; HKSI Paper 5 Guide Topic 2 Section 9.4"},{"id":"T2-245","topic":"Topic 2","subtopic":"Methods of Listing - Capitalisation Issue Definition","difficulty":"Level 2","question":"根據主板上市規則第 7.17 條，何謂「資本化發行」（Capitalisation Issue）？","options":[{"value":"A","label":"向公眾散戶溢價發行新股以募集巨額現金"},{"value":"B","label":"將發行人的儲備或利潤撥充資本，按現有股東持股比例向其配發全數繳足的證券，且不涉及任何現金付款（如以股代息計劃）"},{"value":"C","label":"大股東將個人自置房產無償贈予公司"},{"value":"D","label":"發行高風險的次級清盤可轉債"}],"answer":"B","explanation":"指南 2-42 頁 8.28 節及 MBLR 7.17 指明：資本化發行（紅股發行/以股代息）是指將公司儲備或利潤轉化為已發行股本，按持股比例向現有股東配發股份，過程中不涉及任何貨幣付款。","reference":"MBLR 7.17; HKSI Paper 5 Guide Topic 2 Section 8.28"},{"id":"T2-246","topic":"Topic 2","subtopic":"Methods of Listing - Consideration Issue Dilution Effect","difficulty":"Level 2","question":"上市發行人採用「代價發行」（Consideration Issue）作為收購目標資產的支付方式，其核心商業與股權影響是：","options":[{"value":"A","label":"發行人必須動用其全部賬面流動現金進行交割"},{"value":"B","label":"發行人無須動用自身現金儲備完成收購，但會導致現有全體股東的持股比例產生稀釋效應（Dilute the holdings of existing shareholders）"},{"value":"C","label":"現有股東自動獲得同等數量的現金補償"},{"value":"D","label":"收購目標資產自動轉為外國國有資產"}],"answer":"B","explanation":"指南 2-42 頁 8.30 節及 MBLR 7.11 指出：代價發行（Consideration issue）是向資產賣方發行新股作為收購代價。其優勢在於節省現金，但不可避免地會擴大股本並稀釋現有股東的每股權益與投票權。","reference":"MBLR 7.11; HKSI Paper 5 Guide Topic 2 Section 8.30"},{"id":"T2-247","topic":"Topic 2","subtopic":"Open Offer - Renounceable Documents Restriction","difficulty":"Level 2","question":"在香港資本市場發行模式中，「公開發售」（Open Offer）與「供股」（Rights Issue）的最關鍵區別在於：","options":[{"value":"A","label":"供股發售對象是公眾散戶，公開發售對象僅為機構投資者"},{"value":"B","label":"供股發給股東的配額屬於可暫定轉讓文件（Renounceable documents，股東可在市場買賣未繳款供股權 nil-paid rights）；而公開發售發給股東的權利為不可轉讓文件（Non-renounceable），未獲認購權限無法在市場轉售"},{"value":"C","label":"公開發售必須由香港金管局擔任承銷商"},{"value":"D","label":"兩者在法律文件與交易權利上完全一模一樣"}],"answer":"B","explanation":"指南 2-40 頁 8.19–8.20 節指明：供股向股東發出暫定配額通知書，可於二級市場買賣供股權（Renounceable）；而公開發售（Open offer）向股東提供的認購權則不具備轉讓文件（Not allocated on renounceable documents），不能在市場出售未繳款權益。","reference":"MBLR 7.18, 7.23; HKSI Paper 5 Guide Topic 2 Section 8.19-8.20"},{"id":"T2-248","topic":"Topic 2","subtopic":"Open Offer - Minimum Offer Period (10 Business Days)","difficulty":"Level 1","question":"根據主板上市規則第 7.25 條，上市發行人進行公開發售（Open offer）時，該要約向現有股東開放接納的法定最短期限為：","options":[{"value":"A","label":"不少於 24 小時"},{"value":"B","label":"不少於十個營業日（Minimum period of ten business days）"},{"value":"C","label":"不少於 60 個曆日"},{"value":"D","label":"開放時間完全由控股股東任意決定"}],"answer":"B","explanation":"指南 2-40 頁 8.22 節及 MBLR 7.25 指明：公開發售的要約接納期必須維持開放至少 10 個營業日（Minimum period of 10 business days）；若發行人海外股東眾多且接納期超過 15 個營業日，須諮詢聯交所。","reference":"MBLR 7.25; HKSI Paper 5 Guide Topic 2 Section 8.22"},{"id":"T2-249","topic":"Topic 2","subtopic":"SEHK Enquiry Response & Timetable Delay (MBLR 9.11)","difficulty":"Level 2","question":"在新上市申請審查過程中，若申請人或其保薦人未能在聯交所訂明的期限內及時回覆聯交所的質詢，聯交所獲授權採取何種處置措施？","options":[{"value":"A","label":"直接批准發行人掛牌上市以節省時間"},{"value":"B","label":"推遲該申請的審理及聆訊時間表（The SEHK may delay the timetable），或將該申請作失效處理"},{"value":"C","label":"向高等法院申請破產令"},{"value":"D","label":"接管保薦人機構的全部資產"}],"answer":"B","explanation":"指南 2-59 頁 9.49 節及 MBLR 9.11 指出：若申請人未能及時回覆查詢，或修訂上市文件定稿無法按期提交，聯交所有權推遲其上市時間表（Delay the timetable），從而打亂其發行發售窗口。","reference":"MBLR 9.11; HKSI Paper 5 Guide Topic 2 Section 9.49"},{"id":"T2-250","topic":"Topic 2","subtopic":"Summary of Topic 2 Roles - Frontline Regulator","difficulty":"Level 1","question":"綜合香港機構融資法規架構，關於香港聯交所（SEHK）在所有上市相關事宜中的首要法律角色，下列陳述何者最準確？","options":[{"value":"A","label":"聯交所是所有在港上市發行人及其上市事宜的前線監管機構（Frontline regulator），行使合約與上市規則權威，並受香港證監會（SFC）的全面監管與監督"},{"value":"B","label":"聯交所是香港唯一的刑事司法審判機關"},{"value":"C","label":"聯交所為所有上市公司股東提供永久無條件資本保本擔保"},{"value":"D","label":"聯交所是直接隸屬於香港警務處的行政執行科"}],"answer":"A","explanation":"指南 1-8 頁 1.26 節及 2-6 頁 2.1 節明確確立了香港上市監管的基本架構：聯交所作為認可交易所，是所有上市事宜與上市發行人的前線監管者（Frontline regulator）；聯交所本身則處於香港證監會（SFC）的監管與法定監督之下。","reference":"SFO s.19; HKSI Paper 5 Guide Topic 1 Section 1.26; Topic 2 Section 2.1"},{"id":"T2-251","topic":"Topic 2","subtopic":"Notifiable Transactions - Dual Acquisition and Disposal Classification","difficulty":"Level 3","question":"某主板上市公司訂立一項綜合資產重組協議，擬出售旗下某項資產（計算出的最高百分比率為 35%，屬主要交易出售），並同時收購一項新業務資產（計算出的最高百分比率為 110%，屬非常重大收購）。根據《上市規則》第 14 章，該項綜合交易在最終合規分類上應：","options":[{"value":"A","label":"分拆為兩項獨立公告，分別按主要交易及非常重大收購各自處理"},{"value":"B","label":"按該交易中收購與出售兩者中「規模較大者」（Larger of the acquisition or disposal）進行整體分類，即按「非常重大收購事項」（VSA）遵循全部合規要求"},{"value":"C","label":"自動相互抵銷，按淨額差額 75% 認定為主要交易"},{"value":"D","label":"直接認定為股份交易"}],"answer":"B","explanation":"指南 2-42 頁 11.8 節註釋 1 及 MBLR 14.24 明確指明：在一項同時涉及資產收購及處置的綜合交易中，發行人應參照收購或出售兩者中規模較大者（By reference to the larger of the acquisition or disposal）來對該交易進行整體分類並履行相應的通函與股東審批義務。","reference":"MBLR 14.24; HKSI Paper 5 Guide Topic 2 Section 11.8 Note 1"},{"id":"T2-252","topic":"Topic 2","subtopic":"Notifiable Transactions - Disposal Accountants Report Option","difficulty":"Level 2","question":"在上市發行人進行非常重大出售事項（VSD）向股東寄發通函時，關於目標出售業務的會計資料呈列，根據《上市規則》第 14 章的合規要求：","options":[{"value":"A","label":"發行人必須強制刊發針對目標出售實體的完整三年申報會計師報告"},{"value":"B","label":"發行人必須載入經核數師或申報會計師審閱的財務資料，但發行人亦可選擇（At its option）自行決定是否載入申報會計師報告"},{"value":"C","label":"完全免除任何財務資料披露"},{"value":"D","label":"只能披露目標實體的未經審核口頭估算"}],"answer":"B","explanation":"指南 2-42 頁 11.9 節合規表註釋 5 及 MBLR 14.68(2) 指明：在非常重大出售事項（VSD）的通函中，規則強制要求披露經會計師審閱之財務資料，但發行人可按自身意願選擇是否載入正式的申報會計師報告（A listed issuer may at its option include an accountants' report）。","reference":"MBLR 14.68(2); HKSI Paper 5 Guide Topic 2 Section 11.9 Note 5"},{"id":"T2-253","topic":"Topic 2","subtopic":"Connected Transactions - Associates of Individuals (Family Members)","difficulty":"Level 3","question":"在《上市規則》第 14A 章下，某上市發行人執行董事的成年弟弟（35 歲，獨立生活）所全資擁有的貿易公司擬與發行人簽訂採購合約。該董事的弟弟及其全資公司在關連人士定義上屬於：","options":[{"value":"A","label":"該董事的「緊密聯繫人」（Close Associate），自動構成發行人的核心關連人士"},{"value":"B","label":"該董事的「親屬」（Family Member），其控制的法團屬於該董事的聯繫人（Associate），從而構成發行人的關連人士（但非緊密聯繫人），受關連交易規則約束"},{"value":"C","label":"完全獨立的第三方，不受第 14A 章規管"},{"value":"D","label":"發行人的控股股東"}],"answer":"B","explanation":"指南 2-48 頁 11.27 節註釋 1 及 MBLR 14A.12(2) 指明：自然人的兄弟姊妹屬於其親屬（Family member），其控制的法團屬於該董事的「聯繫人」（Associate），因此該公司構成上市發行人的關連人士；但兄弟姊妹並非「直系親屬」，故不構成「緊密聯繫人」。","reference":"MBLR 14A.12; HKSI Paper 5 Guide Topic 2 Section 11.27 Note 1"},{"id":"T2-254","topic":"Topic 2","subtopic":"Connected Transactions - Joint Venture Formation Ratios","difficulty":"Level 2","question":"上市發行人若擬與其關連人士共同出資成立一家合營企業（Joint Venture），在計算該關連交易所適用的百分比率時，其分子（Numerator）應如何釐定？","options":[{"value":"A","label":"僅計算關連人士出資的現金數額"},{"value":"B","label":"發行人承擔的全部出資額及發行人為該合營企業提供的任何財務擔保／承諾總額"},{"value":"C","label":"合營企業預期在未來十年內的總營業額"},{"value":"D","label":"發行人全體董事的年薪總和"}],"answer":"B","explanation":"依據 MBLR 14A.79：成立合營企業時，計算各項比率的代價基礎為發行人集團所承諾的出資總額（無論是股本、貸款形式），加上發行人直接或間接為合營企業承擔的任何融資擔保或彌償保證的最高金額上限。","reference":"MBLR 14A.79; HKSI Paper 5 Guide Topic 2 Section 11.25"},{"id":"T2-255","topic":"Topic 2","subtopic":"Connected Transactions - Aggregation with Same Associated Party (12 Months)","difficulty":"Level 2","question":"根據主板第 14A.81 條，在下列哪種具體情形下，聯交所通常會要求上市發行人在諮詢聯交所後，將數項關連交易合併計算，視同單一關連交易處理？","options":[{"value":"A","label":"該等交易是與同一方（或互有關聯的人士）在 12 個月期間內訂立，或涉及買賣同一項資產的不同部分，或該等交易合計將導致發行人實質開展一項新業務"},{"value":"B","label":"該等交易均在同一個星期一上午進行"},{"value":"C","label":"交易對象均持有香港駕駛執照"},{"value":"D","label":"各項交易金額均低於 100 港元"}],"answer":"A","explanation":"指南 2-48 頁 11.29–11.30 節及 MBLR 14A.81–14A.82 明確列出關連交易合併原則：(1) 與同一方或相聯人士在 12 個月內訂立；(2) 涉及收購或處置同一資產的組成部分；或 (3) 共同構成一項重大商業交易安排。","reference":"MBLR 14A.81, 14A.82; HKSI Paper 5 Guide Topic 2 Section 11.29-11.30"},{"id":"T2-256","topic":"Topic 2","subtopic":"Reverse Takeovers - Disposals in Specie Reasonable Alternative","difficulty":"Level 3","question":"在上市發行人發生控制權變動後 36 個月內，發行人擬透過實物分派（Distribution in specie）將其獲利核心業務分派予全體股東，且分派規模達到 VSD 門檻。根據 MBLR 第 14.06E 條，此方案若要獲准實施，除剩餘業務符合新上市財務要求外，發行人必須向獨立股東提供：","options":[{"value":"A","label":"發行人新控股股東發出的私人道歉信"},{"value":"B","label":"合理的現金選擇權或其他合適替代方案（Reasonable cash alternative or other suitable alternative），以供不欲持有非上市資產的少數股東選擇變現"},{"value":"C","label":"強制將所有分派資產移交海外託管機構"},{"value":"D","label":"全額免除香港利得稅的特權"}],"answer":"B","explanation":"指南 2-47 頁 11.24 節及 MBLR 14.06E 指明：構成非常重大出售的實物分派，必須經獨立股東在大會上表決批准，且方案中必須向獨立股東提供合理的現金替代方案（Reasonable cash alternative），防止少數股東被迫持有缺乏流動性的非上市股權。","reference":"MBLR 14.06E; HKSI Paper 5 Guide Topic 2 Section 11.24"},{"id":"T2-257","topic":"Topic 2","subtopic":"RTO - Independent Shareholder Approval Requirement","difficulty":"Level 3","question":"根據《上市規則》第 14.55 條，反收購行動（RTO）除了被視同新上市申請外，在發行人股東大會的表決層面，受到何種嚴格規限？","options":[{"value":"A","label":"全體股東均有權自由投票支持該項收購"},{"value":"B","label":"該交易必須在股東大會上取得獨立股東批准（Conditional on shareholder approval），在交易中有重大利益的任何人士（包括入主的新控股方及其緊密聯繫人）必須放棄表決權"},{"value":"C","label":"無須經股東大會表決，只需保薦人書面簽核"},{"value":"D","label":"少數股東投票反對超過 1% 即告永久否決"}],"answer":"B","explanation":"指南 2-43 頁 11.13 節及 MBLR 14.55 規定：RTO 必須以取得股東大會批准為先決條件，且在收購中具備重大利益或主導該交易的人士及其聯繫人，必須放棄行使投票權，確保由不受利益衝突影響的獨立少數股東審議。","reference":"MBLR 14.55; HKSI Paper 5 Guide Topic 2 Section 11.13"},{"id":"T2-258","topic":"Topic 2","subtopic":"Cash Companies - Asset Composition Test","difficulty":"Level 2","question":"根據主板第 14.82 條，聯交所在運用原則驗證法判定某上市發行人是否淪為「現金資產公司」（Cash Company）時，下列哪項資產在性質上被納入現金及短期投資的統計範疇？","options":[{"value":"A","label":"發行人為自用而持有的核心商業廠房及研發設備"},{"value":"B","label":"期限少於一年的國債、庫券、商業票據、上市股票投資或隨時可輕易變現為現金的短期金融工具（Short-term investments）"},{"value":"C","label":"已註冊的商標權及專利無形資產"},{"value":"D","label":"應付員工的未發放薪酬負債"}],"answer":"B","explanation":"指南 2-49 頁 11.34 節註釋及 MBLR 14.82 指明：界定現金公司時，受審查資產包括現金以及短期投資（Short-term investments），即發行人為投資或買賣而持有、能輕易轉換為現金的流動證券，如剩餘到期日不足一年的債券、票據或上市股份。","reference":"MBLR 14.82; HKSI Paper 5 Guide Topic 2 Section 11.34 Note"},{"id":"T2-259","topic":"Topic 2","subtopic":"Cash Companies - Resumption as New Listing Applicant","difficulty":"Level 2","question":"若上市發行人因資產主要由現金構成而被聯交所依據 MBLR 第 14.82 條指示停牌，該發行人若擬申請復牌（Resumption of trading），其法律程序為：","options":[{"value":"A","label":"發行人只需將所有現金全額捐贈給香港公益金即可即時復牌"},{"value":"B","label":"發行人必須向聯交所申請解除停牌，且該申請將被視作新上市申請處理（Treated as if it were a new listing application），發行人必須具備合資格的實體業務"},{"value":"C","label":"全體董事共同簽署免責聲明即可在翌日復牌"},{"value":"D","label":"強制直接將股票轉往紐約場外市場交易"}],"answer":"B","explanation":"指南 2-49 頁 11.35 節及 MBLR 14.82 指明：被列為現金公司而停牌的發行人，若擬恢復股份買賣，必須向香港交易所申請取消停牌，且聯交所會將該項復牌申請視為「新上市申請」嚴格審核，發行人必須收購或具備具足夠運作規模的實質業務。","reference":"MBLR 14.82; HKSI Paper 5 Guide Topic 2 Section 11.35"},{"id":"T2-260","topic":"Topic 2","subtopic":"Trading Suspension Requests by Issuer","difficulty":"Level 2","question":"根據主板第 6.02 條至第 6.10 條，在下列哪種合理商業情境下，上市發行人或其財務顧問可向聯交所主動申請正式的「停牌」（Trading Suspension）？","options":[{"value":"A","label":"發行人正受到收購要約，但雙方仍在就重大具體條款進行複雜交涉，且有必要維持市場秩序"},{"value":"B","label":"發行人即將進入清盤程序、接管程序，或確認無法按上市規則期限刊發定期財務報告"},{"value":"C","label":"發行人正在推進涉及非常重大收購事項的簽約與通函籌備"},{"value":"D","label":"以上全部情形均屬於聯交所接納發行人申請停牌的常見合理依據"}],"answer":"D","explanation":"指南 2-51 頁 12.6 節及 MBLR 6.02–6.10 詳列接納停牌申請的場景：(a) 面對收購但正協商具體條款；(b) 維持秩序；(c) 涉及特定須予公布交易；(d) 喪失上市適當性；(e) 進入接管或清盤；(f) 無法按期刊發定期財務業績。","reference":"MBLR 6.02; HKSI Paper 5 Guide Topic 2 Section 12.6"},{"id":"T2-261","topic":"Topic 2","subtopic":"Continuous Suspension - Delisting Consultation (GEM 12 Months)","difficulty":"Level 2","question":"比較主板與 GEM 在發行人證券持續停牌時的除牌觸發期限，兩者在《上市規則》下的法定持續停牌時限分別為：","options":[{"value":"A","label":"主板：連續停牌 6 個月；GEM：連續停牌 3 個月"},{"value":"B","label":"主板：連續停牌 18 個月（MBLR 6.01A(1)）；GEM：連續停牌 12 個月（GLR 9.14A(1)）"},{"value":"C","label":"主板與 GEM 均為連續停牌 36 個月"},{"value":"D","label":"主板：連續停牌 12 個月；GEM：連續停牌 18 個月"}],"answer":"B","explanation":"指南 2-52 頁 12.12 節及 MBLR 6.01A(1)、GLR 9.14A(1) 明確指明：聯交所除牌硬性時限為：主板發行人連續停牌 18 個月，GEM 發行人連續停牌 12 個月。屆滿未能復牌者，聯交所有權直接啟動取消上市地位程序。","reference":"MBLR 6.01A(1); GLR 9.14A(1); HKSI Paper 5 Guide Topic 2 Section 12.12"},{"id":"T2-262","topic":"Topic 2","subtopic":"Takeover Privatisation - Compulsory Acquisition / Scheme of Arrangement","difficulty":"Level 2","question":"在收購要約完成後，要約人若擬將目標上市公司私有化並正式撤銷其上市地位（Withdrawal of listing），要約人通常必須依循下列哪種法律途徑達成？","options":[{"value":"A","label":"只需在網上社交平台發出私有化聲明"},{"value":"B","label":"依據適用公司法行使「強制收購權」（Compulsory Acquisition），或依據《公司條例》及《收購守則》透過「協議安排」（Scheme of Arrangement）實施私有化"},{"value":"C","label":"由香港律政司強制收繳所有剩餘少數股東股票"},{"value":"D","label":"直接修改公司名稱即視同私有化"}],"answer":"B","explanation":"指南 2-54 頁 12.21 節及 MBLR 6.15 指明：在全面收購背景下撤回上市，要約人通常須透過：(1) 行使公司法下的法定強制收購權（通常收購逾 90% 無利害關係股份後行使）；或 (2) 透過法院認可的協議安排（Scheme of arrangement）完成私有化退市。","reference":"MBLR 6.15; Companies Ordinance; HKSI Paper 5 Guide Topic 2 Section 12.21"},{"id":"T2-263","topic":"Topic 2","subtopic":"Disciplinary Proceedings - Listing Committee Review of Listing Division Decisions","difficulty":"Level 2","question":"若聯交所上市科（Listing Division）作出決定，勒令上市發行人終止其某位授權代表（Authorised representative）的職權，發行人對此決定不服，其第一審覆核途徑為：","options":[{"value":"A","label":"直接向香港終審法院提起訴訟"},{"value":"B","label":"提呈上市委員會（Listing Committee）進行第一審覆核審議"},{"value":"C","label":"由公司秘書單方面簽署行政否決書"},{"value":"D","label":"提請聯合國國際貿易法委員會裁決"}],"answer":"B","explanation":"指南 2-7 頁 2.9(b) 節及 MBLR 2A.05 指明：上市科就授權代表職權終止等行政事項作出的決定，受影響方可提請上市委員會進行覆核；若上市委員會確認該決定，該事宜可進一步提呈上市覆核委員會（LRC）審議。","reference":"MBLR 2A.05; HKSI Paper 5 Guide Topic 2 Section 2.9(b)"},{"id":"T2-264","topic":"Topic 2","subtopic":"LRC Review - SFC-Initiated Reviews","difficulty":"Level 3","question":"根據《上市規則》第 2A.37A 條，證監會（SFC）若對聯交所上市委員會所作出的某項非紀律決定或紀律決定感到不滿，證監會可採取何種行動？","options":[{"value":"A","label":"證監會無權干預任何上市委員會的決定"},{"value":"B","label":"證監會可正式要求上市覆核委員會（LRC）覆核上市委員會的該項決定；若 LRC 推翻該決定，受影響的上市方有權要求由一個由全新成員組成的 LRC 進行進一步覆核"},{"value":"C","label":"證監會直接逮捕上市委員會全體成員"},{"value":"D","label":"證監會單方面宣布該決定無效並處以罰款"}],"answer":"B","explanation":"指南 2-7 頁 2.9 節及註釋指出：證監會獲賦權可就上市委員會的紀律或非紀律裁決向 LRC 提請覆核；若 LRC 因證監會提請的覆核而變更或推翻上市委員會決定，受影響當事人有權申請由全新成員組成的 LRC（New LRC）進行進一步覆核。","reference":"MBLR 2A.37A; HKSI Paper 5 Guide Topic 2 Section 2.9"},{"id":"T2-265","topic":"Topic 2","subtopic":"Authorised Representative - Communication Channel Availability","difficulty":"Level 1","question":"根據主板第 3.06 條，上市發行人委派的兩名授權代表，在維持與聯交所日常聯絡方面負有何種具體運作義務？","options":[{"value":"A","label":"授權代表僅需在每年農曆除夕當天與聯交所通話一次"},{"value":"B","label":"授權代表必須隨時向聯交所提供其有效聯絡方式（包括電話、辦公及住址、電郵），並確保在聯交所提出查詢時隨時可供聯絡並及時回應"},{"value":"C","label":"授權代表若離港休假，發行人無須安排任何替任人選"},{"value":"D","label":"授權代表嚴禁向聯交所透露任何董事名冊"}],"answer":"B","explanation":"指南 2-19 頁 3.44 節及 MBLR 3.06 明確規定：授權代表是發行人與聯交所的核心法定溝通渠道，必須確保聯交所隨時能與彼等取得聯繫，並及時處理聯交所發出的各項查詢與緊急監管通告。","reference":"MBLR 3.06; HKSI Paper 5 Guide Topic 2 Section 3.44"},{"id":"T2-266","topic":"Topic 2","subtopic":"Audit Committee - Written Terms of Reference","difficulty":"Level 2","question":"根據主板第 3.22 條，上市發行人董事會就審核委員會（Audit Committee）的權限與職責，必須履行下列哪項治理常規？","options":[{"value":"A","label":"僅給予審核委員會口頭指示，嚴禁形成任何公開書面文件"},{"value":"B","label":"董事會必須制定並批准清晰確立其職權與責任的書面職權範圍（Written terms of reference），並在聯交所及發行人網站上公開發布"},{"value":"C","label":"審核委員會職權範圍必須嚴格保密，不得對任何股東公開"},{"value":"D","label":"審核委員會必須每季更換全套職權範圍"}],"answer":"B","explanation":"指南 2-20 頁 3.46 節及 MBLR 3.22 規定：董事會必須以書面形式明確制定審核委員會的職權範圍（Terms of reference），清晰規範其監督財務申報、內部監控及外聘核數師關係的職權，並向公眾公開。","reference":"MBLR 3.22; HKSI Paper 5 Guide Topic 2 Section 3.46"},{"id":"T2-267","topic":"Topic 2","subtopic":"Remuneration Committee Failure - 3 Months Rectification Period","difficulty":"Level 2","question":"根據主板第 3.27 條，若上市發行人因獨立非執行董事突發辭職，導致其薪酬委員會未能符合由 INED 出任主席或成員過半數的規定，發行人必須採取的法定合規措施是：","options":[{"value":"A","label":"立即發布公告說明詳情及原因，並必須在事件發生後三個月之內（Within three months）採取補救措施以符合規定"},{"value":"B","label":"公司必須在 24 小時內向聯交所申請自願清盤"},{"value":"C","label":"發行人享有永久豁免，無須填補該空缺"},{"value":"D","label":"強制由全體員工一人一票代選一名非執董"}],"answer":"A","explanation":"指南 2-20 頁 3.49 節及 MBLR 3.27 明確規定：發行人若未能符合薪酬委員會組成標準，必須即時刊發公告交代原因，並必須在三個月內（Within three months）委任足夠人選進行糾正補救。","reference":"MBLR 3.27; HKSI Paper 5 Guide Topic 2 Section 3.49"},{"id":"T2-268","topic":"Topic 2","subtopic":"Nomination Committee Failure - 3 Months Rectification Period","difficulty":"Level 2","question":"根據主板第 3.27A 條，若上市發行人提名委員會因成員變動無法滿足由董事會主席或 INED 擔任主席、或 INED 佔多數的規定，其公告與補正期限要求為：","options":[{"value":"A","label":"無須公告，在下一次股東大會口頭說明即可"},{"value":"B","label":"必須即時刊發公告交代原因，並盡合理努力在三個月之內（In any case within three months）妥善解決並補齊人選"},{"value":"C","label":"在 12 個月內補齊人選"},{"value":"D","label":"由聯交所直接派員出任該提名委員會主席"}],"answer":"B","explanation":"指南 2-20 頁 3.50 節及 MBLR 3.27A 規定：提名委員會若出現違規或空缺，發行人必須即時刊發公告解釋原因，並在 3 個月之內（Within 3 months）採取合理補救措施以恢復合規。","reference":"MBLR 3.27A; HKSI Paper 5 Guide Topic 2 Section 3.50"},{"id":"T2-269","topic":"Topic 2","subtopic":"Company Secretary Waiver - 3 Years Conditional Assistance","difficulty":"Level 3","question":"某海外上市發行人擬委任一名不具備 MBLR 第 3.28 條認可專業資格的人士出任公司秘書。聯交所在何種條件下，可依據指南授予為期最長不超過三年的豁免（Waiver）？","options":[{"value":"A","label":"只要該候選人是發行人董事長的親生子女即可全免"},{"value":"B","label":"發行人能證明其主要業務在香港境外，且該未獲認可資格的公司秘書在整個三年豁免期內，獲得另一名完全具備合資格專業背景（如香港律師或會計師）的人士全程協助"},{"value":"C","label":"豁免是永久無條件的"},{"value":"D","label":"該候選人必須在香港大學攻讀歷史學博士學位"}],"answer":"B","explanation":"指南 2-21 頁 3.55 節及 HKEX Guide Chapter 3.10 指明：聯交所可批出為期不超過 3 年的豁免，准許委任未完全合規人士出任公司秘書，但前置條件為：發行人證明業務在海外之必要性，且該人選在豁免期內必須獲得一名合資格專業人士的實質協助與輔導。","reference":"HKEX Guide Chapter 3.10; MBLR 3.28; HKSI Paper 5 Guide Topic 2 Section 3.55"},{"id":"T2-270","topic":"Topic 2","subtopic":"Connected Persons - PRC Supervisors Associates","difficulty":"Level 2","question":"在評估中國內地註冊成立的 H 股發行人的關連交易時，該公司監事（Supervisor）的配偶名下全資擁有的商業諮詢公司，在《上市規則》第 14A 章下被認定為：","options":[{"value":"A","label":"完全獨立的第三方供應商"},{"value":"B","label":"該監事的緊密聯繫人（Close associate），從而構成 H 股發行人的「核心關連人士」（Core Connected Person）"},{"value":"C","label":"僅屬於非關連的合營夥伴"},{"value":"D","label":"發行人的外聘法律顧問"}],"answer":"B","explanation":"指南 2-47 至 2-48 頁 11.27–11.28 節及 MBLR 14A.07 指明：PRC 發行人的監事為關連人士；監事配偶擁有的全資公司為其緊密聯繫人，依據 11.28 節定義，監事及其緊密聯繫人依法構成發行人的「核心關連人士」（Core connected person）。","reference":"MBLR 14A.07, 14A.12; HKSI Paper 5 Guide Topic 2 Section 11.27-11.28"},{"id":"T2-271","topic":"Topic 2","subtopic":"Stock Borrowing and Lending Agreement for Over-allotment","difficulty":"Level 3","question":"在主板 IPO 中，整體協調人（OC）兼穩定價格操作人行使 15% 超額配股權。操作人依據借股協議（Stock Borrowing Agreement）向控股股東借入股份以交割超額分配。根據《上市規則》第 10.07(3) 條，該項借股安排：","options":[{"value":"A","label":"自動構成控股股東違反上市後首 6 個月禁售期的違規行為"},{"value":"B","label":"獲《上市規則》專項豁免而不視為控股股東出售股份（豁免於首 6 個月禁售期限制），前提是借股必須嚴格用於補足超額分配，且借入股份必須在規定期限內如數歸還"},{"value":"C","label":"必須經全體公眾投資者召開特別大會投票贊成"},{"value":"D","label":"借入股份無須歸還，直接轉為操作人的自有投資"}],"answer":"B","explanation":"MBLR 10.07(3) 及指南 2-74 至 2-75 頁 10.24(b) 節註釋指明：為利於新股發售後平穩結算，控股股東向承銷商出借股份以補足超額配發，在符合 MBLR 10.07(3) 嚴格條件下，獲明確豁免遵守大股東首 6 個月禁售期規限，不被視為違規減持處置股份。","reference":"MBLR 10.07(3); HKSI Paper 5 Guide Topic 2 Section 10.24(b) Note"},{"id":"T2-272","topic":"Topic 2","subtopic":"Price Stabilization - Multiple Destabilizing Actions Prohibition","difficulty":"Level 3","question":"根據《證券及期貨（穩定價格）規則》（PS Rules），在穩定價格期內，穩定價格操作人在下列哪種情形下，**嚴禁**執行任何初步或後續的價格穩定行動？","options":[{"value":"A","label":"當證券市場指數出現技術性回調時"},{"value":"B","label":"當該證券的交易價格（據操作人所知）本身已經受到人為非法操縱或人為影響時（Price is already artificially affected）"},{"value":"C","label":"當公開認購倍數超過 5 倍時"},{"value":"D","label":"當全體董事在香港休假時"}],"answer":"B","explanation":"指南 2-75 頁 10.27(a) 節及 PS Rules 明確指明操作限制：若穩定價格操作人知悉該股份的市場價格已經受到人為操縱或不當影響（Artificially affected），操作人絕對嚴禁進一步執行任何穩定價格買賣，以防加劇虛假市場。","reference":"PS Rules; HKSI Paper 5 Guide Topic 2 Section 10.27(a)"},{"id":"T2-273","topic":"Topic 2","subtopic":"Price Stabilization - Disclosure in IPO Prospectus","difficulty":"Level 2","question":"根據 PS Rules，發行人及承銷商若保留在二級市場進行穩定價格行動的權利，在招股章程中必須履行的強制披露包括：","options":[{"value":"A","label":"全體承銷商自營戶口的全部實時持倉數據"},{"value":"B","label":"明確陳述可能採取穩定價格行動之事實、超額配股權（Overallotment option）的具體規模上限、可能持有淨多頭頭寸的警示，以及該等行動對市價的潛在影響"},{"value":"C","label":"保證首日收盤價高於招股價 20% 的書面保證函"},{"value":"D","label":"所有投標機構的詳細報價單全文"}],"answer":"B","explanation":"指南 2-73 至 2-74 頁 10.18–10.19 節及 PS Rules 規定：招股章程必須包含完備的穩定價格摘要，包括：超額配股權比例上限、操作人可採取的首要及附帶行動、持有淨好倉的可能，並提示投資者該等護盤行動可能在期滿後停止從而引致股價回落。","reference":"PS Rules; HKSI Paper 5 Guide Topic 2 Section 10.18-10.19"},{"id":"T2-274","topic":"Topic 2","subtopic":"Valuations in M&A - Financial Adviser Liability under CFA Code","difficulty":"Level 3","question":"機構融資顧問在協助上市公司進行一項主要收購交易並參與對目標資產的估值評估時，根據《機構融資顧問操守準則》（CFA Code）第 5 段，顧問負有何種法規職責？","options":[{"value":"A","label":"顧問對估值數字完全不承擔任何專業審慎責任"},{"value":"B","label":"顧問必須以適當的技能、審慎和勤勉行事，確保採用適當的估值方法（Appropriate valuation methodology），並合理查核估值所依賴的關鍵假設基礎"},{"value":"C","label":"顧問必須強制要求賣方提供三倍資產抵押"},{"value":"D","label":"顧問只能採用資產清算折價法進行估值"}],"answer":"B","explanation":"指南 2-40 頁 11.3 節及 CFA Code para 5 指明：機構融資顧問在參與資產估值時，必須確保採用客觀公允且公認的估值方法學（Valuation methodology），對基礎數據進行專業審慎審查，否則將被追究操守失當及潛在虛假陳述責任。","reference":"CFA Code para 5; HKSI Paper 5 Guide Topic 2 Section 11.3"},{"id":"T2-275","topic":"Topic 2","subtopic":"Valuations in M&A - Compensation Orders under s. 213 SFO","difficulty":"Level 3","question":"若上市發行人的董事或顧問在通函中因嚴重疏忽或罔顧發布了被嚴重誇大的虛假估值報告，構成市場失當行為，證監會可依據 SFO 第 213 條向法院申請何種民事命令？","options":[{"value":"A","label":"向法院申請命令違規者向蒙受損失的受害投資者支付賠償，或強制將交易各方恢復至交易前的原狀（Restore parties to transactions to original position）"},{"value":"B","label":"命令香港警務處沒收發行人的所有實體辦公電腦"},{"value":"C","label":"命令被收購企業在 24 小時內破產清盤"},{"value":"D","label":"強制向全港市民派發每人 1,000 港元慰問金"}],"answer":"A","explanation":"指南 2-40 頁 11.4 節及 SFO s. 213 明確規定：在涉及失實估值等市場失當行為中，證監會可依據 SFO 第 213 條向原訟法庭申請廣泛禁制令及補救命令，包括強制令違規者向受損投資者賠償金錢損失或命令合約復原。","reference":"SFO s.213; HKSI Paper 5 Guide Topic 2 Section 11.4"},{"id":"T2-276","topic":"Topic 2","subtopic":"Valuations in M&A - Section 214 SFO Corporate Wrongdoing","difficulty":"Level 3","question":"根據 SFO 第 214 條，若上市公司董事因推進一項作價嚴重虛高、損害少數股東權益的重大資產收購，被裁定存在嚴重管理失當或苛待股東行為，法院獲授權對該董事作出何種裁決？","options":[{"value":"A","label":"取消其擔任任何法團董事或參與公司管理的資格，最長為期 15 年（Disqualification for up to 15 years），並可命令其直接向上市公司賠償損失"},{"value":"B","label":"僅處以 100 港元象徵性行政罰款"},{"value":"C","label":"命令該董事出任全職公職人員"},{"value":"D","label":"強制銷毀該董事持有的所有學術文憑"}],"answer":"A","explanation":"指南 2-40 頁 11.4 節及 SFO s. 214 指明：針對上市公司董事失職、損害公司或股東利益（Corporate wrongdoing），法院可頒令取消其出任董事資格最長達 15 年，並可命令該失當董事向公司直接賠償因該收購遭受的一切經濟損失。","reference":"SFO s.214; HKSI Paper 5 Guide Topic 2 Section 11.4"},{"id":"T2-277","topic":"Topic 2","subtopic":"Notifiable Transactions - Assets Ratio Formula","difficulty":"Level 2","question":"根據主板第 14.07(1) 條，在計算須予公布交易的「資產比率」（Assets ratio）時，公式中的分子與分母分別取自：","options":[{"value":"A","label":"目標資產的年度營業額除以發行人的總市值"},{"value":"B","label":"作為交易標的的資產總值（Total assets），除以上市發行人的總資產值"},{"value":"C","label":"發行人的淨資產除以目標資產的總負債"},{"value":"D","label":"收購代價除以發行人的流動資產"}],"answer":"B","explanation":"指南 2-41 頁 11.7 節及 MBLR 14.07(1) 指明：資產比率的計算方式為：交易所涉及的資產總值（Total assets of the subject of the transaction），除以上市發行人資產負債表所載的總資產值（Total assets of the listed issuer）。","reference":"MBLR 14.07(1); HKSI Paper 5 Guide Topic 2 Section 11.7"},{"id":"T2-278","topic":"Topic 2","subtopic":"Notifiable Transactions - Profits Ratio Formula","difficulty":"Level 2","question":"根據主板第 14.07(2) 條，在計算須予公布交易的「盈利比率」（Profits ratio）時，比率中的盈利是指：","options":[{"value":"A","label":"扣除全部稅項及非經常性損益後的最終淨利潤"},{"value":"B","label":"交易所涉及資產應佔的「扣除稅項及非經常項目除外的除稅前溢利」（Profits before tax and extraordinary items），與上市發行人的除稅前溢利相比"},{"value":"C","label":"公司的毛利潤額"},{"value":"D","label":"過去三年的平均未分配利潤"}],"answer":"B","explanation":"依據 MBLR 14.07(2) 及 14.04(8)：盈利比率計算採用交易所涉資產應佔的除稅前純利（除稅前且扣除非經常項目除外之利潤），除以發行人群組同期的除稅前純利。","reference":"MBLR 14.07(2); HKSI Paper 5 Guide Topic 2 Section 11.7"},{"id":"T2-279","topic":"Topic 2","subtopic":"Notifiable Transactions - Revenue Ratio Formula","difficulty":"Level 1","question":"根據主板第 14.07(3) 條，在計算須予公布交易的「收益比率」（Revenue ratio）時，公式採用的是：","options":[{"value":"A","label":"發行人的經營現金流入除以目標公司的投資現金流出"},{"value":"B","label":"作為交易標的的資產所應佔的收益（Revenue），除以上市發行人的總收益"},{"value":"C","label":"目標公司的利潤總額除以發行人的營業額"},{"value":"D","label":"收購對價除以目標公司的年收益"}],"answer":"B","explanation":"指南 2-41 頁 11.7 節及 MBLR 14.07(3) 規定：收益比率計算為：交易標的資產所產生的收益（Revenue attributable to the subject asset），除以上市發行人經審計年度財務報表所載的總收益。","reference":"MBLR 14.07(3); HKSI Paper 5 Guide Topic 2 Section 11.7"},{"id":"T2-280","topic":"Topic 2","subtopic":"Reverse Takeovers - Quality of Targets Assessment","difficulty":"Level 3","question":"在聯交所依據原則驗證法審查一項重大收購是否屬於反收購（RTO）時，其考量「收購目標的質素」（Quality of the acquisition targets）時的核心指標是：","options":[{"value":"A","label":"目標資產全體員工的平均年齡"},{"value":"B","label":"目標業務是否能夠獨立符合新上市申請人的各項適當性與財務資格基準（Eligibility and suitability requirements for a new listing）；若不符合，聯交所通常將該收購視為意圖規避上市審查的 RTO 並予否決"},{"value":"C","label":"目標業務是否設立在開曼群島"},{"value":"D","label":"目標公司是否具備實體公章"}],"answer":"B","explanation":"指南 2-44 頁 11.17(d) 節註釋明確指出：聯交所審視目標資產質素時，核心在於檢驗其能否獨立達到新上市資格（包括三年業績及適當性）；若目標資產質素低下或不符合新上市要求，將被直接判定為借殼規避，不獲批准。","reference":"MBLR 14.06B; HKSI Paper 5 Guide Topic 2 Section 11.17 Note"},{"id":"T2-281","topic":"Topic 2","subtopic":"RTO - Series of Acquisitions Forming Listing Pattern","difficulty":"Level 3","question":"某上市發行人在控制權變動後，在 18 個月內連續從新控股股東處分三次收購不同資產，各次單獨計算的比率均為 20%（看似僅屬須予披露的交易），但三次收購資產實質構成同一產業鏈且合計比率達 60%。聯交所在反收購規管下的處理方式為：","options":[{"value":"A","label":"嚴格按各單次交易孤立對待，豁免全部股東大會審批"},{"value":"B","label":"將該一連串收購合併視為「一項單一整體交易」（Forming a series of transactions to list the targets），若整體意圖在於借殼注入，聯交所有權將該連串交易整體定性為反收購（RTO）"},{"value":"C","label":"強制將發行人全體管理層更換為公務員"},{"value":"D","label":"命令所有被收購資產即時解散"}],"answer":"B","explanation":"指南 2-45 頁 11.17(f) 節及 MBLR 14.06B 指明：聯交所獲賦權穿透表面形式，將共同構成將資產上市之一連串交易或安排（Series of transactions）合併審視，防止發行人透過化整為零的方式規避反收購審查。","reference":"MBLR 14.06B; HKSI Paper 5 Guide Topic 2 Section 11.17 Note 2"},{"id":"T2-282","topic":"Topic 2","subtopic":"Extreme Transactions - Circular Disclosure Standard","difficulty":"Level 2","question":"若上市發行人的重大收購獲聯交所批准作為「極端交易」（Extreme Transaction）處理，發行人在向股東刊發通函時，其披露標準必須達到：","options":[{"value":"A","label":"一般常規商業公告的簡要標準即可"},{"value":"B","label":"必須達到等同於「非常重大收購事項」（VSA）通函的詳細標準，並載有經財務顧問額外盡調證實的目標資產上市合規性披露"},{"value":"C","label":"只需轉載第三方研究員的簡要摘要"},{"value":"D","label":"通函長度不得超過 2 頁紙"}],"answer":"B","explanation":"指南 2-46 頁 11.20 節及 MBLR 14.06C 指明：極端交易發行人必須遵從與非常重大收購事項（VSA）相同的嚴格規定，編制包含目標公司詳細審計報告及由財務顧問簽核之完備通函，並提呈股東大會獲股東投票表決通過。","reference":"MBLR 14.06C; HKSI Paper 5 Guide Topic 2 Section 11.20"},{"id":"T2-283","topic":"Topic 2","subtopic":"Connected Transactions - Direct Benefit to Core Connected Person","difficulty":"Level 2","question":"上市發行人若收購一家非上市目標公司的少數股權，而發行人的董事長在該目標公司中同時持有 15% 的實益權益。根據主板上市規則第 14A 章，該項收購：","options":[{"value":"A","label":"因該目標公司並非由董事長控股 30%，故自動不屬於任何關連交易"},{"value":"B","label":"若該收購實質上直接使董事長個人享有重大利益，聯交所有權行使視作權力將其定性為關連交易，受申報與獨立審批規則管轄"},{"value":"C","label":"完全合法且無須任何內部申報"},{"value":"D","label":"發行人必須即時被處以暫停買賣處分"}],"answer":"B","explanation":"指南 2-48 頁 11.31 節及 MBLR 14A.19–14A.21 指明：即使未直接達到 30% 受控公司門檻，若交易牽涉核心關連人士的實質重大個人利益，聯交所有權行使裁量權將該交易或該對手方「視作關連人士」（Deemed connected person），要求全面合規。","reference":"MBLR 14A.19; HKSI Paper 5 Guide Topic 2 Section 11.31"},{"id":"T2-284","topic":"Topic 2","subtopic":"Continuing Obligations - Independent Valuation Reports Requirement","difficulty":"Level 2","question":"根據主板第 14 章及第 14A 章，在上市發行人進行重大物業或礦業資產交易時，通函內所載的物業或資產估值報告，其出具機構必須符合下列哪項硬性標準？","options":[{"value":"A","label":"可由發行人的全職內部財務總監獨立出具"},{"value":"B","label":"必須由具備適當專業資格與經驗的「獨立專業估值師」（Independent professional valuer）編制，且估值基準日通常距通函刊發日不得超過三個月"},{"value":"C","label":"只需由發行人董事長口頭簽核"},{"value":"D","label":"估值師必須由香港立法會任命"}],"answer":"B","explanation":"MBLR 5.01, 14.66 及指南 2-40 頁 11.2 節指明：通函內的物業及資產估值報告，必須由具備專業勝任資格且獨立於發行人的專業估值機構出具，確保估值公允客觀，防止內部人員虛抬資產價格。","reference":"MBLR Chapter 5, 14.66; HKSI Paper 5 Guide Topic 2 Section 11.2"},{"id":"T2-285","topic":"Topic 2","subtopic":"Trading Halt - Time of Announcement Lodgement Outside Trading Hours","difficulty":"Level 1","question":"根據主板第 2.07C 條，除少數極端例外情況外，上市發行人透過聯交所電子登載系統刊發正式監管公告的常規時間窗口必須為：","options":[{"value":"A","label":"必須在交易時段內的任何一秒隨時發布"},{"value":"B","label":"在香港聯交所的「非交易時段」（Outside trading hours，如早市開市前或收市後）提交發布，以避免在盤中交易進行時對股價產生突發衝擊"},{"value":"C","label":"僅限於每週六下午 3 時發布"},{"value":"D","label":"僅限於每年最後一個交易日半夜"}],"answer":"B","explanation":"指南 2-4 頁 1.4 節及 MBLR 2.07C 明確規定：除受豁免的短暫停牌公布等特定事項外，上市發行人的監管公告原則上必須在「非交易時段」（Outside trading hours）呈交發布，以維護公平、平穩及有序的市場交易秩序。","reference":"MBLR 2.07C; HKSI Paper 5 Guide Topic 2 Section 1.4"},{"id":"T2-286","topic":"Topic 2","subtopic":"Announcement Retention on Issuer Website (5 Years)","difficulty":"Level 1","question":"根據主板上市規則第 2.07C 條，上市發行人在其自身官方網站上公開發布的全套公告與公司通訊，法定必須在網站上持續保留至少多長時間？","options":[{"value":"A","label":"至少 24 小時"},{"value":"B","label":"至少保留五年（Keep it available there for at least five years）"},{"value":"C","label":"至少保留 100 年"},{"value":"D","label":"在刊發滿 30 天後必須立即刪除"}],"answer":"B","explanation":"指南 2-4 頁 1.4 節及 MBLR 2.07C 規定：發行人必須將完整公告發布於其自身網站，並在網站上持續備存供公眾查閱至少 5 年（Available for at least five years）。","reference":"MBLR 2.07C; HKSI Paper 5 Guide Topic 2 Section 1.4"},{"id":"T2-287","topic":"Topic 2","subtopic":"Electronic Corporate Communications Implementation","difficulty":"Level 2","question":"香港聯交所全面推行無紙化制度後，根據《上市規則》第 2.07A 條，發行人向其登記證券持有人發送公司通訊（Corporate Communications）的常規基準途徑為：","options":[{"value":"A","label":"必須強制以實體掛號信寄發全部千頁紙本通函"},{"value":"B","label":"在章程細則及法例允許下，優先透過電子方式（Electronic means，如登載於發行人及聯交所網站）發布，僅在股東明確提出書面要求時才提供紙本印刷品"},{"value":"C","label":"僅透過口頭廣播通報"},{"value":"D","label":"完全取消向少數股東發送任何公司通訊"}],"answer":"B","explanation":"指南 2-4 頁 1.4 節及 MBLR 2.07A 規定：發行人推行電子傳播制度，公司通訊原則上透過電子方式提供；若股東提出要求，發行人仍須免費寄發印刷本以保障個別股東權利。","reference":"MBLR 2.07A; HKSI Paper 5 Guide Topic 2 Section 1.4"},{"id":"T2-288","topic":"Topic 2","subtopic":"Trading Suspension Requests - Financial Information Disclosure Inability","difficulty":"Level 2","question":"根據主板第 13.50 條，若上市發行人未能按照《上市規則》規定的期限刊發其年度經審計財務業績，聯交所將採取何種強制監管行動？","options":[{"value":"A","label":"允許發行人延期 5 年公布，期間正常交易"},{"value":"B","label":"聯交所通常會直接要求該發行人的證券暫停買賣（Trading suspension），直至發行人刊發載有所需財務資料的公告為止"},{"value":"C","label":"自動將發行人全體董事交由商業罪案調查科拘留"},{"value":"D","label":"強制沒收發行人的所有未分配利潤"}],"answer":"B","explanation":"指南 2-51 頁 12.6(f) 節及 MBLR 13.50 明文規定：發行人若未能按期發表定期財務業績，聯交所將指示其股票自截止期限翌日起停牌，直至發行人正式公布合格財務業績為止。","reference":"MBLR 13.50; HKSI Paper 5 Guide Topic 2 Section 12.6(f)"},{"id":"T2-289","topic":"Topic 2","subtopic":"Disciplinary Proceedings - Public Statement of Unsuitability Follow-up","difficulty":"Level 3","question":"根據主板第 2A.10 條，當上市委員會公開聲明某董事「不適合擔任發行人董事」後，若該發行人拒絕免除該董事的職務，該董事在指定期限後仍繼續留任，聯交所獲授權採取的跟進制裁行動包括：","options":[{"value":"A","label":"直接暫停該發行人任何或全部類別證券的買賣，甚至啟動取消上市地位（除牌）程序，或剝奪其使用市場設施的權利"},{"value":"B","label":"直接將該董事的私人存款充公"},{"value":"C","label":"命令聯交所行政總裁向該董事致歉"},{"value":"D","label":"強制向全港市民派發該發行人的折扣優惠券"}],"answer":"A","explanation":"指南 2-56 頁 13.4 節註釋及 MBLR 2A.10(c) 指明：若被評為不適合的人員在指定日期後仍留任董事或高級管理層，聯交所可對該發行人實施跟進處分，包括暫停股份買賣、禁止使用市場設施、甚至取消上市地位。","reference":"MBLR 2A.10; HKSI Paper 5 Guide Topic 2 Section 13.4 Note"},{"id":"T2-290","topic":"Topic 2","subtopic":"Disciplinary Sanctions - Banning Dealers and Advisers","difficulty":"Level 2","question":"根據主板第 2A.10(h) 條，上市委員會在行使紀律處分權力時，有權對市場中介人發出何種指令，以切斷嚴重違規發行人獲取專業機構服務的渠道？","options":[{"value":"A","label":"禁止所有證券交易商及財務顧問代表該上市發行人行事或繼續行事（Banning dealers and financial advisers from acting for the listed issuer）"},{"value":"B","label":"命令全港持牌銀行凍結該發行人全體供應商的存款"},{"value":"C","label":"命令外判印刷商銷毀所有電腦設備"},{"value":"D","label":"強制解僱該顧問公司的全體前台接待人員"}],"answer":"A","explanation":"指南 2-56 頁 13.4(f) 節及 MBLR 2A.10(f) 規定：聯交所可向業界施加制裁，禁止市場上的交易商（Dealers）及財務顧問（Financial advisers）代表該違規發行人行事，作為重大市場制裁手段。","reference":"MBLR 2A.10; HKSI Paper 5 Guide Topic 2 Section 13.4(f)"},{"id":"T2-291","topic":"Topic 2","subtopic":"Disciplinary Proceedings - Referral to SFC (MBLR 2A.10(k))","difficulty":"Level 1","question":"根據主板第 2A.10(k) 條，當上市委員會在紀律調查中發現受調查人士涉嫌觸犯法定罪行或嚴重違規時，聯交所獲授權採取的標準協作程序為：","options":[{"value":"A","label":"將該違規當事人的行為轉介或建議舉報予香港證監會（SFC）或其他香港或海外的法定監管／執法機構（Recommending reporting conduct to SFC）"},{"value":"B","label":"私下收取雙倍上市費後將檔案永久封存銷毀"},{"value":"C","label":"命令被調查人士向海外慈善機構匯款"},{"value":"D","label":"由聯交所親自簽發法定逮捕手令"}],"answer":"A","explanation":"指南 1-41 頁 4.54 節、2-56 頁 13.4(j) 節及 MBLR 2A.10(k) 指明：聯交所若發現超越上市規則範圍的涉嫌違法行為，可正式向證監會或相關執法機構轉介舉報該方的失當行為，以啟動法定調查或刑事檢控程序。","reference":"MBLR 2A.10; HKSI Paper 5 Guide Topic 1 Section 4.54; Topic 2 Section 13.4(j)"},{"id":"T2-292","topic":"Topic 2","subtopic":"Listing Division - Vetting of New Listing Applications","difficulty":"Level 2","question":"香港聯交所上市科（Listing Division）在處理主板新上市申請人的審查流程中，其具體職權界限為：","options":[{"value":"A","label":"上市科有權獨立對主板新上市申請給予最終上市批准，無須經上市委員會審理"},{"value":"B","label":"上市科負責處理日常審查，可拒絕接納申請或向上市委員會建議批准/拒絕；但主板新申請人的最終上市批准權，由上市委員會（Listing Committee）嚴格保留行使"},{"value":"C","label":"上市科完全不參與任何新上市文件的審閱"},{"value":"D","label":"上市科負責主導承銷團的包銷合約定價談判"}],"answer":"B","explanation":"指南 2-6 頁 2.3 節及 MBLR 2A.05 指明：上市科處理日常審核，但上市委員會保留了批准所有主板新上市申請人的最終審批權力。這意味著即使上市科建議批准，上市委員會仍有權予以否決。","reference":"MBLR 2A.05; HKSI Paper 5 Guide Topic 2 Section 2.3"},{"id":"T2-293","topic":"Topic 2","subtopic":"Subsequent Issues Vetting - Discharge by Listing Division","difficulty":"Level 2","question":"與新上市申請人不同，已上市發行人進行後續證券發行（Subsequent Issues，如供股、配股、增發代價股）的審批常規由誰處理？","options":[{"value":"A","label":"必須每次召開上市委員會全體 28 名成員大會審批"},{"value":"B","label":"常規由上市科（Listing Division）直接審查及批准；除非上市科主動要求將該申請轉呈上市委員會審理"},{"value":"C","label":"由發行人的獨立財務顧問自行蓋印批准"},{"value":"D","label":"由公司註冊處副處長獨立審批"}],"answer":"B","explanation":"指南 2-6 頁 2.4 節及 MBLR 2A.06 指明：已上市發行人的後續發行通常由上市科直接處理與批准；上市委員會或 GEM 上市委員會僅在上市科主動提請時方進行審議。","reference":"MBLR 2A.06; HKSI Paper 5 Guide Topic 2 Section 2.4"},{"id":"T2-294","topic":"Topic 2","subtopic":"Listing Committee Composition - Investor Representatives Minimum","difficulty":"Level 2","question":"根據主板第 2A.17 條，在上市委員會（Listing Committee）至少 28 名成員的法定結構中，代表投資者利益的成員人數不得少於：","options":[{"value":"A","label":"不少於 1 人"},{"value":"B","label":"不少於八人（At least eight individuals representing the interest of investors）"},{"value":"C","label":"不少於 20 人"},{"value":"D","label":"投資者代表嚴禁加入上市委員會"}],"answer":"B","explanation":"指南 2-6 頁 2.5(a) 節及 MBLR 2A.17 明確規定：上市委員會成員中，必須包含至少 8 名代表廣大投資者利益的個人（At least 8 investor representatives），以確保投資大眾權益在審批決策中獲得充分體現。","reference":"MBLR 2A.17; HKSI Paper 5 Guide Topic 2 Section 2.5(a)"},{"id":"T2-295","topic":"Topic 2","subtopic":"LRC Composition - Investor Representatives Minimum","difficulty":"Level 2","question":"根據主板第 2A.37A 條，在上市覆核委員會（LRC）至少 20 名成員的法定架構中，代表投資者利益的成員人數不得少於：","options":[{"value":"A","label":"不少於 2 人"},{"value":"B","label":"不少於六人（At least six individuals representing the interest of investors）"},{"value":"C","label":"不少於 15 人"},{"value":"D","label":"無任何投資者代表席位要求"}],"answer":"B","explanation":"指南 2-7 頁 2.10(a) 節及 MBLR 2A.37A 指明：上市覆核委員會（LRC）由至少 20 名獨立人士組成，其中必須包含至少 6 名代表投資者利益的成員（At least six investor representatives）。","reference":"MBLR 2A.37A; HKSI Paper 5 Guide Topic 2 Section 2.10(a)"},{"id":"T2-296","topic":"Topic 2","subtopic":"HKEX Chief Executive Recusal from Review Meetings","difficulty":"Level 2","question":"根據主板第 2A 條，香港交易所行政總裁（HKEX Chief Executive）作為上市委員會的當然非投票成員，在上市委員會召開下列哪類會議時，**不得**出席？","options":[{"value":"A","label":"審議上市規則政策修訂的季度會議"},{"value":"B","label":"上市委員會在進行首審（Determining a matter in the first instance）或覆核聆訊的實質審理會議"},{"value":"C","label":"年度新春酒會"},{"value":"D","label":"一般例行預算審批會議"}],"answer":"B","explanation":"指南 2-7 頁 2.7 節及 MBLR 2A.18 明確規定：香港交易所行政總裁不得出席上市委員會進行初審或覆核個別發行人案件的會議（Will not attend meetings determining a matter in the first instance or on review），以維護審理的獨立性與程序公正。","reference":"MBLR 2A.18; HKSI Paper 5 Guide Topic 2 Section 2.7"},{"id":"T2-297","topic":"Topic 2","subtopic":"Disciplinary Proceedings - Provision of Papers to Parties in Advance","difficulty":"Level 2","question":"在上市委員會召開紀律處分聆訊之前，為保障程序公正與答辯權利，上市科（Listing Division）必須履行的法定程序義務為：","options":[{"value":"A","label":"對所有指控文件嚴格保密直至會議結束"},{"value":"B","label":"在會議舉行前，向受調查當事人提供擬在會議上呈交的全部文件與陳詞副本（Provide parties with copies of any papers to be presented）"},{"value":"C","label":"要求當事人繳交 100 萬港元的文件查閱規費"},{"value":"D","label":"僅向新聞傳媒透露指控細節"}],"answer":"B","explanation":"指南 2-57 頁 13.6 節及 MBLR 2A.14 指明：在召開任何紀律聆訊會議前，上市科必須向相關當事人提供其擬在會上呈交的全部文件副本，確保當事人在專業顧問協助下具備充分知情與抗辯準備機會。","reference":"MBLR 2A.14; HKSI Paper 5 Guide Topic 2 Section 13.6"},{"id":"T2-298","topic":"Topic 2","subtopic":"Disciplinary Proceedings - Remedial Action Order Timelines","difficulty":"Level 2","question":"根據主板第 2A.10(l) 條，上市委員會在對違規當事人作出處分裁定時，獲賦權命令當事人在指定期限內採取何種糾正措施？","options":[{"value":"A","label":"命令該當事人永久遷離香港特別行政區"},{"value":"B","label":"命令其在指定期限內糾正違規行為或採取其他具體補救行動（Ordering rectification or other remedial action to be taken within a specified period）"},{"value":"C","label":"命令其向所有散戶派發現金紅包"},{"value":"D","label":"命令其全數承接發行人的所有銀行債務"}],"answer":"B","explanation":"指南 2-56 頁 13.4(k) 節及 MBLR 2A.10 規定：上市委員會可頒令要求違規當事人在指定期限內糾正不合規行為（Rectification），或落實其他合規補救措施（如委聘獨立合規審計師重新審查內部監控等）。","reference":"MBLR 2A.10; HKSI Paper 5 Guide Topic 2 Section 13.4(k)"},{"id":"T2-299","topic":"Topic 2","subtopic":"Trading Halt Clarification - Negative Statements","difficulty":"Level 2","question":"當上市發行人因應市場針對其造假、欺詐等沽空指控而發表澄清公告以尋求復牌時，若指控涉及多項虛構事件，聯交所預期發行人在澄清公告中應當載有：","options":[{"value":"A","label":"轉移話題的促銷廣告"},{"value":"B","label":"逐項具體反駁或解釋指控的詳情，或適當的「否定陳述」（Appropriate negative statement，明確否定該等指控屬實）以全面消除虛假市場"},{"value":"C","label":"全體董事私人自拍照"},{"value":"D","label":"保證下季度收入增長十倍的無擔保口頭預測"}],"answer":"B","explanation":"指南 2-50 至 2-51 頁 12.4 節指出：聯交所預期發行人在澄清公告中列載具體細節逐點反駁指控，或作出清晰有力的否定陳述（Appropriate negative statement），以澄清事實並最大程度防範虛假混亂市場。","reference":"MBLR; HKSI Paper 5 Guide Topic 2 Section 12.4"},{"id":"T2-300","topic":"Topic 2","subtopic":"Summary of Topic 2 Listing Continuum","difficulty":"Level 2","question":"上市發行人在香港聯交所成功掛牌上市後，在整個持續上市週期中，發行人董事會所承擔的最高監管與法律責任架構為：","options":[{"value":"A","label":"發行人僅需按時繳交上市年費即可，無須理會任何後續市場披露"},{"value":"B","label":"全體董事共同及個別承擔確保發行人全面遵守《上市規則》、及時披露法定內幕消息、遵守企業管治與關連交易規定的持續法定與合約責任，失職者將承擔監管制裁、民事及刑事法律後果"},{"value":"C","label":"所有合規責任自上市之日起永久移交予香港結算公司承擔"},{"value":"D","label":"發行人在上市後享有豁免遵守任何香港成文法例的特權"}],"answer":"B","explanation":"指南 2-4 頁 1.4 節、2-14 頁 3.25–3.26 節及 2-62 頁 9.66 節明確確立了上市發行人的持續合規主線：董事共同及個別負責（Collectively and individually responsible）確保發行人全面嚴格遵從上市規則及適用法例，任何重大違規將面臨紀律、民事乃至刑事全面追責。","reference":"MBLR 3.08, 13.04; HKSI Paper 5 Guide Topic 2 Section 3.25, 9.66"},{"id":"T2-301","topic":"Topic 2","subtopic":"Listing Qualifications - Place of Incorporation MMOU Requirement","difficulty":"Level 2","question":"根據主板上市規則第 8.02 條及第 8.02A 條（GEM 第 11.05 條），新上市申請人的註冊成立地點及其主要業務管理及控制中心所在地，在監管管轄權方面必須符合下列哪項法定要求？","options":[{"value":"A","label":"必須受制於已簽署國際證券事務監察委員會組織多邊諒解備忘錄（IOSCO MMOU）為正式簽署人的法定證券監管機構的監管"},{"value":"B","label":"必須由香港金融管理局派員進駐進行實質日常監控"},{"value":"C","label":"必須在英聯邦成員國或地區註冊成立"},{"value":"D","label":"必須全額免除繳納任何海外司法管轄區的法定企業所得稅"}],"answer":"A","explanation":"指南 2-46 頁 9.2 節及 MBLR 8.02/8.02A 指明：申請人註冊成立地點及中央管理與控制所在地，均必須受到身為國際證監會組織多邊諒解備忘錄（IOSCO MMOU）正式簽署人的證券監管機構監管，以確保跨境監管執法與信息交換機制行之有效。","reference":"MBLR 8.02, 8.02A; HKSI Paper 5 Guide Topic 2 Section 9.2"},{"id":"T2-302","topic":"Topic 2","subtopic":"Listing Qualifications - IOSCO MMOU Waiver Conditions","difficulty":"Level 3","question":"若新申請人的註冊地或管理控制地所屬監管機構並非 IOSCO MMOU 正式簽署人，根據主板第 8.02B 條，在何種嚴格法定條件下，聯交所可批出豁免？","options":[{"value":"A","label":"只要發行人全體董事在香港購買價值超過 5,000 萬港元的自置物業即可獲豁免"},{"value":"B","label":"經證監會（SFC）書面同意，且證監會信納該司法管轄區已具備充分適當的跨境監管調查與執法協助安排（Adequate cross-border arrangements in place）"},{"value":"C","label":"只要保薦人願以自身第 6 類牌照作為無限期擔保即可自動豁免"},{"value":"D","label":"聯交所及證監會均無權給予任何豁免，該申請必須直接否決"}],"answer":"B","explanation":"指南 2-46 頁 9.2 節註釋及 MBLR 8.02B 明確指出：聯交所可經證監會同意後批出豁免，但其絕對前提為證監會信納已具備足夠的跨境監管調查與法規執行合作安排，以保障香港投資者利益。","reference":"MBLR 8.02B; GLR 11.05B; HKSI Paper 5 Guide Topic 2 Section 9.2 Note"},{"id":"T2-303","topic":"Topic 2","subtopic":"Ownership Continuity - Controlling vs Single Largest Shareholder","difficulty":"Level 2","question":"根據主板第 8.05 條，在發行人於整個營業紀錄期內並無「控股股東」（即無人控制 30% 或以上投票權）的情況下，發行人應如何滿足所有權及控制權連續性要求？","options":[{"value":"A","label":"發行人被自動推定為不合資格，嚴禁在主板上市"},{"value":"B","label":"必須證明在營業紀錄期最近一個經審計財政年度內，其「單一最大股東」（Single largest shareholder）對該發行人的所有權及表決控制權維持連續不變"},{"value":"C","label":"必須由全體股東簽訂一致行動協議以人為湊足 30% 控股權"},{"value":"D","label":"只需證明總經理在過去三年未曾離職即可"}],"answer":"B","explanation":"指南 2-46 至 2-47 頁 9.3(c) 節註釋及 MBLR 8.05 指明：所有權及控制權連續性要求適用於控股股東；若發行人無控股股東，則該項連續性審查適用於發行人的單一最大股東（Single largest shareholder）。","reference":"MBLR 8.05; HKSI Paper 5 Guide Topic 2 Section 9.3(c) Note"},{"id":"T2-304","topic":"Topic 2","subtopic":"Sponsors Declaration of Independence - Timing of Assessment","difficulty":"Level 2","question":"保薦人向聯交所簽署並呈交其具備獨立性的確認書時，保薦人評估自身是否維持「獨立性」（Independence）的時間跨度基準為：","options":[{"value":"A","label":"僅以保薦人獲委任簽署聘書當日為準，其後變更無須審視"},{"value":"B","label":"自保薦人獲委任起、在整個上市申請審查期內持續維持，且若在此期間發生任何影響獨立性的變動，保薦人必須迅速向聯交所申報（Report to SEHK promptly any change）"},{"value":"C","label":"僅以公開發售股份定價當日早上的持股狀態為準"},{"value":"D","label":"保薦人只需在上市敲鑼後 30 天內提交獨立性自我評估"}],"answer":"B","explanation":"指南 2-9 頁 3.4 節、2-10 頁 3.6(g) 節及 MBLR 3A.07 指明：保薦人必須在呈交申請時確認其獨立且預期維持獨立，並在整個保薦履職期間持續監控；一旦知悉任何影響其獨立性的變動，必須即時向聯交所主動呈報。","reference":"MBLR 3A.07, 3A.08; HKSI Paper 5 Guide Topic 2 Section 3.4, 3.6"},{"id":"T2-305","topic":"Topic 2","subtopic":"Sponsors Continuing Duty after Ceasing Appointment","difficulty":"Level 3","question":"某保薦人在主板上市申請進行期間因故終止委聘。根據主板上市規則第 3A.17 條，該前保薦人在其委任終止後，負有何種持續的法規申報義務？","options":[{"value":"A","label":"保薦人一旦終止合約，其所有法定監管責任即時徹底解除"},{"value":"B","label":"除報告離任原因外，若其隨後知悉在「其擔任保薦人期間」所提供的任何重要資料存在不合規或重大失實，該前保薦人仍負有持續義務迅速向聯交所報告該等情況"},{"value":"C","label":"前保薦人必須將該項目的全部工作底稿直接移交香港警務處保管"},{"value":"D","label":"前保薦人有責任自費完成剩餘的招股章程印刷工作"}],"answer":"B","explanation":"指南 2-10 頁 3.6(g) 節註釋明確指出：向聯交所報告重大不合規資料的義務，在保薦人委任終止後仍持續有效（Obligation continues after appointment ceases），但僅限於在其擔任保薦人期間進入其知悉範圍內的資料。","reference":"MBLR 3A.17; HKSI Paper 5 Guide Topic 2 Section 3.6(g) Note"},{"id":"T2-306","topic":"Topic 2","subtopic":"Overall Coordinator - Multiple OCs Joint and Several Liability","difficulty":"Level 2","question":"上市申請人在主板 IPO 中委聘了三間資本市場中介機構共同出任「聯席整體協調人」（Joint Overall Coordinators）。根據《上市規則》第 3A 章及監管規定，該等機構在履行整體協調人職責時承擔：","options":[{"value":"A","label":"按各自收取的佣金比例承擔按份有限責任"},{"value":"B","label":"共同及個別承擔法律與監管責任（Jointly and severally liable）"},{"value":"C","label":"僅由排名首位的總協調人承擔單一全部責任"},{"value":"D","label":"完全免責，所有責任由發行人全資承擔"}],"answer":"B","explanation":"指南 2-11 頁 3.10 節及 MBLR 3A 章明確指明：若發行人委聘多於一名整體協調人（Joint OCs），全體整體協調人均承擔共同及個別責任（Jointly and severally liable），每名協調人均須對整體的合規與配售公正承擔全責。","reference":"MBLR 3A.43; HKSI Paper 5 Guide Topic 2 Section 3.10"},{"id":"T2-307","topic":"Topic 2","subtopic":"Overall Coordinator - Two Independent Sponsors and Coupling Termination","difficulty":"Level 3","question":"某擬上市公司委聘了兩名獨立保薦人（Sponsor A 與 Sponsor B），彼等各自所屬集團分別出任整體協調人（OC A 與 OC B），從而滿足保薦人綑綁規定。若在審查期間發行人終止了 Sponsor B 及其對應的 OC B 的委聘，該上市申請面臨何種程序後果？","options":[{"value":"A","label":"發行人必須強制撤回上市申請並接受 8 週禁呈期"},{"value":"B","label":"由於剩餘的 Sponsor A 及其所屬 OC A 仍維持有效委聘，保薦人綑綁要求依然獲得滿足，因此無須重新呈交上市申請或強制延期兩個月"},{"value":"C","label":"Sponsor A 的保薦人牌照將被自動降級為合規顧問"},{"value":"D","label":"發行人必須在 24 小時內補聘三間新的外資保薦人"}],"answer":"B","explanation":"指南 2-11 至 2-12 頁 3.13 節註釋指明：若發行人委聘兩名獨立保薦人及對應的兩名 OC，其中一組終止委聘後，只要剩餘的架構仍符合「每名在任獨立保薦人均具備整體協調人綑綁」之要求，則無須重新提交上市申請（有別於單一保薦人解約的情況）。","reference":"MBLR 3A; HKSI Paper 5 Guide Topic 2 Section 3.13 Note"},{"id":"T2-308","topic":"Topic 2","subtopic":"Overall Coordinator Discretionary Authority Scope","difficulty":"Level 2","question":"根據《上市規則》第 1.01 條，下列哪項業務活動明確屬於整體協調人（Overall Coordinator）獲賦權單獨或共同行使的核心專業職權範圍？","options":[{"value":"A","label":"擔任發行人清盤時的法定破產管理人"},{"value":"B","label":"全面管理發售、協調簿記建檔及配售、就最終發售價向發行人提供意見並作為定價協議簽署方、以及行使權力在配售與公開發售檔份之間調配股份或行使超額配股權"},{"value":"C","label":"全權代替發行人全體董事簽署董事會年報"},{"value":"D","label":"為全體公眾投資者提供無條件股票保本兜底"}],"answer":"B","explanation":"指南 2-10 頁 3.7 節及 MBLR 1.01 詳列整體協調人的法定職責：(a) 整體管理發售與建檔協調；(b) 建議發售價並簽署定價協議；(c) 行使酌情權進行檔份分配調配、縮減發售股份或行使加大發售/超額配股權。","reference":"MBLR 1.01, 3A.43; HKSI Paper 5 Guide Topic 2 Section 3.7"},{"id":"T2-309","topic":"Topic 2","subtopic":"Exchange Directed Appointment of Compliance Adviser","difficulty":"Level 2","question":"根據主板第 3A.20 條（GLR 6A.20 條），在法定首個完整財年委聘期結束後，聯交所在何種情形下有權直接命令已上市發行人再次委聘合規顧問？","options":[{"value":"A","label":"發行人連續兩年未有向聯交所捐款"},{"value":"B","label":"聯交所認為發行人在持續合規、內部監控或遵守上市規則方面出現嚴重缺陷，指示其委聘合規顧問以提供專項意見並履行聯交所指定的特定職責"},{"value":"C","label":"發行人股價超過每股 100 港元"},{"value":"D","label":"全體獨立非執行董事年滿 60 歲"}],"answer":"B","explanation":"指南 2-12 頁 3.16 節及 MBLR 3A.20（GLR 6A.20）規定：在規定最低委聘期結束後，聯交所仍有權在認為合適時，指示任何上市發行人委任合規顧問，並承擔聯交所指定的特定合規輔導職能。","reference":"MBLR 3A.20; GLR 6A.20; HKSI Paper 5 Guide Topic 2 Section 3.16"},{"id":"T2-310","topic":"Topic 2","subtopic":"Compliance Adviser Duty of Open Cooperation","difficulty":"Level 2","question":"根據主板第 3A.22 條，合規顧問自其開始為發行人工作之日起，在配合聯交所上市科或上市委員會調查時負有何種法定合規義務？","options":[{"value":"A","label":"可援引商業機密特權拒絕回答聯交所提出的任何質詢"},{"value":"B","label":"必須全面合作，包括迅速且坦誠地回答所有提問、迅速提供任何相關文件的正本或副本，並應要求親自出席會議或聆訊"},{"value":"C","label":"僅需在聯交所支付諮詢費用後方提供必要文件"},{"value":"D","label":"必須協助發行人向公眾隱瞞所有內部核數底稿"}],"answer":"B","explanation":"指南 2-12 至 2-13 頁 3.19 節及 MBLR 3A.22 指明：合規顧問負有直接的監管合作義務，包括：坦誠回答質詢、迅速交出文件正本或複本、並親自出席會議或紀律聆訊接受調查。","reference":"MBLR 3A.22; HKSI Paper 5 Guide Topic 2 Section 3.19"},{"id":"T2-311","topic":"Topic 2","subtopic":"Independent Financial Advisers - Mandate Triggers","difficulty":"Level 2","question":"根據主板第 13.80 條至第 13.87 條，在下列哪種具體公司架構或交易場景中，上市發行人**強制必須**委聘獨立財務顧問（IFA）？","options":[{"value":"A","label":"發行人向獨立第三方採購日常辦公用電腦耗材"},{"value":"B","label":"發行人擬進行依《上市規則》須經獨立股東批准的關連交易、或依據第 15 項應用指引推進須經股東批准的分拆上市，或海外發行人擬以介紹形式尋求香港第一上市"},{"value":"C","label":"發行人董事會召開例行季度股息派發會議"},{"value":"D","label":"發行人委任新的基層初級行政人員"}],"answer":"B","explanation":"指南 2-13 頁 3.20 節及 MBLR 13.80 列明強制委聘 IFA 的核心場景：(1) 須經獨立股東批准的交易（如關連交易）；(2) PN15 分拆上市方案；(3) 海外發行人以介紹形式作主要上市時受聯交所要求等。","reference":"MBLR 13.80, 13.84; HKSI Paper 5 Guide Topic 2 Section 3.20"},{"id":"T2-312","topic":"Topic 2","subtopic":"IFA - Material Change Notification by Issuer","difficulty":"Level 2","question":"根據主板第 13.81(2) 條，在獨立財務顧問（IFA）受聘就關連交易編制意見函期間，上市發行人對該 IFA 負有何種法定持續通報責任？","options":[{"value":"A","label":"發行人可隨意修改基礎數據而毋須知會 IFA"},{"value":"B","label":"發行人必須就先前向 IFA 提供或已由 IFA 查閱的任何資料所發生的任何「重大變動」（Material change），迅速知會該 IFA"},{"value":"C","label":"發行人必須要求 IFA 對所有財務變動簽署免責協議"},{"value":"D","label":"發行人嚴禁向 IFA 提供未經公證的任何內部運作資料"}],"answer":"B","explanation":"指南 2-14 頁 3.24 節及 MBLR 13.81(2) 明確規定：發行人負有法定責任，必須在先前提供或由 IFA 獲取的任何資料出現重大變動時，即時、主動通知 IFA，以確保其獨立意見基礎具備真實時效性。","reference":"MBLR 13.81(2); HKSI Paper 5 Guide Topic 2 Section 3.24"},{"id":"T2-313","topic":"Topic 2","subtopic":"IFA - Reasonable Basis for Statements Made","difficulty":"Level 3","question":"根據主板第 13.80 條，獨立財務顧問（IFA）在向獨立股東委員會及獨立股東出具正式意見函件時，必須採取一切合理步驟以確保：","options":[{"value":"A","label":"發行人在未來三年內的二級市場股價絕對不跌"},{"value":"B","label":"其作出的各項意見與聲明均具備「合理基礎」（Reasonable basis），且無合理理由相信其所依賴的資料或專家意見存在虛假或遺漏重大事實"},{"value":"C","label":"全體獨立股東無條件一致投票贊成該交易"},{"value":"D","label":"IFA 收取的顧問費超過交易總額的 10%"}],"answer":"B","explanation":"指南 2-14 頁 3.22 節及 MBLR 13.80 規定：IFA 必須採取一切合理步驟，確保其發表的陳述具備合理基礎（Reasonable basis），並信納所依賴的基礎數據或第三方專家意見無虛假或隱瞞重大事實。","reference":"MBLR 13.80; HKSI Paper 5 Guide Topic 2 Section 3.22"},{"id":"T2-314","topic":"Topic 2","subtopic":"First-time Directors Training Hours Requirement","difficulty":"Level 2","question":"根據《上市規則》第 3.09D 條，初次擔任聯交所上市公司董事的人士（First-time directors），在獲委任後的 18 個月內，必須完成不少於多少小時的持續專業培訓（CPD）？","options":[{"value":"A","label":"不少於 5 小時"},{"value":"B","label":"不少於 24 小時（At least 24 hours of development training within 18 months）"},{"value":"C","label":"不少於 100 小時"},{"value":"D","label":"無硬性時數要求，自願參加即可"}],"answer":"B","explanation":"指南 2-15 頁 3.26(j) 節註釋及 MBLR 3.09D 明確規定：初任上市公司董事的個人，必須在獲委任後 18 個月內完成至少 24 個小時的專業培訓課程（若其在獲委任前 3 年內曾任其他上市公司董事，則時數可縮減至 12 小時）。","reference":"MBLR 3.09D; HKSI Paper 5 Guide Topic 2 Section 3.26(j) Note"},{"id":"T2-315","topic":"Topic 2","subtopic":"Director Removal by Ordinary Resolution (Appendix A1)","difficulty":"Level 1","question":"根據主板附錄 A1（Appendix A1）載列的股東核心保障基準，上市發行人的章程細則必須賦權股東大會以何種決議案門檻，即可在董事任期屆滿前將其罷免？","options":[{"value":"A","label":"必須以 100% 全體一致書面同意"},{"value":"B","label":"以普通決議案（Ordi
