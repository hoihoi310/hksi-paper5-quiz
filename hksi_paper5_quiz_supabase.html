reference":""},{"id":"T4-094","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"依據《香港公司收購及合併守則》第 8.1 條，在全面要約過程中，要約文件（Offer Document）與受要約公司通函（Offeree Board Circular）的最遲刊發時間要求為：","options":[{"value":"A","label":"自公告要約條款起計 60 天內"},{"value":"B","label":"要約人須在公佈要約之日起 21 天內寄發要約文件；若為聯合通函，通常須於 35 天內寄出"},{"value":"C","label":"股東大會召開前 3 天寄發即可"},{"value":"D","label":"沒有任何法定時限限制"}],"answer":"B","explanation":"《收購守則》嚴格限制時間表。要約人必須在公佈要約詳細條款後 21 天內向股東寄發正式要約文件；在聯合要約文件（Composite Document）形式下，通常應在要約公佈後 35 天內共同刊發及寄發。","reference":""},{"id":"T4-095","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"根據香港《公司條例》（第 622 章），公司實施「法定協議安排（Scheme of Arrangement）」進行全面私有化時，必須通過高等法院召開的法院會議表決。現行法例下「股東大會表決通過」的法定票數門檻是：","options":[{"value":"A","label":"出席法院會議並投票的獨立股東所持表決權中，至少 75% 贊成，且反對票不超過全體獨立股東無利害關係表決權的 10%"},{"value":"B","label":"必須獲得 100% 全體全票一致贊成"},{"value":"C","label":"僅需全體董事會一致簽字同意"},{"value":"D","label":"只要出席人數過半數即可通過"}],"answer":"A","explanation":"依據香港《收購守則》第 2.10 條及公司條例規定，透過協議安排（Scheme）私有化，在無利害關係股東出席的法院會議上，必須取得：(1) 至少 75% 的投票權贊成；(2) 反對票數不得超過全體無利害關係股份所附表決權的 10%。","reference":""},{"id":"T4-096","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"依據《上市規則》第 14.82 條，若上市公司處置其大部分業務以換取大量現金，導致其資產之全部或大部分為現金或短期投資時，該發行人將被聯交所認定為：","options":[{"value":"A","label":"高流動性優質企業"},{"value":"B","label":"「現金資產公司（Cash Company）」，該公司股份將被暫停買賣，並限期 12 個月內投入符合規定的新業務，否則將予以除牌"},{"value":"C","label":"自動轉型為註冊持牌銀行"},{"value":"D","label":"豁免此後所有的財務報告披露"}],"answer":"B","explanation":"聯交所禁止「現金資產公司（Cash Company）」長期掛牌。若上市公司的資產實質全為現金或短期證券，其將被強制停牌；若未能在 12 個月內落實可滿足常規上市標準的全新合規業務，聯交所將直接啟動取消其上市地位程序。","reference":""},{"id":"T4-097","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"特專科技公司（18C）在上市前向資深獨立投資者（SII）發行附帶「自動轉換（Automatic Conversion on IPO）」條款的可轉換優先股，在上市掛牌當日該等優先股通常如何處置？","options":[{"value":"A","label":"強制按原面值全額贖回返還現金"},{"value":"B","label":"於上市生效時自動按約定換股比例無條件全數轉換為普通股，其持有人作為普通股股東受招股書披露之鎖定期（Lock-up）等規則約束"},{"value":"C","label":"永久作為優先股掛牌買賣"},{"value":"D","label":"立即無償贈送給聯交所慈善基金"}],"answer":"B","explanation":"臨床與科技企業 Pre-IPO 融資常發行可轉換優先股（Preferred Shares）。依據香港上市常規，該等證券附帶的各類特殊權利（如回購權、反攤薄權、優先清算權）在上市日必須全數終止，並自動 1:1 或按公式轉為普通股上市交易。","reference":""},{"id":"T4-098","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"上市公司將持有的可換股債券按公允價值計量且其變動計入當期損益（FVTPL）時，若自身信用風險（Own Credit Risk）發生變化導致公允價值變動，在 IFRS 9 下該部分變動損益應計入：","options":[{"value":"A","label":"營業外支出"},{"value":"B","label":"其他全面收益（Other Comprehensive Income, OCI），且後續不得重分類至利潤表"},{"value":"C","label":"資本公積儲備且可即時分紅"},{"value":"D","label":"營業收入"}],"answer":"B","explanation":"IFRS 9「金融負債公允價值選擇權」規定，被指定為 FVTPL 的金融負債，因企業自身信用風險變化引起的公允價值變動金額，應直接計入「其他全面收益（OCI）」，防止企業因自身信用惡化導致負債公允價值縮水反而在損益表中確認「不合理利潤」。","reference":""},{"id":"T4-099","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"依據《香港公司收購及合併守則》第 27 條，在全面要約期內，收購人或目標公司及其任何顧問，若向新聞界或分析師提供有關要約的非公開資料，將構成：","options":[{"value":"A","label":"正當商業公關推廣"},{"value":"B","label":"違反嚴格保密與資訊平等披露原則，證監會執行人員將對該行為予以嚴厲譴責並要求即時公開澄清"},{"value":"C","label":"香港旅遊發展局贊助項目"},{"value":"D","label":"合法的融資招攬行為"}],"answer":"B","explanation":"《收購守則》第 27 條嚴禁選擇性披露（Selective Disclosure）。要約相關重大資訊必須透過正式監管披露渠道同步向所有股東平權公開，不得在私人宴會、媒體採訪或分析員會議中提前外洩，否則將遭監管制裁。","reference":""},{"id":"T4-100","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"在結構化融資協議中，「消極保證（Negative Undertakings / Covenants）」條款對借款人（上市公司）的核心法律約束力主要體現在：","options":[{"value":"A","label":"強制發行人必須在每週日發布最新財報"},{"value":"B","label":"禁止發行人在未獲債權人書面同意前，進行重大資產剝離、額外質押擔保、非日常重大對外投資或大幅變更業務本質，以維護信用資產包之完整性"},{"value":"C","label":"限制發行人股東在股東大會上的個人發言權"},{"value":"D","label":"強制全體執行董事放棄個人養老金"}],"answer":"B","explanation":"消極承諾（Negative Covenants）是信貸合約的核心防禦架構，透過「不作為」義務（如禁止重大資產處置、禁止增設二級押記、限制股息分配上限等），確保債務人在借款存續期內的資產與償債能力不被掏空。","reference":""},{"id":"T4-101","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"依據香港《上市規則》第十八章B（Chapter 18B - 特殊目的收購公司 SPAC），SPAC 在完成首次公開發售（IPO）時，其募集資金總額依法不得少於多少港元？","options":[{"value":"A","label":"5 億港元"},{"value":"B","label":"10 億港元"},{"value":"C","label":"15 億港元"},{"value":"D","label":"20 億港元"}],"answer":"B","explanation":"根據香港《上市規則》第 18B.06 條，SPAC 在其首次發售時建立的集資總額不得少於 10 億港元，以確保 SPAC 具備充足資本規模收購高質量特殊目的收購公司併購目標（De-SPAC Target）。","reference":""},{"id":"T4-102","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"依據《上市規則》第十八章B，SPAC 首次公開發售的股份與權證（Warrants），在發行及二級市場交易階段僅限於何種投資者參與？","options":[{"value":"A","label":"任何在香港持有證券賬戶的散戶投資者"},{"value":"B","label":"僅限專業投資者（Professional Investors, PIs），且券商必須落實嚴格的投資者身分核實機制"},{"value":"C","label":"僅限香港永久性居民"},{"value":"D","label":"僅限註冊持牌銀行機構本身"}],"answer":"B","explanation":"香港 SPAC 框架對投資者保護極為嚴格，依據第 18B.03 條規定，SPAC 發行的證券在完成 De-SPAC 交易前，僅限證券及期貨條例定義之「專業投資者（Professional Investors）」認購及買賣，場內每手買賣單位價值亦不得低於 100 萬港元。","reference":""},{"id":"T4-103","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"香港《上市規則》第十八章B對 SPAC 發行的權證（SPAC Warrants）總體攤薄上限（Dilution Cap）實施明確約束，所有權證於行使時可發行的新股總數，合計不得超過發行日股份總額的多少百分比？","options":[{"value":"A","label":"20%"},{"value":"B","label":"30%"},{"value":"C","label":"50%"},{"value":"D","label":"100%"}],"answer":"C","explanation":"根據《上市規則》第 18B.22 條，為防止過度股權稀釋，SPAC 發行之所有權證（包括發起人權證與投資者權證）在全數行使時，所能換取的新股總數上限不得超過發行該等權證時已發行股份數目的 50%。","reference":""},{"id":"T4-104","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"SPAC 必須在自上市之日起計的多長時間內公佈 De-SPAC 交易（特殊目的收購公司併購交易）協議，並在多長時間內完成該項併購？","options":[{"value":"A","label":"12 個月內公佈，24 個月內完成"},{"value":"B","label":"24 個月內公佈，36 個月內完成"},{"value":"C","label":"18 個月內公佈，30 個月內完成"},{"value":"D","label":"36 個月內公佈，48 個月內完成"}],"answer":"B","explanation":"依據《上市規則》第 18B.70 及 18B.71 條，SPAC 必須在上市後 24 個月內刊發 De-SPAC 交易公告，並在上市後 36 個月內完成該項交易；若逾期未獲聯交所批准延期，SPAC 將被強制停牌、清盤並將託管賬戶資金返還投資者。","reference":""},{"id":"T4-105","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"在 De-SPAC 併購交易中，繼承公司（Successor Company）在法律與監管程序上必須被視為下列何者處置？","options":[{"value":"A","label":"須予披露的普通日常交易"},{"value":"B","label":"新上市申請人（New Listing Applicant），必須全面符合《上市規則》所載之常規新上市資格（包括最低利潤/市值測試、保薦人盡職審查及招股章程要求）"},{"value":"C","label":"免審批資產整合"},{"value":"D","label":"純粹股權互換合約"}],"answer":"B","explanation":"De-SPAC 實質上是未上市私人資產藉由殼架構實現上市，因此聯交所第 18B.36 條規定，De-SPAC 交易產生的繼承公司必須全面遵守新上市申請程序，出具保薦人報告並符合所有主板新上市標準。","reference":""},{"id":"T4-106","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"依據香港證券及期貨事務監察署《房地產投資信託基金守則》（Code on REITs），香港上市 REIT 的負債總額（Gearing Ratio）佔資產總值的法定最高上限通常為：","options":[{"value":"A","label":"25%"},{"value":"B","label":"45%"},{"value":"C","label":"50%"},{"value":"D","label":"75%"}],"answer":"C","explanation":"根據香港證監會經修訂修訂的《房地產投資信託基金守則》第 7.9 條，REIT 的借貸總額不得超過該信託基金資產總值的 50%，以維護基金穩健槓桿與股息派發穩定性。","reference":""},{"id":"T4-107","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"根據《房地產投資信託基金守則》，REIT 每年必須將其經審計扣稅後淨收入的多少最低百分比，以股息形式分派予基金單位持有人？","options":[{"value":"A","label":"50%"},{"value":"B","label":"70%"},{"value":"C","label":"90%"},{"value":"D","label":"100%"}],"answer":"C","explanation":"香港《REIT 守則》的核心特徵是高分紅承諾，明確規定受監管的房地產投資信託基金每個財政年度必須將不少於 90% 的經審計除稅後淨收入分派給單位持有人。","reference":""},{"id":"T4-108","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"依據《房地產投資信託基金守則》，REIT 持有的房地產項目在收購完成後，依法原則上必須持有至少多久的法定持有期，禁止短期炒作倒賣？","options":[{"value":"A","label":"6 個月"},{"value":"B","label":"1 年"},{"value":"C","label":"2 年"},{"value":"D","label":"5 年"}],"answer":"C","explanation":"依據《REIT 守則》規定，REIT 必須以產生穩定長期租金收入為主要導向，信託基金購入房地產後原則上必須持有至少 2 年，禁止任何以快速買賣獲利為導向的投機性質房地產開發或轉售。","reference":""},{"id":"T4-109","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"房地產投資信託基金（REIT）進行物業開發活動（Property Development Activities）及未完工物業投資時，該等投資總額合計不得超過該 REIT 資產總值的：","options":[{"value":"A","label":"5%"},{"value":"B","label":"10%"},{"value":"C","label":"15%"},{"value":"D","label":"25%"}],"answer":"D","explanation":"為允許營運彈性同時防範高風險工程暴險，《REIT 守則》放寬允許從事物業開發與翻新，但明訂從事房地產開發活動及附帶未完工項目的投資總成本，合計不得超出信託基金總資產值的 25%。","reference":""},{"id":"T4-110","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"香港《公司（清盤及雜項條文）條例》（第 32 章）下，當上市公司進入強制破產清盤時，在資產變現分配序列中，下列何類債權享有最優先法定受償權（Statutory Preferential Payments）？","options":[{"value":"A","label":"持有特定不動產浮動押記（Floating Charge）的債權人"},{"value":"B","label":"優先償付僱員法定欠薪、代通知金、遣散費及特定未繳政府稅款（法定優先債權）"},{"value":"C","label":"普通無擔保可換股債券持有人"},{"value":"D","label":"優先股股東之累積股息"}],"answer":"B","explanation":"在清盤分配清償順位中，在固定抵押權（Fixed Charge）就特定抵押品變現受償後，法定優先債務（Preferential Debts，包含破欠基金僱員欠薪、法定工傷補償及欠繳法定稅項）優先於浮動押記債權人、普通無抵押債權人及各級股東。","reference":""},{"id":"T4-111","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"上市公司清盤實務中，「固定押記（Fixed Charge）」與「浮動押記（Floating Charge）」的核心差別在於：","options":[{"value":"A","label":"浮動押記債權人在清盤受償順位中絕對高於固定押記"},{"value":"B","label":"固定押記直接附著於特定、可識別的非流動資產（如指定土地、廠房），發行人未經同意不得處置；浮動押記則浮動於動態變化的流動資產包（如存貨、應收賬款），在違約觸發「結晶化（Crystallisation）」前發行人可自由運轉處置"},{"value":"C","label":"浮動押記不需要向公司註冊處登記登記"},{"value":"D","label":"固定押記只能由香港金管局擔任受託人"}],"answer":"B","explanation":"固定押記（Fixed Charge）鎖定特定不可隨意變動之資產，控制權在債權人手；浮動押記（Floating Charge）則漂浮於公司流動資產總體之上，發行人在日常業務中可自由處置，直至發生違約事件導致押記「結晶化（Crystallise）」轉為固定權益。","reference":""},{"id":"T4-112","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"在面臨嚴重債務危機時，上市公司常採行「債轉股（Debt-to-Equity Swap）」重組，在香港法規下，此類發行新股以抵銷既有債務之安排通常依賴何種法律機制執行？","options":[{"value":"A","label":"僅需全體董事會口頭通過"},{"value":"B","label":"依據《公司條例》第 673-674 條訂立經高等法院裁定認可之「債權人計劃安排（Creditors' Scheme of Arrangement）」及上市特別授權"},{"value":"C","label":"由香港警務處商業罪案調查科核准"},{"value":"D","label":"強制要求所有債券持有人無償銷毀債券憑證"}],"answer":"B","explanation":"債轉股通常伴隨跨階層利益調整。實務上透過法定 Scheme of Arrangement 召開各類別債權人會議，獲法定多數（人數過半且價值佔四分之三贊成）通過並經高等法院頒令裁定確認（Sanction），方具備全面法定強制約束力。","reference":""},{"id":"T4-113","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"依據《香港公司收購及合併守則》第 26 條之「清洗豁免（Whitewash Waiver）」，當大股東或債權人因參與拯救困境上市公司的「債轉股」或包銷配股發行，導致持股比例突破 30% 觸發強制全面要約時，其向證監會申請豁免要約責任的法定條件為：","options":[{"value":"A","label":"經董事會單獨批准即可"},{"value":"B","label":"必須取得證監會執行人員事先認可，並在股東大會上獲得至少 75% 的無利害關係獨立股東投票通過清洗決議案"},{"value":"C","label":"只要承諾一年內不分紅即可自動豁免"},{"value":"D","label":"透過向法院申請單方面破產禁制令豁免"}],"answer":"B","explanation":"根據《收購守則》附表六，清洗豁免旨在便利困境企業股本重組。若發行新股抵債使認購人持股突破 30%，認購人必須事先申請 Whitewash Waiver，並經出席股東大會之獨立股東以 75% 以上特別多數決表決通過，相關關連方全數放棄表決權。","reference":""},{"id":"T4-114","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"香港上市公司發行之「可換股永續資本證券（Convertible Perpetual Capital Securities）」在合約中設有「利息遞延累積（Cumulative Interest Deferral）」與「股息停付制止機制（Dividend Stopper）」，這代表：","options":[{"value":"A","label":"發行人若遞延支付本期永續債利息，則發行人亦同時被禁止向其任何普通股股東宣派或支付任何股息"},{"value":"B","label":"債券持有人必須替發行人代繳企業利得稅"},{"value":"C","label":"發行人永遠毋須支付任何所欠遞延利息"},{"value":"D","label":"股票交易將被立即永久除牌"}],"answer":"A","explanation":"「Dividend Stopper」是永續混合證券中保護債權人的標配條款。發行人雖擁有自主延期支付永續債利息的彈性，但合約約定一旦動用利息遞延，發行人不得對劣後於該證券的普通股進行任何股息宣派或股份回購，直至所欠利息全數清償。","reference":""},{"id":"T4-115","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"根據香港《公司條例》（第 622 章），任何由香港註冊公司創設的特定抵押與押記（Charges），必須於押記設立之日起計多久內向公司註冊處（Companies Registry）交付登記，否則在清盤時對清盤人及債權人無效？","options":[{"value":"A","label":"7 天"},{"value":"B","label":"14 天"},{"value":"C","label":"1 個月"},{"value":"D","label":"3 個月"}],"answer":"C","explanation":"根據香港《公司條例》第 335 條規定，公司設定指明押記（如浮動押記、土地房產押記、賬面債券押記）後，必須在該押記設立日之後的 1 個月內，向公司註冊處交付表格完成抵押登記，逾期未註冊者將喪失清算對抗效力並喪失優先權。","reference":""},{"id":"T4-116","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"跨境資本運作中，「ISDA 主協議（ISDA Master Agreement）」廣泛應用於場外衍生工具與結構化對沖交易。下列哪項條款構成了防範交易對手信用風險的核心違約處置機制？","options":[{"value":"A","label":"雙重徵稅抵免條款"},{"value":"B","label":"「終止淨額結算（Close-out Netting）」條款：在任一方發生違約或破產事件時，立即加速終止所有未平倉交易，並將所有合約公允價值合併折算為單一淨額支付"},{"value":"C","label":"仲裁委員會強制和解協議"},{"value":"D","label":"外匯牌價自動錨定機制"}],"answer":"B","explanation":"終止淨額結算（Close-out Netting）是 ISDA 合約的核心靈魂。當對手方破產時，非違約方有權將主協議項下成百上千筆互有盈虧的衍生品合約一次性終止，相互抵銷後只計算一個單一債權/債務淨額，徹底防範破產清盤人「只選有利合約履約（Cherry-picking）」的系統性風險。","reference":""},{"id":"T4-117","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"依據《上市規則》第 18B.54 條，De-SPAC 交易必須包含「獨立第三方投資（Private Investment in Public Equity, PIPE）」，PIPE 投資佔 De-SPAC 目標議定估值的法定最低比例門檻通常視目標估值而定，其核心監管功能是：","options":[{"value":"A","label":"由專業的獨立第三方機構投資者透過真實注資為 De-SPAC 目標公司的商業估值進行背書與市場化定價驗證"},{"value":"B","label":"替 SPAC 發起人墊付行政手續費"},{"value":"C","label":"替代聯交所的上市委員會進行資格審批"},{"value":"D","label":"規避香港廉政公署之反貪污審查"}],"answer":"A","explanation":"香港 SPAC 機制強制引入獨立第三方私募投資（PIPE），要求至少一半的 PIPE 資本來自資深機構投資者。其關鍵目的在於引進真正的外部市場資本對併購目標估值進行實質盡調與定價把關，防止發起人與目標方串通高估資產掏空公眾投資者。","reference":""},{"id":"T4-118","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"在困境債務重組中，「預先包裝重組（Pre-packaged Insolvency / Scheme）」是指：","options":[{"value":"A","label":"在正式進入法院法定重整或清盤程序之前，債務人與主要核心債權人已預先磋商並達成實質重組方案協議，隨後迅速透過法院程序裁決確認以縮短停牌與法律衝擊"},{"value":"B","label":"董事在破產前將資產無償打包贈與親屬"},{"value":"C","label":"破產管理署指派第三方機構無償清償全部欠款"},{"value":"D","label":"註銷所有普通股並向散戶發放無記名債券"}],"answer":"A","explanation":"預先重組（Pre-pack）可最大程度減少法律抗辯成本與停牌耗損。企業在向法院申請 Scheme of Arrangement 之前，已預先與主要金融債權人、債券持有人鎖定重組條款（Lock-up Agreement），隨後進入法院流程快速過會通過。","reference":""},{"id":"T4-119","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"依據《香港公司收購及合併守則》第 2.2 條，全面要約完成後，若要約人擬透過法定權利行使「強制性收購（Compulsory Acquisition / Squeeze-out）」將剩餘少數少數股東股份全數拔除（Squeeze-out），要約人必須在要約刊發後 4 個月內達成何種收購門檻？","options":[{"value":"A","label":"收購達到目標公司總股本的 50%"},{"value":"B","label":"取得無利害關係股份（即不受要約人控制的獨立要約股份）中不少於 90% 的接納份額"},{"value":"C","label":"取得出席股東大會人數的 75% 贊成"},{"value":"D","label":"只要獲得目標公司董事會主席書面同意即可"}],"answer":"B","explanation":"根據香港《公司條例》第 693 條及《收購守則》，要約人行使擠出少數股東權利（Compulsory Acquisition）的門檻極高：要約人必須在要約發出後 4 個月內，獲得「要約所涉及股份（即非要約人持有的獨立少數股份）」至少 90% 的有效接納，方可行使法定強制要約拔除權。","reference":""},{"id":"T4-120","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"上市公司發行之「認股權證（Warrants）」若採用「非現金結算 / 無本金交割（Net-share Settlement）」，當投資者行使權證時，公司向其交付的股份數量計算公式為：","options":[{"value":"A","label":"新股數 = [權證數量 * (當前標的股價 - 行使價)] / 當前標的股價"},{"value":"B","label":"直接交付所有認購股份且不扣減任何成本"},{"value":"C","label":"新股數 = 權證數量 * 行使價 * 當前股價"},{"value":"D","label":"交付等額面值的定存單"}],"answer":"A","explanation":"淨額股份交割（Net Share Settlement）又稱無現金行權（Cashless Exercise），投資者不需掏出現金支付行權價，而是由發行人直接發行相當於「期權內在價值（Market Price - Strike Price）」的等額股票，可顯著減少發行新股的絕對股數。","reference":""},{"id":"T4-121","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"依據《上市規則》第 18B.64 條，SPAC 在發起 De-SPAC 交易時，股東大會就該收購案進行表決時，SPAC 發起人（SPAC Promoters）及其聯繫人：","options":[{"value":"A","label":"享有三倍超級投票權"},{"value":"B","label":"依法必須放棄表決權（Abstain from Voting）"},{"value":"C","label":"必須全額投票支持該項併購案"},{"value":"D","label":"有權單方面推翻全體獨立股東的否決票"}],"answer":"B","explanation":"為消除發起人與公眾股東之間的嚴重利益衝突（發起人持有巨額廉價 Promoters' Shares，有強烈促成交易的動機），香港《上市規則》嚴格要求 SPAC 發起人及其緊密聯繫人必須在 De-SPAC 交易決議案上放棄行使表決權，併購案完全由獨立公眾股東決定。","reference":""},{"id":"T4-122","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"房地產投資信託基金（REIT）與一般上市房地產重資產開發公司（Property Developer）在業務結構與監管約束上的核心差異是：","options":[{"value":"A","label":"REIT 可以無限制進行高風險土地一級開發投機"},{"value":"B","label":"REIT 以獲取長期租金流為核心、負債率受嚴格法定上限約束（最高 50%）、且強制將 90% 以上淨收益分派，免受傳統開發商的銷售週期再投資波動"},{"value":"C","label":"一般地產公司受證監會《REIT 守則》直接監管，而 REIT 僅受公司註冊處監管"},{"value":"D","label":"REIT 不能在香港聯交所掛牌買賣"}],"answer":"B","explanation":"REIT 追求「高分紅、低槓桿、穩定性」。其資產配置嚴格集中於收益型物業，受到負債上限（50%）與分紅底線（90%）的剛性制約；而一般地產開發商從事土地儲備開發與銷售，留存收益以追求資本增值，槓桿與業務彈性較大。","reference":""},{"id":"T4-123","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"根據香港《個人資料（私隱）條例》（PDPO）及證券市場開戶盡職審查（KYC），金融機構在發行跨境結構化衍生票據時，對最終實質受益人（UBO）資料之收集與申報必須符合：","options":[{"value":"A","label":"任何人均不得向監管機構提供任何個人資料"},{"value":"B","label":"符合香港證監會「投資者識別碼制度（HKIDR）」及衍生工具場外交易申報義務，並遵循保障資料原則合法處理與安全保存個人數據"},{"value":"C","label":"將所有客戶身分資料上傳至公開區塊鏈公開查閱"},{"value":"D","label":"僅需向當地民間商會備案"}],"answer":"B","explanation":"在金融合規中，個人私隱保護必須與打擊洗錢（AML）及市場穿透監管平衡。金融機構依據 HKIDR 機制向證監會提交識別碼（CID），並遵循 PDPO 原則告知客戶、限制資料使用目的及安全儲存。","reference":""},{"id":"T4-124","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"上市公司面臨破產清盤時，若控股股東在清盤呈請提交前 6 個月內，將其對公司的「普通無抵押借款」突擊變更為「附帶優先受償權的固定抵押權」，該行為在香港《公司（清盤及雜項條文）條例》下將構成：","options":[{"value":"A","label":"合法債權保全措施"},{"value":"B","label":"「不當優惠（Unfair Preference）」，清盤人有權向法庭申請宣告該押記無效並撤銷該項優先受償權"},{"value":"C","label":"正當資產管理"},{"value":"D","label":"企業破產保護標準範例"}],"answer":"B","explanation":"根據香港法例第 32 章第 266 條，在破產前特定期間內（關連人士長達 2 年），公司若作出使特定債權人處於優於常規清盤受償地位的行為（Unfair Preference），清盤人可提請法院下令撤銷該抵押或追回資產，回歸全體債權人按比例分配。","reference":""},{"id":"T4-125","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"某上市公司發行 5 年期可換股債券，年利率 1%，附帶持有人可在第 3 年末按面值 105% 回售給公司的認沽期權（Put Option）。在信用評級機構評估該發行人的「流動性再融資指標」時，通常將該債券的「預期存續期（Effective Maturity）」視為：","options":[{"value":"A","label":"5 年"},{"value":"B","label":"3 年（按最早行使 Put Option 的期限計算）"},{"value":"C","label":"10 年"},{"value":"D","label":"0 年（即時列入當日違約）"}],"answer":"B","explanation":"評級機構與審慎風控部門在評估流動性與償債覆蓋率時，採取保守原則（Worst-case Scenario）：若投資者擁有回售權，流動性承諾期必須依據「最早回售行使日（First Put Date）」（即第 3 年末）計算，發行人必須在第 3 年前落實等額流動性儲備。","reference":""},{"id":"T4-126","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"SPAC 的投資者在 De-SPAC 交易召開股東大會表決前，無論其在表決中投贊成票或反對票，均享有下列何種基本法定退場權利？","options":[{"value":"A","label":"股份贖回權（Redemption Right）：有權要求 SPAC 按發售價加計託管賬戶累計利息，全額贖回其所持有的 SPAC 股份"},{"value":"B","label":"強制要求發起人承擔個人無限連帶賠償責任"},{"value":"C","label":"將股份無償兌換為香港政府外匯基金債券"},{"value":"D","label":"永久凍結目標公司所有銀行賬戶"}],"answer":"A","explanation":"依據《上市規則》第 18B.57 條，股份贖回權（Share Redemption）是香港 SPAC 制度保護投資者的核心機制。公眾股東若不認可擬併購的 De-SPAC 目標公司，有權在交易完成前要求以託管專戶全額資金（加利息、扣除法定稅費）全額贖回其持股。","reference":""},{"id":"T4-127","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"依據《香港公司收購及合併守則》第 2.1 條，目標公司董事會在考慮敵意收購要約或結構化融資收購時，必須聘請何種獨立專業機構提供諮詢？","options":[{"value":"A","label":"獨立財務顧問（Independent Financial Adviser, IFA），就收購建議是否公允合理（Fair and Reasonable）向獨立董事委員會出具正式意見函"},{"value":"B","label":"獨立廣告行銷顧問"},{"value":"C","label":"勞工權益保障顧問"},{"value":"D","label":"保險精算公估機構"}],"answer":"A","explanation":"《收購守則》第 2.1 條強制規定，被要約公司董事會必須成立獨立董事委員會，並儘快聘用獲證監會認可的「獨立財務顧問（IFA）」，IFA 必須對全體無利害關係股東發表獨立意見書，論證要約條款之公允性。","reference":""},{"id":"T4-128","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"香港《證券及期貨條例》（SFO）第 107 條規定，任何人士透過欺詐或罔顧後果的陳述，誘使他人訂立可換股證券或期權衍生合約，其最高刑事罰則為：","options":[{"value":"A","label":"罰款 10 萬港元及監禁 1 年"},{"value":"B","label":"罰款 100 萬港元及監禁 7 年"},{"value":"C","label":"罰款 500 萬港元及監禁 7 年"},{"value":"D","label":"終身剝奪所有香港銀行賬戶開立權"}],"answer":"C","explanation":"依據香港 SFO 第 107 條（藉欺詐或罔顧後果的陳述誘使他人投資），一經循公訴程序定罪，最高可判處罰款 500 萬港元及監禁 7 年，嚴厲打擊證券及衍生合約招攬欺詐。","reference":""},{"id":"T4-129","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"在 REIT 的治理架構中，「信託人（Trustee）」與「資產管理公司 / 管理人（REIT Manager）」的法定角色分工是：","options":[{"value":"A","label":"信託人負責日常商業物業租賃營運；管理公司負責銀行託管賬戶保證金"},{"value":"B","label":"管理人負責 REIT 的日常投資與物業組合營運決策；信託人作為獨立第三方，依法代表單位持有人獨立持有物業法定業權，並負責監察管理人的合規運作"},{"value":"C","label":"兩者必須由同一控股公司完全兼任以提升營運效率"},{"value":"D","label":"信託人由政府財政司司長個人直接兼任"}],"answer":"B","explanation":"《REIT 守則》嚴格落實兩權分立：REIT Manager（管理公司）負責戰略規劃、物業租售管理及資產運營；而 Trustee（獨立受託人，通常為大型持牌信託公司）代表全體受益人持有資產業權，監控管理人各項操作是否符合信託契約與法規。","reference":""},{"id":"T4-130","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"當香港法院審理跨境集團破產並考量境外「重組協議安排（Scheme of Arrangement）」的司法效力時，依據普通法衝突原則，高等法院最看重哪一關鍵司法管轄聯繫？","options":[{"value":"A","label":"控股集團首席執行官的國籍"},{"value":"B","label":"目標債券合約管轄法律（Governing Law，如香港法或英國法）以及目標債務人在香港境內是否存在實質資產或足夠司法管轄聯繫（Sufficient Connection）"},{"value":"C","label":"國際貨幣基金組織的調解裁決"},{"value":"D","label":"標的證券在社交媒體上的討論熱度"}],"answer":"B","explanation":"根據著名判例（如 Gibbs 規則），若債務合約受香港法管轄，僅有香港法院的 Scheme 方能合法解除或修改該債務；香港法院在認可境外重組程序時，審查該企業與香港是否存在足夠聯繫（Sufficient Connection）及重組方案是否具備國際可行性與公允性。","reference":""},{"id":"T4-131","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"依據香港《上市規則》，上市公司向第三方金融機構發行「無抵押股本掛鈎票據（Equity-Linked Notes, ELN）」獲取融資時，若票據持有人擁有將票據轉換為普通股的權利，在公司發行授權上：","options":[{"value":"A","label":"完全毋須股東授權，視同一般商業發票"},{"value":"B","label":"必須依據現有股東大會「一般性授權（General Mandate）」或召開股東特別大會取得「特別授權（Specific Mandate）」以覆蓋換股上限"},{"value":"C","label":"只能使用過去已註銷的庫存股份"},{"value":"D","label":"僅需取得香港會計師公會書面備案"}],"answer":"B","explanation":"股本掛鈎票據（ELN）包含換取新股的潛在期權，其本質涉及新股發行。根據《上市規則》第 13.36 條，發行人配發股份或發行附帶認股權的證券，必須受限於常規的一般性授權額度，超額部分必須召開股東大會以特別授權形式由股東批准。","reference":""},{"id":"T4-132","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"根據香港《公司條例》（第 622 章），公司在破產清算前若從事「賤價交易（Transactions at an Undervalue）」（例如以顯著低於市場公允價值的代價向關連人士轉讓核心資產），清盤人可追溯的法定可撤銷審查期間為清盤呈請前多久？","options":[{"value":"A","label":"6 個月"},{"value":"B","label":"1 年"},{"value":"C","label":"5 年"},{"value":"D","label":"10 年"}],"answer":"C","explanation":"依據香港《公司條例》第 265D 條及破產法例，若公司在清盤前 5 年內訂立任何低於公允價值的交易（Transactions at an Undervalue），且在交易進行時或因該交易導致公司無力償還債務，法院可依法頒令將該資產原狀追回或要求受益人予以全額賠償。","reference":""},{"id":"T4-133","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"在 SPAC 制度中，「發起人股份（Promoters' Shares / Founder Shares）」在 De-SPAC 交易完成前，依法受到何種權利限制？","options":[{"value":"A","label":"可以隨意在公開市場向公眾拋售套現"},{"value":"B","label":"依法不享有清算託管賬戶資產的清償分配權，且通常設有嚴格的上市後鎖定期（Lock-up Period）及禁售限制"},{"value":"C","label":"每年必須分取 SPAC 託管賬戶 20% 的利息收益"},{"value":"D","label":"自動享有香港終審法院常任法官的免責豁免"}],"answer":"B","explanation":"Promoters' Shares 成本極低，為防止發起人道德風險，《上市規則》規定發起人股份不得參與 SPAC 清盤時託管賬戶資金的清算分配，且在 De-SPAC 完成後至少 12 個月內受到嚴格禁售期限制。","reference":""},{"id":"T4-134","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"依據《房地產投資信託基金守則》，REIT 的房地產資產組合，原則上每個財政年度必須委聘由受託人批准的「獨立專業估值師（Principal Valuer）」進行至少幾次全面實地資產估值？","options":[{"value":"A","label":"每 5 年一次"},{"value":"B","label":"每年至少一次，並刊載於年報中"},{"value":"C","label":"僅在信託解散時進行"},{"value":"D","label":"每月進行一次高頻估值"}],"answer":"B","explanation":"根據《REIT 守則》第 6 章規定，為確保單位資產淨值（NAV）與資產負債表公允真實，REIT 管理人必須每年至少委聘合資格獨立估值師對旗下所有物業組合進行一次全面公允估值，估值報告摘要須載入年度報告。","reference":""},{"id":"T4-135","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"依據《香港公司收購及合併守則》第 26.3 條，要約人在觸發強制全面要約義務時，其提出的現金收購價格最低標準必須為：","options":[{"value":"A","label":"目標公司最近一期經審計的每股資產淨值（NAV）"},{"value":"B","label":"不得低於要約人或其任何一致行動人士，在要約期內及要約期開始前 6 個月內為購買該類別股份所支付的最高價格"},{"value":"C","label":"過去 5 年平均收市價的 50%"},{"value":"D","label":"目標公司註冊成立時的股份面值"}],"answer":"B","explanation":"《收購守則》第 26.3 條建立最惠條款保護機制。要約定價基準不得低於要約人及其一致行動人士在要約期內及要約期開始前 6 個月內為購買該股份所支付的最高價格，防止大股東在場外給予個別股東溢價而在全面要約中壓低散戶收購價。","reference":""},{"id":"T4-136","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"某上市公司發行票面利率 0% 的「零息可換股債券（Zero-Coupon CB）」，發行價 90 港元，到期面值 100 港元，期限 3 年。若投資者在存續期內均未行使換股權，則發行人在該 3 年內在利潤表中應確認的財務費用（Finance Costs）為：","options":[{"value":"A","label":"0 港元，因票面利息為零"},{"value":"B","label":"按實際利率法（Effective Interest Rate Method）在 3 年內逐年分攤計提該 10 港元的債券折價攤銷作為利息費用"},{"value":"C","label":"在到期日當天一次性確認 90 港元營業外支出"},{"value":"D","label":"將 10 港元直接記入股東未分配利潤"}],"answer":"B","explanation":"根據 IFRS 9 攤餘成本法，零息債券雖無名義利息現金流出，但發行折價（100 - 90 = 10 港元）構成了債務融資實質利息成本。發行人必須以有效內在利率在存續期內逐期攤銷折價，借記財務費用、貸記應付債券賬面價值。","reference":""},{"id":"T4-137","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"在上市公司「供股（Rights Issue）」配合重組發行中，若包銷商（Underwriter）在未獲清洗豁免的情況下因履行包銷責任獲配大量未認購股份，導致持股比例升至 32%，包銷商依法將面臨：","options":[{"value":"A","label":"聯交所自動註銷其持有的股份"},{"value":"B","label":"觸發《收購守則》第 26 條的強制全面要約義務，必須向全體股東發出全面收購建議"},{"value":"C","label":"僅需向香港交易及結算所繳納 1 萬港元手續費"},{"value":"D","label":"依法享有長達 5 年的投票權暫停豁免"}],"answer":"B","explanation":"包銷商包銷新股若未提前取得證監會與獨立股東的清洗豁免（Whitewash Waiver），一旦包銷結果導致其持有投票權達到或超過 30%，法律上自動觸發強制全面要約義務，包銷商必須承擔按最高價全面收購全體股東股份的法律責任。","reference":""},{"id":"T4-138","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"依據《香港公司收購及合併守則》第 30 條，要約人在全面要約中設定的各項接納條件（Conditions），若擬宣告某項條件「未能達成」並據此撤回或終止要約，要約人：","options":[{"value":"A","label":"可以主觀自主決定，毋須任何第三方同意"},{"value":"B","label":"必須取得證監會執行人員的書面同意，且執行人員僅在要約人證明該未能達成條件所引致的情況具備重大實質影響時，方會批准撤回"},{"value":"C","label":"僅需在本地報章刊登普通啟事"},{"value":"D","label":"由目標公司工會主席批准即可"}],"answer":"B","explanation":"為防止要約人隨意反悔，《收購守則》第 30.1 條嚴格規定，未經證監會執行人員同意，要約人不得援引要約條件致使要約失效。執行人員僅在要約人能客觀證明該情況對要約具有極其重大且不可預見之後果時，才可能破例准予撤回。","reference":""},{"id":"T4-139","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"香港《證券及期貨條例》（SFO）第 171 條下的「淡倉申報規則（Short Position Reporting）」，當投資者持有上市公司股本衍生工具（包括融券、可換股債券合成淡倉、賣出期權）合計淨淡倉達到多少門檻時，必須向香港證監會履行每週申報？","options":[{"value":"A","label":"市值達 3,000 萬港元，或佔該上市公司已發行股份總數的 0.02%（二者以較低者為準）"},{"value":"B","label":"必須佔總股本 5%"},{"value":"C","label":"任何淡倉無論金額均須每日每小時實時申報"},{"value":"D","label":"市值達到 5 億港元"}],"answer":"A","explanation":"根據香港證券及期貨（淡倉申報）規則，當投資者於週五收市時對指定上市證券持有的淨空頭頭寸（Net Short Position）達到或超過該發行人已發行股本的 0.02%，或淨空頭市值達到或超過 3,000 萬港元時，必須在隨後兩個營業日內透過證監會網上系統履行申報義務。","reference":""},{"id":"T4-140","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"SPAC 的發起人（Promoters）在資格方面，香港《上市規則》第 18B.10 條要求至少有一名發起人必須為：","options":[{"value":"A","label":"在香港持有有效放債人牌照的企業"},{"value":"B","label":"獲香港證監會認可發牌進行第 6 類（就機構融資提供意見）及/或第 9 類（提供資產管理）受規管活動的持牌法團（且持有至少 10% 發起人股份）"},{"value":"C","label":"香港會計師公會資深會員個人"},{"value":"D","label":"香港總商會名譽會長"}],"answer":"B","explanation":"香港 SPAC 對發起人門檻設有強監管限制，要求至少一名發起人必須為持有 SFC 第 6 類或第 9 類牌照的機構，並持有發起人股份至少 10%，確保其具備專業資產管理與機構並購合規能力。","reference":""},{"id":"T4-141","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"在跨境房地產資本架構中，採用「海外離岸特殊目的載體（Offshore SPV）」持有境內底層物業，並由海外上市公司或 REIT 控股。在清盤實務中，海外法院指派的清盤人若擬處置境內底層資產，其核心法律挑戰為：","options":[{"value":"A","label":"境內物業自動收歸國有"},{"value":"B","label":"境外清盤程序在境內管轄法院的司法承認與協助（Cross-Border Insolvency Recognition），以及境內外匯出境與不動產變更登記之合規審批"},{"value":"C","label":"境內租戶一律免繳租金"},{"value":"D","label":"境內公司法禁止任何外資股權結構"}],"answer":"B","explanation":"跨境破產重組面臨屬地司法管轄壁壘。境外離岸 SPV 的清盤人並不能直接在境內接管不動產，必須依賴內地與香港建立的跨境破產司法協助機制（Mutual Recognition of Insolvency Proceedings），向境內試點法院申請裁定認可其清盤人身分與處分權限。","reference":""},{"id":"T4-142","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"依據《香港公司收購及合併守則》第 18 條，在全面要約截止日（Closing Date），若要約已在所有方面宣布成為無條件（Unconditional in all respects），要約人最遲須在多長時間內向已接納要約的股東支付對價支票或款項？","options":[{"value":"A","label":"2 個營業日內"},{"value":"B","label":"7 個營業日內"},{"value":"C","label":"14 個工作日內"},{"value":"D","label":"30 天內"}],"answer":"B","explanation":"《收購守則》第 20.1 條明確規範交割付款時效：要約人必須在要約成為無條件（或收到完整有效接納文件，二者以較後者為準）之日起計 7 個營業日內，向接納股東完成支付現金對價或證券憑證交付。","reference":""},{"id":"T4-143","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"可換股債券投資分析中，「換股平價（Conversion Parity / Parity Value）」是指：","options":[{"value":"A","label":"債券票面利率除以當前香港銀行同業拆息"},{"value":"B","label":"標的股票當前市場價格乘以換股比率（Conversion Ratio）所計算出的可換股票理論即時市值"},{"value":"C","label":"債券破產清盤時所能收回的基準價值"},{"value":"D","label":"發行人年度營業收入總額除以債券發行張數"}],"answer":"B","explanation":"換股平價公式為：Parity = 標的股票市價 * 換股比率。它反映將一張可轉債即刻轉換為股票後在二級市場出售所得的純股權價值；當債券交易價格高於 Parity 時，高出部分即為轉股溢價。","reference":""},{"id":"T4-144","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"依據香港《上市規則》第 14.84 條，上市公司若被高等法院頒令強制清盤，聯交所將如何處置該上市公司股份的掛牌狀態？","options":[{"value":"A","label":"繼續允許場內自由無限制買賣"},{"value":"B","label":"聯交所通常將立即暫停該公司股份買賣（停牌），若公司未能在規定補救期內達成復牌指引，聯交所將直接行使除牌權益取消其上市地位"},{"value":"C","label":"聯交所出資收購所有流通股"},{"value":"D","label":"自動將其股份免費劃撥給香港特區政府投資基金"}],"answer":"B","explanation":"一旦法院頒發清盤令，董事權利終止並由清盤人接管。聯交所將即時對其股份施加暫停買賣，並給予最長 18 個月（GEM 為 12 個月）的補救期落實復牌條件；若清盤程序無法扭轉，聯交所上市委員會將直接正式予以除牌。","reference":""},{"id":"T4-145","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"依據《房地產投資信託基金守則》，REIT 的資產管理公司若擬進行關連交易（Connected Party Transactions，例如向其控股母公司收購商業地產物業），在治理上必須完成的流程是：","options":[{"value":"A","label":"僅需資產管理公司投資總監單獨簽字確認"},{"value":"B","label":"委任獨立財務顧問（IFA）評估交易條款之公允性、獲獨立董事委員會同意、取得受託人（Trustee）無異議確認，並召開單位持有人大會經獨立持有人表決通過"},{"value":"C","label":"只要收購價格高於賬面價值 10% 即可自動豁免所有大會表決"},{"value":"D","label":"向香港律政司司長申請行政特赦令"}],"answer":"B","explanation":"為防止管理公司向母集團輸送利益，《REIT 守則》對關連交易嚴密審查。重大關連物業收購必須委聘 IFA、由獨立董事審核、受託人確認合規，並在單位持有人大會上由無利害關係持有人投票通過，關連人士全數迴避。","reference":""},{"id":"T4-146","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"根據香港《公司條例》（第 622 章）及衍生工具法律，「衡平法按揭 / 權益質押（Equitable Mortgage of Shares）」在上市公司股權擔保中相較於「法定按揭（Legal Mortgage）」的核心區別在於：","options":[{"value":"A","label":"衡平法按揭不將股份登記過戶至擔保權人名下，而是透過交付實物股票憑證連同已簽署的空白轉讓書（Blank Transfer Form）設立擔保權益"},{"value":"B","label":"法定按揭不需要簽署任何協議文書即可自動生效"},{"value":"C","label":"衡平法按揭享有絕對對抗所有後續善意第三人的最高優先權"},{"value":"D","label":"法定按揭在任何情況下均不可被強制執行"}],"answer":"A","explanation":"法定按揭（Legal Mortgage）會將股份所有權直接在公司股東名冊上過戶給債權人；而衡平法按揭（Equitable Mortgage）保留出質人股東身分，僅向債權人交付股票實物與簽字的空白轉讓文書（以及股東名冊留置或 Stop Notice），在違約前債權人不享有法定股東身分。","reference":""},{"id":"T4-147","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"上市公司發行包含「下有底、上有頂」回報結構的「領子期權掛鈎票據（Equity Collar Notes）」進行股權質押融資，其主要金融工程目標是：","options":[{"value":"A","label":"確保股票價格每天精確上漲 1%"},{"value":"B","label":"透過買入看跌期權（Put）鎖定最低下行清算邊界，同時賣出看漲期權（Call）抵減期權費支出，將股權抵押品的波動風險鎖定在特定安全區間內"},{"value":"C","label":"徹底免除所有印花稅及交易徵費"},{"value":"D","label":"迫使聯交所直接購買其質押股票"}],"answer":"B","explanation":"Collar（領子期權）融資架構是投行與大股東常用的結構化風險管理策略。透過建立「Protection Put」防範股價暴跌遭強制平倉補倉，同時藉由售出「Cap Call」獲取權利金覆蓋成本，以極低成本鎖定保證金安全邊界。","reference":""},{"id":"T4-148","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"在 SPAC 清盤並向投資者返還資金的流程中，依據《上市規則》第 18B.74 條，SPAC 託管賬戶內的累計利息及本金在退還給公眾股東時，下列處置方式何者正確？","options":[{"value":"A","label":"必須按比例全數返還給持有 SPAC 首次發售股份的公眾股東（扣除獲准許的開支及法定稅項）"},{"value":"B","label":"利息收入依法全額沒收充公"},{"value":"C","label":"發起人有權優先扣留 50% 作為諮詢費"},{"value":"D","label":"必須將款項轉換為香港迪士尼樂園門票返還股東"}],"answer":"A","explanation":"根據香港 SPAC 制度規定，若 SPAC 未能在規定期限內落實 De-SPAC 交易，該 SPAC 必須在 1 個月內清盤；託管賬戶中的 100% 募集款項連同應計利息，必須嚴格按每股比例全數原路返還予全體公眾股東。","reference":""},{"id":"T4-149","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"上市公司向主要債權銀行提供資產抵押時，若在浮動押記條款中增設「自動結晶化（Automatic Crystallisation）」約定，該約定的觸發效果是：","options":[{"value":"A","label":"當發生特定約定事件（如借款人停業、被提出清盤呈請或面臨執行扣押）時，浮動押記毋須債權人發出任何通知，即刻自動轉化為對當時所有現存資產的固定押記"},{"value":"B","label":"發行人債務自動免除"},{"value":"C","label":"標的資產立即無償轉移給香港金融管理局託管"},{"value":"D","label":"銀行自動獲得上市公司 100% 普通股投票權"}],"answer":"A","explanation":"自動結晶化條款約定，一旦出現指定危機事件（如查封、破產呈請、另設抵押違約），原本 floating 的押記自動 crystallise 成 fixed charge，即時凍結資產處置權並提升清算對抗順位，毋須債權人先行介入或寄送正式接管通知。","reference":""},{"id":"T4-150","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"依據《香港公司收購及合併守則》第 36 條，證監會收購及合併委員會（Takeovers and Mergers Panel）對蓄意嚴重違反《收購守則》的市場參與者或中介顧問機構，可實施的最嚴厲非司法行政制裁為：","options":[{"value":"A","label":"沒收其在香港的所有個人房產"},{"value":"B","label":"發出「冷淡對待令（Cold-shoulder Order）」，指令所有註冊中介人及持牌法團在指明期限內（如數年）完全不得直接或間接代表該受制裁人士進行任何香港證券市場交易"},{"value":"C","label":"判處拘役 14 天"},{"value":"D","label":"強制要求其親屬承擔民事連帶賠償責任"}],"answer":"B","explanation":"「冷淡對待令（Cold-shoulder Order）」是證監會收購委員會最強大的監管利器。一旦頒布，全港所有持牌券商、銀行、企業融資顧問等中介機構依法在合規期內被禁止為該人士提供任何證券買賣與融資服務，實質上將該違規者徹底驅逐出香港資本市場。","reference":""}];
let quiz=[],idx=0,score=0,skipped=0,submitted=false,lastConfig={},currentUser=null,attemptId=null,attemptStartedAt=null,libraryFilter='done',questionPool=[];
const RECORD_KEY='hksi_paper5_records_v2', WRONG_KEY='hksi_paper5_wrong_v2', MARKED_KEY='hksi_paper5_marked_v1', DONE_KEY='hksi_paper5_done_v1', PROFILE_KEY='hksi_quiz_profile_v1';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function getLocalRecords(){try{return JSON.parse(localStorage.getItem(RECORD_KEY)||'[]')}catch(e){return[]}}
function saveLocalRecords(a){localStorage.setItem(RECORD_KEY,JSON.stringify(a.slice(0,50)))}
function getLocalWrongIds(){try{return JSON.parse(localStorage.getItem(WRONG_KEY)||'[]')}catch(e){return[]}}
function saveLocalWrongIds(a){localStorage.setItem(WRONG_KEY,JSON.stringify([...new Set(a)]))}
function localAddWrong(id){let a=getLocalWrongIds();if(!a.includes(id))a.push(id);saveLocalWrongIds(a)}
function localRemoveWrong(id){saveLocalWrongIds(getLocalWrongIds().filter(x=>x!==id))}
function getLocalIds(key){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch(e){return[]}}
function saveLocalIds(key,a){localStorage.setItem(key,JSON.stringify([...new Set(a)]))}
function isMarked(id){return getLocalIds(MARKED_KEY).includes(id)}
function updateMarkButton(){let b=$('markBtn');if(!b||!quiz[idx])return;let marked=isMarked(quiz[idx].id);b.textContent=marked?'★ 已標記':'☆ 標記題目';b.classList.toggle('marked',marked)}
async function toggleCurrentMark(){let q=quiz[idx];if(!q)return;let marked=isMarked(q.id);if(currentUser&&sb){let query=sb.from('marked_questions');let result=marked?await query.delete().eq('user_id',currentUser.id).eq('question_id',q.id):await query.upsert({user_id:currentUser.id,question_id:q.id,marked_at:new Date().toISOString()},{onConflict:'user_id,question_id'});if(result.error)console.error(result.error)}let ids=getLocalIds(MARKED_KEY);saveLocalIds(MARKED_KEY,marked?ids.filter(x=>x!==q.id):[...ids,q.id]);updateMarkButton();renderLibrary()}
async function syncMarkedFromCloud(){if(!currentUser)return;let {data,error}=await sb.from('marked_questions').select('question_id').eq('user_id',currentUser.id);if(!error)saveLocalIds(MARKED_KEY,(data||[]).map(x=>x.question_id))}
function uniq(a){return [...new Set(a)].sort()}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildQuiz(pool,n,random){questionPool=random?shuffle(pool):[...pool];return questionPool.slice(0,Math.min(n,pool.length)).map(q=>({...q,options:[...q.options].sort((a,b)=>a.value.localeCompare(b.value))}))}
function fill(){
 $('total').textContent=BANK.length;
 $('topic').innerHTML='<option value="all">全部 Topic</option>'+uniq(BANK.map(q=>q.topic)).map(x=>`<option>${esc(x)}</option>`).join('');
 $('difficulty').innerHTML='<option value="all">全部難度</option>'+uniq(BANK.map(q=>q.difficulty)).map(x=>`<option>${esc(x)}</option>`).join('');
 updateAuthUI(); updateWrongUI(); loadRecords(); renderLibrary();
}
function show(id){['home','quiz','result'].forEach(x=>$(x).classList.toggle('hidden',x!==id));if(id==='home'){updateWrongUI();loadRecords()}scrollTo(0,0)}
function localWrongIds(){return getLocalWrongIds()}

async function initAuth(){
 if(!SUPABASE_ENABLED){$('authBox').classList.remove('hidden');$('authStatus').classList.remove('hidden');$('authStatus').textContent='目前尚未填入 Supabase 設定；網站仍可使用本機模式。';$('recordModeText').textContent='本機模式：完成紀錄及錯題只保存於目前瀏覽器。';return}
 const {data:{session}}=await sb.auth.getSession(); currentUser=session?.user||null; updateAuthUI(); await syncWrongFromCloud(); await syncMarkedFromCloud(); await loadRecords(); renderLibrary();
 sb.auth.onAuthStateChange(async (_event,session)=>{currentUser=session?.user||null;updateAuthUI();if(currentUser){await ensureProfile();await syncWrongFromCloud();await syncMarkedFromCloud();await loadRecords();renderLibrary()}});
}
function updateAuthUI(){
 const logged=!!currentUser;
 $('logoutBtn').classList.toggle('hidden',!logged);
 $('signedInEmail').classList.toggle('hidden',!logged);
 $('signedInEmail').textContent=logged?`已登入：${currentUser.email||'目前帳戶'}`:'';
 $('profileBox').classList.toggle('hidden',!logged);
 if(SUPABASE_ENABLED && !logged){$('authBox').classList.remove('hidden');$('recordModeText').textContent='未登入：本機保存。登入後：成績及錯題同步到 Supabase。'}
 else if(logged){$('authBox').classList.add('hidden');$('recordModeText').textContent='已登入：完成紀錄及錯題會同步到 Supabase。'}
}
async function sendMagicLink(){
 if(!SUPABASE_ENABLED){alert('請先在 HTML 內填入 Supabase URL 和 anon key。');return}
 const email=$('email').value.trim(); if(!email){alert('請輸入 Email。');return}
 const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true}});
 $('authStatus').classList.remove('hidden');
 $('otpRow').classList.toggle('hidden',!!error);
 $('authStatus').textContent=error?('登入失敗：'+error.message):'驗證碼已發送，請查看 Email，並在此頁輸入 6 位數驗證碼。';
 $('authStatus').className='status '+(error?'bad':'good');
}
async function verifyEmailCode(){
 if(!SUPABASE_ENABLED)return;
 const email=$('email').value.trim(),token=$('otp').value.trim();
 if(!email||!/^\d{6,8}$/.test(token)){alert('請輸入 Email 及 6 至 8 位數驗證碼。');return}
 const {error}=await sb.auth.verifyOtp({email,token,type:'email'});
 $('authStatus').classList.remove('hidden');
 $('authStatus').textContent=error?('驗證失敗：'+error.message):'登入成功，正在同步你的資料。';
 $('authStatus').className='status '+(error?'bad':'good');
 if(!error){$('otp').value='';$('otpRow').classList.add('hidden')}
}
async function logout(){if(sb) await sb.auth.signOut();currentUser=null;updateAuthUI();await loadRecords()}
async function ensureProfile(){
 if(!currentUser)return;
 const saved=localStorage.getItem(PROFILE_KEY)||currentUser.email?.split('@')[0]||'學習者';
 $('displayName').value=saved;
 await sb.from('profiles').upsert({id:currentUser.id,display_name:saved},{onConflict:'id'});
}
async function saveProfile(){
 if(!currentUser)return;
 const name=$('displayName').value.trim()||'學習者';
 localStorage.setItem(PROFILE_KEY,name);
 const {error}=await sb.from('profiles').upsert({id:currentUser.id,display_name:name},{onConflict:'id'});
 $('profileStatus').classList.remove('hidden');$('profileStatus').textContent=error?('保存失敗：'+error.message):'名稱已保存。';$('profileStatus').className='status '+(error?'bad':'good');
}
async function cloudWrongIds(){
 if(!currentUser)return[];
 const {data,error}=await sb.from('wrong_questions').select('question_id').eq('user_id',currentUser.id);
 if(error){console.error(error);return[]}
 return (data||[]).map(x=>x.question_id);
}
async function syncWrongFromCloud(){
 if(!currentUser)return;
 const ids=await cloudWrongIds(); saveLocalWrongIds(ids);
}
async function addWrong(id){
 if(currentUser){
   const {error}=await sb.from('wrong_questions').upsert({user_id:currentUser.id,question_id:id,last_wrong_at:new Date().toISOString()},{onConflict:'user_id,question_id'});
   if(error)console.error(error);
 }
 localAddWrong(id); updateWrongUI();
}
async function removeWrong(id){
 if(currentUser){
   const {error}=await sb.from('wrong_questions').delete().eq('user_id',currentUser.id).eq('question_id',id);
   if(error)console.error(error);
 }
 localRemoveWrong(id); updateWrongUI();
}
function getWrongIds(){return localWrongIds()}
function updateWrongUI(){let n=getWrongIds().length;$('wrongBankCount').textContent=n;$('redoWrongBtn').disabled=!n}
async function startQuiz(){
 let t=$('topic').value,d=$('difficulty').value,n=+$('count').value;
 let pool=BANK.filter(q=>(t==='all'||q.topic===t)&&(d==='all'||q.difficulty===d));
 if(!pool.length){alert('沒有符合條件的題目，請調整設定。');return}
 let random=$('shuffle').checked;quiz=buildQuiz(pool,n,random);lastConfig={t,d,n,random,mode:'normal'};idx=0;score=0;skipped=0;attemptId=null;attemptStartedAt=new Date().toISOString();show('quiz');renderQuestion();
}
async function startWrongQuiz(){
 let ids=getWrongIds(),pool=BANK.filter(q=>ids.includes(q.id));
 if(!pool.length){alert('目前沒有錯題。');return}
 let random=$('shuffle').checked;quiz=buildQuiz(pool,pool.length,random);lastConfig={mode:'wrong',random};idx=0;score=0;skipped=0;attemptId=null;attemptStartedAt=new Date().toISOString();show('quiz');renderQuestion();
}
function setLibraryFilter(filter){libraryFilter=filter;document.querySelectorAll('[data-library-filter]').forEach(b=>b.classList.toggle('active',b.dataset.libraryFilter===filter));renderLibrary()}
function startLibraryQuiz(id){let q=BANK.find(x=>x.id===id);if(!q)return;let random=$('shuffle').checked;quiz=buildQuiz([q],1,random);lastConfig={mode:'library',random};idx=0;score=0;skipped=0;attemptId=null;attemptStartedAt=new Date().toISOString();show('quiz');renderQuestion()}
function renderLibrary(){let ids=libraryFilter==='wrong'?getLocalWrongIds():libraryFilter==='marked'?getLocalIds(MARKED_KEY):getLocalIds(DONE_KEY);let qs=BANK.filter(q=>ids.includes(q.id));$('libraryList').innerHTML=qs.length?qs.map(q=>`<div class="library-item"><h3>${esc(q.id)} · ${esc(q.topic)} · ${esc(q.subtopic)}</h3><p>${esc(q.question)}</p><div class="item-actions"><button class="secondary" onclick="startLibraryQuiz('${esc(q.id)}')">練習此題</button>${libraryFilter==='marked'?`<button class="ghost" onclick="removeLibraryMark('${esc(q.id)}')">取消標記</button>`:''}</div></div>`).join(''):`<div class="small">目前沒有${libraryFilter==='done'?'已做過':libraryFilter==='wrong'?'錯題':'已標記'}題目。</div>`}
async function removeLibraryMark(id){let ids=getLocalIds(MARKED_KEY);saveLocalIds(MARKED_KEY,ids.filter(x=>x!==id));if(currentUser&&sb)await sb.from('marked_questions').delete().eq('user_id',currentUser.id).eq('question_id',id);renderLibrary();updateMarkButton()}
function renderQuestion(){
 submitted=false;$('fb').innerHTML='';$('next').classList.add('hidden');$('submit').classList.remove('hidden');$('skipBtn').classList.remove('hidden');$('redrawBtn').classList.remove('hidden');
 let q=quiz[idx];$('counter').textContent=`第 ${idx+1} / ${quiz.length} 題`;$('topicline').textContent=`${q.topic||''} · ${q.subtopic||''}`;$('diff').textContent=q.difficulty||'';$('progress').style.width=(idx/quiz.length*100)+'%';updateMarkButton();
 $('question').innerHTML=`<div class="q">${esc(q.question)}</div>`+q.options.map(o=>`<label class="option"><input type="radio" name="ans" value="${esc(o.value)}"><span class="letter">${esc(o.value)}</span><span>${esc(o.label)}</span></label>`).join('');
}
async function submitAnswer(){
 if(submitted)return;let q=quiz[idx],sel=document.querySelector('input[name="ans"]:checked');if(!sel){alert('請先選擇一個答案。');return}
 q.__user=sel.value;submitted=true;let ok=sel.value===q.answer;if(ok){score++;await removeWrong(q.id)}else await addWrong(q.id);saveLocalIds(DONE_KEY,[...getLocalIds(DONE_KEY),q.id]);
 document.querySelectorAll('input[name="ans"]').forEach(x=>x.disabled=true);$('submit').classList.add('hidden');$('skipBtn').classList.add('hidden');$('redrawBtn').classList.add('hidden');$('next').classList.remove('hidden');$('next').textContent=idx===quiz.length-1?'查看結果':'下一題';
 $('fb').innerHTML=`<div class="feedback ${ok?'correct':'wrong'}"><b>${ok?'✓ 答對':'✕ 答錯'}</b>　正確答案：${esc(q.answer)}<br>${esc(q.explanation||'')}</div><div class="refs">Reference: ${esc(q.reference||'')}</div>`;
}
function advanceAfterUnanswered(){if(idx<quiz.length-1){idx++;renderQuestion()}else finish()}
function skipQuestion(){if(submitted)return;quiz[idx].__skipped=true;skipped++;advanceAfterUnanswered()}
function redrawQuestion(){
 if(submitted)return;
 const current=quiz[idx];
 const activeIds=new Set(quiz.filter((q,i)=>i!==idx).map(q=>q.id));
 const candidates=questionPool.filter(q=>q.id!==current.id&&!activeIds.has(q.id));
 const source=candidates.length?candidates:questionPool.filter(q=>q.id!==current.id);
 if(!source.length){alert('目前沒有其他題目可供重新抽取。');return}
 const picked=source[Math.floor(Math.random()*source.length)];
 const replacement={...picked,options:[...picked.options].sort((a,b)=>a.value.localeCompare(b.value))};
 quiz[idx]=replacement;renderQuestion();
}
async function nextQuestion(){if(idx<quiz.length-1){idx++;renderQuestion()}else await finish()}
async function finish(){
 let answered=quiz.filter(q=>q.__user),wrongIds=answered.filter(q=>q.__user!==q.answer).map(q=>q.id),accuracy=Math.round(score/(answered.length||1)*100);
 let rec={id:crypto.randomUUID?.()||String(Date.now()),time:new Date().toISOString(),score,total:quiz.length,accuracy,mode:lastConfig.mode||'normal',topic:lastConfig.t||'all',difficulty:lastConfig.d||'all',wrongIds};
 let syncMessage='本次成績已保存於本機。';
 if(currentUser && sb){
   const {data:attempt,error:ae}=await sb.from('quiz_attempts').insert({user_id:currentUser.id,mode:rec.mode,topic:rec.topic,difficulty:rec.difficulty,total_questions:rec.total,correct_count:rec.score,accuracy:rec.accuracy,started_at:attemptStartedAt||rec.time,completed_at:rec.time}).select().single();
   if(ae){console.error(ae);syncMessage='本次成績未能同步到雲端，已保留本機紀錄。'}
   else{
     attemptId=attempt.id;
     const rows=quiz.map(q=>({attempt_id:attempt.id,user_id:currentUser.id,question_id:q.id,selected_answer:q.__user||null,correct_answer:q.answer,is_correct:q.__user? q.__user===q.answer:null}));
     const {error:ansErr}=await sb.from('quiz_answers').insert(rows); if(ansErr)console.error(ansErr);
     syncMessage='✓ 本次成績、每題答案及錯題狀態已同步到 Supabase。';
   }
 }
 let rs=getLocalRecords();rs.unshift(rec);saveLocalRecords(rs);
 show('result');$('score').textContent=`${score} / ${answered.length}`;$('correctN').textContent=score;$('wrongN').textContent=wrongIds.length;$('skippedN').textContent=skipped;$('pct').textContent=accuracy+'%';$('syncStatus').textContent=syncMessage;$('syncStatus').className='status '+(syncMessage.startsWith('✓')?'good':'');
 $('redoResultWrong').style.display=wrongIds.length?'inline-block':'none';
 $('reviews').innerHTML=quiz.map((q,i)=>{let key=q.__user||'';return q.__skipped||key===q.answer?'':`<div class="review"><h3>${i+1}. ${esc(q.question)}</h3><div class="answer">你的答案：${esc(key||'未作答')}<br>正確答案：${esc(q.answer)}</div><p>${esc(q.explanation||'')}</p><div class="refs">${esc(q.reference||'')}</div></div>`}).join('')||'<p class="small">今次沒有答錯題目。</p>';
}
async function loadRecords(){
 if(!currentUser || !sb){renderRecords(getLocalRecords());return}
 const {data,error}=await sb.from('quiz_attempts').select('*').eq('user_id',currentUser.id).order('completed_at',{ascending:false}).limit(20);
 if(error){console.error(error);renderRecords(getLocalRecords());return}
 renderRecords((data||[]).map(r=>({id:r.id,time:r.completed_at,score:r.correct_count,total:r.total_questions,accuracy:r.accuracy,mode:r.mode,topic:r.topic,difficulty:r.difficulty})));
}
function renderRecords(rs){
 $('records').innerHTML=rs.length?rs.slice(0,10).map(r=>{let dt=new Date(r.time);let mode=r.mode==='wrong'?'錯題重做':'一般練習';return `<div class="record"><div class="record-main"><b>${mode}</b><br><span class="small">${dt.toLocaleString('zh-HK')} · ${r.topic==='all'?'全部 Topic':esc(r.topic)} · ${r.total} 題</span></div><div class="record-score">${r.score}/${r.total}<br><span class="small">${r.accuracy}%</span></div></div>`}).join(''):'<div class="small">暫時沒有完成紀錄。</div>';
}
function clearLocalRecords(){if(confirm('確定要清除本機紀錄嗎？雲端紀錄不會被刪除。')){localStorage.removeItem(RECORD_KEY);loadRecords()}}
function restartSame(){if(lastConfig.mode==='wrong')startWrongQuiz();else startQuizFromConfig()}
function startQuizFromConfig(){let t=lastConfig.t,d=lastConfig.d,n=lastConfig.n,random=lastConfig.random;let pool=BANK.filter(q=>(t==='all'||q.topic===t)&&(d==='all'||q.difficulty===d));quiz=buildQuiz(pool,n,random);idx=0;score=0;skipped=0;attemptId=null;attemptStartedAt=new Date().toISOString();show('quiz');renderQuestion()}
function redoWrongFromResult(){startWrongQuiz()}
function home(){show('home')}
fill();initAuth();
</script>
</body></html>
