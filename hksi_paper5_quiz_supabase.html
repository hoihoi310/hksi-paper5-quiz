nary resolution，即出席大會並投票的過半數表決權贊成）即可罷免任何董事"},{"value":"C","label":"必須以 75% 特別多數決議案通過"},{"value":"D","label":"必須由全體獨立非執董全票贊成"}],"answer":"B","explanation":"指南 2-18 頁 3.38 節及 MBLR Appendix A1 para 4(1) 規定：發行人在股東大會上，股東有權透過通過普通決議案（Ordinary resolution）罷免任何任期未屆滿的董事，即使其章程細則或服務合約另有相反約定。","reference":"MBLR Appendix A1; HKSI Paper 5 Guide Topic 2 Section 3.38"},{"id":"T2-316","topic":"Topic 2","subtopic":"INED Long-Serving Limit (9 Years) Absolute Ceiling Timeline","difficulty":"Level 3","question":"根據聯交所全面收緊董事會獨立性的最新過渡安排，上市發行人董事會中所有任期超過九年的「超期獨立非執行董事」（Long-serving INEDs），最遲必須在何時之前全面退出該發行人的董事會（屆時發行人板上不得有任何任期達 9 年或以上的 INED）？","options":[{"value":"A","label":"2024 年 12 月 31 日前"},{"value":"B","label":"2031 年 7 月 1 日前（By 1 July 2031 it must not have any such INEDs on its board）"},{"value":"C","label":"2050 年 1 月 1 日前"},{"value":"D","label":"發行人在任何時候均可永久維持超期 INED 連任"}],"answer":"B","explanation":"指南 2-16 頁 3.29 節註釋 1 及 MBLR 3.13A 指明：過渡期安排規定發行人在 2028 年 7 月 1 日前不得由超期 INED 佔多數，而至 2031 年 7 月 1 日起，發行人董事會內絕對不得再包含任何任期達到或超過 9 年的 INED（全面落實任期上限）。","reference":"MBLR 3.13A; HKSI Paper 5 Guide Topic 2 Section 3.29 Note 1"},{"id":"T2-317","topic":"Topic 2","subtopic":"INED Re-appointment after 9 Years - 3-Year Gap Rule","difficulty":"Level 3","question":"某獨立非執行董事在某上市公司任職滿 9 年並退任。根據主板第 3.13A 條，該人士在退任後若擬重新獲委任為該「同一發行人」的獨立非執行董事，其必須度過多長的冷卻期？","options":[{"value":"A","label":"退任後 3 個月"},{"value":"B","label":"在緊接重新委任前至少三年內未曾擔任該發行人、其母公司或附屬公司的任何董事職務（Not served as director within preceding three years）"},{"value":"C","label":"退任後 10 年"},{"value":"D","label":"一旦任職滿 9 年，終身絕對不得再出任該發行人的任何董事"}],"answer":"B","explanation":"指南 2-15 至 2-16 頁 3.29 節及 MBLR 3.13A 規定：任期滿 9 年的 INED 可在離任滿 3 年後（Preceding three years 內無擔任發行人、控股公司或附屬公司董事），且仍滿足獨立性各項測試下，重新獲委任為該發行人的 INED。","reference":"MBLR 3.13A; HKSI Paper 5 Guide Topic 2 Section 3.29"},{"id":"T2-318","topic":"Topic 2","subtopic":"Controlling Shareholder Identification - Corporate SPV Presumption","difficulty":"Level 3","question":"某擬上市公司的控股權由一間設於離岸的特定目的投資法團（SPV）持有。在保薦人盡職調查及向聯交所申報時，聯交所對該 SPV 股東的推定規則是：","options":[{"value":"A","label":"聯交所僅認可該 SPV 法人實體，嚴禁穿透其背後股東名冊"},{"value":"B","label":"聯交所將推定該 SPV 的全體背後股東均屬於上市申請人的控股股東（Presume all shareholders of the corporate body to be controlling shareholders），除非申請人成功提出客觀事實予以反駁"},{"value":"C","label":"該 SPV 自動被沒收上市資格"},{"value":"D","label":"SPV 股東無須遵守任何上市後禁售期"}],"answer":"B","explanation":"指南 2-19 頁 3.43 節及聯交所指引指明：若控股股東為 SPV 投資工具，聯交所會推定該實體的所有股東均屬控股股東（Presume all shareholders to be controlling shareholders），發行人若要排除個別少數被動財務投資人，必須主動提呈實質證據反駁該推定。","reference":"HKEX Guidance; HKSI Paper 5 Guide Topic 2 Section 3.43"},{"id":"T2-319","topic":"Topic 2","subtopic":"Share Repurchases - Out of Capital Prohibition (s. 257 CO)","difficulty":"Level 2","question":"根據香港《公司條例》（Cap. 622）第 257 條，一間在香港註冊成立的上市公司，在聯交所認可市場進行股份購回時，受到下列哪項資本保全規定的嚴格禁止？","options":[{"value":"A","label":"禁止以公司未分配溢利回購股份"},{"value":"B","label":"嚴禁以公司股本付款（Prohibits making a payment out of capital）進行其在認可證券市場上的本身股份購回"},{"value":"C","label":"禁止向持牌經紀行支付正常交易佣金"},{"value":"D","label":"回購時必須強制發行等額的債權證"}],"answer":"B","explanation":"指南 2-25 頁 5.7 節及《公司條例》s. 257 明確規定：香港上市公司在認可股票市場（如聯交所）或核准市場進行的股份購回，依法嚴禁以股本付款（Prohibited from making payment out of capital），必須以可分派利潤或為此目的發行新股的所得款項支付。","reference":"Companies Ordinance s.257; HKSI Paper 5 Guide Topic 2 Section 5.7"},{"id":"T2-320","topic":"Topic 2","subtopic":"Share Repurchases - Core Connected Person Restriction","difficulty":"Level 2","question":"根據主板第 10.06(2)(c) 條，上市發行人在聯交所場內進行股份購回時，在交易對手方面受到何種合規限制？","options":[{"value":"A","label":"發行人只能向其董事長買入股份"},{"value":"B","label":"發行人不得在明知情況下，在聯交所向其「核心關連人士」（Core Connected Person）購買其本身的股份，而核心關連人士亦不得在明知下在場內向發行人出售股份"},{"value":"C","label":"核心關連人士享有優先向發行人售股的法定權利"},{"value":"D","label":"對手方身份完全不受任何限制"}],"answer":"B","explanation":"指南 2-25 頁 5.6(c) 節及 MBLR 10.06(2)(c) 規定：發行人不得在知情下向核心關連人士購買股份（Restriction on purchases from core connected persons），核心關連人士亦不得知情售予發行人，以維護市場公允並防止關連利益輸送。","reference":"MBLR 10.06(2)(c); HKSI Paper 5 Guide Topic 2 Section 5.6(c)"},{"id":"T2-321","topic":"Topic 2","subtopic":"Stock Borrowing Exemption under MBLR 10.07(3) - S&L Conditions","difficulty":"Level 3","question":"在主板 IPO 穩定價格機制中，控股股東向整體協調人出借股票以滿足超額配股權，若要完全豁免於首 6 個月禁售期處分，根據 MBLR 第 10.07(3) 條，該借股安排必須符合的條件包括：","options":[{"value":"A","label":"借股數量不受任何限制，控股股東可將全部股份借出並收取三倍利息"},{"value":"B","label":"出借股份僅限於滿足超額分配需求、所借出股份上限不得超過超額配股權獲准發行股數上限、借出股份必須在行使超額配股權或穩定價格期結束後及時歸還，且借股未導致控股股東收取非常規商業代價"},{"value":"C","label":"控股股東必須即時將所借股份所得收益贈與發行人"},{"value":"D","label":"該借股協議必須由證監會法規執行部直接擔保"}],"answer":"B","explanation":"指南 2-74 至 2-75 頁 10.24(b) 節註釋及 MBLR 10.07(3) 規定：借股豁免核心條件為：借股純粹用於結算超額分配、數量嚴格以綠鞋上限為限、期滿必須按期如數歸還股份，確保非假借穩定價格之名行大股東違規減持之實。","reference":"MBLR 10.07(3); PS Rules; HKSI Paper 5 Guide Topic 2 Section 10.24(b)"},{"id":"T2-322","topic":"Topic 2","subtopic":"Stabilizing Actions - Primary Stabilizing Actions Definition","difficulty":"Level 1","question":"根據《證券及期貨（穩定價格）規則》（PS Rules），下列哪項交易被法規明確界定為「首要穩定價格行動」（Primary Stabilizing Action）？","options":[{"value":"A","label":"在二級市場行使超額配售權出售額外股份"},{"value":"B","label":"在二級市場購買相關證券，其目的在於防止或盡量減低該等證券在市場價格上的下跌（Buying securities for the purpose of preventing or minimising a reduction in the market price）"},{"value":"C","label":"向大股東發出借股通知書"},{"value":"D","label":"在報章上刊登護盤成功慶祝啟事"}],"answer":"B","explanation":"指南 2-74 頁 10.24(a) 節及 PS Rules 明確定義：首要穩定價格行動（Primary stabilizing action）是指在市場上買入證券，其專門目的為阻止或減緩新上市證券在上市初期的市場跌勢。","reference":"PS Rules; HKSI Paper 5 Guide Topic 2 Section 10.24(a)"},{"id":"T2-323","topic":"Topic 2","subtopic":"Stabilizing Actions - Ancillary Actions Definition","difficulty":"Level 2","question":"根據 PS Rules，下列哪一項行動屬於穩定價格操作人獲准執行的「附帶穩定價格行動」（Ancillary Stabilizing Actions）？","options":[{"value":"A","label":"在市場上大額沽空未借入的證券"},{"value":"B","label":"出售在首要穩定價格行動中買入的證券，或行使超額配股權以建立空頭頭寸藉以在二級市場回購平倉"},{"value":"C","label":"要求發行人解散現有董事會"},{"value":"D","label":"私下向未中籤投資者退回雙倍認購款"}],"answer":"B","explanation":"指南 2-74 頁 10.24(b) 節及 PS Rules 指明：附帶行動（Ancillary actions）包括：(1) 出售在首要行動中購入的股份以清結存貨；及 (2) 行使超額配售權超額分配股份，以便在市場價格低於招股價時從二級市場買回股份平倉護盤。","reference":"PS Rules; HKSI Paper 5 Guide Topic 2 Section 10.24(b)"},{"id":"T2-324","topic":"Topic 2","subtopic":"Stabilizing Actions - Single Security Scope Restriction","difficulty":"Level 2","question":"根據《穩定價格規則》，穩定價格操作人在執行護盤操作時，在交易標的範圍上受到何種嚴格限定？","options":[{"value":"A","label":"操作人可以自由買賣掛鉤該發行人的股指期貨合約以拉抬股價"},{"value":"B","label":"穩定價格行動「僅限於在相關證券本身進行」（Only in the relevant securities），嚴禁透過買賣相關證券的衍生工具或可換股債券來間接穩定該股份的價格"},{"value":"C","label":"操作人可隨意買賣發行人控股股東旗下的其他上市姐妹公司股票"},{"value":"D","label":"交易標的可以是任何香港藍籌股"}],"answer":"B","explanation":"指南 2-75 頁 10.26 節及 PS Rules 明文規定：價格穩定操作僅能針對發售的相關證券本身（Relevant securities）進行，不得透過交易衍生工具、結構性票據或可轉債等旁路工具來干預標的股票價格。","reference":"PS Rules; HKSI Paper 5 Guide Topic 2 Section 10.26"},{"id":"T2-325","topic":"Topic 2","subtopic":"Stabilizing Actions - Undisclosed Options Conflicts Restriction","difficulty":"Level 3","question":"根據 PS Rules，在下列哪種利益衝突情形下，穩定價格操作人絕對**不得**對某新發行證券開展任何穩定價格行動？","options":[{"value":"A","label":"操作人持有該發行人所開立的普通商業結算戶口"},{"value":"B","label":"操作人或其聯繫人就該項發售持有針對該證券的期權（Options），且該等期權的條款未有按照規則向公眾充分披露"},{"value":"C","label":"操作人總部位於中環金融中心"},{"value":"D","label":"操作人的全體員工均按月領取常規薪金"}],"answer":"B","explanation":"指南 2-75 頁 10.27(c) 節及 PS Rules 規定：若穩定價格操作人或其聯繫人持有該擬穩定證券的期權合約，且未依法向公眾充分披露其條款，則嚴禁開展穩定價格行動，以防止操作人利用護盤為其未公開期權頭寸牟取私利。","reference":"PS Rules; HKSI Paper 5 Guide Topic 2 Section 10.27(c)"},{"id":"T2-326","topic":"Topic 2","subtopic":"Underwriting Syndication - Placing Agreement Conditional on Public Offer","difficulty":"Level 2","question":"在結合公開發售（零售）與配售（機構）的常規香港 IPO 承銷架構中，兩份包銷協議在簽署與生效上的標準市場常規是：","options":[{"value":"A","label":"配售協議在招股書註冊前簽訂，公開發售協議在掛牌滿一年後簽訂"},{"value":"B","label":"公開發售包銷協議在招股章程註冊前簽訂；而國際配售協議通常在簿記建檔及完成定價後簽署，且兩份承銷協議的生效通常「互為先決條件」（Normally conditional upon one another）"},{"value":"C","label":"兩份協議完全獨立且法律上嚴禁任何相互關聯"},{"value":"D","label":"兩份協議均必須由證監會親自作為當事人簽署"}],"answer":"B","explanation":"指南 2-71 頁 10.4–10.6 節指明：公開發售協議在招股書註冊前簽訂以供刊印；配售協議則在完成定價及機構訂單建立後簽署，兩份包銷協議的執行與交割在常規條款下互為條件（Conditional upon one another）。","reference":"HKSI Paper 5 Guide Topic 2 Section 10.4-10.6"},{"id":"T2-327","topic":"Topic 2","subtopic":"IPO Roadshow and Bookbuilding Process","difficulty":"Level 1","question":"在香港 IPO 籌備過程中，由發行人高級管理層直接向潛在專業機構投資者親身推介公司業務戰略、增長故事及財務亮點的正式過程，在資本市場術語中稱為：","options":[{"value":"A","label":"冷淡對待程序（Cold shoulder process）"},{"value":"B","label":"路演（Roadshow）"},{"value":"C","label":"協議安排（Scheme of arrangement）"},{"value":"D","label":"場外股份回購（Off-market share buy-back）"}],"answer":"B","explanation":"指南 2-71 至 2-72 頁 10.8 節指明：路演（Roadshow）是指由發行人的高級管理人員正式向機構投資者親身講解投資故事與業務亮點的推介過程，通常與承銷商的簿記建檔（Book-building）同步展開。","reference":"HKSI Paper 5 Guide Topic 2 Section 10.8"},{"id":"T2-328","topic":"Topic 2","subtopic":"Multiple Applications Prohibition & Intermediaries Controls","difficulty":"Level 2","question":"根據《上市規則》及證監會指引，香港公開發售嚴禁同一名投資者遞交重複申請（Multiple applications）。為履行此合規義務，發行人、保薦人及過戶處必須建立：","options":[{"value":"A","label":"全額沒收所有申請款項的內部彩票機制"},{"value":"B","label":"透過身份識別資料校對等具體內部監控措施，以及運用 FINI 平台自動比對機制，以辨識及剔除任何重複或涉嫌重複的認購申請"},{"value":"C","label":"全面取消所有零售散戶的認購資格"},{"value":"D","label":"允許投資者以多個化名同時申請"}],"answer":"B","explanation":"指南 2-72 頁 10.10 節及 MBLR 規定：法規嚴禁投資者重複認購新股；發行人、保薦人及股份過戶登記處有責任設立嚴密機制（現透過 FINI 身份比對系統），及時識別並拒絕受理所有重複申請。","reference":"MBLR; HKSI Paper 5 Guide Topic 2 Section 10.10"},{"id":"T2-329","topic":"Topic 2","subtopic":"Supplemental Prospectus - Serious Material Inaccuracies","difficulty":"Level 3","question":"若在香港公開招股章程正式印發並開始接受公眾認購後，發行人突發發現章程中載有一項極其嚴重的重大失實數據。在極端嚴重的情況下，發行人必須採取的法律與合規補救程序是：","options":[{"value":"A","label":"在社交平台私下發文修正即可繼續上市"},{"value":"B","label":"暫停發售程序，並依循與原招股章程相同的法定授權及向公司註冊處登記程序，正式印發「補充招股章程」（Supplemental Prospectus），並賦予公眾申請人法定撤回認購款項的權利"},{"value":"C","label":"強制將公司所有資產無條件拍賣"},{"value":"D","label":"發行人全體董事集體辭職即可免責"}],"answer":"B","explanation":"指南 2-72 頁 10.13 節及 CWUMPO 指明：若招股書發現重大失實，一般情況下可刊登公告更正；但在嚴重個案中，必須暫停發售並編制「補充招股章程」（須經聯交所審批及公司註冊處正式登記），並准許公眾投資者撤回認購。","reference":"CWUMPO; MBLR 11A; HKSI Paper 5 Guide Topic 2 Section 10.13"},{"id":"T2-330","topic":"Topic 2","subtopic":"Underwriter Financial Suitability Inquiries (MBLR 8.22)","difficulty":"Level 2","question":"根據主板上市規則第 8.22 條（GLR 第 11.36 條），聯交所在審查新上市發行人的包銷安排時，保留何種明確的監管查詢權力？","options":[{"value":"A","label":"聯交所保留質詢及審查任何擬委聘包銷商之「財務適當性／財務實力」（Enquire into the financial suitability of any proposed underwriter）的權利"},{"value":"B","label":"聯交所必須為所有包銷商承擔 50% 的違約包銷款項"},{"value":"C","label":"聯交所可隨意勒令任何包銷商向交易所無償贈送股份"},{"value":"D","label":"聯交所完全無權過問承銷商的任何背景"}],"answer":"A","explanation":"指南 2-71 頁 10.2 節及 MBLR 8.22（GLR 11.36）明文規定：聯交所保留就任何擬任包銷商的財務適當性（Financial suitability）進行查詢的權利，以確保承銷機構具備足夠的資本實力承擔未獲認購證券的包銷義務。","reference":"MBLR 8.22; GLR 11.36; HKSI Paper 5 Guide Topic 2 Section 10.2"},{"id":"T2-331","topic":"Topic 2","subtopic":"Notifiable Transactions - Aggregated Transactions Period Ceiling","difficulty":"Level 2","question":"上市發行人在評估是否觸發第 14 章各級別須予公布交易時，除 12 個月內訂立的一連串交易外，聯交所在何種情況下可將超出 12 個月時間範圍的交易進行合併計算？","options":[{"value":"A","label":"任何情況下均嚴格以 12 個月為死限，聯交所絕對無權超出 12 個月"},{"value":"B","label":"若該等交易在其他方面互有關聯（Otherwise related），或各項交易安排之間存在明確的商業關聯紐帶，聯交所有權不受 12 個月嚴格限制而予以合併審視"},{"value":"C","label":"只要交易以同一貨幣計價即可無限制合併"},{"value":"D","label":"僅限於發行人更換核數師時"}],"answer":"B","explanation":"指南 2-41 頁 11.6 節及 MBLR 14.22 指明：聯交所可合併計算 12 個月內訂立的交易，或「在其他方面互有關聯」（Otherwise related）的交易，不論交易是否已完成或資產是否尚待收購，以防範發行人刻意拉長交易間隔以規避比率門檻。","reference":"MBLR 14.22; HKSI Paper 5 Guide Topic 2 Section 11.6"},{"id":"T2-332","topic":"Topic 2","subtopic":"Notifiable Transactions - Notification to SEHK Requirement","difficulty":"Level 1","question":"根據主板第 14 章的合規矩陣表，在須予公布交易的全部五個法定類別中（股份交易、須予披露的交易、主要交易、非常重大出售、非常重大收購），發行人均**一律必須**執行的合規程序為：","options":[{"value":"A","label":"向全體股東寄發通函"},{"value":"B","label":"通知香港聯交所，並發布正式公告（Notification to SEHK & Announcement）"},{"value":"C","label":"取得股東大會以投票方式表決通過"},{"value":"D","label":"委聘申報會計師出具經審計的會計師報告"}],"answer":"B","explanation":"指南 2-42 頁 11.9 節合規表格明確顯示：所有五個交易類別（從股份交易到 VSA），在「通知聯交所」及「刊發公告」兩欄中均標註為「是」（Yes），此兩項屬於全類別適用的基礎監管義務。","reference":"MBLR 14.33; HKSI Paper 5 Guide Topic 2 Section 11.9"},{"id":"T2-333","topic":"Topic 2","subtopic":"Qualified Issuer Definition - Property Acquisitions","difficulty":"Level 2","question":"根據主板第 14.04(10B) 條，可享受合資格物業收購（Qualified Property Acquisition）監管豁免的「合資格發行人」（Qualified Issuer），其核心業務屬性必須為：","options":[{"value":"A","label":"主要在香港經營持牌證券經紀業務的金融機構"},{"value":"B","label":"以物業發展或物業投資為主要日常業務活動（Principal business activity of property development or property investment）的上市發行人"},{"value":"C","label":"主要從事黃金現貨勘探的礦業公司"},{"value":"D","label":"在香港設立超過 50 年的公用事業機構"}],"answer":"B","explanation":"指南 2-49 頁 11.32 節註釋及 MBLR 14.04(10B) 明確定義：合資格發行人（Qualified Issuer）是指主要業務本質為物業發展或物業投資的上市發行人，該定義是享有特定物業土地投標收購豁免的前置身份門檻。","reference":"MBLR 14.04(10B); HKSI Paper 5 Guide Topic 2 Section 11.32 Note"},{"id":"T2-334","topic":"Topic 2","subtopic":"Trading Halt - Waiver Applications Confidentiality Loss","difficulty":"Level 2","question":"根據主板第 13.10A 條，當上市發行人已向香港證監會正式申請豁免披露某項未完成重大談判的內幕消息，在此期間發行人必須主動申請短暫停牌的情形為：","options":[{"value":"A","label":"證監會尚未在 10 分鐘內回覆電郵"},{"value":"B","label":"發行人合理相信或相當可能該等內幕消息的「機密性已經洩漏」（Confidentiality may have been lost）"},{"value":"C","label":"全體董事在辦公室舉行午餐會"},{"value":"D","label":"公司股價連續三天無任何變動"}],"answer":"B","explanation":"指南 2-50 頁 12.3(c) 節及 MBLR 13.10A 規定：當涉及申請證監會豁免披露、或處於法定安全港豁免下的內幕消息，一旦發行人合理相信其機密性已經喪失或可能已經洩漏，發行人必須立即申請短暫停牌，以防市場在資訊不對稱下出現不公平交易。","reference":"MBLR 13.10A; HKSI Paper 5 Guide Topic 2 Section 12.3(c)"},{"id":"T2-335","topic":"Topic 2","subtopic":"Continuous Suspension - Re-listing Plan & Viable Business","difficulty":"Level 3","question":"已長期停牌達 12 個月的主板上市發行人，若擬避免在 18 個月停牌期屆滿時被聯交所直接取消上市地位，發行人必須向聯交所提呈的復牌建議（Resumption proposal）核心證明標準為：","options":[{"value":"A","label":"證明其全體董事在香港無任何刑事犯罪記錄"},{"value":"B","label":"證明發行人已具備符合《上市規則》第 13.24 條要求的實質可行性、可持續性且具備充足運作水平的實體營運業務（Substance, viable and sustainable business），並糾正所有導致其停牌的監管違規事宜"},{"value":"C","label":"向聯交所全額繳交 5,000 萬港元的復牌保證金"},{"value":"D","label":"證明其所有散戶股東均已簽署放棄追索聲明"}],"answer":"B","explanation":"指南 2-52 頁 12.11 節註釋及 MBLR 6.01A 指明：停牌發行人申請復牌，必須向聯交所證明其具備實質且可行的持續經營業務（Viable and sustainable business under Rule 13.24），並全數達成聯交所施加的復牌指引條件，方可免於被強制除牌。","reference":"MBLR 6.01A, 13.24; HKSI Paper 5 Guide Topic 2 Section 12.11 Note"},{"id":"T2-336","topic":"Topic 2","subtopic":"Disciplinary Proceedings - Appeal Notice 7 Business Days","difficulty":"Level 2","question":"根據主板上市規則第 2A.11 條（GLR 第 3.12 條），受處分當事人若未向秘書處索取書面裁決理由，其直接提呈覆核上市委員會決定（Review of decision）的法定傳達期限為：","options":[{"value":"A","label":"在決定發出後 24 小時內"},{"value":"B","label":"在該項決定發出之日起計七個營業日內（Within seven business days of the issue of the decision）送達上市委員會或上市覆核委員會秘書"},{"value":"C","label":"在決定發出滿 30 天後"},{"value":"D","label":"在下一個股東週年大會召開時"}],"answer":"B","explanation":"指南 2-57 頁 13.5 節及 MBLR 2A.11（GLR 3.12）明確規定：覆核決定之通知，必須在決定發布後 7 個營業日內正式送達上市委員會秘書或上市覆核委員會秘書；逾期將喪失覆核權利。","reference":"MBLR 2A.11; GLR 3.12; HKSI Paper 5 Guide Topic 2 Section 13.5"},{"id":"T2-337","topic":"Topic 2","subtopic":"Disciplinary Proceedings - Written Reasons Request 3 Business Days","difficulty":"Level 2","question":"根據主板第 2A.11 條，受處分當事人若擬向上市委員會索取該紀律決定的正式書面理由（Written reasons），該當事人必須在何時提出申請？","options":[{"value":"A","label":"在決定發出之日起三個營業日內（Within three business days of the issue of the decision）"},{"value":"B","label":"在決定發出滿 14 天後"},{"value":"C","label":"在股份被取消上市地位當日"},{"value":"D","label":"任何時候均可，無任何時限規定"}],"answer":"A","explanation":"指南 2-57 頁 13.5 節及 MBLR 2A.11 指明：當事人索取書面理由的法定期限為決定發出之日起 3 個營業日內；若索取了書面理由，則進一步提呈覆核的 7 個營業日時限將自書面理由發布之日起算。","reference":"MBLR 2A.11; HKSI Paper 5 Guide Topic 2 Section 13.5"},{"id":"T2-338","topic":"Topic 2","subtopic":"Connected Persons - 10% Voting Power Subsidiary Level (Connected Subsidiary)","difficulty":"Level 3","question":"某上市發行人的非全資附屬公司（Holdco 佔股 80%），其剩餘 20% 股權由該發行人的行政總裁（發行人層面關連人士）個人實益持有。根據《上市規則》第 14A.16 條，該非全資附屬公司本身在監管分類上屬於：","options":[{"value":"A","label":"完全不屬於任何關連人士，視為發行人的普通子公司"},{"value":"B","label":"發行人的「關連附屬公司」（Connected Subsidiary），從而構成發行人的關連人士，發行人與該附屬公司之間的交易受第 14A 章規管"},{"value":"C","label":"發行人的海外信託資產"},{"value":"D","label":"獨立第三方合營夥伴"}],"answer":"B","explanation":"指南 2-48 頁 11.27 節註釋 2 及 MBLR 14A.16 指明：發行人的非全資附屬公司中，若發行人層面的關連人士有權行使 10% 或以上表決權，該非全資附屬公司即構成發行人的「關連附屬公司」（Connected subsidiary），從而屬於關連人士。","reference":"MBLR 14A.16; HKSI Paper 5 Guide Topic 2 Section 11.27 Note 2"},{"id":"T2-339","topic":"Topic 2","subtopic":"Connected Persons - Deeming Powers over Substantial Holders Associates","difficulty":"Level 2","question":"根據《上市規則》第 14A.21 條，聯交所有權在何種具體交易架構下，將某個表面上無關聯的第三方「視作」上市發行人的關連人士？","options":[{"value":"A","label":"該第三方在過去 20 年內曾在香港旅遊"},{"value":"B","label":"該第三方與發行人的關連人士訂立了某項財務安排或協議，使其與該關連人士的利益實質綑綁，且交易目的是規避關連交易審批"},{"value":"C","label":"該第三方的辦公室與發行人處於同一郵政編碼區"},{"value":"D","label":"該第三方聘用了持有特許金融分析師資格的員工"}],"answer":"B","explanation":"指南 2-48 頁 11.31 節及 MBLR 14A.21 明文賦予聯交所穿透性視作權力：凡第三方與關連人士存在默契、融資支持或附屬合約安排，實質使利益輸送流向關連人士者，聯交所有權直接裁定該第三方為「視作關連人士」。","reference":"MBLR 14A.21; HKSI Paper 5 Guide Topic 2 Section 11.31"},{"id":"T2-340","topic":"Topic 2","subtopic":"Continuing Obligations - Cash Companies Principles Review","difficulty":"Level 2","question":"聯交所在審查某上市發行人是否構成「現金資產公司」（MBLR 14.82）時，採用的監管評估方法與考量因素為：","options":[{"value":"A","label":"機械式審查賬面現金是否超過 1,000 萬港元"},{"value":"B","label":"採用原則驗證法（Principle based approach），綜合衡量現金與短期投資相對於總資產的價值比重、營運水平與財務狀況，並審視其業務性質及常規營運所需的實質現金需求"},{"value":"C","label":"僅看發行人是否按時繳交利得稅"},{"value":"D","label":"由全體投資者一人一票表決裁定"}],"answer":"B","explanation":"指南 2-49 頁 11.36 節及 MBLR 14.82 指明：判定現金公司採用原則驗證法，核心考量兩點：(a) 現金及短期投資相對總資產、業務營運及財務狀況的比重；(b) 發行人業務的實質性質及其在日常營運中對流動現金的真實商業需要。","reference":"MBLR 14.82; HKSI Paper 5 Guide Topic 2 Section 11.36"},{"id":"T2-341","topic":"Topic 2","subtopic":"Winding Up of Listed Issuer - Dissolution Legal Effect","difficulty":"Level 1","question":"根據《公司（清盤及雜項條文）條例》（CWUMPO）第 V 部及《公司條例》，一間在香港註冊成立的上市公司在完成全部清盤變賣並分派資產後，其最終法律地位將：","options":[{"value":"A","label":"轉為非牟利慈善基金會永久存在"},{"value":"B","label":"正式解散（Dissolved），即在法律上不再存在，並自公司註冊處的名冊中予以剔除（Removed from the list of companies）"},{"value":"C","label":"自動在倫敦交易所掛牌交易"},{"value":"D","label":"由香港律政司全權接管繼續營運"}],"answer":"B","explanation":"指南 2-54 頁 12.22 節及 CWUMPO Part V 指明：清盤完成後公司即告解散（Dissolved），法律實體人格徹底消滅，並自公司登記冊中除名；在聯交所的上市地位亦隨之撤銷。","reference":"CWUMPO Part V; Companies Ordinance; HKSI Paper 5 Guide Topic 2 Section 12.22"},{"id":"T2-342","topic":"Topic 2","subtopic":"Rights Issue - Nil-paid Rights Trading Period","difficulty":"Level 2","question":"在香港聯交所主板進行的供股（Rights Issue）流程中，股東收到的未繳股款供股權（Nil-paid rights），其在聯交所二級市場掛牌買賣交易的法定最短期限通常為：","options":[{"value":"A","label":"至少 24 小時"},{"value":"B","label":"不少於五個營業日（Not less than five business days）"},{"value":"C","label":"至少 6 個月"},{"value":"D","label":"未繳股款供股權嚴禁在二級市場進行任何買賣"}],"answer":"B","explanation":"依據 MBLR 7.19 及市場交易規則：為確保合資格股東有合理時間評估或在市場變現其供股權益，未繳股款供股權（Nil-paid rights）在聯交所的買賣交易期不得少於 5 個完整營業日。","reference":"MBLR 7.19; HKSI Paper 5 Guide Topic 2 Section 8.19"},{"id":"T2-343","topic":"Topic 2","subtopic":"Specialist Technology Companies - Credible Path to Commercialisation","difficulty":"Level 2","question":"根據主板第 18C 章，未商業化特專科技公司（Pre-Commercial Company）在上市審查中，除研發開支及市值達到 80 億港元外，在商業化前景上必須向聯交所證明：","options":[{"value":"A","label":"全體創辦人已承諾將所有工資歸零"},{"value":"B","label":"具備達致商業化的可信途徑（Credible path to the commercialisation），足以使其特專科技產品在合理期間內達成商業化公司的收益門檻（2.5 億港元）"},{"value":"C","label":"公司產品已被外國軍隊採購"},{"value":"D","label":"保證上市首年營業利潤超過 10 億港元"}],"answer":"B","explanation":"指南 2-55 頁 9.35(a) 節及 MBLR 18C.05 規定：未商業化 STC 必須證明其特專科技產品具備切實可行的商業化轉化路徑（Credible path to commercialisation），有充足能力在上市後達致 2.5 億港元商業化收入要求。","reference":"MBLR 18C.05; HKSI Paper 5 Guide Topic 2 Section 9.35(a)"},{"id":"T2-344","topic":"Topic 2","subtopic":"Specialist Technology Companies - Minimum R&D Expenditure Ratio","difficulty":"Level 3","question":"根據主板第 18C 章，特專科技公司在營業紀錄期內，其特專科技產品研發開支佔其總營運開支（Total operating expenditure）的最低法定百分比要求為：","options":[{"value":"A","label":"每年至少 1%"},{"value":"B","label":"商業化公司每年至少 15%；未商業化公司每年至少 30%（若營業紀錄期為兩年則各年至少 50%）"},{"value":"C","label":"每年至少 80%"},{"value":"D","label":"研發開支佔比無任何要求"}],"answer":"B","explanation":"指南 2-55 頁 9.32 節及 MBLR 18C.04 規定：STC 必須證明持續投入巨額研發，商業化公司研發開支佔總營運開支至少 15%；未商業化公司三年期內各年佔比至少 30%（兩年特批期內則各年至少 50%）。","reference":"MBLR 18C.04; HKSI Paper 5 Guide Topic 2 Section 9.32"},{"id":"T2-345","topic":"Topic 2","subtopic":"SPAC - Return of Funds upon Failure of De-SPAC (One Month Deadline)","difficulty":"Level 2","question":"根據主板上市規則第 18B 章，若 SPAC 在法定時限內（24 個月宣布/36 個月完成）未能完成 De-SPAC 交易，該 SPAC 證券將被暫停買賣，且該 SPAC 必須在停牌後多長時間內，將託管賬戶內的全部集資額連同累計利息退還予其 SPAC 股東？","options":[{"value":"A","label":"在 24 小時之內"},{"value":"B","label":"在停牌後一個月之內（Within one month to return the funds raised）"},{"value":"C","label":"在 3 年之內"},{"value":"D","label":"由發起人自由決定退款時間"}],"answer":"B","explanation":"指南 2-54 頁 9.29 節及 MBLR 18B.72 明確指明：SPAC 若未能在規定時限內完成 De-SPAC，股份將被暫停交易，且必須在停牌後「一個月內」（Within one month），按不低於初始發行價之價格將託管款項原額返還股東，其後取消上市地位。","reference":"MBLR 18B.72; HKSI Paper 5 Guide Topic 2 Section 9.29"},{"id":"T2-346","topic":"Topic 2","subtopic":"SPAC - Dealing Prohibition for Promoters and Directors","difficulty":"Level 2","question":"根據主板第 18B 章，在 De-SPAC 交易正式交割完成之前，下列哪類人士受到**嚴格禁止**買賣該 SPAC 的任何上市證券？","options":[{"value":"A","label":"任何合資格的專業機構投資者（PIs）"},{"value":"B","label":"SPAC 發起人及其董事和僱員、SPAC 董事、以及上述所有主體的緊密聯繫人（Prohibited from dealing in listed securities of the SPAC）"},{"value":"C","label":"持有香港身份證的持牌經紀商"},{"value":"D","label":"香港交易所行政總裁"}],"answer":"B","explanation":"指南 2-52 頁 9.19 節及 MBLR 18B.30 規定：在 De-SPAC 完成前，SPAC 發起人、其董事與僱員、SPAC 自身董事及其各自緊密聯繫人，一律嚴禁買賣該 SPAC 的任何上市股份或權證，以杜絕內部人利用殼資源炒作牟利。","reference":"MBLR 18B.30; HKSI Paper 5 Guide Topic 2 Section 9.19"},{"id":"T2-347","topic":"Topic 2","subtopic":"SPAC - Shareholder Redemption Rights","difficulty":"Level 2","question":"根據主板第 18B 章，SPAC 股東在大會審議 De-SPAC 交易或延長期限時，所享有的法定股份贖回權（Shareholder Redemption Right）核心保障為：","options":[{"value":"A","label":"股東必須折價 50% 贖回股份"},{"value":"B","label":"不論股東對 De-SPAC 交易投贊成票、反對票或棄權，合資格股東均有權按預期贖回價（以每股發行價加託管利息為準）贖回其持有的全部或部分 SPAC 股份"},{"value":"C","label":"只有投反對票的股東才享有贖回權"},{"value":"D","label":"發起人有權隨意拒絕任何股東的贖回請求"}],"answer":"B","explanation":"依據 MBLR 18B.57 及指南 2-53 頁 9.22 節：香港 SPAC 機制保障全體公眾股東的贖回權，股東不論投票取向，均有權在 De-SPAC 表決前行使贖回權，自託管賬戶按不低於發行原價取回本金與應計利息。","reference":"MBLR 18B.57; HKSI Paper 5 Guide Topic 2 Section 9.22"},{"id":"T2-348","topic":"Topic 2","subtopic":"Covered Warrants - Restriction to Large Capitalisation Companies","difficulty":"Level 2","question":"根據主板上市規則第 15A.35 條，為防止衍生權證發行人透過發行備兌認股權證（Covered warrants）操縱底層正股市場價格，聯交所對作為標的的上市公司設有何種資格限制？","options":[{"value":"A","label":"標的股票可以為任何在 GEM 上市的微型股票"},{"value":"B","label":"標的正股僅限於具備龐大市值、流動性極高的大型藍籌上市公司（如匯豐控股等，Public float 達到 40 億港元以上）"},{"value":"C","label":"標的公司必須為初創未盈利生物科技企業"},{"value":"D","label":"標的公司必須無任何公眾股東"}],"answer":"B","explanation":"指南 2-65 頁 9.88 節及 MBLR 15A.35 指明：監管機構限制備兌認股權證掛鉤的標的股份，僅限於大型高市值公司（如公眾流通市值逾 40 億港元的大型股），以杜絕發行商利用權證交割操縱小型股票價格。","reference":"MBLR 15A.35; HKSI Paper 5 Guide Topic 2 Section 9.88"},{"id":"T2-349","topic":"Topic 2","subtopic":"Convertible Bonds - Anti-dilution Disclosure in Financial Reports","difficulty":"Level 2","question":"根據主板第 13 章，發行了可換股債券（Convertible Bonds）的上市發行人，在其刊發的中期報告及年度財務報告中，負有何種專門持續披露責任？","options":[{"value":"A","label":"發行人僅需披露債券持有人代表的個人電話"},{"value":"B","label":"發行人必須作出充分披露，交代若可換股證券獲全數行使轉換時對現有每股盈利產生的稀釋影響（Dilution impact），包括潛在股份發行數額與全面攤薄每股收益"},{"value":"C","label":"發行人必須保證可轉債持有人永遠不轉股"},{"value":"D","label":"完全免除任何可轉債披露義務"}],"answer":"B","explanation":"指南 2-66 頁 9.91 節及 MBLR 規定：發行人必須在定期財務報告中向投資者詳細披露可換股工具的稀釋效應（Dilution impact），包括尚未行使的可轉債全額轉換時可能發行的新股數量及對股權架構的潛在攤薄影響。","reference":"MBLR 13; HKSI Paper 5 Guide Topic 2 Section 9.91"},{"id":"T2-350","topic":"Topic 2","subtopic":"Summary of Topic 2 - Listing Decision Appeal Right","difficulty":"Level 1","question":"根據主板第 2A 章及指南總結，當上市申請人或上市發行人受到聯交所上市委員會作出的重大不利裁決（不論是上市申請被拒絕，或是被頒令除牌退市），受影響發行人均享有何種法定終局覆核權利？","options":[{"value":"A","label":"發行人依法不得提請任何覆核，上市委員會決定即為絕對終局且不可上訴"},{"value":"B","label":"發行人享有法定權利，可依照既定時限向完全獨立於上市委員會的「上市覆核委員會」（Listing Review Committee, LRC）提請覆核"},{"value":"C","label":"發行人只能向香港消費者委員會申訴"},{"value":"D","label":"發行人必須向聯合國秘書處提出上訴"}],"answer":"B","explanation":"指南 2-7 頁 2.9 節、2-52 頁 12.14 節及 MBLR 2A.11 明確指明：上市委員會的裁決（包括拒絕上市、除牌命令、紀律處分）均受制於獨立的上市覆核委員會（LRC）的覆核機制，當事人享有完備的正當程序覆核權益。","reference":"MBLR 2A.11, 2A.37A; HKSI Paper 5 Guide Topic 2 Section 2.9, 12.14"},{"id":"T2-351","topic":"Topic 2","subtopic":"Listing Qualifications - Management Continuity Exceptions","difficulty":"Level 3","question":"根據主板上市規則第 8.05 條，新上市申請人常規須具備至少三個財政年度的管理層連續性（Management continuity）。但在下列哪種法定測試路徑下，聯交所可接納將該管理層連續性年限縮短至兩個財政年度？","options":[{"value":"A","label":"在盈利測試下，只要保薦人出具無保留保證書"},{"value":"B","label":"在市值／收益測試（Market cap/revenue test）下，若申請人能證明上市時市值至少達 40 億港元且最近一個經審計財政年度收益至少達 5 億港元，並能令聯交所信納其管理層在最近兩個財政年度大致相同"},{"value":"C","label":"任何申請人只要繳付雙倍上市首次年費即可自動縮短"},{"value":"D","label":"管理層連續性在任何主板上市路徑下均絕對嚴格不可縮短"}],"answer":"B","explanation":"依據 MBLR 8.05(3) 及指南 2-46 至 2-47 頁 9.3(c) 節：在市值／收益測試下，聯交所可接納較短的營業紀錄期及至少兩個財政年度的管理層連續性（Management continuity over at least 2 financial years），前提是發行人證明具備龐大市值及足夠營運規模。","reference":"MBLR 8.05(3); HKSI Paper 5 Guide Topic 2 Section 9.3(c)"},{"id":"T2-352","topic":"Topic 2","subtopic":"GEM Listing Qualifications - Active Business Pursuits vs Trading Record","difficulty":"Level 2","question":"根據 GEM 上市規則第 11.12A 條，申請在 GEM 上市的企業，其法定營業紀錄期內的主營業務經營狀態必須符合何種原則？","options":[{"value":"A","label":"業務可以處於長期休眠狀態，只要有銀行存款利息收入即可"},{"value":"B","label":"必須具備至少兩個完整財政年度實質的活躍業務經營紀錄（Active business pursuits），且該業務在該期間內須在基本相同的管理層及所有權下運作"},{"value":"C","label":"必須在過去兩年內收購至少五間不同行業的海外公司"},{"value":"D","label":"主營業務必須每年變更一次以體現業務靈活性"}],"answer":"B","explanation":"指南 2-46 頁 9.3(b)–(c) 節及 GLR 11.12A 指明：GEM 申請人必須具備兩個完整財政年度的實質業務營業紀錄（Two financial years trading record period），且在該期間內實質從事具商業實質的主營業務，並維持管理層與控制權的穩定連續。","reference":"GLR 11.12A; HKSI Paper 5 Guide Topic 2 Section 9.3"},{"id":"T2-353","topic":"Topic 2","subtopic":"Biotech Companies - Sophisticated Investor Meaning","difficulty":"Level 2","question":"根據主板第 18A 章及聯交所指引，生物科技公司在申請上市前，必須已自至少一名「資深投資者」（Sophisticated Investor）處獲得有實質意義的第三方投資。聯交所在判定資深投資者時重點考量：","options":[{"value":"A","label":"該投資者是否擁有香港賽馬會全權會員身份"},{"value":"B","label":"該機構或個人的管理資產規模（AUM）、投資組合規模、在生科領域的專業知識、過往成功投資往績及行業信譽"},{"value":"C","label":"該投資者是否為發行人創辦人的直系親屬"},{"value":"D","label":"投資金額是否全數以實物黃金交割"}],"answer":"B","explanation":"指南 2-50 頁 9.9 節及 HKEX Guide Chapter 2.3 指明：評估資深投資者時，重點考量其專注於生科領域的投資往績、專業知識儲備、基金規模（如資產管理規模或基金規模達特定門檻）以及在業界的客觀市場認可度，藉此為生科估值提供第三方專業驗證。","reference":"MBLR Chapter 18A; HKEX Guide Chapter 2.3; HKSI Paper 5 Guide Topic 2 Section 9.9"},{"id":"T2-354","topic":"Topic 2","subtopic":"Biotech Companies - Subscription of Shares by Existing Shareholders","difficulty":"Level 3","question":"根據主板第 18A 章，未有盈利的生物科技公司在進行 IPO 發售時，其現有股東（Existing Shareholders）認購發售股份受到的特定放寬與限制為：","options":[{"value":"A","label":"現有股東嚴禁在 IPO 中認購任何股份"},{"value":"B","label":"在符合特定條件下（如基石投資或配售檔份認購），允許現有股東參與認購以支持發行，但該等配發不得享有任何優惠待遇，且必須確保公眾持股量合規"},{"value":"C","label":"現有股東可按發行價之半價享有專屬打折認購權"},{"value":"D","label":"現有股東認購的股份自動轉為無表決權優先股"}],"answer":"B","explanation":"指南 2-48 頁 9.4(i) 節註釋及 MBLR 18A 指明：生科公司在 IPO 中對現有股東認購設有微調彈性，允許合資格現有股東參與配售以維持融資動能，但前提為不可享有價格或分配特權，並確保滿足公眾持股最低要求。","reference":"MBLR 18A; HKSI Paper 5 Guide Topic 2 Section 9.4(i) Note"},{"id":"T2-355","topic":"Topic 2","subtopic":"Weighted Voting Rights - Corporate WVR Beneficiaries Prohibition","difficulty":"Level 2","question":"根據主板第 8A 章關於不同投票權架構的現行常規規定，下列哪類實體或個人獲准成為特權 WVR 股份的受益擁有人？","options":[{"value":"A","label":"任何在香港註冊的有限責任商業公司"},{"value":"B","label":"僅限於發行人在上市時為該發行人作出重大人才貢獻、且出任發行人現任執行董事的個人（Individual executive directors）"},{"value":"C","label":"全體機構養老基金投資人"},{"value":"D","label":"外國政府財政部法人團體"}],"answer":"B","explanation":"指南 2-51 頁 9.15 節及 MBLR 8A.11 指出：常規第 8A 章架構下，WVR 股份的受益人嚴格限定為自然人董事（Individual directors）；若該董事身故、離職或出售經濟權益，特權投票權即告終止並強制 1:1 轉為普通股。","reference":"MBLR 8A.11; HKSI Paper 5 Guide Topic 2 Section 9.15"},{"id":"T2-356","topic":"Topic 2","subtopic":"Weighted Voting Rights - Enhanced Disclosure Warning","difficulty":"Level 1","question":"根據主板第 8A.37 條，具備不同投票權（WVR）架構的上市發行人，在其刊發的所有上市文件、定期財務報告、公告及通函中，必須履行何種法定外觀披露？","options":[{"value":"A","label":"在首頁清晰註明「本公司為一間不同投票權架構公司」（A company controlled through a weighted voting rights structure）等警示字句"},{"value":"B","label":"封面必須採用全黑底色印刷"},{"value":"C","label":"必須在文檔末尾附上全體董事的個人無犯罪公證書"},{"value":"D","label":"無須作任何特別說明，與一般公司文件無異"}],"answer":"A","explanation":"指南 2-51 頁 9.16 節及 MBLR 8A.37 指明：WVR 發行人受制於加強披露責任，其上市文件、財務報告及通訊文件的首頁封面必須醒目註明其為採用不同投票權架構控制的法團，提示投資者相關管治特點。","reference":"MBLR 8A.37; HKSI Paper 5 Guide Topic 2 Section 9.16"},{"id":"T2-357","topic":"Topic 2","subtopic":"Special Purpose Acquisition Companies - Independent Board Voting on De-SPAC","difficulty":"Level 3","question":"在 SPAC 審議及推進 De-SPAC 交易的過程中，根據主板第 18B 章，若某項 De-SPAC 交易的目標資產與某位 SPAC 發起人存在潛在利益衝突，董事會表決該收購時：","options":[{"value":"A","label":"該發起人關聯董事有權行使兩票支持該交易"},{"value":"B","label":"在該交易中擁有重大利益的發起人關聯董事必須完全放棄在董事會表決中的投票權，且該交易必須經由全體獨立非執行董事組成的委員會審議並由獨立股東批准"},{"value":"C","label":"SPAC 董事會無須表決，直接由發起人發布收購公告"},{"value":"D","label":"交易作價必須強制折讓 80%"}],"answer":"B","explanation":"指南 2-53 頁 9.23 節及 MBLR 18B.32 規定：若 De-SPAC 交易涉及發起人利益衝突，關聯董事必須在董事會上迴避表決，且在股東大會上，發起人及其緊密聯繫人必須就該 De-SPAC 決議案放棄表決權（Must abstain from voting）。","reference":"MBLR 18B.32, 18B.54; HKSI Paper 5 Guide Topic 2 Section 9.23"},{"id":"T2-358","topic":"Topic 2","subtopic":"De-SPAC - Takeovers Code Waiver Mandate","difficulty":"Level 3","question":"由於完成 De-SPAC 交易通常伴隨目標資產擁有人獲得大量新發行股份從而取得發行人控制權（逾 30%），根據指南說明，SPAC 在推進交易前必須向證監會執行人員申請：","options":[{"value":"A","label":"永久免除繳納印花稅許可"},{"value":"B","label":"依據《收購守則》就控制權變動申請寬免（Apply to Executive for a waiver），執行人員通常在充分披露目標方背景及一致行動關係後批出豁免，使收購不觸發強制全面要約義務"},{"value":"C","label":"向高等法院申請破產和解令"},{"value":"D","label":"申請將發行人更換為無限責任合夥企業"}],"answer":"B","explanation":"指南 2-54 頁 9.27 節及《收購守則》實務指引第 23 項明文指明：SPAC 屬於受《收購守則》規管的上市公司；De-SPAC 完成時會引發控制權變動，SPAC 必須在交易公告前向執行人員申請豁免，執行人員通常會批出豁免而不開啟全面要約期。","reference":"Takeovers Code Practice Note 23; HKSI Paper 5 Guide Topic 2 Section 9.27"},{"id":"T2-359","topic":"Topic 2","subtopic":"Specialist Technology Companies - Acceptable Industries Guidance","difficulty":"Level 1","question":"根據主板第 18C 章及聯交所指引，下列哪項科技板塊明確屬於聯交所接納為「特專科技行業」（Specialist Technology Industry）的合資格板塊之一？","options":[{"value":"A","label":"傳統純人力土木泥水工程"},{"value":"B","label":"新一代資訊科技、先進硬件及軟件、先進材料、新能源及節能環保、以及新食品及農業技術"},{"value":"C","label":"典當鋪及傳統線下放債業務"},{"value":"D","label":"傳統紙質書刊排版印刷"}],"answer":"B","explanation":"指南 2-54 頁 9.30 節註釋及 HKEX Guide Chapter 2.5 列明特專科技五大核心板塊：新一代資訊科技、先進硬件及軟件、先進材料、新能源及環保、以及新食品及農業技術，均屬合資格領域。","reference":"MBLR Chapter 18C; HKEX Guide Chapter 2.5; HKSI Paper 5 Guide Topic 2 Section 9.30 Note"},{"id":"T2-360","topic":"Topic 2","subtopic":"Suitability for Listing - Sustainability of Business Concerns","difficulty":"Level 2","question":"根據聯交所上市決策彙編，新申請人即使全面符合了各項營業紀錄期及盈利量化指標，聯交所在何種情況下仍會以「不具備上市適當性」（Not suitable for listing）為由直接拒絕其上市申請？","options":[{"value":"A","label":"發行人僅有一間全資附屬公司設在香港數碼港"},{"value":"B","label":"發行人過度依賴單一即將屆滿的特許合約、行業面臨劇烈政策淘汰且近期財務數據出現斷崖式惡化、或缺乏真實集資融資需要（No genuine funding needs）"},{"value":"C","label":"發行人聘用的獨立非執董人數達到 4 人"},{"value":"D","label":"發行人全體董事均持有特許金融分析師資格"}],"answer":"B","explanation":"指南 2-56 頁 9.39 節及 HKEX Guide Annex A.1/A.6/A.8 指明：適當性是實質裁量權。過往拒絕個案包括：業績嚴重倒退、業務可持續性存疑、缺乏商業上市合理解釋及無真正資金需求、或董事過往誠信存在污點等。","reference":"HKEX Guide Annex A.1, A.6; HKSI Paper 5 Guide Topic 2 Section 9.39"},{"id":"T2-361","topic":"Topic 2","subtopic":"Suitability for Listing - Self-sufficiency and Independence from Parent","difficulty":"Level 3","question":"在審查擬分拆上市的申請人是否具備「上市適當性」時，聯交所高度關注其業務獨立性。申請人必須向聯交所證明：","options":[{"value":"A","label":"其全部原材料採購必須 100% 來自其母公司"},{"value":"B","label":"申請人具備自身的管理人員、獨立營運系統及業務流程，具備獨立自足營運能力（Operated business with its own personnel, systems and processes），且能獨立於母公司自負盈虧"},{"value":"C","label":"申請人全體董事必須由母公司董事長兼任"},{"value":"D","label":"申請人的全部銀行融資均由母公司提供不可撤銷擔保"}],"answer":"B","explanation":"指南 2-56 頁 9.39(c) 節及聯交所指引：缺乏獨立營運能力是常見的拒絕上市理由。申請人必須具備完整的自身營運團隊、獨立的研發與銷售體系，證明其具備獨立面向市場營運的能力，而非純粹依附於控股母體。","reference":"HKEX Guide Annex A.1; HKSI Paper 5 Guide Topic 2 Section 9.39(c)"},{"id":"T2-362","topic":"Topic 2","subtopic":"Application Proof - Redaction of Sensitive Details","difficulty":"Level 2","question":"新申請人在遞交上市申請時，其申請版本（Application Proof）將登載於香港交易所披露易網站以供公眾查閱。發行人在公開該版本時，獲准進行何種法定「編修／遮蔽」（Redaction）？","options":[{"value":"A","label":"可遮蔽整份利潤表及資產負債表"},{"value":"B","label":"僅可遮蔽尚待釐定的發售定價區間、承銷團費用細節、以及少數涉及極度商業敏感之特定代碼，但必須保留所有重大業務及歷史財務資料"},{"value":"C","label":"可將全部風險因素章節塗黑遮蔽"},{"value":"D","label":"可遮蔽全體董事的真實姓名與學歷"}],"answer":"B","explanation":"指南 2-62 頁 9.71 節及 MBLR 指明：登載於披露易的申請版本（Application Proof）供公眾監察，僅允許遮蔽尚未確定的定價相關資訊（如股數、定價範圍）及少數極端商業機密，整體文件必須大致完備以體現透明度。","reference":"MBLR 9.03A; HKSI Paper 5 Guide Topic 2 Section 9.71"},{"id":"T2-363","topic":"Topic 2","subtopic":"Pre-IPO Moratorium on Resubmission (8 Weeks)","difficulty":"Level 2","question":"若保薦人呈交的上市文件申請版本因存在重大遺漏而被聯交所退回，該發行人及保薦人受制於為期 8 個星期的法定暫停期。該 8 個星期的起算時間點為：","options":[{"value":"A","label":"自退回通知函發出之日起算（8-week moratorium imposed from the date of the return）"},{"value":"B","label":"自該財政年度結束之日起算"},{"value":"C","label":"自保薦人更換負責人員之日起算"},{"value":"D","label":"自全體董事發表道歉聲明之日起算"}],"answer":"A","explanation":"指南 2-57 頁 9.43 節及 MBLR 9.03(3) 規定：8 星期暫停期（8-week moratorium）自聯交所發出退回決定函件之日起計算，在此期間內聯交所不會接納該申請人的任何重新呈交文件。","reference":"MBLR 9.03(3); HKSI Paper 5 Guide Topic 2 Section 9.43"},{"id":"T2-364","topic":"Topic 2","subtopic":"Application Lapsed - Re-filing Procedures (6 Months)","difficulty":"Level 2","question":"當上市申請因超過 6 個月未完成而失效（Lapsed）後，若申請人擬重新激活上市進程，在重新呈交 Form A1 時，保薦人負有何種補充陳述義務？","options":[{"value":"A","label":"保薦人可直接沿用半年前的原版表格，無須作任何改動"},{"value":"B","label":"保薦人及申請人必須在重新呈交時，逐項解決聯交所在先前呈交中提出的所有尚未解決的監管質詢，並詳細交代發行人業務或環境自上次失效後所發生的任何重大變動"},{"value":"C","label":"保薦人必須繳交雙倍行政罰款以恢復進度"},{"value":"D","label":"全體承銷商必須重新更換"}],"answer":"B","explanation":"指南 2-58 頁 9.46 節及 MBLR 9.03 指明：重新呈交時，申請人及保薦人必須回覆上一輪審查中聯交所尚未獲解決的全部提問，並呈報公司在兩次申請間隔期間所出現的重大財務與業務變動事項。","reference":"MBLR 9.03; HKSI Paper 5 Guide Topic 2 Section 9.46"},{"id":"T2-365","topic":"Topic 2","subtopic":"Post-Hearing Documents - Written Undertakings and Confirmations","difficulty":"Level 2","question":"根據主板第 9.11(31) 條，在通過上市聆訊後、但在正式印發上市文件之前，發行人必須向聯交所送交的重要文件包括：","options":[{"value":"A","label":"發行人、其股東及其他相關方在上市文件中所提述的每一項向聯交所作出的書面承諾及確認書（Every written undertaking and confirmation）"},{"value":"B","label":"全體中籤散戶的銀行轉賬記錄"},{"value":"C","label":"發行人未來十年的所得稅完稅證明"},{"value":"D","label":"保薦人全體負責人員的個人護照原件"}],"answer":"A","explanation":"指南 2-59 頁 9.50(a) 節及 MBLR 9.11(31) 規定：在上市文件刊發當日或之前，發行人必須呈交由發行人、控股股東或關聯方作出的全套已簽署書面承諾函及確認書（例如禁售承諾、合規保證等）。","reference":"MBLR 9.11(31); HKSI Paper 5 Guide Topic 2 Section 9.50(a)"},{"id":"T2-366","topic":"Topic 2","subtopic":"Listing Initiation e-Form on FINI","difficulty":"Level 1","question":"根據主板第 9.11(32a) 條，在上市文件發布當日或之前，由指定保薦人在 FINI 線上平台上正式填妥並呈交的法定電子表格為：","options":[{"value":"A","label":"新上市啟動電子表格（New listing initiation e-form）"},{"value":"B","label":"全港股票回購豁免電子申請表"},{"value":"C","label":"公司強制清盤電子備案表"},{"value":"D","label":"證監會持牌人年費電子繳納回執"}],"answer":"A","explanation":"指南 2-59 頁 9.50(b) 節及 MBLR 9.11(32a) 指明：在印發上市文件當日或之前，獲指定的保薦人必須在 FINI 平台上正式填妥並呈交「新上市啟動電子表格」（New listing initiation e-form），以正式觸發新股配發結算流程。","reference":"MBLR 9.11(32a); HKSI Paper 5 Guide Topic 2 Section 9.50(b)"},{"id":"T2-367","topic":"Topic 2","subtopic":"Material Change after Listing Document Lodgement","difficulty":"Level 2","question":"根據主板第 9.11 條後續持續義務，若在上市文件定稿送交聯交所後、至股份開始買賣前，發行人發生了重大資產減值或重大訴訟等關鍵變化，下列責任何者正確？","options":[{"value":"A","label":"發行人可以保持沉默，待掛牌上市滿半年後再作公告"},{"value":"B","label":"發行人、保薦人及整體協調人一旦知悉該重大變動，均有義務在合理切實可行下盡快向聯交所呈報更新資料及變動原因"},{"value":"C","label":"保薦人牌照自動被撤銷"},{"value":"D","label":"所有股份自動轉為向公眾無償分派"}],"answer":"B","explanation":"指南 2-60 頁 9.53 節及 MBLR 規定：凡先前提供給聯交所的資料發生重大變動，發行人、保薦人及整體協調人均負有主動申報責任，必須在知悉後迅速向聯交所交代變更詳情與原因。","reference":"MBLR 9.11; HKSI Paper 5 Guide Topic 2 Section 9.53"},{"id":"T2-368","topic":"Topic 2","subtopic":"Preferential Offering - Distinguishable Application Forms","difficulty":"Level 2","question":"在經聯交所批准向僱員優先發售最多 10% 股份時（MBLR 10.01），為防範違規認購，發行人在認購程序上必須採取的控制措施為：","options":[{"value":"A","label":"允許僱員以現金在公司前台直接認購且不登記姓名"},{"value":"B","label":"必須採用與一般公眾申請表格在外觀與代碼上有明確區別的專用申請表格（Distinguishable application forms），且過戶處須將此等專用認購數據輸入 FINI 系統"},{"value":"C","label":"僱員申請表必須由香港商務及經濟發展局蓋印"},{"value":"D","label":"優先發售的股份必須鎖定 30 年"}],"answer":"B","explanation":"指南 2-60 頁 9.54 節及 MBLR Practice Note 20 規定：僱員優先認購必須使用有別於公開認購的特定區別表格（Distinguishable forms），股份過戶處亦須將其專門數據錄入 FINI 平台，確保配額不超 10% 且無價格折扣。","reference":"MBLR 10.01, Practice Note 20; HKSI Paper 5 Guide Topic 2 Section 9.54"},{"id":"T2-369","topic":"Topic 2","subtopic":"Profit Forecast - Review by Reporting Accountants","difficulty":"Level 2","question":"根據主板第 11.17 條，上市文件中載入的任何盈利預測，申報會計師（Reporting Accountants）負有何種法定核數審查義務？","options":[{"value":"A","label":"會計師必須為該預測承擔全額商業利潤補足擔保"},{"value":"B","label":"申報會計師必須就編制該預測所採納的會計政策及計算方法是否妥當出具正式報告（Accounting policies and calculations reviewed by reporting accountants）"},{"value":"C","label":"申報會計師無須審查計算，僅需審查文字標點"},{"value":"D","label":"會計師有權直接修改發行人的商業預測金額"}],"answer":"B","explanation":"指南 2-61 頁 9.62 節及 MBLR 11.17 指明：招股文件中的盈利預測，其會計政策與算術計算方法必須經過申報會計師審閱並出具專業報告，確保其符合發行人一致採納的會計準則。","reference":"MBLR 11.17; HKSI Paper 5 Guide Topic 2 Section 9.62"},{"id":"T2-370","topic":"Topic 2","subtopic":"Results of Allotment - Generic Description of Placees","difficulty":"Level 2","question":"根據主板第 12.08 條，在新股發售包含國際配售檔份的情況下，發行人在刊登配發結果公告時，除列明分配基準外，還必須載入下列哪項配售資訊？","options":[{"value":"A","label":"全體國際機構承配人的家庭私人住址"},{"value":"B","label":"對承配人的一般性質綜合描述（Brief generic description of the placees，如機構投資者、主權基金、私募基金之類型與分佈）"},{"value":"C","label":"全體承配人在未來一年的所有股票買賣指令"},{"value":"D","label":"全體承配人代表個人的薪資明細"}],"answer":"B","explanation":"指南 2-61 頁 9.65 節及 MBLR 12.08 明確規定：配發結果公告除載列認購水平及配發基準外，若包含配售檔份，必須載有對承配人特徵的一般性扼要描述（Brief generic description），以展現配售客群的多元性與質量。","reference":"MBLR 12.08; HKSI Paper 5 Guide Topic 2 Section 9.65"},{"id":"T2-371","topic":"Topic 2","subtopic":"GEM Listing Documents - Publication on HKEX Website Cost Saving","difficulty":"Level 1","question":"根據 GEM 上市規則第 16 章，與過往傳統紙本實體發布相比，GEM 發行人在刊發上市文件及監管通告上的特色要求是：","options":[{"value":"A","label":"必須強制印發 10 萬份實體彩色招股書放置於全港各大地鐵站"},{"value":"B","label":"所有文件及公告均以電子形式登載於香港交易所披露易網站（Published on HKEX website），旨在減輕中小發行人合規成本並提升傳播效率"},{"value":"C","label":"僅能在香港電台廣播頻道口頭通讀"},{"value":"D","label":"發行人在上市期間嚴禁使用任何互聯網站"}],"answer":"B","explanation":"指南 2-62 頁 9.70 節及 GLR Chapter 16 指明：GEM 規則早在初期即全面依託聯交所網站進行電子化刊載，免除發行人昂貴的報章刊登與紙本印製負擔，實現成本節約與電子化查閱。","reference":"GLR Chapter 16; HKSI Paper 5 Guide Topic 2 Section 9.70"},{"id":"T2-372","topic":"Topic 2","subtopic":"HDR - Equal Treatment with Ordinary Shareholders","difficulty":"Level 2","question":"根據主板第 19B 章關於香港預託證券（HDRs）的根本監管原則，HDR 持有人在權利與保障上：","options":[{"value":"A","label":"僅享有普通股東十分之一的權益，且無任何知情權"},{"value":"B","label":"在發行人章程、法律、上市規則及 SFO 架構下，享有與底層普通股股東大致對等（Equivalent rights and obligations）的權利與保障，包括派息、表決及公司通訊收取權"},{"value":"C","label":"嚴禁享有任何現金股息派發"},{"value":"D","label":"必須為發行人的所有債務承擔連帶責任"}],"answer":"B","explanation":"指南 2-63 頁 9.73 節及 MBLR 19B.03 明確指明：HDR 機制的核心法理在於使 HDR 持有人享有與直接持有底層股份的股東大致相等的權利與義務（Treated as generally having equivalent rights and obligations）。","reference":"MBLR 19B.03; HKSI Paper 5 Guide Topic 2 Section 9.73"},{"id":"T2-373","topic":"Topic 2","subtopic":"HDR - Depositary Approved Financial Institution","difficulty":"Level 2","question":"根據主板第 19B 章，擔任香港預託證券（HDR）的存管機構（Depositary），在法律身份與監管資質上必須符合：","options":[{"value":"A","label":"任何新成立的私人投資公司均可擔任"},{"value":"B","label":"必須為獲得適當授權、受嚴格監管且獲聯交所接納的合資格金融機構（Suitably authorised and regulated financial institution acceptable to SEHK）"},{"value":"C","label":"必須為發行人的全資海外子公司"},{"value":"D","label":"存管處不能為法人，必須由三名個人共同出任"}],"answer":"B","explanation":"指南 2-63 頁 9.76 節及 MBLR 19B.05 規定：擔任 HDR 存管處的實體，必須為具備良好監管地位、獲適當發牌或認可、且為聯交所認可的金融機構，確保其信託持有股份具備足夠公信力與資產安全性。","reference":"MBLR 19B.05; HKSI Paper 5 Guide Topic 2 Section 9.76"},{"id":"T2-374","topic":"Topic 2","subtopic":"HDR - Custodian Segregated Account Requirement","difficulty":"Level 2","question":"根據主板第 19B.16 條，HDR 存管架構中的託管人（Custodian）在持有存管處所存入的發行人基礎股份時，必須符合何種資產隔離要求？","options":[{"value":"A","label":"可與託管人自身的自營股票混同存管於同一賬戶"},{"value":"B","label":"必須在獨立隔離賬戶（Segregated account）中持有該等股份，專為 HDR 持有人之利益而持有"},{"value":"C","label":"必須將該等股份全數質押給發行人控股股東"},{"value":"D","label":"託管人有權在二級市場隨意出借該等股票牟利"}],"answer":"B","explanation":"指南 2-63 頁 9.77(c) 節及 MBLR 19B.16 指明：託管人必須將存管股份存置於獨立的隔離賬戶（Segregated account）中，專為 HDR 持有人之利益代管，杜絕資產混同與被挪用風險。","reference":"MBLR 19B.16; HKSI Paper 5 Guide Topic 2 Section 9.77(c)"},{"id":"T2-375","topic":"Topic 2","subtopic":"Warrants Alteration - Legal Opinion Requirement","difficulty":"Level 3","question":"根據主板上市規則第 15.02 條，上市發行人若擬向現有認股權證持有人發行新權證或變更現有權證條款，發行人在向股東刊發通函時必須具備何種法律意見支持？","options":[{"value":"A","label":"無須任何法律意見，只需由經紀商口頭確認"},{"value":"B","label":"必須取得相關司法管轄區律師出具的法律意見書，確認該權證提議符合發行人憲制文件及現有權證文據的各項條款，且通函中必須清楚聲明董事已取得該項意見"},{"value":"C","label":"法律意見書必須全票否定該項變更的有效性"},{"value":"D","label":"意見書必須由全體小股東簽署"}],"answer":"B","explanation":"指南 2-64 頁 9.79 節及 MBLR 15.02 明確規定：向現有權證持有人發行新權證時，發行人必須取得合資格律師出具的法律意見書（Legal opinion），確認提議合憲合約，通函亦須正式載列董事已獲取該意見之聲明。","reference":"MBLR 15.02; HKSI Paper 5 Guide Topic 2 Section 9.79"},{"id":"T2-376","topic":"Topic 2","subtopic":"Derivative Warrants - Strike Price vs Settlement Types","difficulty":"Level 2","question":"根據主板第 15A 章，在聯交所掛牌的衍生認股權證（Derivative Warrants）依據其結算方式與行權方向，獲准上市的標準產品結構包括：","options":[{"value":"A","label":"美式或歐式行權、實物交收或現金結算、認購（Call）或認沽（Put）權證、以及牛熊證及區間工具"},{"value":"B","label":"僅限於每年派發固定 10% 現金利息的無抵押債券"},{"value":"C","label":"必須強制為無限期且無行使價的合約"},{"value":"D","label":"僅限於向發行人管理層無償贈送的股份期權"}],"answer":"A","explanation":"指南 2-64 至 2-65 頁 9.82 及 9.87 節詳列聯交所接納的結構性產品型態：美式/歐式、現金/實物交收、認購/認沽權證、牛熊證（Callable Bull/Bear Contracts）等合成衍生工具。","reference":"MBLR Chapter 15A; HKSI Paper 5 Guide Topic 2 Section 9.82, 9.87"},{"id":"T2-377","topic":"Topic 2","subtopic":"Share Schemes - Share Award vs Share Option Schemes","difficulty":"Level 2","question":"根據主板第 17 章（股份計劃），上市發行人實施的股份激勵計劃在分類上涵蓋的兩大核心類型為：","options":[{"value":"A","label":"強積金自願供款計劃與長期服務金計劃"},{"value":"B","label":"股份獎勵計劃（Share award schemes）及股份期權計劃（Share option schemes）"},{"value":"C","label":"海外高息存款定期計劃與票據承兌計劃"},{"value":"D","label":"控股股東私人無償贈與合約"}],"answer":"B","explanation":"指南 2-66 頁 9.93 節及 MBLR 17.01 指明：受第 17 章規管的股份計劃分為兩大支柱：股份獎勵計劃（直接授予股份或庫存股）及股份期權計劃（授予在未來按行使價認購股份的權利）。","reference":"MBLR Chapter 17; HKSI Paper 5 Guide Topic 2 Section 9.93"},{"id":"T2-378","topic":"Topic 2","subtopic":"Share Schemes - Principal Subsidiaries Scope","difficulty":"Level 2","question":"根據主板第 17 章，除上市發行人本身的股份計劃外，下列哪類附屬法團採納的股份期權或獎勵計劃，亦全面受到《上市規則》第 17 章的嚴格規範？","options":[{"value":"A","label":"發行人任何處於停業清盤中的休眠子公司"},{"value":"B","label":"發行人的「主要附屬公司」（Principal subsidiary，即資產、利潤或收益佔發行人合併數據 75% 或以上的重要子公司）"},{"value":"C","label":"發行人持有 1% 股權的被動參股實體"},{"value":"D","label":"任何海外獨立承包商"}],"answer":"B","explanation":"指南 2-66 頁 9.93 節及 MBLR 17.01(1) 規定：第 17 章規則不僅適用於上市發行人本身，亦全面涵蓋發行人的主要附屬公司（Principal subsidiaries）所採納涉及其自身股份的股權激勵計劃。","reference":"MBLR 17.01; HKSI Paper 5 Guide Topic 2 Section 9.93"},{"id":"T2-379","topic":"Topic 2","subtopic":"Share Schemes - Minimum Exercise Price for Share Options","difficulty":"Level 2","question":"根據主板第 17.03E 條，股份期權計劃中授予參與者的期權行使價（Exercise price），在作價基準上不得低於下列何者的最高者？","options":[{"value":"A","label":"授出日股票收市價、緊接授出日前 5 個營業日股票平均收市價、以及股份面值（如有）"},{"value":"B","label":"過去十年的最高歷史交易價"},{"value":"C","label":"授出當日開盤價的 10%"},{"value":"D","label":"發行人的每股淨現金價值"}],"answer":"A","explanation":"指南 2-66 頁 9.95 節及 MBLR 17.03E 規定：期權行使價不得低於以下較高者：(1) 授出日期（必須為交易日）聯交所日報表所載股份收市價；及 (2) 緊接授出日期前 5 個營業日聯交所日報表所載平均收市價。","reference":"MBLR 17.03E; HKSI Paper 5 Guide Topic 2 Section 9.95"},{"id":"T2-380","topic":"Topic 2","subtopic":"Notifiable Transactions - Aggregated Disposal & Acquisition Balancing","difficulty":"Level 3","question":"上市發行人若在 12 個月內先後向同一第三方獨立買家出售一項資產（比率為 22%），隨後又自該第三方處購入另一項資產（比率為 18%）。聯交所在合併計算須予公布交易時，處理原則為：","options":[{"value":"A","label":"兩項比率可互相抵減，按 4% 淨額豁免為股份交易"},{"value":"B","label":"收購與出售兩項交易不能相互抵銷，應分別獨立評估其性質，若聯交所認為兩項交易互為前提，可按資產總額或代價總額合併計算其最高適用比率以決定交易分類"},{"value":"C","label":"強制將兩者定性為反收購"},{"value":"D","label":"直接命令買方返還所有已交付資產"}],"answer":"B","explanation":"指南 2-41 頁 11.6 節及 MBLR 14.22 指明：不同性質的交易不能任意以淨額相互抵銷，聯交所審查時會考量交易的整體商業連繫性，按各交易的毛額（Gross）指標評估對發行人資本結構的整體影響。","reference":"MBLR 14.22; HKSI Paper 5 Guide Topic 2 Section 11.6"},{"id":"T2-381","topic":"Topic 2","subtopic":"Connected Transactions - Indemnities & Guarantees Exemption Scope","difficulty":"Level 3","question":"根據主板第 14.04(1)(e) 條及第 14A.06 條，上市發行人為其「全資附屬公司」（Wholly-owned subsidiary）的銀行融資提供履約保證或財務擔保，該交易在《上市規則》下的監管地位為：","options":[{"value":"A","label":"構成非常重大收購，必須聘請保薦人"},{"value":"B","label":"獲全面豁免（Fully exempt）遵守第 14 章須予公布交易及第 14A 章關連交易的全部申報、公告及股東大會批准要求"},{"value":"C","label":"必須在香港特別行政區憲報刊登通告"},{"value":"D","label":"擔保金額嚴禁超過 10 萬港元"}],"answer":"B","explanation":"指南 2-49 頁 11.32 節及 MBLR 14.04(1)(e)、14A.06 指明：發行人為其自身的全資子公司（Wholly-owned subsidiary）提供的常規商業擔保或財務資助，獲全面豁免遵守須予公布交易及關連交易規則，以利於集團內部常規融資流轉。","reference":"MBLR 14.04, 14A.06; HKSI Paper 5 Guide Topic 2 Section 11.32"},{"id":"T2-382","topic":"Topic 2","subtopic":"Takeovers Code Compliance as Listing Rule Obligation","difficulty":"Level 2","question":"根據主板第 13.23(2) 條及第 14.78 條（GLR 第 19.78 條），上市發行人及其董事若在重大股權變更中違反了香港《公司收購及合併守則》，在聯交所上市規則層面將引發何種後果？","options":[{"value":"A","label":"聯交所完全不予理會，因為《收購守則》是非法定的"},{"value":"B","label":"任何違反《收購守則》的行為，將直接被「視為違反上市規則」（Deemed a breach of the Listing Rules），聯交所可對該發行人及董事施加相應紀律處分"},{"value":"C","label":"發行人股票自動永久轉為無償公有化"},{"value":"D","label":"聯交所必須賠償全體受影響股東的差價"}],"answer":"B","explanation":"指南 1-37 頁 4.37 節、2-49 頁 11.33 節及 MBLR 14.78 明文規定：發行人及董事必須遵守《收購守則》，任何違反《收購守則》之情事均被視作違反《上市規則》，聯交所可直接啟動紀律處分甚至暫停股份買賣。","reference":"MBLR 14.78; GLR 19.78; HKSI Paper 5 Guide Topic 1 Section 4.37; Topic 2 Section 11.33"},{"id":"T2-383","topic":"Topic 2","subtopic":"Trading Suspension - Winding up Petition Filing","difficulty":"Level 2","question":"當上市發行人獲悉有債權人向香港法院提呈針對該發行人的「清盤呈請」（Winding-up petition）或法院已委任臨時清盤人時，發行人在上市監管下的首要合規行動為：","options":[{"value":"A","label":"私下將所有辦公設備轉移至董事家中"},{"value":"B","label":"即時通報聯交所並刊發公告披露該項內幕消息，且在必要時申請股份短暫停牌或停牌，以維護有序市場並防止投資者在重大清盤風險未知下交易"},{"value":"C","label":"嚴禁向外界披露任何清盤消息"},{"value":"D","label":"立即宣布向全體股東派發巨額特別現金股息"}],"answer":"B","explanation":"指南 1-27 頁 3.43(l) 節、2-51 頁 12.6(e) 節及 MBLR 13.25 指明：提交清盤呈請或委任接管人屬於法定重大內幕消息與停牌理由，發行人必須迅速公告，在不確定性消除前通常需要暫停股份買賣。","reference":"MBLR 13.25; HKSI Paper 5 Guide Topic 1 Section 3.43; Topic 2 Section 12.6"},{"id":"T2-384","topic":"Topic 2","subtopic":"Continuing Obligations - Sufficient Public Interest Post-RTO","difficulty":"Level 3","question":"因主營業務停滯而停牌的發行人提呈反收購（RTO）復牌方案。根據《上市規則》第 14.54 條，除收購標的符合新上市標準外，該發行人還必須向上市委員會證明：","options":[{"value":"A","label":"完成 RTO 後的發行人將具備「充足的公眾利益」（Adequate public interest in the listed issuer following the RTO），包括合理的股權分佈及充裕的公眾流通市值"},{"value":"B","label":"發行人全體董事已取得香港大律師公會會員資格"},{"value":"C","label":"新收購資產已在中央電視台投放廣告"},{"value":"D","label":"原控股股東已承諾永久放棄任何民事權利"}],"answer":"A","explanation":"指南 2-43 至 2-44 頁 11.14 節及 MBLR 14.54 指明：依賴 RTO 尋求復牌的空殼發行人，注入資產除滿足新上市標準外，重組後的發行人必須證明其具備足夠的公眾關注度與投資利益（Adequate public interest），杜絕復牌後即無交易之死殼。","reference":"MBLR 14.54; HKSI Paper 5 Guide Topic 2 Section 11.14"},{"id":"T2-385","topic":"Topic 2","subtopic":"Model Code - Dealings by Connected Persons through Discretionary Accounts","difficulty":"Level 3","question":"根據《上市規則》附錄 C3《標準守則》（Model Code），發行人董事將其個人證券賬戶全權委託予第三方獨立基金經理（Discretionary Account）代為管理。若該全權委託經理在發行人的業績禁售期內買入該發行人的股份，該董事的合規責任為：","options":[{"value":"A","label":"由於是全權委託，該董事在任何情況下均完全免除任何合規責任"},{"value":"B","label":"該董事仍受標準守則約束，董事必須向投資經理發出具體書面指示，禁止經理在禁售期內買賣該發行人證券；若未設立適當預防措施，該交易仍可被視為違反標準守則"},{"value":"C","label":"經理人必須代替該董事入獄服刑"},{"value":"D","label":"該發行人股票自動停牌 10 年"}],"answer":"B","explanation":"MBLR Appendix C3 Rule A.6 指明：董事對其全權委託投資賬戶負有監督責任，董事必須明確指示其投資經理在禁售期內不得買賣其任職發行人的證券，不得藉由全權委託作為規避內幕禁售規定的遮羞布。","reference":"MBLR Appendix C3 Rule A.6; HKSI Paper 5 Guide Topic 2 Section 3.34"},{"id":"T2-386","topic":"Topic 2","subtopic":"Continuing Obligations - Trading Day Turnover Criterion for GEM Streamlined Transfer","difficulty":"Level 3","question":"在合資格 GEM 發行人依據第 9B 章申請簡化轉往主板上市的資格中，其在「250 個交易日參考期」內，每日成交額不少於 50,000 港元的交易日比例要求為：","options":[{"value":"A","label":"在不少於 10% 的交易日"},{"value":"B","label":"在不少於 50% 的全部交易日內（On not less than 50% of all trading days over this Reference Period）"},{"value":"C","label":"在 100% 的所有交易日"},{"value":"D","label":"無成交量比例要求"}],"answer":"B","explanation":"指南 2-43 頁 8.36(d) 節及 MBLR 9B 指明：在緊接轉板申請前 250 個交易日的參考期內，發行人證券的每日成交金額必須在「不少於 50% 的交易日」（Not less than 50% of trading days）中達到至少 50,000 港元，以證明二級市場具備基本活躍度。","reference":"MBLR Chapter 9B; HKSI Paper 5 Guide Topic 2 Section 8.36(d)"},{"id":"T2-387","topic":"Topic 2","subtopic":"Mineral Companies - Competent Person Report Independence","difficulty":"Level 2","question":"根據主板第 18 章，礦業公司上市文件中載列的「合資格人士報告」（Competent Person's Report），出具該報告的專家在獨立性方面的法定要求為：","options":[{"value":"A","label":"該合資格人士必須為發行人的全職常務董事"},{"value":"B","label":"必須嚴格獨立於發行人（Must be independent of the issuer）、其附屬公司、控股股東及核心關連人士，且不得在發行人證券中擁有任何經濟利益"},{"value":"C","label":"合資格人士可持有發行人 20% 的期權"},{"value":"D","label":"合資格人士必須由香港地政總署署長兼任"}],"answer":"B","explanation":"指南 2-67 頁 9.97 節及 MBLR 18.21–18.22 規定：礦業公司的合資格人士報告必須由具備認可資格及實質經驗的獨立合資格人士（Independent Competent Person）出具，確保儲量評估與開採經濟效益評估不受利益衝突干擾。","reference":"MBLR Chapter 18; HKSI Paper 5 Guide Topic 2 Section 9.97"},{"id":"T2-388","topic":"Topic 2","subtopic":"Debt Securities to Professional Investors - Ongoing Disclosure Simplification","difficulty":"Level 2","question":"根據主板第 37 章（僅向專業投資者發售的債券上市），發行人在上市後所承擔的持續披露義務，與一般股權發行人相比：","options":[{"value":"A","label":"發行人必須按季刊發載有全體債權人名冊的專題通函"},{"value":"B","label":"享有極為精簡的持續義務（Simplified ongoing obligations），通常僅需及時披露影響其償債能力的重大違約事件或關鍵財務公告，無須遵守繁複的第 14 章非關連交易審批程序"},{"value":"C","label":"完全免除任何披露，即使破產亦毋須公告"},{"value":"D","label":"持續義務由承銷商全權代為承擔"}],"answer":"B","explanation":"指南 2-70 頁 9.114 節及 MBLR Chapter 37 指明：第 37 章債券專屬機構專業投資者，其持續義務大幅精簡，免除一般股權上市公司適用的繁冗章節規限，以維持高效靈活的債券市場發行環境。","reference":"MBLR Chapter 37; HKSI Paper 5 Guide Topic 2 Section 9.114"},{"id":"T2-389","topic":"Topic 2","subtopic":"Prospectus - Civil Liabilities Defences (CWUMPO s. 40)","difficulty":"Level 3","question":"根據 CWUMPO 第 40(2) 條，某董事若被指控就招股章程中的重大失實陳述負有民事損害賠償責任，該董事在下列哪種法定情形下可成功確立免責抗辯？","options":[{"value":"A","label":"該董事證明其雖知悉失實，但因公務繁忙未及時修改"},{"value":"B","label":"該董事證明其在招股章程發行前已撤回同意並發出公告；或證明就非專家陳述部分，其有合理理由相信且直至配發股份時仍合理相信該等陳述屬實（Had reasonable ground to believe statement was true）"},{"value":"C","label":"該董事證明其未曾領取任何董事薪酬"},{"value":"D","label":"該董事已向香港慈善機構捐出該年度全部津貼"}],"answer":"B","explanation":"CWUMPO s. 40(2) 及指南 2-33 頁 7.17 節指明：董事確立民事抗辯的法定途徑包括：(1) 事先撤回同意並發出公開通知；或 (2) 證明其經過審慎查詢後，有合理理由相信且直至配發為止一直相信該陳述屬真實準確（Reasonable grounds defense）。","reference":"CWUMPO s.40(2); HKSI Paper 5 Guide Topic 2 Section 7.17"},{"id":"T2-390","topic":"Topic 2","subtopic":"Underwriting - Allocation Discretion between Tranches","difficulty":"Level 2","question":"在香港 IPO 中，整體協調人（OC）行使酌情權將股份在配售檔份與公開發售檔份之間進行調配時，受到的法定規則约束為：","options":[{"value":"A","label":"協調人可任意將所有公開發售股份歸為私人自留"},{"value":"B","label":"必須遵守《第 18 項應用指引》（PN18）規定的強制性回撥階梯機制，並在最終配發結果公告中透明披露調配後的具體數量與比例"},{"value":"C","label":"必須經香港財政司司長簽發行政許可"},{"value":"D","label":"調配股份數目不得超過 10 股"}],"answer":"B","explanation":"指南 2-10 頁 3.7(c) 節、2-72 頁 10.8 節及 MBLR Practice Note 18 指明：檔份調配與回撥必須嚴格遵守 PN18 的法定公式與披露要求，確保公開發售散戶的合法配額獲得客觀保障。","reference":"MBLR Practice Note 18; HKSI Paper 5 Guide Topic 2 Section 3.7, 10.8"},{"id":"T2-391","topic":"Topic 2","subtopic":"Dual Filing - SFC Objections Timetable (10 Business Days)","difficulty":"Level 2","question":"根據《證券及期貨（股票市場上市）規則》（SMLR）第 6 條，證監會在接獲上市申請人的全套雙重存檔披露材料後，若認為其披露不足或反對其上市，證監會提出意見或反對的法定前置審閱時限為：","options":[{"value":"A","label":"接獲存檔文件後 24 小時之內"},{"value":"B","label":"在十個營業日之內（Within ten business days）提出意見或反對意向"},{"value":"C","label":"在 6 個月之後"},{"value":"D","label":"證監會無任何法定時限，可在上市滿三年後提出反對"}],"answer":"B","explanation":"指南 2-34 頁 7.28 節及 SMLR s. 6 指出：在雙重存檔架構下，證監會有權在 10 個營業日內（Within ten business days），就上市草擬文件（主要是招股章程）的披露提出意見，並可在披露嚴重不足下行使權力反對上市。","reference":"SMLR s.6; HKSI Paper 5 Guide Topic 2 Section 7.28"},{"id":"T2-392","topic":"Topic 2","subtopic":"FINI Platform - Sponsor Confirmation of Settlement","difficulty":"Level 2","question":"在香港 IPO 新發行流程中，指定保薦人透過 FINI 平台完成定價及分配確認後，發行人證券在聯交所正式上市掛牌的前提為：","options":[{"value":"A","label":"香港結算透過 FINI 系統確認所有新股已完成款項結算及股份過戶登記入賬（Admission to trading and settlement completed on FINI）"},{"value":"B","label":"全體中籤散戶親身前往交易所大堂簽署領取證書"},{"value":"C","label":"全港銀行停業一日以備款項交割"},{"value":"D","label":"保薦人繳清全額罰款"}],"answer":"A","explanation":"指南 2-59 頁 9.50 節及 FINI 營運規章指明：FINI 平台在 T+2 週期完成資金預繳結算、股份分配及中央結算系統（CCASS）股份記賬入戶，香港結算確認無誤後，證券方可於掛牌首日早上 9:30 正式開始買賣。","reference":"HKEX FINI Framework; HKSI Paper 5 Guide Topic 2 Section 9.50"},{"id":"T2-393","topic":"Topic 2","subtopic":"Corporate Governance Code - Mandatory Environmental KPIS Scope","difficulty":"Level 2","question":"根據聯交所《環境、社會及管治報告指引》（ESG Code, MBLR Appendix C2），發行人在「環境」（Environmental）範疇中必須依據指標披露的核心環境層面包括：","options":[{"value":"A","label":"廢氣及溫室氣體排放（Emissions）、資源使用（Use of resources）、減低對環境及天然資源的影響、以及氣候變化（Climate change）"},{"value":"B","label":"全體董事在假期的私人燃油消耗"},{"value":"C","label":"發行人所有外判律師事務所的用紙量"},{"value":"D","label":"僅限於辦公室盆栽的澆水量"}],"answer":"A","explanation":"指南 1-15 頁 2.11(a) 節及 MBLR Appendix C2 明確規定：環境範疇核心披露層面為：排放物（Emissions）、資源使用、環境及自然資源保護、以及氣候變化（Climate change）應對政策與量化關鍵績效指標（KPIs）。","reference":"MBLR Appendix C2; HKSI Paper 5 Guide Topic 1 Section 2.11(a)"},{"id":"T2-394","topic":"Topic 2","subtopic":"Corporate Governance - Diversity Policy Disclosure","difficulty":"Level 2","question":"根據主板第 13.92 條及《企業管治守則》，聯交所對上市發行人董事會成員在「多元化」（Diversity）方面的強制性合規底線要求為：","options":[{"value":"A","label":"發行人董事會成員必須全數由單一性別組成"},{"value":"B","label":"聯交所絕不接納單一性別的董事會（Single-gender board is not acceptable），發行人董事會成員必須至少包含一名不同性別的董事，並在年報披露董事會多元化政策與目標"},{"value":"C","label":"多元化僅屬自願參考，發行人可無限期維持全男性董事會"},{"value":"D","label":"全體董事必須具備相同的專業教育背景"}],"answer":"B","explanation":"指南 1-11 頁 2.4(g) 節、1-13 頁 2.8(d) 節及 MBLR 13.92 明確規定：單一性別董事會已全面被取締，發行人必須任命至少一名不同性別的董事以落實性別多元化，並在年報中強制披露多元化政策與進展指標。","reference":"MBLR 13.92, Appendix C1; HKSI Paper 5 Guide Topic 1 Section 2.4, 2.8"},{"id":"T2-395","topic":"Topic 2","subtopic":"Model Code - Director Trustee Role Dealings","difficulty":"Level 3","question":"根據主板附錄 C3《標準守則》（Model Code）第 A.4 條，若某上市發行人的董事出任某項信託的受託人（Trustee），在該信託買賣該發行人證券時，該董事受到的約束為：","options":[{"value":"A","label":"只要該董事不持有該信託的實益權益，即完全不受任何限制"},{"value":"B","label":"若該董事身為受託人且本身是該信託的實益擁有人，或其身為受託人能對投資決策施加實質控制，該信託的證券買賣均被視同該董事本人的交易，嚴格受禁售期及預先書面確認規定約束"},{"value":"C","label":"信託財產交易自動豁免於證券法規"},{"value":"D","label":"該董事必須立即解散該信託"}],"answer":"B","explanation":"MBLR Appendix C3 Rule A.4 指明：董事出任受託人的信託，若董事或其家屬享有實益權益，或該董事參與或能控制受託人投資決定，則該信託的一切買賣均受《標準守則》完全管轄，禁止在禁售期交易。","reference":"MBLR Appendix C3 Rule A.4; HKSI Paper 5 Guide Topic 2 Section 3.34"},{"id":"T2-396","topic":"Topic 2","subtopic":"Continuing Obligations - Cash Companies Principles Factors (Operations Level)","difficulty":"Level 3","question":"在評估發行人是否屬於現金公司時，根據主板第 14.82 條，發行人若聲稱其帳面巨額現金儲備是用於「未來潛在商業投資」，聯交所對此類抗辯的通常監管立場是：","options":[{"value":"A","label":"只要董事會作出未來的投資意向承諾，聯交所即無條件接納為合格營運業務"},{"value":"B","label":"僅有未來的投資計劃而缺乏現時具體開展的實質商業運作，不足以證明其具備足夠業務水平（Mere future investment intentions are insufficient），發行人仍會被認定為現金公司並予停牌"},{"value":"C","label":"聯交所直接頒令將現金劃撥給財政司司長"},{"value":"D","label":"發行人自動升級為第一上市跨國投資控股集團"}],"answer":"B","explanation":"指南 2-49 頁 11.36 節及 HKEX 指引指明：單純持有現金並宣稱未來有意收購，並不能滿足 MBLR 13.24 充足業務運作要求，聯交所不會僅憑未落實的收購意向豁免現金公司停牌處分。","reference":"MBLR 14.82; HKSI Paper 5 Guide Topic 2 Section 11.36"},{"id":"T2-397","topic":"Topic 2","subtopic":"Reverse Takeovers - Change in Control Definition Cross-reference","difficulty":"Level 2","question":"在聯交所《上市規則》第 14.06B 條的反收購明線測試中，何謂「控制權的變更」（Change in control），其法規定義直接引用自下列哪部監管守則？","options":[{"value":"A","label":"《香港銀行業條例》第 2 條"},{"value":"B","label":"《香港公司收購及合併守則》（Takeovers Code）中對控制權（30% 或以上投票權）的定義"},{"value":"C","label":"《防止賄賂條例》"},{"value":"D","label":"《最高法院破產規則》"}],"answer":"B","explanation":"指南 2-45 頁 11.18 節註釋明確指出：在 RTO 明線測試中，「控制權的變動」（Change in control）的定義與《收購守則》（Takeovers Code）所指相同，即指單獨或一致行動方持有 30% 或以上有投票權股份的地位發生更替。","reference":"MBLR 14.06B; Takeovers Code; HKSI Paper 5 Guide Topic 2 Section 11.18 Note"},{"id":"T2-398","topic":"Topic 2","subtopic":"Share Schemes - Scheme Amendment Approval Rules","difficulty":"Level 2","question":"根據主板第 17.03(18) 條，已採納的股份期權或股份獎勵計劃，若發行人擬對其既有條款作出任何「重大修訂」（Material change），法定審批程序為：","options":[{"value":"A","label":"只需由計劃行政管理人單方面簽字"},{"value":"B","label":"任何屬於重大性質的變更，均法定必須取得股東在股東大會上的批准（Must be approved by shareholders in general meeting），且修訂條款仍須符合第 17 章規定"},{"value":"C","label":"修訂條款必須呈交香港律政司司長簽批"},{"value":"D","label":"股份計劃一旦通過，法律上終身嚴禁作任何修訂"}],"answer":"B","explanation":"指南 2-66 頁 9.94 節及 MBLR 17.03(18) 明確規定：對已生效股份計劃的條款作出任何重大性質的修改，必須獲得股東於股東大會上批准，且修改後的條款依然必須嚴格遵守《上市規則》第 17 章的限制框架。","reference":"MBLR 17.03(18); HKSI Paper 5 Guide Topic 2 Section 9.94"},{"id":"T2-399","topic":"Topic 2","subtopic":"Convertible Securities - Pre-emptive Rights & General Mandate","difficulty":"Level 3","question":"上市發行人若擬發行附帶轉股權的可換股債券，在股東大會審批層面，發行人必須符合下列哪項上市規則核心要求？","options":[{"value":"A","label":"發行人發行任何可轉債均享有法定自動豁免，無須股東批准"},{"value":"B","label":"由於增發新股受制於優先受讓權原則，該發行必須取得股東的一般性授權（General Mandate）涵蓋其可能轉換的全部新股，或者就該項特定發行召開股東大會取得特定授權（Specific Mandate）"},{"value":"C","label":"只能在全部股東 100% 書面同意下方可發行"},{"value":"D","label":"轉換價格必須在發行滿十年後方可確定"}],"answer":"B","explanation":"指南 2-66 頁 9.91 節及 MBLR 13.36(2) 指明：發行可換股證券在未來涉及新股配發，若非按比例供股，必須受制於股東大會一般性授權（且轉股上限須落在一般授權額度內）或提呈股東大會獲特別授權批准。","reference":"MBLR 13.36; HKSI Paper 5 Guide Topic 2 Section 9.91"},{"id":"T2-400","topic":"Topic 2","subtopic":"Listing Rules - Informal Guidance from SEHK (MBLR 2.04)","difficulty":"Level 1","question":"根據主板第 2.04 條（GLR 第 2.07 條），當發行人或保薦人在籌劃一項架構新穎或複雜的上市或資本重組方案時，聯交所對發行人的指引與溝通機制為：","options":[{"value":"A","label":"嚴禁發行人在正式簽約前向聯交所發出任何諮詢，違者罰款 100 萬港元"},{"value":"B","label":"聯交所鼓勵新申請人及已上市發行人在必要時，在保密基礎上向聯交所尋求非正式及機密的監管指引（Seek informal and confidential guidance from SEHK）"},{"value":"C","label":"諮詢僅能透過向高等法院提出訴訟形式進行"},{"value":"D","label":"聯交所提供的所有指引必須強制在電視上公開播出"}],"answer":"B","explanation":"指南 1-36 頁 4.32 節、2-38 頁 8.3 節及 MBLR 2.04（GLR 2.07）明確指明：《上市規則》鼓勵發行人與保薦人就複雜、未有明確先例或敏感交易，盡早向聯交所尋求非正式且保密的預先指導（Informal and confidential guidance），以提高審批確定性。","reference":"MBLR 2.04; GLR 2.07; HKSI Paper 5 Guide Topic 1 Section 4.32; Topic 2 Section 8.3"},{"id":"T2-401","topic":"Topic 2","subtopic":"Listing Qualifications - Sufficient Spread of Shareholders Exceptions","difficulty":"Level 2","question":"根據主板第 8.08 條及 GEM 第 11.23 條，在下列哪種特殊發行場景下，新上市發行人可豁免遵守公眾持股量、最低 300 名（GEM 為 100 名）股東分佈，以及三大公眾股東持股不超 50% 的限制？","options":[{"value":"A","label":"發行人發行的是以紅股形式（Bonus issue）向現有股東發售的期權、認股權證或類似認購權，且過去五年內無股權高度集中跡象"},{"value":"B","label":"發行人屬於特專科技商業化公司"},{"value":"C","label":"發行人註冊在開曼群島且控股股東為香港永久居民"},{"value":"D","label":"保薦人願以個人名義包銷全部剩餘股份"}],"answer":"A","explanation":"指南 2-48 頁 9.4(g) 節及 MBLR 8.08 指明：若尋求上市的證券屬於以紅股形式向現有股東發行之期權、認股權證或類似認購權，且過去 5 年內並無股份過度集中跡象，則豁免適用最低股東人數及三大股東 50% 集中度等規定。","reference":"MBLR 8.08; GLR 11.23; HKSI Paper 5 Guide Topic 2 Section 9.4(g)"},{"id":"T2-402","topic":"Topic 2","subtopic":"IPO Placing Guidelines - Placing to Connected Clients Conditions","difficulty":"Level 3","question":"根據主板附錄 F1（配售指引），配售股份原則上嚴禁分配予整體協調人或分銷商的「關連客戶」（Connected clients）。但在何種嚴格條件下，聯交所可給予事先書面同意准許配售？","options":[{"value":"A","label":"只要該關連客戶支付雙倍手續費即可"},{"value":"B","label":"該關連客戶以全權委託客戶或特定合資格基金經理身分受聘，且並非以其自營利益名義認購，並符合最低分配價及最低獨立配售比例要求"},{"value":"C","label":"只要發行人董事會一致同意即可自行批准"},{"value":"D","label":"發行人在掛牌後 24 小時內補交報備"}],"answer":"B","explanation":"依據 MBLR Appendix F1 para 5 及指南 2-39 頁 8.12 節：向關連客戶配售原則上被禁止；僅在以全權委託基金（Discretionary fund）或獨立代客理財架構下行事，且經聯交所事先書面同意並滿足獨立定價條件時，方可獲得特定批准。","reference":"MBLR Appendix F1; HKSI Paper 5 Guide Topic 2 Section 8.12"},{"id":"T2-403","topic":"Topic 2","subtopic":"Secondary Listings - Centre of Gravity in Greater China","difficulty":"Level 2","question":"在判定海外上市企業是否具備「大中華業務重心」（Centre of gravity in Greater China）時，根據主板第 19C 章，聯交所考量的非窮盡客觀因素包括：","options":[{"value":"A","label":"僅考量公司註冊地是否在開曼群島"},{"value":"B","label":"是否已在大中華地區上市、註冊地、歷史沿革、主要營業地與總部所在、核心資產所在地、稅務地位、以及管理層與控股股東的國籍或常住地"},{"value":"C","label":"全體員工是否均能使用普通話溝通"},{"value":"D","label":"公司是否在香港設立了實體門店"}],"answer":"B","explanation":"指南 2-45 頁 8.42 節註釋 1 及 MBLR 19C.01 列明認定大中華業務重心的核心考量維度：涵蓋資產所在地、營運總部、中央管理所在地、歷史淵源、稅務居民身份及控股股東/核心管理層的國籍背景。","reference":"MBLR Chapter 19C; HKSI Paper 5 Guide Topic 2 Section 8.42 Note 1"},{"id":"T2-404","topic":"Topic 2","subtopic":"Transfer from GEM to Main Board - Serious Breach 12-Month Bar","difficulty":"Level 2","question":"根據主板第 9A.02 條，GEM 發行人申請轉移至主板上市時，在過去 12 個月內的合規表現上必須滿足何種硬性先決條件？","options":[{"value":"A","label":"在遞交轉板申請前 12 個月內，發行人未曾被裁定嚴重違反（Serious breach）GEM 上市規則或主板上市規則，且在申請日及開始買賣日均非聯交所嚴重違規調查或紀律程序之對象"},{"value":"B","label":"過去 12 個月內不得更換過任何獨立非執行董事"},{"value":"C","label":"過去 12 個月內股價不得出現下跌"},{"value":"D","label":"過去 12 個月內營業額必須翻倍"}],"answer":"A","explanation":"指南 2-42 至 2-43 頁 8.34(c)–(d) 節及 MBLR 9A.02 規定：轉板發行人在申請前 12 個月內不得有嚴重違規紀錄，且在申請遞交及掛牌開始時，不得正受聯交所就涉嫌嚴重違規進行調查或處於紀律程序中。","reference":"MBLR 9A.02; HKSI Paper 5 Guide Topic 2 Section 8.34"},{"id":"T2-405","topic":"Topic 2","subtopic":"Transfer from GEM to Main Board - PHIP Exemption","difficulty":"Level 1","question":"GEM 上市發行人按照常規程序（MBLR 第 9A 章）委聘保薦人申請轉往主板上市時，其在公開披露文件上享有下列哪項專項程序豁免？","options":[{"value":"A","label":"免除出具任何招股標準通函"},{"value":"B","label":"獲豁免在披露易網站刊發「聆訊後資料集」（Exempt from publishing a Post Hearing Information Pack, PHIP）"},{"value":"C","label":"免除向聯交所繳付任何轉板申請費"},{"value":"D","label":"轉板後永久免除受主板退市規則管轄"}],"answer":"B","explanation":"指南 2-43 頁 8.35 節及 MBLR 9A 指明：常規轉板發行人仍須委任保薦人並編制符合招股標準的上市文件，但聯交所明確豁免其刊登聆訊後資料集（PHIP），因其歷史交易資訊早已在二級市場全面公開。","reference":"MBLR 9A; HKSI Paper 5 Guide Topic 2 Section 8.35"},{"id":"T2-406","topic":"Topic 2","subtopic":"Methods of Listing - Placing on Main Board Significant Demand Restriction","difficulty":"Level 2","question":"根據主板上市規則第 7.10 條，新申請人若擬「單純以配售形式」（Placing only，不含公開認購）在主板尋求上市，聯交所在何種情形下**不會**批准該上市方式？","options":[{"value":"A","label":"當發行人為海外企業時"},{"value":"B","label":"當聯交所認為公眾對該批證券相當可能有重大需求（Likely to be a significant public demand for the securities）時"},{"value":"C","label":"當配售對象均為大型主權基金時"},{"value":"D","label":"當發行人的預期市值超過 100 億港元時"}],"answer":"B","explanation":"指南 2-38 頁 8.11 節及 MBLR 7.10 指明：若市場公眾對新發行人證券可能有龐大需求，聯交所將不准許僅以配售形式上市，發行人必須納入公開發售檔份（Public offer tranche），確保零售散戶享有公平認購機會。","reference":"MBLR 7.10; HKSI Paper 5 Guide Topic 2 Section 8.11"},{"id":"T2-407","topic":"Topic 2","subtopic":"Methods of Listing - Introduction Prior Marketing Restriction (6 Months)","difficulty":"Level 2","question":"根據主板第 7.15 條，發行人若擬以「介紹形式」（Introduction）申請在聯交所上市，在上市前的推廣活動上受到何種限制？","options":[{"value":"A","label":"在上市前 10 年內嚴禁在香港刊登任何廣告"},{"value":"B","label":"若在擬定介紹上市前六個月內（Within six months prior），曾在香港進行該股份的市場推廣且該推廣是以獲得上市為條件，則僅在例外情況下才獲准以介紹形式上市"},{"value":"C","label":"介紹上市前必須先進行電視購物促銷"},{"value":"D","label":"完全無任何推廣時間限制"}],"answer":"B","explanation":"指南 2-40 頁 8.17 節及 MBLR 7.15 規定：介紹形式上市要求證券已廣泛流通；若在申請前 6 個月內曾在香港進行有條件推廣，表明該股份未自然形成充分市場流通量，聯交所僅在極特殊情況下才會破例接納介紹上市。","reference":"MBLR 7.15; HKSI Paper 5 Guide Topic 2 Section 8.17"},{"id":"T2-408","topic":"Topic 2","subtopic":"Anti-dilution - Theoretical Diluted Price Calculation Formula","difficulty":"Level 3","question":"根據主板第 7.27B 條註釋，在計算防稀釋 25% 規則的「理論稀釋價」（Theoretical Diluted Price）時，其法規劃定的分子與分母計算公式為：","options":[{"value":"A","label":"將本次擬籌集的資金總額，除以發行新股總數"},{"value":"B","label":"將緊接發行前發行人的總市值（按基準市價計算）加上擬籌集的總款額，除以經擴大後的已發行股份總數（不含庫存股）"},{"value":"C","label":"公司總資產淨值除以全體債權人數目"},{"value":"D","label":"原股票收盤價直接扣減 25%"}],"answer":"B","explanation":"指南 2-41 頁 8.26 節註釋 3 及 MBLR 7.27B 指明：理論稀釋價計算公式為：[原有總市值（基準市價 × 原股數）+ 擬募集款項] ÷ 經新發行股份擴大後的總已發行股份數（扣除庫存股份）。","reference":"MBLR 7.27B Note; HKSI Paper 5 Guide Topic 2 Section 8.26 Note 3"},{"id":"T2-409","topic":"Topic 2","subtopic":"Anti-dilution - Circular Detailed Proceeds Breakdown","difficulty":"Level 2","question":"上市發行人進行供股或公開發售向股東寄發通函時，根據主板第 7.27 條，通函中除交代本次所得款項用途外，還必須就過去 12 個月內的集資情況交代何種資訊？","options":[{"value":"A","label":"過去 12 個月內全體承銷商的個人交稅紀錄"},{"value":"B","label":"過去 12 個月內透過發行股本證券所籌集款項的具體動用明細，包括任何尚未動用的資金總額以及針對該筆未動用款項的具體後續使用計劃"},{"value":"C","label":"全體認購人過去一年的差旅費報銷單據"},{"value":"D","label":"保證集資款項在銀行存款中獲取 10% 零風險利息的合同"}],"answer":"B","explanation":"指南 2-41 頁 8.27 節及 MBLR 7.27 規定：通函中必須詳列前 12 個月內各項股本發行所得款項的實際動用明細，特別須披露尚存的未動用款項金額（Unutilised funds）及發行人對該筆款項的未來落實計劃，防止盲目集資挪用。","reference":"MBLR 7.27; HKSI Paper 5 Guide Topic 2 Section 8.27"},{"id":"T2-410","topic":"Topic 2","subtopic":"Overseas Issuers - Acceptable Accounting Standards (EU-IFRS & US GAAP)","difficulty":"Level 2","question":"根據主板第 19 章及第 19C 章，對於在香港尋求第一上市或第二上市的特定海外發行人，聯交所接納採用的替代財務報告準則包括：","options":[{"value":"A","label":"任何未經審計的內部管理流水帳"},{"value":"B","label":"歐盟成員國企業適用經歐盟採納的國際財務報告準則（EU-IFRS），在美國雙重上市或主要上市者適用美國公認會計原則（US GAAP）"},{"value":"C","label":"僅限於香港本地財務報告準則（HKFRS），絕無任何外國準則例外"},{"value":"D","label":"瑞士地方城鎮會計準則"}],"answer":"B","explanation":"指南 2-45 頁 8.43 節及 MBLR 19.12 指明：除 HKFRS 及 IFRS 外，聯交所接納特定替代會計準則：歐盟註冊企業可採用 EU-IFRS，而在美國有上市地位之企業可採用 US GAAP 編制其會計師報告。","reference":"MBLR 19.12, 19C.10; HKSI Paper 5 Guide Topic 2 Section 8.43"},{"id":"T2-411","topic":"Topic 2","subtopic":"Connected Persons - PRC Issuers Domestic Shareholder Treatment","difficulty":"Level 2","question":"在審查在港上市 H 股企業的關連交易時，持有該 H 股發行人 10% 以上非上市內資股（Domestic Shares）的內地母公司法人，在《上市規則》下的身份界定為：","options":[{"value":"A","label":"因持有的是非上市股份，故不屬於關連人士"},{"value":"B","label":"因持有發行人有表決權股份逾 10%，依法構成發行人的「大股東」（Substantial Shareholder），從而屬於發行人的「核心關連人士」（Core Connected Person）"},{"value":"C","label":"僅屬於無關聯境內合作夥伴"},{"value":"D","label":"外聘財務審計顧問"}],"answer":"B","explanation":"指南 2-47 至 2-48 頁 11.27–11.28 節及 MBLR 14A.07 指明：大股東定義取決於其在發行人股東大會控制的表決權（不分股份類別）。持有逾 10% 內資股即構成大股東，依法直接屬於發行人的核心關連人士。","reference":"MBLR 14A.07; HKSI Paper 5 Guide Topic 2 Section 11.27-11.28"},{"id":"T2-412","topic":"Topic 2","subtopic":"Connected Transactions - Auditor Confirmation Negative Statement","difficulty":"Level 2","question":"外聘核數師受聘依據主板第 14A.56 條就持續關連交易（CCT）向董事會出具確認函時，其確認函件的表達形式通常為：","options":[{"value":"A","label":"出具絕對無條件的積極確信擔保"},{"value":"B","label":"以事實審查為基礎出具否定確認陳述（Negative statement），確認並無注意到任何事項致使核數師認為交易未獲批准、未依政策進行或超逾年度上限"},{"value":"C","label":"建議全體董事集體辭職的函件"},{"value":"D","label":"向廉政公署舉報的秘密信函"}],"answer":"B","explanation":"指南 2-47 頁 11.25 節及 MBLR 14A.56 規定：核數師針對持續關連交易進行的是有限確信程序的審核，出具的是包含否定式核證形式的函件（Confirming nothing has come to their attention causing them to believe...），覆蓋董事會批准、定價及年度上限遵守情況。","reference":"MBLR 14A.56; HKSI Paper 5 Guide Topic 2 Section 11.25"},{"id":"T2-413","topic":"Topic 2","subtopic":"Notifiable Transactions - Financial Assistance Calculation","difficulty":"Level 3","question":"上市發行人若為某非全資實體向銀行申請的 5,000 萬港元商業貸款提供全額連帶責任保證擔保。在計算該項須予公布交易的資產比率及代價比率時，其分子（Numerator）數值應採納：","options":[{"value":"A","label":"發行人註冊資本的 1%"},{"value":"B","label":"該項財務資助所涉及的最高可能風險承擔總額，即該筆擔保貸款的最高總面額 5,000 萬港元加上預期利息與相關支出"},{"value":"C","label":"僅計算發行人實際支付的 0 元擔保手續費"},{"value":"D","label":"全體少數股東名下的未清繳股款"}],"answer":"B","explanation":"依據 MBLR 14.15 及指南 2-41 頁 11.7 節：提供財務資助或擔保時，計算百分比率的分子為發行人所承擔的最大財務風險敞口總額（The maximum guaranteed liability or financial assistance amount），即該 5,000 萬港元全額負債上限。","reference":"MBLR 14.15; HKSI Paper 5 Guide Topic 2 Section 11.7"},{"id":"T2-414","topic":"Topic 2","subtopic":"Notifiable Transactions - Options Granting and Exercise Classification","difficulty":"Level 3","question":"上市發行人若自獨立第三方處購入一項收購標的資產的看漲期權（Call option），根據主板第 14.73 條至第 14.77 條，該期權交易在各階段的分類測試原則為：","options":[{"value":"A","label":"僅在期權到期失效當天才計算比率"},{"value":"B","label":"期權授出／購入時須按期權溢價加上行使價計算最高可能代價；而在期權行使時，若行使屬發行人全權酌情決定，則在決定行使之時將相關資產收購再次按適用比率分類並合規"},{"value":"C","label":"期權買賣一律永久視為股份交易"},{"value":"D","label":"完全免除任何第 14 章公布要求"}],"answer":"B","explanation":"依據 MBLR 14.73–14.77：期權交易涉及兩階段監管：授予/收購時按權利金加行權代價進行初始百分比率分類；其後行使酌情期權時，視為正式實施收購，須按行使時的相關指標再次進行比率測試並履行相應的通函/股東批准手續。","reference":"MBLR 14.73-14.77; HKSI Paper 5 Guide Topic 2 Section 11.7"},{"id":"T2-415","topic":"Topic 2","subtopic":"Reverse Takeovers - Factors on Issuer Pre-Acquisition Nature (Shells)","difficulty":"Level 2","question":"在 RTO 原則驗證法下，聯交所考量發行人在進行重大收購前自身的業務性質及規模（Nature and scale before acquisition）時，下列哪類特徵的發行人最容易被直接判定為借殼反收購？","options":[{"value":"A","label":"具備龐大自置實體工廠且常年獲利穩定的大型藍籌集團"},{"value":"B","label":"自身業務規模已縮減至微不足道（De minimis operations）、主營業務停滯、或具備典型「殼股」（Shell-like characteristics）特徵的上市發行人"},{"value":"C","label":"全資持有受香港金管局監管銀行的金融機構"},{"value":"D","label":"每年投放巨額研發支出的科技企業"}],"answer":"B","explanation":"指南 2-44 頁 11.17(c) 節註釋明確指出：發行人在收購前若自身業務萎縮、運作規模微小、具備殼股特質（Shell-like characteristics），其推進的任何大額資產注入均會被推定為意圖借殼規避新上市審查的 RTO。","reference":"MBLR 14.06B; HKSI Paper 5 Guide Topic 2 Section 11.17 Note"},{"id":"T2-416","topic":"Topic 2","subtopic":"Extreme Transactions - Substantial Size Quantitative Threshold (HK$1 Billion)","difficulty":"Level 2","question":"在申請將反收購重分類為極端交易（Extreme Transaction）時，聯交所所指的發行人原有業務具備「龐大規模」（Substantial size），其指引中的具體量化財務參考指標通常為：","options":[{"value":"A","label":"發行人賬面現金不少於 100 萬港元"},{"value":"B","label":"發行人在最近公布的經審計財務報表中，年度收益或總資產值達到 10 億港元或以上（Annual revenue or total asset value of HK$1 billion or more）"},{"value":"C","label":"發行人的淨資產收益率超過 50%"},{"value":"D","label":"發行人在全球擁有不少於 10,000 名僱員"}],"answer":"B","explanation":"指南 2-46 頁 11.19 節註釋指明：聯交所判定發行人原有業務具備「龐大規模」（Substantial size）的指引門檻為：發行人最近期經審計年報顯示其年度收益或總資產值達到 10 億港元（HK$1 billion）或以上。","reference":"MBLR 14.06C; HKSI Paper 5 Guide Topic 2 Section 11.19 Note"},{"id":"T2-417","topic":"Topic 2","subtopic":"Extreme Transactions - 36-Month Long Period Control Requirement","difficulty":"Level 2","question":"極端交易（Extreme Transaction）認定的另一項關鍵前提，是發行人必須受同一人或同一組人士控制或事實上控制達多長時間，且該交易不會導致控制權更替？","options":[{"value":"A","label":"至少 6 個月"},{"value":"B","label":"長時期，通常至少 36 個月（Long period, normally at least 36 months）"},{"value":"C","label":"至少 10 年"},{"value":"D","label":"只需在簽約日前一天維持控制即可"}],"answer":"B","explanation":"指南 2-45 頁 11.19(a) 節及 MBLR 14.06C 規定：發行人若要證明非買殼重組，必須證明其處於同一控制人或同一組控制人的實質管治下達相當長的時間（通常至少 36 個月），且收購後控制權維持不變。","reference":"MBLR 14.06C; HKSI Paper 5 Guide Topic 2 Section 11.19(a)"},{"id":"T2-418","topic":"Topic 2","subtopic":"Reverse Takeovers - Disposals in Specie within 36 Months Financial Tests","difficulty":"Level 3","question":"根據主板第 14.06E 條，在控制權變動後 36 個月內，發行人若擬剝離其原有核心業務，剩餘資產必須能夠滿足新上市申請人的量化財務資格。該量化測試在審查時主要指：","options":[{"value":"A","label":"剩餘資產必須獨立滿足 MBLR 第 8.05 條下的盈利測試、市值/收益/現金流測試或市值/收益測試之一"},{"value":"B","label":"剩餘資產只需賬面無負債即可"},{"value":"C","label":"剩餘資產必須為純外幣現金存款"},{"value":"D","label":"剩餘資產每年必須獲得香港政府全額補助"}],"answer":"A","explanation":"指南 2-47 頁 11.23 節及 MBLR 14.06E 明確規定：出售或實物分派後，留存於發行人旗下的剩餘業務資產，必須能獨立滿足第 8.05 條適用於新上市申請人的三大常規量化財務標準之一（Quantitative tests），防止留下無法獨立上市的劣質空殼。","reference":"MBLR 14.06E, 8.05; HKSI Paper 5 Guide Topic 2 Section 11.23"},{"id":"T2-419","topic":"Topic 2","subtopic":"Cash Companies - Securities Investments Proprietary Trading Treatment","difficulty":"Level 3","question":"根據主板第 14.82 條，非金融類別的傳統製造業上市發行人若將其全部實體業務出售，轉而以其全部資金在二級市場進行自營證券交易與股票投資（Proprietary trading），聯交所對該自營投資業務的態度為：","options":[{"value":"A","label":"接納該股票自營交易為足夠水平的實體主營業務並准許其正常掛牌"},{"value":"B","label":"該等自營證券交易及投資將被視為短期投資，一般不會被視為足夠的實體營運業務（Will normally not be considered sufficient operations），該公司將被直接定性為現金公司並予停牌"},{"value":"C","label":"強制將該發行人自動升格為持牌銀行"},{"value":"D","label":"豁免遵守所有可持續性要求"}],"answer":"B","explanation":"指南 2-49 頁 11.34 節及 2-52 頁 12.11 節註釋指明：發行人的自營證券買賣與投資（除非其為受規管銀行、保險或持牌證券商），在評估 MBLR 13.24 營運水平時通常不被視為合格實體業務，不能藉自營炒股規避現金公司停牌處分。","reference":"MBLR 14.82, 13.24; HKSI Paper 5 Guide Topic 2 Section 11.34, 12.11"},{"id":"T2-420","topic":"Topic 2","subtopic":"Trading Halt - Immediate Aftermarket Rumour Rebuttal","difficulty":"Level 2","question":"上市發行人遭受嚴重的匿名沽空機構指控報告襲擊，股價盤中急跌 40%。若發行人因需核對跨境工廠數據而無法在當天午市開市前刊發詳盡的澄清公告，董事會合規的做法是：","options":[{"value":"A","label":"在午市開市前向聯交所申請短暫停牌（Trading halt），並在停牌期間集中核實資料以盡快發布載有逐項反駁的正式澄清公告以復牌"},{"value":"B","label":"不採取任何行動，任由市場自由踩踏交易"},{"value":"C","label":"授權董事長在個人社交賬號以匿名留言回擊"},{"value":"D","label":"立即宣布公司永久停業"}],"answer":"A","explanation":"指南 2-50 至 2-51 頁 12.4 節及 MBLR 13.10A 指明：面對嚴重指控且無法即時發布澄清時，發行人必須主動申請短暫停牌（Trading halt），以截斷混亂交易，並在停牌期間完成抗辯核實並刊登詳盡澄清公告。","reference":"MBLR 13.10A; HKSI Paper 5 Guide Topic 2 Section 12.4"},{"id":"T2-421","topic":"Topic 2","subtopic":"Trading Suspension - Maintaining an Orderly Market (MBLR 6.01)","difficulty":"Level 1","question":"根據主板上市規則第 6.01 條，聯交所行使權力在任何時候指令任何證券短暫停牌、停牌或除牌時，其至高無上的監管職責基準為：","options":[{"value":"A","label":"確保聯交所自身的每日交易佣金收入達到預算目標"},{"value":"B","label":"在聯交所認為為保障投資者或維持一個有序及公平的市場而屬必要時（Necessary for the protection of the investor or maintenance of an orderly market）"},{"value":"C","label":"保護上市公司控股股東個人的家族財富不縮水"},{"value":"D","label":"貫徹外國交易所的單方面行政命令"}],"answer":"B","explanation":"指南 2-50 頁 12.1 節及 MBLR 6.01 明確規定：聯交所授予或維持上市地位的前提，是交易所保留在認為維護投資者利益或維護公平有序市場秩序（Orderly and fair market）所必需時，隨時行使停牌或除牌處分權威。","reference":"MBLR 6.01; HKSI Paper 5 Guide Topic 2 Section 12.1"},{"id":"T2-422","topic":"Topic 2","subtopic":"SFC Powers to Suspend under SMLR - False Listing Documents","difficulty":"Level 2","question":"根據《證券及期貨（股票市場上市）規則》（SMLR）第 8(1)(a) 條，證監會若發現上市公司過往刊發的招股章程或通函載有重大虛假或具誤導性資料，證監會命令聯交所停牌的法定依據為：","options":[{"value":"A","label":"發行人刊發的文件在要項上載有虛假、不完整或具誤導性的資料（Materially false, incomplete or misleading information）"},{"value":"B","label":"發行人未向證監會主席致送賀卡"},{"value":"C","label":"發行人股票在過去一年換手率低於 1%"},{"value":"D","label":"保薦人更換了辦公桌椅"}],"answer":"A","explanation":"指南 2-52 至 2-53 頁 12.15(a) 節及 SMLR Rule 8(1)(a) 指明：凡與上市或持續披露相關的文件載有重大虛假、不完整或誤導性資料，證監會獲法例直接賦權指令聯交所暫停該證券交易。","reference":"SMLR Rule 8; HKSI Paper 5 Guide Topic 2 Section 12.15(a)"},{"id":"T2-423","topic":"Topic 2","subtopic":"SMLR Representations to SFC by Issuer and SEHK","difficulty":"Level 2","question":"根據 SMLR 第 8 條及第 9 條，當證監會擬行使法定權力命令某證券停牌或指示聯交所取消其上市地位時，發行人及聯交所享有的程序保障為：","options":[{"value":"A","label":"證監會的命令屬於即刻不可撤銷的軍事管制命令"},{"value":"B","label":"發行人及聯交所雙方均有權向證監會作出實質陳述（Right to make representations to the SFC），且中介人及專業顧問獲准代表發行人進行抗辯陳述"},{"value":"C","label":"發行人全體董事自動喪失人身自由"},{"value":"D","label":"所有股份自動轉移給香港立法會"}],"answer":"B","explanation":"指南 2-35 頁 7.30 節及 SMLR Rule 8/9 規定程序正義保障：證監會在下達停牌或除牌指令前或後，發行人及聯交所均有權向證監會提交書面或口頭申述（Make representations），機構融資顧問亦可代表發行人陳詞。","reference":"SMLR Rules 8, 9; HKSI Paper 5 Guide Topic 2 Section 7.30"},{"id":"T2-424","topic":"Topic 2","subtopic":"Cancellation of Listing - Appeal Process to Listing Review Committee","difficulty":"Level 2","question":"當上市委員會正式通過決議案，決定取消某上市發行人的上市地位（除牌）時，發行人若擬挑戰該項除牌裁決，其法定覆核路徑為：","options":[{"value":"A","label":"直接向香港特首辦提出特赦請求"},{"value":"B","label":"在規定期限內向上市覆核委員會（LRC）正式呈交覆核申請，由 LRC 召開覆核聆訊並出具最終決定"},{"value":"C","label":"私下向全港報章發布抗議通告即可阻止除牌生效"},{"value":"D","label":"除牌決定不可覆核，股份在 24 小時內自動註銷"}],"answer":"B","explanation":"指南 2-52 頁 12.14 節及 MBLR 2A.11 指明：上市發行人有權就上市委員會作出的取消上市地位決定提出上訴覆核，該覆核程序由上市覆核委員會（LRC）獨立進行聆訊審理。","reference":"MBLR 2A.11, 2A.37A; HKSI Paper 5 Guide Topic 2 Section 12.14"},{"id":"T2-425","topic":"Topic 2","subtopic":"Voluntary Withdrawal - Alternative Listing Secondary Withdrawal Notice","difficulty":"Level 3","question":"某跨國發行人的第一上市地在倫敦證交所，在香港僅為「第二上市」（Secondary listing）。若該發行人擬自願撤回在香港聯交所的第二上市地位，根據《上市規則》第 6.13 條，其審批與通知程序為：","options":[{"value":"A","label":"必須獲得香港股東大會以 100% 全票贊成通過"},{"value":"B","label":"完全無須取得香港股東大會批准（No shareholders' approval is required），發行人只需向香港股東發出不少於三個月的事先通知（Not less than three months' notice）並遵守其主要上市地法規即可"},{"value":"C","label":"必須在香港法院提存全額回購款"},{"value":"D","label":"第二上市發行人終身嚴禁自願撤銷香港上市"}],"answer":"B","explanation":"指南 2-53 頁 12.19 節註釋及 MBLR 6.13 明確指明：若海外替代市場為該發行人的主要上市地，撤回在港的第二上市無須香港股東大會表決批准；發行人只需向香港證券持有人發出不少於 3 個月的預先通知即可辦理除牌手續。","reference":"MBLR 6.13; HKSI Paper 5 Guide Topic 2 Section 12.19 Note"},{"id":"T2-426","topic":"Topic 2","subtopic":"Voluntary Withdrawal - No Alternative Listing 10% Negative Vote Ceiling","difficulty":"Level 3","question":"對於在香港聯交所第一上市且無任何替代上市地點的發行人，自願撤銷上市地位時，在股東大會投票反對該決議案的票數門檻上限為：","options":[{"value":"A","label":"反對票不得超過出席大會表決權的 10%（No more than 10% of the votes cast against the resolution）"},{"value":"B","label":"反對票只要達到 1 票即可否決"},{"value":"C","label":"反對票上限為 50%"},{"value":"D","label":"無反對票限制，只要贊成票達到 75% 即可"}],"answer":"A","explanation":"指南 2-54 頁 12.20(c) 節及 MBLR 6.15 規定無替代上市發行人退市嚴格標準：(1) 贊成票至少 75%；且 (2) 投反對票的表決權數目不得超過在該大會上投出的全體表決權數目的 10%（No more than 10% cast against）。","reference":"MBLR 6.15; HKSI Paper 5 Guide Topic 2 Section 12.20(c)"},{"id":"T2-427","topic":"Topic 2","subtopic":"Winding Up - Order of Priority of Distribution","difficulty":"Level 2","question":"根據 CWUMPO 第 V 部關於香港公司清盤變賣資產後的法定求償次序，在償付公司債務時的最基本優先次序架構為：","options":[{"value":"A","label":"普通股股東 → 優先股股東 → 銀行無抵押貸款 → 清盤人費用"},{"value":"B","label":"有擔保固定抵押債權人及清盤費用 → 優先債權（如法定僱員欠薪、稅項） → 浮動抵押債權人 → 普通無抵押債權人 → 股東（按資本權益）"},{"value":"C","label":"全額優先分配予董事及最高管理層的花紅"},{"value":"D","label":"按全體債權人年齡大小依序派發"}],"answer":"B","explanation":"指南 2-54 頁 12.22 節及 CWUMPO Part V 規定法定分配順序：清盤成本及有擔保債權優先受償，次為法例規定的優先債項（僱員薪津、稅收），其後為浮動押記持有人與一般無擔保債權人，股東僅在清償所有債項後享有剩餘資產分配權。","reference":"CWUMPO Part V; HKSI Paper 5 Guide Topic 2 Section 12.22"},{"id":"T2-428","topic":"Topic 2","subtopic":"Disciplinary Proceedings - Senior Management Broad Definition","difficulty":"Level 2","question":"在聯交所上市委員會行使紀律處分權力所管轄的「高級管理層」（Senior Management）定義中，根據主板第 2A.09 條，該範疇涵蓋：","options":[{"value":"A","label":"僅限於董事會成員名冊上的個人"},{"value":"B","label":"除最高行政人員及財務總監外，亦涵蓋在董事直接管轄下執行管理職能的人員、以及發行人對外指稱為其高級管理層的任何個人"},{"value":"C","label":"全體辦公室行政秘書"},{"value":"D","label":"公司所有全職合約工人"}],"answer":"B","explanation":"指南 2-55 頁 13.3(b) 節註釋及 MBLR 2A.09 指明：高級管理層定義極廣，涵蓋 CEO、CFO、在董事直接權威下管理核心業務的部門主管，以及任何由發行人宣稱為高級管理層的個人，彼等均為紀律處分對象。","reference":"MBLR 2A.09; HKSI Paper 5 Guide Topic 2 Section 13.3 Note"},{"id":"T2-429","topic":"Topic 2","subtopic":"Disciplinary Proceedings - Guarantors Jurisdiction","difficulty":"Level 2","question":"根據主板第 2A.09 條，在涉及擔保發行債務證券或衍生結構性產品的上市架構中，上市委員會紀律處分權力的直接管轄對象包括：","options":[{"value":"A","label":"為該等已上市債務證券或結構性產品提供擔保的「擔保人」（Any guarantor in the case of a guaranteed issue）"},{"value":"B","label":"擔保人所屬國家的最高法院法官"},{"value":"C","label":"任何在報章閱讀過擔保通告的普通市民"},{"value":"D","label":"僅限於發售文件的排版人員"}],"answer":"A","explanation":"指南 2-56 頁 13.3(i) 節及 MBLR 2A.09 明文指明：在有擔保的債務證券或結構性產品發行中，擔保人（Guarantors）依法直接被列入聯交所上市委員會的紀律處分管轄主體清單內。","reference":"MBLR 2A.09; HKSI Paper 5 Guide Topic 2 Section 13.3(i)"},{"id":"T2-430","topic":"Topic 2","subtopic":"Disciplinary Sanctions - Market Facilities Denial Period","difficulty":"Level 2","question":"根據主板第 2A.10(e) 條，上市委員會在行使紀律處分時，對嚴重違規的上市發行人有權施加下列哪項設施剝奪制裁？","options":[{"value":"A","label":"禁止發行人使用香港國際機場"},{"value":"B","label":"在指定期限內、及／或直至特定合規條件獲滿足前，禁止該上市發行人使用市場設施（Prohibiting the listed issuer from using the facilities of the market for a specified period）"},{"value":"C","label":"禁止發行人開設香港本地銀行賬戶"},{"value":"D","label":"命令其全體員工停止使用電郵通訊"}],"answer":"B","explanation":"指南 2-56 頁 13.4(e) 節及 MBLR 2A.10(b) 規定：聯交所可禁止發行人在指定期限內或在達成特定整改條件前使用市場設施（如禁止後續股本配售、禁止發行新工具融資等）。","reference":"MBLR 2A.10; HKSI Paper 5 Guide Topic 2 Section 13.4(e)"},{"id":"T2-431","topic":"Topic 2","subtopic":"Model Code - Definition of Dealing in Securities","difficulty":"Level 2","question":"根據主板附錄 C3《標準守則》（Model Code）第 A.1 條，在評估董事是否觸犯禁售期交易限制時，「買賣／處理證券」（Dealing in securities）的涵義包括：","options":[{"value":"A","label":"僅限於在二級市場進行公開現貨現金買入"},{"value":"B","label":"涵義極廣，包括購買、出售、質押（Pledging）、訂立期權合約、行使期權、以股票作信貸抵押、以及達成任何轉讓實益利益的合約"},{"value":"C","label":"僅限於向發行人申請認購新股"},{"value":"D","label":"不包括將股票抵押給金融機構融資"}],"answer":"B","explanation":"MBLR Appendix C3 Rule A.1 及指南 2-18 頁 3.34 節指明：處理證券涵義極廣，除買賣外，包括股份抵押（Pledging）、按揭、借貸或訂立任何股本衍生工具合約，均被視為受標準守則限制的交易行為。","reference":"MBLR Appendix C3 Rule A.1; HKSI Paper 5 Guide Topic 2 Section 3.34"},{"id":"T2-432","topic":"Topic 2","subtopic":"Model Code - Special Circumstances Exceptional Clearances","difficulty":"Level 3","question":"根據主板附錄 C3《標準守則》第 C.1 條至第 C.3 條，發行人董事在業績公佈前的禁售期（Blackout Period）內，在何種極端「特殊情況」下，經事先向主席申請並獲書面許可後，可獲准破例出售其名下股票？","options":[{"value":"A","label":"該董事預測股價在業績公布後將會下跌"},{"value":"B","label":"該董事面臨嚴重的個人突發財務困境（Pressing financial commitments），除變賣股票外別無其他合理替代方案以清償即時到期債務"},{"value":"C","label":"該董事擬購置海外度假遊艇"},{"value":"D","label":"該董事擬向親屬贈送生日賀禮"}],"answer":"B","explanation":"MBLR Appendix C3 Rules C.1–C.3 規定：僅在極其例外情況下（如面臨法庭強制命令、或迫切財務承諾且出售為唯一合理途徑之嚴重個人財政危機），經主席書面特
