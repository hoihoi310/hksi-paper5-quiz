<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HKSI Paper 5 線上練習｜多人版</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase/config.js"></script>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e4e7ec;--accent:#2457d6;--good:#067647;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif;color:var(--text)}
.wrap{max-width:920px;margin:auto;padding:22px 16px 48px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 4px 18px #1018280b}.hidden{display:none!important}
h1{font-size:26px;margin:0 0 8px}.sub{color:var(--muted);line-height:1.6}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.field{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field select,.field input{width:100%;border:0;font-size:15px;background:transparent;outline:0}
button{border:0;border-radius:10px;padding:12px 18px;font-size:15px;font-weight:600;cursor:pointer;background:var(--accent);color:white}button.secondary{background:#eef2ff;color:#2443a6}button.ghost{background:#f2f4f7;color:#344054}button:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:14px}.pill{font-size:12px;border-radius:999px;background:#eef2ff;color:#2443a6;padding:6px 10px;white-space:nowrap}.bar{height:7px;background:#eaecf0;border-radius:99px;overflow:hidden;margin:12px 0 22px}.bar>i{display:block;height:100%;background:var(--accent);width:0}
.q{font-size:20px;line-height:1.65;font-weight:650;margin:10px 0 20px}.option{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:15px;margin:10px 0;cursor:pointer}.option:hover{border-color:#98a2b3;background:#fafbff}.option input{margin-top:4px}.letter{font-weight:700;color:#475467;min-width:20px}.feedback{margin-top:18px;border-radius:12px;padding:15px;line-height:1.65}.correct{background:#ecfdf3;color:var(--good)}.wrong{background:#fef3f2;color:var(--bad)}.neutral{background:#f8fafc;color:#344054}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.small{font-size:13px;color:var(--muted)}
.score{font-size:48px;font-weight:750;margin:10px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.stat{padding:16px;border:1px solid var(--line);border-radius:12px}.stat b{font-size:24px;display:block;margin-top:5px}.review{border-top:1px solid var(--line);padding:18px 0}.review h3{margin:0 0 8px;font-size:16px}.answer{margin-top:8px;padding:10px;border-radius:9px;background:#f8fafc;line-height:1.5}.refs{font-size:12px;color:var(--muted);margin-top:9px}.name{font-size:18px;font-weight:650;margin:18px 0 4px}.record-list{margin-top:12px}.record{border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;display:flex;justify-content:space-between;gap:12px;align-items:center}.record-main{line-height:1.5}.record-score{font-size:20px;font-weight:750;white-space:nowrap}.wrong-box{margin-top:20px;padding:16px;border:1px solid #fecdca;background:#fffbfa;border-radius:12px}.wrong-count{font-size:28px;font-weight:750;color:var(--bad)}
.status{padding:10px 12px;border-radius:10px;background:#f8fafc;margin-top:12px;font-size:13px}.status.good{background:#ecfdf3;color:var(--good)}.status.bad{background:#fef3f2;color:var(--bad)}
.auth{border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:18px}.auth-row{display:flex;gap:10px;flex-wrap:wrap}.auth input{flex:1;min-width:220px;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:15px}.auth .code-input{max-width:180px;letter-spacing:4px;text-align:center}.userbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:15px}.signed-in{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.signed-in-email{font-size:13px;color:var(--muted);background:#ecfdf3;color:var(--good);padding:8px 10px;border-radius:999px}
.library{margin-top:28px;border-top:1px solid var(--line);padding-top:20px}.library-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.library-tabs button.active{background:var(--accent);color:#fff}.library-tabs button:not(.active){background:#f2f4f7;color:#344054}.library-item{border:1px solid var(--line);border-radius:12px;padding:14px;margin:9px 0}.library-item h3{font-size:15px;line-height:1.5;margin:0 0 7px}.library-item p{margin:5px 0;line-height:1.5}.library-item .item-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.mark-btn{background:#fff7e6;color:#9a6700;border:1px solid #f2c94c}.mark-btn.marked{background:#fff0c2}
@media(max-width:650px){.grid,.stats{grid-template-columns:1fr 1fr}.card{padding:18px}.q{font-size:18px}.wrap{padding:12px 10px 30px}}
</style>
</head>
<body><main class="wrap">

<section id="home" class="card">
  <div class="userbar">
    <div><h1>HKSI Paper 5 線上練習</h1><div class="sub">100 題題庫｜即開即用，支援本機練習及 Supabase 同步</div></div>
    <div class="signed-in"><span id="signedInEmail" class="signed-in-email hidden"></span><button id="logoutBtn" class="ghost hidden" onclick="logout()">登出</button></div>
  </div>

  <div id="authBox" class="auth">
    <div class="name">登入／建立學習帳戶</div>
    <div class="small">使用 Email 驗證碼登入，不需要設定密碼。登入後，完成紀錄及錯題會跨裝置同步。</div>
    <div class="auth-row" style="margin-top:10px">
      <input id="email" type="email" placeholder="your@email.com">
      <button onclick="sendMagicLink()">發送驗證碼</button>
    </div>
    <div id="otpRow" class="auth-row hidden" style="margin-top:10px">
      <input id="otp" class="code-input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 位數驗證碼">
      <button class="secondary" onclick="verifyEmailCode()">確認驗證碼</button>
    </div>
    <div id="authStatus" class="status hidden"></div>
  </div>

  <div id="profileBox" class="auth hidden">
    <div class="name">學習者資料</div>
    <div class="auth-row">
      <input id="displayName" type="text" maxlength="50" placeholder="例如：Danny">
      <button class="secondary" onclick="saveProfile()">保存名稱</button>
    </div>
    <div id="profileStatus" class="status hidden"></div>
  </div>

  <div class="name">練習設定</div>
  <div class="grid">
    <div class="field"><label>Topic</label><select id="topic"></select></div>
    <div class="field"><label>Difficulty</label><select id="difficulty"></select></div>
    <div class="field"><label>題數</label><select id="count"><option>5</option><option selected>10</option><option>20</option><option>30</option><option>50</option></select></div>
  </div>
  <label style="display:flex;gap:8px;align-items:center;margin:10px 0"><input id="shuffle" type="checkbox" checked> 隨機抽題（選項固定按 A、B、C、D）</label>
  <div class="actions"><button id="startBtn" onclick="startQuiz()">開始練習</button></div>
  <div class="small" style="margin-top:15px">題庫共 <span id="total"></span> 題。題目內容以目前 50 題 JSON 題庫為準。</div>

  <div class="wrong-box">
    <div><b>我的錯題</b></div>
    <div><span class="wrong-count" id="wrongBankCount">0</span> <span class="small">題待重做</span></div>
    <div class="actions"><button id="redoWrongBtn" class="secondary" onclick="startWrongQuiz()">錯題重做</button></div>
  </div>

  <div class="library">
    <div class="name">題目資料庫</div>
    <div class="small">集中查看已做過、目前錯題及已標記的題目。</div>
    <div class="library-tabs">
      <button class="active" data-library-filter="done" onclick="setLibraryFilter('done')">已做過</button>
      <button data-library-filter="wrong" onclick="setLibraryFilter('wrong')">錯題</button>
      <button data-library-filter="marked" onclick="setLibraryFilter('marked')">已標記</button>
    </div>
    <div id="libraryList"></div>
  </div>

  <div style="margin-top:28px">
    <div class="name">完成紀錄</div>
    <div id="recordModeText" class="small">登入 Supabase 後，紀錄會雲端同步；未登入時只保存於本機。</div>
    <div id="records" class="record-list"></div>
    <div class="actions"><button class="ghost" onclick="clearLocalRecords()">清除本機紀錄</button></div>
  </div>
</section>

<section id="quiz" class="card hidden">
  <div class="top"><div><b id="counter"></b><div class="small" id="topicline"></div></div><span class="pill" id="diff"></span></div>
  <div class="bar"><i id="progress"></i></div><div id="question"></div>
  <div class="actions"><button class="secondary" id="submit" onclick="submitAnswer()">提交答案</button><button class="ghost" id="skipBtn" onclick="skipQuestion()">略過</button><button class="ghost" id="redrawBtn" onclick="redrawQuestion()">重新放回再抽</button><button class="ghost hidden" id="next" onclick="nextQuestion()">下一題</button><button class="mark-btn" id="markBtn" onclick="toggleCurrentMark()">☆ 標記題目</button></div>
  <div id="fb"></div>
</section>

<section id="result" class="card hidden">
  <h1>練習完成</h1><div class="score" id="score"></div>
  <div class="stats"><div class="stat">正確<b id="correctN"></b></div><div class="stat">錯誤<b id="wrongN"></b></div><div class="stat">略過<b id="skippedN"></b></div><div class="stat">正確率<b id="pct"></b></div></div>
  <div id="syncStatus" class="status"></div>
  <div class="actions"><button onclick="restartSame()">再做一次</button><button class="secondary" id="redoResultWrong" onclick="redoWrongFromResult()">錯題重做</button><button class="ghost" onclick="home()">返回設定</button></div>
  <h2 style="margin-top:28px">本次錯題及解析</h2><div id="reviews"></div>
</section>

</main>
<script>
const SUPABASE_URL = window.HKSI_SUPABASE_CONFIG?.url || "YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY = window.HKSI_SUPABASE_CONFIG?.anonKey || "YOUR_SUPABASE_ANON_KEY";
const SUPABASE_ENABLED = SUPABASE_URL.startsWith("https://") && !SUPABASE_URL.includes("YOUR_") && !SUPABASE_ANON_KEY.includes("YOUR_");
const sb = SUPABASE_ENABLED ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const BANK=[{"id":"T1-001","topic":"Topic 1","subtopic":"Regulatory Structure - Responsible Officers","difficulty":"Level 2","question":"甲資產管理有限公司計劃向證監會申請第 6 類受規管活動（就機構融資提供意見）牌照。該公司目前有三名董事，其中一名是常務董事（Executive Director），全職駐於香港並積極監督機構融資業務；另外兩名為非執行董事。公司擬僅委任該名常務董事為唯一的負責人員（RO）。根據《證券及期貨條例》（SFO），下列哪項陳述最正確？","options":[{"value":"A","label":"甲公司完全合規，因為只要有一名駐港的常務董事擔任 RO 即可滿足監管要求。"},{"value":"B","label":"甲公司不合規，因為每類受規管活動必須獲證監會核准至少兩名負責人員，且其中至少一名須為常務董事。"},{"value":"C","label":"甲公司合規，但該 RO 必須同時取得香港交易所（SEHK）的獨立認可資格。"},{"value":"D","label":"甲公司不合規，因為為確保獨立性，負責人員必須全部由獨立非執行董事擔任。"}],"answer":"B","explanation":"根據 SFO s. 116 及學習指南 1-18 頁 3.6 節，持牌法團就其獲發牌的每項受規管活動，必須具備至少兩名獲證監會核准為負責人員（RO）的個人，且其中至少一名必須為常務董事（Executive Director）。此外，在任何時候都必須至少有一名 RO 能親自監督該業務。","reference":"SFO s.116; HKSI Paper 5 Guide Topic 1 Section 3.6"},{"id":"T1-002","topic":"Topic 1","subtopic":"Exclusions from Regulated Activities","difficulty":"Level 2","question":"根據 SFO 附表 5，下列哪一項活動不屬於第 6 類受規管活動（就機構融資提供意見）的法定豁免範圍？","options":[{"value":"A","label":"某持牌法團僅向其全資擁有的附屬公司提供有關《收購守則》的合規意見。"},{"value":"B","label":"執業事務律師在處理其常規法律業務過程中，完全附帶地向客戶提供關於《上市規則》合規的意見。"},{"value":"C","label":"獨立商業顧問公司為一間非集團旗下的上市公司就收購資產的重大股本重組架構提供專業意見並收取顧問費。"},{"value":"D","label":"某獲認可財務機構（AFI）註冊進行第 1 類受規管活動，其職員完全附帶於證券交易業務向客戶提供機構融資意見。"}],"answer":"C","explanation":"根據 SFO Schedule 5 及指南 1-17 頁 3.3 節，法定豁免包括：全資集團內部提供意見、持牌/註冊第 1 類中介人完全附帶於交易的意見、專業人士（律師、會計師、信託公司）完全附帶於執業的意見，以及透過公開報刊或廣播發布。獨立商業顧問向第三方上市公司提供重組顧問服務不屬於豁免範圍，必須持有第 6 類牌照。","reference":"SFO Schedule 5; HKSI Paper 5 Guide Topic 1 Section 3.3"},{"id":"T1-003","topic":"Topic 1","subtopic":"CFA Code - Compliance Function","difficulty":"Level 2","question":"根據《機構融資顧問操守準則》（CFA Code），一家規模較小、人手精簡的持牌機構融資顧問，其合規職能（Compliance Function）應如何安排才合規？","options":[{"value":"A","label":"必須強制聘請獨立於高級管理層的專職外部合規審計師擔任合規主管。"},{"value":"B","label":"準則原則上要求設立由獨立合規主任領導的合規職能；但如有必要，該合規職能可由高級管理人員（Senior Management）兼任。"},{"value":"C","label":"合規職能必須隨時由至少兩名管理人員共同執行，否則即構成重大違規。"},{"value":"D","label":"只要事先書面通知香港聯交所，該公司即可免除設立合規職能。"}],"answer":"B","explanation":"依據 CFA Code 第 2 段及指南 1-31 頁 4.6 節，機構融資顧問須維持有效合規職能，由獨立於業務部門並直接向高級管理層匯報的合規主任主管；但在資源有限且必要的情況下，合規職能可由高級管理人員承擔。","reference":"CFA Code para 2; HKSI Paper 5 Guide Topic 1 Section 4.6"},{"id":"T1-004","topic":"Topic 1","subtopic":"CFA Code - Managers-in-Charge (MIC)","difficulty":"Level 1","question":"根據香港證監會實施的「核心職能主管」（Managers-in-Charge, MIC）制度，下列哪一項不屬於法定的八項核心職能之一？","options":[{"value":"A","label":"整體管理監督（Overall management oversight）"},{"value":"B","label":"業務推廣與客戶公關（Marketing and public relations）"},{"value":"C","label":"打擊洗錢及恐怖分子資金籌集（AML/CFT）"},{"value":"D","label":"資訊科技（Information technology）"}],"answer":"B","explanation":"指南 1-31 至 1-32 頁 4.7 節列出 8 項核心職能：整體管理監督、關鍵業務線、營運控制及覆核、風險管理、財務及會計、資訊科技、合規、打擊洗錢及恐怖分子資金籌集。市場推廣及公關並非法定核心職能之一。","reference":"HKSI Paper 5 Guide Topic 1 Section 4.7"},{"id":"T1-005","topic":"Topic 1","subtopic":"Market Misconduct - Insider Dealing Defences","difficulty":"Level 3","question":"某持牌金融機構的自營交易部在二級市場買入乙上市公司的股份。當日，該機構旗下的機構融資團隊正秘密擔任乙公司重大溢價收購案的財務顧問，並持有未公開的內幕消息。證監會對此自營交易啟動市場失當行為調查。該機構若要成功援引「有效中國牆」（Chinese Wall）作為免責抗辯，必須證明下列哪一項條件？","options":[{"value":"A","label":"該筆自營交易最終錄得投資虧損而非盈利。"},{"value":"B","label":"實質參與買賣決策及執行交易的人士，在交易發生時並不知悉且未持有該內幕消息，且機構已設立並有效執行隔離該消息的物理及功能壁壘。"},{"value":"C","label":"乙公司董事會事先以書面形式同意該金融機構進行自營買賣。"},{"value":"D","label":"該機構的持牌負責人員在交易執行後 24 小時內向聯交所提交了披露報告。"}],"answer":"B","explanation":"根據 SFO s. 270/291 及指南 1-22 頁 3.23(a) 節，法人團體援引中國牆抗辯時，必須證明實際決定及進行交易的僱員或董事在關鍵時間並無持有該內幕消息，且公司有行之有效的實質與功能防護措施（如物理隔離、不同團隊）防止機密外洩。","reference":"SFO ss. 270, 291; HKSI Paper 5 Guide Topic 1 Section 3.23(a)"},{"id":"T1-006","topic":"Topic 1","subtopic":"Market Misconduct - Misleading Information","difficulty":"Level 2","question":"根據 SFO 第 277 條（民事市場失當行為）及第 298 條（刑事罪行），關於散布虛假或具誤導性資料以誘使交易的責任，下列敘述何者最正確？","options":[{"value":"A","label":"刑事法律責任（第 298 條）的構成要件中，涵蓋了單純「疏忽」（Negligence）的情形。"},{"value":"B","label":"該條文僅適用於上市公司本身，協助編制公開文件的機構融資顧問無須承擔法律責任。"},{"value":"C","label":"在民事法庭或市場失當行為審裁處（MMT）的層面，只要披露實質虛假或誤導資料的人士屬於知情、罔顧或「疏忽」，即可構成市場失當行為。"},{"value":"D","label":"只要相關資料最終未導致證券價格實質波動，即便資料重大失實亦不構成違法。"}],"answer":"C","explanation":"根據 SFO ss. 277 & 298 以及指南 1-21 頁 3.19 及 1-22 至 1-23 頁 3.24 節，第 XIII 部（民事/MMT）涵蓋了「明知、罔顧或疏忽」披露可能誘使交易的重大虛假或誤導性資料；但第 XIV 部（刑事）則排除單純「疏忽」，必須具備明知或罔顧意圖。機構融資顧問若參與編制失實文件同樣可被追究責任。","reference":"SFO ss. 277, 298; HKSI Paper 5 Guide Topic 1 Section 3.19, 3.24"},{"id":"T1-007","topic":"Topic 1","subtopic":"Disclosure of Interests - Part XV SFO","difficulty":"Level 2","question":"某非董事投資者持有丙香港上市公司 4.9% 的有投票權股份。5 月 5 日（週一），該投資者在市場增持股份至 5.3%；隨後在 5 月 15 日（週四），其將持股量進一步增加至 5.8%。根據 SFO 第 XV 部，該投資者：","options":[{"value":"A","label":"無須向聯交所或公司作任何申報，因為總持股量未達到 10%。"},{"value":"B","label":"須在 5 月 5 日起計的 3 個營業日內就跨越 5% 門檻作出申報；但 5 月 15 日由 5.3% 增至 5.8% 則無須申報。"},{"value":"C","label":"兩次增持均必須在相關交易日後的 10 個營業日內分別完成申報。"},{"value":"D","label":"必須在 5 月 15 日當天即時暫停在該公司的股份交易。"}],"answer":"B","explanation":"根據 SFO Part XV 及指南 1-23 至 1-24 頁 3.30–3.33 節，大股東持股申報門檻為 5%，須於 3 個營業日內通知上市公司及聯交所。跨越 5% 之後，只有持股百分比跨越「整數百分點」（Whole percentage point，例如突破 6%）或降至 5% 以下才須再申報，從 5.3% 增至 5.8% 仍在 5% 水平內，無須申報。","reference":"SFO Part XV; HKSI Paper 5 Guide Topic 1 Section 3.30-3.33"},{"id":"T1-008","topic":"Topic 1","subtopic":"Inside Information Disclosure - Safe Harbours","difficulty":"Level 3","question":"上市公司丁正與潛在買方進行極其機密的收購談判，該交易若達成將構成重大收購事項。下列哪種情況下，丁公司不能依據 SFO 第 307D 條的法定安全港（Safe Harbour）條款免除即時公開披露內幕消息的義務？","options":[{"value":"A","label":"談判處於未完成階段，丁公司採取了合理的保密措施，且談判雙方均簽署了嚴格的保密協議。"},{"value":"B","label":"市場出現極為具體且詳盡的傳媒報道，準確披露了談判各方主體、作價及核心條款，且丁公司股份出現異常價格及成交量波動。"},{"value":"C","label":"該未完成談判屬於商業機密，且目前並無任何跡象顯示機密已經外洩。"},{"value":"D","label":"丁公司的董事在知悉該談判後，即時成立內部委員會審議保密控制程序。"}],"answer":"B","explanation":"依據 SFO s. 307D 及指南 1-25 頁 3.36 與 1-28 頁 3.51 節，未完成談判或商業秘密可享安全港豁免，但其絕對前提為「機密性得以實質維持」。若市場已出現廣泛、具體且準確的傳媒報道或傳聞，即證明機密性已經喪失，上市公司必須立即終止依賴安全港並向公眾發布正式公告。","reference":"SFO s.307D; HKSI Paper 5 Guide Topic 1 Section 3.36, 3.51"},{"id":"T1-009","topic":"Topic 1","subtopic":"Corporate Governance Code - Comply or Explain","difficulty":"Level 2","question":"根據聯交所《企業管治守則》（Corporate Governance Code, MBLR Appendix C1），下列哪項屬於守則條文（Code Provisions）所明確要求的董事會常規，發行人若偏離該常規必須於報告中詳細「解釋」（Comply or Explain）？","options":[{"value":"A","label":"高級管理層成員的個人薪酬細節必須按名披露於年報內。"},{"value":"B","label":"董事會須每兩年至少進行一次正式的董事會績效評估。"},{"value":"C","label":"執行董事薪酬的大部分必須強制與公司整體業績及個人績效掛鉤。"},{"value":"D","label":"董事會主席與行政總裁的職色必須由同一名具備豐富行業經驗的人士兼任以提高決策效率。"}],"answer":"B","explanation":"根據指南 1-13 頁 2.8(b) 節及 MBLR Appendix C1，董事會至少每兩年評估一次績效屬於「守則條文」（不遵守須解釋）；而 A 與 C 屬於「建議最佳常規」（Recommended Best Practices，屬自願性質，見 2.9 節）；D 則違反常規，守則條文規定主席與行政總裁的角色應予分開。","reference":"MBLR Appendix C1; HKSI Paper 5 Guide Topic 1 Section 2.8(b), 2.9"},{"id":"T1-010","topic":"Topic 1","subtopic":"Companies Ordinance - Capital Reduction","difficulty":"Level 3","question":"一間在香港註冊成立的上市公司擬進行股本減少（Reduction of Share Capital）。若該公司選擇採用《公司條例》（Cap. 622）下的「無須經法院認可的程序」（Court-free procedure），必須符合下列哪項法定要件？","options":[{"value":"A","label":"必須由全體董事簽署償付能力陳述書（Solvency Statement），且簽署日期不得早於股東特別決議案通過當日前 15 天。"},{"value":"B","label":"只要取得獨立非執行董事過半數書面同意，即無須通過股東特別決議案。"},{"value":"C","label":"必須將全體債權人名單提呈香港高等法院原訟法庭尋求最終蓋印確認。"},{"value":"D","label":"該減資款項必須全數用於向控股股東回購未上市的優先股。"}],"answer":"A","explanation":"根據《公司條例》ss. 209–232 及指南 1-27 頁 5.14–5.15 節，無須經法院認可的減資程序要求通過特別決議案，且全體董事必須簽署符合法定格式的償付能力陳述書，該陳述書的日期不得早於特別決議案通過之日前 15 天。債權人或未贊成的成員在此程序下有權向法庭申請撤銷決議案以維護權益。","reference":"Companies Ordinance ss. 209-232; HKSI Paper 5 Guide Topic 1 Section 5.14-5.15"},{"id":"T1-011","topic":"Topic 1","subtopic":"Regulatory Objectives of the SFC","difficulty":"Level 1","question":"根據《證券及期貨條例》（SFO）第 4 條，下列哪一項不是證監會（SFC）的法定監管目標？","options":[{"value":"A","label":"維持和促進證券期貨業的公平性、效率、競爭力、透明度及秩序良好。"},{"value":"B","label":"為投資大眾提供保障並盡量減少在業界內的犯罪及失當行為。"},{"value":"C","label":"直接為香港上市公司的股價提供最低保障機制以消除所有二級市場投資風險。"},{"value":"D","label":"減少業界的系統性風險，並協助財政司司長維持香港的金融穩定。"}],"answer":"C","explanation":"根據 SFO s. 4 及指南 1-4 頁 1.4 節，證監會的法定目標包括維持市場公平與效率、促進公眾了解、保障投資大眾、減少犯罪與失當行為、減少系統性風險及協助維持金融穩定。證監會絕不為證券價格提供兜底或消除商業投資風險。","reference":"SFO s.4; HKSI Paper 5 Guide Topic 1 Section 1.4"},{"id":"T1-012","topic":"Topic 1","subtopic":"SFC Corporate Finance Division - Functions","difficulty":"Level 2","question":"證監會的「企業融資部」（Corporate Finance Division）主要負責多項與資本市場密切相關的職能。下列哪一項屬於該部門的法定職責？","options":[{"value":"A","label":"負責全天候實時監控股票與衍生工具市場的異常交易活動以調查內幕交易。"},{"value":"B","label":"與香港聯交所（SEHK）共同審核新上市申請，並依據《證券及期貨（股票市場上市）規則》（SMLR）進行雙重存檔監管。"},{"value":"C","label":"處理所有中介機構個人代表及負責人員的日常發牌申請審批。"},{"value":"D","label":"監督並管理投資者賠償基金的日常運作及款項撥付。"}],"answer":"B","explanation":"依據指南 1-5 頁 1.10 節，企業融資部負責與聯交所共同審閱上市申請、執行《收購守則》、監察上市公司公告、審批非上市股份/債權證的招股章程，並依據 SMLR 於嚴重個案早期介入。A 選項屬法規執行部職責；C 選項屬中介機構部（發牌科）職責；D 選項屬市場監察部職責。","reference":"HKSI Paper 5 Guide Topic 1 Section 1.10, 1.12, 1.14, 1.15"},{"id":"T1-013","topic":"Topic 1","subtopic":"Market Misconduct Tribunal (MMT) Sanctions","difficulty":"Level 2","question":"市場失當行為審裁處（MMT）是由高等法院法官及兩名成員組成的法定審裁處。根據 SFO 第 XIII 部，MMT 在裁定某人從事市場失當行為後，無權作出下列哪項命令？","options":[{"value":"A","label":"判處該違規者即時入獄監禁 5 年。"},{"value":"B","label":"發出取消資格令，禁止其擔任上市公司董事或參與管理，最長為期 5 年。"},{"value":"C","label":"發出「冷淡對待令」（Cold shoulder order），禁止其在香港市場進行投資或交易，最長為期 5 年。"},{"value":"D","label":"命令其向政府交出因市場失當行為獲取的利潤或避免的損失，並附加複利計算的利息。"}],"answer":"A","explanation":"根據 SFO 第 XIII 部及指南 1-20 至 1-21 頁 3.17–3.18 節，MMT 屬於民事審裁機制，其權力包括取消董事資格（最長5年）、冷淡對待令（最長5年）、交出非法所得加複利、支付政府及證監會調查費用等。監禁刑罰屬於 SFO 第 XIV 部刑事法庭（法院）的判決權力，MMT 無權判處監禁。","reference":"SFO Part XIII, ss. 257, 281; HKSI Paper 5 Guide Topic 1 Section 3.17-3.18"},{"id":"T1-014","topic":"Topic 1","subtopic":"Securities and Futures Appeals Tribunal (SFAT)","difficulty":"Level 1","question":"證券及期貨事務上訴審裁處（SFAT）的主要法定職能是：","options":[{"value":"A","label":"審理所有由律政司提起的市場失當行為刑事檢控案件。"},{"value":"B","label":"作為法定上訴機構，覆核由證監會（SFC）或香港金融管理局（HKMA）所作出的特定監管決定（如發牌及紀律處分決定）。"},{"value":"C","label":"審理所有關於聯交所上市委員會拒絕上市申請的第一審上訴案。"},{"value":"D","label":"直接代行聯交所上市覆核委員會的全部日常職能。"}],"answer":"B","explanation":"指南 1-7 頁 1.20 節指出，SFAT 是根據 SFO 設立的法定上訴機構，專門聆訊針對證監會或金管局作出的「特定決定」（Specified decisions，如牌照審批、條件施加、紀律處分罰款等）之上訴（見 SFO 附表 8 第 2 及 3 部）。","reference":"SFO Schedule 8; HKSI Paper 5 Guide Topic 1 Section 1.20"},{"id":"T1-015","topic":"Topic 1","subtopic":"Dual Filing Regime (SMLR)","difficulty":"Level 3","question":"在香港的「雙重存檔制度」（Dual Filing Regime）下，根據《證券及期貨（股票市場上市）規則》（SMLR），下列敘述何者最正確？","options":[{"value":"A","label":"申請人必須分別獨立將兩套內容不同的文件親身呈交至證監會及聯交所，兩者互不相干。"},{"value":"B","label":"上市申請人向聯交所提交上市申請時，授權聯交所將相關材料副本送交證監會存檔，證監會可在法定 10 個營業日內對披露不足提出反對。"},{"value":"C","label":"雙重存檔僅適用於 GEM 上市申請，主板上市申請完全不受 SMLR 規管。"},{"value":"D","label":"若證監會依據 SMLR 行使否決權拒絕公司上市，申請人無權向任何機構提出上訴。"}],"answer":"B","explanation":"依據指南 1-10 頁 1.35 節、2-34 頁 7.23–7.29 節，SMLR 建立了雙重存檔制度。申請人授權聯交所將文件轉交證監會，證監會可在 10 個營業日內就披露不足提出意見或反對。若證監會依據 SMLR s. 6(2) 反對上市，申請人有權向證券及期貨事務上訴審裁處（SFAT）提出上訴。","reference":"SMLR ss. 3, 5, 6; HKSI Paper 5 Guide Topic 1 Section 1.35; Topic 2 Section 7.23-7.29"},{"id":"T1-016","topic":"Topic 1","subtopic":"Legal Status of Listing Rules","difficulty":"Level 2","question":"關於香港聯交所《上市規則》（Listing Rules）的法律地位，下列哪一項說明最準確？","options":[{"value":"A","label":"《上市規則》是由香港立法會制定的成文法規，具有法例同等強制執行力，聯交所可直接向法庭起訴違規董事並判處罰款。"},{"value":"B","label":"《上市規則》本質上屬於合約性質（以合約形式約束發行人及其關聯人士），本身並非法例，但透過 SMLR 獲得了一定的法定支持（Statutory Backing）。"},{"value":"C","label":"《上市規則》是由香港金融管理局獨立發布的行政命令，由銀行業全權監督。"},{"value":"D","label":"《上市規則》不具備任何約束力，僅為上市發行人自願參考的指引文件。"}],"answer":"B","explanation":"指南 1-10 頁 1.35 節明確說明，《上市規則》不是法例，聯交所不能透過法院執行規則，其基礎建立在發行人與聯交所簽訂的合約基礎上。然而，藉由 SFO 下的附屬法例 SMLR（雙重存檔制度），《上市規則》獲得了法定支持，提供虛假資料可引發 SFO 的法定法律責任。","reference":"HKSI Paper 5 Guide Topic 1 Section 1.35"},{"id":"T1-017","topic":"Topic 1","subtopic":"False Statements to Regulators (s. 384 SFO)","difficulty":"Level 2","question":"根據 SFO 第 384 條，機構融資顧問在執行職責並向證監會或聯交所提供資料時，若觸犯提供虛假或具誤導性資料的罪行，下列哪項構成法律責任？","options":[{"value":"A","label":"該人員必須是出於惡意敲詐意圖，否則任何情況下均不承擔法律責任。"},{"value":"B","label":"只要該人員在明知情況下，或「罔顧」（Recklessly）資料在要項上是否屬虛假或具誤導性的情況下提供資料，即屬違法。"},{"value":"C","label":"只有當虛假陳述直接導致聯交所暫停交易超過 3 天時，才構成第 384 條罪行。"},{"value":"D","label":"該罪行僅追究公司秘書，任何財務顧問、保薦人或董事皆免責。"}],"answer":"B","explanation":"依據 SFO s. 384 及指南 1-20 頁 3.14 節，任何人在要項上明知（Knowingly）或罔顧（Recklessly）而向證監會或認可交易所提供虛假或具誤導性的資料，即構成嚴重的法定刑事罪行。","reference":"SFO s.384; HKSI Paper 5 Guide Topic 1 Section 3.14"},{"id":"T1-018","topic":"Topic 1","subtopic":"Officer Liability (s. 390 SFO)","difficulty":"Level 2","question":"根據 SFO 第 390 條，當某持牌法團被證實觸犯了 SFO 下的任何法定罪行時，其公司「高級人員」（Officer）在何種情況下亦須負上個人刑事責任？","options":[{"value":"A","label":"只有持有該公司 50% 以上股權的高級人員才須負責。"},{"value":"B","label":"若該罪行經證實是在該高級人員的協助、教唆、慫使、促致或誘使下發生，或是在其同意、縱容或罔顧下發生，該高級人員同樣有罪。"},{"value":"C","label":"高級人員一律受公司有限責任保護，刑事責任絕對不能刺破公司面紗追究個人。"},{"value":"D","label":"只要該高級人員事後向證監會自首，其個人刑事責任即可依法自動轉移予合規主任。"}],"answer":"B","explanation":"指南 1-21 頁 3.21(b) 節引述 SFO s. 390 規定：凡法團觸犯 SFO 的罪行，經證明是在其高級人員（董事、經理、秘書等）的協助、教唆、慫使、促致、誘使下，或經其同意、縱容，或可歸咎於其罔顧，該高級人員與法團均屬有罪。","reference":"SFO s.390; HKSI Paper 5 Guide Topic 1 Section 3.21(b)"},{"id":"T1-019","topic":"Topic 1","subtopic":"Takeovers and Mergers Panel - Functions","difficulty":"Level 2","question":"收購及合併委員會（Takeovers and Mergers Panel）是證監會下設的獨立諮詢委員會。下列哪一項屬於其法定/守則職能？","options":[{"value":"A","label":"直接批准聯交所新上市公司股份代號的分配。"},{"value":"B","label":"第一審聆訊涉嫌違反《收購守則》的紀律事宜，以及應不服執行人員裁決之當事人之要求覆核該項裁決。"},{"value":"C","label":"行使刑事審判權，對內幕交易違規者判處監禁。"},{"value":"D","label":"負責每日公開審查所有上市發行人的日常財務公告。"}],"answer":"B","explanation":"指南 1-7 頁 1.17 節明確規定，收購及合併委員會的職能為：(1) 第一審聆訊紀律事宜；(2) 應對執行人員（Executive）裁決不滿之當事人的要求，覆核該裁決；(3) 聆訊執行人員轉介的特別重要爭議事項。","reference":"HKSI Paper 5 Guide Topic 1 Section 1.17"},{"id":"T1-020","topic":"Topic 1","subtopic":"Takeovers Appeal Committee (TAC)","difficulty":"Level 2","question":"當收購及合併委員會（Takeovers and Mergers Panel）在紀律聆訊中對違反《收購守則》的人士施加了紀律制裁（例如公開譴責或冷淡對待令），受影響人士向收購上訴委員會（TAC）提出上訴時，TAC 的審理權限是：","options":[{"value":"A","label":"重新進行全面的事實認定審判，推翻原審對是否違規的事實認定。"},{"value":"B","label":"專門且僅限於判定收購委員會所施加的制裁措施是否不公平或過度嚴苛（Unfair or Excessive）。"},{"value":"C","label":"強制將案件轉介至廉政公署（ICAC）提起刑事訴訟。"},{"value":"D","label":"直接命令香港聯交所將該上市公司永久撤銷上市資格。"}],"answer":"B","explanation":"根據指南 1-7 頁 1.18 節，收購上訴委員會（Takeovers Appeal Committee, TAC）聆訊針對委員會紀律裁決之上訴，其「唯一目的」（Sole purpose）是裁定由委員會所施加的制裁是否不公平或過度嚴苛。","reference":"HKSI Paper 5 Guide Topic 1 Section 1.18"},{"id":"T1-021","topic":"Topic 1","subtopic":"Stock Market Manipulation (ss. 278, 299 SFO)","difficulty":"Level 3","question":"根據 SFO 第 278 條（民事）及第 299 條（刑事），下列哪項要素是構成「操縱證券市場」（Stock Market Manipulation）的關鍵法定特徵？","options":[{"value":"A","label":"必須由至少三名以上的董事共同在場簽署書面協議方可構成。"},{"value":"B","label":"直接或間接地進行兩次或以上的證券交易，藉此提高、降低、維持或穩定某股份的價格，並意圖誘使他人認購或買賣該等證券。"},{"value":"C","label":"涉及的金額必須超過港幣 5,000 萬元以上。"},{"value":"D","label":"只有在非交易時段（場外交易）執行的買賣才會構成該項市場失當行為。"}],"answer":"B","explanation":"指南 1-23 頁 3.27 節引述 SFO ss. 278, 299，操縱證券市場是指任何人單獨或聯同他人進行兩次或以上的證券交易，以提高、壓低、維持或穩定股份在認可市場的交易價格，且意圖藉此誘使他人認購、買賣該股份或其關聯法團的證券。","reference":"SFO ss. 278, 299; HKSI Paper 5 Guide Topic 1 Section 3.27"},{"id":"T1-022","topic":"Topic 1","subtopic":"Price Stabilization Safe Harbour","difficulty":"Level 2","question":"在新股公開發售（IPO）的價格穩定機制中，穩定價格操作人進行護盤買入往往涉及干預市場價格。為免觸犯 SFO 下的操縱市場失當行為，必須依據下列哪一項附屬法例作為法定安全港？","options":[{"value":"A","label":"《證券及期貨（客戶款項）規則》"},{"value":"B","label":"《證券及期貨（穩定價格）規則》（PS Rules）"},{"value":"C","label":"《公司（清盤及雜項條文）條例》"},{"value":"D","label":"《受規管活動發牌條件及能力指引》"}],"answer":"B","explanation":"指南 1-23 頁 3.28 節指出，IPO 價格穩定行動通常可能落入操縱市場定義，但證監會依據 SFO 權力訂立了《證券及期貨（穩定價格）規則》（PS Rules），為嚴格遵守特定程序與限制的穩定價格行為提供合法豁免安全港。","reference":"Securities and Futures (Price Stabilizing) Rules; HKSI Paper 5 Guide Topic 1 Section 3.28"},{"id":"T1-023","topic":"Topic 1","subtopic":"ESG Reporting Code - Four Reporting Principles","difficulty":"Level 2","question":"根據聯交所《環境、社會及管治報告指引》（ESG Code, MBLR Appendix C2），發行人在編制其 ESG 報告時，必須嚴格遵守並在報告中具體說明如何應用的四大編報原則是：","options":[{"value":"A","label":"真實性（Authenticity）、保密性（Confidentiality）、盈利性（Profitability）、及時性（Timeliness）"},{"value":"B","label":"重要性（Materiality）、量化（Quantitative）、平衡（Balance）、一致性（Consistency）"},{"value":"C","label":"獨立性（Independence）、合規性（Compliance）、可預測性（Predictability）、審計性（Auditability）"},{"value":"D","label":"全面性（Comprehensiveness）、排他性（Exclusivity）、前瞻性（Forward-looking）、自願性（Voluntary）"}],"answer":"B","explanation":"根據指南 1-15 至 1-16 頁 2.15 節，ESG Code 明確規定發行人在編制 ESG 報告時必須遵循四大編報原則：重要性（Materiality）、量化（Quantitative）、平衡（Balance）及一致性（Consistency），並須在報告中解釋如何應用該四項原則。","reference":"MBLR Appendix C2; HKSI Paper 5 Guide Topic 1 Section 2.15"},{"id":"T1-024","topic":"Topic 1","subtopic":"ESG Reporting - Publication Timeline","difficulty":"Level 2","question":"根據現行《上市規則》對環境、社會及管治（ESG）報告的刊發規定，上市發行人刊發其獨立 ESG 報告的法定時限要求為何？","options":[{"value":"A","label":"必須在財政年度結束後 6 個月內單獨刊發，不得與年報同時公布。"},{"value":"B","label":"ESG 報告涵蓋的期間必須與年報相同，若未載入年報內，則必須與年報「同步刊發」（Simultaneously with the annual report），並以電子方式送交股東。"},{"value":"C","label":"只要在發行人的股東週年大會召開前 3 個營業日發布即可。"},{"value":"D","label":"ESG 報告僅需由董事會內部歸檔，除非聯交所書面索取，否則完全毋須公開刊發。"}],"answer":"B","explanation":"指南 1-15 頁 2.13 節指出，發行人的 ESG 報告涵蓋期間須與年報一致，可包含於年報中或獨立刊發。若選擇獨立刊發，必須與年報「同時刊發」（Simultaneously），並在發行人及聯交所網站發布，且須透過電子方式提供予股東。","reference":"HKSI Paper 5 Guide Topic 1 Section 2.13"},{"id":"T1-025","topic":"Topic 1","subtopic":"CFA Code - Standard of Work & Verification","difficulty":"Level 3","question":"根據《機構融資顧問操守準則》（CFA Code），機構融資顧問在協助客戶編制發布予公眾的公開文件（如通函或招股章程）時，負有下列哪項具體責任？","options":[{"value":"A","label":"顧問可完全免除核實義務，因為文件內容的法律責任完全由印刷商承擔。"},{"value":"B","label":"顧問應建議客戶採取一切合理步驟，並取得客戶的書面確認，確保由客戶提供的資料和陳述均為真實、準確、完整且不具誤導性。"},{"value":"C","label":"若專家報告存在重大疑點，顧問無須進行任何背景查核即可直接採用。"},{"value":"D","label":"顧問必須與客戶簽訂承諾書，承擔該文件日後出現的所有民事賠償責任。"}],"answer":"B","explanation":"指南 1-33 頁 4.20 節指出，機構融資顧問應建議客戶採取一切合理步驟以確保納入公開文件的資料真實、準確、完整且不具誤導性，並從客戶處取得確認。此外，根據 4.18 節，依賴專家工作時亦應進行合理查核以評估其經驗與專長。","reference":"CFA Code para 5; HKSI Paper 5 Guide Topic 1 Section 4.18, 4.20"},{"id":"T1-026","topic":"Topic 1","subtopic":"CFA Code - Personal Account Dealing","difficulty":"Level 2","question":"根據 CFA Code 第 8 段，關於機構融資顧問內部「相關人士」（Relevant Persons）的個人賬戶證券交易監控，下列哪項規定最正確？","options":[{"value":"A","label":"機構融資顧問的持牌代表嚴禁在任何情況下以個人名義投資任何香港上市公司股票。"},{"value":"B","label":"公司必須具備書面政策明確規範何時允許或禁止自營買賣，且相關人士的所有個人及關聯賬戶交易必須由指定合規主任有效監控。"},{"value":"C","label":"指定合規主任若本身持有該上市公司的重大利益，仍可負責審批該交易以提升效率。"},{"value":"D","label":"個人賬戶交易只需每三年向聯交所上市委員會統一彙報一次備查。"}],"answer":"B","explanation":"依據指南 1-34 至 1-35 頁 4.26–4.27 節，公司必須制定書面政策規範個人買賣，包括申報關聯賬戶（本人及未成年子女擁有實益權益）、監控買賣條件；由指定合規主任主動監察，且合規主任對所監控的交易或賬戶不得擁有實益權益。","reference":"CFA Code para 8; HKSI Paper 5 Guide Topic 1 Section 4.26-4.27"},{"id":"T1-027","topic":"Topic 1","subtopic":"CFA Code - Watchlist and Restricted List","difficulty":"Level 1","question":"為有效監控個人賬戶買賣及防止內幕消息外洩或利益衝突，機構融資顧問依據 CFA Code 必須維持並執行何種內部控制系統？","options":[{"value":"A","label":"客戶信用額度超額預警清單"},{"value":"B","label":"監察名單（Watchlist）及受限制名單（Restricted List）制度"},{"value":"C","label":"證券保證金追收名冊"},{"value":"D","label":"印花稅徵收免除清冊"}],"answer":"B","explanation":"指南 1-35 頁 4.28 節明確指出，機構融資顧問必須維持健全的監察名單（Watchlist）及受限制名單（Restricted List）系統，以妥善監控相關人士的個人賬戶交易及機構的自營買賣。","reference":"CFA Code para 8; HKSI Paper 5 Guide Topic 1 Section 4.28"},{"id":"T1-028","topic":"Topic 1","subtopic":"Code of Conduct - Paragraph 17 Sponsor Duties","difficulty":"Level 3","question":"根據證監會《操守準則》（Code of Conduct）第 17 段，持牌法團擔任新上市申請人的保薦人（Sponsor）時，在遞交上市申請表格（Form A1）之前，必須履行下列哪項關鍵職責？","options":[{"value":"A","label":"完成對申請人的全部合理盡職審查工作（除非性質上僅能在較後日期處理者），並確保呈交的申請版本在重大方面大致完備。"},{"value":"B","label":"保證申請人股票在掛牌首 30 個交易日內股價絕對不會跌破發行價。"},{"value":"C","label":"全權包銷發行人擬發售的全部新股，不得組建外部承銷團。"},{"value":"D","label":"直接向每名潛在零售散戶發出無條件盈利保證承諾書。"}],"answer":"A","explanation":"依據指南 1-39 頁 4.48(c) 節及 Code of Conduct 第 17 段，保薦人在呈交上市申請前，必須完成對申請人的所有合理盡職審查步驟（除非其性質只能在稍後階段進行），確保公開披露內容真實準確完整，且呈交大致完備的申請版本（Application Proof）。","reference":"Code of Conduct para 17; HKSI Paper 5 Guide Topic 1 Section 4.48(c)"},{"id":"T1-029","topic":"Topic 1","subtopic":"Code of Conduct - CMI & Placing Activities","difficulty":"Level 2","question":"根據《操守準則》第 21 段關於資本市場中介人（CMI）的規定，當保薦人本身或其所屬集團公司同時擔任該上市發行人的整體協調人（Overall Coordinator）或 CMI 時，該機構必須：","options":[{"value":"A","label":"立即無條件辭去保薦人職務，因為兩者存在不可調和的絕對法定衝突。"},{"value":"B","label":"嚴格遵守第 21 段關於建檔（Bookbuilding）、配售活動及分配建議的行為標準與利益衝突管理規定。"},{"value":"C","label":"豁免向聯交所申報所有配售承配人的背後真實身份資料。"},{"value":"D","label":"將所有包銷佣金費用轉移至香港投資者賠償基金存管。"}],"answer":"B","explanation":"指南 1-40 頁 4.49 節指出，當保薦人或其集團成員擔任參與建檔及配售的資本市場中介人（CMI）時，必須遵守《操守準則》第 21 段的規範，包括公正配售、透明報價、妥善管理利益衝突及防範不當回佣行為。","reference":"Code of Conduct para 21; HKSI Paper 5 Guide Topic 1 Section 4.49"},{"id":"T1-030","topic":"Topic 1","subtopic":"Enforcement - SFC Disciplinary Grounds","difficulty":"Level 2","question":"根據 SFO 第 IX 部，證監會可在何種法定基礎下，對持牌中介人或其負責人員行使紀律處分權力（如撤銷牌照、公開譴責或判處最高達 1,000 萬港元的罰款）？","options":[{"value":"A","label":"僅限於該中介人在高等法院被判處破產清盤時。"},{"value":"B","label":"該受規管人士被裁定犯有「失當行為」（Misconduct），或證監會認為該人不再是獲發牌的「適當人選」（Fit and Proper）。"},{"value":"C","label":"該中介人未能達成其年度預計營業額目標超過 20%。"},{"value":"D","label":"香港交易所董事會通過決議案要求撤回其會員席位。"}],"answer":"B","explanation":"依據指南 1-6 頁 1.14 節及 SFO 第 IX 部，當受規管人士被裁定犯有失當行為（包括違反 SFO、相關守則準則或任何發牌條件），或已不再是持牌的「適當人選」時，證監會即可行使法定紀律處分權威。","reference":"SFO Part IX; HKSI Paper 5 Guide Topic 1 Section 1.14"},{"id":"T1-031","topic":"Topic 1","subtopic":"Enforcement Case 1 - Takeovers Code Breach","difficulty":"Level 3","question":"在學習指南第一章回顧的真實執法個案「個案一（Case 1）」中，持牌法團 INT-A 因在擔任自願要約目標公司的財務顧問期間違反《收購守則》而遭到證監會公開譴責。該法團所觸犯的具體違規行為是：","options":[{"value":"A","label":"直接挪用了目標公司高達 1 億港元的銀行貸款進行自營操盤。"},{"value":"B","label":"作為受規管相關人士（Associate），在未按規定進行持倉申報（Rule 22）的情況下執行了目標公司股份買賣，且在未獲執行人員同意下持續散布研究報告。"},{"value":"C","label":"協助要約人虛構銀行資金證明進行敵意收購。"},{"value":"D","label":"未經授權在電視直播中宣布取消該收購要約。"}],"answer":"B","explanation":"指南 1-41 頁 4.57–4.62 節個案一指出，INT-A 作為目標公司顧問被視為其聯繫人（Associate），但其內部監控失誤，未依 Rule 22 申報交易，且違反 Rule 8.1 註釋 4 在未獲執行人員同意下分發目標公司研究報告。證監會考慮其主動自首及配合調查後予以公開譴責。","reference":"HKSI Paper 5 Guide Topic 1 Section 4.57-4.62"},{"id":"T1-032","topic":"Topic 1","subtopic":"Enforcement Case 2 - Criminal Insider Dealing","difficulty":"Level 2","question":"在指南回顧的個案二（Case 2，香港首宗內幕交易刑事定罪案件）中，投資銀行家 B 先生因私下將私有化內幕消息洩漏予聯絡人並慫使彼等買入股票，最終被法院判處何種制裁？","options":[{"value":"A","label":"免除刑事起訴，僅被處以書面警告並繼續執業。"},{"value":"B","label":"被判處 26 個月即時監禁、罰款 23 萬港元，並須支付證監會逾 30 萬港元的調查費用。"},{"value":"C","label":"吊銷牌照 3 個月並罰款 1,000 港元。"},{"value":"D","label":"僅被要求向聯交所致送公開道歉信。"}],"answer":"B","explanation":"依據指南 1-42 頁 4.65–4.66 節，這是香港首宗依據 SFO 第 XIV 部進行刑事起訴並定罪的內幕交易案件，主犯投資銀行家 B 先生被判處 26 個月監禁及罰款，並承擔高額調查費用，確立了對內幕交易嚴重刑事處罰的先例。","reference":"HKSI Paper 5 Guide Topic 1 Section 4.65-4.66"},{"id":"T1-033","topic":"Topic 1","subtopic":"Enforcement Case 3 - Cold Shoulder Order","difficulty":"Level 3","question":"在指南回顧的個案三（Case 3）中，非持牌人士 C 先生作為上市公司董事，聯同一致行動方增持 GEM 公司股份至 30.19% 卻未履行全面要約義務。證監會收購執行人員對非持牌的 C 先生施加了何種重大制裁？","options":[{"value":"A","label":"因 C 先生非證監會持牌人，證監會無權施加任何實質制裁，只能將其移交香港警察處理。"},{"value":"B","label":"施加長達 18 個月的「冷淡對待令」（Cold shoulder order），剝奪其使用香港證券市場設施的權利，並予以公開譴責。"},{"value":"C","label":"強制沒收 C 先生名下的全部私人房地產物業。"},{"value":"D","label":"命令 GEM 交易所永久終止所有股票交易。"}],"answer":"B","explanation":"指南 1-42 至 1-43 頁 4.67–4.72 節指出，個案三證明《收購守則》的制裁權力及於非持牌人士。C 先生違規觸發 30% 強要義務而未發出要約，被執行人員處以公開譴責及為期 18 個月的冷淡對待令（禁止直接或間接使用市場設施買賣證券）。","reference":"HKSI Paper 5 Guide Topic 1 Section 4.67-4.72"},{"id":"T1-034","topic":"Topic 1","subtopic":"Companies Ordinance - Financial Assistance","difficulty":"Level 3","question":"根據《公司條例》（CO, Cap. 622）第 275 條，關於公司向他人提供財務資助以收購該公司或其母公司的股份，下列原則何者最正確？","options":[{"value":"A","label":"上市公司可以隨意動用其全資子公司的未分配利潤，無條件免息借貸予任何潛在收購方購買自己的股份。"},{"value":"B","label":"一般原則上，任何公司或其附屬公司直接或間接為他人收購該公司本身的股份而提供財務資助均屬違法，除非符合法定的特定豁免或償付能力確認程序。"},{"value":"C","label":"只要收購方是持牌法團的負責人員，該財務資助即自動合法化。"},{"value":"D","label":"只有在海外註冊成立的上市公司才受該條文約束，香港本地公司不受此限。"}],"answer":"B","explanation":"依據指南 1-30 頁 3.62 節及 CO s. 275，凡有人正在收購或擬收購某公司的股份，該公司或其任何附屬公司直接或間接為該項收購提供財務資助（Financial Assistance）即屬違法，聯交所《上市規則》亦貫徹了嚴格禁止財務資助的監管原則，以維護資本充實與債權人權益。","reference":"Companies Ordinance s. 275; HKSI Paper 5 Guide Topic 1 Section 3.62"},{"id":"T1-035","topic":"Topic 1","subtopic":"Characteristics of HK Equity Market - Secondary Listings","difficulty":"Level 2","question":"根據香港股票資本市場的發展特徵及《上市規則》，一間已在紐約證券交易所（NYSE）或倫敦證券交易所（LSE）主板上市的海外企業申請在香港聯交所進行「第二上市」（Secondary Listing）時：","options":[{"value":"A","label":"必須在香港掛牌前強制從紐約或倫敦交易所撤銷原有的主要上市地位。"},{"value":"B","label":"一般而言仍須符合香港的基本資格與股東保障基準，但聯交所可就若干規則予以適當修訂或豁免（例如豁免適用公眾持股量最低百分比限制）。"},{"value":"C","label":"嚴禁任何具備不同投票權架構（WVR）的大中華發行人進行第二上市。"},{"value":"D","label":"只能發行非上市的無擔保公司債券，不得將普通股上市交易。"}],"answer":"B","explanation":"指南 1-45 頁 5.7 節及 2-44 頁 8.40–8.42 節指出，已在合資格海外市場上市的企業可尋求第二上市，須提供對等的股東基準保障，但聯交所可考慮不同司法管轄區之常規給予特定豁免（如豁免公眾持股比例等要求）。","reference":"HKSI Paper 5 Guide Topic 1 Section 5.7; Topic 2 Section 8.40-8.42"},{"id":"T1-036","topic":"Topic 1","subtopic":"Market Misconduct - Double Jeopardy","difficulty":"Level 2","question":"關於 SFO 下「市場失當行為」（Market Misconduct）的民事審裁與刑事檢控雙軌制，下列哪項關於「免受雙重危險」（No Double Jeopardy）原則的陳述最準確？","options":[{"value":"A","label":"律政司可在同一受規管人士被 MMT 裁決不成立後，就完全相同的涉案行為再度向法庭提起刑事起訴。"},{"value":"B","label":"一旦針對某特定行為依循其中一條路徑（MMT 民事或法院刑事）展開了正式訴訟程序，即不可再就同一行為循另一途徑提起訴訟。"},{"value":"C","label":"任何受規管人士若被 MMT 裁決違規，必須強制自動再接受刑事法庭的同一指控審判。"},{"value":"D","label":"民事審裁與刑事起訴可以由證監會隨意同步平行進行，無須取得律政司同意。"}],"answer":"B","explanation":"指南 1-20 頁 3.17 節明確指明，SFO 的雙軌機制受制於「無雙重危險」（No double jeopardy）原則：一旦就某行為展開了 MMT 審訊或刑事法庭程序，即不得再就同一行為依另一途徑展開訴訟。MMT 提起須經律政司司長同意，刑事訴訟則唯獨由律政司司長提起。","reference":"SFO ss. 283, 307; HKSI Paper 5 Guide Topic 1 Section 3.17"},{"id":"T1-037","topic":"Topic 1","subtopic":"Market Misconduct - Civil Liability (s. 281/305)","difficulty":"Level 2","question":"根據 SFO 第 281 條及第 305 條，任何人從事市場失當行為（如內幕交易或散布虛假消息），除面臨監管處分外，還須承擔何種民事法律後果？","options":[{"value":"A","label":"該違規者依法享有民事訴訟絕對豁免權，受損投資者不得要求任何賠償。"},{"value":"B","label":"該違規者須對任何因其市場失當行為而蒙受金錢損失的人士承擔民事賠償責任，向其支付損害賠償。"},{"value":"C","label":"只要該人支付了證監會的行政罰款，對第三方的民事賠償責任即可完全免除。"},{"value":"D","label":"賠償責任僅限於以原價回購所有受影響受害人的股票。"}],"answer":"B","explanation":"依據指南 1-21 頁 3.20 節及 SFO ss. 281, 305，任何人因從事市場失當行為，對任何因該行為而遭受金錢損失的人士負有民事法律賠償責任，法庭在考慮公平公正情況下可命令其支付損害賠償，此處不適用雙重危險免責。","reference":"SFO ss. 281, 305; HKSI Paper 5 Guide Topic 1 Section 3.20"},{"id":"T1-038","topic":"Topic 1","subtopic":"Inside Information - Reasonable Measures","difficulty":"Level 3","question":"上市公司董事會為履行 SFO 第 307G 條規定的法定責任，防止公司違反及時披露內幕消息的規定，應當落實下列哪一項內部控制與合理防護措施？","options":[{"value":"A","label":"嚴禁公司任何員工或管理層與外界傳媒接觸，並關閉公司所有對外投資者關係網站。"},{"value":"B","label":"建立對關鍵業務及營運發展的監察機制、定期審查敏感因素清單、嚴格按「有需要知情」（Need-to-know）基準限制機密流轉，並制訂傳媒與謠言應對指引。"},{"value":"C","label":"所有未公開財務數據必須強制即時向證券分析師提早透露以測試市場反應。"},{"value":"D","label":"將董事會所有重大決策全權授權予外部財經公關顧問獨自全權決定是否公告。"}],"answer":"B","explanation":"指南 1-28 頁 3.50 節引述證監會《內幕消息披露指引》（GDII）列出的核心措施：建立業務事件監察控制、定期財務報告程序、維持敏感因素清單、嚴格落實 Need-to-know 機制、簽訂嚴格保密協議、制訂應對洩密及傳媒謠言的清晰程序等。","reference":"GDII; HKSI Paper 5 Guide Topic 1 Section 3.50"},{"id":"T1-039","topic":"Topic 1","subtopic":"CWUMPO - Prospectus Registration","difficulty":"Level 2","question":"根據《公司（清盤及雜項條文）條例》（CWUMPO）及轉移職能命令，向公眾公開發售股份的招股章程在正式公開印發前，其審核與註冊程序為：","options":[{"value":"A","label":"由香港律政司親自審核，並向立法會備案登記。"},{"value":"B","label":"由香港聯交所負責審閱是否符合規定並發出核准授權書，隨後由發行人將招股章程正式呈交公司註冊處處長（Registrar of Companies）登記註冊。"},{"value":"C","label":"由證監會企業融資部全權登記存檔，無須送交公司註冊處。"},{"value":"D","label":"直接在發行人官方網站刊登即可生效，完全不需任何官方登記手續。"}],"answer":"B","explanation":"指南 1-29 頁 3.54–3.58 節及 2-31 至 2-32 頁 7.6–7.9 節指明：為免職能重複，上市證券之招股章程審核權由證監會轉移至聯交所；聯交所審核滿意後發出授權證明書（Certificate of Authorisation），隨後發行人將其送交「公司註冊處處長」正式登記註冊（CWUMPO s.38D/s.342C）。","reference":"CWUMPO ss. 38D, 342C; HKSI Paper 5 Guide Topic 1 Section 3.54-3.58; Topic 2 Section 7.6-7.9"},{"id":"T1-040","topic":"Topic 1","subtopic":"CFA Code - Duty to Client vs Regulators","difficulty":"Level 2","question":"根據《機構融資顧問操守準則》（CFA Code）第 6 段及第 7 段，當機構融資顧問發現其所服務的客戶在重大上市項目中涉嫌存在嚴重違規行為，而客戶在顧問提醒後仍拒絕向監管機構（證監會/聯交所）報告時，該顧問應當：","options":[{"value":"A","label":"繼續全力為客戶隱瞞，因為律師與顧問對客戶負有絕對的保密特權，在任何法規下皆高於監管合規。"},{"value":"B","label":"認真考慮終止為該客戶提供服務（Cease to act），並在監管機構進行查詢時予以全面合作與如實陳述。"},{"value":"C","label":"自費為客戶墊付可能產生的監管罰款以維持委聘合約。"},{"value":"D","label":"擅自篡改客戶已遞交的申請文件以配合法規規定。"}],"answer":"B","explanation":"依據指南 1-34 頁 4.22 節，機構融資顧問應盡一切合理努力確保客戶明瞭法規並促請其申報違規；若客戶無正當理由拒絕申報，顧問應考慮「停止為該客戶服務」（Cease to act），且在監管機構作出查詢時必須全力配合。","reference":"CFA Code paras 6, 7; HKSI Paper 5 Guide Topic 1 Section 4.22, 4.24"},{"id":"T1-041","topic":"Topic 1","subtopic":"CFA Code - Sponsor Independence","difficulty":"Level 3","question":"某持牌法團受聘擔任一間主板擬上市公司的獨立保薦人。根據聯交所《上市規則》第 3A 章及證監會指引，下列哪種情形最可能直接使該保薦人的「獨立性」（Independence）受到嚴重質疑？","options":[{"value":"A","label":"保薦人與上市申請人處於同一辦公大樓的不同樓層辦公。"},{"value":"B","label":"保薦人所屬集團控制上市申請人已發行股本（不含庫存股）超過 5% 的經濟權益，或保薦人的主要高管同時擔任該申請人的非執行董事。"},{"value":"C","label":"保薦人指派了三名全職持牌代表參與該上市項目的盡職調查。"},{"value":"D","label":"保薦人要求上市申請人必須簽訂符合香港法律標準的標準聘用合約。"}],"answer":"B","explanation":"依據指南 2-9 頁 3.3–3.4 節及 MBLR 3A.07，保薦人及其集團在申請人擁有超過 5% 股權利益、彼此存在重大商業控制關係、或保薦人主要職員同時擔任發行人董事等，均會損害其獨立性。獨立保薦人必須於 Form A1 中申報確認其獨立身份。","reference":"MBLR 3A.07; HKSI Paper 5 Guide Topic 2 Section 3.3-3.4"},{"id":"T1-042","topic":"Topic 1","subtopic":"Corporate Governance - INED Overboarding & Tenure","difficulty":"Level 2","question":"根據《企業管治守則》（MBLR Appendix C1）及相關上市規則最新修訂，關於獨立非執行董事（INED）的任職兼職限制與任期，下列敘述何者正確？","options":[{"value":"A","label":"一名 INED 最多可同時擔任無限制數量的上市公司董事，只要其每年簽署獨立性確認書即可。"},{"value":"B","label":"一名 INED 最多只可同時在 6 間上市發行人擔任董事職務；且若其在同一發行人任職累計超過 9 年，其連任須經過獨立股東特別決議案審批並詳細解釋獨立理由（過渡期至 2031 年後將全面限制）。"},{"value":"C","label":"任何 INED 的任期一律不得超過 3 個月。"},{"value":"D","label":"INED 嚴禁在董事會轄下的審核委員會中擔任主席。"}],"answer":"B","explanation":"指南 1-13 頁 2.8(i)(j) 節及 2-15 至 2-16 頁 3.29 節指出，為確保董事能投入足夠時間，兼職上限為 6 間上市發行人（過渡期至 2028 年生效）；任職超過 9 年的「超期 INED」重新委任須獨立決議案批准（過渡至 2031 年 7 月後將全面禁止連任）。","reference":"MBLR 3.12A, 3.13A; HKSI Paper 5 Guide Topic 1 Section 2.8; Topic 2 Section 3.29"},{"id":"T1-043","topic":"Topic 1","subtopic":"Market Misconduct - False Trading (s. 274/295)","difficulty":"Level 2","question":"根據 SFO 第 274 條及第 295 條，在沒有涉及實益擁有權轉變的情況下進行證券交易（俗稱洗售或虛售交易，Wash Sales），其主要構成何種市場失當行為？","options":[{"value":"A","label":"虛假交易（False Trading）"},{"value":"B","label":"合法對沖套利（Hedging）"},{"value":"C","label":"內幕交易（Insider Dealing）"},{"value":"D","label":"自願要約全面收購（Voluntary General Offer）"}],"answer":"A","explanation":"根據 SFO ss. 274, 295 及指南 1-20 頁 3.16 節，凡人為製造證券活躍交易的虛假或具誤導性表象、或未實質改變實益擁有權的買賣（洗售），屬於典型的法定「虛假交易」（False Trading）市場失當行為。","reference":"SFO ss. 274, 295; HKSI Paper 5 Guide Topic 1 Section 3.16"},{"id":"T1-044","topic":"Topic 1","subtopic":"SFC Supervision of Markets Division","difficulty":"Level 1","question":"證監會的「市場監察部」（Supervision of Markets Division）其核心法定職責主要聚焦於：","options":[{"value":"A","label":"處理每間證券公司的牌照核准及代表考試豁免。"},{"value":"B","label":"監督及監察香港交易所（HKEX）及其附屬的結算所與結算系統運作，並促進市場基建發展及管理投資者賠償基金。"},{"value":"C","label":"負責審理涉及全港律師事務所的職業失當處分。"},{"value":"D","label":"為所有主板上市公司編制年度財務審計報告。"}],"answer":"B","explanation":"依據指南 1-6 頁 1.15(a) 節，市場監察部主要監控認可交易所及認可結算所（HKEX 等市場營運者）的運作與基建，制定跨境聯通政策，並監管投資者賠償基金。","reference":"HKSI Paper 5 Guide Topic 1 Section 1.15(a)"},{"id":"T1-045","topic":"Topic 1","subtopic":"Takeovers Code - Non-statutory Consensus","difficulty":"Level 2","question":"關於香港《公司收購及合併守則》與《股份回購守則》的法律屬性，下列陳述何者正確？","options":[{"value":"A","label":"《收購守則》屬於香港立法會通過的成文法例，法庭有權直接對違反守則者處以刑事監禁。"},{"value":"B","label":"《收購守則》由證監會依據 SFO 第 399 條發布，本質上是非法定的（Non-statutory），代表市場參與者與證監會共識的商業道德標準；但違反守則可導致被剝奪進入市場設施的嚴厲制裁。"},{"value":"C","label":"《收購守則》完全不受任何香港法院的司法覆核。"},{"value":"D","label":"《收購守則》僅對持牌銀行有約束力，任何上市公司控股股東均可自願豁免遵從。"}],"answer":"B","explanation":"指南 1-36 至 1-37 頁 4.36 節及 3-3 至 3-4 頁 1.7 節指出：《收購守則》是非成文法定規則，體現業界可接受之商業行為共識；聯交所《上市規則》明確要求上市公司必須遵守《收購守則》，委員會裁決亦可受高等法院司法覆核。","reference":"HKSI Paper 5 Guide Topic 1 Section 4.36; Topic 3 Section 1.7"},{"id":"T1-046","topic":"Topic 1","subtopic":"Companies Ordinance - Articles of Association","difficulty":"Level 2","question":"根據香港新《公司條例》（Cap. 622），一間擬在香港聯交所申請上市的香港本地公司，其憲制文件架構為：","options":[{"value":"A","label":"必須同時維持獨立的《組織章程大綱》（Memorandum of Association）及《組織章程細則》（Articles of Association）。"},{"value":"B","label":"取消了組織章程大綱，所有公司僅須具備單一的《組織章程細則》（Articles of Association），原大綱條款被視為細則條款。"},{"value":"C","label":"完全廢除任何章程文件，改由董事會決議案取代。"},{"value":"D","label":"章程細則必須強制規定全體股東不得轉讓股份。"}],"answer":"B","explanation":"指南 1-22 頁 4.2 節指出：在《公司條例》（Cap. 622）生效後，香港公司不再有單獨的組織章程大綱，原有大綱內容併入《組織章程細則》（Articles of Association）內，以此作為規管公司內部運作的單一憲制文件。","reference":"Companies Ordinance Cap. 622; HKSI Paper 5 Guide Topic 1 Section 4.2"},{"id":"T1-047","topic":"Topic 1","subtopic":"Registrar of Companies - Public Inspection","difficulty":"Level 1","question":"公司註冊處處長（Registrar of Companies）在維持香港公司透明度方面扮演關鍵角色，其法定職責包括：","options":[{"value":"A","label":"為所有在香港經營的對沖基金計算每日淨資產值（NAV）。"},{"value":"B","label":"備存並供公眾查閱公司的法定申報表、財務申報表、已註冊的抵押文件及登記上市招股章程。"},{"value":"C","label":"代表證監會向高等法院提出一切涉嫌內幕交易的刑事起訴。"},{"value":"D","label":"全權主導新股上市的建檔定價會議。"}],"answer":"B","explanation":"依據指南 1-9 至 1-10 頁 1.30–1.32 節，公司註冊處負責執行《公司條例》，保管法定申報表、公司抵押登記、招股章程登記，並在法團長期失責時行使剔除註冊名冊（Strike off）的權力。","reference":"HKSI Paper 5 Guide Topic 1 Section 1.30-1.32"},{"id":"T1-048","topic":"Topic 1","subtopic":"CFA Code - Independence of Independent Financial Advisers (IFA)","difficulty":"Level 3","question":"在上市公司進行關連交易時受聘擔任獨立財務顧問（IFA）的持牌機構，依據 CFA Code 及《上市規則》第 13.80 條，其獨立義務起點時間（IFA Obligation Commencement Time）為何？","options":[{"value":"A","label":"以向股東正式印發載有其意見函件的通函當日為準。"},{"value":"B","label":"以該 IFA 開始為發行人開展工作之時，或簽署正式聘用函之日（以較早者為準）起算，直至委聘終止。"},{"value":"C","label":"以股東大會正式投票表決通過該交易之時起算。"},{"value":"D","label":"以聯交所上市委員會正式蓋印批覆委聘函起算。"}],"answer":"B","explanation":"指南 2-13 頁 3.21(c) 節明確指明：獨立財務顧問（IFA）必須自「IFA 義務生效時間」（即 IFA 開始為發行人工作之時，或簽署聘用函之時，以較早者為準）起直至委聘期結束，全程維持無利益衝突的絕對獨立性。","reference":"MBLR 13.80-13.87; HKSI Paper 5 Guide Topic 2 Section 3.21"},{"id":"T1-049","topic":"Topic 1","subtopic":"Corporate Governance - Whistleblowing & Anti-Corruption","difficulty":"Level 2","question":"根據《企業管治守則》守則條文（Code Provisions），上市發行人在內部控制與審計委員會監督職責上，必須建立下列哪項內部政策？","options":[{"value":"A","label":"強制要求舉報人公開真實姓名並於公司內聯網公示舉報內容。"},{"value":"B","label":"設立反貪污政策及系統，並設立允許僱員及商業往來方以匿名及保密方式向審核委員會舉報任何不當行為的「舉報政策」（Whistleblowing Policy）。"},{"value":"C","label":"由行政總裁個人全權掌控並查閱所有舉報信箱以防下屬濫用。"},{"value":"D","label":"禁止僱員對任何涉及財務舞弊的疑慮提出質疑。"}],"answer":"B","explanation":"指南 1-14 頁 2.8(q)(r) 節指明，發行人應在守則條文下落實舉報政策（Whistleblowing Policy），確保員工或客戶/供應商能「保密且匿名地」（In confidence and anonymity）向審核委員會反映任何潛在不當行為，並制定反貪污體系。","reference":"MBLR Appendix C1; HKSI Paper 5 Guide Topic 1 Section 2.8(q)(r)"},{"id":"T1-050","topic":"Topic 1","subtopic":"Inside Information Disclosure - Safe Harbours Exception","difficulty":"Level 3","question":"根據 SFO 第 307D 條，下列哪項屬於上市公司可暫免披露內幕消息的法定安全港（Safe Harbour）之一？","options":[{"value":"A","label":"公司股價在過去 5 個交易日內跌幅超過 50%。"},{"value":"B","label":"該披露受到香港任何法律或法院命令的限制，或該消息屬於未完成的提案/商討且公司已採取合理保密措施並實際維持機密。"},{"value":"C","label":"全體執行董事口頭商定一致認為該消息不利於近期融資計劃。"},{"value":"D","label":"核數師尚未正式收取該財政年度的全部審計費用。"}],"answer":"B","explanation":"依據指南 1-25 頁 3.36 節及 SFO s. 307D，法定豁免披露內幕消息的安全港主要包含：(1) 披露受成文法則或法院命令禁止；(2) 公司採取合理防護並實際保持機密，且該資料屬於未完成商議/提案、或屬於商業秘密、或獲證監會因海外法律豁免。","reference":"SFO s.307D; HKSI Paper 5 Guide Topic 1 Section 3.36"},{"id":"T1-051","topic":"Topic 1","subtopic":"SFC Regulatory Structure - Licensing Department","difficulty":"Level 1","question":"根據香港證監會（SFC）內部組織架構，機構融資顧問申請第 6 類受規管活動牌照（Type 6 licence）時，應向哪一個專責部門提交申請及進行資格審查？","options":[{"value":"A","label":"企業融資部（Corporate Finance Division）"},{"value":"B","label":"中介機構部轄下的發牌科（Licensing Department）"},{"value":"C","label":"法規執行部（Enforcement Division）"},{"value":"D","label":"市場監察部（Supervision of Markets Division）"}],"answer":"B","explanation":"根據指南 1-5 頁 1.11–1.12 節，中介機構部由發牌科及中介機構監察科組成。擬進行第 6 類受規管活動的機構融資顧問，其法團牌照及個人代表/負責人員牌照均由發牌科負責審批與發出。","reference":"HKSI Paper 5 Guide Topic 1 Section 1.11-1.12"},{"id":"T1-052","topic":"Topic 1","subtopic":"SFO - Definition of Substantial Shareholder for Licensing","difficulty":"Level 2","question":"在持牌法團股東資格及持續合規層面，根據《證券及期貨條例》（SFO）的法定定義，何謂持牌法團的「大股東」（Substantial Shareholder）？","options":[{"value":"A","label":"單獨或聯同其聯系人擁有該持牌法團超過 5% 的有投票權股份的人士"},{"value":"B","label":"單獨或聯同其聯系人擁有該持牌法團超過 10% 的有投票權股份或經濟利益的人士"},{"value":"C","label":"擁有該持牌法團超過 30% 投票權的人士"},{"value":"D","label":"持有該持牌法團任何具表決權股份的董事"}],"answer":"B","explanation":"指南 1-6 頁 1.12 節註釋明確指出：在 SFO 發牌監管架構下，持牌法團的「大股東」（Substantial shareholder）是指單獨或聯同其聯繫人擁有該公司超過 10% 股份權益的人士（注意：此處 10% 門檻有別於 Part XV 權益披露的 5% 門檻）。","reference":"SFO s.6; HKSI Paper 5 Guide Topic 1 Section 1.12 Note"},{"id":"T1-053","topic":"Topic 1","subtopic":"HKMA & Registered Institutions","difficulty":"Level 2","question":"一間獲香港金融管理局（HKMA）認可的商業銀行（AFI）計劃從事第 6 類受規管活動（就機構融資提供意見）。根據監管架構，下列敘述何者正確？","options":[{"value":"A","label":"該銀行僅須受金管局審查，完全不受證監會任何守則約束"},{"value":"B","label":"該銀行須向證監會申請註冊成為「註冊機構」（Registered Institution），其前線監管機構仍為金管局，但日常機構融資業務仍須遵守證監會的相關守則（包括《CFA 操守準則》）"},{"value":"C","label":"獲認可金融機構嚴禁經營任何機構融資顧問業務"},{"value":"D","label":"該銀行必須先撤銷其銀行牌照，方可註冊從事機構融資活動"}],"answer":"B","explanation":"指南 1-7 至 1-8 頁 1.21–1.22 節指出：認可財務機構從事 SFO 受規管活動須向證監會註冊為註冊機構；雖然其日常前線監管機構為金管局，但該機構一般而言必須遵守證監會發布的守則及指引，包括《機構融資顧問操守準則》（CFA Code）。","reference":"Banking Ordinance s.20; SFO s.119; HKSI Paper 5 Guide Topic 1 Section 1.21-1.22"},{"id":"T1-054","topic":"Topic 1","subtopic":"Registered Institutions - Executive Officers","difficulty":"Level 2","question":"註冊機構（Registered Institution）在從事機構融資業務時，其在高級人員管理上的要求與持牌法團的負責人員（RO）相對應。註冊機構必須具備：","options":[{"value":"A","label":"至少一名由金管局直接指派的外部審計主管"},{"value":"B","label":"就每類受規管活動委任至少兩名「主管人員」（Executive Officers），且在任何時候均須至少有一名主管人員可監督該業務"},{"value":"C","label":"全體董事均須進入金管局執行人員登記冊"},{"value":"D","label":"至少三名具備保薦人資格的主管人員"}],"answer":"B","explanation":"依據指南 1-19 頁 3.11 節，註冊機構就每項受規管活動，須委任至少兩名主管人員（Executive Officers），且在任何時候均須至少有一名主管人員可親自監督該業務；從事該活動的個別僱員姓名亦須登錄於金管局根據《銀行業條例》第 20 條備存的名冊內。","reference":"Banking Ordinance s.20; SFO s.119; HKSI Paper 5 Guide Topic 1 Section 3.11"},{"id":"T1-055","topic":"Topic 1","subtopic":"Exchange Controller & Clearing Houses","difficulty":"Level 1","question":"根據《證券及期貨條例》（SFO），香港交易及結算所有限公司（HKEX）作為認可交易所控制人，旗下營運四間認可結算所。下列哪一間不屬於 HKEX 旗下的四間認可結算所之一？","options":[{"value":"A","label":"香港中央結算有限公司（HKSCC）"},{"value":"B","label":"香港聯合交易所期權結算所有限公司（SEHK Options Clearing House）"},{"value":"C","label":"場外結算公司（OTC Clearing Hong Kong Limited）"},{"value":"D","label":"倫敦金屬交易所結算所（LME Clear Limited）"}],"answer":"D","explanation":"指南 1-8 頁 1.23–1.24 節指出，HKEX 在 SFO 下營運的四間認可結算所為：香港中央結算有限公司、香港聯合交易所期權結算所有限公司、香港期貨結算有限公司及場外結算公司（OTC Clearing Hong Kong Limited）。LME Clear 屬於英國本地監管結算所，非 SFO s.37 下的香港認可結算所。","reference":"SFO s.37; HKSI Paper 5 Guide Topic 1 Section 1.23-1.24"},{"id":"T1-056","topic":"Topic 1","subtopic":"SEHK Listing Committee - Composition","difficulty":"Level 2","question":"香港聯合交易所上市委員會（Listing Committee）負責行使聯交所董事會就上市事宜的所有權力。關於其成員組成，下列敘述何者正確？","options":[{"value":"A","label":"由 10 名全職證監會執行董事組成，聯交所行政總裁擔任主席"},{"value":"B","label":"由至少 28 名成員組成，包括至少 8 名投資者代表、19 名市場專業人士/上市發行人代表，以及聯交所行政總裁作為當然非投票成員"},{"value":"C","label":"全數成員必須由高等法院法官委任，任期終身制"},{"value":"D","label":"僅由主板上市發行人的董事會主席輪流兼任"}],"answer":"B","explanation":"指南 1-8 頁 1.27 節及 2-6 頁 2.5 節指明：上市委員會由至少 28 名成員組成，包括至少 8 名投資者代表、19 名上市發行人與市場專業從業者代表，以及 HKEX 行政總裁擔任當然非投票成員（Ex-officio non-voting member）。","reference":"MBLR 2A.17; HKSI Paper 5 Guide Topic 1 Section 1.27; Topic 2 Section 2.5"},{"id":"T1-057","topic":"Topic 1","subtopic":"SEHK Listing Committee - Quorum & Term","difficulty":"Level 2","question":"聯交所上市委員會處理上市申請或審議紀律個案時，其法定開會法定人數（Quorum）及成員的最長連續任期為：","options":[{"value":"A","label":"法定人數為 3 人，最長連續任期 3 年"},{"value":"B","label":"法定人數為 5 人，最長連續任期 6 年（退任後至少 2 年內不得重新委任）"},{"value":"C","label":"法定人數為 10 人，最長連續任期 10 年"},{"value":"D","label":"法定人數為全體成員，任期每年重選無上限"}],"answer":"B","explanation":"指南 2-6 至 2-7 頁 2.6–2.7 節指明：上市委員會的開會法定人數為 5 名成員；成員最長連續任期為 6 年，且在完成最長任期後至少 2 年內不得重新獲委任（除非有特殊情況）。在進行首審或覆核時，行政總裁不得出席。","reference":"MBLR 2A.17-2A.24; HKSI Paper 5 Guide Topic 2 Section 2.6-2.7"},{"id":"T1-058","topic":"Topic 1","subtopic":"Listing Review Committee (LRC) - Composition","difficulty":"Level 2","question":"聯交所上市覆核委員會（Listing Review Committee, LRC）是負責覆核上市委員會決定的獨立機構。關於其成員資格限制，下列何者正確？","options":[{"value":"A","label":"上市委員會現任成員及證監會或聯交所的現職代表，均不得擔任 LRC 成員"},{"value":"B","label":"必須由證監會法規執行部總監兼任 LRC 主席"},{"value":"C","label":"只有被處分的上市公司控股股東方有資格擔任 LRC 成員"},{"value":"D","label":"LRC 成員與上市委員會成員完全相同且職責重疊"}],"answer":"A","explanation":"依據指南 2-7 頁 2.10 節註釋，為確保獨立覆核之客觀性，上市委員會成員、證監會代表或香港交易所代表均無資格加入上市覆核委員會（LRC）。LRC 由至少 20 名獨立市場人士及投資者代表組成。","reference":"MBLR 2A.37A; HKSI Paper 5 Guide Topic 2 Section 2.10 Note"},{"id":"T1-059","topic":"Topic 1","subtopic":"Relationship between SEHK and SFC - MOU","difficulty":"Level 2","question":"根據 2003 年證監會與香港交易所簽署的《有關上市事宜的諒解備忘錄》（MOU），下列關於兩者職能分工的描述何者正確？","options":[{"value":"A","label":"聯交所負責所有刑事內幕交易的法院起訴，證監會僅負責上市審批"},{"value":"B","label":"聯交所是所有上市相關事宜及上市發行人的前線監管機構，但聯交所擬修訂或制定的所有《上市規則》均須事先獲得證監會的法定批准"},{"value":"C","label":"證監會完全不參與任何新上市申請文件的審閱"},{"value":"D","label":"聯交所可以單方面廢除《證券及期貨條例》下的法定披露條款"}],"answer":"B","explanation":"指南 1-8 至 1-9 頁 1.26–1.28 節指出：聯交所作為前線監管者管理上市事宜，但受證監會全面監管。《上市規則》的新增或修訂必須取得證監會核准方可生效；且透過雙重存檔架構共同監督發行人披露。","reference":"MBLR 2.05; HKSI Paper 5 Guide Topic 1 Section 1.26-1.28"},{"id":"T1-060","topic":"Topic 1","subtopic":"Corporate Governance Code - Mandatory Disclosure vs Comply or Explain","difficulty":"Level 2","question":"聯交所《企業管治守則》（Corporate Governance Code, MBLR Appendix C1）的架構分為強制性披露要求與「不遵守就解釋」條文。下列哪一事項屬於發行人年報中「強制性披露要求」（Mandatory Disclosure Requirements）？","options":[{"value":"A","label":"發行人的董事會技能矩陣（Board skills matrix）具體內容"},{"value":"B","label":"發行人的多元化政策、審核委員會職權範圍、內部控制系統及股東權利相關常規"},{"value":"C","label":"獨立非執行董事出席所有業務推廣午餐會的詳細簽到記錄"},{"value":"D","label":"全體員工匿名舉報信箱收到的所有舉報信原文"}],"answer":"B","explanation":"指南 1-11 頁 2.3–2.4 節明確列出強制披露要求涵蓋的領域：企業管治常規、董事會架構、董事委員會、董事證券交易、風險管理及內部監控、核數師薪酬、多元化（Diversity）、股東權利、投資者關係及股息政策。發行人年報若缺失該等披露即構成違反上市規則。","reference":"MBLR Appendix C1 Part 1; HKSI Paper 5 Guide Topic 1 Section 2.3-2.4"},{"id":"T1-061","topic":"Topic 1","subtopic":"Corporate Governance - Board Meetings Frequency","difficulty":"Level 1","question":"根據《企業管治守則》守則條文，上市發行人的董事會常規會議應當以何種頻率定期舉行？","options":[{"value":"A","label":"每年至少一次，且必須於股東週年大會當天舉行"},{"value":"B","label":"每年至少定期召開四次董事會會議，大約每季一次"},{"value":"C","label":"每月必須召開至少兩次面對面會議"},{"value":"D","label":"由行政總裁視乎盈利狀況自由決定，無任何最低次數規定"}],"answer":"B","explanation":"指南 1-13 頁 2.8(e) 節規定，守則條文要求董事會應定期召開會議，每年至少舉行四次，大約每季一次；且該等常規會議應有大部分有權出席的董事親自或透過電子通訊積極參與。","reference":"MBLR Appendix C1; HKSI Paper 5 Guide Topic 1 Section 2.8(e)"},{"id":"T1-062","topic":"Topic 1","subtopic":"Corporate Governance - Material Conflict of Interest Board Meeting","difficulty":"Level 3","question":"某上市發行人擬與其控股股東控制的私人物業公司簽訂一項重大租賃合約。董事會審議該具有重大利益衝突的事項時，依據《企業管治守則》的守則條文，下列哪種程序是正確的？","options":[{"value":"A","label":"只需透過董事傳閱書面決議案（Written resolution）方式由控股股東代表簽字即可通過"},{"value":"B","label":"應當舉行實體董事會會議（而非單純書面決議案），且自身及其聯繫人在此交易中並無重大利益的獨立非執行董事（INEDs）必須出席該會議"},{"value":"C","label":"該交易可由行政總裁全權單獨審批，毋須知會董事會"},{"value":"D","label":"必須將該合約交由廉政公署預先審查"}],"answer":"B","explanation":"指南 1-13 頁 2.8(f) 節規定：若在董事會即將考慮的事宜中，大股東或董事存在董事會認定為重大的利益衝突，該事項應以舉行實體董事會會議處理（而非傳閱書面決議）；在此事項中並無重大利益的獨立非執行董事應出席該次會議。","reference":"MBLR Appendix C1; HKSI Paper 5 Guide Topic 1 Section 2.8(f)"},{"id":"T1-063","topic":"Topic 1","subtopic":"Corporate Governance - Separation of Chairman and CEO","difficulty":"Level 1","question":"根據《企業管治守則》守則條文 C.2.1，關於董事會主席（Chairman）與行政總裁（Chief Executive）的角色分配，聯交所的要求是：","options":[{"value":"A","label":"兩者必須由同一人兼任以確保公司最高領導權的統一與決策效率"},{"value":"B","label":"兩者的職色應有區分，不應由一人同時兼任，且各自職責應以書面形式明確界定"},{"value":"C","label":"主席必須由外聘會計師擔任，行政總裁必須由外聘律師擔任"},{"value":"D","label":"若由同一人兼任，公司可自動豁免向公眾解釋任何原因"}],"answer":"B","explanation":"指南 1-13 頁 2.8(g) 節明確指出：守則條文規定主席與行政總裁的角色應有區分，不應由一人同時兼任。若發行人選擇由同一人兼任，必須於年報及中期報告內詳細解釋其管治架構如何能維持足夠的制衡（不遵守就解釋）。","reference":"MBLR Appendix C1; HKSI Paper 5 Guide Topic 1 Section 2.8(g)"},{"id":"T1-064","topic":"Topic 1","subtopic":"Corporate Governance - Nomination Committee Gender Diversity","difficulty":"Level 2","question":"為落實董事會性別多元化要求，《企業管治守則》守則條文對發行人提名委員會（Nomination Committee）的組成有何特定規定？","options":[{"value":"A","label":"提名委員會全體成員必須均為女性"},{"value":"B","label":"發行人應委任至少一名不同性別的董事出任提名委員會成員"},{"value":"C","label":"提名委員會必須每週更換一次委員會主席的性別"},{"value":"D","label":"提名委員會成員嚴禁參與任何董事候選人面試"}],"answer":"B","explanation":"指南 1-13 頁 2.8(d) 節指明，守則條文規定發行人應委任至少一名不同性別的董事（At least one director of a different gender）加入提名委員會，藉以自提名源頭推動董事會整體層面的多元化視野。","reference":"MBLR Appendix C1; HKSI Paper 5 Guide Topic 1 Section 2.8(d)"},{"id":"T1-065","topic":"Topic 1","subtopic":"Corporate Governance - Lead INED","difficulty":"Level 2","question":"根據《企業管治守則》建議最佳常規（Recommended Best Practices），在何種情況下，董事會宜委任一名「首席獨立非執行董事」（Lead INED）？","options":[{"value":"A","label":"當董事會主席本身並非獨立非執行董事時，宜委任首席 INED 作為其他董事及股東的中介與常規溝通管道"},{"value":"B","label":"當公司股票停牌超過 12 個月時"},{"value":"C","label":"當公司決定發行無表決權優先股時"},{"value":"D","label":"當全體執行董事均年滿 65 歲時"}],"answer":"A","explanation":"指南 1-14 頁 2.9 節註釋指出：在董事會主席並非獨立非執行董事的情況下，委任一名首席獨立非執行董事（Lead INED）可作為其他董事及股東的中介渠道，在常規溝通渠道不足時提供客觀獨立的溝通橋樑。","reference":"MBLR Appendix C1; HKSI Paper 5 Guide Topic 1 Section 2.9 Note"},{"id":"T1-066","topic":"Topic 1","subtopic":"ESG Code - Governance Structure Statement","difficulty":"Level 2","question":"根據聯交所《ESG 報告守則》（ESG Code），發行人董事會必須在 ESG 報告中以強制披露形式載入「管治架構聲明」（Governance Structure），該聲明必須包含下列哪項核心內容？","options":[{"value":"A","label":"董事會對 ESG 事宜的全面監管情況，以及評估、排定優先次序及管理 ESG 相關議題的管理方針與檢討目標進展的方法"},{"value":"B","label":"公司全體基層員工的每日碳足跡打卡數據原文"},{"value":"C","label":"下一年度全體董事因節能減排所能分得的具體現金獎金數額"},{"value":"D","label":"全體供應商的詳細銀行賬戶明細"}],"answer":"A","explanation":"指南 1-15 頁 2.14 節指出，ESG Code 的強制披露要求中，董事會必須披露其管治架構，包含：董事會對 ESG 事宜的監管、董事會用以評估與管理 ESG 議題（包括氣候風險）的管理方法，以及董事會如何檢討相關目標與指標的進展。","reference":"MBLR Appendix C2; HKSI Paper 5 Guide Topic 1 Section 2.14"},{"id":"T1-067","topic":"Topic 1","subtopic":"ESG Code - Climate Disclosures Four Pillars","difficulty":"Level 2","question":"根據聯交所 ESG Code（與國際 IFRS 永續披露準則接軌），發行人就氣候相關風險與機遇（Climate-related risks and opportunities）進行披露時，所圍繞的四大核心支柱（Four core pillars）是：","options":[{"value":"A","label":"融資、銷售、利潤、納稅"},{"value":"B","label":"管治（Governance）、策略（Strategy）、風險管理（Risk management）、指標與目標（Metrics and targets）"},{"value":"C","label":"植樹量、廢水排放、太陽能板數量、電動車使用率"},{"value":"D","label":"股東大會、監事會、董事會、工會"}],"answer":"B","explanation":"指南 1-15 頁 2.12 節指出：氣候相關披露必須圍繞四大核心支柱進行：(1) 管治架構（Governance）、(2) 管理風險及機遇的策略（Strategy）、(3) 評估相關風險與機遇的流程（Risk Management）、及 (4) 衡量表現的指標和目標（Metrics and Targets）。","reference":"HKSI Paper 5 Guide Topic 1 Section 2.12"},{"id":"T1-068","topic":"Topic 1","subtopic":"Type 6 Regulated Activity - Statutory Definition","difficulty":"Level 2","question":"根據《證券及期貨條例》（SFO）附表 5，下列哪一項活動明確屬於「就機構融資提供意見」（Type 6 regulated activity）的法定定義範圍？","options":[{"value":"A","label":"向零售客戶推薦買賣某隻二級市場藍籌股票的技術走勢分析"},{"value":"B","label":"就遵守聯交所《上市規則》、《公司收購及合併守則》或《股份回購守則》提供意見"},{"value":"C","label":"替私人客戶全權代客管理其股票與債券投資組合"},{"value":"D","label":"為客戶提供期貨合約保證金融資借貸服務"}],"answer":"B","explanation":"指南 1-17 頁 3.2 節引述 SFO 附表 5，第 6 類受規管活動是指就以下事項提供意見：(a) 遵守《上市規則》；(b) 遵守《收購守則》或《回購守則》；(c) 向公眾處置或收購證券的要約；或 (d) 向上市公司或公眾公司就涉及證券的重大重組提供意見。A 選項為第 4 類；C 選項為第 9 類；D 選項為第 8/2 類。","reference":"SFO Schedule 5; HKSI Paper 5 Guide Topic 1 Section 3.2"},{"id":"T1-069","topic":"Topic 1","subtopic":"SFO Licensing - Responsible Officer Qualifications","difficulty":"Level 2","question":"某持牌代表申請獲證監會核准為機構融資持牌法團的負責人員（RO）。根據 SFO 及證監會《勝任能力的指引》，該申請人：","options":[{"value":"A","label":"必須是該持牌法團的法人股東代表，且持有至少 50% 實益股權"},{"value":"B","label":"不一定必須具備該法團的董事職銜，但必須證明其擁有足夠職權監督該項受規管活動業務，且具備勝任該角色的適當能力、技能、知識與經驗"},{"value":"C","label":"必須在過去 10 年內未曾離開過香港本土管轄區超過 7 天"},{"value":"D","label":"必須同時取得香港執業大律師與執業會計師之雙重資格"}],"answer":"B","explanation":"指南 1-19 頁 3.7 節指出：代表獲核准為負責人員，本身並不強制要求其必須是公司董事，但其必須向證監會證明：(a) 具有足夠權限監督該業務；及 (b) 具備足夠勝任能力（適當的技能、知識及經驗）。同一人亦可兼任多於一項受規管活動的 RO（前提是職責無利益衝突）。","reference":"SFO s.126; HKSI Paper 5 Guide Topic 1 Section 3.7"},{"id":"T1-070","topic":"Topic 1","subtopic":"SFO Licensing - Transfer of Accreditation","difficulty":"Level 1","question":"根據 SFO 第 122 條，當一名機構融資持牌代表（Licensed Representative）轉換僱主並擬加盟另一家持牌法團繼續執業時，其應向證監會申請：","options":[{"value":"A","label":"重新申請永久性居留權認證"},{"value":"B","label":"轉移隸屬關係（Change / Transfer of accreditation）"},{"value":"C","label":"強制暫時吊銷牌照 6 個月清洗期"},{"value":"D","label":"商業登記證更換"}],"answer":"B","explanation":"指南 1-18 頁 3.5 節及 SFO s. 122 規定，持牌代表在轉換受聘持牌法團時，可向證監會申請轉移隸屬關係（Change of accreditation），此類後續轉移的審批程序通常較初次申領牌照更為快捷。","reference":"SFO s.122; HKSI Paper 5 Guide Topic 1 Section 3.5"},{"id":"T1-071","topic":"Topic 1","subtopic":"SFO Part IV - Offers of Investments & Safe Harbours","difficulty":"Level 3","question":"根據 SFO 第 IV 部（第 103 及 105 條），向香港公眾發出載有投資要約或邀請的廣告、文件原則上必須事先獲得證監會認可。下列哪種情形屬於機構融資顧問可合法依賴的法定安全港（豁免於證監會認可）？","options":[{"value":"A","label":"向街頭任何不特定的散戶派發未註冊的私募股權宣傳單張"},{"value":"B","label":"要約是透過符合《公司（清盤及雜項條文）條例》（CWUMPO）規定並依法向公司註冊處註冊的招股章程發出"},{"value":"C","label":"透過社交媒體公開向公眾直播推薦未獲認可的虛擬代幣首次發行"},{"value":"D","label":"只要發行公司在香港註冊超過 5 年，一切廣告均自動豁免"}],"answer":"B","explanation":"指南 1-20 頁 3.12 節指出：SFO s. 103 規定發布未經認可的投資廣告屬違法，但明確設有安全港（Safe harbours），例如依據 CWUMPO 妥為合規並註冊之招股章程發出的公開要約；或依據 SFO s. 175 發出的特定證券要約文件。","reference":"SFO ss. 103, 105, 175; CWUMPO; HKSI Paper 5 Guide Topic 1 Section 3.12-3.13"},{"id":"T1-072","topic":"Topic 1","subtopic":"SFO Part XIVA - Definition of Inside Information","difficulty":"Level 2","question":"根據 SFO 第 307A 條及指南定義，下列哪項構成上市公司的「內幕消息」（Inside Information）之法定核心要素？","options":[{"value":"A","label":"普遍為該證券的常規投資者所知悉的歷史財務業績"},{"value":"B","label":"關乎該法團、其高級人員、股東或上市證券的「具體消息」（Specific information），並非普遍為慣常或可能買賣該證券的人士所知，且若普遍為彼等所知，相當可能會對證券價格產生「重大影響」"},{"value":"C","label":"財經報章專欄作家對行業宏觀經濟趨勢的個人猜測"},{"value":"D","label":"公司內部任何涉及日常文儀用品採購的發票金額"}],"answer":"B","explanation":"指南 1-22 頁 3.22 節註釋 2 及 SFO s. 307A 指出：內幕消息必須具備三大要素：(1) 屬於具體消息（Specific information）；(2) 並非普遍為市場參與者所知；及 (3) 若普遍為彼等所知，相當可能會對證券價格造成重大影響（Material effect on price）。","reference":"SFO s.307A; HKSI Paper 5 Guide Topic 1 Section 3.22 Note 2"},{"id":"T1-073","topic":"Topic 1","subtopic":"SFO Part XIVA - When Knowledge is Imputed to Corporation","difficulty":"Level 3","question":"根據 SFO 第 307B(2) 條，在何種法定情況下，一項內幕消息被視為「已獲上市公司知悉」（Come to the knowledge of the corporation），從而觸發法定義務？","options":[{"value":"A","label":"只有在該消息被全體股東在股東大會以 100% 投票贊成時"},{"value":"B","label":"該法團的高級人員（Officer）在履行其高級人員職責的過程中已經獲知、或理應合理獲知該消息；且一名以該法團高級人員身分行事的合理人士，會認為該資料屬內幕消息"},{"value":"C","label":"只要公司的普通行政助理知悉，不論其職責為何，即自動推推定為公司知悉"},{"value":"D","label":"必須由證監會親自發函通知上市公司董事會確認知悉"}],"answer":"B","explanation":"指南 1-24 至 1-25 頁 3.35 節引述 SFO s. 307B(2)：當法團的高級人員（董事、經理或秘書）在履職過程中已知悉或理應合理獲知該消息，且一名合理人士以高級人員身分會視其為內幕消息時，即視為法團知悉，法團須在合理切實可行下盡快向公眾披露。","reference":"SFO s.307B(2); HKSI Paper 5 Guide Topic 1 Section 3.35"},{"id":"T1-074","topic":"Topic 1","subtopic":"SFO Part XIVA - Definition of Officer","difficulty":"Level 2","question":"在 SFO 第 XIVA 部內幕消息披露義務架構下，法團的「高級人員」（Officer）包括董事、秘書及「經理」（Manager）。此處「經理」的法定定義是指：","options":[{"value":"A","label":"公司內部任何佩戴經理工作胸牌的基層僱員"},{"value":"B","label":"直接受董事會管轄、對該法團的整體或相當大部分承擔管理責任的人士"},{"value":"C","label":"任何分行門市的日常店長"},{"value":"D","label":"外判清潔或保安服務團隊的現場主管"}],"answer":"B","explanation":"指南 1-25 頁 3.35 節註釋 2 明確指出：在 SFO 下，「經理」（Manager）是指處於董事會直接管轄之下（Under the immediate authority of the board），並對法團的整體或相當大部分（A substantial part）具有管理責任的人士，非指一般基層主管。","reference":"SFO s.307B; HKSI Paper 5 Guide Topic 1 Section 3.35 Note 2"},{"id":"T1-075","topic":"Topic 1","subtopic":"SFO Part XIVA - MMT Civil Fines","difficulty":"Level 2","question":"根據 SFO 第 307N 條，當市場失當行為審裁處（MMT）裁定某上市公司或其董事違反了法定內幕消息披露義務時，MMT 有權對該公司、其董事或最高行政人員判處最高達多少金額的監管民事罰款（Regulatory fine）？","options":[{"value":"A","label":"最高 100 萬港元"},{"value":"B","label":"最高 800 萬港元"},{"value":"C","label":"最高 5,000 萬港元"},{"value":"D","label":"無上限，但不得少於公司總市值的 50%"}],"answer":"B","explanation":"指南 1-26 頁 3.39 節及 SFO s. 307N 指出：MMT 有權就違反 Part XIVA 內幕消息法定披露責任者處以一系列命令，其中包括對上市公司及其董事或最高行政人員施加最高達 800 萬港元（HK$8 million）的法定民事罰款。","reference":"SFO s.307N; HKSI Paper 5 Guide Topic 1 Section 3.39"},{"id":"T1-076","topic":"Topic 1","subtopic":"GDII - Non-Executive Directors Liability","difficulty":"Level 3","question":"根據證監會《內幕消息披露指引》（GDII），關於非執行董事（NEDs）在公司違反法定披露義務時的法律責任承擔，下列敘述何者最準確？","options":[{"value":"A","label":"非執行董事承擔絕對嚴格責任，只要公司違法，非執董一律自動被取消董事資格 5 年"},{"value":"B","label":"若公司已落實合理的內部監控措施，非執董出於真誠行事、遵守其受託責任，且對該未披露消息並無實質知悉亦未參與違規，則不太可能因故意、罔顧或疏忽而被追究個人責任"},{"value":"C","label":"非執行董事享有法定的全免責任特權，任何證券法例均不得追究其責任"},{"value":"D","label":"非執董只有在親自召開記者發布會時才需負法律責任"}],"answer":"B","explanation":"指南 1-27 至 1-28 頁 3.47–3.48 節指明：非執行董事通常不參與日常營運，須依賴公司內部監控及匯報程序。若法團已落實預防違規的合理措施，出於真誠且履行受託責任、在無實質知悉或無參與違規的非執董，一般不會被認定為因故意、罔顧或疏忽而承擔個人責任。","reference":"GDII; HKSI Paper 5 Guide Topic 1 Section 3.47-3.48"},{"id":"T1-077","topic":"Topic 1","subtopic":"GDII - Obligation to Respond to Market Rumours","difficulty":"Level 2","question":"根據 GDII，上市公司對於純粹市場猜測、傳媒傳聞或第三方分析師研究報告（且內容並非真實），在法律上一般負有何種義務？","options":[{"value":"A","label":"發行人負有法定持續監察責任，必須每天聘請公關團隊監控全網分析師報告並逐一發表反駁澄清"},{"value":"B","label":"發行人一般而言並無義務回應帶有虛假或不實資訊的傳媒猜測、市場傳聞或分析師報告；但若公司正依賴安全港隱瞞真實內幕消息，而市場出現具體且準確的傳聞，則表明保密已失效，必須作出披露"},{"value":"C","label":"發行人必須在收到分析師報告後 1 小時內向聯交所申請永久停牌"},{"value":"D","label":"只要有任何傳聞，發行人即必須無條件賠償所有受影響投資者"}],"answer":"B","explanation":"指南 1-28 至 1-29 頁 3.51–3.52 節說明：一般情況下，公司無義務回應不實的傳媒猜測或傳聞，亦無義務追蹤分析師報告。然而，若公司正依賴安全港暫緩披露內幕消息，而市場出現廣泛且具體傳聞且與事實高度相符時，即代表機密外洩，安全港失效，必須立即公開發布公告澄清。","reference":"GDII; HKSI Paper 5 Guide Topic 1 Section 3.51-3.52"},{"id":"T1-078","topic":"Topic 1","subtopic":"Market Misconduct - Price Rigging (s. 275/296)","difficulty":"Level 2","question":"根據 SFO 第 275 條及第 296 條，「影響價格/交投造市」（Price Rigging）這項市場失當行為的核心定義是：","options":[{"value":"A","label":"在市場上透過不涉及實益擁有權變更的交易，或透過虛構買賣維持、人為抬高或壓低在認可市場交易的證券價格"},{"value":"B","label":"合法做市商在正常開市前發布雙向報價"},{"value":"C","label":"上市公司依法按一般性授權向全體股東按比例配售新股"},{"value":"D","label":"機構投資者一次性大額減持已解除禁售期的老股"}],"answer":"A","explanation":"指南 1-20 頁 3.16 節引述 SFO ss. 275, 296，「影響價格/交投造市」（Price Rigging）是指進行不涉及所有權實質轉變的買賣，或透過任何虛構或牽強的手段，維持、提高、壓低或導致證券或期貨價格出現異常波動的市場失當行為。","reference":"SFO ss. 275, 296; HKSI Paper 5 Guide Topic 1 Section 3.16"},{"id":"T1-079","topic":"Topic 1","subtopic":"Market Misconduct - Criminal Penalties under Part XIV","difficulty":"Level 2","question":"若某人因嚴重從事內幕交易或市場操縱，被律政司在法院依循刑事途徑起訴定罪（SFO 第 XIV 部），法院可判處的最高法定刑罰為：","options":[{"value":"A","label":"監禁 1 年及罰款 10 萬港元"},{"value":"B","label":"監禁最高達 10 年，及罰款最高達 1,000 萬港元"},{"value":"C","label":"監禁 3 年及沒收全部家族資產"},{"value":"D","label":"終身監禁及無限額罰款"}],"answer":"B","explanation":"依據 SFO Part XIV（例如 s.303 等法定刑事制裁條文），經公訴程序定罪的市場失當刑事罪行，最高刑罰為監禁 10 年（Imprisonment for up to 10 years）及罰款 1,000 萬港元（Fine of up to HK$10 million）。","reference":"SFO Part XIV; HKSI Paper 5 Guide Topic 1 Section 3.17"},{"id":"T1-080","topic":"Topic 1","subtopic":"SFO Part XV - Disclosure of Interests by Directors vs Substantial Shareholders","difficulty":"Level 3","question":"在 SFO 第 XV 部權益披露架構下，上市公司的「董事及最高行政人員」與「一般大股東」在法定申報要求上的重大差異在於：","options":[{"value":"A","label":"大股東必須披露所有持股，董事只有在持股達到 10% 時才須披露"},{"value":"B","label":"董事及最高行政人員沒有最低披露門檻限制（必須披露其持有的全部股份及相關衍生工具權益，不論比例多小）；而一般其他人士僅在持股達到 5% 門檻時方產生披露義務"},{"value":"C","label":"董事無須申報淡倉（Short positions），只有一般股東需要申報淡倉"},{"value":"D","label":"兩者申報門檻完全一致，均以 25% 為法定起點"}],"answer":"B","explanation":"指南 1-23 至 1-24 頁 3.30 節明確指出核心規則：(a) 董事及最高行政人員必須披露其「全部權益」（All interests，無任何百分比門檻限制）；(b) 其他人士（大股東）則僅在其持有的有表決權股份達到 5% 或以上時才負有法定披露義務。","reference":"SFO Part XV; HKSI Paper 5 Guide Topic 1 Section 3.30"},{"id":"T1-081","topic":"Topic 1","subtopic":"SFO Part XV - Meaning of Interest","difficulty":"Level 2","question":"在 SFO 第 XV 部下，關於何謂「股份權益」（Interest in shares），下列哪一項理解是正確的？","options":[{"value":"A","label":"僅限於以本人真實姓名登記於股東名冊上的實體現貨好倉股份"},{"value":"B","label":"涵義極廣，包括好倉（Long position）及淡倉（Short position，不進行淨額結算對沖）、股本衍生工具（不論實物或現金結算），以及透過信託、受控法團或家族安排被歸屬的權益"},{"value":"C","label":"任何透過非上市期權合約持有的衍生工具均法定豁免計算"},{"value":"D","label":"好倉與淡倉可以自由相抵，僅申報相抵後的淨額即可"}],"answer":"B","explanation":"指南 1-24 頁 3.31 節指出：「權益」涵義極其廣泛，包括好倉與淡倉（兩者不得進行淨額抵銷，須分開計算及申報）、衍生工具（無論現金或實物結算）、以及透過家族、信託、控權法團架構歸屬的相聯權益。","reference":"SFO Part XV; HKSI Paper 5 Guide Topic 1 Section 3.31"},{"id":"T1-082","topic":"Topic 1","subtopic":"SFO Part XV - Notification Timelines","difficulty":"Level 2","question":"根據 SFO 第 XV 部，當一名已持有 6.2% 股份的大股東在市場增持股份使其持股百分比跨越至 7.1%（跨越整數百分點）時，該股東必須在何時向上市公司及聯交所呈交申報？","options":[{"value":"A","label":"相關事件發生後的 3 個營業日（Business days）內"},{"value":"B","label":"相關交易日後的 10 個日曆日內"},{"value":"C","label":"在公司下一個財政年度結束後 30 天內"},{"value":"D","label":"只要在股東週年大會召開前口頭通知即可"}],"answer":"A","explanation":"指南 1-24 頁 3.33 節指出：權益披露通知必須於規定期限內發出，一般相關事件發生後的申報期限為 3 個營業日內（Three business days after the relevant event）。（註：10 個營業日僅適用於極少數因法例首次實施或新納入規管時的初次申報場景）。","reference":"SFO Part XV; HKSI Paper 5 Guide Topic 1 Section 3.33"},{"id":"T1-083","topic":"Topic 1","subtopic":"CFA Code - Conflicts of Interest Mandate Withdrawal","difficulty":"Level 3","question":"根據《機構融資顧問操守準則》（CFA Code）第 4 段，當機構融資顧問與客戶之間存在重大利益衝突，且該衝突無法透過客戶在知情情況下給予同意（Informed consent）予以妥善解決時，該顧問應採取何種行動？","options":[{"value":"A","label":"直接將顧問費提升至市價的三倍以對沖合規風險"},{"value":"B","label":"不應接受該項委聘，或從現有委聘中正式退出（Withdraw from or not take on a mandate）"},{"value":"C","label":"只要全體董事私下簽訂免責承諾書，即可無視該衝突繼續執業"},{"value":"D","label":"向聯交所支付特別豁免規費以尋求免責"}],"answer":"B","explanation":"指南 1-32 頁 4.11 節明確要求：機構融資顧問應採取一切合理步驟避免利益衝突，且不得將自身利益置於客戶之上；若存在無法透過客戶在充分知情下同意而解決的實質利益衝突，顧問必須拒絕接受或撤出該項委聘。","reference":"CFA Code para 4; HKSI Paper 5 Guide Topic 1 Section 4.11"},{"id":"T1-084","topic":"Topic 1","subtopic":"CFA Code - Gifts and Inducements","difficulty":"Level 1","question":"根據 CFA Code 第 4.15 段，關於機構融資顧問及其僱員在業務往來中提供或收受餽贈及利益，下列規定何者正確？","options":[{"value":"A","label":"可以在不作任何申報的情況下，私下接受客戶贈送的價值 100 萬港元私人遊艇"},{"value":"B","label":"未經適當披露，不得就客戶業務提供或收受誘因（Inducements），且公司必須就餽贈訂立書面政策及程序"},{"value":"C","label":"任何價值的禮物均自動構成洗錢罪行"},{"value":"D","label":"顧問公司嚴禁向員工派發任何年終獎金"}],"answer":"B","explanation":"指南 1-33 頁 4.15 節規定：機構融資顧問在未經適當披露的情況下，不得就客戶業務提供或接受誘因，並應具備關於餽贈與款待的書面政策與程序（Written policies and procedures regarding gifts）。","reference":"CFA Code para 4.15; HKSI Paper 5 Guide Topic 1 Section 4.15"},{"id":"T1-085","topic":"Topic 1","subtopic":"CFA Code - Terms of Engagement in Writing","difficulty":"Level 2","question":"根據 CFA Code 第 5 段，關於機構融資顧問與客戶簽訂委聘條款（Terms of engagement），守則的法律性質與指引要求是：","options":[{"value":"A","label":"以書面形式記錄委聘條款屬於守則所「鼓勵」（Encouraged）的最佳常規，而非絕對法定強制條文"},{"value":"B","label":"若未在香港律政司律師見證下簽約，該聘用條款自動無效並構成刑事罪行"},{"value":"C","label":"嚴禁以書面形式記載任何收費條款"},{"value":"D","label":"委聘條款必須事先送交立法會財務委員會備案"}],"answer":"A","explanation":"指南 1-33 頁 4.17 節明確指明：CFA Code 鼓勵（Encouraged）機構融資顧問以書面形式與客戶記錄其委聘條款（注意：指南特別註明這是一項鼓勵性常規，非強制性法定要件）。","reference":"CFA Code para 5; HKSI Paper 5 Guide Topic 1 Section 4.17"},{"id":"T1-086","topic":"Topic 1","subtopic":"CFA Code - Reliance on Experts","difficulty":"Level 3","question":"機構融資顧問在編制通函過程中，高度依賴獨立物業估值師對目標資產出具的估值報告。根據 CFA Code 第 5 段，該融資顧問負有何種審查職責？","options":[{"value":"A","label":"顧問對專家報告承擔絕對替代責任，若專家計錯數，顧問即被推定為詐騙犯"},{"value":"B","label":"顧問應進行合理審查（Reasonable checks），以評估該專家機構的相關經驗、資格及專業能力"},{"value":"C","label":"顧問完全無須進行任何背景查核，可全盤盲目採信"},{"value":"D","label":"顧問必須親自重新測量所有物業的每寸實際面積"}],"answer":"B","explanation":"指南 1-33 頁 4.18 節指明：當機構融資顧問依賴專家或其他專業人士的工作時，應採取合理的查核步驟（Reasonable checks），以評估該機構的相關經驗與專業知識水平，確保依賴基礎具備合理性。","reference":"CFA Code para 5; HKSI Paper 5 Guide Topic 1 Section 4.18"},{"id":"T1-087","topic":"Topic 1","subtopic":"CFA Code - Cooperation with Listing Sponsor","difficulty":"Level 2","question":"某持牌法團在一宗主板 IPO 項目中僅擔任上市申請人的財務顧問（Financial Adviser），而另一家法團擔任保薦人（Sponsor）。根據 CFA Code 第 4.19 段，該財務顧問應當：","options":[{"value":"A","label":"故意拒絕向保薦人提供任何公司底稿以阻撓其盡調"},{"value":"B","label":"就上市申請事宜與保薦人全面合作，且不得以任何不合理或不利的方式阻礙保薦人履行其法定職責"},{"value":"C","label":"直接代替保薦人向聯交所簽署保薦人聲明（Form E）"},{"value":"D","label":"要求申請人立即解僱保薦人以節省費用"}],"answer":"B","explanation":"指南 1-33 頁 4.19 節明確指出：擔任上市申請人財務顧問的機構融資顧問，應就上市申請與發行人的保薦人全面合作，不得以任何會不合理或不利影響保薦人履行其職責的方式行事。","reference":"CFA Code para 4.19; HKSI Paper 5 Guide Topic 1 Section 4.19"},{"id":"T1-088","topic":"Topic 1","subtopic":"CFA Code - Additional Competence for Specialised Roles","difficulty":"Level 2","question":"根據證監會《勝任能力的指引》及指南規定，機構融資顧問在從事下列哪些特定專業角色時，必須符合附帶的「額外勝任能力要求」（Additional competence requirements）？","options":[{"value":"A","label":"僅限於為海外投資者提供零售外匯經紀諮詢服務"},{"value":"B","label":"(i) 擔任上市保薦人（Sponsor）及合規顧問（Compliance Adviser）；或 (ii) 就受《收購守則》或《股份回購守則》約束的事宜或交易提供意見"},{"value":"C","label":"為一般法團開設銀行支票戶口"},{"value":"D","label":"擔任上市公司年報排版與印刷工作"}],"answer":"B","explanation":"指南 1-32 頁 4.10 註釋及 1-38 頁 4.45 節指明：機構融資顧問若擬從事 (a) 保薦人及合規顧問工作，或 (b) 涉及《收購守則》及《股份回購守則》的交易諮詢，均須符合《勝任能力的指引》附錄 A 或附錄 B 的額外資格與持續專業培訓要求。","reference":"SFC Guidelines on Competence Appendices A & B; HKSI Paper 5 Guide Topic 1 Section 4.45"},{"id":"T1-089","topic":"Topic 1","subtopic":"Takeovers Code - Economic Test for Public Companies","difficulty":"Level 3","question":"《收購守則》適用於香港的「公眾公司」（Public companies in Hong Kong）。證監會收購執行人員在判定某未上市或非香港註冊公司是否屬於香港公眾公司時，會採用經濟或商業驗證標準，該標準主要考慮以下哪些因素？","options":[{"value":"A","label":"公司註冊資本是否全部由比特幣出資"},{"value":"B","label":"香港股東的數目、在香港的股份交易活躍度、總辦事處與中央管理處所在地、業務及資產所在地，以及海外法例是否提供對等保障"},{"value":"C","label":"公司全體董事是否具備香港永久居民身份證"},{"value":"D","label":"公司是否每年向香港公益金捐款超過 100 萬港元"}],"answer":"B","explanation":"指南 1-38 頁 4.42 節及 3-5 頁 2.2 節列出執行人員採用的經濟測試五大要素：(a) 香港股東人數；(b) 在香港的股份交易程度；(c) 總辦事處及中央管理中心所在；(d) 業務和資產所在地（包括稅務地位）；及 (e) 海外司法管轄區對股東的保障存在與否。","reference":"Takeovers Code Introduction; HKSI Paper 5 Guide Topic 1 Section 4.42; Topic 3 Section 2.2"},{"id":"T1-090","topic":"Topic 1","subtopic":"Takeovers Code - Exemption for Overseas Primary Listed Issuers","difficulty":"Level 2","question":"對於主要上市地位在海外交易所（如主要上市在納斯達克），僅在香港聯交所作第二上市的海外發行人，證監會執行人員就《股份回購守則》通常採取何種監管態度？","options":[{"value":"A","label":"強制要求該海外公司必須依據香港《公司條例》重組全部股本"},{"value":"B","label":"只要香港股東能獲得足夠保障，執行人員通常會批出豁免（Waiver），免除其受《股份回購守則》約束"},{"value":"C","label":"嚴禁該海外公司在全球任何市場進行任何股份回購"},{"value":"D","label":"直接命令聯交所終止其第二上市地位"}],"answer":"B","explanation":"指南 1-37 至 1-38 頁 4.41 節及 3-5 頁 2.1 節指明：對於主要上市地位在海外的企業，只要香港股東權益獲得充分保障，執行人員通常會發出豁免令，豁免其遵從《股份回購守則》的規定。","reference":"Share Buy-backs Code Introduction; HKSI Paper 5 Guide Topic 1 Section 4.41; Topic 3 Section 2.1"},{"id":"T1-091","topic":"Topic 1","subtopic":"Code of Conduct - Sponsor Overall Manager Duty","difficulty":"Level 3","question":"根據證監會《操守準則》第 17 段，保薦人在新股公開發售（Public offer）過程中擔任整體管理人（Overall manager）時，其核心職責包括：","options":[{"value":"A","label":"私下向機構好友分配未公開的零散股權以鎖定利潤"},{"value":"B","label":"確保新股公開發售以公平、有序的方式進行，並設有合理機制防範重複申請認購（Multiple applications）"},{"value":"C","label":"允許投資者以虛假身份開立證券戶口認購新股"},{"value":"D","label":"保證所有申請認購的散戶均能 100% 獲配一手股份"}],"answer":"B","explanation":"指南 1-39 頁 4.48(h) 節及 2-72 頁 10.10–10.11 節指出：保薦人須作為公開發售的整體管理人，確保公開發售在公平有序下進行，建立辨識及防止重複申請（Multiple applications）的機制，並確保股份分配公正公平。","reference":"Code of Conduct para 17; HKSI Paper 5 Guide Topic 1 Section 4.48(h); Topic 2 Section 10.10"},{"id":"T1-092","topic":"Topic 1","subtopic":"Code of Conduct - Research Analysts Pre-Deal Information","difficulty":"Level 3","question":"根據證監會《操守準則》第 17.11 段，保薦人在處理擬上市公司的發行前研究報告時，負有下列哪項嚴格合規責任？","options":[{"value":"A","label":"保薦人必須向承銷商所屬的研究分析員提早透露招股章程尚未披露的內幕重大財務預測數據"},{"value":"B","label":"採取合理步驟，確保分析員不會獲取未載於上市文件中的任何重大非公開資料（Material information not disclosed in the listing document）"},{"value":"C","label":"允許分析員自由發表未經合規審批的買入評級"},{"value":"D","label":"禁止任何分析員撰寫任何行業研究報告"}],"answer":"B","explanation":"指南 1-40 頁 4.48(i) 節明確規定：保薦人必須採取合理措施，確保分析員不會獲取上市文件未有披露的重大資料（Prevent selective disclosure of material information），以維護市場資訊披露的公平對等。","reference":"Code of Conduct para 17.11; HKSI Paper 5 Guide Topic 1 Section 4.48(i)"},{"id":"T1-093","topic":"Topic 1","subtopic":"Internal Control Guidelines - Management Oversight","difficulty":"Level 2","question":"根據證監會《管理、監督及內部監控指引》（Internal Control Guidelines），持牌機構融資顧問在組織結構層面必須嚴格執行的核心監控原則是：","options":[{"value":"A","label":"權責完全集中於行政總裁一人，以減少溝通成本"},{"value":"B","label":"職責與功能劃分（Segregation of duties and functions），例如將業務承攬與合規審核、自營交易與機構諮詢在實體及匯報線上清晰隔離"},{"value":"C","label":"嚴禁設立任何內部審計或風控部門"},{"value":"D","label":"所有合規文檔在歸檔滿 3 個月後必須立即銷毀"}],"answer":"B","explanation":"指南 1-40 頁 4.50 節指明：《內部監控指引》涵蓋八大關鍵領域：管理與監督、職責劃分（Segregation of duties）、人員與培訓、資訊管理、合規、內部審計、運作控制及風險管理，旨在確保有效的內部制衡。","reference":"SFC Internal Control Guidelines; HKSI Paper 5 Guide Topic 1 Section 4.50"},{"id":"T1-094","topic":"Topic 1","subtopic":"Companies Ordinance - Compromise and Arrangement (s. 674)","difficulty":"Level 2","question":"根據香港《公司條例》（CO, Cap. 622）第 674 條，一間香港公司若擬與其債權人或成員進行債務妥協或重組安排（Compromise or Arrangement，常用於私有化或架構重組），其法定法定表決通過門檻為：","options":[{"value":"A","label":"出席會議並投票的債權人或成員過半數贊成，且代表其價值至少 50%"},{"value":"B","label":"出席會議並投票的債權人或成員價值四分之三（75% in value）的贊成，並獲得香港法院的認可裁定（Sanctioned by the court）"},{"value":"C","label":"全體股東 100% 人頭一致同意，毋須法院參與"},{"value":"D","label":"僅需公司董事長個人單獨簽字"}],"answer":"B","explanation":"指南 1-30 頁 3.63 節及 2-35 頁 7.33 節指出：根據《公司條例》s. 674，安排計劃（Scheme of arrangement）必須獲得出席大會並投票的債權人或股東在價值上四分之三（75% in value）贊成，且須獲得香港法院認可裁決方為有效。","reference":"Companies Ordinance s.674; HKSI Paper 5 Guide Topic 1 Section 3.63"},{"id":"T1-095","topic":"Topic 1","subtopic":"Companies Ordinance - Alteration of Articles of Association","difficulty":"Level 1","question":"根據香港《公司條例》第 88 條，一間香港註冊成立的公司修改其《組織章程細則》（Articles of Association），法定必須通過何種決議案？","options":[{"value":"A","label":"普通決議案（Ordinary resolution，50% 贊成）"},{"value":"B","label":"特別決議案（Special resolution，至少 75% 贊成）"},{"value":"C","label":"董事會一致通過決議案（無須股東大會）"},{"value":"D","label":"全體債權人特別決議案"}],"answer":"B","explanation":"指南 1-30 頁 3.64 節明確規定：在符合公司條例 s. 88 及章程規限下，公司修改或增加其組織章程細則，必須透過通過「特別決議案」（Special resolution，即至少 75% 表決權贊成）進行。","reference":"Companies Ordinance s.88; HKSI Paper 5 Guide Topic 1 Section 3.64"},{"id":"T1-096","topic":"Topic 1","subtopic":"Market Misconduct - Disclosure of Information about Prohibited Transactions","difficulty":"Level 2","question":"根據 SFO 第 276 條及第 297 條，「披露關於附帶受禁交易的資料」（Disclosure of information about prohibited transactions）構成市場失當行為的情形是：","options":[{"value":"A","label":"任何人披露、傳播或散布某證券的價格將會因某項受禁交易（如操縱行為）而受到影響的資訊，且該人或其聯繫人直接或間接因散布該消息而獲得或期望獲得利益"},{"value":"B","label":"上市公司依據法定要求及時披露關連交易"},{"value":"C","label":"財經新聞記者客觀引述警方發布的通緝令"},{"value":"D","label":"保薦人向聯交所如實遞交盡職調查底稿"}],"answer":"A","explanation":"指南 1-20 頁 3.16 節引述 SFO ss. 276, 297：凡有人傳播或宣傳某上市證券價格因特定違法受禁交易（例如有人造市炒作）而上升或下降，並從披露或推廣該違規資訊中直接或間接謀取利益或佣金，即屬法定市場失當行為。","reference":"SFO ss. 276, 297; HKSI Paper 5 Guide Topic 1 Section 3.16"},{"id":"T1-097","topic":"Topic 1","subtopic":"CFA Code - Best Interests of Clients","difficulty":"Level 2","question":"根據 CFA Code 第 6 段，機構融資顧問在對待客戶的職責上，應在任何時候均：","options":[{"value":"A","label":"以最大化顧問自身短期佣金收入為絕對最優先目標"},{"value":"B","label":"在任何時候均以客戶的最佳利益行事（Act in the best interests of its clients at all times），深入瞭解客戶業務並獲取必要背景資料"},{"value":"C","label":"代客戶簽署客戶未曾審閱過的股份認購保證合約"},{"value":"D","label":"在未經客戶知情同意下將客戶重大商業機密出售予競爭對手"}],"answer":"B","explanation":"指南 1-34 頁 4.21 節指明：機構融資顧問在任何時候都必須以客戶的最佳利益行事（Act in the best interests of clients at all times），且必須透徹理解客戶的業務營運情況與特定需求。","reference":"CFA Code para 6; HKSI Paper 5 Guide Topic 1 Section 4.21"},{"id":"T1-098","topic":"Topic 1","subtopic":"CFA Code - Confidentiality & Accidental Leak Prevention","difficulty":"Level 3","question":"某機構融資顧問在處理一宗極敏感的上市公司收購項目。根據 CFA Code 第 4.23(e) 段，該顧問在維護客戶資料保密性方面承擔何種具體義務？","options":[{"value":"A","label":"只要該資訊尚未被證監會定性為內幕消息，顧問即可在私人飯局上作為談資分享"},{"value":"B","label":"妥善保護客戶機密資料，並採取合理步驟確保從顧問處接收到該機密資料的其他第三方（如財經印刷商、公關顧問）亦能有效防範機密意外洩漏"},{"value":"C","label":"顧問無須對外判第三方的洩密承擔任何監督與防範預防責任"},{"value":"D","label":"保密責任在項目簽約後 24 小時內自動終止"}],"answer":"B","explanation":"指南 1-34 頁 4.23(e) 節指明：顧問除自身須嚴守客戶機密外，還須採取合理步驟確保獲傳遞機密資料的其他人士（如外部印刷商、翻譯人員等）採取適當措施以防範意外洩漏資訊（Avoid an accidental leak of information）。","reference":"CFA Code para 4.23(e); HKSI Paper 5 Guide Topic 1 Section 4.23(e)"},{"id":"T1-099","topic":"Topic 1","subtopic":"CFA Code - Early Consultation with Regulators","difficulty":"Level 1","question":"根據 CFA Code 第 7.25 段，當一項複雜的機構融資交易方案在法規詮釋或合規層面存在罕見或具爭議性的監管問題時，該顧問應當：","options":[{"value":"A","label":"先斬後奏，待完成交易公佈後再與監管機構周旋"},{"value":"B","label":"受到鼓勵在項目的早期階段（At an early stage）主動向監管機構諮詢以尋求指導"},{"value":"C","label":"故意隱匿該爭議問題直至招股章程印刷出廠"},{"value":"D","label":"立即解僱全體內部法務人員"}],"answer":"B","explanation":"指南 1-34 頁 4.25 節明確規定：當交易中出現複雜監管問題時，CFA 操守準則鼓勵機構融資顧問在早期階段（At an early stage）諮詢監管機構（證監會/聯交所）以尋求明確指引。","reference":"CFA Code para 7.25; HKSI Paper 5 Guide Topic 1 Section 4.25"},{"id":"T1-100","topic":"Topic 1","subtopic":"SFC Regulatory Structure - Summary of Five Divisions","difficulty":"Level 2","question":"證監會（SFC）內部設有五個主要業務分科。下列哪一個分科在一般情況下**最少**直接與從事機構融資顧問業務的第 6 類持牌中介人打交道？","options":[{"value":"A","label":"企業融資部（Corporate Finance Division）"},{"value":"B","label":"中介機構部（Intermediaries Division）"},{"value":"C","label":"法規執行部（Enforcement Division）"},{"value":"D","label":"投資產品部（Investment Products Division）"}],"answer":"D","explanation":"指南 1-6 至 1-7 頁 1.8 及 1.15(b) 節指明：第 6 類持牌人日常最核心接觸企業融資部，發牌與監管對接中介機構部，違規調查對接法規執行部；而「投資產品部」主要負責授權及監管零售投資產品（如單位信託、互惠基金、ETF 等），極少直接與純機構融資顧問發生日常交互。","reference":"HKSI Paper 5 Guide Topic 1 Section 1.8, 1.15"}];
let quiz=[],idx=0,score=0,skipped=0,submitted=false,lastConfig={},currentUser=null,attemptId=null,attemptStartedAt=null,libraryFilter='done',questionPool=[];
const RECORD_KEY='hksi_paper5_records_v2', WRONG_KEY='hksi_paper5_wrong_v2', MARKED_KEY='hksi_paper5_marked_v1', DONE_KEY='hksi_paper5_done_v1', PROFILE_KEY='hksi_quiz_profile_v1';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function getLocalRecords(){try{return JSON.parse(localStorage.getItem(RECORD_KEY)||'[]')}catch(e){return[]}}
function saveLocalRecords(a){localStorage.setItem(RECORD_KEY,JSON.stringify(a.slice(0,50)))}
function getLocalWrongIds(){try{return JSON.parse(localStorage.getItem(WRONG_KEY)||'[]')}catch(e){return[]}}
function saveLocalWrongIds(a){localStorage.setItem(WRONG_KEY,JSON.stringify([...new Set(a)]))}
function localAddWrong(id){let a=getLocalWrongIds();if(!a.includes(id))a.push(id);saveLocalWrongIds(a)}
function localRemoveWrong(id){saveLocalWrongIds(getLocalWrongIds().filter(x=>x!==id))}
function getLocalIds(key){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch(e){return[]}}
function saveLocalIds(key,a){localStorage.setItem(key,JSON.stringify([...new Set(a)]))}
