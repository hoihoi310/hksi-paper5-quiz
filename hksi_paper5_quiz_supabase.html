ide Topic 2 Section 9.33"},{"id":"T2-073","topic":"Topic 2","subtopic":"Specialist Technology Companies - Minimum Market Capitalisation","difficulty":"Level 2","question":"根據第 18C 章，商業化公司與未商業化公司在上市時的最低預期市值門檻分別為：","options":[{"value":"A","label":"商業化公司至少 10 億港元；未商業化公司至少 20 億港元"},{"value":"B","label":"商業化公司至少 40 億港元；未商業化公司至少 80 億港元（HK$4 billion vs HK$8 billion）"},{"value":"C","label":"商業化公司至少 50 億港元；未商業化公司至少 100 億港元"},{"value":"D","label":"商業化公司至少 20 億港元；未商業化公司至少 40 億港元"}],"answer":"B","explanation":"指南 2-55 頁 9.34 節及 MBLR 18C.03 規定上市最低市值要求為：商業化公司至少 40 億港元；未商業化公司至少 80 億港元。","reference":"MBLR 18C.03; HKSI Paper 5 Guide Topic 2 Section 9.34"},{"id":"T2-074","topic":"Topic 2","subtopic":"Specialist Technology Companies - R&D Track Record Period","difficulty":"Level 2","question":"申請依據第 18C 章上市的特專科技公司，必須在大致相同的管理層管治下，營運並持續從事特專科技產品的研發至少達幾年？","options":[{"value":"A","label":"至少 1 個財政年度"},{"value":"B","label":"至少 2 個財政年度"},{"value":"C","label":"至少 3 個財政年度（At least three financial years prior to listing）"},{"value":"D","label":"至少 5 個財政年度"}],"answer":"C","explanation":"指南 2-55 頁 9.31 節及 MBLR 18C.04 指明：特專科技公司必須在上市前至少三個財政年度（At least 3 financial years）維持大致相同的管理層營運，並持續致力於特專科技產品的研發（特殊情況下聯交所可接納兩年）。","reference":"MBLR 18C.04; HKSI Paper 5 Guide Topic 2 Section 9.31"},{"id":"T2-075","topic":"Topic 2","subtopic":"Specialist Technology Companies - Working Capital (125%)","difficulty":"Level 2","question":"第 18C 章下的「未商業化公司」（Pre-Commercial Company）在營運資金（Working Capital）方面必須證明具備：","options":[{"value":"A","label":"足以應付上市文件刊發後 6 個月成本的 100% 資金"},{"value":"B","label":"足以應付自上市文件刊發之日起計至少 12 個月內集團成本至少 125% 的充足營運資金（Sufficient working capital to cover at least 125% of its group's costs for at least 12 months）"},{"value":"C","label":"足以應付 3 年研發支出的定期存款"},{"value":"D","label":"無任何營運資金要求"}],"answer":"B","explanation":"指南 2-55 頁 9.35(b) 節及 MBLR 18C.05 規定：未商業化特專科技公司必須證明其具備充足營運資金，足以涵蓋自上市文件刊發起至少 12 個月內集團成本的至少 125%。","reference":"MBLR 18C.05; HKSI Paper 5 Guide Topic 2 Section 9.35(b)"},{"id":"T2-076","topic":"Topic 2","subtopic":"Specialist Technology Companies - Independent Price Setting Investors","difficulty":"Level 3","question":"根據主板第 18C 章對 IPO 股份發售結構的規定，特專科技公司在公開發售與配售的分配上，必須確保：","options":[{"value":"A","label":"發售股份的 100% 必須強制配售予發起人集團"},{"value":"B","label":"至少 50% 的 IPO 發售股份必須配售予「獨立定價投資者」（Independent price setting investors），且公開認購部分不得少於 5%"},{"value":"C","label":"散戶公開認購部分必須強制達到 50%"},{"value":"D","label":"完全不得進行任何機構簿記建檔"}],"answer":"B","explanation":"指南 2-55 頁 9.36 節及 MBLR 18C.15 規定：STC 的 IPO 配售中，至少 50% 發售股份必須分配予合資格獨立定價投資者（Independent price setting investors），且公開認購檔份至少佔 5%。","reference":"MBLR 18C.15; HKSI Paper 5 Guide Topic 2 Section 9.36"},{"id":"T2-077","topic":"Topic 2","subtopic":"Pre-Commercial STCs - Re-designation as Commercial","difficulty":"Level 2","question":"一間依據第 18C 章上市的未商業化特專科技公司，在上市後若擬申請轉為「商業化公司」（Commercial Company）以解除額外業務限制，其必須向聯交所證明：","options":[{"value":"A","label":"公司股價已較發行價上漲 200%"},{"value":"B","label":"其在最近一個財政年度已達成商業化公司的收益門檻（2.5 億港元），或符合主板常規財務測試之一（如盈利測試或市值/收益測試）"},{"value":"C","label":"公司全體董事更換為香港註冊會計師"},{"value":"D","label":"已將所有專利無條件轉讓予特區政府"}],"answer":"B","explanation":"指南 2-56 頁 9.38 節及 MBLR 18C.23 指出：未商業化公司可向聯交所申請轉為商業化公司，只要證明其 (i) 達到了商業化公司的收益標準（2.5 億港元），或 (ii) 符合了一般主板上市申請人的財務測試之一。","reference":"MBLR 18C.23; HKSI Paper 5 Guide Topic 2 Section 9.38"},{"id":"T2-078","topic":"Topic 2","subtopic":"Suitability for Listing - Cash Shell Disqualification","difficulty":"Level 2","question":"根據聯交所主板第 8.04 條及相關上市指引，若新申請人的資產主要由現金或短期證券（如期限少於一年的債券或票據）組成，聯交所通常會：","options":[{"value":"A","label":"直接批准其上市，因為現金充裕代表財務健全"},{"value":"B","label":"視其為缺乏足夠實質營運業務而不適合上市（Not suitable for listing），除非申請人屬於純粹從事證券經紀業務的金融機構"},{"value":"C","label":"強制將其歸入特專科技公司類別上市"},{"value":"D","label":"命令其在 24 小時內將所有現金派發給公眾"}],"answer":"B","explanation":"指南 2-56 頁 9.40 節及 MBLR 8.04 指出：資產主要由現金或短期流動資產構成的申請人，通常被視為不適合上市（Cash company / shell），除非其主要業務本質為證券經紀業務等特殊金融行業。","reference":"MBLR 8.04, 14.82; HKSI Paper 5 Guide Topic 2 Section 9.40"},{"id":"T2-079","topic":"Topic 2","subtopic":"Management Presence in Hong Kong (MBLR 8.12)","difficulty":"Level 2","question":"根據主板上市規則第 8.12 條，尋求在香港聯交所進行主要上市的新申請人，在管理層常駐香港（Management presence）方面通常必須具備何種法定安排？","options":[{"value":"A","label":"全體非執行董事必須常駐香港"},{"value":"B","label":"必須有足夠的管理層常駐香港，通常要求至少兩名執行董事通常居於香港（Normally resident in Hong Kong），除非獲聯交所正式豁免"},{"value":"C","label":"首席技術官必須常駐香港"},{"value":"D","label":"管理層常駐地不受任何限制，完全無須豁免"}],"answer":"B","explanation":"指南 2-57 頁 9.41 節及 MBLR 8.12 規定：主要上市發行人必須維持充足的在港管理層人員，通常要求至少兩名執行董事通常居於香港（Normally resident in HK）；若業務在海外，須向聯交所申請豁免並委派適當授權代表保持即時溝通。","reference":"MBLR 8.12; HKSI Paper 5 Guide Topic 2 Section 9.41"},{"id":"T2-080","topic":"Topic 2","subtopic":"Warrants Limit - 20% Ceiling and Expiry Range","difficulty":"Level 3","question":"根據主板上市規則第 15.02 條，上市發行人若擬發行認股權證（Warrants，非員工期權計劃），在發行上限及有效期限上必須符合何種監管限制？","options":[{"value":"A","label":"總額無限制，期限不得超過 3 個月"},{"value":"B","label":"因行使該等權證而發行的股份總數不得超過發行時已發行股份（不含庫存股）的 20%，且權證的到期期限不得少於 1 年或多於 5 年（Not less than 1 or more than 5 years）"},{"value":"C","label":"權證行使股份上限為 50%，期限至少 10 年"},{"value":"D","label":"權證總額不得超過 5%，期限最長為 6 個月"}],"answer":"B","explanation":"指南 2-64 頁 9.79 節及 MBLR 15.02 規定：所有發行權證須獲聯交所批准；行權可發行股份上限為已發行股本（不計庫存股）的 20%；且權證有效期不得少於 1 年，亦不得超過 5 年。","reference":"MBLR 15.02; HKSI Paper 5 Guide Topic 2 Section 9.79"},{"id":"T2-081","topic":"Topic 2","subtopic":"Derivative Warrants - Issuer Net Asset Value Requirement","difficulty":"Level 2","question":"根據主板第 15A 章，發行非抵押衍生認股權證（Non-collateralised derivative warrants）的機構，其最低資產淨值（NAV）門檻要求為：","options":[{"value":"A","label":"不低於 1 億港元"},{"value":"B","label":"不低於 5 億港元"},{"value":"C","label":"不低於 20 億港元（Net asset value of not less than HK$2 billion），並具備良好信用評級或受金管局/證監會規管"},{"value":"D","label":"不低於 100 億港元"}],"answer":"C","explanation":"指南 2-65 頁 9.83 節及 MBLR 15A.11 指明：非抵押衍生權證的發行人，其資產淨值不得少於 20 億港元（HK$2 billion），並須具備合格信貸評級，或為受金管局或證監會規管的實體、或政府主權機構。","reference":"MBLR 15A.11; HKSI Paper 5 Guide Topic 2 Section 9.83"},{"id":"T2-082","topic":"Topic 2","subtopic":"Derivative Warrants - Underlying Shares Float Capitalisation","difficulty":"Level 2","question":"根據主板第 15A.30 條，衍生認股權證若掛鉤單一類別的香港上市股票，該相關底層股票在公眾人士手中的流通市值（Public float capitalisation）必須達到至少：","options":[{"value":"A","label":"至少 5 億港元"},{"value":"B","label":"至少 10 億港元"},{"value":"C","label":"至少 40 億港元（Public float capitalisation of at least HK$4 billion）"},{"value":"D","label":"至少 200 億港元"}],"answer":"C","explanation":"指南 2-65 頁 9.86 節及 MBLR 15A.30 規定：掛鉤單一股份的衍生權證，其底層上市股份由公眾持有的市值必須至少達到 40 億港元（HK$4 billion），以防止標的股票因市值過小而易受操縱。","reference":"MBLR 15A.30; HKSI Paper 5 Guide Topic 2 Section 9.86"},{"id":"T2-083","topic":"Topic 2","subtopic":"Derivative Warrants - Prohibition on GEM","difficulty":"Level 1","question":"關於衍生認股權證（Derivative Warrants）能否在聯交所 GEM 板塊發行與掛牌，規則的明確規定是：","options":[{"value":"A","label":"衍生權證可以在 GEM 自由發行，門檻與主板相同"},{"value":"B","label":"衍生認股權證嚴禁在 GEM 上市（Derivative warrants cannot be listed on GEM）"},{"value":"C","label":"只有獲得證監會主席特批的衍生權證方可在 GEM 上市"},{"value":"D","label":"GEM 發行人每季必須發行至少兩隻衍生權證"}],"answer":"B","explanation":"指南 2-65 頁 9.89 節明確指出：衍生認股權證不得在 GEM 上市（Derivative warrants cannot be listed on GEM），該產品專屬於主板市場結構。","reference":"GLR; HKSI Paper 5 Guide Topic 2 Section 9.89"},{"id":"T2-084","topic":"Topic 2","subtopic":"Base Listing Document Validity for Warrants","difficulty":"Level 1","question":"根據主板第 15A 章，結構性產品（如衍生認股權證及牛熊證）發行人所刊發的「基礎上市文件」（Base Listing Document），其法定有效期限為：","options":[{"value":"A","label":"3 個月"},{"value":"B","label":"6 個月"},{"value":"C","label":"12 個月（12 months）"},{"value":"D","label":"永久有效"}],"answer":"C","explanation":"指南 2-65 頁 9.87 節及 MBLR 15A 指明：發行人可刊發基礎上市文件，其有效期為 12 個月（Valid for 12 months）；在有效期內發行人可透過補充文件快速發行不同批次的結構性產品。","reference":"MBLR 15A; HKSI Paper 5 Guide Topic 2 Section 9.87"},{"id":"T2-085","topic":"Topic 2","subtopic":"Share Schemes (Chapter 17) - Shareholder Approval","difficulty":"Level 2","question":"根據主板上市規則第 17 章（股份計劃），上市發行人採納股份期權計劃（Share option scheme）或股份獎勵計劃（Share award scheme）時，必須履行何種審批手續？","options":[{"value":"A","label":"只需由行政總裁個人簽署行政命令"},{"value":"B","label":"所有股份計劃必須由股東大會批准（Approved by shareholders in general meeting），除非發行人在上市前已採納該計劃並已在招股章程中全面披露其條款"},{"value":"C","label":"必須經香港稅務局核准"},{"value":"D","label":"無須股東批准，只需由薪酬委員會書面備案"}],"answer":"B","explanation":"指南 2-66 頁 9.94 節及 MBLR 17.02 指出：所有股份計劃必須獲股東於股東大會上批准；但上市前已採納並在招股書充分披露重大條款的上市前股權激勵計劃，上市時無須再經股東大會審批。","reference":"MBLR 17.02; HKSI Paper 5 Guide Topic 2 Section 9.94"},{"id":"T2-086","topic":"Topic 2","subtopic":"Share Schemes - Blackout Period for Grants","difficulty":"Level 2","question":"根據主板上市規則第 17.05 條，上市發行人在下列哪一期間內**嚴禁**向任何合資格參與者授出任何股份期權或股份獎勵？","options":[{"value":"A","label":"在擁有未公布的內幕消息期間，或在公布年度/半年度業績前 30 天之期間內"},{"value":"B","label":"在公司股票成交量放大的營業日"},{"value":"C","label":"在每年 7 月 1 日特區成立紀念日"},{"value":"D","label":"在全體董事領取年終花紅當日"}],"answer":"A","explanation":"指南 2-67 頁 9.96 節及 MBLR 17.05 規定：發行人在持有未公開內幕消息期間，或在刊發年度/半年業績公布前 30 天內，嚴禁向參與者授出任何股份期權或獎勵股份。","reference":"MBLR 17.05; HKSI Paper 5 Guide Topic 2 Section 9.96"},{"id":"T2-087","topic":"Topic 2","subtopic":"Debt Securities - Application Submission Timeline","difficulty":"Level 2","question":"根據主板上市規則第 24 章，向公眾零售發售的常規債務證券（非專業投資者專用），其上市申請必須在上市文件定稿刊發日前至少多少天送達聯交所？","options":[{"value":"A","label":"至少 3 天"},{"value":"B","label":"不少於 14 個淨日（Not less than 14 clear days prior to the date of finalisation）"},{"value":"C","label":"至少 60 天"},{"value":"D","label":"至少 6 個月"}],"answer":"B","explanation":"指南 2-68 頁 9.105 節及 MBLR 24.08 指明：向公眾零售發售的債務證券上市申請，必須在上市文件定稿供發布之日前至少 14 個淨日（Not less than 14 clear days）呈交聯交所。","reference":"MBLR 24.08; HKSI Paper 5 Guide Topic 2 Section 9.105"},{"id":"T2-088","topic":"Topic 2","subtopic":"Debt Securities - Tap Issue Rules","difficulty":"Level 2","question":"根據主板第 29.02 條，上市發行人若申請增發債務證券（俗稱「增發／水龍頭發行」，Tap Issue），下列監管要求何者正確？","options":[{"value":"A","label":"後續批次債券完全不受任何面額上限限制"},{"value":"B","label":"各後續批次債券可受同一上市文件涵蓋，但上市文件必須明確訂明可能發行的債務證券的最高面額上限（Maximum nominal amount），且各批次條款須符合初始批次要求"},{"value":"C","label":"每次增發必須由全體股東召開實體特別大會逐次表決"},{"value":"D","label":"增發債券嚴禁支付任何固定利息"}],"answer":"B","explanation":"指南 2-69 頁 9.110 節及 MBLR 29.02 指出：增發（Tap issue）債券受原上市文件涵蓋，但該上市文件必須指明可發行債券的最高面值上限，聯交所對後續每批發行通常施加與初始批次相同的標準。","reference":"MBLR 29.02; HKSI Paper 5 Guide Topic 2 Section 9.110"},{"id":"T2-089","topic":"Topic 2","subtopic":"Debt Securities - Medium Term Note (MTN) Programme","difficulty":"Level 2","question":"在主板第 29 章中期票據發行計劃（Debt Issuance Programme）架構下，聯交所所給予的上市批准，其有效涵蓋的票據發行期限為：","options":[{"value":"A","label":"自上市文件發布之日起計 12 個月內（Within 12 months after publication of the listing document）所發行的全部合資格證券"},{"value":"B","label":"自核准之日起 10 年內"},{"value":"C","label":"僅限於發布當日發行的一期票據"},{"value":"D","label":"永久有效"}],"answer":"A","explanation":"指南 2-69 頁 9.111 節及 MBLR 29.05 指明：在獲聯交所批准債務發行計劃後，聯交所接納在刊發上市文件後 12 個月內（Within 12 months）於該計劃下發行及上市的所有證券。","reference":"MBLR 29.05; HKSI Paper 5 Guide Topic 2 Section 9.111"},{"id":"T2-090","topic":"Topic 2","subtopic":"Asset-backed Securities (Chapter 29)","difficulty":"Level 2","question":"根據主板上市規則第 29 章，申請上市的資產抵押證券（Asset-backed Securities），其發行人通常必須具備何種法律組織形式？","options":[{"value":"A","label":"必須為大型跨國多元化集團公司"},{"value":"B","label":"通常必須為「單一目的實體／特定目的工具」（Single-purpose undertaking），且常規經審計賬目及最新財務期規定不適用"},{"value":"C","label":"必須為香港慈善團體"},{"value":"D","label":"必須由全體自然人合夥經營"}],"answer":"B","explanation":"指南 2-69 頁 9.112 節及 MBLR 29.11 指明：資產抵押證券發行人通常必須為單一目的機構（Single-purpose undertaking），一般三年審計歷史賬目及最後財務期限制獲豁免，但須詳細披露資產池結構。","reference":"MBLR 29.11, 29.12; HKSI Paper 5 Guide Topic 2 Section 9.112"},{"id":"T2-091","topic":"Topic 2","subtopic":"Debt Issues to Professional Investors Only (Chapter 37)","difficulty":"Level 2","question":"根據主板上市規則第 37 章（僅面向專業投資者的債務證券上市），與常規公售債券相比，其最顯著的監管便利優勢在於：","options":[{"value":"A","label":"完全毋須經聯交所批核即可隨意上市"},{"value":"B","label":"享受簡化的上市審批流程、極短的審查時間表、豁免遵循招股章程法定登記制度，且僅限專業投資者認購及二級市場買賣"},{"value":"C","label":"發行人可以違約不償還本金"},{"value":"D","label":"必須強制向全體公眾散戶派發發債通告"}],"answer":"B","explanation":"指南 2-70 頁 9.114 節及 MBLR Chapter 37 指明：第 37 章債券專門針對專業投資者，具備極度精簡的審批路徑與披露要求，免受零售招股章程嚴格繁複的法規登記限制，是機構發債的主流架構。","reference":"MBLR Chapter 37; HKSI Paper 5 Guide Topic 2 Section 9.114"},{"id":"T2-092","topic":"Topic 2","subtopic":"Public Offer Underwriting - Force Majeure Clause","difficulty":"Level 2","question":"在香港新股公開發售（IPO）中，承銷商辛迪加與發行人簽訂的包銷協議（Underwriting Agreement）通常包含不可抗力條款（Force Majeure Clause）。該條款的主要法律功能是：","options":[{"value":"A","label":"允許發行人永久沒收投資者的認購保證金"},{"value":"B","label":"在發生特定極端不可預見事件（如不可抗力戰爭、嚴重金融災難或天災）時，承銷商有權在規定期限前合法解除其包銷義務（Underwriting obligations can be relinquished）"},{"value":"C","label":"保證承銷商每年獲得 100% 的投資報酬率"},{"value":"D","label":"免除承銷商全體代表的香港刑事責任"}],"answer":"B","explanation":"指南 2-71 頁 10.6 節指明：公開發售及配售的包銷協議通常載有不可抗力條款（Force majeure），允許承銷商在出現重大不可抗力事件或重大市場災難等例外情況下，合法撤銷其包銷義務。","reference":"HKSI Paper 5 Guide Topic 2 Section 10.6"},{"id":"T2-093","topic":"Topic 2","subtopic":"Clawback Mechanism - Practice Note 18","difficulty":"Level 3","question":"在香港 IPO 同時包含機構配售與公開發售（散戶）時，根據主板《第 18 項應用指引》（Practice Note 18）的回撥機制（Clawback Mechanism），其核心運作邏輯為：","options":[{"value":"A","label":"若機構投資者認購超額，強制從散戶手中奪回股份分配給機構"},{"value":"B","label":"若散戶公開認購部分出現重大超額認購，原本初步分配在國際配售檔份的股份，必須依據固定階梯公式自動重新分配（回撥）至公開發售檔份"},{"value":"C","label":"發行人有權在定價後強制要求所有中籤投資者加價 20%"},{"value":"D","label":"保薦人有權在上市首日沒收所有散戶股份"}],"answer":"B","explanation":"指南 2-72 頁 10.8 節及 MBLR Practice Note 18 指明：回撥機制（Clawback）規定，當公開發售出現高倍數超額認購時，必須從國際配售檔份回撥股份至公開認購檔份（如超額 100 倍以上須回撥至 50%），以滿足散戶需求。","reference":"MBLR Practice Note 18; HKSI Paper 5 Guide Topic 2 Section 10.8"},{"id":"T2-094","topic":"Topic 2","subtopic":"Price Stabilization - Minimum Offer Size (HK$100M)","difficulty":"Level 1","question":"根據《證券及期貨（穩定價格）規則》（PS Rules），發行人及穩定價格操作人若擬合法依賴該規則進行價格穩定護盤買賣，該公開發售在香港的集資規模不得少於：","options":[{"value":"A","label":"港幣 1,000 萬元"},{"value":"B","label":"港幣 5,000 萬元"},{"value":"C","label":"港幣 1 億元（Not less than HK$100 million）"},{"value":"D","label":"港幣 10 億元"}],"answer":"C","explanation":"依據指南 2-73 頁 10.15 節註釋及 10.17(d) 節，PS Rules 僅適用於在香港發售規模不少於 1 億港元（Not less than HK$100 million）的公開發售，低於此規模者不得依賴該安全港進行穩定價格活動。","reference":"Securities and Futures (Price Stabilizing) Rules; HKSI Paper 5 Guide Topic 2 Section 10.15 Note, 10.17"},{"id":"T2-095","topic":"Topic 2","subtopic":"Price Stabilization - Stabilizing Period Definition","difficulty":"Level 2","question":"根據 PS Rules，穩定價格操作人獲准進行護盤行動的「穩定價格期」（Stabilizing Period）在法定時間範圍上是指：","options":[{"value":"A","label":"自招股書刊發日起至上市後 1 年止"},{"value":"B","label":"自交易開始時起，至以下兩者中較早者起計滿 30 天為止：(i) 上市文件訂明的截止日期；及 (ii) 股份開始交易之日"},{"value":"C","label":"上市首日開盤前 15 分鐘內"},{"value":"D","label":"發行人在香港交易所掛牌交易滿 90 天當天"}],"answer":"B","explanation":"指南 2-73 頁 10.16 節明確指明：穩定價格期（Stabilizing period）始於交易開始，並於以下兩者較早者之後 30 天結束：(i) 發售文件訂明的截止認購日期；或 (ii) 開始交易之日。逾期進行護盤即喪失安全港保護。","reference":"PS Rules; HKSI Paper 5 Guide Topic 2 Section 10.16"},{"id":"T2-096","topic":"Topic 2","subtopic":"Price Stabilization - Over-allotment & Stock Borrowing (s. 170 SFO)","difficulty":"Level 3","question":"在 IPO 中，穩定價格操作人行使超額配股權（Over-allotment option）常會建立空頭頭寸。為避免觸犯 SFO 第 170 條禁止無抵押賣空（Naked short selling）的刑事罪行，操作人必須採取的法定合規措施是：","options":[{"value":"A","label":"在市場上發起未具名融券競價"},{"value":"B","label":"在分配超額股份前，與控股股東或主要股東訂立具法律約束力的借貨協議（Stock borrowing and lending agreement）以借入相應數量股份"},{"value":"C","label":"要求聯交所暫停執行 SFO 第 170 條"},{"value":"D","label":"向每名認購人收取雙倍保證金"}],"answer":"B","explanation":"指南 2-74 至 2-75 頁 10.24(b) 節註釋指明：超額分配會形成淡倉，為免觸犯 SFO s. 170 違法賣空規定，操作人必須與大股東簽訂借股協議（Stock borrowing agreement）借入股份，以確保賣空屬於具備有借股支持的合法行為。","reference":"SFO s.170; PS Rules; HKSI Paper 5 Guide Topic 2 Section 10.24(b) Note"},{"id":"T2-097","topic":"Topic 2","subtopic":"Price Stabilization - Price Ceiling Restriction","difficulty":"Level 2","question":"根據《穩定價格規則》，穩定價格操作人在二級市場買入股份以防止價格下跌時，其在買入作價上受到的絕對上限限制為：","options":[{"value":"A","label":"不得高於上一個交易日收市價的 150%"},{"value":"B","label":"在任何情況下，買入價格絕不得高於該證券的首次公開發售價（Never higher than the price at which securities were offered）"},{"value":"C","label":"必須高於發行價的 10% 以拉抬市場信心"},{"value":"D","label":"無價格限制，操作人可隨意追高出價"}],"answer":"B","explanation":"指南 2-75 頁 10.25 節明文指明：穩定價格行動受限於最高價格規定，穩定價格操作人的買入價「絕不得高於該證券的公開發行價」（Never be higher than the offer price），否則即構成市場操縱。","reference":"PS Rules; HKSI Paper 5 Guide Topic 2 Section 10.25"},{"id":"T2-098","topic":"Topic 2","subtopic":"Price Stabilization - Register Keeping Period (7 Years)","difficulty":"Level 1","question":"根據 PS Rules，穩定價格操作人必須備存完整的穩定價格交易登記冊（Register of stabilizing actions）。該登記冊必須自穩定價格期結束起妥善保存至少：","options":[{"value":"A","label":"至少 1 年"},{"value":"B","label":"至少 3 年"},{"value":"C","label":"至少 7 年（Period of seven years from the end of the stabilizing period）"},{"value":"D","label":"至少 20 年"}],"answer":"C","explanation":"指南 2-74 頁 10.23 節指明：穩定價格交易登記冊必須自穩定價格期結束起「備存 7 年」（Kept for a period of seven years），以備證監會隨時查閱；發行人有權在期滿後 3 個月內查閱該登記冊。","reference":"PS Rules; HKSI Paper 5 Guide Topic 2 Section 10.23"},{"id":"T2-099","topic":"Topic 2","subtopic":"Price Stabilization - Type 1 Licence Requirement","difficulty":"Level 1","question":"獲發行人授權擔任穩定價格操作人（Stabilizing Manager）的金融機構，由於需要在二級市場實際執行證券買賣交易，該機構通常必須具備證監會發出的哪一類受規管活動牌照？","options":[{"value":"A","label":"第 1 類受規管活動（證券交易）牌照（Type 1 licence）"},{"value":"B","label":"第 3 類受規管活動（槓桿式外匯交易）牌照"},{"value":"C","label":"第 8 類受規管活動（提供證券保證金融資）牌照"},{"value":"D","label":"第 10 類受規管活動（提供信貸評級服務）牌照"}],"answer":"A","explanation":"指南 2-74 頁 10.20 節指明：由於穩定價格操作人需要直接在二級市場進行買賣護盤，其必須持有證監會第 1 類牌照（證券交易，Dealing in securities）。","reference":"SFO Schedule 5; HKSI Paper 5 Guide Topic 2 Section 10.20"},{"id":"T2-100","topic":"Topic 2","subtopic":"Price Stabilization - Overseas Records Reconstitution (48 Hours)","difficulty":"Level 2","question":"在一項涵蓋香港及海外的全球發售（Global Offering）中，穩定價格操作人委聘了海外代理人進行離岸護盤。根據 PS Rules，操作人必須確保在證監會要求查閱時，能在多長時間內將海外穩定價格紀錄在香港重組重現？","options":[{"value":"A","label":"2 小時內"},{"value":"B","label":"24 小時內"},{"value":"C","label":"48 小時之內（Within a period of 48 hours after requested）"},{"value":"D","label":"30 天內"}],"answer":"C","explanation":"指南 2-74 頁 10.21 節明確指明：穩定價格操作人須確保妥善保存本地及海外紀錄，若監管機構提出查閱要求，操作人必須確保海外紀錄能在「48 小時之內」（Within 48 hours）在香港重整備妥以供查核。","reference":"PS Rules; HKSI Paper 5 Guide Topic 2 Section 10.21"},{"id":"T2-101","topic":"Topic 2","subtopic":"Notifiable Transactions - The Five Percentage Ratios","difficulty":"Level 2","question":"根據主板上市規則第 14.07 條（GLR 第 19.07 條），上市發行人在評估一項交易是否構成須予公布的交易時，必須計算五項百分比率。下列哪一項不屬於該五項法定的百分比率測試？","options":[{"value":"A","label":"資產比率（Assets ratio）及收益比率（Revenue ratio）"},{"value":"B","label":"盈利比率（Profits ratio）及代價比率（Consideration ratio）"},{"value":"C","label":"股本比率（Equity capital ratio）"},{"value":"D","label":"現金流覆蓋比率（Cash flow coverage ratio）"}],"answer":"D","explanation":"依據指南 2-41 頁 11.7 節及 MBLR 14.07，五項法定百分比率測試為：資產比率、盈利比率、收益比率、代價比率及股本比率。現金流覆蓋比率並非法定的五大百分比率測試之一。","reference":"MBLR 14.07; HKSI Paper 5 Guide Topic 2 Section 11.7"},{"id":"T2-102","topic":"Topic 2","subtopic":"Notifiable Transactions - Discloseable Transaction Thresholds","difficulty":"Level 1","question":"根據《上市規則》第 14 章，當上市發行人進行一項資產收購或處置，且計算出的最高百分比率達到下列哪一區間時，該交易被分類為「須予披露的交易」（Discloseable Transaction）？","options":[{"value":"A","label":"所有比率均低於 5%"},{"value":"B","label":"任何百分比率為 5% 或以上，但均低於 25%（5% or more, but less than 25%）"},{"value":"C","label":"任何百分比率為 25% 或以上，但低於 100%"},{"value":"D","label":"任何百分比率為 75% 或以上"}],"answer":"B","explanation":"指南 2-41 頁 11.8(b) 節及 MBLR 14.06(2) 指明：凡任何適用百分比率達到 5% 或以上但低於 25% 的交易，即界定為「須予披露的交易」（Discloseable transaction）。","reference":"MBLR 14.06(2); HKSI Paper 5 Guide Topic 2 Section 11.8(b)"},{"id":"T2-103","topic":"Topic 2","subtopic":"Notifiable Transactions - Major Transaction Thresholds","difficulty":"Level 2","question":"根據主板第 14 章，關於「主要交易」（Major Transaction）的百分比率界限，收購與處置的最高比率門檻分別為：","options":[{"value":"A","label":"收購與處置均為 25% 至 50%"},{"value":"B","label":"任何百分比率為 25% 或以上，但收購須低於 100%，處置須低於 75%（Less than 100% for an acquisition or 75% for a disposal）"},{"value":"C","label":"任何百分比率為 50% 至 100%"},{"value":"D","label":"任何百分比率為 25% 至 75%"}],"answer":"B","explanation":"指南 2-41 頁 11.8(c) 節及 MBLR 14.06(3) 規定：主要交易是指任何百分比率達 25% 或以上，但收購低於 100%（達到 100% 則為非常重大收購），或處置低於 75%（達到 75% 則為非常重大出售）的交易。","reference":"MBLR 14.06(3); HKSI Paper 5 Guide Topic 2 Section 11.8(c)"},{"id":"T2-104","topic":"Topic 2","subtopic":"Notifiable Transactions - VSD Threshold","difficulty":"Level 1","question":"上市發行人若擬出售其旗下某項重大附屬業務，當計算出的任何一項百分比率達到多少時，該交易將被分類為「非常重大出售事項」（Very Substantial Disposal, VSD）？","options":[{"value":"A","label":"25% 或以上"},{"value":"B","label":"50% 或以上"},{"value":"C","label":"75% 或以上（75% or more）"},{"value":"D","label":"100% 或以上"}],"answer":"C","explanation":"指南 2-42 頁 11.8(d) 節及 MBLR 14.06(4) 指明：發行人進行的資產處置，若任何百分比率達到 75% 或以上，即歸類為「非常重大出售事項」（VSD）。","reference":"MBLR 14.06(4); HKSI Paper 5 Guide Topic 2 Section 11.8(d)"},{"id":"T2-105","topic":"Topic 2","subtopic":"Notifiable Transactions - VSA Threshold","difficulty":"Level 1","question":"上市發行人擬收購一項新業務資產，當計算出的任何一項百分比率達到多少時，該收購將構成「非常重大收購事項」（Very Substantial Acquisition, VSA）？","options":[{"value":"A","label":"25% 或以上"},{"value":"B","label":"50% 或以上"},{"value":"C","label":"75% 或以上"},{"value":"D","label":"100% 或以上（100% or more）"}],"answer":"D","explanation":"指南 2-42 頁 11.8(e) 節及 MBLR 14.06(5) 規定：發行人進行的資產收購，若任何百分比率達到 100% 或以上，即構成「非常重大收購事項」（VSA）。","reference":"MBLR 14.06(5); HKSI Paper 5 Guide Topic 2 Section 11.8(e)"},{"id":"T2-106","topic":"Topic 2","subtopic":"Notifiable Transactions - Share Transaction Definition","difficulty":"Level 2","question":"根據《上市規則》第 14.06(1) 條，何謂「股份交易」（Share Transaction）？","options":[{"value":"A","label":"發行人在公開二級市場進行自營股票買賣"},{"value":"B","label":"發行人收購資產（現金除外），其代價包含發行將尋求上市的證券及／或轉讓庫存股份，且所有計算出的百分比率均低於 5%"},{"value":"C","label":"控股股東向獨立第三方以場外大宗交易轉讓股份"},{"value":"D","label":"任何涉及現金對價且比率介乎 5% 至 25% 之間的收購"}],"answer":"B","explanation":"指南 2-41 頁 11.8(a) 節及 MBLR 14.06(1) 指明：股份交易是指上市發行人收購非現金資產，代價包含尋求上市的新證券或轉讓庫存股，且所有適用百分比率均低於 5% 的交易。","reference":"MBLR 14.06(1); HKSI Paper 5 Guide Topic 2 Section 11.8(a)"},{"id":"T2-107","topic":"Topic 2","subtopic":"Notifiable Transactions - Shareholder Approval Requirements","difficulty":"Level 2","question":"根據主板第 14 章的合規矩陣表，下列哪類須予公布的交易，法定必須獲得上市發行人的股東大會批准（Shareholders' approval）？","options":[{"value":"A","label":"股份交易及須予披露的交易"},{"value":"B","label":"主要交易、非常重大出售事項（VSD）及非常重大收購事項（VSA）"},{"value":"C","label":"僅限於股份交易"},{"value":"D","label":"所有類別的交易均自動豁免股東大會批准"}],"answer":"B","explanation":"指南 2-42 頁 11.9 節合規要求表指明：股份交易（若依一般授權發行）及須予披露的交易無須股東大會批准；而主要交易、非常重大出售（VSD）及非常重大收購（VSA）法定均必須刊發通函並獲股東大會表決批准。","reference":"MBLR 14.33; HKSI Paper 5 Guide Topic 2 Section 11.9"},{"id":"T2-108","topic":"Topic 2","subtopic":"Notifiable Transactions - Accountants Report Requirements","difficulty":"Level 2","question":"在須予公布交易的通函中，下列哪類交易在發布通函時，法定必須包含對擬收購業務或公司的「申報會計師報告」（Accountants' report）？","options":[{"value":"A","label":"須予披露的交易"},{"value":"B","label":"主要交易（涉及收購時）及非常重大收購事項（VSA）"},{"value":"C","label":"股份交易"},{"value":"D","label":"所有類別的資產出售事項"}],"answer":"B","explanation":"指南 2-42 頁 11.9 節合規表註釋 3 及 4 指明：涉及收購的主要交易以及非常重大收購事項（VSA），其致股東通函內必須載入針對擬收購業務或目標公司的申報會計師報告（Accountants' report）。","reference":"MBLR 14.67, 14.69; HKSI Paper 5 Guide Topic 2 Section 11.9"},{"id":"T2-109","topic":"Topic 2","subtopic":"Notifiable Transactions - Aggregation Rules (12 Months)","difficulty":"Level 2","question":"根據《上市規則》第 14.22 條，聯交所有權將上市發行人在多長時間內完成或訂立的一連串相關交易予以「合併計算」（Aggregation），視為一項單一交易處理？","options":[{"value":"A","label":"在過去 3 個月內"},{"value":"B","label":"在 12 個月期間內（Within a 12-month period）或彼此相關的交易"},{"value":"C","label":"在過去 5 年內"},{"value":"D","label":"僅限於同一交易日內簽署的協議"}],"answer":"B","explanation":"指南 2-41 頁 11.6 節及 MBLR 14.22 規定：聯交所可將發行人在 12 個月期間內進行或完成的一連串交易，或在其他方面互有關聯的交易合併計算，以決定其最終交易類別，防止分拆規避。","reference":"MBLR 14.22; HKSI Paper 5 Guide Topic 2 Section 11.6"},{"id":"T2-110","topic":"Topic 2","subtopic":"Reverse Takeovers (RTO) - Principle Based Test","difficulty":"Level 3","question":"聯交所依據「原則驗證法」（Principle based test）評估一項重大收購是否構成反收購行動（Reverse Takeover, RTO）時，其核心審查焦點在於：","options":[{"value":"A","label":"交易對價是否全額以現金支付"},{"value":"B","label":"該交易是否意圖將目標資產上市，從而規避適用於新上市申請人的規定（Attempt to list the assets and circumvent requirements for new applicants）"},{"value":"C","label":"發行人是否連續三年派發股息"},{"value":"D","label":"目標公司是否已在海外交易所退市"}],"answer":"B","explanation":"指南 2-44 頁 11.16 節及 MBLR 14.06B 指明：原則驗證法旨在由聯交所形成專業意見，評斷該項交易（或一連串交易/安排）實質上是否屬於意圖將收購目標資產上市，藉以規避新上市審核標準的借殼行為。","reference":"MBLR 14.06B; HKSI Paper 5 Guide Topic 2 Section 11.16"},{"id":"T2-111","topic":"Topic 2","subtopic":"RTO - Bright Line Tests","difficulty":"Level 3","question":"根據《上市規則》第 14.06B 條的反收購「明確界線測試」（Bright Line Tests），下列哪種情形會直接被自動界定為反收購行動（RTO）？","options":[{"value":"A","label":"構成須予披露的交易，且無任何控股權變動"},{"value":"B","label":"構成非常重大收購事項（VSA），且涉及發行人控制權的變更（Change in control）；或在控制權變更後 36 個月內向新控股股東收購資產且累計達到 VSA 門檻"},{"value":"C","label":"向獨立第三方收購價值相等於總資產 5% 的機器設備"},{"value":"D","label":"發行人在控制權變更滿 10 年後進行的重大收購"}],"answer":"B","explanation":"指南 2-45 頁 11.18 節及 MBLR 14.06B 指明：明線測試為量化指標：(1) 構成非常重大收購事項（VSA）且涉及控制權變更；或 (2) 在控制權變更後 36 個月內，發行人自新控股股東處收購資產且累計構成 VSA。","reference":"MBLR 14.06B; HKSI Paper 5 Guide Topic 2 Section 11.18"},{"id":"T2-112","topic":"Topic 2","subtopic":"RTO - Treated as New Listing Applicant","difficulty":"Level 3","question":"當一項交易被聯交所判定為反收購行動（RTO）時，根據《上市規則》第 14.54 條，該發行人及被注入的資產將面臨何種監管審批後果？","options":[{"value":"A","label":"只需在報章刊登澄清通告即可在 24 小時內完成交割"},{"value":"B","label":"聯交所將發行人視作「新上市申請人」（New listing applicant）處理；擬注入的目標資產必須符合新上市資格（包括三年營業紀錄期及財務測試），且須委聘獨立保薦人出具招股章程標準的通函並獲上市委員會批准"},{"value":"C","label":"發行人的所有股份自動被聯交所註銷並強制破產"},{"value":"D","label":"交易雙方全體董事被自動判處 2 年監禁"}],"answer":"B","explanation":"指南 2-43 至 2-44 頁 11.14 節及 MBLR 14.54 規定：被列為 RTO 的發行人將被視同新上市申請人對待；被收購資產必須滿足主板新上市資格（包括三年營業紀錄及盈利/財務測試），並須呈交申請版本及委聘保薦人。","reference":"MBLR 14.54; HKSI Paper 5 Guide Topic 2 Section 11.14"},{"id":"T2-113","topic":"Topic 2","subtopic":"Extreme Transactions - Reclassification Criteria","difficulty":"Level 3","question":"當一項收購依據原則驗證法被視為可能構成 RTO 時，若發行人擬申請將其重新歸類為「極端交易」（Extreme Transaction），發行人必須符合下列哪組條件？","options":[{"value":"A","label":"控制權在過去 1 個月內頻繁更換"},{"value":"B","label":"發行人受同一人或同一組人士控制或事實上控制已長達相當長時間（通常至少 36 個月），該交易不會導致控制權變更，且發行人原有業務具備龐大規模（年收益或總資產達 10 億港元或以上）並將持續營運"},{"value":"C","label":"交易對價全數以虛擬代幣結算"},{"value":"D","label":"發行人在過去三年內持續處於停牌狀態"}],"answer":"B","explanation":"指南 2-45 至 2-46 頁 11.19 節及 MBLR 指明極端交易要件：(1) 發行人受同一控制人控制至少 36 個月且交易不引發控制權變動；(2) 發行人原有業務具備龐大規模（通常年收益或總資產不低於 10 億港元）並將持續發展，能證明非單純買殼上市。","reference":"MBLR 14.06C; HKSI Paper 5 Guide Topic 2 Section 11.19"},{"id":"T2-114","topic":"Topic 2","subtopic":"Extreme Transactions - Financial Adviser Obligations","difficulty":"Level 3","question":"在聯交所接納將一項收購作為「極端交易」（Extreme Transaction）處理的情況下，發行人委聘的財務顧問（Financial Adviser）負有何種加重責任？","options":[{"value":"A","label":"財務顧問無須進行任何額外工作"},{"value":"B","label":"財務顧問必須進行額外盡職審查，並向聯交所出具確認書，信納收購目標符合新上市資格基準，且通函披露內容大致完備"},{"value":"C","label":"財務顧問必須全額包銷該收購的所有潛在債務"},{"value":"D","label":"財務顧問必須收購發行人 5% 的股權"}],"answer":"B","explanation":"指南 2-46 頁 11.20 節指明：極端交易雖免於完整的新上市保薦程序，但發行人必須委聘財務顧問進行額外盡職調查（Additional due diligence），並就目標資產符合資格及通函資料完備性承擔類似責任；若財務顧問無法履職，則不得作為極端交易處理。","reference":"MBLR 14.06C; HKSI Paper 5 Guide Topic 2 Section 11.20"},{"id":"T2-115","topic":"Topic 2","subtopic":"Large Scale Issues of Securities - Shell Circumvention","difficulty":"Level 3","question":"根據《上市規則》第 14 章，上市發行人若擬進行大規模股本集資以收購新業務，聯交所在何種特徵下會判定其屬於「規避新上市規定的大規模證券發行」並拒絕批准新股上市？","options":[{"value":"A","label":"集資額極小且完全用於補充現有主營業務日常營運資金"},{"value":"B","label":"集資規模相對於發行人現有規模極為龐大且與現有業務無合理關聯；或擬收購業務遠大於原業務，或投資者將藉此取得發行人實際控制權"},{"value":"C","label":"發行新股獲得全體現有股東 100% 贊成"},{"value":"D","label":"新股以溢價 50% 配售予獨立主權基金"}],"answer":"B","explanation":"指南 2-46 頁 11.21 節及 MBLR 14.06D 規定：若集資規模龐大且與原有業務無關、擬收購業務大幅超越原業務規模、或認購方將藉此取得控制權，聯交所通常認定為規避新上市規定，不會授予新股上市批准。","reference":"MBLR 14.06D; HKSI Paper 5 Guide Topic 2 Section 11.21"},{"id":"T2-116","topic":"Topic 2","subtopic":"Restriction on Disposals within 36 Months of Change in Control","difficulty":"Level 3","question":"根據《上市規則》第 14.06E 條，在發行人發生控制權變更後的 36 個月內，發行人出售其原有業務受到何種限制？","options":[{"value":"A","label":"發行人可以隨意處置全部資產並轉為純現金儲備"},{"value":"B","label":"發行人不得進行涉及其重大業務的處置或實物分派，除非剩餘資產能夠獨立持續滿足新上市申請人的各項量化財務測試（Quantitative requirements）"},{"value":"C","label":"36 個月內任何資產出售均自動構成刑事罪行"},{"value":"D","label":"只要買方為外資企業即可完全豁免限制"}],"answer":"B","explanation":"指南 2-47 頁 11.23 節及 MBLR 14.06E 指明：在控制權變動後 36 個月內，發行人嚴禁處置原有主要業務，除非出售後留存的剩餘業務本身能夠持續符合新上市申請人的量化財務資格要求，以遏制「賣殼後剝離舊資產」的規避行為。","reference":"MBLR 14.06E; HKSI Paper 5 Guide Topic 2 Section 11.23"},{"id":"T2-117","topic":"Topic 2","subtopic":"Distribution in Specie amounting to VSD - Cash Alternative","difficulty":"Level 3","question":"根據《上市規則》第 14.06E 條，若上市發行人擬進行實物分派（Distribution in specie），且該項分派的規模構成非常重大出售事項（VSD），發行人必須落實何種法定保障程序？","options":[{"value":"A","label":"僅需在董事會會議上口頭通報"},{"value":"B","label":"必須取得獨立股東在股東大會上的事先批准，且必須為股東提供合理的現金替代方案（Reasonable cash alternative）或其他適當替代選擇"},{"value":"C","label":"實物分派的資產必須全數存管於證監會"},{"value":"D","label":"禁止任何小股東在大會上投票"}],"answer":"B","explanation":"指南 2-47 頁 11.24 節及 MBLR 14.06E 規定：構成 VSD 的實物分派，必須獲得獨立股東於大會上表決通過，且發行人必須向被分派股東提供合理的現金選擇權（Reasonable cash alternative），以保障無意持有非上市資產的少數股東利益。","reference":"MBLR 14.06E; HKSI Paper 5 Guide Topic 2 Section 11.24"},{"id":"T2-118","topic":"Topic 2","subtopic":"Definition of Connected Person - Immediate Family Member","difficulty":"Level 2","question":"根據《上市規則》第 14A 章關連交易規則，在界定自然人董事的「聯繫人」（Associate）時，下列哪一類親屬直接屬於「直系親屬」（Immediate Family Member，從而屬於「緊密聯繫人」Close Associate）？","options":[{"value":"A","label":"配偶、以及該董事或其配偶未滿 18 歲的子女或繼子女"},{"value":"B","label":"成年已婚且獨立生活的兄弟姊妹"},{"value":"C","label":"祖父母及外祖父母"},{"value":"D","label":"堂兄弟及表姊妹"}],"answer":"A","explanation":"指南 2-48 頁 11.27 節註釋 1 及 MBLR 14A.12(1)(a) 指明：自然人的「直系親屬」（Immediate family member）包括配偶、以及該人士或其配偶未滿 18 歲的子女或繼子女；彼等自動屬於「緊密聯繫人」（Close associate）。","reference":"MBLR 14A.12; HKSI Paper 5 Guide Topic 2 Section 11.27 Note 1"},{"id":"T2-119","topic":"Topic 2","subtopic":"Definition of Connected Person - Past Director","difficulty":"Level 2","question":"根據《上市規則》第 14A.07 條，曾在上市發行人或其附屬公司擔任董事的人士，在離任後多長時間內，仍繼續被法規視為該發行人的「關連人士」（Connected Person）？","options":[{"value":"A","label":"離任後 3 個月內"},{"value":"B","label":"過去 12 個月內（Within the preceding 12 months）"},{"value":"C","label":"離任後滿 3 年內"},{"value":"D","label":"自離任之日起即刻不再屬於關連人士"}],"answer":"B","explanation":"指南 2-47 頁 11.27(b) 節及 MBLR 14A.07(2) 規定：在過去 12 個月內曾擔任發行人或其任何附屬公司董事的人士，仍屬於該發行人的關連人士，以防董事透過即時辭職規避關連交易審查。","reference":"MBLR 14A.07(2); HKSI Paper 5 Guide Topic 2 Section 11.27(b)"},{"id":"T2-120","topic":"Topic 2","subtopic":"Connected Subsidiary Definition","difficulty":"Level 3","question":"根據《上市規則》第 14A.16 條，上市發行人的非全資附屬公司在何種股權結構下，會被界定為發行人的「關連附屬公司」（Connected Subsidiary）？","options":[{"value":"A","label":"該附屬公司的任何少數股東為外國法人"},{"value":"B","label":"發行人的關連人士（在發行人層面）單獨或共同有權行使或控制行使該非全資附屬公司股東大會 10% 或以上的表決權"},{"value":"C","label":"該附屬公司的註冊資本超過 1 億港元"},{"value":"D","label":"該附屬公司在 GEM 掛牌交易"}],"answer":"B","explanation":"指南 2-48 頁 11.27 節註釋 2 及 MBLR 14A.16 指明：發行人的非全資附屬公司，若發行人群組層面的關連人士在該附屬公司大會上有權行使或控制行使 10% 或以上投票權，則該附屬公司即構成「關連附屬公司」。","reference":"MBLR 14A.16; HKSI Paper 5 Guide Topic 2 Section 11.27 Note 2"},{"id":"T2-121","topic":"Topic 2","subtopic":"Core Connected Person vs Connected Person","difficulty":"Level 2","question":"在評估公眾持股量（Public float）或庫存股出售對象時，經常涉及「核心關連人士」（Core Connected Person）。下列哪一類主體屬於核心關連人士，但**不包括**在一般的關連人士範疇之外？","options":[{"value":"A","label":"發行人的董事、最高行政人員、大股東（持股10%或以上）、PRC發行人的監事、以及上述人士的緊密聯繫人"},{"value":"B","label":"離任超過 5 年的前獨立非執行董事"},{"value":"C","label":"僅持有發行人 0.5% 股份的普通散戶"},{"value":"D","label":"發行人的外部公共關係顧問公司"}],"answer":"A","explanation":"指南 2-48 頁 11.28 節及 MBLR 1.01 明確界定：「核心關連人士」（Core Connected Person）是指發行人的董事、行政總裁、大股東（持股 10% 以上）、中國發行人監事、發行人的任何附屬公司或彼等各自的緊密聯繫人。","reference":"MBLR 1.01, 14A; HKSI Paper 5 Guide Topic 2 Section 11.28"},{"id":"T2-122","topic":"Topic 2","subtopic":"Connected Transactions - Stock Exchange Deeming Powers","difficulty":"Level 2","question":"根據《上市規則》第 14A.19 條至第 14A.21 條，關於聯交所在關連人士認定上的「視作權力」（Deeming powers），下列何者正確？","options":[{"value":"A","label":"聯交所只能嚴格依據字面名冊，絕對無權視任何其他人為關連人士"},{"value":"B","label":"聯交所有絕對權力將某人視作發行人的關連人士（Power to deem a person to be connected），若該人與發行人簽訂了非常規安排或交易實質上存在利益輸送關聯"},{"value":"C","label":"只有香港最高法院才能行使視作關連人士之權力"},{"value":"D","label":"被視為關連人士後，發行人自動免除一切申報責任"}],"answer":"B","explanation":"指南 2-48 頁 11.31 節及 MBLR 14A.19 規定：聯交所獲賦權可將任何特定人士「視作」（Deem）關連人士，並可裁定特定豁免不適用於特定交易，以貫徹實質重於形式的監管原則。","reference":"MBLR 14A.19-14A.21; HKSI Paper 5 Guide Topic 2 Section 11.31"},{"id":"T2-123","topic":"Topic 2","subtopic":"Cash Companies (MBLR 14.82) - Definition & Trading Halt","difficulty":"Level 2","question":"根據主板上市規則第 14.82 條，一間上市發行人若被聯交所界定為「現金資產公司」（Cash Company），其核心監管特徵及交易所的處置措施為：","options":[{"value":"A","label":"發行人資產全部或大部分為現金或短期投資，聯交所通常認為其不再適合上市並將指示其股票停牌（Suspended from trading）"},{"value":"B","label":"發行人被強制轉移至紐約交易所掛牌"},{"value":"C","label":"發行人獲得免除刊發年度報告的特權"},{"value":"D","label":"聯交所直接沒收其所有賬面現金"}],"answer":"A","explanation":"指南 2-49 頁 11.34–11.35 節及 MBLR 14.82 指明：發行人的資產若全部或實質上由現金或短期投資構成（非投資公司），通常被視為不適合上市，聯交所將暫停其證券買賣；若擬復牌，發行人必須向聯交所重新申請並符合新上市要求。","reference":"MBLR 14.82; HKSI Paper 5 Guide Topic 2 Section 11.34-11.35"},{"id":"T2-124","topic":"Topic 2","subtopic":"Cash Companies - Regulated Entities Exemption","difficulty":"Level 2","question":"在界定現金資產公司時，下列哪類上市發行人因其業務性質，原則上依法享有豁免而不受 MBLR 第 14.82 條現金公司限制？","options":[{"value":"A","label":"傳統成衣製造企業"},{"value":"B","label":"銀行、保險公司及證券經紀行（Banks, insurance companies and securities houses）"},{"value":"C","label":"房地產開發商"},{"value":"D","label":"連鎖餐飲集團"}],"answer":"B","explanation":"指南 2-49 頁 11.36 節註釋指出：從事特定金融監管業務的發行人，如銀行、獲授權保險公司及持牌證券商，因其日常業務需要持有巨額流動資金或證券投資，獲豁免適用現金公司規則。","reference":"MBLR 14.83; HKSI Paper 5 Guide Topic 2 Section 11.36 Note"},{"id":"T2-125","topic":"Topic 2","subtopic":"Trading Halt vs Trading Suspension - Two Trading Days Limit","difficulty":"Level 2","question":"根據主板上市規則第 6.02 條及指南說明，「短暫停牌」（Trading Halt）與「停牌」（Trading Suspension）的關鍵法定程序差異在於：","options":[{"value":"A","label":"短暫停牌由證監會命令，停牌由香港警務處命令"},{"value":"B","label":"短暫停牌是指預期不超過兩個交易日（No more than two trading days）的暫時交易中斷，旨在等待信息披露；若超過兩個交易日，則自動轉為正式停牌"},{"value":"C","label":"短暫停牌期間投資者可以私下在場外自行結算"},{"value":"D","label":"停牌時間最長不得超過 10 分鐘"}],"answer":"B","explanation":"指南 2-50 頁 12.2 節明文指明：短暫停牌（Trading halt）是短暫的中斷，專門用於等待根據規則披露資料，期限不得超過兩個交易日；若短暫停牌超過兩個交易日，即自動轉為正式「停牌」（Trading suspension）。","reference":"MBLR 6.02; HKSI Paper 5 Guide Topic 2 Section 12.2"},{"id":"T2-126","topic":"Topic 2","subtopic":"Circumstances Requiring Trading Halt","difficulty":"Level 2","question":"根據《上市規則》第 13.09 條及 SFO 第 XIVA 部，在下列哪種具體情形下，上市發行人必須主動向聯交所申請短暫停牌？","options":[{"value":"A","label":"發行人發行了新的促銷宣傳單張"},{"value":"B","label":"發行人持有避免出現虛假市場的重大未公開消息、或需披露法定內幕消息，或有合理理由相信處於安全港豁免下的機密談判可能已經外洩"},{"value":"C","label":"公司全體董事正在召開例行年終晚會"},{"value":"D","label":"公司獲納入恒生指數成分股觀察名單"}],"answer":"B","explanation":"指南 2-50 頁 12.3 節指出：在以下情況發行人必須申請短暫停牌：(a) 須披露避免虛假市場之資料；(b) 須披露 SFO 下的內幕消息；或 (c) 合理相信處於豁免或申請中的重大機密消息已經洩漏。","reference":"MBLR 13.09, 13.10A; HKSI Paper 5 Guide Topic 2 Section 12.3"},{"id":"T2-127","topic":"Topic 2","subtopic":"Market Rumours and Clarification Announcements","difficulty":"Level 3","question":"當市場沽空機構或傳媒發表針對上市發行人的指控報告（指控財務舞弊或嚴重造假），且該指控可能引發股價異動與虛假市場時，聯交所對發行人的合規要求是：","options":[{"value":"A","label":"嚴禁發行人發表任何反駁公告"},{"value":"B","label":"發行人必須迅速發表澄清公告，並逐點反駁指控或作出明確否定陳述；若無法即時刊登具體澄清，發行人必須立即申請短暫停牌"},{"value":"C","label":"發行人應對全體市場分析員提起刑事誹謗訴訟並拒絕回應"},{"value":"D","label":"發行人自動被聯交所除牌退市"}],"answer":"B","explanation":"指南 2-50 至 2-51 頁 12.4 節規定：若指控可能引發虛假或混亂市場，發行人必須即時刊發澄清公告以交代立場；若無法及時發布澄清公告，發行人必須申請短暫停牌（Apply for a trading halt），以防止市場出現不公平交易。","reference":"MBLR; HKSI Paper 5 Guide Topic 2 Section 12.4"},{"id":"T2-128","topic":"Topic 2","subtopic":"Cancellation of Listing - Continuous Suspension (18 Months Rule)","difficulty":"Level 2","question":"根據主板上市規則第 6.01A(1) 條，聯交所有權在上市發行人持續停牌達到多長時間後，直接將該發行人取消上市地位（除牌/Delisting）？","options":[{"value":"A","label":"連續停牌滿 6 個月"},{"value":"B","label":"連續停牌滿 12 個月"},{"value":"C","label":"連續停牌達 18 個月（Continuous period of 18 months）"},{"value":"D","label":"連續停牌滿 36 個月"}],"answer":"C","explanation":"指南 2-52 頁 12.12 節及 MBLR 6.01A(1) 明確指明：聯交所可將任何已連續停牌達到 18 個月的主板上市發行人取消其上市地位（GEM 的除牌期限為連續停牌 12 個月）。","reference":"MBLR 6.01A(1); HKSI Paper 5 Guide Topic 2 Section 12.12"},{"id":"T2-129","topic":"Topic 2","subtopic":"Cancellation of Listing - Sufficient Operations (Rule 13.24)","difficulty":"Level 2","question":"根據主板第 13.24 條，上市發行人必須持續維持何種營運水平，否則聯交所有權暫停其買賣甚至啟動除牌程序？","options":[{"value":"A","label":"每年必須保持 100 億港元的營業額"},{"value":"B","label":"發行人必須開展具備足夠業務運作水平的業務，或擁有足夠價值的資產支持其營運，以保證其證券得以繼續上市（Sufficient level of operations or sufficient assets）"},{"value":"C","label":"全體員工總人數不得少於 5,000 人"},{"value":"D","label":"海外分支機構數量不得少於 10 間"}],"answer":"B","explanation":"指南 2-52 頁 12.11 節及 MBLR 13.24 規定：上市發行人必須維持足夠的業務運作水平或擁有足夠資產支持其營運（Sufficient operations and assets），以證明其業務具備實質可行性與可持續性，杜絕空殼公司（Shells）。","reference":"MBLR 13.24; HKSI Paper 5 Guide Topic 2 Section 12.11"},{"id":"T2-130","topic":"Topic 2","subtopic":"SFC Statutory Suspension Powers (SMLR Rule 8)","difficulty":"Level 3","question":"根據《證券及期貨（股票市場上市）規則》（SMLR）第 8 條，證監會（SFC）在何種情況下可直接行使法定公權力，命令香港聯交所暫停某上市公司證券的買賣？","options":[{"value":"A","label":"發行人上市文件、公告等載有實質虛假、不完整或具誤導性的資料；或為維持有序及公平的市場，或維護投資大眾利益所必需時"},{"value":"B","label":"僅在發行人未能支付證監會年費時"},{"value":"C","label":"只要聯交所行政總裁口頭提出要求"},{"value":"D","label":"當發行人更換公關顧問時"}],"answer":"A","explanation":"指南 2-52 至 2-53 頁 12.15 節及 SMLR Rule 8 明確規定：證監會在認為發行人刊發的文件存在虛假或誤導性陳述、或為維持公平有序市場、或為保護投資者利益時，有權直接發出法定指令指示聯交所暫停該證券交易。","reference":"SMLR Rule 8; HKSI Paper 5 Guide Topic 2 Section 12.15"},{"id":"T2-131","topic":"Topic 2","subtopic":"Voluntary Withdrawal of Listing - Issuer with Alternative Listing","difficulty":"Level 3","question":"根據主板上市規則第 6.12 條，一間在聯交所主要上市且在另一認可交易所擁有替代上市（Alternative listing）的發行人，若擬自願撤銷在香港的上市地位，其法定股東大會批准與通知期要求為：","options":[{"value":"A","label":"必須 100% 股東書面贊成，通知期 1 天"},{"value":"B","label":"獲股東及其他上市證券持有人以普通決議案（過半數/Ordinary majority）通過，並給予證券持有人不少於三個月的事先通知（Not less than three months' notice）"},{"value":"C","label":"獲 75% 特別多數批准，反對票不超過 10%"},{"value":"D","label":"毋須股東批准，只需由董事會決定"}],"answer":"B","explanation":"指南 2-53 頁 12.19 節及 MBLR 6.12 指出：具備替代上市的發行人撤銷香港主要上市，決議案須經普通決議案（Ordinary majority）通過，且在獲批後須給予股東不少於 3 個月的通知期（Not less than 3 months' notice）。","reference":"MBLR 6.12; HKSI Paper 5 Guide Topic 2 Section 12.19"},{"id":"T2-132","topic":"Topic 2","subtopic":"Voluntary Withdrawal - Issuer with NO Alternative Listing","difficulty":"Level 3","question":"對於「無任何其他替代上市地點」（No alternative listing）的上市發行人，若擬自願從聯交所主板撤回上市，其適用之嚴格股東表決門檻為：","options":[{"value":"A","label":"普通決議案過半數贊成即可"},{"value":"B","label":"股東大會決議案須獲得至少 75% 投票權贊成；投反對票的比例不得超過全體有表決權的 10%；控股股東及執行董事須放棄表決贊成，且必須向股東提供合理的現金替代選擇"},{"value":"C","label":"反對票只要超過 5% 即告流產"},{"value":"D","label":"必須經香港財政司司長親自簽批"}],"answer":"B","explanation":"指南 2-54 頁 12.20 節及 MBLR 6.15 規定嚴格條件：(1) 至少 75% 贊成；(2) 反對票不超過總投票權的 10%；(3) 控股股東及關連董事放棄贊成票；(4) 提供合理的現金或其他替代選擇（Cash alternative）。","reference":"MBLR 6.15; HKSI Paper 5 Guide Topic 2 Section 12.20"},{"id":"T2-133","topic":"Topic 2","subtopic":"Winding Up of Listed Issuer - CWUMPO Notice to Shareholders","difficulty":"Level 2","question":"當香港註冊成立的上市公司被法院裁定清盤或進行自動清盤時，根據《上市規則》第 6.11 及 6.12 條，發行人除通知聯交所外，在撤銷上市地位前通常必須向股東發出多長的通知？","options":[{"value":"A","label":"7 天通知"},{"value":"B","label":"3 個月通知（Three months' notice），以便股東在股份除牌前有機會處置其持股"},{"value":"C","label":"1 年通知"},{"value":"D","label":"無須任何通知，即日自動註銷"}],"answer":"B","explanation":"指南 2-54 頁 12.23 節及 MBLR 6.11–6.12 指明：公司清盤撤銷上市時，通常涉及向股東發出三個月的通知（Three months' notice），旨在為公眾股東提供最後窗口在股票徹底除牌前尋求出售變現。","reference":"CWUMPO; MBLR 6.11, 6.12; HKSI Paper 5 Guide Topic 2 Section 12.23"},{"id":"T2-134","topic":"Topic 2","subtopic":"Disciplinary Proceedings - Parties Subject to Sanction","difficulty":"Level 2","question":"根據主板上市規則第 2A.09 條，聯交所上市委員會啟動紀律程序時，有權對下列哪類人士施加紀律制裁？","options":[{"value":"A","label":"僅限於發行人本身，任何個人均不受管轄"},{"value":"B","label":"上市發行人及其董事、高級管理層成員、大股東、SPAC 發起人、授權代表、PRC 發行人監事、以及發行人的專業顧問（如財務顧問、律師、會計師、估值師）及其僱員"},{"value":"C","label":"全港所有證券經紀商的行政總裁"},{"value":"D","label":"僅限於香港政府官員"}],"answer":"B","explanation":"指南 2-55 頁 13.3 節及 MBLR 2A.09 明確列舉受管轄對象：發行人及其董事、高級管理層（Senior management）、大股東、SPAC 發起人、授權代表、監事、專業顧問（財務顧問、律師、會計師等）及其相關僱員。","reference":"MBLR 2A.09; HKSI Paper 5 Guide Topic 2 Section 13.3"},{"id":"T2-135","topic":"Topic 2","subtopic":"Disciplinary Sanctions - Unsuitability Statement","difficulty":"Level 3","question":"根據《上市規則》第 2A.10 條，當某上市發行人的董事嚴重或重複未能履行其在《上市規則》下的職責時，上市委員會可施加的嚴重公開制裁包括：","options":[{"value":"A","label":"沒收該董事的香港永久性居民身份證"},{"value":"B","label":"公開聲明聯交所認為該人士「不適合擔任」（Unsuitable）該發行人或其附屬公司的董事或高級管理層職位"},{"value":"C","label":"判處該董事在聯交所總部大堂進行社區服務 100 小時"},{"value":"D","label":"強制拍賣該董事的私人住宅"}],"answer":"B","explanation":"指南 2-56 頁 13.4(d) 節及 MBLR 2A.10(b) 指明：對嚴重違規董事，上市委員會可發出公開聲明，指該董事在聯交所看來不適合擔任董事或高級管理層（Unsuitable to occupy the position of director）；若發行人拒絕免職，聯交所可進一步對發行人施加設施剝奪或停牌處分。","reference":"MBLR 2A.10; HKSI Paper 5 Guide Topic 2 Section 13.4(d)"},{"id":"T2-136","topic":"Topic 2","subtopic":"Disciplinary Sanctions - Professional Advisers Banning","difficulty":"Level 2","question":"根據主板第 2A.10(j) 條，若某專業顧問機構（如獨立財務顧問 IFA 或估值師）在上市規則事宜中存在重大失職，上市委員會有權施加下列哪項針對性制裁？","options":[{"value":"A","label":"在指定期限內，禁止該專業顧問或其僱員就任何呈交上市科或上市委員會的事宜代表任何上市發行人（Banning for a stated period from representing a listed issuer）"},{"value":"B","label":"直接命令警務處查封該顧問機構的所有實體辦公室"},{"value":"C","label":"沒收該機構全體合夥人的個人執業執照"},{"value":"D","label":"將該專業機構改組為公營機構"}],"answer":"A","explanation":"指南 2-56 頁 13.4(i) 節及 MBLR 2A.10 指明：聯交所有權在指定期間內，禁止該專業顧問或其僱員就任何呈交上市科或上市委員會的事宜代表上市發行人（俗稱「禁止出庭/拒絕接納其意見函」制裁）。","reference":"MBLR 2A.10; HKSI Paper 5 Guide Topic 2 Section 13.4(i)"},{"id":"T2-137","topic":"Topic 2","subtopic":"Disciplinary Appeals - Request for Review Timelines","difficulty":"Level 2","question":"根據《上市規則》第 2A.11 條，受處分當事人若擬就上市委員會的紀律決定提呈覆核（由上市覆核委員會 LRC 審議），其提出覆核申請的法定期限為：","options":[{"value":"A","label":"在裁決發出之日起 24 小時內"},{"value":"B","label":"在該決定發出之日起 7 個營業日內；或若在 3 個營業日內索取了書面理由，則在書面理由發出之日起 7 個營業日內（Within 7 business days）"},{"value":"C","label":"在裁決發出滿 3 個月後"},{"value":"D","label":"在下一個曆年結束前"}],"answer":"B","explanation":"指南 2-57 頁 13.5 節及 MBLR 2A.11 規定：覆核要求須於決定發出後 7 個營業日內送達；當事人可在決定發出後 3 個營業日內索取書面理由，若索取了書面理由，則須在書面理由發出後 7 個營業日內提出覆核申請。","reference":"MBLR 2A.11; HKSI Paper 5 Guide Topic 2 Section 13.5"},{"id":"T2-138","topic":"Topic 2","subtopic":"Disciplinary Proceedings - Right to Legal Representation","difficulty":"Level 1","question":"在上市委員會或上市覆核委員會（LRC）舉行的紀律聆訊程序中，受調查的當事人享有何種法定程序權利？","options":[{"value":"A","label":"當事人嚴禁親自出席會議，僅能書面陳述"},{"value":"B","label":"當事人有權親自出席會議、作出實質陳述，並由其專業顧問（如律師）陪同出席（Right to attend, make submissions and be accompanied by professional advisers）"},{"value":"C","label":"當事人必須向委員會繳交 500 萬港元的出席保證金"},{"value":"D","label":"聆訊一律對公眾全程進行電視現場直播"}],"answer":"B","explanation":"指南 2-57 頁 13.6 節及 MBLR 2A.15 指明：在上市委員會或 LRC 的紀律聆訊中，相關當事人有權出席會議、呈交書面及口頭陳述，並有權由其專業顧問（律師/大律師）陪同出席維護權益。","reference":"MBLR 2A.15; HKSI Paper 5 Guide Topic 2 Section 13.6"},{"id":"T2-139","topic":"Topic 2","subtopic":"Connected Transactions - Connected Person Definition (Supervisors)","difficulty":"Level 1","question":"在評估中國內地註冊成立的 H 股上市公司（PRC Issuers）的關連交易時，下列哪一類特定人員依法自動屬於該公司的「關連人士」（Connected Person）？","options":[{"value":"A","label":"全體車間班組長"},{"value":"B","label":"PRC 發行人的監事（Supervisor of a PRC issuer）"},{"value":"C","label":"任何內地退休員工"},{"value":"D","label":"地方稅務所專員"}],"answer":"B","explanation":"指南 2-47 頁 11.27(c) 節及 MBLR 14A.07(3) 指明：中國發行人（H 股公司）的監事（Supervisor）依法直接界定為發行人的關連人士。","reference":"MBLR 14A.07(3); HKSI Paper 5 Guide Topic 2 Section 11.27(c)"},{"id":"T2-140","topic":"Topic 2","subtopic":"Valuations in M&A - Director Due Diligence Duty","difficulty":"Level 3","question":"根據《上市規則》及證監會執法指引，上市發行人在進行重大資產收購時，董事會依賴外部專業估值師出具的估值報告，董事會負有何種法律責任？","options":[{"value":"A","label":"董事可完全免責，無須過問估值師採用的任何假設或折現率"},{"value":"B","label":"董事必須進行適當的盡職審查（Appropriate degree of due diligence），審慎評估估值方法與關鍵假設之合理性，確保交易條款符合公司及全體股東最佳利益，否則可能觸犯 SFO 第 214 條公司失當行為或第 277 條披露誤導資料"},{"value":"C","label":"董事必須指示估值師虛增 50% 估值以拉高股價"},{"value":"D","label":"估值報告僅需在交割滿 10 年後存檔備查"}],"answer":"B","explanation":"指南 2-40 頁 11.2–11.4 節明確強調：董事對估值負有不可推卸的受託與審慎查詢責任，盲目採納不合理估值報告可能導致散布誤導性資料，觸犯 SFO ss. 277, 298 甚至引發 s. 214 撤銷董事資格與民事賠償責任。","reference":"SFO ss. 214, 277; HKSI Paper 5 Guide Topic 2 Section 11.2-11.4"},{"id":"T2-141","topic":"Topic 2","subtopic":"Connected Transactions - De Minimis Exemptions","difficulty":"Level 2","question":"根據主板上市規則第 14A.76 條，符合全面免除申報、公告及獨立股東批准的關連交易最低豁免（Fully exempt de minimis threshold）標準為：","options":[{"value":"A","label":"所有百分比率均低於 0.1%，或最高百分比率低於 5% 且對價低於 300 萬港元"},{"value":"B","label":"所有百分比率均高於 50%"},{"value":"C","label":"涉及金額超過 1 億港元但無書面合約"},{"value":"D","label":"僅限於向控股股東私人無償贈送公司核心專利"}],"answer":"A","explanation":"依據 MBLR 14A.76 及常規關連交易豁免框架：符合完全豁免的關連交易門檻通常為：(1) 最高百分比率低於 0.1%；或 (2) 最高百分比率低於 5% 且對價總額低於 300 萬港元（MBLR 14A.76(1)）。","reference":"MBLR 14A.76; HKSI Paper 5 Guide Topic 2 Section 11.25"},{"id":"T2-142","topic":"Topic 2","subtopic":"RTO - Shell Company Injections & Quality of Assets","difficulty":"Level 3","question":"上市發行人在停牌前已實質喪失主要營運業務，淪為空殼公司。新入主股東擬向其注入新業務資產以尋求復牌。聯交所在反收購架構下對該目標資產的審核要求為：","options":[{"value":"A","label":"注入的資產只要有任何一項商業合約即可獲准復牌"},{"value":"B","label":"擬注入的目標資產必須證明其完全符合新上市的全部適當性與資格要求（包括三年營業紀錄及三年累計至少 8,000 萬港元盈利等），且發行人在完成 RTO 後必須具備足夠的公眾利益與流通性"},{"value":"C","label":"空殼公司復牌嚴禁注入任何實體資產"},{"value":"D","label":"目標資產無須任何獨立審計"}],"answer":"B","explanation":"指南 2-43 至 2-44 頁 11.14 節指明：因缺乏足夠業務運作而提呈 RTO 復牌的發行人，注入的資產必須完全滿足新上市財務測試（包括三年業績期），並證明重組後的實體具備充足公眾利益（Adequate public interest）。","reference":"MBLR 14.54; HKSI Paper 5 Guide Topic 2 Section 11.14"},{"id":"T2-143","topic":"Topic 2","subtopic":"Notifiable Transactions - Circular Despatch Timetable","difficulty":"Level 2","question":"根據主板上市規則第 14.41 條，在刊發主要交易或非常重大收購事項（VSA）公告後，發行人通常必須在公告刊發後多長時間內，將通函（Circular）寄發予全體股東？","options":[{"value":"A","label":"在 3 個營業日內"},{"value":"B","label":"在刊發公告後 15 個營業日內（Within 15 business days after publication of the announcement）"},{"value":"C","label":"在 6 個月之內"},{"value":"D","label":"在股東大會召開當天早晨"}],"answer":"B","explanation":"依據 MBLR 14.41 常規規定：發行人刊發主要交易或重大交易公告後，必須在公告刊發後 15 個營業日內向股東寄發通函（若涉及編制複雜報告可向聯交所申請延期）。","reference":"MBLR 14.41; HKSI Paper 5 Guide Topic 2 Section 11.9"},{"id":"T2-144","topic":"Topic 2","subtopic":"Written Shareholders Approval in lieu of Meeting (Major Transactions)","difficulty":"Level 3","question":"根據主板第 14.44 條，上市發行人在進行主要交易（Major Transaction）時，在何種嚴格法定條件下，可以「股東書面批准」（Written shareholders' approval）代替召開實體股東大會？","options":[{"value":"A","label":"任何情況下均可由董事長一人書面批准替代"},{"value":"B","label":"若召開大會沒有任何股東須放棄表決權、且該書面批准已由持有該發行人逾 50% 表決權的一名股東（或一組密切聯繫的股東）簽署"},{"value":"C","label":"只要主要交易不涉及現金支付"},{"value":"D","label":"發行人處於短暫停牌期間"}],"answer":"B","explanation":"依據 MBLR 14.44：主要交易可接納書面批准代替實體大會的前提為：(1) 若召開大會，無任何股東須因重大利益衝突放棄投票；且 (2) 該書面批准已取得持有逾 50% 投票權的股東或有密切聯繫的股東群體簽署。","reference":"MBLR 14.44; HKSI Paper 5 Guide Topic 2 Section 11.9"},{"id":"T2-145","topic":"Topic 2","subtopic":"Share Transaction - Mandate for Consideration Shares","difficulty":"Level 2","question":"上市發行人進行股份交易（Share Transaction）時，若擬發行的對價股份是依據先前在股東週年大會上獲得的一般性授權（General Mandate）發行，則該股份交易：","options":[{"value":"A","label":"必須再次召開股東特別大會投票批准"},{"value":"B","label":"無須再尋求股東大會批准（No shareholders' approval is necessary）"},{"value":"C","label":"自動轉為非常重大收購事項"},{"value":"D","label":"代價股份必須強制鎖定 10 年"}],"answer":"B","explanation":"指南 2-42 頁 11.9 節合規表註釋 1 及 MBLR 14.33 指明：若代價股份是根據現有的一般性授權發行（或轉讓庫存股份），該股份交易無須再尋求股東批准。","reference":"MBLR 14.33; HKSI Paper 5 Guide Topic 2 Section 11.9 Note 1"},{"id":"T2-146","topic":"Topic 2","subtopic":"Discloseable Transaction - Announcement Obligation","difficulty":"Level 1","question":"一項被分類為「須予披露的交易」（Discloseable Transaction）的資產收購，發行人必須履行的上市規則合規程序為：","options":[{"value":"A","label":"通知聯交所並盡快刊登公告，但無須向股東印發通函亦無須股東大會批准"},{"value":"B","label":"必須委任獨立財務顧問（IFA）出具推薦函"},{"value":"C","label":"必須暫停所有股票交易 14 天"},{"value":"D","label":"必須向全體股東寄發審計報告"}],"answer":"A","explanation":"指南 2-42 頁 11.9 節合規表指明：須予披露的交易僅需：(1) 通知聯交所；及 (2) 刊發正式公告；完全無須向股東印發通函，亦無須股東大會批准或會計師報告。","reference":"MBLR 14.33; HKSI Paper 5 Guide Topic 2 Section 11.9"},{"id":"T2-147","topic":"Topic 2","subtopic":"Connected Transactions - Independent Board Committee (IBC)","difficulty":"Level 2","question":"在須經獨立股東批准的關連交易中，上市發行人董事會必須成立獨立董事委員會（Independent Board Committee, IBC）。該委員會的成員組成必須為：","options":[{"value":"A","label":"由全體執行董事組成"},{"value":"B","label":"僅由在該交易中沒有重大利益的獨立非執行董事組成（Consisting of INEDs only who have no material interest）"},{"value":"C","label":"由發行人的主要債權銀行代表組成"},{"value":"D","label":"由公司工會代表與監事組成"}],"answer":"B","explanation":"指南 2-13 頁 3.20 節及 MBLR 13.39(6), 14A.40 指明：獨立董事委員會必須僅由在該關連交易中沒有任何重大利益的獨立非執行董事組成，向獨立股東就交易條款是否公平合理提供建議。","reference":"MBLR 14A.40; HKSI Paper 5 Guide Topic 2 Section 3.20"},{"id":"T2-148","topic":"Topic 2","subtopic":"Notifiable Transactions - Calculation of Consideration Ratio","difficulty":"Level 3","question":"根據《上市規則》第 14.07(4) 條，在計算須予公布交易的「代價比率」（Consideration ratio）時，分母所採用的上市發行人市值基準為：","options":[{"value":"A","label":"發行人資產負債表上的總實收資本"},{"value":"B","label":"緊接交易日前 5 個營業日發行人股份在聯交所的平均收市價計算的發行人全部已發行普通股市值（Total market capitalisation of the issuer）"},{"value":"C","label":"發行人過去 12 個月的營業收入總和"},{"value":"D","label":"發行人上市時的招股市值"}],"answer":"B","explanation":"指南 2-41 頁 11.7 節及 MBLR 14.07(4) 規定：代價比率的計算方式為所支付或收取的代價除以發行人的總市值；而發行人市值是按緊接交易日前 5 個營業日該股票在聯交所的平均收市價計算。","reference":"MBLR 14.07(4); HKSI Paper 5 Guide Topic 2 Section 11.7"},{"id":"T2-149","topic":"Topic 2","subtopic":"Disciplinary Sanctions - Market Facilities Denial","difficulty":"Level 2","question":"根據主板第 2A.10(f) 條，上市委員會在行使紀律處分權力時，若上市發行人嚴重拒絕糾正違規行為，聯交所有權施加何種重大制裁？","options":[{"value":"A","label":"禁止經紀及財務顧問為該上市發行人行事或繼續行事（Banning dealers and financial advisers from acting for the issuer）"},{"value":"B","label":"沒收發行人全部實體存貨"},{"value":"C","label":"取消全體員工的強積金供款"},{"value":"D","label":"命令公司即刻無償解散"}],"answer":"A","explanation":"指南 2-56 頁 13.4(f) 節及 MBLR 2A.10(b) 指明：聯交所可施加的制裁包括：禁止交易商及財務顧問代表該發行人行事或繼續行事，以及暫停或取消其使用市場設施的權利。","reference":"MBLR 2A.10; HKSI Paper 5 Guide Topic 2 Section 13.4(f)"},{"id":"T2-150","topic":"Topic 2","subtopic":"Listing Review Committee - Review Quorum","difficulty":"Level 1","question":"上市覆核委員會（LRC）召開覆核聆訊以審理上市委員會的紀律或非紀律決定時，其每次聆訊的法定出席人數（Quorum）為：","options":[{"value":"A","label":"至少 2 名成員"},{"value":"B","label":"至少 5 名成員（Five members）"},{"value":"C","label":"至少 15 名成員"},{"value":"D","label":"全體 20 名成員必須全部到齊"}],"answer":"B","explanation":"指南 2-8 頁 2.12 節及 MBLR 2A.37A 明確規定：上市覆核委員會（LRC）召開會議的法定開會人數為 5 名成員（The quorum necessary for a meeting is five members）。","reference":"MBLR 2A.37A; HKSI Paper 5 Guide Topic 2 Section 2.12"},{"id":"T2-151","topic":"Topic 2","subtopic":"Mineral Companies (Chapter 18) - Minimum Portfolio of Reserves","difficulty":"Level 2","question":"根據主板上市規則第 18 章，礦業公司（Mineral Company）申請在聯交所主板上市時，必須符合下列哪項有關天然資源權益的核心資格要求？","options":[{"value":"A","label":"必須在上市前已實現連續三年錄得淨利潤超過 8,000 萬港元"},{"value":"B","label":"必須擁有至少一項可確定控制權的資源組合，包含具備實質意義的「控制資源量」（Indicated Resources）或「概略儲量」（Probable Reserves），並由合資格獨立專家出具報告"},{"value":"C","label":"必須將全部開採出的礦產以現貨形式交割予香港特區政府存管"},{"value":"D","label":"僅需持有海外任何地區的探礦意向書即可，無須任何合資格儲量證明"}],"answer":"B","explanation":"指南 2-67 頁 9.97 節及 MBLR 18.03 規定：礦業公司申請上市時，必須擁有至少包含具商業價值的控制資源量（Indicated resources）或概略儲量（Probable reserves）的投資組合，且須有足夠權利參與勘探及開採，並編制合資格人士報告（Competent Person's Report）。","reference":"MBLR Chapter 18; HKSI Paper 5 Guide Topic 2 Section 9.97"},{"id":"T2-152","topic":"Topic 2","subtopic":"Infrastructure Project Companies - Financial Waiver","difficulty":"Level 2","question":"根據主板上市規則第 8.05B 條，基建項目公司（如興建收費公路、橋樑、電廠、機場等）在申請主板上市時，可向聯交所申請何種特別寬限或豁免？","options":[{"value":"A","label":"完全免除刊發招股章程的法定責任"},{"value":"B","label":"在符合特定條件下（如擁有特許經營權且年限充足），可獲聯交所豁免遵守常規的三年營業紀錄期及盈利/財務資格測試要求"},{"value":"C","label":"上市首日公眾持股量可低至 0.1%"},{"value":"D","label":"免除委聘任何獨立保薦人"}],"answer":"B","explanation":"指南 2-50 頁 9.7 節、2-67 頁 9.97 節及 MBLR 8.05B 指出：基建項目工程通常建設期長、前期無營運收益，聯交所可在其具備法定特許協議且滿足特定標準下，豁免其遵守 MBLR 8.05 的盈利及財務常規要求。","reference":"MBLR 8.05B; HKSI Paper 5 Guide Topic 2 Section 9.7, 9.97"},{"id":"T2-153","topic":"Topic 2","subtopic":"Dual Primary vs Secondary Listing - Regulation Scope","difficulty":"Level 2","question":"海外上市企業在香港聯交所尋求掛牌時，「雙重主要上市」（Dual Primary Listing）與「第二上市」（Secondary Listing）在香港法規適用範圍上的最重大差異為：","options":[{"value":"A","label":"第二上市受香港全部法定證券法例及上市規則嚴格全面管轄；雙重主要上市則享有全面豁免"},{"value":"B","label":"雙重主要上市必須全面嚴格遵守香港《上市規則》全部條文及《收購守則》；而第二上市發行人則可享有聯交所多項規則的自動或特定豁免（如公眾持股比例、關連交易等常規），且通常獲豁免遵守香港《收購守則》"},{"value":"C","label":"雙重主要上市的股票嚴禁以港幣進行二級市場結算"},{"value":"D","label":"兩者在法律與監管權力上完全一模一樣，沒有任何制度區分"}],"answer":"B","explanation":"指南 2-44 至 2-45 頁 8.40–8.43 節、2-67 頁 9.99 節及 3-5 頁 2.1 節指明：雙重主要上市發行人將香港視為主要監管地之一，須遵守全部常規《上市規則》及《收購守則》；第二上市則是以海外為主市場，聯交所給予廣泛的上市規則寬免，且香港證監會通常豁免其遵守《收購守則》。","reference":"MBLR Chapter 19C; HKSI Paper 5 Guide Topic 2 Section 8.40-8.43; Topic 3 Section 2.1"},{"id":"T2-154","topic":"Topic 2","subtopic":"Greater China Issuers - Qualifying Exchanges","difficulty":"Level 2","question":"根據主板上市規則第 19C 章，業務重心在大中華區的「大中華發行人」（Greater China Issuers）若擬在香港進行第二上市，其原上市的主要外國交易所必須為聯交所認可的「合資格交易所」（Qualifying Exchanges）。下列哪一間機構屬於合資格交易所名單？","options":[{"value":"A","label":"新加坡交易所主板（SGX）"},{"value":"B","label":"紐約證券交易所（NYSE）、納斯達克（Nasdaq）或倫敦證券交易所主板的高級上市板塊（LSE Premium Listing）"},{"value":"C","label":"東京證券交易所（TSE）"},{"value":"D","label":"法蘭克福證券交易所（FWB）"}],"answer":"B","explanation":"指南 2-45 頁 8.42 節註釋 2 及 MBLR 19C.01 明確定義：大中華發行人的「合資格交易所」（Qualifying exchanges）特指三家：紐約證券交易所（NYSE）、納斯達克股票市場（Nasdaq）、以及倫敦證券交易所主板的高級上市板塊（LSE Premium segment）。","reference":"MBLR 19C.01; HKSI Paper 5 Guide Topic 2 Section 8.42 Note 2"},{"id":"T2-155","topic":"Topic 2","subtopic":"Dual Primary Transition - Trading Migration","difficulty":"Level 3","question":"某大中華海外發行人在香港進行第二上市。根據《上市規則》第 19C 章，若在最近一個財政年度內，該發行人普通股在全球成交量的多少比例轉移至香港聯交所市場進行交易，該發行人將被聯交所視為主要上市地已轉移，必須轉型為「雙重主要上市」？","options":[{"value":"A","label":"達到 10% 以上"},{"value":"B","label":"達到 25% 以上"},{"value":"C","label":"55% 或以上（55% or more of the total worldwide trading volume in the latest financial year）"},{"value":"D","label":"達到 99% 以上"}],"answer":"C","explanation":"依據 MBLR 19C.13E：若第二上市的大中華發行人在最近一個完整財政年度內，其股份在香港市場的成交量達到其全球總成交量的 55% 或以上，聯交所將認定其交易重心已實質轉移至香港，發行人將喪失第二上市寬免，轉為主要上市（Dual-primary）。","reference":"MBLR 19C.13E; HKSI Paper 5 Guide Topic 2 Section 8.40-8.42; Topic 3 Section 2.2 Note"},{"id":"T2-156","topic":"Topic 2","subtopic":"Collective Investment Schemes (Chapter 20) - SFC Authorisation","difficulty":"Level 2","question":"根據主板上市規則第 20 章，集體投資計劃（CIS，如房地產投資信託基金 REITs 或互惠基金）若擬在聯交所掛牌上市，其核心前置法定條件為：","options":[{"value":"A","label":"必須由全港所有持牌銀行聯名簽署推薦書"},{"value":"B","label":"該集體投資計劃必須首先依據 SFO 第 IV 部獲得香港證監會（SFC）的正式認可（Authorised by the SFC）"},{"value":"C","label":"必須在上市首日向所有香港居民派發實物單位"},{"value":"D","label":"基金經理必須由香港終審法院首席法官指派"}],"answer":"B","explanation":"指南 2-68 頁 9.101 節及 MBLR Chapter 20 指明：聯交所接納上市的 CIS 原則上必須為已獲證監會根據 SFO 第 IV 部認可的計劃；但證監會認可並不自動保證獲聯交所批准上市，仍須符合上市規則第 20 章規定。","reference":"MBLR Chapter 20; HKSI Paper 5 Guide Topic 2 Section 9.101"},{"id":"T2-157","topic":"Topic 2","subtopic":"Investment Companies (Chapter 21) - Restrictions","difficulty":"Level 3","question":"根據主板第 21 章上市的投資公司（Investment Companies，非 SFC 認可的常規基金），聯交所為保障公眾投資者，對其投資組合與股權設有何種特定限制？","options":[{"value":"A","label":"必須將 100% 資金投資於同一家香港初創企業"},{"value":"B","label":"投資組合必須多元化，不得擁有任何單一投資對象超過 20% 的投票權，且不得主動參與任何被投資公司的日常商業營運與管理"},{"value":"C","label":"發行人的全體股東人數不得超過 10 人"},{"value":"D","label":"投資公司嚴禁聘用外部投資經理"}],"answer":"B","explanation":"依據 MBLR Chapter 21 及指南 2-68 頁 9.103 節：第 21 章投資公司必須維持資產分散原則，嚴禁取得對被投資對象的控制權（通常不得持有單一公司逾 20% 表決權），亦不得參與被投資企業的日常管理控制。","reference":"MBLR Chapter 21; HKSI Paper 5 Guide Topic 2 Section 9.103"},{"id":"T2-158","topic":"Topic 2","subtopic":"Connected Transactions - Continuing Connected Transactions (CCT)","difficulty":"Level 2","question":"根據《上市規則》第 14A.51 條至第 14A.53 條，上市發行人與關連人士訂立持續關連交易（Continuing Connected Transactions, CCT）時，必須遵守何種特定監管架構？","options":[{"value":"A","label":"交易協議期限可為無限期，且無須設定任何金額上限"},{"value":"B","label":"必須訂立書面協議且期限通常不得超過三年（特殊行業除外），且必須為每個財政年度設定明確的「年度上限」（Annual Caps），並在年報中由獨立非執董及核數師進行年度審閱"},{"value":"C","label":"交易作價必須強制由聯交所上市委員會親自定價"},{"value":"D","label":"每年交易總額不得超過 10 萬港元"}],"answer":"B","explanation":"依據 MBLR 14A.51–14A.56：持續關連交易必須：(1) 簽訂書面協議；(2) 協議期限通常不超過三年；(3) 設定貨幣形式的年度上限（Annual Caps）；(4) 每年由 INED 及外聘核數師審核並於年報披露合規結論。","reference":"MBLR 14A.51-14A.56; HKSI Paper 5 Guide Topic 2 Section 11.25"},{"id":"T2-159","topic":"Topic 2","subtopic":"CCT - Auditor Annual Review Confirmation","difficulty":"Level 2","question":"根據主板第 14A.56 條，上市發行人的外聘核數師受聘對持續關連交易（CCT）進行年度審閱時，核數師必須向董事會出具函件確認的事項包括：","options":[{"value":"A","label":"保證發行人股價將在未來三年內持續上漲"},{"value":"B","label":"交易已獲董事會批准、在各重大方面按照協議條款及定價政策進行，且交易總額「並未超過發行人設定的年度上限」（Have not exceeded the annual caps）"},{"value":"C","label":"關連方全體董事的私人財產已被充分審計"},{"value":"D","label":"發行人所有關連人士已放棄香港永久居留權"}],"answer":"B","explanation":"指南 2-47 頁 11.25 節及 MBLR 14A.56 指明：外聘核數師每年必須出具函件確認：(1) 獲董事會批准；(2) 符合定價政策；(3) 依協議條款執行；(4) 未超逾既定年度上限。","reference":"MBLR 14A.56; HKSI Paper 5 Guide Topic 2 Section 11.25"},{"id":"T2-160","topic":"Topic 2","subtopic":"Connected Transactions - Voting Abstention at SGM","difficulty":"Level 3","question":"在上市發行人召開股東特別大會審議一項須經獨立股東批准的關連交易時，下列哪位股東法定必須「放棄表決權」（Abstain from voting）？","options":[{"value":"A","label":"持股 0.01% 的無關聯公眾退休散戶"},{"value":"B","label":"在該交易中擁有重大利益的關連人士及其任何聯繫人（Any connected person with a material interest and its associates）"},{"value":"C","label":"全體獨立非執行董事"},{"value":"D","label":"透過香港中央結算代名人持股的所有機構投資者"}],"answer":"B","explanation":"指南 2-42 頁 11.9 節註釋 2 及 MBLR 14A.36 規定：在關連交易的股東大會上，凡在該交易中擁有重大利益的任何股東（包括關連人士）及其緊密聯繫人，均必須放棄表決權，表決必須以投票方式（Poll）進行。","reference":"MBLR 14A.36; HKSI Paper 5 Guide Topic 2 Section 11.9 Note 2"},{"id":"T2-161","topic":"Topic 2","subtopic":"Notifiable Transactions - Aggregation of Acquisitions from New Control Party","difficulty":"Level 3","question":"根據《上市規則》第 14A.82 條及第 14.23 條，若發行人在某人取得該發行人控制權（Control）後的多長時間內，向該新控制人或其聯繫人進行資產收購，聯交所通常會將該等交易予以合併計算並審查是否存在規避行為？","options":[{"value":"A","label":"在 6 個月之內"},{"value":"B","label":"在 24 個月至 36 個月期間內（Within 24 to 36 months after gaining control）"},{"value":"C","label":"在 10 年之後"},{"value":"D","label":"僅限於控制權變更當天"}],"answer":"B","explanation":"指南 2-48 頁 11.29(b) 節及 2-45 頁 11.18 節指明：凡新控股方取得控制權後 24 個月內（關連交易合併審查）至 36 個月內（反收購明線測試），發行人向該人及其聯繫人收購資產，聯交所將強力啟動合併計算以審查借殼規避行為。","reference":"MBLR 14.06B, 14A.82; HKSI Paper 5 Guide Topic 2 Section 11.18, 11.29"},{"id":"T2-162","topic":"Topic 2","subtopic":"Share Schemes - Overall Scheme Limit (10% Limit)","difficulty":"Level 2","question":"根據主板上市規則第 17.03B 條，上市發行人所有採納的股份期權計劃及股份獎勵計劃，其涉及的所有新股授權總額上限（Scheme Mandate Limit），不得超過發行人採納該計劃當日已發行股份（不含庫存股）的多少比例？","options":[{"value":"A","label":"不得超過 1%"},{"value":"B","label":"不得超過 5%"},{"value":"C","label":"不得超過 10%（Not exceed 10% of the issued shares）"},{"value":"D","label":"不得超過 50%"}],"answer":"C","explanation":"依據 MBLR 17.03B 及指南 2-66 頁 9.95 節：發行人採納的所有股份激勵計劃，因授出期權或股份獎勵而可能發行的新股上限（計劃授權限額），累計不得超過採納日已發行股份（不計庫存股）的 10%。","reference":"MBLR 17.03B; HKSI Paper 5 Guide Topic 2 Section 9.95"},{"id":"T2-163","topic":"Topic 2","subtopic":"Share Schemes - Service Provider Sublimit","difficulty":"Level 2","question":"根據主板第 17 章新規，發行人若擬將股份計劃的獎勵授予服務提供者（Service Providers），發行人必須在 10% 總限額內：","options":[{"value":"A","label":"單獨設立「服務提供者分項限額」（Service Provider Sublimit），並獲得股東大會單獨審批通過"},{"value":"B","label":"將公司所有業務外判給該服務提供者"},{"value":"C","label":"免除任何服務提供者身份的盡職審查"},{"value":"D","label":"要求服務提供者全額繳交 50% 履約保證金"}],"answer":"A","explanation":"依據 MBLR 17.03B(1)：在 10% 總限額框架下，若激勵對象包含外部服務提供者，發行人必須在通函中清楚訂明並經股東大會獨立投票批准「服務提供者分項限額」（Service provider sublimit）。","reference":"MBLR 17.03B; HKSI Paper 5 Guide Topic 2 Section 9.93-9.95"},{"id":"T2-164","topic":"Topic 2","subtopic":"Share Schemes - Minimum Vesting Period (12 Months)","difficulty":"Level 2","question":"根據主板上市規則第 17.03F 條，股份期權或股份獎勵在授出後，常規法定最短「歸屬期」（Vesting Period）要求為：","options":[{"value":"A","label":"授出當天即可即時 100% 歸屬"},{"value":"B","label":"不少於 12 個月（Not less than 12 months），除非符合薪酬委員會批准的特定例外情況"},{"value":"C","label":"至少 5 年"},{"value":"D","label":"至少 10 年"}],"answer":"B","explanation":"依據 MBLR 17.03F：為確保股權激勵起到長期激勵與留才效果，授予期權或獎勵股份的最短歸屬期不得少於 12 個月（Not less than 12 months）；若短於 12 個月，必須符合預設客觀標準並由薪酬委員會解釋批准。","reference":"MBLR 17.03F; HKSI Paper 5 Guide Topic 2 Section 9.95"},{"id":"T2-165","topic":"Topic 2","subtopic":"Share Schemes - 1% Individual Limit in 12 Months","difficulty":"Level 3","question":"根據《上市規則》第 17.03D 條，在任何 12 個月期間內，向任何單一參與者授出的股份期權及獎勵合計若超過發行人已發行股本的多少比例時，必須獲得股東大會獨立批准？","options":[{"value":"A","label":"超過 0.1%"},{"value":"B","label":"超過 1%（Exceeds 1% of the relevant class of securities in issue）"},{"value":"C","label":"超過 5%"},{"value":"D","label":"超過 10%"}],"answer":"B","explanation":"依據 MBLR 17.03D：若在任何 12 個月內向任何個別參與者授予的股份（計及已行使、未行使及已歸屬者）合計超過發行人已發行股份的 1%，該項超額授予必須由發行人召開股東大會獨立表決批准，該參與者及其聯繫人須放棄表決。","reference":"MBLR 17.03D; HKSI Paper 5 Guide Topic 2 Section 9.95"},{"id":"T2-166","topic":"Topic 2","subtopic":"Share Schemes - Grants to Directors / Substantial Shareholders","difficulty":"Level 3","question":"根據主板第 17.04 條，向發行人的董事、最高行政人員或大股東（或彼等各自的聯繫人）授出期權或股份獎勵時，法定批准程序為：","options":[{"value":"A","label":"只需由被授予人個人在合同上簽字"},{"value":"B","label":"必須由全體獨立非執行董事批准；且若向大股東（或持有逾 0.1% 股權的 INED）授出獎勵股份並超過 0.1% 門檻時，必須由股東大會獨立投票批准"},{"value":"C","label":"必須取得全體債權人一致書面同意"},{"value":"D","label":"該等人士依法嚴禁獲取任何形式的股份激勵"}],"answer":"B","explanation":"指南 2-67 頁 9.96 節及 MBLR 17.04 指明：授予董事、行政總裁或大股東的任何激勵，必須先獲全體 INED 批准；向大股東或 INED 授予超過 0.1% 的獎勵股份時，必須刊發通函並獲獨立股東於大會上投票批准。","reference":"MBLR 17.04; HKSI Paper 5 Guide Topic 2 Section 9.96"},{"id":"T2-167","topic":"Topic 2","subtopic":"General Mandate - 20% Issue Limit","difficulty":"Level 2","question":"根據主板上市規則第 13.36(2) 條，上市發行人在股東週年大會上尋求股東授予董事會增發股份的「一般性授權」（General Mandate），其法定最高增發股數上限為：","options":[{"value":"A","label":"不超過通過決議案當日已發行股份數目的 5%"},{"value":"B","label":"不超過通過決議案當日已發行股份數目（不含庫存股）的 20%（Not exceed 20% of the number of issued shares）"},{"value":"C","label":"不超過 50%"},{"value":"D","label":"無上限，授權董事會全權處置"}],"answer":"B","explanation":"指南 1-49 頁 Question 7 答案、2-41 頁 8.25 節註釋及 MBLR 13.36(2) 規定：常規一般性授權配發新股的法定上限為通過決議當天發行人已發行股份（不計庫存股份）的 20%（另加購回授權所購回最高 10% 的股份額度）。","reference":"MBLR 13.36(2); HKSI Paper 5 Guide Topic 2 Section 8.25"},{"id":"T2-168","topic":"Topic 2","subtopic":"General Mandate - 20% Discount Ceiling for Placing","difficulty":"Level 2","question":"根據主板第 13.36(5) 條，上市發行人依據一般性授權進行新股配售時，配售價在折讓幅度上受到的法定限制為：","options":[{"value":"A","label":"折讓幅度無限制，可折讓 99%"},{"value":"B","label":"配售價較基準價的折讓幅度不得高於 20%（Discount of not more than 20% to the benchmarked price），除非發行人能證明處於極度財務困境"},{"value":"C","label":"必須嚴格溢價發行，嚴禁任何折讓"},{"value":"D","label":"只能按每股淨資產值定價"}],"answer":"B","explanation":"依據 MBLR 13.36(5)：依據一般授權進行配售發行新股，其發行價相較基準價（簽約日或前五個交易日平均收市價較高者）的折讓幅度不得超過 20%，以保護現有股東權益不被過度稀釋。","reference":"MBLR 13.36(5); HKSI Paper 5 Guide Topic 2 Section 8.14"},{"id":"T2-169","topic":"Topic 2","subtopic":"Spin-off Listings (Practice Note 15) - Principles","difficulty":"Level 3","question":"上市發行人若擬將旗下部分業務分拆獨立上市（Spin-off），根據主板《第 15 項應用指引》（Practice Note 15），發行人母體留存業務必須符合何種資格標準？","options":[{"value":"A","label":"母體公司留存業務可以完全停止運作"},{"value":"B","label":"母體公司扣除分拆業務後，其留存業務本身必須能夠獨立滿足主板上市的各項財務與運作資格要求"},{"value":"C","label":"分拆後母公司必須即時註銷清盤"},{"value":"D","label":"分拆僅能向 GEM 板塊進行，嚴禁在主板獨立上市"}],"answer":"B","explanation":"指南 2-13 頁 3.20(b) 節及 MBLR Practice Note 15 指明：進行分拆上市時，母公司集團除分拆實體外，剩餘的保留業務（Retained business）自身必須具備足夠規模及實力，獨立符合《上市規則》第 8 章的新上市財務資格標準。","reference":"MBLR Practice Note 15; HKSI Paper 5 Guide Topic 2 Section 3.20"},{"id":"T2-170","topic":"Topic 2","subtopic":"Practice Note 15 - Assured Entitlement to Shareholders","difficulty":"Level 2","question":"根據主板 Practice Note 15 第 3(f) 段，母公司進行分拆上市時，對現有母公司股東負有何種權益保障責任？","options":[{"value":"A","label":"必須以現金全額回購所有小股東持股"},{"value":"B","label":"母公司必須為其現有股東提供對分拆新實體股份的「保證配額」（Assured entitlement，例如透過實物分派或優先認購權），除非該安排已在股東大會獲少數股東批准放棄"},{"value":"C","label":"現有股東嚴禁認購分拆實體的任何股份"},{"value":"D","label":"保證配額只能全數分配予控股股東一人"}],"answer":"B","explanation":"依據 MBLR Practice Note 15 para 3(f)：母公司進行分拆時，必須向其現有股東提供分拆實體股份的保證配額（Assured entitlement，以分派或優先申請權形式），若未提供，必須在股東大會經少數股東決議案特別批准。","reference":"MBLR Practice Note 15; HKSI Paper 5 Guide Topic 2 Section 3.20"},{"id":"T2-171","topic":"Topic 2","subtopic":"Pre-IPO Investments Guidance - Timing Restrictions","difficulty":"Level 3","question":"根據香港交易所《新上市申請人指南》及上市決策，關於上市前投資（Pre-IPO Investments）的時限要求，最後一輪上市前投資的資金繳付完成時間通常必須為：","options":[{"value":"A","label":"在正式遞交上市申請表格（Form A1）當天早上"},{"value":"B","label":"在首次遞交上市申請表格之日前至少 28 個淨日（至少 28 clear days），或在預期上市交易開始前至少 180 個淨日全數結清並不可撤回地入賬"},{"value":"C","label":"上市首日掛牌後 24 小時之內"},{"value":"D","label":"招股章程印發當天"}],"answer":"B","explanation":"依據 HKEX Guide for New Listing Applicants 及監管指引：上市前投資必須在發行人呈交 Form A1 前至少 28 個淨日全數清繳到賬；若未達此時限，則該輪投資必須在發行人預期上市前至少 180 個淨日完成，以確保投資真正處於發行定價之前。","reference":"HKEX Guide for New Listing Applicants; HKSI Paper 5 Guide Topic 2 Section 3.1"},{"id":"T2-172","topic":"Topic 2","subtopic":"Pre-IPO Investments - Special Rights Divestment","difficulty":"Level 3","question":"上市前投資者在投資協議中常會約定特定特權條款。下列哪一項特權在申請人於聯交所掛牌上市時，**嚴禁**繼續保留並必須在上市時完全終止？","options":[{"value":"A","label":"普通股附帶的按比例派息權"},{"value":"B","label":"董事任命權（作為一般股東投票權行使）"},{"value":"C","label":"保證發行人以固定利息回購股份的認沽期權（Put option）、最優惠條款（Most Favoured Nation）、負面否決權及清算優先權（Liquidation preference）"},{"value":"D","label":"收取公司公開財務報表的知情權"}],"answer":"C","explanation":"依據聯交所對 Pre-IPO 投資特權的指引：所有損害一股一票及同股同權原則的特權，如認沽期權（對發行人的索償請求）、對重大決策的一票否決權、清算優先受償權等，在發行人上市前必須全面終止失效。","reference":"HKEX Guidance Letter HKEX-GL43-12; HKSI Paper 5 Guide Topic 2 Section 3.1"},{"id":"T2-173","topic":"Topic 2","subtopic":"Cornerstone Investors - Lock-up & Preferential Treatment","difficulty":"Level 2","question":"在新股公開招股（IPO）中引入「基石投資者」（Cornerstone Investors），根據聯交所指引及市場常規，下列各項要求何者正確？","options":[{"value":"A","label":"基石投資者可以以招股價之半價認購股份，且首日可隨意清倉"},{"value":"B","label":"基石投資者必須按最終發售價認購股份、不得享有任何直接或間接的利益回扣或下行保障，且其認購的股份必須受制於自上市日起至少 6 個月的禁售期（Lock-up for at least 6 months）"},{"value":"C","label":"基石投資者持股可自由計入新股上市自由流通量（Free float）"},{"value":"D","label":"基石投資者名單嚴禁在招股章程中公開披露"}],"answer":"B","explanation":"指南 2-48 頁 9.4(j) 節及 HKEX 指引：基石投資者必須按公開發售價認購、不得享受任何排他性條款或保底利益，招股書必須詳盡披露其身份與認購額，且必須承諾自上市之日起至少 6 個月的股票禁售期（Lock-up）。","reference":"HKEX Guidance Letter HKEX-GL51-13; HKSI Paper 5 Guide Topic 2 Section 9.4(j)"},{"id":"T2-174","topic":"Topic 2","subtopic":"Anchor Investors vs Cornerstone Investors","difficulty":"Level 2","question":"在香港 IPO 簿記建檔配售中，「錨定投資者」（Anchor Investors）與「基石投資者」（Cornerstone Investors）的主要程序差異為：","options":[{"value":"A","label":"錨定投資者必須在招股書封面載明姓名並受制於 5 年禁售期"},{"value":"B","label":"錨定投資者是在簿記建檔過程中引進的大額機構投資者，其獲配股份通常不受法定 6 個月禁售期的強制約束（無強制鎖定期），亦無須在招股章程中單獨指名披露其投資協議"},{"value":"C","label":"錨定投資者屬於核心關連人士"},{"value":"D","label":"錨定投資者只能認購 GEM 股份"}],"answer":"B","explanation":"市場常規及上市指南指明：基石投資者在招股書印發前確定並在招股書披露，強制鎖定 6 個月；錨定投資者則是在建檔簿記期間下達大額訂單的機構買家，不受 6 個月強制鎖定期限制，提供早期建檔動能。","reference":"HKSI Paper 5 Guide Topic 2 Section 10.1, 10.8"},{"id":"T2-175","topic":"Topic 2","subtopic":"Overall Coordinator (OC) - Engagement Agreement Timing","difficulty":"Level 3","question":"根據《上市規則》第 3A.43 條及《操守準則》第 21 段，上市申請人委聘整體協調人（Overall Coordinator）時，其書面聘用合約（Written agreement）必須在何時簽訂？","options":[{"value":"A","label":"必須在整體協調人或其集團成員開展任何簿記建檔或相關活動之前簽訂（Prior to conducting activities）"},{"value":"B","label":"在上市敲鑼掛牌當天下午補簽即可"},{"value":"C","label":"在招股章程印刷出廠後 10 天內簽訂"},{"value":"D","label":"在上市申請失效後簽訂"}],"answer":"A","explanation":"指南 2-11 頁 3.11 節及 MBLR 3A.43 明確指明：在整體協調人（或其集團成員）開展任何建檔或配售活動之前，必須與發行人正式簽訂書面協議，訂明職責、費用安排（包括固定及酌情費用）及資料提供義務。","reference":"MBLR 3A.43; Code of Conduct para 21; HKSI Paper 5 Guide Topic 2 Section 3.11"},{"id":"T2-176","topic":"Topic 2","subtopic":"Overall Coordinator Fee Arrangement Breakdown","difficulty":"Level 2","question":"根據主板第 3A 章及證監會規定，整體協調人（OC）與發行人簽訂的費用安排中，發行人必須向聯交所申報並載於協議中的費用細節為：","options":[{"value":"A","label":"僅申報全體初級員工的餐飲補貼"},{"value":"B","label":"承銷總費用、固定費用與酌情費用的比例劃分，以及酌情費用的具體支付標準與時間表"},{"value":"C","label":"保證將發行人市值的 10% 贈與整體協調人主管"},{"value":"D","label":"完全免除披露任何費用安排"}],"answer":"B","explanation":"指南 2-11 頁 3.11 節註釋 1 及 2-59 頁 9.48(c) 節指出：協議必須明確拆解包銷費架構，清晰界定固定費用（Fixed fees）與酌情費用（Discretionary fees）的分配比例，並於聆訊前申報呈交聯交所，杜絕灰色收費與不透明利益安排。","reference":"MBLR 3A.43, 9.11; HKSI Paper 5 Guide Topic 2 Section 3.11, 9.48"},{"id":"T2-177","topic":"Topic 2","subtopic":"Capital Market Intermediaries (CMIs) - Rebates Prohibition","difficulty":"Level 2","question":"根據證監會《操守準則》第 21 段，資本市場中介人（CMI）在處理新股認購與配售活動時，受到下列哪項嚴格禁止？","options":[{"value":"A","label":"嚴禁向投資者發送英文版路演投影片"},{"value":"B","label":"嚴禁向任何投資者提供任何直接或間接的「回佣／折扣」（Rebates），或向投資者轉承任何發行費用"},{"value":"C","label":"嚴禁在香港市區租賃辦公室"},{"value":"D","label":"嚴禁向客戶收取經紀佣金"}],"answer":"B","explanation":"指南 1-40 頁 4.49 節及 Code of Conduct para 21 明文嚴禁中介人提供回佣（Rebates）或不正當折扣，確保所有投資者按統一透明的價格認購，防止扭曲簿記建檔的真實需求表象。","reference":"Code of Conduct para 21; HKSI Paper 5 Guide Topic 1 Section 4.49; Topic 2 Section 9.4"},{"id":"T2-178","topic":"Topic 2","subtopic":"FINI Platform - Settlement Cycle (T+2)","difficulty":"Level 1","question":"香港聯交所及香港結算自全面啟用 FINI 結算平台後，常規新股 IPO 由定價日（Pricing Day）至股份正式在聯交所掛牌買賣的結算時間表縮短為：","options":[{"value":"A","label":"T+10 個營業日"},{"value":"B","label":"T+5 個營業日"},{"value":"C","label":"T+2 個營業日（T+2 basis）"},{"value":"D","label":"T+30 個營業日"}],"answer":"C","explanation":"指南 2-59 頁 9.50 節註釋及 FINI 營運規則指明：FINI 平台將過往香港 IPO 的 T+5 結算週期全面壓縮至 T+2 營業日，大幅降低投資者資金凍結時間及定價至掛牌期間的市場波動風險。","reference":"HKEX FINI Rules; HKSI Paper 5 Guide Topic 2 Section 9.50 Note"},{"id":"T2-179","topic":"Topic 2","subtopic":"FINI Platform - Pre-funding Model","difficulty":"Level 2","question":"在 FINI 架構下，為防範經紀行因新股散戶超額認購而產生極端的流動資金緊縮，香港結算所採用的新資金預先繳付模式為：","options":[{"value":"A","label":"必須全額 100% 預先凍結超額認購的全部千億資金"},{"value":"B","label":"經紀行只需就其認購客戶中「最高獲配金額上限」（即最高可能分配額，而非超額總認購名義額）預先繳付資金"},{"value":"C","label":"完全免除任何預繳款項，全部在掛牌滿一年後結算"},{"value":"D","label":"由香港外匯基金無償為所有散戶全額墊資"}],"answer":"B","explanation":"FINI 制度核心改革之一為壓縮預繳資金：券商無須為天量超額認購資金全額備付，結算系統僅根據最高可能獲配股數的最高風險暴露額度計算預繳保證金，消除了巨額資金凍結對香港銀行同業拆息市場的衝擊。","reference":"HKEX FINI Framework; HKSI Paper 5 Guide Topic 2 Section 9.50"},{"id":"T2-180","topic":"Topic 2","subtopic":"Verification Notes - Purpose & Director Signing","difficulty":"Level 2","question":"在上市文件（招股章程）印刷印發前夕，由發行人法律顧問協調編制的「核證筆記」（Verification Notes），其主要法律功能是：","options":[{"value":"A","label":"向全港散戶計算上市後首月預期股息回報"},{"value":"B","label":"供全體董事逐段核對招股章程中的每項事實陳述並簽署確認，確保章程所載全部重大事實均有確鑿證據支持且真實準確，作為董事履行審慎責任與抗辯的重要依據"},{"value":"C","label":"作為承銷商向發行人索取額外獎金的合約"},{"value":"D","label":"取代招股章程向公司註冊處正式存檔"}],"answer":"B","explanation":"指南 2-33 頁 7.18 節及 3-10 頁 3.13–3.14 節指明：核證筆記（Verification Notes）供全體董事於招股書印發前書面審批簽署，核心目的是讓董事確認招股書每項內容均有客觀證據支持（True and correct），防範失實陳述法律責任。","reference":"CWUMPO; HKSI Paper 5 Guide Topic 2 Section 7.18; Topic 3 Section 3.13"},{"id":"T2-181","topic":"Topic 2","subtopic":"Promoters Civil and Criminal Liability (CWUMPO)","difficulty":"Level 2","question":"根據 CWUMPO 第 40(1)(c) 條及第 40A(1) 條，若招股章程載有任何重大失實陳述或具誤導性的資料，除發行人董事外，下列哪類主體依法同樣須負上民事賠償及刑事責任？","options":[{"value":"A","label":"發行人的「發起人」（Promoters of the company issuing a prospectus）"},{"value":"B","label":"招股章程的印刷廠初級印刷工"},{"value":"C","label":"負責派發實體申請表格的銀行大堂服務員"},{"value":"D","label":"在報章上轉載財經新聞的通訊社排版員"}],"answer":"A","explanation":"指南 2-34 頁 7.22 節及 CWUMPO ss. 40(1)(c), 40A(1) 指出：招股章程發行法人的「發起人」（Promoters）依法與董事承擔同等的法定民事及刑事失實陳述責任。","reference":"CWUMPO ss. 40(1)(c), 40A(1); HKSI Paper 5 Guide Topic 2 Section 7.22"},{"id":"T2-182","topic":"Topic 2","subtopic":"Publicity Materials Restrictions (MBLR 9.08)","difficulty":"Level 2","question":"根據主板上市規則第 9.08 條，在上市申請審查期間，新上市申請人及其代理人發布任何有關證券發行的宣傳材料（Publicity material）時，必須遵守何種規定？","options":[{"value":"A","label":"可隨意在電視或社交媒體投放未經審閱的宣傳廣告"},{"value":"B","label":"在香港發布的任何宣傳材料，必須事先經過聯交所審閱，且材料必須完全符合所有法定法規要求"},{"value":"C","label":"宣傳材料中必須承諾上市首日股價漲幅超過 50%"},{"value":"D","label":"宣傳材料只能由聯交所主席親自手寫印發"}],"answer":"B","explanation":"指南 2-58 頁 9.47 節及 MBLR 9.08 明確規定：新申請人或其代理人發布的任何證券發行宣傳材料，在獲聯交所審閱前不得在香港發布（Unless and until SEHK has reviewed it），且內容須嚴格符合法例要求。","reference":"MBLR 9.08; HKSI Paper 5 Guide Topic 2 Section 9.47"},{"id":"T2-183","topic":"Topic 2","subtopic":"Allotment Results Announcement Timeline","difficulty":"Level 2","question":"根據主板第 12.08 條，新上市發行人在公開發售股份完成配發後，刊登「配發結果公告」（Allotment Results Announcement）的法定時限為：","options":[{"value":"A","label":"在股份開始買賣當天下午 4 時"},{"value":"B","label":"不得遲於股份上市前一個營業日晚上 11 時（Not later than 11:00 pm on the business day before listing）"},{"value":"C","label":"在上市滿 30 天後"},{"value":"D","label":"在招股書寄發前 1 小時"}],"answer":"B","explanation":"指南 2-61 頁 9.65 節及 MBLR 12.08 指明：就新上市發行而言，發售結果公告、配發基準等，必須在上市前一個營業日晚上 11:00 前（Not later than 11:00 pm on the business day before listing）於交易所網站正式公布。","reference":"MBLR 12.08; HKSI Paper 5 Guide Topic 2 Section 9.65"},{"id":"T2-184","topic":"Topic 2","subtopic":"False Market Clarification - MBLR 13.09","difficulty":"Level 2","question":"根據主板第 13.09 條，當上市發行人的證券出現異動，聯交所認為市場可能存在虛假市場（False market）時，發行人負有何種監管義務？","options":[{"value":"A","label":"發行人可以拒絕與聯交所對話並要求全體股東保持沉默"},{"value":"B","label":"發行人在諮詢聯交所後，必須在合理切實可行下盡快向市場公布避免出現虛假市場所需的資訊（Release information necessary to avoid a false market）"},{"value":"C","label":"發行人必須即時啟動強制作息停業 3 個月"},{"value":"D","label":"發行人必須向證監會申請自動取消上市資格"}],"answer":"B","explanation":"指南 2-62 頁 9.69 節及 MBLR 13.09 規定：發行人必須在諮詢聯交所後，盡快發布避免其證券出現虛假市場（False market）所必需的資料，以維持公平、透明及有序的交易環境。","reference":"MBLR 13.09; HKSI Paper 5 Guide Topic 2 Section 9.69"},{"id":"T2-185","topic":"Topic 2","subtopic":"Hong Kong Depositary Receipts - Deposit Agreement Terms","difficulty":"Level 2","question":"根據主板第 19B.16 條，發行香港預託證券（HDRs）時，發行人與存管機構簽訂的「存管協議」（Deposit Agreement）必須包含下列哪項法定要件？","options":[{"value":"A","label":"底層股份必須以信託方式為 HDR 持有人獨立存管，存管機構須在香港備存持有人名冊，且協議管轄法律通常須為香港法律且不得排除香港法院的司法管轄權"},{"value":"B","label":"存管機構有權隨時無償沒收持有人的 HDR 資產"},{"value":"C","label":"HDR 持有人嚴禁享有任何股息分配權"},{"value":"D","label":"協議必須排除任何司法訴訟程序"}],"answer":"A","explanation":"指南 2-63 至 2-64 頁 9.77 節及 MBLR 19B.16 指明：存管協議核心要件包括：(1) 股份由存管處以信託形式為持有人利益持有；(2) 在香港備存持有人名冊；(3) 保障股息、投票及文件知情權；(4) 管轄法律通常為香港法且不排除香港法庭管轄權。","reference":"MBLR 19B.16; HKSI Paper 5 Guide Topic 2 Section 9.77"},{"id":"T2-186","topic":"Topic 2","subtopic":"HDR - Conversion into Underlying Shares","difficulty":"Level 1","question":"根據主板第 19B.07 條，香港預託證券（HDRs）持有人在權益轉換方面享有的法定核心權利為：","options":[{"value":"A","label":"HDR 持有人嚴禁將 HDR 兌換回基礎底層股份"},{"value":"B","label":"HDR 必須可自由兌換為發行人的底層股份（Freely convertible into shares of the issuer）"},{"value":"C","label":"轉換必須繳交 50% 的懲罰性手續費"},{"value":"D","label":"僅能在發行人清盤時方可兌換"}],"answer":"B","explanation":"指南 2-63 頁 9.75(a) 節及 MBLR 19B.07 規定：HDR 必須可自由兌換為發行人的底層股份（Freely convertible into shares），且 HDR 必須可自由轉讓，以維持跨市場套利與定價效率。","reference":"MBLR 19B.07; HKSI Paper 5 Guide Topic 2 Section 9.75(a)"},{"id":"T2-187","topic":"Topic 2","subtopic":"Convertible Securities - Public Float Breach Warning","difficulty":"Level 2","question":"根據主板第 13 章及第 28 章，上市發行人在擬發行可換股證券（可換股債券或可換股優先股）時，聯交所在何種情況下**不會**批准該可換股證券上市？","options":[{"value":"A","label":"該證券附帶固定的票面年利率"},{"value":"B","label":"若該等證券獲全面轉換時，相當可能會導致發行人的公眾持股量（Public float）低於法定最低百分比要求"},{"value":"C","label":"認購方為國際知名機構投資者"},{"value":"D","label":"發行方案經由股東大會以特別決議案批准"}],"answer":"B","explanation":"指南 2-66 頁 9.91 節指明：若可換股證券在轉換後可能導致發行人的公眾持股比例跌破法定最低門檻（如 25%），聯交所將不會給予上市批准，發行人必須在發行條款中設置限制轉換條款以防違規。","reference":"MBLR 28; HKSI Paper 5 Guide Topic 2 Section 9.91"},{"id":"T2-188","topic":"Topic 2","subtopic":"Overseas Issuers - Primary Listing Discretionary Refusal","difficulty":"Level 2","question":"根據主板上市規則第 19.03 條，海外發行人申請在香港進行第一上市（Primary listing）時，聯交所保留何種絕對自由裁量權？","options":[{"value":"A","label":"聯交所若認為批准該海外發行人上市不符合公眾利益（Not in the public interest），聯交所有絕對酌情權拒絕其上市申請"},{"value":"B","label":"聯交所必須無條件接納所有外國企業上市"},{"value":"C","label":"聯交所必須要求海外企業全體股東搬遷至香港定居"},{"value":"D","label":"聯交所無權審查海外企業的章程細則"}],"answer":"A","explanation":"指南 2-68 頁 9.100(a) 節及 MBLR 19.03 明確指明：聯交所保留絕對酌情權，若其認為將某海外發行人的證券上市並不符合公眾利益，則有權拒絕其上市申請。","reference":"MBLR 19.03; HKSI Paper 5 Guide Topic 2 Section 9.100(a)"},{"id":"T2-189","topic":"Topic 2","subtopic":"Overseas Issuers - Share Register Keeping","difficulty":"Level 2","question":"根據主板第 19.05 條，海外發行人在聯交所上市後，若其在多個司法管轄區備存股東名冊，其在香港備存的股東登記分冊（Branch Register）：","options":[{"value":"A","label":"必須強制作為唯一的全球總冊"},{"value":"B","label":"只需記錄在香港登記及買賣的證券持有人（Hong Kong register needs only record those holders in Hong Kong）"},{"value":"C","label":"嚴禁記錄任何香港本地居民的持股"},{"value":"D","label":"必須每週送往海外法院公證"}],"answer":"B","explanation":"指南 2-68 頁 9.100(c) 節及 MBLR 19.05 指明：海外發行人若備存兩份或以上股東名冊，其香港股東分冊只需記錄在香港的持有人名單即可，無須重複記錄海外其他分支名冊資訊。","reference":"MBLR 19.05; HKSI Paper 5 Guide Topic 2 Section 9.100(c)"},{"id":"T2-190","topic":"Topic 2","subtopic":"Debt Securities to Professional Investors - Minimum Denomination","difficulty":"Level 2","question":"根據主板上市規則第 37 章（僅面向專業投資者的債務發行），為確保散戶投資者不會在二級市場輕易接觸該等高風險債券，該等債務證券在發行時通常要求的最低交易面額門檻為：","options":[{"value":"A","label":"每手 1,000 港元"},{"value":"B","label":"最低面額通常不得少於 50 萬港元（或等值外幣，通常每手 100 萬或 200 萬港元/50 萬美元）"},{"value":"C","label":"每手 10 港元"},{"value":"D","label":"無面額門檻，允許分拆至 1 仙發售"}],"answer":"B","explanation":"MBLR Chapter 37 及實務發行指引指明：第 37 章專供專業投資者的債務發行，為防範零售滲透，通常要求高面額門檻（如最低發行及交易面額不少於 50 萬港元或等值外幣），確保僅有機構及合資格專業投資者參與。","reference":"MBLR Chapter 37; HKSI Paper 5 Guide Topic 2 Section 9.114"},{"id":"T2-191","topic":"Topic 2","subtopic":"Reverse Takeovers - Size of Acquisition Indicator","difficulty":"Level 2","question":"在聯交所依據原則驗證法判定某收購是否屬於反收購（RTO）時，下列哪項關於收購規模的指標理解最準確？","options":[{"value":"A","label":"收購規模必須達到 100%（非常重大收購）以上，否則絕對不能列為反收購"},{"value":"B","label":"該收購規模相對於發行人現有規模而言極大；即使未達 100% 比率，若會導致發行人業務發生根本性改變（Fundamental change to the issuer's business），聯交所仍可將其視為 RTO"},{"value":"C","label":"收購規模小於 5% 亦自動構成反收購"},{"value":"D","label":"僅看標的資產的員工人數"}],"answer":"B","explanation":"指南 2-44 頁 11.17(a) 節註釋指明：在原則驗證法下，收購規模「不一定必須達到非常重大收購的 100% 水平」；聯交所重點考量該收購是否相對於發行人自身規模過大，從而引致業務發生實質根本性轉變。","reference":"MBLR 14.06B; HKSI Paper 5 Guide Topic 2 Section 11.17 Note"},{"id":"T2-192","topic":"Topic 2","subtopic":"RTO - Fundamental Change in Principal Business Indicator","difficulty":"Level 2","question":"在 RTO 原則驗證法下，若發行人進行一項資產收購，在下列哪種商業背景下，該收購**通常不會**被聯交所單純視為意圖借殼規避的反收購？","options":[{"value":"A","label":"發行人為純空殼公司，新入主股東注入全新巨額業務"},{"value":"B","label":"該收購屬於發行人一貫既定的長期業務擴展戰略的一部分、與發行人自身的規模與資源相匹配，或是成熟大型業務的正常多元化轉型"},{"value":"C","label":"收購目標資產嚴重虧損且不具備任何上市資格"},{"value":"D","label":"交易同時伴隨董事會全體成員即時清洗換血"}],"answer":"B","explanation":"指南 2-44 頁 11.17(b) 節註釋指明：若收購屬於發行人正常業務戰略、與發行人的規模和實力相稱、或是成熟業務的正常業務多元化，在缺乏其他借殼因素下，通常不會被聯交所判定為 RTO。","reference":"MBLR 14.06B; HKSI Paper 5 Guide Topic 2 Section 11.17 Note"},{"id":"T2-193","topic":"Topic 2","subtopic":"RTO - Look-back Review Period (36 Months)","difficulty":"Level 2","question":"聯交所在調查發行人是否存在透過一連串分拆、交易及安排串聯以達成事實上借殼上市（RTO）時，其常規回溯審查的時限跨度為：","options":[{"value":"A","label":"審查期限最長不超過 30 天"},{"value":"B","label":"通常涵蓋長達 36 個月的期間（Encompass a period of up to 36 months）；若事件存在明確關聯，更可延伸至 36 個月之外"},{"value":"C","label":"嚴格限定在 6 個月以內"},{"value":"D","label":"回溯 30 年歷史"}],"answer":"B","explanation":"指南 2-45 頁 11.17 節註釋 1 指明：聯交所審查一連串關聯交易與安排時，常規審查視角涵蓋長達 36 個月（Up to 36 months）；若 36 個月前後的事件具備清晰關聯紐帶，聯交所更可延長該審查時限。","reference":"MBLR 14.06B; HKSI Paper 5 Guide Topic 2 Section 11.17 Note 1"},{"id":"T2-194","topic":"Topic 2","subtopic":"Connected Transactions - Direct Financial Assistance from Issuer","difficulty":"Level 3","question":"上市發行人若擬向其控股股東提供一筆無抵押的免息大額流動資金貸款，根據《上市規則》第 14A 章，該項交易在監管性質上屬於：","options":[{"value":"A","label":"完全豁免的日常商業信貸"},{"value":"B","label":"發行人向關連人士提供「財務資助」（Financial assistance），構成受規管的關連交易，必須履行披露、通函及獨立股東批准程序"},{"value":"C","label":"一般的資本公積轉增股本"},{"value":"D","label":"合法的庫存股配售行為"}],"answer":"B","explanation":"指南 2-47 頁 11.25 節、2-49 頁 11.32 節及 MBLR 14A.24(4) 規定：發行人向關連人士提供貸款、擔保或財務資助，屬於典型的重大關連交易，受制於嚴格的申報、公告及獨立股東批准機制。","reference":"MBLR 14A.24(4); HKSI Paper 5 Guide Topic 2 Section 11.25, 11.32"},{"id":"T2-195","topic":"Topic 2","subtopic":"Connected Transactions - Financial Assistance FOR Issuer's Benefit","difficulty":"Level 3","question":"根據《上市規則》第 14A.90 條，控股股東若主動向上市發行人提供一筆巨額低息股東貸款以協助其度過流動性難關，且發行人「並未以自身任何資產作為抵押」，該財務資助享有何種監管寬免？","options":[{"value":"A","label":"必須由全體股東大會以 100% 贊成通過"},{"value":"B","label":"享有全面財務資助豁免（Fully exempt），免除申報、公告及股東批准要求，因為該交易是按常規商業條款進行且對發行人有利"},{"value":"C","label":"聯交所強制沒收該貸款金額"},{"value":"D","label":"發行人必須即時除牌"}],"answer":"B","explanation":"
