別准許後，方可在禁售期內破例減持。","reference":"MBLR Appendix C3 Rules C.1-C.3; HKSI Paper 5 Guide Topic 2 Section 3.34"},{"id":"T2-433","topic":"Topic 2","subtopic":"Model Code - Board Chairman Clearances","difficulty":"Level 2","question":"根據主板附錄 C3《標準守則》第 B.8 條，當發行人的「董事會主席」（Board Chairman）本人擬買賣該發行人的證券時，其必須預先書面通知並取得誰的書面確認許可？","options":[{"value":"A","label":"必須取得全體公眾股東的一致公證"},{"value":"B","label":"必須預先通知董事會為此目的而特別指定的另一名董事（或董事會轄下的指定委員會），並獲取註明日期的書面接納回條"},{"value":"C","label":"主席享有絕對特權，無須知會任何人即可自由交易"},{"value":"D","label":"必須由公司前台接待主管批准"}],"answer":"B","explanation":"MBLR Appendix C3 Rule B.8 明確規定：一般董事買賣通知主席；但若為董事會主席本人買賣，則必須預先書面通知董事會指定的另一名董事（通常為首席 INED 或審核委員會主席），並取得書面確認回條後方可買賣。","reference":"MBLR Appendix C3 Rule B.8; HKSI Paper 5 Guide Topic 2 Section 3.34"},{"id":"T2-434","topic":"Topic 2","subtopic":"Sponsors Primary Channel - Independent Sponsor Expectation","difficulty":"Level 2","question":"新上市申請人委聘了三名聯席保薦人，其中兩名不具備獨立性，一名具備獨立性。根據主板第 3A.07 條及相關指引，聯交所通常預期出任發行人與聯交所之間「主要溝通渠道」的保薦人必須為：","options":[{"value":"A","label":"出資金額最高的非獨立保薦人"},{"value":"B","label":"符合《上市規則》第 3A.07 條獨立性測試的該名「獨立保薦人」（The sponsor acting as primary channel is expected to be independent）"},{"value":"C","label":"在港成立時間最短的保薦人"},{"value":"D","label":"由發行人行政總裁的親屬擔任主管的保薦人"}],"answer":"B","explanation":"指南 2-9 頁 3.3 節及 MBLR 3A.07 指明：發行人可聘多名保薦人，但必須指定主要溝通管道；且聯交所明確預期擔任主要溝通渠道的保薦人應當具備獨立性，以維護監管溝通的客觀公信力。","reference":"MBLR 3A.07; HKSI Paper 5 Guide Topic 2 Section 3.3"},{"id":"T2-435","topic":"Topic 2","subtopic":"Corporate Governance - Board Diversity Gender Implementation Window","difficulty":"Level 2","question":"香港交易所全面落實消除單一性別董事會政策後，對於新申請上市的擬發行人，其董事會在遞交上市申請時的性別組成硬性要求為：","options":[{"value":"A","label":"發行人可在上市滿 10 年後再考慮委任女性董事"},{"value":"B","label":"在遞交上市申請時，新申請人的董事會成員中必須已經包含至少一名不同性別的董事（At least one director of a different gender），全單一性別董事會將直接被認定為不適合上市"},{"value":"C","label":"董事會成員性別不受任何上市審查限制"},{"value":"D","label":"全體獨立非執董必須全數為同一性別"}],"answer":"B","explanation":"指南 1-11 頁 2.4(g) 節、1-13 頁 2.8(d) 節及 HKEX 指引指明：聯交所已全面結束過渡期，新上市申請人必須具備多元性別董事會架構方可獲准上市，單一性別董事會不符合上市適當性要求。","reference":"MBLR 13.92, Appendix C1; HKSI Paper 5 Guide Topic 1 Section 2.4, 2.8"},{"id":"T2-436","topic":"Topic 2","subtopic":"Deposit Agreement - Law of Jurisdiction","difficulty":"Level 2","question":"根據主板第 19B.16 條，香港預託證券（HDR）的存管協議（Deposit Agreement），在管轄法律（Governing Law）條款上必須符合何種法律限制？","options":[{"value":"A","label":"必須強制以海外發行人母國的地方部族習慣法為管轄法"},{"value":"B","label":"管轄法律應當為香港法律（或符合國際常規的認可國際法），且協議條款絕對「不得排除香港法院的司法管轄權」（Must not preclude the jurisdiction of the Hong Kong courts）"},{"value":"C","label":"必須明確排除香港任何法庭的受理權"},{"value":"D","label":"管轄法律無須載於協議中"}],"answer":"B","explanation":"指南 2-64 頁 9.77(e) 節及 MBLR 19B.16 明確規定：HDR 存管協議準據法通常為香港法或國際通行法律，且至關重要的是協議絕不得排除香港法院的司法管轄權，確保香港 HDR 投資者可循本地法院提起訴訟。","reference":"MBLR 19B.16; HKSI Paper 5 Guide Topic 2 Section 9.77(e)"},{"id":"T2-437","topic":"Topic 2","subtopic":"Mineral Companies - Early Stage Exploration Companies Restrictions","difficulty":"Level 3","question":"根據主板第 18 章，對於僅持有早期「勘探階段」（Early stage exploration）天然資源權益而無任何確定儲量的新申請人，聯交所通常採取的監管標準為：","options":[{"value":"A","label":"給予優先免審批綠色通道上市"},{"value":"B","label":"聯交所通常不接納僅從事早期勘探的礦業公司上市（Not normally accept early-stage exploration companies），除非其能證明具備具實質意義的控制資源量及充足的商業化開採權"},{"value":"C","label":"強制將其證券僅面向中學生發售"},{"value":"D","label":"由聯交所承擔全額勘探鑽探成本"}],"answer":"B","explanation":"指南 2-67 頁 9.97 節及 MBLR 18.03 指明：聯交所不接受純勘探階段（Exploration stage only）的礦業公司上市，申請人必須證明其已跨越早期純勘探，具備由合資格人士報告支持的確定控制資源量或儲量投資組合。","reference":"MBLR Chapter 18; HKSI Paper 5 Guide Topic 2 Section 9.97"},{"id":"T2-438","topic":"Topic 2","subtopic":"Convertible Equity Securities - Listed Underlying Requirement","difficulty":"Level 2","question":"根據主板第 28 章，上市發行人若申請發行可換股股本證券（Convertible Equity Securities），其底層股份（Underlying Shares）在上市地位上必須滿足的條件是：","options":[{"value":"A","label":"底層股份可以為某家海外非上市初創企業的股票"},{"value":"B","label":"底層股份本身必須為（或在轉換時將同時成為）在聯交所或另一認可交易所上市交易的某一類別上市股份（Class of listed shares）"},{"value":"C","label":"底層股份必須為不可轉換的固定利息存款"},{"value":"D","label":"底層股份嚴禁在市場掛牌交易"}],"answer":"B","explanation":"指南 2-66 頁 9.90 節及 MBLR 28.01 規定：可換股權益證券的掛牌前提，是行使轉換權時所交付的標的股份必須為已在聯交所上市的類別，或經認可交易所上市的合資格股份，確保轉換後證券具備公開二級市場定價與流動性。","reference":"MBLR Chapter 28; HKSI Paper 5 Guide Topic 2 Section 9.90"},{"id":"T2-439","topic":"Topic 2","subtopic":"Debt Securities - Bank Issuers Financial Period Concession (15 Months)","difficulty":"Level 2","question":"根據主板第 34 章，合資格商業銀行（Banks，如大型持牌銀行）發行上市債務證券時，在最近一個經審計財務報告結束日的過期時效限制上，可享有的寬限為：","options":[{"value":"A","label":"不得超過 1 個月"},{"value":"B","label":"最近期經審計財務期間結束日距上市文件刊發之日，不得超過 15 個月（Not more than 15 months before the date of listing document，除非刊發中期報表）"},{"value":"C","label":"不得超過 10 年"},{"value":"D","label":"銀行發債完全不受任何財務審計要求約束"}],"answer":"B","explanation":"指南 2-70 頁 9.113(d) 節及 MBLR 34.03 指明：對合資格銀行發行債券給予審計過期寬限，其最近審計財務期最長可放寬至距上市文件刊發日不超過 15 個月，以配合銀行業常規年報審計週期。","reference":"MBLR 34.03; HKSI Paper 5 Guide Topic 2 Section 9.113(d)"},{"id":"T2-440","topic":"Topic 2","subtopic":"Debt Securities - State Issuers Nominal Amount Minimum (HK$50 Million)","difficulty":"Level 1","question":"根據主板第 31 章，外國主權國家或特區政府（States）申請在聯交所發行上市債務證券時，該上市類別證券的最低面額總額要求為：","options":[{"value":"A","label":"至少 100 萬港元"},{"value":"B","label":"至少 5,000 萬港元（Nominal amount of at least HK$50 million）"},{"value":"C","label":"至少 10 億港元"},{"value":"D","label":"至少 100 億港元"}],"answer":"B","explanation":"指南 2-69 頁 9.113(a) 節及 MBLR 31.02 明確規定：國家或政府發行債務證券申請上市，其擬上市之每類證券面值總額必須至少達到 5,000 萬港元（At least HK$50 million）。","reference":"MBLR 31.02; HKSI Paper 5 Guide Topic 2 Section 9.113(a)"},{"id":"T2-441","topic":"Topic 2","subtopic":"Debt Securities - Supranationals General Qualifications Exemption","difficulty":"Level 2","question":"根據主板第 32 章，跨國超主權機構（Supranationals，如世界銀行、亞洲開發銀行）在香港聯交所申請將其發行的債券上市時，可享有的重大上市豁免為：","options":[{"value":"A","label":"豁免遵守主板第 23 章關於債務證券上市的一般常規資格要求（MBLR Chapter 23 does not apply）"},{"value":"B","label":"豁免向投資者償付債券到期本金"},{"value":"C","label":"豁免遵守香港任何打擊洗錢法規"},{"value":"D","label":"其債券自動在香港全境獲得法定貨幣流通地位"}],"answer":"A","explanation":"指南 2-70 頁 9.113(b) 節及 MBLR 32.02 指明：鑑於超主權機構具備至高信用評級，聯交所豁免其遵守第 23 章關於常規發債機構歷史年限、審計紀錄等一般上市資格規定。","reference":"MBLR 32.02; HKSI Paper 5 Guide Topic 2 Section 9.113(b)"},{"id":"T2-442","topic":"Topic 2","subtopic":"Price Stabilization - Maximum Holding Net Long Position Disclosure","difficulty":"Level 2","question":"在 IPO 價格穩定機制中，穩定價格操作人在二級市場護盤買入證券後可能累積多頭持倉。根據 PS Rules，操作人持有該等淨好倉（Net Long Position）受到的約束為：","options":[{"value":"A","label":"操作人必須永久持有該等多頭股票至公司解散為止"},{"value":"B","label":"招股章程中必須已向公眾披露操作人有機會持有淨好倉的事實，且操作人須在穩定價格登記冊中逐筆登記，並在期滿後按市場常規平倉或清結"},{"value":"C","label":"淨多頭持倉數量不得超過 10 股"},{"value":"D","label":"多頭持倉必須全數無償沒收交由聯交所保管"}],"answer":"B","explanation":"指南 2-74 頁 10.19 節及 PS Rules 指明：操作人持有淨好倉是穩定價格買入後的正常後果，前提是該可能性已於招股書披露，所有買入及後續出售均受價格上限規限並登載於穩定價格登記冊備查。","reference":"PS Rules; HKSI Paper 5 Guide Topic 2 Section 10.19"},{"id":"T2-443","topic":"Topic 2","subtopic":"Continuing Obligations - Notifiable Transactions Revenue Test Definition","difficulty":"Level 2","question":"在計算須予公布交易的收益比率（Revenue ratio）時，根據主板第 14.04(8) 條，發行人的收益（Revenue）是指：","options":[{"value":"A","label":"僅限於公司收取的銀行存款利息收入"},{"value":"B","label":"來自發行人主要經營活動所產生的營業收入（Revenue arising from principal activities），不包括偶發性出售自用固定資產的收益或利息"},{"value":"C","label":"發行人獲得的海外政府單筆捐贈款"},{"value":"D","label":"公司股票在市場的總交易金額"}],"answer":"B","explanation":"依據 MBLR 14.04(8) 及指南 2-41 頁 11.7 節：收益比率測試所採納的收益，嚴格限定為來自集團日常主要商業運作所產生的營業額（Revenue from principal activities），排除非營運性、非經常性的偶發收入。","reference":"MBLR 14.04(8); HKSI Paper 5 Guide Topic 2 Section 11.7"},{"id":"T2-444","topic":"Topic 2","subtopic":"Connected Persons - Trustees of Discretionary Trust","difficulty":"Level 3","question":"某上市發行人的控股股東設立了一項全權家庭信託（Discretionary Trust），其未成年子女為該信託的酌情受益人。根據主板第 14A 章，該全權信託的「受託人」（Trustee）在法規上的身份界定為：","options":[{"value":"A","label":"該控股股東的聯繫人（Associate），從而屬於發行人的「核心關連人士」（Core Connected Person）"},{"value":"B","label":"完全獨立的信託公司，與發行人無任何法律關聯"},{"value":"C","label":"發行人的外聘獨立合規顧問"},{"value":"D","label":"僅屬於一般公眾股東"}],"answer":"A","explanation":"指南 2-48 頁 11.27 節註釋 1 及 MBLR 14A.12(1)(b) 指明：關連人士或其家屬作為受益人的信託，其受託人（Trustees）依法直接屬於該個人的聯繫人（Associate），從而構成上市發行人的核心關連人士。","reference":"MBLR 14A.12; HKSI Paper 5 Guide Topic 2 Section 11.27 Note 1"},{"id":"T2-445","topic":"Topic 2","subtopic":"Connected Transactions - Direct Shareholder Reporting in Annual Report","difficulty":"Level 2","question":"根據主板第 14A.71 條及第 14A.72 條，上市發行人在財政年度內進行的所有關連交易（即使享有部分豁免股東大會批准），在編制該年度的年報時必須：","options":[{"value":"A","label":"對所有交易細節全面保密以防洩露商機"},{"value":"B","label":"在年報中載入關連交易專章，披露交易日期、各方主體、交易性質、對價、關連關係、以及獨立非執董及核數師對持續關連交易的年度審核結論"},{"value":"C","label":"僅披露交易對手的英文縮寫"},{"value":"D","label":"無須在年報披露，因先前已刊發過公告"}],"answer":"B","explanation":"指南 2-47 頁 11.25 節及 MBLR 14A.71–14A.72 明確規定：發行人年報必須詳細披露該年度內進行的全部關連交易與持續關連交易，包括核心交易條款、年度上限達成情況及獨立董事與核數師的審查意見。","reference":"MBLR 14A.71, 14A.72; HKSI Paper 5 Guide Topic 2 Section 11.25"},{"id":"T2-446","topic":"Topic 2","subtopic":"Reverse Takeovers - Stock Exchange 36 Months nexus expansion","difficulty":"Level 3","question":"在審查發行人是否存在借殼上市意圖時，若新控股方取得控制權已滿 37 個月（表面超出 36 個月明線測試），但聯交所掌握確鑿證據證明該收購與 37 個月前的控制權更替存在明確的「商業預先策劃與紐帶」（Clear nexus）。聯交所獲賦權採取的行動是：","options":[{"value":"A","label":"因已逾 36 個月，聯交所受制於時效法絕對無權干預"},{"value":"B","label":"聯交所獲賦權打破 36 個月的形式界限，將審查期延伸至 36 個月之外，依據「原則驗證法」將該項收購直接定性為反收購行動（RTO）"},{"value":"C","label":"強制沒收該控制人的全部個人資產"},{"value":"D","label":"命令發行人撤銷所有對外投資"}],"answer":"B","explanation":"指南 2-45 頁 11.17 節註釋 1 及 HKEX 指引明確指明：36 個月並非不可逾越的絕對避風港；若事件與 36 個月前後的安排存在清晰紐帶關係（Clear nexus），聯交所有權延伸審查期並依原則驗證法認定為反收購。","reference":"MBLR 14.06B; HKSI Paper 5 Guide Topic 2 Section 11.17 Note 1"},{"id":"T2-447","topic":"Topic 2","subtopic":"Cash Companies - Securities Houses Banking Concession","difficulty":"Level 2","question":"根據主板第 14.83 條，下列哪類機構發行人在其資產負債表上擁有超過 90% 的現金及短期流動金融資產時，依然享有法定全面豁免而不受現金公司停牌限制？","options":[{"value":"A","label":"獲香港金管局認可的持牌商業銀行、獲保監局授權的保險公司、以及從事受規管證券經紀業務的持牌法團（Banks, insurance companies and securities houses）"},{"value":"B","label":"連鎖藥房零售連鎖集團"},{"value":"C","label":"主要在海外持有未開發農地的農業公司"},{"value":"D","label":"從事影視製作發行的娛樂傳媒公司"}],"answer":"A","explanation":"指南 2-49 頁 11.36 節註釋及 MBLR 14.83 指明：受規管金融中介機構（銀行、保險、券商）因業務本質需持有巨額流動資產及現金以備客戶結算及保證金之需，獲明確豁免適用現金公司規則。","reference":"MBLR 14.83; HKSI Paper 5 Guide Topic 2 Section 11.36 Note"},{"id":"T2-448","topic":"Topic 2","subtopic":"Continuous Suspension - Delisting Decision Notice to Issuer","difficulty":"Level 2","question":"當上市發行人在主板連續停牌滿 18 個月且未能在期限屆滿前呈交符合要求的復牌建議時，聯交所發出取消上市地位決定的標準程序為：","options":[{"value":"A","label":"透過私人口頭電話通知個別董事"},{"value":"B","label":"向發行人發出正式書面通知，並發布公開公告（Cancellation of listing announced by the SEHK），交代除牌決定生效日期，發行人享有 7 個營業日提請 LRC 覆核的權利"},{"value":"C","label":"強制封閉發行人的所有香港實體辦公室"},{"value":"D","label":"向發行人的全體海外股東發送電報"}],"answer":"B","explanation":"指南 2-52 頁 12.13 節及 MBLR 6.01A 規定：聯交所正式取消上市地位時，會向發行人書面送達決定並公開發布公告；發行人享有法定期限（7 個營業日內）提請上市覆核委員會覆核該項除牌裁定。","reference":"MBLR 6.01A, 2A.11; HKSI Paper 5 Guide Topic 2 Section 12.13"},{"id":"T2-449","topic":"Topic 2","subtopic":"Disciplinary Proceedings - Public Censures and Criticisms","difficulty":"Level 1","question":"上市委員會在針對發行人或董事違反《上市規則》進行紀律處分時，屬於中度公開譴責性質、嚴重程度僅次於聲明其不適合擔任董事的處分措施為：","options":[{"value":"A","label":"私下不公開警告信"},{"value":"B","label":"刊發涉及批評的公開聲明（Public statement involving criticism），或發出公開譴責（Public censure）"},{"value":"C","label":"直接沒收其個人護照"},{"value":"D","label":"命令其在電視台公開下跪道歉"}],"answer":"B","explanation":"指南 2-56 頁 13.4(b) 節及 MBLR 2A.10 明確列出：公開批評（Public statement of criticism）及公開譴責（Public censure）屬於典型的中階公開紀律制裁，對違規法團或個人的市場聲譽產生實質懲戒作用。","reference":"MBLR 2A.10; HKSI Paper 5 Guide Topic 2 Section 13.4(b)"},{"id":"T2-450","topic":"Topic 2","subtopic":"Conclusion of Topic 2 - Comprehensive Listing Regulatory Framework","difficulty":"Level 2","question":"綜合香港《上市規則》（主板 MBLR 及 GEM GLR）的整體制度設計，貫穿發行人自申請新上市、發售定價、持續營運、重大並購至退市除牌全週期的核心監管基石是：","options":[{"value":"A","label":"以行政審批直接保證每一位股票投資者永不虧損"},{"value":"B","label":"以高標準的全面及時披露（Disclosure）為核心、以嚴格的受託責任與企業管治為支柱、貫徹公平對待全體股東（尤其是保障公眾少數股東利益），並受香港證監會法定監管權威的雙重保障"},{"value":"C","label":"嚴禁任何海外企業在香港市場籌集資金"},{"value":"D","label":"完全放棄任何市場監管，實行純粹無序自流"}],"answer":"B","explanation":"指南 1-35 至 1-36 頁 4.30–4.31 節、2-4 頁 1.4 節及 2-46 至 2-57 頁全局考點總結：香港上市制度以充分披露為本（Disclosure-based regime），輔以嚴密防借殼與關連交易制衡機制，核心在於保障公眾投資者、維護市場誠信、公平有序運作。","reference":"MBLR 2.01, 3.08, 14, 14A; HKSI Paper 5 Guide Topic 2 Summary"},{"id":"T3-001","topic":"Topic 3","subtopic":"Purpose and Status of the Codes - Non-statutory Nature","difficulty":"Level 2","question":"根據《公司收購及合併守則》與《股份回購守則》（統稱《守則》/ Codes）的導言，關於《守則》的法律屬性與執行基礎，下列敘述何者最正確？","options":[{"value":"A","label":"《守則》是由香港立法會制定的成文法規，其條文在法律解釋上必須如成文法例般嚴格依字面解釋"},{"value":"B","label":"《守則》是由證監會依據 SFO 第 399(2) 條發布的非法定規則（Non-statutory），代表香港市場參與者與證監會對收購、合併及回購可接受商業道德標準的共識；但收購委員會的裁決仍可受香港高等法院的司法覆核"},{"value":"C","label":"《守則》完全不受任何香港法院的司法覆核管轄"},{"value":"D","label":"《守則》僅對在香港註冊成立的非上市公司具有強制約束力"}],"answer":"B","explanation":"指南 3-3 至 3-4 頁 1.7 節指出：《守則》是非法定的（Non-statutory），不應如成文法規般嚴格字面解釋，其體現業界可接受之商業行為共識；然而，收購及合併委員會（Panel）所作出的裁決仍可受香港高等法院原訟法庭的司法覆核（Judicial review），以審查其合法性與程序公允性。","reference":"Takeovers Code Introduction; SFO s.399(2); HKSI Paper 5 Guide Topic 3 Section 1.7"},{"id":"T3-002","topic":"Topic 3","subtopic":"Purpose of the Codes - Commercial Merits Disregard","difficulty":"Level 1","question":"根據《收購守則》的引言說明，證監會企業融資部執行人員（Executive）及收購委員會（Panel）在執行與解釋《守則》時，對一項收購交易的「商業或財務利益」（Financial or commercial merits）：","options":[{"value":"A","label":"負有法定審查責任，必須確保要約價能讓所有少數股東賺取至少 20% 利潤"},{"value":"B","label":"完全不予過問或評價（The Codes are not concerned with the financial or commercial advantages or disadvantages of a takeover），相關商業利益純屬要約人、受要約公司及其股東自身的商業考量"},{"value":"C","label":"有權直接推翻要約人提出的出價估值並強制重估"},{"value":"D","label":"必須由香港特區政府行政會議逐案審議批准其商業合理性"}],"answer":"B","explanation":"指南 1-37 頁 4.40 節、3-3 頁 1.3 節及《收購守則》引言明確指明：《守則》旨在確保股東獲得公平對待與充足資訊，並不關注收購或回購的商業或財務利弊（Not concerned with financial or commercial merits），商業價值純屬交易方及股東自身的判斷。","reference":"Takeovers Code Introduction para 1.4; HKSI Paper 5 Guide Topic 3 Section 1.3"},{"id":"T3-003","topic":"Topic 3","subtopic":"Application Scope of the Codes - REITs Coverage","difficulty":"Level 2","question":"根據《收購守則》第 2.1 段，除香港的公眾公司及主要上市地位在香港的股權發行人外，《守則》亦明確適用於下列哪類特定上市投資實體？","options":[{"value":"A","label":"主要上市地位在倫敦證交所的海外多元化礦業集團"},{"value":"B","label":"在香港聯交所擁有基金單位主要上市地位的房地產投資信託基金（REITs with a primary listing of their units in Hong Kong）"},{"value":"C","label":"任何未獲證監會認可的私人對沖基金"},{"value":"D","label":"在香港註冊成立的合夥制律師事務所"}],"answer":"B","explanation":"指南 1-37 頁 4.41 節、3-5 頁 2.1 節及《收購守則》引言規定：《守則》適用於香港公眾公司、在香港作第一上市的普通股發行人，以及基金單位在香港作第一上市的房地產投資信託基金（REITs）。","reference":"Takeovers Code Introduction para 1.1; HKSI Paper 5 Guide Topic 3 Section 2.1"},{"id":"T3-004","topic":"Topic 3","subtopic":"General Principle 1 - Even-handed Treatment","difficulty":"Level 1","question":"根據《收購守則》十項一般原則之「一般原則 1」（General Principle 1），其核心行為標準規定：","options":[{"value":"A","label":"全體股東應獲得公平對待，且同類別的所有股東均必須受到同等待遇（All shareholders of the same class are to be treated similarly）"},{"value":"B","label":"大股東在任何情況下均有權享有較公眾少數股東更高的每股收購溢價"},{"value":"C","label":"香港本地股東應較海外股東享有更優先的股份接納權"},{"value":"D","label":"要約人可以任意為機構投資者提供未公開的現金補償"}],"answer":"A","explanation":"指南 3-6 頁 2.7 節列明一般原則 1：全體股東應獲得公平平等待遇（Even-handedly），且同一類別的所有股東必須受到同等待遇（Treated similarly），不得存在差別待遇。","reference":"Takeovers Code General Principle 1; HKSI Paper 5 Guide Topic 3 Section 2.7"},{"id":"T3-005","topic":"Topic 3","subtopic":"General Principle 2 - Mandatory Offer on Control Change","difficulty":"Level 2","question":"根據《收購守則》之「一般原則 2」（General Principle 2），當一間公司的控制權發生變動、或被取得、或被鞏固時，在一般常規下原則上要求：","options":[{"value":"A","label":"公司必須強制向香港高等法院申請破產和解"},{"value":"B","label":"必須向所有其他股東提出全面收購要約（A general offer to all other shareholders is normally required），且潛在買方在作出收購前必須確保其具備並將持續具備足夠資金落實該要約"},{"value":"C","label":"控股股東必須即時將所有股份無償捐贈給慈善機構"},{"value":"D","label":"受要約公司股票必須強制永久除牌"}],"answer":"B","explanation":"指南 3-6 頁 2.7 節指明一般原則 2：凡公司的控制權（30% 或以上）發生變更、被取得或鞏固時，通常必須向全體其他股東提出全面要約；且要約人在實施收購前，必須確保自身有能力且將持續有能力全面落實要約。","reference":"Takeovers Code General Principle 2; HKSI Paper 5 Guide Topic 3 Section 2.7"},{"id":"T3-006","topic":"Topic 3","subtopic":"General Principle 3 - Equality of Information","difficulty":"Level 2","question":"根據《收購守則》之「一般原則 3」（General Principle 3）關於資訊平等的原則，要約人或目標公司及其各自的顧問：","options":[{"value":"A","label":"可向持股量前五名的大機構投資者私下透露未公開的內部財務預算"},{"value":"B","label":"在要約進行過程中或在考慮提出要約期間，嚴禁向部分股東提供其他股東未獲提供的資訊（Neither may provide information to some shareholders which is not made available to all shareholders），但目標公司向真正潛在要約人提供機密資料除外"},{"value":"C","label":"必須在電視直播中公開目標公司全部客戶的個人隱私名冊"},{"value":"D","label":"僅需向香港註冊的股東提供通函"}],"answer":"B","explanation":"指南 3-6 頁 2.7 節指明一般原則 3：不得有選擇性資訊披露，嚴禁向個別股東提供未普遍向全體股東公開的資訊（Equality of information）；但目標公司出於商業談判目的，向真誠潛在要約人提供必要的機密盡調資料（在保密義務下）則不受此限。","reference":"Takeovers Code General Principle 3; HKSI Paper 5 Guide Topic 3 Section 2.7"},{"id":"T3-007","topic":"Topic 3","subtopic":"General Principle 4 - Responsible Consideration & Financing Confirmation","difficulty":"Level 2","question":"根據《收購守則》之「一般原則 4」（General Principle 4），要約人在公布一項全面收購要約前，要約人及其財務顧問必須確認：","options":[{"value":"A","label":"要約人已獲得聯交所主席的口頭背書"},{"value":"B","label":"要約人及其財務顧問信納，要約人具備且將持續具備足夠的財務資源以全數實施該項要約（The offeror and its financial advisers should be satisfied that it can and will continue to be able to implement the offer in full）"},{"value":"C","label":"受要約公司股價在未來半年內絕對不跌"},{"value":"D","label":"受要約公司董事會已一致投降"}],"answer":"B","explanation":"指南 3-6 頁 2.7 節及 3-9 頁 3.10 節指明一般原則 4：公布要約前必須經審慎負責考量，要約人及其財務顧問必須確信要約人具備充足資源實施要約，財務顧問更必須在公告中簽署確認充足資金陳述。","reference":"Takeovers Code General Principle 4; HKSI Paper 5 Guide Topic 3 Section 2.7, 3.10"},{"id":"T3-008","topic":"Topic 3","subtopic":"General Principle 7 - Oppression of Minority Shareholders","difficulty":"Level 1","question":"根據《收購守則》之「一般原則 7」（General Principle 7），控股權在行使時的行為守則是：","options":[{"value":"A","label":"控股權享有絕對特權，可合法壓迫少數股東以實現大股東利益最大化"},{"value":"B","label":"控制權必須以真誠方式行使（Rights of control should be exercised in good faith），且壓迫少數股東或非控股股東的行為是絕對不可接受的（Oppression of minority or non-controlling shareholders is not acceptable）"},{"value":"C","label":"少數股東在任何收購方案中均無任何發言權"},{"value":"D","label":"控制權轉讓無須考慮任何公平標準"}],"answer":"B","explanation":"指南 3-6 頁 2.7 節指明一般原則 7：控制權必須出於真誠行使，嚴厲禁止任何形式對少數股東或非控股股東的壓迫（Oppression of minority is not acceptable），確保資本市場公平信譽。","reference":"Takeovers Code General Principle 7; HKSI Paper 5 Guide Topic 3 Section 2.7"},{"id":"T3-009","topic":"Topic 3","subtopic":"General Principle 8 - Directors Fiduciary Duties Disregard Personal Interest","difficulty":"Level 3","question":"根據《收購守則》之「一般原則 8」（General Principle 8），受要約公司董事在向股東提供是否接納要約的推薦意見時，必須嚴格遵守：","options":[{"value":"A","label":"優先考慮董事個人持股及家族成員股權在收購中的溢價變現"},{"value":"B","label":"純粹以董事身分行事，完全不考慮個人或家族持股或與公司的私人關係，且僅以全體股東的整體利益（Shareholders' interests taken as a whole）為依歸"},{"value":"C","label":"全權聽從要約人的私下口頭指示"},{"value":"D","label":"強制推薦全體股東拒絕任何敵意要約"}],"answer":"B","explanation":"指南 3-7 頁 2.7 節指明一般原則 8：董事在提供意見時，必須僅以董事身分行事，將個人及家庭持股利益置之度外，僅能考慮全體股東的整體利益，且不得與要約人簽訂限制其向股東提供獨立建議的約定。","reference":"Takeovers Code General Principle 8; HKSI Paper 5 Guide Topic 3 Section 2.7"},{"id":"T3-010","topic":"Topic 3","subtopic":"General Principle 9 - Frustrating Actions (Rule 4)","difficulty":"Level 3","question":"根據《收購守則》一般原則 9 及規則第 4 條（Rule 4），在受要約公司董事會接獲真誠要約（Bona fide offer）、或有理由相信真誠要約即將提出後，受要約公司董事會受到下列哪項嚴格禁止？","options":[{"value":"A","label":"嚴禁召開任何常規董事會會議"},{"value":"B","label":"未經股東在股東大會上批准，不得採取任何可能導致該真誠要約受到阻礙（Frustrated）、或致使股東被剝奪就該要約利弊作出決定的機會的行動"},{"value":"C","label":"嚴禁委聘任何獨立財務顧問"},{"value":"D","label":"必須強制在 24 小時內解散現有公司"}],"answer":"B","explanation":"指南 3-7 頁 2.7 節、3-14 頁 3.30 節及《收購守則》Rule 4 明確規定：在接獲真誠要約或預期要約即將來臨時，目標公司董事會未經股東大會批准，絕對不得採取任何阻礙行動（Frustrating actions），如發行新股、出售核心資產、簽訂非常規合約等，防止管理層剝奪股東選擇權。","reference":"Takeovers Code General Principle 9, Rule 4; HKSI Paper 5 Guide Topic 3 Section 2.7, 3.30"},{"id":"T3-011","topic":"Topic 3","subtopic":"Frustrating Actions - Rule 4 Prohibited Conduct Examples","difficulty":"Level 3","question":"根據《收購守則》第 4 條（Rule 4），在要約期內，受要約公司若未獲得股東大會事先批准，下列哪項具體行為被明確界定為受禁的「防礙行動」（Frustrating Action）？","options":[{"value":"A","label":"向全體股東如期寄發經審計的年度財務通函"},{"value":"B","label":"發行任何有表決權的新股份、發行可換股證券、授予重大期權、出售或收購重大部分資產，或在非正常業務過程中訂立重大合約"},{"value":"C","label":"配合執行人員的監管查詢提供盡職文件"},{"value":"D","label":"成立由全體獨立非執董組成的獨立董事委員會"}],"answer":"B","explanation":"指南 3-14 至 3-15 頁 3.30–3.31 節及 Rule 4 詳列防礙行動：包括增發新股、發行可轉債、出售或購買重大資產、訂立重大合約或進行重大股份購回，任何此等行為未經股東大會批准均屬違規。","reference":"Takeovers Code Rule 4; HKSI Paper 5 Guide Topic 3 Section 3.30"},{"id":"T3-012","topic":"Topic 3","subtopic":"Frustrating Actions - Pre-existing Contract Exception","difficulty":"Level 3","question":"受要約公司在要約期內推進一項出售重大附屬公司的交易。在下列哪種特定法定例外情況下，該出售不被視為違反《收購守則》第 4 條的防礙行動？","options":[{"value":"A","label":"只要該出售獲得全體執行董事的一致口頭同意"},{"value":"B","label":"該交易是依據在要約期開始前、或在董事會獲悉要約即將提出之前，已經合法訂立的具有約束力的正式合約所推進（Pursuant to a contract entered into earlier）"},{"value":"C","label":"買方出價較市價高出三倍"},{"value":"D","label":"出售所得款項全數存入海外秘密戶口"}],"answer":"B","explanation":"指南 3-15 頁 3.32 節及 Takeovers Code Rule 4 Note 1 指明例外情況：若該合約在要約開始前（且非預期阻礙要約而突擊簽署）已妥為訂立且具法律約束力，履行該既有合約義務不構成違規防礙行動，但仍應及時諮詢執行人員。","reference":"Takeovers Code Rule 4 Note 1; HKSI Paper 5 Guide Topic 3 Section 3.32"},{"id":"T3-013","topic":"Topic 3","subtopic":"Board Responsibility Statement - Rule 9.3 Exclusion","difficulty":"Level 2","question":"根據《收購守則》第 9.3 條及第 9.4 條，在要約各方刊發的任何文件中，全體董事均須簽署對文件準確性承擔責任的聲明。某位董事若擬在責任聲明中獲豁免除名，必須符合的法定程序為：","options":[{"value":"A","label":"該董事只需向公司秘書發出拒絕簽名電郵即可自動除名"},{"value":"B","label":"必須事先取得證監會執行人員的正式同意（Consent of the Executive），且文件中必須載明該董事被排除除名的具體原因，執行人員通常僅在例外且短暫情況下批出同意（如因身處海外無法聯繫）"},{"value":"C","label":"任何董事均享有隨意退出責任聲明的法定特權"},{"value":"D","label":"只要該董事未持有公司股票即可自動免除責任"}],"answer":"B","explanation":"指南 3-8 頁 3.5 節及 Rule 9.4 明確規定：排除任何董事的責任陳述必須獲執行人員同意（Consent of the Executive），且文件須交代原因；執行人員僅在極例外情況（如患病或海外失聯）方會給予豁免批覆。","reference":"Takeovers Code Rules 9.3, 9.4; HKSI Paper 5 Guide Topic 3 Section 3.5"},{"id":"T3-014","topic":"Topic 3","subtopic":"Target Board Composition - Resignation Prohibition during Offer","difficulty":"Level 2","question":"根據《收購守則》第 7 條（Rule 7），在收購要約期內，受要約公司董事會成員的辭任受到何種監管限制？","options":[{"value":"A","label":"董事可在要約期間隨時自由辭職，無須任何審批"},{"value":"B","label":"受要約公司的任何董事在要約期結束之前，未經執行人員事先同意（Without the consent of the Executive），一律不得辭任董事職務"},{"value":"C","label":"董事辭職必須獲得香港終審法院法官批准"},{"value":"D","label":"董事辭任必須同時交出個人全部家族存款"}],"answer":"B","explanation":"指南 3-8 頁 3.3 節及 Rule 7 規定：受要約公司董事在要約期間不得隨意辭任（No resignation without consent of the Executive），以防董事集體棄職導致少數股東利益失去受託人庇護；辞任必須獲執行人員核准。","reference":"Takeovers Code Rule 7; HKSI Paper 5 Guide Topic 3 Section 3.3"},{"id":"T3-015","topic":"Topic 3","subtopic":"Appointment of Nominee Directors - Offer Document Timing","difficulty":"Level 2","question":"在強制全面收購要約中，要約人擬指派其代表出任受要約公司或其附屬公司的董事。根據《收購守則》第 26.4 條，該項新董事任命最早何時方可生效？","options":[{"value":"A","label":"在雙方開始進行初步保密意向接觸時即可任命"},{"value":"B","label":"在要約文件正式寄發之日（Until the date of the offer document）或該日之後，方可正式任命要約人的提名人出任董事"},{"value":"C","label":"必須在要約徹底失效 6 個月後方可任命"},{"value":"D","label":"永遠不得任命任何要約人提名的人選"}],"answer":"B","explanation":"指南 3-8 頁 3.3 節及 Rule 26.4 明確規定：在全面要約落實前，要約人不得提前控制目標公司董事會；要約人的提名董事，最早只能在要約文件（Offer document）正式向股東寄發之日或之後，方可獲委任加入受要約公司董事會。","reference":"Takeovers Code Rule 26.4; HKSI Paper 5 Guide Topic 3 Section 3.3"},{"id":"T3-016","topic":"Topic 3","subtopic":"Independent Board Committee - Exclusion of Material Interest","difficulty":"Level 3","question":"根據《收購守則》第 2.1 條，受要約公司董事會成立獨立董事委員會（IBC）就收購要約向獨立股東提供建議時，下列哪位獨立非執行董事必須被排除在 IBC 之外？","options":[{"value":"A","label":"出任受要約公司審核委員會主席的 INED"},{"value":"B","label":"在要約中擁有與一般股東不同的重大利益（Material interest in the offer）、或其與要約人或一致行動方存在重大利益關聯的 INED"},{"value":"C","label":"未持有公司任何股票的 INED"},{"value":"D","label":"居住在九龍的 INED"}],"answer":"B","explanation":"指南 3-11 頁 3.20 節及 Takeovers Code Rule 2.1 規定：IBC 必須由全體非執行董事組成，但若某董事在要約中擁有直屬重大利益、或與要約方有直接關聯，該董事必須迴避並被排除在 IBC 之外，以確保意見之絕對獨立公允。","reference":"Takeovers Code Rule 2.1; HKSI Paper 5 Guide Topic 3 Section 3.20"},{"id":"T3-017","topic":"Topic 3","subtopic":"Mandatory Offer - The 30% Trigger","difficulty":"Level 1","question":"根據《香港公司收購及合併守則》第 26.1(a) 條，任何人士（不論單獨或聯同一致行動人士）在取得某公眾公司的表決權達到多少比例時，將強制觸發全面收購要約義務（Mandatory Offer Trigger）？","options":[{"value":"A","label":"達到 10% 或以上"},{"value":"B","label":"達到 20% 或以上"},{"value":"C","label":"達到 30% 或以上（30% or more of the voting rights of a company）"},{"value":"D","label":"達到 50% 或以上"}],"answer":"C","explanation":"指南 3-21 頁 4.18(a) 節及 Takeovers Code Rule 26.1(a) 明確規定：香港收購守則的法定控制權觸發點為 30%。凡增持使投票權達到或跨越 30%，必須強制向全體其他股東提出無條件現金全面要約。","reference":"Takeovers Code Rule 26.1(a); HKSI Paper 5 Guide Topic 3 Section 4.18"},{"id":"T3-018","topic":"Topic 3","subtopic":"Mandatory Offer - The Creeper Provision (2% in 12 Months)","difficulty":"Level 2","question":"根據《收購守則》第 26.1(b) 條之「自由增購率／爬行條款」（Creeper Provision），某人（及其一致行動方）原已持有該公司 30% 至 50% 之間的投票權，若其在任何連續 12 個月期間內增持投票權超過多少比例，將強制觸發全面要約？","options":[{"value":"A","label":"增持超過 1%"},{"value":"B","label":"增持超過 2%（Acquires more than 2% of the voting rights in any 12-month period）"},{"value":"C","label":"增持超過 5%"},{"value":"D","label":"增持超過 10%"}],"answer":"B","explanation":"指南 3-21 頁 4.18(b) 節及 Rule 26.1(b) 指明：持股介乎 30% 至 50% 之間者，在任何滾動 12 個月期間內，自由增持上限為 2%（Creeper）；若 12 個月內增持超過 2%，即行觸發強制全面要約義務。","reference":"Takeovers Code Rule 26.1(b); HKSI Paper 5 Guide Topic 3 Section 4.18"},{"id":"T3-019","topic":"Topic 3","subtopic":"Mandatory Offer - Holding Exceeding 50%","difficulty":"Level 2","question":"某大股東單獨實益持有香港上市公司 51.5% 的表決權股份。若該大股東在市場上進一步自由買入額外 10% 的股份，使其持股達到 61.5%，根據《收購守則》第 26 條：","options":[{"value":"A","label":"該大股東必須立即向全體股東提出強制全面收購要約"},{"value":"B","label":"該大股東不會觸發強制全面收購要約，因為其在增持前已經持有超過 50% 的絕對控制權（Holding more than 50% allows free creep without offer obligation）"},{"value":"C","label":"該大股東持股超過 50% 屬於違法，必須即時註銷超額股份"},{"value":"D","label":"必須經收購上訴委員會審裁後方可免責"}],"answer":"B","explanation":"指南 3-21 頁 4.18 節及 Rule 26.1 規定：爬行條款僅適用於持股介乎 30% 至 50% 的區間；一旦股東持股合法超越 50%，其已具備絕對多數控制權，後續在二級市場進一步增持任何比例股份均不再觸發 Rule 26 強要義務。","reference":"Takeovers Code Rule 26.1; HKSI Paper 5 Guide Topic 3 Section 4.18"},{"id":"T3-020","topic":"Topic 3","subtopic":"Mandatory Offer - Highest Price Paid Rule (6 Months)","difficulty":"Level 3","question":"根據《收購守則》第 26.3 條，要約人依據 Rule 26 提出強制全面收購要約時，其向股東提供的要約價在作價基準上不得低於：","options":[{"value":"A","label":"受要約公司過去三年的每股資產淨值"},{"value":"B","label":"要約人或其任何一致行動人士在要約期內、及在要約期開始前六個月內（Within 6 months prior to offer period），為購買受要約公司該類股份所支付的「最高價格」（Highest price paid）"},{"value":"C","label":"要約人向銀行申請貸款的利率折現價"},{"value":"D","label":"受要約公司股票的面值"}],"answer":"B","explanation":"指南 3-24 頁 4.29 節及 Rule 26.3 明確規定：強制要約價格必須等於或高於要約人及其一致行動方在要約期及要約前 6 個月內為購買該等股份所支付的最高價格（Highest price paid rule），確保股東待遇均等。","reference":"Takeovers Code Rule 26.3; HKSI Paper 5 Guide Topic 3 Section 4.29"},{"id":"T3-021","topic":"Topic 3","subtopic":"Mandatory Offer - Cash Consideration Requirement","difficulty":"Level 2","question":"根據《收購守則》第 26.2 條，依據 Rule 26 提出的全面要約，其支付代價在支付工具形式上必須具備：","options":[{"value":"A","label":"僅限於以要約人發行的未上市優先股支付"},{"value":"B","label":"必須以現金支付（Must be in cash），或附帶全額現金替代選擇（Accompanied by a cash alternative），作價不低於最高支付價"},{"value":"C","label":"必須以實物原油交割"},{"value":"D","label":"可以純粹以未經審計的承兌匯票支付"}],"answer":"B","explanation":"指南 3-24 頁 4.28 節及 Rule 26.2 規定：強制全面收購要約必須以現金（Cash）進行，或至少必須包含現金替代選擇（Cash alternative），確保少數股東享有隨時以確定現金對價套現離場的法定權利。","reference":"Takeovers Code Rule 26.2; HKSI Paper 5 Guide Topic 3 Section 4.28"},{"id":"T3-022","topic":"Topic 3","subtopic":"Mandatory Offer - Acceptance Condition (50% Plus One Vote)","difficulty":"Level 3","question":"強制全面收購要約（Rule 26）在條件設置上受到嚴格限制，要約人獲准附加的唯一法定接納條件（Condition as to acceptances）是：","options":[{"value":"A","label":"接納比例必須達到 90% 以上方可生效"},{"value":"B","label":"接納條件僅限於：要約人連同一致行動方所持有或在要約中獲接納的股份，合計超過受要約公司表決權的 50%（More than 50% of the voting rights）"},{"value":"C","label":"必須以全體董事一致留任為條件"},{"value":"D","label":"要約人可以自由附加融資到位或股市指數不跌等商業先決條件"}],"answer":"B","explanation":"指南 3-23 頁 4.26 節及 Rule 26.2 明確規定：除特定極端先決條件獲執行人員批准外，強制全面要約只能附加一項接納條件，即獲得逾 50% 投票權的接納；若要約人自身持股在要約前已跨越 50%，該要約在發出時即必須為無條件要約（Unconditional）。","reference":"Takeovers Code Rule 26.2; HKSI Paper 5 Guide Topic 3 Section 4.26"},{"id":"T3-023","topic":"Topic 3","subtopic":"Acting in Concert - Definition and Rebuttable Presumptions","difficulty":"Level 3","question":"根據《收購守則》定義，何謂「一致行動人士」（Persons Acting in Concert）？其法定核心特徵為：","options":[{"value":"A","label":"全體出席同一場股東大會並舉手表決的無關聯投資者"},{"value":"B","label":"依據口頭或書面的協議或諒解，積極合作透過其中任何人取得公司的表決權，藉以取得或鞏固對該公司的控制權（Consolidate control of a company）的人士"},{"value":"C","label":"任何在同一家商業銀行開立結算戶口的法團"},{"value":"D","label":"發行人的全體基層普通文員"}],"answer":"B","explanation":"指南 3-21 至 3-22 頁 4.20–4.21 節及《收購守則》定義：一致行動人士是指依據協議或諒解（不論明示或暗示、口頭或書面），積極合作透過收購表決權以取得或鞏固對公司控制權的人士；守則列載了九類法定推定一致行動群組（可被反駁）。","reference":"Takeovers Code Definitions; HKSI Paper 5 Guide Topic 3 Section 4.20-4.21"},{"id":"T3-024","topic":"Topic 3","subtopic":"Acting in Concert - Presumed Classes (Class 1 & 2)","difficulty":"Level 2","question":"根據《收購守則》關於一致行動人士的法定推定類別，下列哪一組主體依法被「推定為一致行動人士」（Presumed to be acting in concert，除非提出相反證據證明）？","options":[{"value":"A","label":"某公司、其母公司、附屬公司或同系附屬公司；以及任何持有該法團 20% 或以上表決權的相聯法團"},{"value":"B","label":"某法團與其所有海外普通供應商"},{"value":"C","label":"某投資者與香港交易所的全體理事"},{"value":"D","label":"上市公司與全港所有證券經紀行"}],"answer":"A","explanation":"指南 3-22 頁 4.21 節及《收購守則》一致行動推定類別第 (1) 及 (2) 類明文指明：集團內部（母公司、附屬公司、同系附屬公司）及持有 20% 投票權的相聯公司，依法自動被推定為彼此一致行動的人士。","reference":"Takeovers Code Definitions Class 1 & 2; HKSI Paper 5 Guide Topic 3 Section 4.21"},{"id":"T3-025","topic":"Topic 3","subtopic":"Acting in Concert - Directors of a Company","difficulty":"Level 2","question":"根據《收購守則》一致行動之法定推定類別第 (6) 類，受要約公司及其董事，在下列哪種特定情境下依法被推定為一致行動？","options":[{"value":"A","label":"受要約公司的董事及其近親，在受要約公司進行股份回購（Share buy-back）或受到要約收購的背景下，被推定為與該公司一致行動"},{"value":"B","label":"董事在購買個人午餐時被推定為與公司一致行動"},{"value":"C","label":"任何持有受要約公司 1 股的董事均被排除一致行動"},{"value":"D","label":"僅限於獨立非執行董事被推定"}],"answer":"A","explanation":"《收購守則》定義 Class (6) 及指南 3-22 頁 4.21 節指明：公司董事（及其近親）在涉及公司回購股份或面對外部要約時，依法推定為與該公司一致行動，以防止董事與公司配合炒作股份或防礙收購。","reference":"Takeovers Code Definitions Class 6; HKSI Paper 5 Guide Topic 3 Section 4.21"},{"id":"T3-026","topic":"Topic 3","subtopic":"The Chain Principle (Rule 26.1 Note 8)","difficulty":"Level 3","question":"根據《收購守則》第 26.1 條註釋 8 之「連鎖關係原則」（Chain Principle），買方收購了第一家母公司 35% 股權（取得控制權），該第一家公司持有第二家香港上市公司 40% 的股權。在何種條件下，買方將被強制要求就第二家香港上市公司亦提出全面收購要約？","options":[{"value":"A","label":"第二家公司位於新界時強制觸發"},{"value":"B","label":"買方取得第一家公司控制權的重大目的在於藉此獲取第二家公司的控制權；或者第二家公司所佔的資產或利潤在第一家公司中佔有「重大比例」（Substantial part，通常達 60% 或以上）"},{"value":"C","label":"只要第二家公司的股票代碼是偶數即可豁免"},{"value":"D","label":"連鎖原則在任何收購中均強制自動觸發"}],"answer":"B","explanation":"指南 3-23 頁 4.24 節及 Rule 26.1 Note 8 明確指明：連鎖原則（Chain principle）觸發兩大測試：(1) 取得母實體控制權的主要目的為取得底層香港上市公司的控制權；或 (2) 底層香港公司在母實體的資產、收入或利潤中佔有重大比重（Substantial part）。","reference":"Takeovers Code Rule 26.1 Note 8; HKSI Paper 5 Guide Topic 3 Section 4.24"},{"id":"T3-027","topic":"Topic 3","subtopic":"Whitewash Waiver - Application and Circular 26 Requirement","difficulty":"Level 3","question":"上市發行人擬向潛在控股股東配售新股以募集注資，該配售完成後該股東持股將由 20% 增至 45%，本應觸發 Rule 26 強要義務。若該股東擬申請證監會執行人員批出「清洗豁免」（Whitewash Waiver），必須滿足的核心法定條件為：","options":[{"value":"A","label":"只需由發行人董事長單方面簽發批准信"},{"value":"B","label":"該清洗豁免決議案必須在股東大會上獲得出席並投票的獨立股東以至少 75% 特別多數表決通過（或普通決議案批准底層發行），且相關承配人及其一致行動方必須放棄表決權"},{"value":"C","label":"該股東必須在獲批後 24 小時內將所有增持股份轉贈給香港政府"},{"value":"D","label":"發行人必須即時轉往 GEM 上市"}],"answer":"B","explanation":"指南 3-25 頁 4.34–4.38 節及《收購守則》附錄六（Note 1 on Dispensations from Rule 26）指明：清洗豁免必須經執行人員事先批准、由獨立財務顧問出具意見，並在股東大會經獨立股東投票通過（Whitewash 決議案須 75% 獨立投票贊成；配發新股決議案須過半數贊成），受惠人及其聯繫人須放棄表決。","reference":"Takeovers Code Rule 26 Dispensations; HKSI Paper 5 Guide Topic 3 Section 4.34-4.38"},{"id":"T3-028","topic":"Topic 3","subtopic":"Whitewash Waiver - Disqualification by Disqualifying Transactions","difficulty":"Level 3","question":"某大股東正擬就新股認購申請清洗豁免（Whitewash Waiver）。若該大股東在有關交易建議的商討開始至股東大會表決日之間的期間內，在市場上私下買入了受要約公司的上市股份，該項自營買賣將引發何種後果？","options":[{"value":"A","label":"執行人員將獎勵該股東雙倍配股額度"},{"value":"B","label":"該項買賣構成「喪失資格交易」（Disqualifying transaction），執行人員通常「絕對不會批出清洗豁免」（The Executive will normally not grant a whitewash waiver），且該股東必須在完成交易後履行強制全面要約"},{"value":"C","label":"只要補繳印花稅即可免責"},{"value":"D","label":"該股份自動轉換為可換股優先股"}],"answer":"B","explanation":"指南 3-25 頁 4.36 節及《收購守則》附錄六規定：申請清洗豁免者在建議商討至大會投票期間，若在二級市場買入股份（Disqualifying transactions），將直接剝奪其申請清洗豁免的資格，執行人員通常斷然拒絕批出豁免。","reference":"Takeovers Code Schedule VI; HKSI Paper 5 Guide Topic 3 Section 4.36"},{"id":"T3-029","topic":"Topic 3","subtopic":"Voluntary Offers - 50% Statutory Minimum Condition","difficulty":"Level 2","question":"根據《收購守則》第 30.2 條，自願全面要約（Voluntary Offer）可以附加要約人自行設定的合理條件，但其受到的法定強制底線條件是：","options":[{"value":"A","label":"要約人可以設定為獲得 1 股接納即可生效"},{"value":"B","label":"該要約必須附帶一項條件：要約人連同一致行動方所持有的股份加上在要約中收到的接納，合計必須獲得超過 50% 的投票權（Condition that offeror receives acceptances carrying more than 50% of voting rights）"},{"value":"C","label":"自願要約接納比例必須強制達到 95%"},{"value":"D","label":"自願要約不得附加任何接納條件"}],"answer":"B","explanation":"指南 3-27 頁 4.41 節及 Rule 30.2 明確規定：自願全面收購要約必須以要約人獲得超過 50% 表決權之接納為生效條件；若要約人自身已持有逾 50%，則要約為無條件。","reference":"Takeovers Code Rule 30.2; HKSI Paper 5 Guide Topic 3 Section 4.41"},{"id":"T3-030","topic":"Topic 3","subtopic":"Comparable Offers - Non-voting Equity Capital (Rule 13/14)","difficulty":"Level 2","question":"根據《收購守則》第 13 條及第 14 條，當要約人對受要約公司的普通有投票權股份提出全面要約時，若受要約公司同時存在尚未轉換的未上市可換股債券、期權或無投票權股份，要約人負有何種法定要約義務？","options":[{"value":"A","label":"要約人可以完全無視該等衍生證券持有人"},{"value":"B","label":"要約人必須向該等認股權、期權或可轉債的持有人提出「相若要約／對等要約」（Comparable offer or appropriate offer），確保其獲得公允對等的條款"},{"value":"C","label":"要約人有權強制要求法院無償註銷所有該等未行使權證"},{"value":"D","label":"要約人必須以普通股發行價的十倍收購該等權證"}],"answer":"B","explanation":"指南 3-5 頁 2.3 節、3-28 頁 4.44–4.45 節及 Rule 13/14 指明：提出全面要約時，若目標公司有可換股工具、期權或不同類別股份，要約人必須依據規則向彼等提出相若或適當的對等要約（Comparable offer），維持各類證券持有人的公平待遇。","reference":"Takeovers Code Rules 13, 14; HKSI Paper 5 Guide Topic 3 Section 4.44-4.45"},{"id":"T3-031","topic":"Topic 3","subtopic":"Offer Timetable - Rule 8.2 Despatch of Offer Document (21 Days)","difficulty":"Level 2","question":"根據《收購守則》第 8.2 條，要約人在刊發 Rule 3.5 正式要約公布後，常規必須在公告公布之日起計多少天內，向受要約公司全體股東寄發正式要約文件（Offer Document）？","options":[{"value":"A","label":"7 天內"},{"value":"B","label":"21 天之內（Within 21 days of the date of the offer announcement）"},{"value":"C","label":"60 天內"},{"value":"D","label":"1 年之內"}],"answer":"B","explanation":"指南 3-29 頁 4.48 節及 Rule 8.2 指明：要約人必須在公布要約條款公告（Rule 3.5 公告）後 21 天內，將要約文件（Offer document）寄發予受要約公司全體股東；若為涉及換股的證券要約，時限為 35 天。","reference":"Takeovers Code Rule 8.2; HKSI Paper 5 Guide Topic 3 Section 4.48"},{"id":"T3-032","topic":"Topic 3","subtopic":"Offer Timetable - Offeree Board Circular (14 Days)","difficulty":"Level 2","question":"若要約文件與目標公司回應文件分開寄發，根據《收購守則》第 8.4 條，受要約公司董事會必須在要約文件寄發之日起計多少天內，向全體股東寄發受要約公司董事會通函（Offeree Board Circular，載有獨立董事委員會及 IFA 意見）？","options":[{"value":"A","label":"3 天內"},{"value":"B","label":"14 天之內（Within 14 days of the date of the offer document）"},{"value":"C","label":"30 天內"},{"value":"D","label":"半年之內"}],"answer":"B","explanation":"指南 3-29 頁 4.48 節及 Rule 8.4 規定：在分開寄發架構下，目標公司通函（Offeree circular，載有董事會、IBC 及 IFA 意見）必須在要約人寄發要約文件後 14 天內寄出。","reference":"Takeovers Code Rule 8.4; HKSI Paper 5 Guide Topic 3 Section 4.48"},{"id":"T3-033","topic":"Topic 3","subtopic":"Offer Timetable - Composite Document","difficulty":"Level 1","question":"在香港收購實務中，要約人與受要約公司常選擇合編一份文件向全體股東寄發。該份集要約文件與受要約公司董事會通函於一體的法定文件被稱為：","options":[{"value":"A","label":"冷淡對待備忘錄"},{"value":"B","label":"綜合文件（Composite Document）"},{"value":"C","label":"協議安排法令"},{"value":"D","label":"招股章程補充頁"}],"answer":"B","explanation":"指南 3-29 頁 4.48 節指明：要約人與目標公司可聯合發布「綜合文件」（Composite Document），將要約人的要約文件與受要約公司董事會通函合併編印，須在公布要約後 21 天內寄發。","reference":"Takeovers Code Rule 8.2; HKSI Paper 5 Guide Topic 3 Section 4.48"},{"id":"T3-034","topic":"Topic 3","subtopic":"Offer Timetable - Day 21 First Closing Date","difficulty":"Level 2","question":"根據《收購守則》第 15.1 條，全面收購要約自要約文件（或綜合文件）寄發之日起計，其首個最早接納截止日期（First Closing Date）不得少於多少天？","options":[{"value":"A","label":"不得少於 7 天"},{"value":"B","label":"不得少於 21 天（Must be open for at least 21 days following the date on which the document is posted）"},{"value":"C","label":"不得少於 60 天"},{"value":"D","label":"首日接納期由要約人自由決定，可設為 1 小時"}],"answer":"B","explanation":"指南 3-30 頁 4.49 節及 Rule 15.1 明確規定：要約接納期在寄發要約文件後，必須維持開放至少 21 天（Day 21 為首個截止日期）；若兩份文件分開寄發，則至少維持開放至目標公司通函寄發後 14 天（兩者取較遲者）。","reference":"Takeovers Code Rule 15.1; HKSI Paper 5 Guide Topic 3 Section 4.49"},{"id":"T3-035","topic":"Topic 3","subtopic":"Offer Timetable - Day 60 Final Closing Date (Unconditional as to Acceptances)","difficulty":"Level 3","question":"根據《收購守則》第 15.5 條（Day 60 規則），一項附條件的全面要約（Conditional Offer），在要約文件寄發之日起計的第 60 天（Day 60）午夜前：","options":[{"value":"A","label":"要約人可以無期限自動順延要約"},{"value":"B","label":"若該要約在第 60 天前仍未能就接納而言宣布為無條件（Unconditional as to acceptances），該要約將告徹底失效（Offer must lapse），除非該要約在競爭對手出現等例外情況下獲准延長"},{"value":"C","label":"受要約公司全體董事自動轉讓股份"},{"value":"D","label":"要約人必須強制調高要約價 100%"}],"answer":"B","explanation":"指南 3-30 頁 4.49 節及 Rule 15.5 明確指明：Day 60 是要約在接納上成為無條件的絕對最終期限；若至第 60 天仍未跨越接納門檻，要約即告失效，防止目標公司及其股東無休止處於不確定的防守狀態。","reference":"Takeovers Code Rule 15.5; HKSI Paper 5 Guide Topic 3 Section 4.49"},{"id":"T3-036","topic":"Topic 3","subtopic":"Offer Timetable - Settlement Period (7 Business Days)","difficulty":"Level 2","question":"根據《收購守則》第 20.1 條，在要約宣布成為無條件且股東遞交有效股份接納書後，要約人向該接納股東支付收購代價的法定最長時限為：","options":[{"value":"A","label":"接獲有效接納之日起 24 小時內"},{"value":"B","label":"在七個營業日之內（Within 7 business days of the later of the date the offer becomes unconditional and the receipt of valid acceptances）"},{"value":"C","label":"在 30 個曆日內"},{"value":"D","label":"在要約結束滿一年後"}],"answer":"B","explanation":"指南 3-31 頁 4.52 節及 Rule 20.1 規定：支付要約代價的法定結算時限為 7 個營業日（Within 7 business days），自要約成為無條件或過戶處接獲有效完整接納文件（以較遲者為準）起計算。","reference":"Takeovers Code Rule 20.1; HKSI Paper 5 Guide Topic 3 Section 4.52"},{"id":"T3-037","topic":"Topic 3","subtopic":"Dealings Disclosure - Rule 22 Disclosure Regime","difficulty":"Level 2","question":"根據《收購守則》第 22 條（Rule 22），在收購要約期內，下列哪類人士進行要約人或受要約公司的相關證券交易時，負有在交易翌日向證監會申報的法定/守則披露責任？","options":[{"value":"A","label":"持股 0.001% 的無關聯公眾散戶"},{"value":"B","label":"要約人、受要約公司、持有受要約公司任何類別證券 5% 或以上的大股東、彼等各自的聯系人（Associates，包括財務顧問、證券商）、以及要約各方的一致行動人士"},{"value":"C","label":"香港警務處警員"},{"value":"D","label":"受要約公司的清潔承包商"}],"answer":"B","explanation":"指南 1-41 頁 4.59 節、3-31 頁 4.53 節及 Rule 22 指明：Rule 22 規範要約期間的交易申報，涵蓋要約方、目標公司、持股 5% 以上大股東、相聯法人及其專業財務顧問等聯繫人（Associates），確保市場持倉交易完全透明。","reference":"Takeovers Code Rule 22; HKSI Paper 5 Guide Topic 1 Section 4.59; Topic 3 Section 4.53"},{"id":"T3-038","topic":"Topic 3","subtopic":"Share Buy-backs Code - Four Methods of Share Buy-backs","difficulty":"Level 2","question":"根據香港《股份回購守則》（Code on Share Buy-backs）第 1.2 段及第 2 條，上市發行人回購其自身股份的四種法定認可途徑包括：","options":[{"value":"A","label":"場內股份回購、場外股份回購、全面要約回購、及獲豁免的股份回購（On-market, off-market, by general offer, and exempt share buy-backs）"},{"value":"B","label":"強制沒收回購、慈善捐贈回購、公開拍賣回購、司法清盤回購"},{"value":"C","label":"僅限於場內透過自動撮合系統回購一種途徑"},{"value":"D","label":"由全體董事私下簽訂互換合約"}],"answer":"A","explanation":"指南 1-38 頁 4.44 節、2-24 頁 5.1 節及 3-34 頁 6.1 節指明：《股份回購守則》認可四種回購方式：(1) 場內股份回購（On-market）；(2) 場外股份回購（Off-market）；(3) 全面要約回購（By general offer）；(4) 獲豁免股份回購（Exempt buy-backs）。","reference":"Share Buy-backs Code; HKSI Paper 5 Guide Topic 2 Section 5.1; Topic 3 Section 6.1"},{"id":"T3-039","topic":"Topic 3","subtopic":"Off-market Share Buy-backs - Approval Threshold (75%)","difficulty":"Level 3","question":"上市發行人若擬透過「場外交易」（Off-market share buy-back）向特定股東回購股份，根據《股份回購守則》第 2 條，除須獲證監會執行人員事先核准外，在股東大會上的表決通過門檻為：","options":[{"value":"A","label":"普通決議案過半數贊成即可"},{"value":"B","label":"必須在股東大會上經出席大會的無利害關係股東（Disinterested shareholders）所投票數中至少 75% 特別多數批准，且售股股東及其聯繫人必須放棄表決權"},{"value":"C","label":"全體股東 100% 一致書面同意"},{"value":"D","label":"無須股東大會批准，只需全體非執董簽字"}],"answer":"B","explanation":"指南 3-35 頁 6.4 節及《股份回購守則》Rule 2 指明：場外回購涉及向特定股東輸送現金，必須獲執行人員批准，且在股東大會由「無利害關係股東」（Disinterested shareholders）以至少 75% 投票權贊成通過，擬出售股份的股東必須迴避表決。","reference":"Share Buy-backs Code Rule 2; HKSI Paper 5 Guide Topic 3 Section 6.4"},{"id":"T3-040","topic":"Topic 3","subtopic":"Share Buy-backs Triggering Mandatory Offer under Rule 26","difficulty":"Level 3","question":"某上市發行人進行股份回購並予以註銷。由於總股本縮減，大股東 A 原持有 28.5% 的股權被動上升至 31.2%。根據《收購守則》第 32 條（Rule 32），該大股東 A 的強要法律責任為：","options":[{"value":"A","label":"因屬被動上升，該大股東終身完全免除任何義務"},{"value":"B","label":"該持股上升跨越 30% 通常被視為一項收購，大股東 A 原則上將觸發強制全面要約義務；但若該大股東在回購大會上放棄投票並證明該增加純屬被動且符合特定豁免程序，可向執行人員申請免除強要責任"},{"value":"C","label":"該大股東必須在 24 小時內向法院申請破產"},{"value":"D","label":"公司回購行為自動無效"}],"answer":"B","explanation":"指南 3-26 頁 4.39 節及 Rule 32 明確規定：股份回購註銷導致大股東持股被動跨越 30%（或 2% 爬行率），視同收購表決權並觸發 Rule 26 強要義務；但若大股東在回購大會上不表決且未主動策劃，可向執行人員申請免除該全面要約義務。","reference":"Takeovers Code Rule 32; HKSI Paper 5 Guide Topic 3 Section 4.39"},{"id":"T3-041","topic":"Topic 3","subtopic":"Executive Director - Corporate Finance Division First Instance Rulings","difficulty":"Level 2","question":"在《收購守則》的日常運作架構中，負責處理所有守則條文之日常詮釋、日常審批及作出各項「第一審裁決」（First-instance rulings，紀律事宜除外）的專責監管主體為：","options":[{"value":"A","label":"香港交易所上市委員會全體大會"},{"value":"B","label":"香港證監會企業融資部執行董事或其轉授權人員（Executive Director of the Corporate Finance Division of the SFC or delegates）"},{"value":"C","label":"香港特區審計署署長"},{"value":"D","label":"香港終審法院常任法官"}],"answer":"B","explanation":"指南 1-7 頁 1.17 節、3-3 頁 1.5 節及 3-36 頁 7.1 節指明：證監會企業融資部執行董事（統稱「執行人員」/ The Executive）負責《守則》的日常管理，負責就日常所有非紀律事宜（如豁免申請、要約文件審批）作出第一審裁決。","reference":"Takeovers Code Introduction; HKSI Paper 5 Guide Topic 3 Section 1.5, 7.1"},{"id":"T3-042","topic":"Topic 3","subtopic":"Takeovers and Mergers Panel - Review of Executive Rulings","difficulty":"Level 2","question":"當任何當事人對證監會收購執行人員（The Executive）所作出的第一審裁決感到不滿並提出異議時，該當事人有權提請下列哪一個委員會進行覆核聆訊？","options":[{"value":"A","label":"香港警務處處長辦公室"},{"value":"B","label":"收購及合併委員會（Takeovers and Mergers Panel）"},{"value":"C","label":"收購上訴委員會（Takeovers Appeal Committee）"},{"value":"D","label":"廉政公署防止貪污處"}],"answer":"B","explanation":"指南 1-7 頁 1.17(b) 節、3-36 頁 7.3 節及 3-37 頁 7.6 節明文指明：任何受執行人員裁決影響而不滿意該裁決的當事人，有權要求將該裁決轉呈「收購及合併委員會」（Takeovers and Mergers Panel）進行全面覆核審議。","reference":"Takeovers Code Introduction para 1.8; HKSI Paper 5 Guide Topic 1 Section 1.17; Topic 3 Section 7.3"},{"id":"T3-043","topic":"Topic 3","subtopic":"Disciplinary Proceedings - First Instance Hearings by the Panel","difficulty":"Level 2","question":"當證監會收購執行人員在調查中發現某人涉嫌嚴重違反《收購守則》（如違反強要義務或虛假陳述）並擬提起正式紀律處分時，該紀律案件的「第一審聆訊」（Hear disciplinary matters in the first instance）專責由誰主審？","options":[{"value":"A","label":"香港終審法院首席法官"},{"value":"B","label":"收購及合併委員會（Takeovers and Mergers Panel）"},{"value":"C","label":"收購執行人員個人單獨宣判"},{"value":"D","label":"香港交易所行政總裁"}],"answer":"B","explanation":"指南 1-7 頁 1.17(a) 節、3-37 頁 7.5 節及 3-39 頁 7.21 節明文規定：所有涉及違反《守則》的紀律事宜，第一審均必須提呈由「收購及合併委員會」（Panel）召開實體聆訊進行審裁。","reference":"Takeovers Code Introduction para 1.7; HKSI Paper 5 Guide Topic 1 Section 1.17; Topic 3 Section 7.5"},{"id":"T3-044","topic":"Topic 3","subtopic":"Takeovers Panel Sanctions - Cold Shoulder Orders","difficulty":"Level 3","question":"收購及合併委員會（Panel）在裁定某人嚴重違反《收購守則》後，獲賦權施加嚴厲的「冷淡對待令」（Cold Shoulder Order）。該制裁措施在實務運作上的法律效果為：","options":[{"value":"A","label":"沒收該人士名下的所有實體房屋產權"},{"value":"B","label":"在指定期限內命令全體證監會持牌中介人、認可機構及交易所參與者，不得直接或間接代表該受制裁人士進行任何證券買賣交易，實質切斷其使用香港證券市場設施的全部渠道"},{"value":"C","label":"強制將該人士遣送出境"},{"value":"D","label":"命令該人士全家不得在香港搭乘公共交通"}],"answer":"B","explanation":"指南 1-42 至 1-43 頁 4.71 節、3-39 至 3-40 頁 7.28 節及 Takeovers Code 規定：冷淡對待令是指委員會向市場發出命令，要求業界在特定期間（如 18 個月或數年）內不得代表該違規者買賣任何香港證券，使其喪失進入香港資本市場的權能。","reference":"Takeovers Code Introduction; HKSI Paper 5 Guide Topic 1 Section 4.71; Topic 3 Section 7.28"},{"id":"T3-045","topic":"Topic 3","subtopic":"Takeovers Appeal Committee - Sanction Fairness Appeal Only","difficulty":"Level 2","question":"受處分當事人若不服收購及合併委員會（Panel）在紀律裁決中所施加的制裁，向收購上訴委員會（TAC）提出上訴。TAC 審理該上訴的法定審理範疇受到的嚴格限定為：","options":[{"value":"A","label":"全面重審原案的所有事實證據，推翻是否違規的裁定"},{"value":"B","label":"專門且僅限於判定收購委員會所施加的制裁措施是否「不公平或過度嚴苛」（Sole purpose of determining whether any sanction imposed is unfair or excessive）"},{"value":"C","label":"命令香港律政司向該當事人賠償律師費"},{"value":"D","label":"強制將案件轉交國際刑事法庭"}],"answer":"B","explanation":"指南 1-7 頁 1.18 節及 3-40 頁 7.30 節明文指明：收購上訴委員會（Takeovers Appeal Committee, TAC）的審理權限是受限的，其「唯一目的」（Sole purpose）僅在於審定由委員會施加的紀律處分是否不公平或過度嚴厲，不重新審理基本事實判定。","reference":"Takeovers Code Introduction para 1.9; HKSI Paper 5 Guide Topic 1 Section 1.18; Topic 3 Section 7.30"},{"id":"T3-046","topic":"Topic 3","subtopic":"Dealings with the Executive - Duty of Open Cooperation","difficulty":"Level 2","question":"根據《收購守則》導言第 1.6 段，所有與收購執行人員、委員會打交道的當事人及其財務顧問，負有何種法規標準義務？","options":[{"value":"A","label":"在簽訂保密協議前可向監管機構提供虛構數據"},{"value":"B","label":"必須保持坦誠、合作（Open, co-operative），恪守極高標準迅速披露所知悉的一切相關資料，並及時更正或更新先前提供的任何資料"},{"value":"C","label":"除書面傳真外嚴禁與執行人員通話"},{"value":"D","label":"僅需在被法院起訴時才配合調查"}],"answer":"B","explanation":"指南 3-3 頁 1.6 節明確規定：任何人士與執行人員交涉時，必須保持全面坦誠與合作（Open and co-operative），迅速呈交一切攸關資料，並主動更新或更正先前呈交的資料，維護監管程序的誠實信用。","reference":"Takeovers Code Introduction para 1.6; HKSI Paper 5 Guide Topic 3 Section 1.6"},{"id":"T3-047","topic":"Topic 3","subtopic":"Whitewash Waiver - Repurchase Creeping Whitewash","difficulty":"Level 3","question":"當上市發行人擬進行大規模場外股份回購或要約回購，若該回購會導致某位持股 35% 的大股東的表決權在 12 個月內被動增長超過 2%（觸發爬行條款）。該大股東若要免於履行強要責任，其必須採取的途徑為：","options":[{"value":"A","label":"在回購完成後自行向聯交所發出道歉函"},{"value":"B","label":"事先向證監會執行人員正式申請清洗豁免（Whitewash Waiver），並在公司股東大會上經無利害關係獨立股東投票通過"},{"value":"C","label":"該大股東必須在回購當天辭任董事職務"},{"value":"D","label":"強制將超額 2% 的股份以每股 1 仙在市場拋售"}],"answer":"B","explanation":"指南 3-26 頁 4.39 節及 Rule 32 指明：因回購導致被動跨越 30% 或突破 2% 爬行率的大股東，若擬免於發出全面要約，必須事先依據守則附錄六向執行人員申請並取得清洗豁免（Whitewash waiver），並獲獨立股東投票批准。","reference":"Takeovers Code Rule 32, Schedule VI; HKSI Paper 5 Guide Topic 3 Section 4.39"},{"id":"T3-048","topic":"Topic 3","subtopic":"Voluntary Offers - Share Buy-backs by General Offer Application","difficulty":"Level 2","question":"根據《股份回購守則》第 2.4 段，當上市發行人以「全面要約形式」（Share Buy-backs by General Offer）向全體股東回購其本身股份時，該交易適用的監管規則為：","options":[{"value":"A","label":"僅適用《破產條例》"},{"value":"B","label":"該項要約被視為一項收購要約，因此《股份回購守則》及《收購守則》（Takeovers Code）的所有相關規則均同時適用於該交易"},{"value":"C","label":"完全免除遵守任何守則，僅需在發行人官網公布即可"},{"value":"D","label":"僅需向香港稅務局存檔"}],"answer":"B","explanation":"指南 1-38 頁 4.44 節、3-5 頁 2.4 節及《股份回購守則》指明：以全面要約形式進行的股份回購，在法律本質上構成收購要約，因此《收購守則》（包括要約時間表、資訊平等、撤銷限制）與《股份回購守則》均同時具備約束力。","reference":"Share Buy-backs Code para 2.4; HKSI Paper 5 Guide Topic 3 Section 2.4"},{"id":"T3-049","topic":"Topic 3","subtopic":"Takeovers Panel Statements and Practice Notes","difficulty":"Level 1","question":"香港證監會及收購委員會定期發布的《實務指引》（Practice Notes）、《執行人員聲明》（Executive Statements）及季度通訊《收購通訊》（Takeovers Bulletin），在收購監管體系中的作用是：","options":[{"value":"A","label":"由香港警務處簽發的逮捕令合集"},{"value":"B","label":"為市場從業人員提供具備高度參考價值的實務指導、釋法澄清及典型案例解析，協助業界精確理解與應用《守則》精神與條文"},{"value":"C","label":"各上市公司董事長私人通訊錄"},{"value":"D","label":"僅在開曼群島具備成文法約束力"}],"answer":"B","explanation":"指南 3-4 頁 1.8 節指明：《實務指引》、執行人員聲明、委員會裁決理由及《收購通訊》等文件，為市場參與者提供了對《守則》如何詮釋與適用的重要指導與案例先例，持牌從業員必須深入熟悉該等文件內容。","reference":"Takeovers Code; HKSI Paper 5 Guide Topic 3 Section 1.8"},{"id":"T3-050","topic":"Topic 3","subtopic":"Summary of Topic 3 - The Spirit of the Codes","difficulty":"Level 2","question":"根據《收購守則》導言總結，在處理《守則》條文未有明文具體涵蓋的新穎複雜收購情境時，執行人員及收購委員會所貫徹的最高裁判準則是：","options":[{"value":"A","label":"因條文未明文規定，一律視為合法且不受任何規管"},{"value":"B","label":"遵守《守則》的「精神」（Spirit of the Codes）以及十項一般原則，一般原則及守則精神可延伸並適用於任何未被具體規則明文規定的交易情境"},{"value":"C","label":"強制將交易各方移交海外法院裁決"},{"value":"D","label":"僅依據要約人聘請的法律顧問的單方面口頭抗辯裁決"}],"answer":"B","explanation":"指南 3-7 頁 2.9 節及《收購守則》導言明確強調：《守則》無法窮盡所有收購場景，市場從業者必須恪守十項一般原則與守則之「精神」（Spirit of the Codes）；一般原則的精神可適用於規則未有明文提及的任何交易情況，有疑問必須及早諮詢執行人員。","reference":"Takeovers Code Introduction; HKSI Paper 5 Guide Topic 3 Section 2.9"},{"id":"T3-051","topic":"Topic 3","subtopic":"Mandatory Offer - Calculation of Voting Rights","difficulty":"Level 2","question":"某投資者持有甲香港上市公司 28.5% 的有投票權股份。甲公司隨後向獨立第三方增發新股，使該投資者的持股比例被稀釋至 26.0%。三個月後，該投資者在二級市場大手增持股份，持股比例回升至 30.5%。根據《收購守則》第 26.1 條，該投資者：","options":[{"value":"A","label":"無須提出全面要約，因為其持股比例相較於最初的 28.5% 僅淨增加 2.0%"},{"value":"B","label":"必須立即向甲公司全體其他股東發出強制全面收購要約，因為其持股比例跨越了 30% 的法定門檻"},{"value":"C","label":"只要在增持後 3 個營業日內將持股減持回 29.9%，即可自動免除要約義務"},{"value":"D","label":"無須提出全面要約，因為被動稀釋前的持股水平已接近 30%"}],"answer":"B","explanation":"根據《收購守則》第 26.1(a) 條及學習指南 3-21 頁 4.18 節，任何人不論先前持股經歷過何種稀釋或波動，一旦其持股（連同一致行動人士）從低於 30% 增加至 30% 或以上，即觸發不可逆的強制全面要約義務。不得以稀釋前的歷史持股作抗辯，亦不可透過事後減持消除既成之強要義務。","reference":"Takeovers Code Rule 26.1(a); HKSI Paper 5 Guide Topic 3 Section 4.18"},{"id":"T3-052","topic":"Topic 3","subtopic":"The Creeper Provision - Rolling 12-Month Period Calculation","difficulty":"Level 3","question":"投資者乙持有某香港上市公司 35.0% 的投票權。2025 年 6 月 1 日，乙在市場增持 1.2% 股份；2025 年 11 月 1 日，乙再度增持 0.5% 股份。2026 年 4 月 15 日，乙計劃進一步增持股份。根據《收購守則》第 26.1(b) 條之自由增購率（Creeper）規定，乙在 2026 年 4 月 15 日當天最多可增持多少比例的股份而不會觸發強制全面要約？","options":[{"value":"A","label":"最多可增持 0.3%（因為在滾動 12 個月內已累計增持 1.7%，總增持不得超過 2.0%）"},{"value":"B","label":"最多可增持 0.8%（因為每曆年額度為 2.0%）"},{"value":"C","label":"最多可增持 2.0%（因為每次增持間隔已超過 3 個月）"},{"value":"D","label":"最多可增持 0.5%（因為 2025 年 6 月的增持在計算時可予以折半扣減）"}],"answer":"A","explanation":"指南 3-21 頁 4.18(b) 節及 Rule 26.1(b) 規定：爬行條款的 2% 上限是以「任何滾動 12 個月期間」（Any 12-month period）計算，而非按日曆年劃分。在 2025 年 6 月 1 日至 2026 年 4 月 15 日期間（不足 12 個月），乙已累計增持 1.2% + 0.5% = 1.7%。因此，在 2026 年 4 月 15 日，乙最多只能增持少於或等於 0.3%（使 12 個月內總增幅不超過 2%），否則即觸發全面要約。","reference":"Takeovers Code Rule 26.1(b); HKSI Paper 5 Guide Topic 3 Section 4.18"},{"id":"T3-053","topic":"Topic 3","subtopic":"The Creeper Provision - Lowest Percentage Base Point","difficulty":"Level 3","question":"根據《收購守則》第 26.1 條註釋 4，在計算 12 個月內 2% 的自由增購率時，該 2% 增幅所參照的基準點是：","options":[{"value":"A","label":"緊接每次增持前該人持有的股份平均值"},{"value":"B","label":"該人或其一致行動群組在該 12 個月期間內所持有的「最低股權百分比」（Lowest percentage holding in that 12-month period）"},{"value":"C","label":"受要約公司在該 12 個月期間發行在外的最高股本總額"},{"value":"D","label":"該人在上一個財政年度年報中所披露的期末持股量"}],"answer":"B","explanation":"依據 Takeovers Code Rule 26.1 Note 4：2% 自由增購率是以該人在有關 12 個月期間內所持有的最低股權百分比（Lowest percentage holding）為基準進行比較。若該人先減持後增持，其買入上限將受到該 12 個月內最低持股低點的嚴格壓制，防止透過反覆買賣規避 2% 界限。","reference":"Takeovers Code Rule 26.1 Note 4; HKSI Paper 5 Guide Topic 3 Section 4.18"},{"id":"T3-054","topic":"Topic 3","subtopic":"Acting in Concert - Rebuttal Procedure","difficulty":"Level 2","question":"某商業銀行的全資附屬投資機構在某上市公司持有 5% 股份，而該銀行所屬集團的資產管理部門代客持有該上市公司另外 26% 股份。兩者表面落入集團關聯法定推定一致行動類別。若彼等主張雙方獨立運作且並非一致行動人士，必須履行的合規程序為：","options":[{"value":"A","label":"兩家機構各自在內部備忘錄簽字確認即可，無須知會監管機構"},{"value":"B","label":"必須向證監會執行人員提請申請並提呈充分客觀證據，向執行人員成功「反駁該推定」（Rebut the presumption），取得執行人員的書面確認裁定"},{"value":"C","label":"必須在香港各大財經報章刊登聲明"},{"value":"D","label":"直接向香港交易所上市委員會備案"}],"answer":"B","explanation":"指南 3-21 至 3-22 頁 4.21 節指明：《守則》設立的九類一致行動類別均屬於「可反駁的推定」（Rebuttable presumptions）。若當事人主張不存在一致行動關係，必須向執行人員（The Executive）主動舉證並獲得其正式確認以推翻該推定，不可自行判定免責。","reference":"Takeovers Code Definitions; HKSI Paper 5 Guide Topic 3 Section 4.21"},{"id":"T3-055","topic":"Topic 3","subtopic":"Acting in Concert - Financial Advisers as Presumed Concert Parties","difficulty":"Level 2","question":"根據《收購守則》關於一致行動人士之法定推定類別第 (5) 類，受聘擔任要約人或受要約公司財務顧問的持牌法團（及其同集團成員），在收購背景下被推定為：","options":[{"value":"A","label":"完全中立的監管代表"},{"value":"B","label":"分別與其委聘客戶（要約人或受要約公司）屬於一致行動的人士（Presumed to be acting in concert with its client）"},{"value":"C","label":"與香港證監會法規執行部一致行動的人士"},{"value":"D","label":"受要約公司全體獨立少數股東的法定代表"}],"answer":"B","explanation":"指南 3-22 頁 4.21 節及《收購守則》定義 Class (5) 指明：財務顧問或其集團成員，就該項交易而言，依法被推定為與委聘該顧問的客戶（無論是要約人或目標公司）一致行動，因此該財務機構自身的自營或關聯買賣受制於嚴格的交易披露與限制。","reference":"Takeovers Code Definitions Class 5; HKSI Paper 5 Guide Topic 3 Section 4.21"},{"id":"T3-056","topic":"Topic 3","subtopic":"Special Deals with Favourable Conditions (Rule 25)","difficulty":"Level 3","question":"根據《收購守則》第 25 條（Rule 25），要約人或其一致行動人士在要約期內或在考慮提出要約期間，與受要約公司的某位特定股東訂立一項附帶優惠條件的特別交易（Special deal with favourable conditions）。此類安排在何種法定條件下才獲准實施？","options":[{"value":"A","label":"只要該股東持有少於 1% 股份即可隨意訂立"},{"value":"B","label":"必須取得證監會執行人員的事先同意（Consent of the Executive），且該交易必須經獨立財務顧問公開確認屬公平合理，並在股東大會獲得無利害關係獨立股東通過決議案批准"},{"value":"C","label":"只要要約人以雙倍現金收購該股份即可豁免審批"},{"value":"D","label":"守則絕對禁止任何形式的特別安排，在任何情況下均不可獲批"}],"answer":"B","explanation":"指南 3-13 至 3-14 頁 3.27 節及 Rule 25 明確規定：涉及特別優惠條件的交易（Special deals）原則上被禁止，除非：(1) 獲得執行人員同意；(2) 獨立財務顧問出具意見信納條款公平合理；且 (3) 獲受要約公司無利害關係股東於大會表決通過。","reference":"Takeovers Code Rule 25; HKSI Paper 5 Guide Topic 3 Section 3.27"},{"id":"T3-057","topic":"Topic 3","subtopic":"Rule 25 - Arrangements with Target Directors / Management","difficulty":"Level 3","question":"在收購交易中，要約人承諾在收購完成後，讓受要約公司的現任行政總裁繼續留任並獲贈新控股實體的 5% 股權激勵。該安排屬於：","options":[{"value":"A","label":"完全不受規管的正常勞工僱傭合同"},{"value":"B","label":"受《收購守則》第 25 條約束的特別交易（Special deal），因為其向身為股東的管理層提供了非全體股東均可享有的特殊利益，必須尋求執行人員同意並獲獨立股東投票批准"},{"value":"C","label":"合法的免稅退休金儲備"},{"value":"D","label":"自動導致要約失效的違規行為"}],"answer":"B","explanation":"Takeovers Code Rule 25 Note 4 及指南 3-13 至 3-14 頁 3.27 節指明：要約人向目標公司兼任股東的管理層提供再投資機會、留任花紅或股權激勵，均構成 Rule 25 下的特別交易，因其提供了排他性利益，必須經執行人員審查及獨立股東大會批准。","reference":"Takeovers Code Rule 25 Note 4; HKSI Paper 5 Guide Topic 3 Section 3.27"},{"id":"T3-058","topic":"Topic 3","subtopic":"Talks Announcements - Rule 3.7 Monthly Updates","difficulty":"Level 2","question":"受要約公司在二級市場出現異常股價波動後，依據《收購守則》第 3.7 條發出初步商討公告（Talks announcement）。在雙方尚未達成確定要約條款前，受要約公司負有何種持續跟進披露責任？","options":[{"value":"A","label":"公告發布後可無限期保持沉默"},{"value":"B","label":"受要約公司必須以按月發布的方式（Monthly announcements）刊發公告交代商討進展，直至公布落實發出要約的決定或公布終止商討為止"},{"value":"C","label":"必須每週召開一次記者發布會"},{"value":"D","label":"必須每日收市後發布一份備案函件"}],"answer":"B","explanation":"依據 Takeovers Code Rule 3.7：受要約公司發布初次可能要約公告後，必須每月至少刊發一次跟進公告（Monthly announcements），向市場更新商討進度，直至宣布 Rule 3.5 確定要約意向或宣布終止談判（PUSU 框架）。","reference":"Takeovers Code Rule 3.7; HKSI Paper 5 Guide Topic 3 Section 4.4"},{"id":"T3-059","topic":"Topic 3","subtopic":"Put Up or Shut Up (PUSU) - Imposition by Executive","difficulty":"Level 2","question":"在潛在要約人長期未作出確定要約意向的情況下，受要約公司可向證監會執行人員申請對該潛在要約人施加「表明意向或終止要約」（Put Up or Shut Up, PUSU）命令。該命令的法律效果為：","options":[{"value":"A","label":"命令潛在買方在 24 小時內破產"},{"value":"B","label":"要求潛在要約人在執行人員訂明的最後期限前，公布其發出要約的確定意向（Rule 3.5），或者宣布無意提出要約；若宣布無意提出要約，該人將受制於 6 個月禁制期"},{"value":"C","label":"強制沒收該潛在要約人的全部銀行保證金"},{"value":"D","label":"命令受要約公司立即自願退市"}],"answer":"B","explanation":"依據 Takeovers Code Rule 3.7 及實務指引：執行人員可應要求設定 PUSU 期限，要求潛在要約人在指定期限前公布明確決定（Put up）或正式宣布退場（Shut up）；若退場，將受 Rule 31.1 約束在 6 個月內不得再發起要約。","reference":"Takeovers Code Rule 3.7; HKSI Paper 5 Guide Topic 3 Section 4.4"},{"id":"T3-060","topic":"Topic 3","subtopic":"Restrictions on Subsequent Offers - Rule 31.1 (12-Month Bar)","difficulty":"Level 2","question":"根據《收購守則》第 31.1 條，當某項全面收購要約宣告撤回或徹底失效（Lapsed）後，未經證監會執行人員同意，該要約人及其一致行動人士在多長時間內**不得**對同一受要約公司再次提出收購要約？","options":[{"value":"A","label":"在 3 個月內"},{"value":"B","label":"自要約撤回或失效之日起計 12 個月內（Within 12 months from the date on which the offer is withdrawn or lapses）"},{"value":"C","label":"在 5 年內"},{"value":"D","label":"終身不得再提出要約"}],"answer":"B","explanation":"指南 3-31 頁 4.54 節及 Rule 31.1 明確指明：要約一旦撤回或失效，原要約人及其一致行動方在 12 個月內（Within 12 months）不得就目標公司提出新要約，亦不得取得持有 30% 或以上投票權的股份，防止目標公司遭受持續惡意圍困。","reference":"Takeovers Code Rule 31.1; HKSI Paper 5 Guide Topic 3 Section 4.54"},{"id":"T3-061","topic":"Topic 3","subtopic":"Rule 31.1 Exemption - Six-Month Talks Restriction","difficulty":"Level 2","question":"根據《收購守則》第 31.1 條註釋，若潛在要約人在未發表確定要約公告（Rule 3.5）前即宣布終止商討（Talks terminated），其受到的後續要約禁制期為：","options":[{"value":"A","label":"禁制期縮減為 6 個月（Within six months from the date of announcement）"},{"value":"B","label":"完全免除任何禁制期，翌日即可重新提呈"},{"value":"C","label":"禁制期延長至 24 個月"},{"value":"D","label":"僅能由收購委員會召開實體聽證會決定"}],"answer":"A","explanation":"依據 Rule 31.1(b) 及 Note 1：若潛在要約人在僅發布初步談判公告階段即宣布無意繼續推進要約，適用的禁止期為自該終止公告發布之日起計 6 個月（而非正式要約失效後的 12 個月）。","reference":"Takeovers Code Rule 31.1 Note 1; HKSI Paper 5 Guide Topic 3 Section 4.54"},{"id":"T3-062","topic":"Topic 3","subtopic":"Whitewash Waiver - Disqualification by Dealings Look-back (6 Months)","difficulty":"Level 3","question":"根據《收購守則》附錄六（清洗豁免指引）第 3(a) 段，擬申請清洗豁免的認購方及其一致行動人士，在有關交易提議正式公布前多長時間內若曾買入目標公司的有表決權股份，將直接導致其喪失申請清洗豁免的資格？","options":[{"value":"A","label":"在公布前 30 天內"},{"value":"B","label":"在該交易提議公布前六個月內（Within six months prior to the announcement of the proposals）"},{"value":"C","label":"在公布前 2 年內"},{"value":"D","label":"公布前買賣完全不受限制，僅限制公布後"}],"answer":"B","explanation":"指南 3-25 頁 4.36 節及 Schedule VI para 3(a) 規定：申請清洗豁免者及其一致行動方，在交易方案公布前 6 個月至大會表決日止之期間內，若曾買入受要約公司股份（Disqualifying transactions），執行人員通常絕不會批出清洗豁免。","reference":"Takeovers Code Schedule VI para 3(a); HKSI Paper 5 Guide Topic 3 Section 4.36"},{"id":"T3-063","topic":"Topic 3","subtopic":"Whitewash Waiver - Creeping Limit Post-Whitewash","difficulty":"Level 3","question":"某大股東透過執行人員批出的清洗豁免增持股份，增持完成後其在受要約公司的持股比例由 25% 上升至 42%。在增持完成後，該大股東在二級市場進行進一步增持時所受到的法規約束為：","options":[{"value":"A","label":"該大股東可自由買入股份至 50% 而無任何限制"},{"value":"B","label":"該大股東受制於自由增購率（Creeper）規限，在該交易完成日起計 12 個月內不得增持超過 2%，且其計算以完成清洗交易後的持股比例為新基準點"},{"value":"C","label":"該大股東在未來 5 年內一股不得增持"},{"value":"D","label":"只要獲得董事會同意即可增持至 100%"}],"answer":"B","explanation":"指南 3-26 頁 4.38 節及 Schedule VI para 4 指明：清洗豁免僅免除該次發行引發的全面要約義務；完成後持股處於 30% 至 50% 之間者，隨即受常規 2% 爬行條款（Creeper）嚴密管轄，12 個月內增購超 2% 仍會觸發強制要約。","reference":"Takeovers Code Schedule VI para 4; HKSI Paper 5 Guide Topic 3 Section 4.38"},{"id":"T3-064","topic":"Topic 3","subtopic":"Whitewash Waiver - Expiry of Waiver If Not Approved","difficulty":"Level 2","question":"若受要約公司股東大會否決了清洗豁免決議案（未達 75% 獨立投票贊成），但有關注資認購協議並未以清洗豁免獲批為先決條件且繼續交割。此時認購方將面臨：","options":[{"value":"A","label":"自動享有兩年的合規整改寬限期"},{"value":"B","label":"在股份配發交割完成使持股達到或超過 30% 之時，該認購方必須立即全面履行 Rule 26 強制現金全面收購要約義務"},{"value":"C","label":"由聯交所直接沒收其全部認購款項"},{"value":"D","label":"認購方全體高管被吊銷個人護照"}],"answer":"B","explanation":"指南 3-25 頁 4.35 節及 Rule 26 指明：清洗豁免是免除強要責任的專屬豁免；若獨立股東大會未通過清洗豁免，而底層股份交割依然發生並跨越 30%，認購方即時承擔法定義務，必須立即發出不可撤回的強制全面要約。","reference":"Takeovers Code Rule 26; HKSI Paper 5 Guide Topic 3 Section 4.35"},{"id":"T3-065","topic":"Topic 3","subtopic":"Mandatory Offer - Negative Confirmation on Inducements","difficulty":"Level 2","question":"根據《收購守則》第 26 條及實務指引，要約人在發布 Rule 3.5 確定要約公布時，就其與受要約公司股東之間是否存在任何私下協議，必須載有何種否定確認？","options":[{"value":"A","label":"確認要約人已向大股東借款 1 億港元"},{"value":"B","label":"明確確認要約人或其一致行動人士與任何受要約公司股東之間，概無存在任何未披露的特別交易、附帶條件的代價協議或利益補償安排（No special deals or arrangements）"},{"value":"C","label":"確認受要約公司全體員工已同意降薪"},{"value":"D","label":"確認香港證監會已全資入股要約人"}],"answer":"B","explanation":"指南 3-6 頁 2.7 節（原則 1 & 6）及 Rule 3.5 指明：要約公告必須載有否定聲明，明確確認要約人與任何股東之間不存在任何未向公眾披露的特別協議、誘因或帶有優惠條件的私下安排，貫徹公平公開原則。","reference":"Takeovers Code Rule 3.5, Rule 25; HKSI Paper 5 Guide Topic 3 Section 2.7"},{"id":"T3-066","topic":"Topic 3","subtopic":"Voluntary Offers - Consideration Form Flexibility","difficulty":"Level 2","question":"自願全面收購要約（Voluntary Offer）在支付對價的形式上，相較於強制全面要約（Mandatory Offer），享有何種靈活性？","options":[{"value":"A","label":"自願要約可以純粹以未繳足股款的支票支付"},{"value":"B","label":"要約人可以自由選擇以現金（Cash）、證券換股（Shares or other securities）、或現金與證券的組合方式作為收購代價，無須強制以全現金作為唯一基礎（除非觸發特定現金化規則）"},{"value":"C","label":"自願要約嚴禁使用任何現金支付"},{"value":"D","label":"對價形式必須由香港金管局指定"}],"answer":"B","explanation":"指南 3-27 頁 4.41–4.42 節及 Rule 23/24 指明：強制要約必須具備現金或現金選擇；而自願要約則具備更大對價設計彈性，可純粹為股份交換要約（Securities exchange offer），亦可為現金加證券組合，除非要約人在過去 6 個月內曾大額以現金買入股份。","reference":"Takeovers Code Rules 23, 24, 30; HKSI Paper 5 Guide Topic 3 Section 4.41"},{"id":"T3-067","topic":"Topic 3","subtopic":"Voluntary Offers - Cash Trigger Rule (Rule 23.1(a))","difficulty":"Level 3","question":"根據《收購守則》第 23.1(a) 條，自願要約人在何種情形下，必須被強制要求在其自願要約中提供「現金代價」（或全額現金替代選擇）？","options":[{"value":"A","label":"只要要約人總部位於香港以外地區"},{"value":"B","label":"要約人及其一致行動人士在要約期內、及在要約期開始前六個月內，以現金方式購入了受要約公司帶有 10% 或以上投票權的股份時"},{"value":"C","label":"只要受要約公司是 GEM 板塊上市公司"},{"value":"D","label":"當全體散戶向聯交所聯名請願時"}],"answer":"B","explanation":"指南 3-27 頁 4.42 節及 Rule 23.1(a) 規定：若要約人或一致行動方在要約期及要約前 6 個月內，以現金購入受要約公司達 10% 或以上的投票權，其隨後的自願要約必須強制包含現金選擇，且現金價不低於最高支付價。","reference":"Takeovers Code Rule 23.1(a); HKSI Paper 5 Guide Topic 3 Section 4.42"},{"id":"T3-068","topic":"Topic 3","subtopic":"Partial Offers - Approval under Rule 28","difficulty":"Level 3","question":"要約人若擬依據《收購守則》第 28 條提出部分收購要約（Partial Offer）以收購受要約公司特定比例的股份（例如收購 20% 股份使持股達 45%）。該部分要約獲准實施的核心法定條件為：","options":[{"value":"A","label":"只需由要約人董事會批准即可發出"},{"value":"B","label":"必須取得證監會執行人員的事先核准，且若該收購會導致要約人持股達到或超過 30%，必須在股東大會獲得無利害關係股東持有表決權的超過 50% 獨立批准（Approval of independent shareholders）"},{"value":"C","label":"必須強制將受要約公司除牌退市"},{"value":"D","label":"部分要約在香港法律下屬永久非法"}],"answer":"B","explanation":"指南 3-27 至 3-28 頁 4.43 節及 Rule 28 規定：部分要約必須經執行人員事先批准；若收購後持股達 30% 或以上，必須獲得無利害關係股東投票過半數批准，且股東在接納表決票上必須就部分要約有單獨表決機制。","reference":"Takeovers Code Rule 28; HKSI Paper 5 Guide Topic 3 Section 4.43"},{"id":"T3-069","topic":"Topic 3","subtopic":"Partial Offers - Pro Rata Acceptance Mechanics","difficulty":"Level 2","question":"在經批准的部分收購要約中，若股東遞交的有效接納股數超過了要約人擬收購的固定目標股數，要約人必須如何處理該等超額接納？","options":[{"value":"A","label":"按遞交時間先到先得分配"},{"value":"B","label":"嚴格按照每名接納股東所提交股份的同等比例（Pro rata basis）進行按比例抽籤接納與交割，剩餘未獲接納股份如數退還"},{"value":"C","label":"全額無償沒收超額部分"},{"value":"D","label":"優先全額收購大機構投資者的股份"}],"answer":"B","explanation":"依據 Takeovers Code Rule 28.7 及指南 3-28 頁 4.43 節：部分要約中若出現超額接納，要約人必須按比例（Pro rata）向全體提呈接納的股東收購其相應份額的股份，以確保每位股東享有平等的出脫變現機會。","reference":"Takeovers Code Rule 28.7; HKSI Paper 5 Guide Topic 3 Section 4.43"},{"id":"T3-070","topic":"Topic 3","subtopic":"Privatisation by Scheme of Arrangement - Headcount Test Abolition","difficulty":"Level 3","question":"根據香港《公司條例》（Cap. 622）第 674 條，香港註冊成立的上市公司透過協議安排（Scheme of Arrangement）實施私有化時，香港成文法已廢除傳統的人頭測試（Headcount test），現行法定的法院會議表決門檻為：","options":[{"value":"A","label":"全體出席股東人數過半數贊成，價值無限制"},{"value":"B","label":"出席法庭會議並投票的獨立無利害關係成員所代表的投票權價值至少 75% 贊成，且在法庭會議上投反對票的表決權不得超過該等無利害關係成員總投票權的 10%"},{"value":"C","label":"全體股東 100% 簽署書面同意書"},{"value":"D","label":"必須經香港高等法院法官親自代投贊成票"}],"answer":"B","explanation":"指南 1-30 頁 3.63 節、2-54 頁 12.20 節及 Takeovers Code Rule 2.10：在 Cap. 622 下香港公司私有化計劃廢除了人頭測試，改採資本價值測試：(1) 獲無利害關係股份 75% 價值贊成；且 (2) 反對票不超過全部無利害關係股份表決權的 10%（Rule 2.10 雙重測試）。","reference":"Companies Ordinance s.674; Takeovers Code Rule 2.10; HKSI Paper 5 Guide Topic 3 Section 5.3"},{"id":"T3-071","topic":"Topic 3","subtopic":"Privatisation - Rule 2.10 Takeovers Code Approval Threshold","difficulty":"Level 3","question":"根據《收購守則》第 2.10 條，任何受守則管轄的公司（無論在香港、開曼群島或百慕達註冊）透過協議安排或資本重組進行私有化時，在股東大會的表決上必須同時滿足的守則硬性門檻為：","options":[{"value":"A","label":"全體董事一致投票贊成"},{"value":"B","label":"獲親自或委派代表出席大會的無利害關係股東投票權至少 75% 贊成，且反對該決議案的票數不得超過全體無利害關係股份所附帶投票權的 10%"},{"value":"C","label":"反對票只要達到 1% 即告失敗"},{"value":"D","label":"僅需普通決議案 50% 贊成"}],"answer":"B","explanation":"指南 2-54 頁 12.20 節、3-12 頁 3.23 節及 Takeovers Code Rule 2.10 明確指明：私有化協議安排必須通過 Rule 2.10 的「75% 贊成及 10% 反對否決線」：出席並表決之獨立股東 75% 贊成，且反對票不超過全體無利害關係股份總表決權的 10%。","reference":"Takeovers Code Rule 2.10; HKSI Paper 5 Guide Topic 3 Section 3.23"},{"id":"T3-072","topic":"Topic 3","subtopic":"Compulsory Acquisition Rights (Squeeze-out)","difficulty":"Level 3","question":"要約人透過自願全面要約方式收購香港上市公司並擬強制收購剩餘少數股東持股（Squeeze-out / 擠出權）。根據《公司條例》第 693 條至第 704 條，要約人行使法定強制收購權的門檻條件為：","options":[{"value":"A","label":"在要約發出後 24 小時內收購達 50% 股份"},{"value":"B","label":"在要約期內收購達到要約所涉及股份（無利害關係股份）面值或數額的至少 90%（Acquired not less than 90% of the shares to which the offer relates）"},{"value":"C","label":"收購目標公司總資產的 90%"},{"value":"D","label":"全額收購控股股東家族名下持股即可"}],"answer":"B","explanation":"指南 2-54 頁 12.21 節、3-33 頁 5.3 節及《公司條例》ss. 693–704 規定：要約人若要強制收購剩餘少數股東股份以達成 100% 私有化，必須在要約中收購達到無利害關係要約股份的至少 90%（90% squeeze-out threshold）。","reference":"Companies Ordinance ss. 693-704; HKSI Paper 5 Guide Topic 3 Section 5.3"},{"id":"T3-073","topic":"Topic 3","subtopic":"Sell-out Rights of Minority Shareholders","difficulty":"Level 2","question":"根據香港《公司條例》及適用公司法，在要約人成功收購目標公司達 90% 以上股權後，尚未接納要約的剩餘少數股東享有何種法定的對等權利（Sell-out Rights）？","options":[{"value":"A","label":"少數股東必須被強制沒收所有股份且無任何補償"},{"value":"B","label":"少數股東有法定權利要求要約人以要約條款收購其持有的剩餘股份（Entitled to require the offeror to acquire their shares on offer terms），要約人依法必須予以收購"},{"value":"C","label":"少數股東自動成為要約人的董事長"},{"value":"D","label":"少數股東可要求要約人賠償十倍市價"}],"answer":"B","explanation":"依據《公司條例》s. 700：當要約人持股達 90% 觸發擠出門檻時，剩餘少數股東亦享有相應的「要求收購權」（Sell-out right），可書面要求要約人按原要約條款出資收購其股份，防止小股東淪為非流動少數股權囚徒。","reference":"Companies Ordinance s.700; HKSI Paper 5 Guide Topic 3 Section 5.3"},{"id":"T3-074","topic":"Topic 3","subtopic":"Competitive Offers - Extension of Day 60 Final Deadline","difficulty":"Level 3","question":"在收購進行期間，若市場上出現第三方的「競爭性收購要約」（Competitive Offer）。根據《收購守則》第 15.5 條及實務指引，第一位要約人的第 60 天（Day 60）最後接納截止期限：","options":[{"value":"A","label":"嚴格維持不變，第一位要約人必須在原定第 60 天失效退出"},{"value":"B","label":"第一位要約人的第 60 天截止期限將被自動順延，使其與競爭對手（第二位要約人）的要約文件寄發後的第 60 天期限對齊（Align with the Day 60 of the competitor）"},{"value":"C","label":"兩位要約人均必須強制立即退出收購"},{"value":"D","label":"第一位要約人享有即時取消競爭要約的特權"}],"answer":"B","explanation":"依據 Takeovers Code Rule 15.5 Note 2 及指南 3-30 頁 4.49 節：當出現競爭要約時，為維護公平競爭環境，原先要約人的 Day 60 接納大限將自動順延至與競爭要約人的 Day 60 完全一致，使兩名要約人可在相同的終局時間窗口內角逐。","reference":"Takeovers Code Rule 15.5 Note 2; HKSI Paper 5 Guide Topic 3 Section 4.49"},{"id":"T3-075","topic":"Topic 3","subtopic":"No Increase Statement - Final Price Statements (Rule 18.1)","difficulty":"Level 3","question":"要約人在公告中明確聲明「本要約每股 5.00 港元之收購價為最終價格，將不會提高」（A final price statement）。根據《收購守則》第 18.1 條，該聲明在法規上產生何種法律約束力？","options":[{"value":"A","label":"要約人可隨意在翌日推翻該聲明並加價至 6.00 港元"},{"value":"B","label":"要約人受制於該「不提高要約價聲明」（No increase statement），嚴禁進一步調高要約價，除非要約人先前已明確保留在出現競爭要約等特定情況下加價的權利"},{"value":"C","label":"該聲明僅屬公關宣傳，在《收購守則》下無任何約束力"},{"value":"D","label":"該聲明自動導致要約終止"}],"answer":"B","explanation":"指南 3-10 頁 3.11(c) 節及 Rule 18.1 指明：要約人若發表了「最終價格聲明」（Final price statement）或「不加價聲明」，要約人將嚴格受其約束（Bound by the statement），不得在該要約中調高作價，除非先前保留了特定例外權利。","reference":"Takeovers Code Rule 18.1; HKSI Paper 5 Guide Topic 3 Section 3.11"},{"id":"T3-076","topic":"Topic 3","subtopic":"No Extension Statement - Final Closing Date Statements (Rule 18.2)","difficulty":"Level 2","question":"要約人若發表公告宣布「本要約接納截止日期將絕對不會進一步延長」（A final closing date statement）。根據《收購守則》第 18.2 條，要約人：","options":[{"value":"A","label":"可以由財務顧問私下向交易所申請延長一個月"},{"value":"B","label":"嚴格受制於該聲明，不得將要約期延長至該截止日期之後，且若要約屆時仍未成為無條件，要約即告失效"},{"value":"C","label":"享有隨意更改截止日期的法定自由"},{"value":"D","label":"必須在當天向全體股東退回股份"}],"answer":"B","explanation":"依據 Takeovers Code Rule 18.2：發表了「不延長要約期聲明」（No extension statement）的要約人，不得在該指定截止日後進一步順延要約，其要約必須在該指定日子迎來終局審判（要麼跨越接納門檻成為無條件，要麼失效）。","reference":"Takeovers Code Rule 18.2; HKSI Paper 5 Guide Topic 3 Section 4.49"},{"id":"T3-077","topic":"Topic 3","subtopic":"Revision of Offer - Day 46 Rule","difficulty":"Level 2","question":"根據《收購守則》第 16.1 條，要約人若擬修訂其要約條款（例如提高要約價），在時間表上其最後修訂大限為：","options":[{"value":"A","label":"要約人可以在第 59 天夜間隨意修改價格"},{"value":"B","label":"要約人不得在要約文件寄發之日起計第 46 天（Day 46）之後刊發修訂要約文件，且修訂文件刊發後要約必須維持開放至少 14 天"},{"value":"C","label":"必須在要約發出後 24 小時內完成修改"},{"value":"D","label":"要約發出後法律上絕對禁止任何條款修訂"}],"answer":"B","explanation":"指南 3-30 頁 4.49 節及 Rule 16.1 規定：修訂要約文件最遲必須在 Day 46 寄發（防止在最後時刻突擊修改導致股東缺乏時間評估）；且修訂要約發出後，要約接納期必須維持開放至少 14 天。","reference":"Takeovers Code Rule 16.1; HKSI Paper 5 Guide Topic 3 Section 4.49"},{"id":"T3-078","topic":"Topic 3","subtopic":"Target Response to Revised Offer - Day 53 Rule","difficulty":"Level 2","question":"當要約人在 Day 46 修訂並提高了收購要約價格後，根據《收購守則》第 16.1 條，受要約公司董事會向股東刊發針對修訂要約的回應通函的最遲時限為：","options":[{"value":"A","label":"在要約全面結束後 3 個月內"},{"value":"B","label":"在要約文件寄發之日起計第 53 天（Day 53）或之前刊發回應通函（載有 IBC 及 IFA 的最新評估意見）"},{"value":"C","label":"在當天下午 5 時前"},{"value":"D","label":"受要約公司無須對修訂要約作出任何回應"}],"answer":"B","explanation":"依據 Takeovers Code Rule 16.1：在要約人於 Day 46 寄發修訂文件後，受要約公司董事會必須在 Day 53（即第 53 天）或之前寄發補充回應文件，向股東交代修訂後的推薦意見，確保股東在 Day 60 大限前有一週時間權衡。","reference":"Takeovers Code Rule 16.1; HKSI Paper 5 Guide Topic 3 Section 4.49"},{"id":"T3-079","topic":"Topic 3","subtopic":"Right of Withdrawal of Acceptance - Day 42 (Rule 17)","difficulty":"Level 3","question":"根據《收購守則》第 17 條（Rule 17），已遞交要約接納書的受要約公司股東，在何種法定時間條件下，享有撤回其接納（Right of withdrawal）的權利？","options":[{"value":"A","label":"在遞交接納書後 10 分鐘內"},{"value":"B","label":"若要約在首個截止日期（Day 21）後滿 21 天（即自最初要約文件寄發後第 42 天/Day 42）仍未就接納而言成為無條件，股東有權在該日後、直至要約成為無條件前隨時撤回其接納"},{"value":"C","label":"股東在任何時候均享有不可撤銷的終身撤回權"},{"value":"D","label":"一旦交出股票，股東在任何情況下均絕對不得撤回"}],"answer":"B","explanation":"指南 3-30 頁 4.50 節及 Rule 17 規定：為防止接納股東之股份被長期鎖定，若要約至最初截止日後 21 天（即 Day 42）仍未成為無條件，接納股東自該日起享有法定撤回權，可取回其股票，直至要約宣布無條件為止。","reference":"Takeovers Code Rule 17; HKSI Paper 5 Guide Topic 3 Section 4.50"},{"id":"T3-080","topic":"Topic 3","subtopic":"Unconditional Announcement - Remaining Open for 14 Days","difficulty":"Level 2","question":"根據《收購守則》第 15.3 條，當一項有條件的全面收購要約宣布就接納而言已成為無條件（Unconditional as to acceptances）之後，該要約必須：","options":[{"value":"A","label":"在宣布當天下午即刻徹底關閉並停止接納"},{"value":"B","label":"必須在宣布成為無條件後，繼續維持向其他股東開放接納至少 14 天（Must remain open for acceptance for not less than 14 days）"},{"value":"C","label":"強制延長三年"},{"value":"D","label":"自動將要約價下調 50%"}],"answer":"B","explanation":"指南 3-30 頁 4.49 節及 Rule 15.3 明確規定：要約一旦成為無條件，必須維持開放至少 14 天（At least 14 days），以確保先前持觀望態度的剩餘少數股東有充分機會按同一要約條件出售股份，避免少數股東被鎖死在控股權更替的封閉環境中。","reference":"Takeovers Code Rule 15.3; HKSI Paper 5 Guide Topic 3 Section 4.49"},{"id":"T3-081","topic":"Topic 3","subtopic":"On-market Share Buy-backs - Listing Rules Compliance (MBLR 10.06)","difficulty":"Level 2","question":"根據香港《股份回購守則》第 1 條，在聯交所場內進行的有表決權股份回購（On-market buy-back），其核心合規路徑為：","options":[{"value":"A","label":"發行人可以無視任何法規直接在盤中任意掃貨"},{"value":"B","label":"必須嚴格遵守香港聯交所《上市規則》第 10.06 條（GLR 第 13.07 條）的全部規定，包括說明函件、5% 溢價限制、禁售期及公眾持股量限制"},{"value":"C","label":"必須強制由證監會法規執行部派員親自下單"},{"value":"D","label":"場內回購在香港受到刑事禁止"}],"answer":"B","explanation":"指南 1-38 頁 4.44 節、2-24 頁 5.3 節及 3-34 頁 6.2 節指明：場內股份回購主要透過嚴格遵守聯交所《上市規則》（MBLR 10.06）的常規框架執行，發行人及董事必須全面遵循該等交易限制。","reference":"Share Buy-backs Code Rule 1; MBLR 10.06; HKSI Paper 5 Guide Topic 3 Section 6.2"},{"id":"T3-082","topic":"Topic 3","subtopic":"Off-market Share Buy-backs - Executive Approval Role","difficulty":"Level 2","question":"上市發行人若擬透過「場外協議」回購某控股股東名下的大額股份，根據《股份回購守則》第 2 條，發行人除準備股東大會外，必須首先：","options":[{"value":"A","label":"向香港房屋委員會申請備案"},{"value":"B","label":"向證監會執行人員正式呈交申請並取得其事先批准（Approved by the Executive），執行人員在審查其對待其他股東是否公允後方會批覆"},{"value":"C","label":"由發行人行政總裁個人出具不可撤銷擔保"},{"value":"D","label":"向海外法院提起民事訴訟"}],"answer":"B","explanation":"指南 2-24 頁 5.1 節、3-35 頁 6.4 節及《股份回購守則》Rule 2 規定：場外股份回購（Off-market share buy-backs）必須獲得證監會執行人員的事先核准；未獲執行人員批准而執行的場外回購構成嚴重違規。","reference":"Share Buy-backs Code Rule 2; HKSI Paper 5 Guide Topic 3 Section 6.4"},{"id":"T3-083","topic":"Topic 3","subtopic":"Exempt Share Buy-backs - Employee Schemes Buy-backs","difficulty":"Level 2","question":"根據《股份回購守則》，下列哪項股份購回活動明確屬於「獲豁免的股份回購」（Exempt Share Buy-backs）？","options":[{"value":"A","label":"發行人在二級市場耗資 10 億港元進行的大額回購"},{"value":"B","label":"依據發行人先前獲批准採納的僱員股份激勵計劃的特定條款，自離職員工處購回或收回其未歸屬的股份"},{"value":"C","label":"向要約人全體一致行動人士收購股份"},{"value":"D","label":"任何導致控股權變更的私人股份轉讓"}],"answer":"B","explanation":"指南 3-35 頁 6.5 節及《股份回購守則》定義：獲豁免股份回購包括依照經批准的僱員股份計劃條款購回股份、或依據法例進行強制贖回股份等特定非市場化收回行為，免受繁複的場外審批限制。","reference":"Share Buy-backs Code; HKSI Paper 5 Guide Topic 3 Section 6.5"},{"id":"T3-084","topic":"Topic 3","subtopic":"Share Buy-backs by General Offer - Equal Treatment of Acceptance","difficulty":"Level 2","question":"上市發行人若以「全面要約方式」（Buy-back by General Offer）回購其股份，在股份接納與交割的公允性上，發行人必須保證：","options":[{"value":"A","label":"發行人有權自由決定僅接納董事長名下的股份"},{"value":"B","label":"必須向全體股東發出平等要約，若提呈接納的股份超過擬回購上限，必須按同等比例（Pro rata）向全體接納股東收購其相應份額"},{"value":"C","label":"僅向持股超過 10% 的機構股東開放"},{"value":"D","label":"接納款項可以延期 10 年支付"}],"answer":"B","explanation":"指南 3-5 頁 2.4 節、3-34 頁 6.3 節及《股份回購守則》指明：要約回購適用《收購守則》的一般原則，必須平等對待同類別的全體股東，超額接納時嚴格依比例分配，杜絕厚此薄彼。","reference":"Share Buy-backs Code; HKSI Paper 5 Guide Topic 3 Section 2.4, 6.3"},{"id":"T3-085","topic":"Topic 3","subtopic":"Whitewash Waiver - Circular 26 Disclosures on Dilution","difficulty":"Level 2","question":"上市發行人就清洗豁免（Whitewash Waiver）向股東刊發的通函中，必須詳盡載入的股權攤薄分析包括：","options":[{"value":"A","label":"全體認購人直系親屬名下的海外銀行結存"},{"value":"B","label":"發行新股前後現有股東的詳細股權架構對比表、認購人所持股權的潛在最高百分比、全面攤薄後的每股盈利影響，以及明確警示股東該批准將免除強要責任"},{"value":"C","label":"保證發行人股價將在會後翻倍的承諾"},{"value":"D","label":"由全體股東簽署的放棄所有股息請求權協議"}],"answer":"B","explanation":"指南 3-25 頁 4.37 節及 Takeovers Code Schedule VI 指明：清洗豁免通函受極高披露標準約束，必須清晰展示股權對比表、全面攤薄影響、獨立財務顧問詳細分析，並顯著警告股東批准該方案即意味著認購方無須承擔全面現金要約義務。","reference":"Takeovers Code Schedule VI; HKSI Paper 5 Guide Topic 3 Section 4.37"},{"id":"T3-086","topic":"Topic 3","subtopic":"Takeovers Code - Frustrating Action Safe Harbour by Independent Vote","difficulty":"Level 3","question":"受要約公司在要約期內，因不可抗力急需簽署一項涉及出售重大廠房的商業協議（構成 Rule 4 防礙行動）。若該公司擬合法實施該交易而不違反《收購守則》，董事會必須落實的程序是：","options":[{"value":"A","label":"由全體執行董事簽署個人保證書即可實施"},{"value":"B","label":"及早諮詢執行人員，召開受要約公司股東大會，由股東大會正式通過決議案批准實施該交易（Approved by shareholders in general meeting），要約人及其一致行動方不可操縱投票"},{"value":"C","label":"直接向香港高等法院申請將要約人強行剔除"},{"value":"D","label":"私下給予要約人現金賠償"}],"answer":"B","explanation":"指南 3-7 頁 2.7 節（原則 9）及 Takeovers Code Rule 4 明確指明：防止防礙行動的核心在於保障股東決策權；若目標公司確有必要進行該交易，唯一合法合規途徑為將方案提呈股東大會，獲得股東投票正式批准後方可執行。","reference":"Takeovers Code Rule 4; HKSI Paper 5 Guide Topic 3 Section 2.7, 3.30"},{"id":"T3-087","topic":"Topic 3","subtopic":"Rule 8.1 Note 4 - Research Reports Distribution Ban","difficulty":"Level 3","question":"在指南回顧的個案一（Case 1）執法先例中，擔任受要約公司財務顧問的持牌法團在要約期間發布了關於受要約公司的研究報告而遭到證監會公開譴責。該處分依據的《收購守則》特定規則為：","options":[{"value":"A","label":"SFO 第 107 條欺詐罪"},{"value":"B","label":"《收購守則》第 8.1 條註釋 4（Note 4 to Rule 8.1），該規則嚴格禁止要約各方相聯的顧問機構在未經執行人員事先同意下，於要約期內發表或分發針對目標公司的研究報告或盈利預測"},{"value":"C","label":"香港《防止賄賂條例》"},{"value":"D","label":"聯交所主板第 18C 章"}],"answer":"B","explanation":"指南 1-41 頁 4.60 節及 Takeovers Code Rule 8.1 Note 4 明確規定：擔任顧問的機構屬於聯繫人，未經執行人員事先批准，嚴禁在要約期內分發或發布涉及受要約公司的研究報告（Research reports），以防利用研究報告干預市場預期或觸犯利潤預測規則。","reference":"Takeovers Code Rule 8.1 Note 4; HKSI Paper 5 Guide Topic 1 Section 4.60"},{"id":"T3-088","topic":"Topic 3","subtopic":"Takeovers Code Disciplinary Sanctions - Range of Orders","difficulty":"Level 2","question":"收購及合併委員會（Panel）在依據守則引言第 1.7 段進行紀律處分時，可對違規者施加的法定認可制裁措施包括下列哪一組？","options":[{"value":"A","label":"判處違規者監禁 10 年並沒收護照"},{"value":"B","label":"私下訓誡、公開批評（Criticism）、公開譴責（Public censure）、發出冷淡對待令（Cold shoulder order），以及向其他監管機構或專業團體舉報違規者"},{"value":"C","label":"強制將受要約公司收歸香港國有"},{"value":"D","label":"命令違規者親身前往海外服刑"}],"answer":"B","explanation":"指南 3-39 至 3-40 頁 7.28 節及 Takeovers Code Introduction 列明收購委員會紀律處分權力：包括私下警告、公開批評、公開譴責、冷淡對待令（禁止使用市場設施）、以及向證監會發牌科、聯交所或專業公會轉介處分。","reference":"Takeovers Code Introduction; HKSI Paper 5 Guide Topic 3 Section 7.28"},{"id":"T3-089","topic":"Topic 3","subtopic":"Takeovers Appeal Committee - Composition","difficulty":"Level 2","question":"根據《收購守則》架構，負責聆訊針對收購委員會紀律制裁公平性上訴的「收購上訴委員會」（Takeovers Appeal Committee, TAC），其聆訊委員會的成員組成方式為：","options":[{"value":"A","label":"由香港高等法院法官及兩名終審法院常任法官出任"},{"value":"B","label":"由收購上訴委員會委員名冊中選出至少三名成員組成委員會進行聆訊（Not less than three members），且曾參與原案裁決的收購委員會成員嚴格不得加入"},{"value":"C","label":"全權由香港交易所行政總裁一人獨任審理"},{"value":"D","label":"由全體受影響的上市公司控股股東輪流兼任"}],"answer":"B","explanation":"指南 3-40 頁 7.29 節及《收購守則》引言規定：TAC 自其成員名冊中委派至少三名獨立委員組成上訴聆訊小組，原審委員必須嚴格迴避，以確保上訴覆核過程的獨立客觀。","reference":"Takeovers Code Introduction para 1.9; HKSI Paper 5 Guide Topic 3 Section 7.29"},{"id":"T3-090","topic":"Topic 3","subtopic":"General Principle 10 - Fullest Cooperation with Authorities","difficulty":"Level 1","question":"根據《收購守則》之「一般原則 10」（General Principle 10），與受《守則》管轄交易有關的全體各方，負有何種核心監管義務？","options":[{"value":"A","label":"在支付顧問費前嚴禁向監管機構提供真實資料"},{"value":"B","label":"必須在最大程度上全力配合執行人員、收購委員會及收購上訴委員會的工作，並提供一切相關資料（Co-operate to the fullest extent and provide all relevant information）"},{"value":"C","label":"僅需在收到法庭傳票時才配合查詢"},{"value":"D","label":"有權將所有內部交易記錄列為永久機密拒絕透露"}],"answer":"B","explanation":"指南 3-7 頁 2.7 節（一般原則 10）明文規定：所有參與收購守則管轄交易的各方（包括發行人、要約人、董事及財務顧問），均有法定義務全力配合執行人員及委員會，如實迅速提供一切所需資訊。","reference":"Takeovers Code General Principle 10; HKSI Paper 5 Guide Topic 3 Section 2.7"},{"id":"T3-091","topic":"Topic 3","subtopic":"Target Response to Takeover - Verification Notes Standard","difficulty":"Level 2","question":"受要約公司董事會在編制並刊發受要約公司通函（Offeree Board Circular）時，根據指南說明，該通函的編制責任與核證標準必須達到：","options":[{"value":"A","label":"一般商業宣傳單張的非正式標準即可"},{"value":"B","label":"達到與「招股章程同等的法定標準」（To prospectus standard），全體董事及顧問須執行完備的核證程序（Verification process）並留存核證筆記底稿"},{"value":"C","label":"僅需由外聘公關顧問簽字確認"},{"value":"D","label":"完全免除任何董事審核義務"}],"answer":"B","explanation":"指南 3-10 頁 3.13 節指出：收購通函發布給全體公眾股東，其內容編制標準必須達到招股章程標準（Prospectus standard），董事及顧問必須落實核證程序（Verification notes），確保每項事實均有客觀證據支持。","reference":"HKSI Paper 5 Guide Topic 3 Section 3.13"},{"id":"T3-092","topic":"Topic 3","subtopic":"Target Independent Financial Adviser - Appointment Timing","difficulty":"Level 2","question":"根據《收購守則》第 2.1 條，受要約公司董事會接獲正式要約後，必須委聘獨立財務顧問（IFA）向獨立董事委員會提供建議。該委聘在時間上的要求為：","options":[{"value":"A","label":"可在要約結束滿半年後才聘請"},{"value":"B","label":"必須在合理切實可行下盡快委任（As soon as reasonably practicable after offer is announced），且該委任必須取得獨立董事委員會的事先批准"},{"value":"C","label":"由要約人直接指定其關聯投行兼任"},{"value":"D","label":"受要約公司可單方面決定不委任 IFA"}],"answer":"B","explanation":"指南 3-11 頁 3.19 節及 Takeovers Code Rule 2.1 規定：受要約公司在要約公布後，必須在合理可行下盡快聘請合資格獨立財務顧問（IFA），且該委任必須獲得受要約公司獨立董事委員會的審批認可。","reference":"Takeovers Code Rule 2.1; HKSI Paper 5 Guide Topic 3 Section 3.19"},{"id":"T3-093","topic":"Topic 3","subtopic":"Profit Forecast in Takeovers - Auditor and FA Reports","difficulty":"Level 3","question":"在收購要約期內，受要約公司若在其通函中載入了未經審核的即期盈利預測（Profit Forecast）。根據《收購守則》第 10 條（Rule 10），該預測必須附帶出具何種專門報告？","options":[{"value":"A","label":"由香港地政總署出具的測繪報告"},{"value":"B","label":"申報會計師就編制預測所採用的會計準則出具的審查報告，以及由財務顧問出具確認該預測乃董事經審慎周詳查詢後作出的專業報告（Report from financial advisers）"},{"value":"C","label":"全體股東簽署的無條件贊同書"},{"value":"D","label":"無須任何報告，董事口頭保證即可"}],"answer":"B","explanation":"指南 3-10 頁 3.11(d) 節及 Takeovers Code Rule 10 明確規定：收購期間發布的任何盈利預測或估值，必須受 Rule 10 嚴格審查，必須同時附帶由申報會計師（審核會計基礎）及財務顧問（審核審慎查詢與商業假設）出具的正式報告。","reference":"Takeovers Code Rule 10; HKSI Paper 5 Guide Topic 3 Section 3.11"},{"id":"T3-094","topic":"Topic 3","subtopic":"Document Lodgement - Prior Clearance with Executive (Rule 12)","difficulty":"Level 2","question":"根據《收購守則》第 12 條（Rule 12），在收購要約或回購過程中由要約各方印發的任何公告、通函或要約文件，在正式向公眾發布或寄發前，必須履行何種審查程序？","options":[{"value":"A","label":"可隨意對外發布，無須任何官方審閱"},{"value":"B","label":"必須事先將文件草稿送交證監會執行人員審閱並取得其「不提出反對意見」（Prior clearance from the Executive）後，方可對外發布"},{"value":"C","label":"必須事先由香港警務處蓋印備案"},{"value":"D","label":"必須經香港立法會辯論通過"}],"answer":"B","explanation":"指南 3-11 頁 3.18 節及 Takeovers Code Rule 12 規定：所有涉及《收購守則》的公開文件、公告與通函，在正式發布或寄發前，必須呈交執行人員進行事前審閱並取得其正式通關認可（Clearance），確保嚴格合規。","reference":"Takeovers Code Rule 12; HKSI Paper 5 Guide Topic 3 Section 3.18"},{"id":"T3-095","topic":"Topic 3","subtopic":"Listing Rules Takeovers Code Breach Interplay","difficulty":"Level 2","question":"上市公司若在涉及股權重組的要約中違反了《收購守則》，香港聯交所在《上市規則》第 14.78 條下獲賦權採取的相應處分行動為：","options":[{"value":"A","label":"聯交所直接判定該違規為違反《上市規則》，可對發行人及其董事施加紀律處分、甚至指令股票停牌或取消上市地位"},{"value":"B","label":"聯交所無權採取任何行動，只能旁觀"},{"value":"C","label":"聯交所必須賠償全體受影響股東的差價損失"},{"value":"D","label":"聯交所必須強制買入要約人的全體資產"}],"answer":"A","explanation":"指南 1-37 頁 4.37 節、2-49 頁 11.33 節及 MBLR 14.78 指明：違反《收購守則》即構成違反《上市規則》，聯交所有權對上市公司及其董事施加上市規則項下的各類紀律制裁、停牌或除牌命令。","reference":"MBLR 14.78; HKSI Paper 5 Guide Topic 1 Section 4.37; Topic 2 Section 11.33"},{"id":"T3-096","topic":"Topic 3","subtopic":"Corporate Reorganisation and Scheme of Arrangement in Takeovers","difficulty":"Level 2","question":"在透過協議安排（Scheme of Arrangement）實施的友好收購私有化中，除了取得法院會議批准外，該方案生效必須滿足的最終司法程序為：","options":[{"value":"A","label":"由全港註冊律師公會理事會蓋印"},{"value":"B","label":"必須呈請香港高等法院（或海外註冊地管轄法院）舉行正式聆訊，並取得法院的正式認可頒令（Sanctioned by the court），隨後送交公司註冊處登記"},{"value":"C","label":"由要約人親自頒發赦免令"},{"value":"D","label":"由全體少數股東親身前往律政司簽署棄權書"}],"answer":"B","explanation":"指南 1-30 頁 3.63 節、2-35 頁 7.33 節及《公
