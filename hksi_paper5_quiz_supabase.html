l 2","question":"證監會（SFC）內部設有五個主要業務分科。下列哪一個分科在一般情況下**最少**直接與從事機構融資顧問業務的第 6 類持牌中介人打交道？","options":[{"value":"A","label":"企業融資部（Corporate Finance Division）"},{"value":"B","label":"中介機構部（Intermediaries Division）"},{"value":"C","label":"法規執行部（Enforcement Division）"},{"value":"D","label":"投資產品部（Investment Products Division）"}],"answer":"D","explanation":"指南 1-6 至 1-7 頁 1.8 及 1.15(b) 節指明：第 6 類持牌人日常最核心接觸企業融資部，發牌與監管對接中介機構部，違規調查對接法規執行部；而「投資產品部」主要負責授權及監管零售投資產品（如單位信託、互惠基金、ETF 等），極少直接與純機構融資顧問發生日常交互。","reference":"HKSI Paper 5 Guide Topic 1 Section 1.8, 1.15"},{"id":"T1-101","topic":"Topic 1","subtopic":"SMLR Early Intervention Powers","difficulty":"Level 3","question":"根據《證券及期貨（股票市場上市）規則》（SMLR）及證監會的「前置式監管」方針，證監會企業融資部在何種情況下可依據法定權力直接在早期階段介入上市申請或企業交易？","options":[{"value":"A","label":"僅限於發行人未能在 24 小時內繳交上市初費時"},{"value":"B","label":"在涉及嚴重懷疑上市申請或企業交易存在不當行為、欺詐或嚴重損害投資大眾利益的個案中，直接行使 SMLR 權力提出法定質詢或反對上市"},{"value":"C","label":"任何擬上市公司的保薦人如果僱用超過 10 名員工，證監會必須強制介入"},{"value":"D","label":"只有在聯交所上市委員會全體成員一致書面請求時方可介入"}],"answer":"B","explanation":"依據指南 1-5 頁 1.10(g) 節及 SMLR 第 6 條，證監會企業融資部獲賦權在上市申請或企業交易涉及嚴重懷疑不當行為時，於早期階段直接介入（Early stage intervention），以保護投資大眾利益及維護市場質素。","reference":"SMLR s.6; HKSI Paper 5 Guide Topic 1 Section 1.10(g)"},{"id":"T1-102","topic":"Topic 1","subtopic":"Market Misconduct - Intent vs Negligence","difficulty":"Level 2","question":"在 SFO 下，比較第 XIII 部（民事途徑/MMT）與第 XIV 部（刑事途徑/法院）所界定的市場失當行為，兩者在主觀過錯要件上的關鍵法規差異在於：","options":[{"value":"A","label":"民事審裁必須證明被告具備毫無合理疑點的犯罪蓄意"},{"value":"B","label":"第 XIV 部刑事罪行完全排除了「疏忽」（Negligence）的概念，必須證明明知或罔顧；而第 XIII 部民事失當行為（如散布虛假消息誘使交易）則涵蓋了疏忽的情形"},{"value":"C","label":"兩者在主觀構成要件上完全一模一樣，没有任何區別"},{"value":"D","label":"刑事起訴不需要任何證據即可直接定罪"}],"answer":"B","explanation":"指南 1-21 頁 3.19 節明確指出：SFO 第 XIII 部與第 XIV 部對市場失當行為的描述大致相同，但關鍵差異在於第 XIV 部刑事罪行並無「疏忽」（Negligence）的概念，刑事定罪必須達到排除合理疑點的蓄意或罔顧標準。","reference":"SFO Parts XIII, XIV; HKSI Paper 5 Guide Topic 1 Section 3.19"},{"id":"T1-103","topic":"Topic 1","subtopic":"SFO Part XV - De minimis Changes within Percentage Level","difficulty":"Level 2","question":"某機構投資者持有香港上市公司 8.2% 的表決權股份。若該投資者在市場上小幅賣出股份，其持股百分比降至 8.05%。根據 SFO 第 XV 部，該投資者：","options":[{"value":"A","label":"必須在 3 個營業日內向聯交所及該公司提交權益披露申報"},{"value":"B","label":"無須提交申報，因為該變動並未導致其持股跨越「整數百分點」（Whole percentage point），且仍維持在 5% 以上"},{"value":"C","label":"必須立即向證監會法規執行部申請自首"},{"value":"D","label":"必須在年報發布當日補交申報"}],"answer":"B","explanation":"指南 1-24 頁 3.32 節註釋指明：已達到 5% 披露門檻的大股東，其後續股份變動僅在持股百分比上升或下降跨越「整數百分點」（例如由 8.x% 跨入 7.x% 或 9.x%），或持股降至 5% 以下時，方須履行申報責任。從 8.2% 降至 8.05% 仍屬 8% 的整數水平內，無須申報。","reference":"SFO Part XV; HKSI Paper 5 Guide Topic 1 Section 3.32 Note"},{"id":"T1-104","topic":"Topic 1","subtopic":"Inside Information Disclosure - Court Orders Exception","difficulty":"Level 2","question":"根據 SFO 第 307D(1) 條，在下列哪種法定情形下，上市公司完全獲豁免披露其所獲悉的內幕消息，且無須考慮機密是否已被洩漏？","options":[{"value":"A","label":"該披露受到香港任何成文法則（Enactment）或香港法院作出的命令所禁止"},{"value":"B","label":"公司獨立非執行董事口頭表示該消息可能引發股價下跌"},{"value":"C","label":"核數師尚未確認該消息是否具備審計證明"},{"value":"D","label":"公司正在海外進行商標註冊申請"}],"answer":"A","explanation":"指南 1-25 頁 3.36(a) 節及 SFO s. 307D(1) 明確指出：若一項披露受到任何香港法例條文的限制或受到法庭命令的嚴格禁止，上市公司即依法不得且無須進行公開披露。","reference":"SFO s.307D(1); HKSI Paper 5 Guide Topic 1 Section 3.36(a)"},{"id":"T1-105","topic":"Topic 1","subtopic":"Corporate Governance Code - Skills Matrix","difficulty":"Level 2","question":"根據聯交所《企業管治守則》守則條文（Code Provisions），發行人董事會應在管治常規中備存何種機制，並於《企業管治報告》中予以充分披露？","options":[{"value":"A","label":"全體董事私人銀行存款矩陣"},{"value":"B","label":"董事會技能矩陣（Board skills matrix），並披露董事會所具備的技能組合"},{"value":"C","label":"全體員工股票期權行使流水帳"},{"value":"D","label":"保薦人盡職審查計時清單"}],"answer":"B","explanation":"指南 1-13 頁 2.8(c) 節指明：守則條文規定董事會應維持一份「董事會技能矩陣」（Board skills matrix），並在年報內的《企業管治報告》中披露董事會擁有的技能組合情況，以展現董事會成員結構的多元與均衡。","reference":"MBLR Appendix C1; HKSI Paper 5 Guide Topic 1 Section 2.8(c)"},{"id":"T1-106","topic":"Topic 1","subtopic":"Corporate Governance - Audit Committee Minutes","difficulty":"Level 1","question":"根據《企業管治守則》守則條文，關於上市發行人審核委員會（Audit Committee）的會議記錄，發行人應當：","options":[{"value":"A","label":"僅保留口頭錄音，嚴禁任何書面文字存檔"},{"value":"B","label":"備存完整詳細的審核委員會會議記錄（Full minutes of audit committee meetings should be kept）"},{"value":"C","label":"在會議結束後 10 天內全數銷毀以保密"},{"value":"D","label":"將會議記錄即時全文登載於報章付費廣告板塊"}],"answer":"B","explanation":"指南 1-14 頁 2.8(p) 節指出：守則條文要求發行人必須妥善備存審核委員會會議的完整詳細會議記錄（Full minutes），以備審計與監管查核。","reference":"MBLR Appendix C1; HKSI Paper 5 Guide Topic 1 Section 2.8(p)"},{"id":"T1-107","topic":"Topic 1","subtopic":"Corporate Governance - Re-election of Long-serving INED","difficulty":"Level 3","question":"根據現行《企業管治守則》過渡期規定，若一名獨立非執行董事（INED）在某上市發行人董事會已任職超過九年，其若擬於股東週年大會尋求續任，發行人必須符合下列哪項特定程序？","options":[{"value":"A","label":"該委任僅需由控股股東口頭同意即可，無須任何股東大會決議"},{"value":"B","label":"必須以「獨立決議案」（Separate resolution）提呈股東大會審議，且隨附通函須提供詳細資料解釋為何董事會認為該人仍屬獨立及應獲重選，並說明達致該結論所考慮的因素"},{"value":"C","label":"該董事必須先出任行政總裁滿三年方可重新候選"},{"value":"D","label":"該董事必須放棄領取任何董事袍金"}],"answer":"B","explanation":"指南 1-13 頁 2.8(i) 節及 2-15 頁 3.29 節指明：連任逾 9 年的 INED 重新委任，須作為單獨決議案由股東審議，並在隨附通函中向股東解釋為何該人仍被視為具備獨立性及應獲重選的具體考慮因素（註：此規定將於 2031 年 6 月 30 日後隨全面禁止逾 9 年 INED 政策而廢止）。","reference":"MBLR Appendix C1; HKSI Paper 5 Guide Topic 1 Section 2.8(i)"},{"id":"T1-108","topic":"Topic 1","subtopic":"ESG Code - Materiality Threshold","difficulty":"Level 2","question":"根據聯交所 ESG Code 的「重要性」（Materiality）原則，董事會在決定 ESG 報告的匯報門檻時，特別應當涵蓋評估下列哪一項關鍵影響？","options":[{"value":"A","label":"對董事私人家庭成員度假安排的影響"},{"value":"B","label":"可能在短期、中期或長期內影響發行人現金流量、獲取融資的能力或資本成本的氣候相關風險與機遇"},{"value":"C","label":"下屬員工在辦公室影印紙張的單頁採購價格波動"},{"value":"D","label":"海外同業競爭對手的股利派發比例"}],"answer":"B","explanation":"指南 1-15 頁 2.15(a) 節明確指出：重要性原則要求董事會確定向投資者及利益相關者匯報重大 ESG 議題的門檻，特別涵蓋在短期、中期或長期內可能對發行人的現金流、融資渠道或資本成本（Cost of capital）產生實質影響的氣候相關風險與機遇。","reference":"MBLR Appendix C2; HKSI Paper 5 Guide Topic 1 Section 2.15(a)"},{"id":"T1-109","topic":"Topic 1","subtopic":"Companies Ordinance - Solvency Statement Directors Liability","difficulty":"Level 3","question":"根據香港《公司條例》（Cap. 622）第 206 條，董事若在沒有合理理由相信公司具備償付能力的情況下，簽署無須經法院認可減資程序所需的「償付能力陳述書」（Solvency Statement），該董事須承擔何種法律責任？","options":[{"value":"A","label":"完全不承擔任何法律責任，因為公司具備有限責任保護"},{"value":"B","label":"觸犯嚴重的刑事罪行，一經定罪可被處以罰款及監禁"},{"value":"C","label":"僅需向公司註冊處補繳 500 港元登記手續費"},{"value":"D","label":"自動轉任為公司的無表決權清盤人"}],"answer":"B","explanation":"依據香港《公司條例》s. 206 及指南 1-27 頁 5.15 節法律原則，全體董事簽署償付能力陳述書是極其嚴肅的法定行為。董事若在無合理基礎下簽署失實的償付能力陳述書，將構成嚴重的刑事罪行（Criminal offence），面臨罰款及即時監禁刑責。","reference":"Companies Ordinance s.206; HKSI Paper 5 Guide Topic 1 Section 5.15"},{"id":"T1-110","topic":"Topic 1","subtopic":"Companies Ordinance - Public vs Private Company Transfer of Shares","difficulty":"Level 1","question":"根據香港《公司條例》第 11 條，一間私人生產企業若擬申請在香港聯交所掛牌上市，其組織架構及章程細則必須進行何種根本性修改？","options":[{"value":"A","label":"必須修改章程細則，廢除限制股份轉讓、限制股東人數不得超過 50 人、以及禁止向公眾發出認購要約的條款，從而轉型為公眾公司（Public Company）"},{"value":"B","label":"必須轉型為無股本的擔保有限公司"},{"value":"C","label":"必須將股東人數永久限制在 10 人以內"},{"value":"D","label":"必須撤銷在香港公司註冊處的任何商業登記"}],"answer":"A","explanation":"指南 1-22 至 1-23 頁 4.6–4.9 節指明：私人公司（Private company）章程受限於限制股份轉讓、人數上限 50 人及禁止向公眾發行證券。上市發行人必須為公眾公司，因此必須修改其章程細則廢除上述限制並向公司註冊處登記。","reference":"Companies Ordinance ss. 11, 12, 94; HKSI Paper 5 Guide Topic 1 Section 4.6-4.9"},{"id":"T1-111","topic":"Topic 1","subtopic":"Companies Ordinance - CWUMPO Retention of Prospectus Regime","difficulty":"Level 2","question":"在香港新《公司條例》（Cap. 622）於 2014 年實施後，關於向公眾發行股份及債權證的招股章程制度（Prospectus Regime）以及公司清盤條文，目前由哪部成文法典繼續管轄？","options":[{"value":"A","label":"《防止賄賂條例》"},{"value":"B","label":"《公司（清盤及雜項條文）條例》（CWUMPO，第 32 章）"},{"value":"C","label":"《銀行業條例》"},{"value":"D","label":"《高等法院規則》"}],"answer":"B","explanation":"指南 1-3 頁 1.1 節註釋明確指出：Cap. 622 取代了舊條例的絕大部分內容，但招股章程制度（Prospectus regime）及清盤/破產條文仍保留在舊條例中，並重命名為《公司（清盤及雜項條文）條例》（CWUMPO，Cap. 32）。","reference":"CWUMPO Cap. 32; Companies Ordinance Cap. 622; HKSI Paper 5 Guide Topic 1 Section 1.1 Note"},{"id":"T1-112","topic":"Topic 1","subtopic":"CWUMPO - Prospectus Registration Section 38D vs 342C","difficulty":"Level 2","question":"根據 CWUMPO，在香港本地註冊成立的公司與在香港以外司法管轄區註冊成立的公司（海外公司），其公開招股章程向公司註冊處處長登記的法定條文依據分別為：","options":[{"value":"A","label":"香港公司依據第 38D 條；海外公司依據第 342C 條"},{"value":"B","label":"香港公司依據第 103 條；海外公司依據第 105 條"},{"value":"C","label":"香港公司依據第 270 條；海外公司依據第 291 條"},{"value":"D","label":"兩者均依據《高等法院條例》第 1 條"}],"answer":"A","explanation":"指南 1-10 頁 1.32 節及 1-29 頁 3.53 節指明：招股章程登記由公司註冊處處長負責，香港註冊成立的公司依據 CWUMPO s. 38D 登記，香港以外註冊成立的海外公司則依據 CWUMPO s. 342C 登記。","reference":"CWUMPO ss. 38D, 342C; HKSI Paper 5 Guide Topic 1 Section 1.32, 3.53"},{"id":"T1-113","topic":"Topic 1","subtopic":"CWUMPO - Language Requirements for Prospectus","difficulty":"Level 2","question":"根據 CWUMPO 第 38 條及第 38A 條，關於在香港公開發行的招股章程之語言版本要求，下列敘述何者正確？","options":[{"value":"A","label":"發行人僅需提供英文版本，嚴禁印發繁體中文版"},{"value":"B","label":"發行人發行招股章程時必須備有英文及中文兩種語言版本；但在報章刊登公告時，若於英文報章刊發則僅需英文版，於中文報章刊發則僅需中文版"},{"value":"C","label":"任何招股章程必須以至少五種聯合國官方語言同步發售"},{"value":"D","label":"招股章程的中文版本不得作為任何法律依據"}],"answer":"B","explanation":"指南 2-32 頁 7.11(a) 節指明：CWUMPO ss. 38, 38A 要求招股章程發行時必須製作英文及中文版本；若在英文報章刊登發行廣告，僅需刊印英文版，中文報章則刊印中文版，兩者可分開印行。","reference":"CWUMPO ss. 38, 38A; HKSI Paper 5 Guide Topic 2 Section 7.11(a)"},{"id":"T1-114","topic":"Topic 1","subtopic":"CWUMPO - Minimum Allotment Timetable","difficulty":"Level 2","question":"根據 CWUMPO 關於股份配發時間表之規定，自招股章程正式印發之日起計，發行人：","options":[{"value":"A","label":"可以在當天立即向公眾配發股份"},{"value":"B","label":"在招股章程發出後 3 天內不得配發任何股份，且不得在招股章程發出之日起計 30 天後才進行配發"},{"value":"C","label":"必須等待滿 6 個月後方可開啟認購名單"},{"value":"D","label":"配發股份的最長期限為 3 年"}],"answer":"B","explanation":"指南 2-33 頁 7.16 節明確指明：依據 CWUMPO，招股章程發布後 3 天內不得配發任何股份，且不得在招股章程發行之日起計 30 天後進行配發（No allotment until 3 days after issue, and not after 30 days）。","reference":"CWUMPO; HKSI Paper 5 Guide Topic 2 Section 7.16"},{"id":"T1-115","topic":"Topic 1","subtopic":"CFA Code - Physical Separation of Chinese Wall","difficulty":"Level 2","question":"根據 CFA Code 第 4.13 段，當一家機構融資顧問隸屬於一個同時經營證券經紀、資產管理及自營投資的金融集團時，為確保有效設立「中國牆」，該機構應採取的實體控制措施是：","options":[{"value":"A","label":"讓所有業務線員工共用同一台印表機與開放式會議室"},{"value":"B","label":"實行各業務活動之間的實質物理隔離（Physical separation），並為不同業務活動聘用不同的專責員工"},{"value":"C","label":"取消機構融資部人員的門禁卡權限"},{"value":"D","label":"將自營交易員派駐於機構融資辦公區內就近監督"}],"answer":"B","explanation":"指南 1-33 頁 4.13 節規定：當機構融資顧問隸屬綜合金融集團時，必須建立有效的功能屏障（中國牆）以防機密或價格敏感資料外洩，該系統應包含「實質物理隔離」（Physical separation）及「聘用不同員工」分開執行不同業務。","reference":"CFA Code para 4.13; HKSI Paper 5 Guide Topic 1 Section 4.13"},{"id":"T1-116","topic":"Topic 1","subtopic":"CFA Code - Sponsor Independence Form A1 Declaration","difficulty":"Level 2","question":"根據《上市規則》第 3A.07 條及《CFA 操守準則》，保薦人在透過 Form A1 提交上市申請時，就其獨立性負有何種申報責任？","options":[{"value":"A","label":"保薦人僅需口頭告知聯交所主管"},{"value":"B","label":"保薦人必須在 Form A1 中明確聲明其自身 (i) 現時並預期屬於獨立；或 (ii) 現時並不或預期不具備獨立性，且若是後者，必須詳盡陳述導致其缺乏獨立性的具體事實與情況"},{"value":"C","label":"任何不具備獨立性的保薦人均絕對嚴禁參與上市承銷團的任何工作"},{"value":"D","label":"保薦人無須申報獨立性，只有核數師需要申報"}],"answer":"B","explanation":"指南 2-9 頁 3.4 節明確規定：保薦人必須於 Form A1 呈交時申報：確認其屬於獨立、或不屬於獨立；若不具備獨立性，必須詳細列明導致其不獨立的情況。上市文件亦須向公眾披露每名保薦人是否通過獨立性測試。","reference":"MBLR 3A.07; HKSI Paper 5 Guide Topic 2 Section 3.4"},{"id":"T1-117","topic":"Topic 1","subtopic":"Corporate Governance - Risk Management Review","difficulty":"Level 2","question":"根據《企業管治守則》守則條文，上市發行人董事會應以何種頻率對發行人及其附屬公司的風險管理及內部監控系統進行全面檢討？","options":[{"value":"A","label":"每五年一次"},{"value":"B","label":"至少每年進行一次檢討（At least annually），以確保該等系統的有效性及具備充足資源"},{"value":"C","label":"僅在發生重大舞弊事件時才進行"},{"value":"D","label":"完全由外聘會計師每半年口頭評估即可"}],"answer":"B","explanation":"指南 1-14 頁 2.8(o) 節規定：守則條文要求董事會應至少每年一次（At least annually）對發行人及其附屬公司的內部監控及風險管理系統進行檢討，確保其有效運行且獲得充足的人力與財務資源。","reference":"MBLR Appendix C1; HKSI Paper 5 Guide Topic 1 Section 2.8(o)"},{"id":"T1-118","topic":"Topic 1","subtopic":"ESG Code - Assurance of ESG Disclosures","difficulty":"Level 2","question":"根據聯交所 ESG Code，發行人在編制及刊發其 ESG 報告時，若選擇就該報告獲取「獨立核證」（Independent Assurance），發行人應當：","options":[{"value":"A","label":"將核證報告內容列為商業機密拒絕公開"},{"value":"B","label":"在 ESG 報告中清楚描述所獲取的獨立核證之具體範圍（Describe the scope of the assurance obtained），藉以增強所披露資料的公信力"},{"value":"C","label":"同時向聯交所申請豁免遵守所有財務審計準則"},{"value":"D","label":"強制解僱原有的外部財務審計師"}],"answer":"B","explanation":"指南 1-16 頁 2.16 節指出：發行人可考慮獲取獨立第三方核證以加強 ESG 披露的可靠性；若獲取了核證，應在 ESG 報告中詳述該核證的範圍（Scope of assurance），並指明涵蓋的實體或業務範疇。","reference":"MBLR Appendix C2; HKSI Paper 5 Guide Topic 1 Section 2.16"},{"id":"T1-119","topic":"Topic 1","subtopic":"Market Misconduct - Officer Reasonable Measures (s. 279)","difficulty":"Level 3","question":"根據 SFO 第 279 條，上市法團的「高級人員」（包括董事、經理及秘書）在預防法團本身從事市場失當行為方面，負有何種法定積極責任？","options":[{"value":"A","label":"高級人員完全不對法團的交易行為承擔任何預防責任"},{"value":"B","label":"必須採取一切合理措施（Take all reasonable measures），以確保有適當的預防措施防止該法團從事任何市場失當行為"},{"value":"C","label":"僅需在法團被證監會調查時辭職即可免責"},{"value":"D","label":"高級人員僅需保證其個人不直接持有公司股份即可"}],"answer":"B","explanation":"指南 1-21 頁 3.21(a) 節引述 SFO s. 279 法定責任：法團高級人員有法定義務採取一切合理措施，確保設立健全的預防保障機制，防止法團本身從事任何市場失當行為。若高級人員未履行此義務，將被追究監管責任。","reference":"SFO s.279; HKSI Paper 5 Guide Topic 1 Section 3.21(a)"},{"id":"T1-120","topic":"Topic 1","subtopic":"SFO Licensing - Capital Requirements for Sponsors","difficulty":"Level 2","question":"根據證監會《勝任能力的指引》附錄 A，從事第 6 類受規管活動並擬擔任上市保薦人（Sponsor）的持牌法團，必須符合下列哪項法定最低繳足股本要求？","options":[{"value":"A","label":"港幣 500 萬元"},{"value":"B","label":"港幣 1,000 萬元（HK$10 million）"},{"value":"C","label":"港幣 3,000 萬元"},{"value":"D","label":"港幣 1 億元"}],"answer":"B","explanation":"指南 2-9 頁 3.1 節及 SFC Guidelines on Competence Appendix A 明確規定：擬從事保薦人業務的持牌法團，必須滿足至少 1,000 萬港元（HK$10 million）的最低實繳股本（Paid-up share capital）要求，並具備充足的專業勝任能力與人手配置。","reference":"SFC Guidelines on Competence Appendix A; HKSI Paper 5 Guide Topic 2 Section 3.1"},{"id":"T1-121","topic":"Topic 1","subtopic":"Corporate Governance Guide for Boards and Directors","difficulty":"Level 1","question":"香港交易所發布的《董事會及董事企業管治指南》（Corporate Governance Guide for Boards and Directors）在監管體系中的地位是：","options":[{"value":"A","label":"屬於取代《上市規則》全部條文的成文憲法"},{"value":"B","label":"旨在協助發行人理解並落實企業管治要求，雖然其本身不能凌駕於《上市規則》條文之上，但提供了如何應用與匯報管治原則的實用指引"},{"value":"C","label":"僅適用於瀕臨破產清盤的受監管機構"},{"value":"D","label":"由公司註冊處單獨執行的刑事指引"}],"answer":"B","explanation":"指南 1-16 頁 2.17 節指出：《董事會及董事企業管治指南》旨在協助發行人合規，反映市場當前對良好管治的期許；該指引雖然不凌駕於《上市規則》之上，但就原則的應用與報告提供了極具參考價值的指導。","reference":"HKEX Corporate Governance Guide; HKSI Paper 5 Guide Topic 1 Section 2.17"},{"id":"T1-122","topic":"Topic 1","subtopic":"Market Misconduct - Stock Market Manipulation Scenarios","difficulty":"Level 3","question":"某機構融資顧問在協助某中小型上市發行人進行二級市場配股前夕，指示其關聯經紀商連續發出多筆高於市價的虛假小額買單以推高收市價，意圖吸引機構投資者以更高價格認購配售股份。該行為觸犯了 SFO 下的：","options":[{"value":"A","label":"合法的發行前市場價格發現機制"},{"value":"B","label":"操縱證券市場（Stock Market Manipulation，SFO 第 278/298 條）"},{"value":"C","label":"符合《穩定價格規則》的安全港護盤行為"},{"value":"D","label":"正常的做市商雙向義務"}],"answer":"B","explanation":"指南 1-23 頁 3.27 節及 SFO ss. 278, 299：透過兩次或以上交易推高股價，且意圖誘使他人認購證券，屬於典型的「操縱證券市場」違法行為；且該行為發生在二級市場配售前，完全不屬於 IPO 價格穩定安全港範圍。","reference":"SFO ss. 278, 299; HKSI Paper 5 Guide Topic 1 Section 3.27"},{"id":"T1-123","topic":"Topic 1","subtopic":"Inside Information Disclosure - Civil Liability Evidence (s. 307Z)","difficulty":"Level 2","question":"根據 SFO 第 307Z 條及第 307ZA 條，因上市公司延遲披露內幕消息而遭受金錢損失的投資者向法院提起民事索償時，市場失當行為審裁處（MMT）先前作出的判定：","options":[{"value":"A","label":"嚴禁提呈給法官，否則該訴訟無效"},{"value":"B","label":"可在民事訴訟中直接獲接納為該公司或其高級人員違反法定披露義務的確鑿證據（Admissible as evidence）"},{"value":"C","label":"只能用作參考，原告必須重新由零開始舉證全部事實細節"},{"value":"D","label":"自動導致被告的所有銀行存款被充公"}],"answer":"B","explanation":"指南 1-26 頁 3.40 節引述 SFO ss. 307Z, 307ZA：在因違反內幕消息披露義務引發的民事訴訟中，MMT 先前裁定某人違反披露要求的裁決，在民事法律程序中可獲接納為證據（Admissible as evidence），大幅降低受損投資者的舉證負擔。","reference":"SFO ss. 307Z, 307ZA; HKSI Paper 5 Guide Topic 1 Section 3.40"},{"id":"T1-124","topic":"Topic 1","subtopic":"CFA Code - Dealing with Uncooperative Client","difficulty":"Level 2","question":"某上市公司在進行重大收購過程中，財務總監故意向機構融資顧問隱瞞了一份對目標公司資產造成重大減值的法院判決書。當顧問偶然發現該判決書並要求補正通函時，客戶斷然拒絕。根據 CFA Code，該顧問的最恰當做法是：","options":[{"value":"A","label":"私下收取雙倍顧問費並在通函中刪除相關警告章節"},{"value":"B","label":"強烈敦促客戶合規；若客戶無正當理由持續拒絕，顧問應認真考慮辭任（Cease to act），並在監管機構詢問時如實全面合作"},{"value":"C","label":"替客戶銷毀該法院判決書原件"},{"value":"D","label":"私下在暗網上放售該未公開判決書"}],"answer":"B","explanation":"指南 1-34 頁 4.22 節指出：顧問應盡一切努力確保客戶合規；若客戶在無正當理由下拒絕向監管機構呈報重大不合規或更正虛假資訊，顧問必須考慮終止提供服務（Cease to act），並在監管查詢時全力配合。","reference":"CFA Code para 6; HKSI Paper 5 Guide Topic 1 Section 4.22"},{"id":"T1-125","topic":"Topic 1","subtopic":"CFA Code - Continuous Professional Training (CPT)","difficulty":"Level 1","question":"根據證監會《持續專業培訓指引》（Guidelines on CPT），持牌機構融資從業人員必須定期參與培訓以維持勝任能力。若該從業員擔任上市保薦人主要人員或收購顧問，其應當：","options":[{"value":"A","label":"完全免除任何 CPT 培訓要求"},{"value":"B","label":"遵守適用於保薦人或收購顧問的特定額外 CPT 專題培訓要求（例如每年涵蓋足夠小時數的相關專業課題）"},{"value":"C","label":"僅需在退休當年參加一次培訓講座"},{"value":"D","label":"將培訓義務委託給初級實習生代為簽到"}],"answer":"B","explanation":"指南 1-38 頁 4.45 節指明：從事保薦人、合規顧問或涉及《收購守則》業務的專業人士，除一般常規培訓外，還須符合《持續專業培訓指引》第 5.3 段的額外專項課題時數培訓要求。","reference":"SFC Guidelines on CPT para 5.3; HKSI Paper 5 Guide Topic 1 Section 4.45"},{"id":"T1-126","topic":"Topic 1","subtopic":"Basic Law - Free Operation of Financial Markets","difficulty":"Level 1","question":"根據《中華人民共和國香港特別行政區基本法》，香港特區政府在金融市場與國際金融中心地位方面的憲制職能是：","options":[{"value":"A","label":"全面取締所有外國投資銀行在港業務"},{"value":"B","label":"提供適當的經濟和法律環境，以維護香港作為國際金融中心的地位，並依法規管及監察其金融市場的自由運作"},{"value":"C","label":"由政府全額資助所有新上市公司股票發行"},{"value":"D","label":"實施嚴格的外匯管制以禁止資金自由進出"}],"answer":"B","explanation":"指南 1-4 頁 1.5 節指出：《基本法》規定香港特區政府須提供適當的經濟及法律環境，維護香港國際金融中心地位，並監管和監督其金融市場的自由運作（Free operation of its financial markets）。","reference":"Basic Law; HKSI Paper 5 Guide Topic 1 Section 1.5"},{"id":"T1-127","topic":"Topic 1","subtopic":"Corporate Governance Code - Continuous Professional Development for Directors","difficulty":"Level 2","question":"根據《上市規則》及《企業管治守則》守則條文，上市發行人的全體董事在持續專業發展（CPD）方面的責任為：","options":[{"value":"A","label":"董事一經委任即終身具備法定智慧，無須任何後續培訓"},{"value":"B","label":"全體董事必須參與持續專業培訓以更新其知識與技能，確保全面明瞭身為董事的法律法規職責及行業最新動態"},{"value":"C","label":"僅有執行董事需要培訓，獨立非執董嚴禁參加任何培訓"},{"value":"D","label":"每年只需提交一份讀書心得報告至聯交所圖書館"}],"answer":"B","explanation":"指南 1-13 頁 2.8(l) 節及 2-15 頁 3.26(j) 節規定：所有董事均必須參與持續專業發展（CPD），以拓展並更新其知識技能，深入掌握發行人的業務、管治政策以及相關法規項下的董事責任。","reference":"MBLR Appendix C1; HKSI Paper 5 Guide Topic 1 Section 2.8(l); Topic 2 Section 3.26(j)"},{"id":"T1-128","topic":"Topic 1","subtopic":"Corporate Governance - Audit Committee Composition & Chair","difficulty":"Level 2","question":"根據《上市規則》第 3.21 條，上市發行人建立審核委員會（Audit Committee）時，其架構必須滿足下列哪項硬性法定標準？","options":[{"value":"A","label":"成員至少 2 人，必須由行政總裁擔任主席"},{"value":"B","label":"全部由非執行董事組成、至少具備 3 名成員、大部分必須為 INED、至少一名 INED 具備適當會計或財務資格，且主席必須由 INED 擔任"},{"value":"C","label":"由全體執行董事組成，且全數不得具備任何會計背景"},{"value":"D","label":"成員中必須至少包含一名聯交所現職僱員"}],"answer":"B","explanation":"指南 2-19 至 2-20 頁 3.45 節指明審核委員會五大法定要件：(1) 僅由非執行董事組成；(2) 至少 3 名成員；(3) 過半數為獨立非執董；(4) 至少一名獨立非執董具備適當專業會計或相關財務管理專長；(5) 主席必須由獨立非執董擔任。","reference":"MBLR 3.21; HKSI Paper 5 Guide Topic 2 Section 3.45"},{"id":"T1-129","topic":"Topic 1","subtopic":"Corporate Governance - Remuneration Committee","difficulty":"Level 2","question":"根據《上市規則》第 3.25 條，發行人設立的薪酬委員會（Remuneration Committee）必須符合何種組成規定？","options":[{"value":"A","label":"必須由公司全資工會代表出任主席"},{"value":"B","label":"必須由獨立非執行董事擔任主席，且成員中大部分必須為獨立非執行董事"},{"value":"C","label":"全數成員必須為公司持股超過 50% 的大股東"},{"value":"D","label":"薪酬委員會無須具備任何獨立董事"}],"answer":"B","explanation":"指南 2-20 頁 3.47 節指明：上市發行人必須設立薪酬委員會，其主席必須由獨立非執行董事（INED）出任，且委員會成員的大多數必須為獨立非執行董事。","reference":"MBLR 3.25; HKSI Paper 5 Guide Topic 2 Section 3.47"},{"id":"T1-130","topic":"Topic 1","subtopic":"Corporate Governance - Nomination Committee Chair & Composition","difficulty":"Level 2","question":"根據《上市規則》第 3.27A 條，上市發行人的提名委員會（Nomination Committee）的主席必須由誰出任？","options":[{"value":"A","label":"必須由公司的財務總監（CFO）出任"},{"value":"B","label":"必須由董事會主席或獨立非執行董事出任，且成員中大部分必須為獨立非執行董事"},{"value":"C","label":"必須由聯交所上市主管親自指派"},{"value":"D","label":"由公司最年輕的實習生擔任"}],"answer":"B","explanation":"指南 2-20 頁 3.50 節指明：發行人必須設立提名委員會，由董事會主席或一名獨立非執行董事出任主席，且委員會大部分成員必須為獨立非執行董事。","reference":"MBLR 3.27A; HKSI Paper 5 Guide Topic 2 Section 3.50"},{"id":"T1-131","topic":"Topic 1","subtopic":"Companies Ordinance - Solvency Test Criteria (s. 205)","difficulty":"Level 3","question":"根據香港《公司條例》（Cap. 622）第 205 條，董事在簽署償付能力陳述書時，所依據的法定「償付能力測試」（Solvency Test）標準包括：","options":[{"value":"A","label":"只要公司帳面資產大於零即可"},{"value":"B","label":"在緊隨陳述書簽署後公司能清償債務，且在隨後的 12 個月內（或在預期清盤的 12 個月內）公司有能力悉數清償到期債務"},{"value":"C","label":"保證公司股價在未來 12 個月內不會跌破每股淨資產"},{"value":"D","label":"所有債權人自願簽署放棄全部利息請求權"}],"answer":"B","explanation":"依據香港《公司條例》s. 205 及指南 1-27 頁 5.15 節：償付能力陳述書要求全體董事形成合理意見：在陳述書發出後公司能立即償還債務，且若公司繼續經營，在陳述書發出後 12 個月內有能力償還其到期債項（Cash-flow test & Balance sheet test）。","reference":"Companies Ordinance s.205; HKSI Paper 5 Guide Topic 1 Section 5.15"},{"id":"T1-132","topic":"Topic 1","subtopic":"Companies Ordinance - Treasury Shares Regime","difficulty":"Level 2","question":"香港聯交所於 2024 年修訂《上市規則》全面引入「庫存股」（Treasury Shares）框架。關於上市公司回購本身股份後的處置，下列敘述何者正確？","options":[{"value":"A","label":"回購後的股份必須在 24 小時內依法強制註銷，絕對不允許存管"},{"value":"B","label":"發行人可選擇註銷回購股份，亦可選擇將該等股份以庫存方式持有（Treasury shares），並可在日後依循一般性授權向市場再出售或用作股份獎勵"},{"value":"C","label":"庫存股在發行人股東大會上享有三倍的表決權"},{"value":"D","label":"庫存股有權享有全部現金股息派發並計入公眾持股量"}],"answer":"B","explanation":"指南 1-26 頁 5.8–5.9 節及 2-26 頁 5.8 節指明：新架構下發行人回購股份後無須強制即時註銷，可作為庫存股份（Treasury shares）持有；庫存股份在持有期間不具表決權及派息權，但日後可依一般性授權再出售或轉讓。","reference":"MBLR 10.06; HKSI Paper 5 Guide Topic 1 Section 5.8-5.9; Topic 2 Section 5.8"},{"id":"T1-133","topic":"Topic 1","subtopic":"Treasury Shares - Resale Restrictions to Core Connected Persons","difficulty":"Level 3","question":"根據《上市規則》第 10.06A 條，上市發行人在出售其持有的庫存股份（Treasury shares）時，受到何種嚴格關連限制？","options":[{"value":"A","label":"發行人可以折讓 90% 將庫存股全數配售予公司主席的配偶"},{"value":"B","label":"發行人不得在明知情況下將庫存股份出售予「核心關連人士」（Core Connected Person），而核心關連人士亦不得在明知情況下購買該等庫存股份"},{"value":"C","label":"核心關連人士享有購買庫存股的法定優先購買權"},{"value":"D","label":"出售予核心關連人士無須向聯交所提交任何申報"}],"answer":"B","explanation":"指南 2-26 頁 5.9(a) 節明確規定：發行人不得在知情下向核心關連人士出售庫存股份，核心關連人士亦不得知情購買該等庫存股份（MBLR 10.06A），以防止控股股東或董事利用庫存股進行利益輸送。","reference":"MBLR 10.06A; HKSI Paper 5 Guide Topic 2 Section 5.9(a)"},{"id":"T1-134","topic":"Topic 1","subtopic":"Treasury Shares - Blackout Period for Resale","difficulty":"Level 2","question":"根據《上市規則》第 10.06A 條，發行人在下列哪一期間內**嚴禁**出售任何庫存股份（Treasury shares）？","options":[{"value":"A","label":"在董事會批准任何年度或半年度業績會議召開之日前 30 天起，至公布業績當日止的期間內"},{"value":"B","label":"在公司股價上漲超過 5% 的任何交易日"},{"value":"C","label":"在每年 1 月 1 日至 1 月 3 日元旦假期期間"},{"value":"D","label":"在全體獨立董事年假期間"}],"answer":"A","explanation":"指南 2-26 頁 5.9(c) 節指明：發行人在擁有未公開內幕消息期間，或在董事會審批任何財政期間業績會議召開前（或刊發業績期限，以較早者為準）起計 30 天內直至業績公告日止的禁售期內，嚴禁出售庫存股份。","reference":"MBLR 10.06A; HKSI Paper 5 Guide Topic 2 Section 5.9(c)"},{"id":"T1-135","topic":"Topic 1","subtopic":"Treasury Shares - Next Day Disclosure Returns","difficulty":"Level 2","question":"根據《上市規則》第 10.06B 條，當發行人出售庫存股份後，必須在何時向聯交所呈交並發布披露報表？","options":[{"value":"A","label":"在下一個季度結束後 10 天內"},{"value":"B","label":"不得遲於下一個營業日早市交易時段（或任何開市前交易時段）開始前 30 分鐘"},{"value":"C","label":"在隨後的年度股東大會上口頭通報即可"},{"value":"D","label":"出售後 3 年內歸檔備查"}],"answer":"B","explanation":"指南 2-26 頁 5.10 節指明：發行人出售庫存股份後，必須不遲於下一個營業日早市或開市前時段開始前 30 分鐘向聯交所呈交披露報表，交代出售股數、價格及集資總額（MBLR 10.06B）。","reference":"MBLR 10.06B; HKSI Paper 5 Guide Topic 2 Section 5.10"},{"id":"T1-136","topic":"Topic 1","subtopic":"Treasury Shares - 5% Threshold Announcement","difficulty":"Level 3","question":"根據《上市規則》第 10.06B 條，若發行人在任何連續 12 個月內累計出售的庫存股份達到其股本的多少比例時，必須發布專項公告詳細說明所得款項用途及出售最高最低價？","options":[{"value":"A","label":"達到 1% 或以上"},{"value":"B","label":"達到 5% 或以上"},{"value":"C","label":"達到 25% 或以上"},{"value":"D","label":"達到 50% 或以上"}],"answer":"B","explanation":"指南 2-26 頁 5.11 節規定：凡發行人在任何 12 個月期間內出售的庫存股份數量達到發行人股本的 5% 或以上，發行人必須刊登公告，交代出售價格區間、集資總額以及所得款項的具體用途說明。","reference":"MBLR 10.06B; HKSI Paper 5 Guide Topic 2 Section 5.11"},{"id":"T1-137","topic":"Topic 1","subtopic":"CFA Code - Sponsor Primary Channel of Communication","difficulty":"Level 2","question":"新申請人在主板申請上市時委聘了三間持牌法團擔任聯席保薦人（Joint Sponsors）。根據《上市規則》第 3A 章，發行人及保薦人必須：","options":[{"value":"A","label":"讓三間保薦人各自指派代表同時向聯交所發出不同的公函"},{"value":"B","label":"明確知會聯交所由哪一間保薦人作為與聯交所溝通的主要管道（Primary channel of communication），且聯交所通常預期該保薦人必須具備獨立性"},{"value":"C","label":"禁止保薦人之間互相通電話"},{"value":"D","label":"強制開除其中兩間保薦人"}],"answer":"B","explanation":"指南 2-9 頁 3.2–3.3 節指出：申請人可委任多於一名保薦人，但必須指定其中一名保薦人作為與聯交所的主要溝通渠道；且聯交所通常預期出任主要溝通渠道的保薦人必須符合獨立性要求。","reference":"MBLR 3A.07; HKSI Paper 5 Guide Topic 2 Section 3.2-3.3"},{"id":"T1-138","topic":"Topic 1","subtopic":"CFA Code - Duty to Report Cessation of Sponsor Appointment","difficulty":"Level 2","question":"根據《上市規則》第 3A.17 條及《CFA 操守準則》，若保薦人在新上市申請完成前終止擔任該發行人的保薦人，該保薦人負有何種法定/規則責任？","options":[{"value":"A","label":"保薦人可完全保持沉默，無須採取任何行動"},{"value":"B","label":"保薦人必須立即且迅速向聯交所報告其終止擔任保薦人的真實原因（Report to the SEHK promptly the reasons for ceasing to act）"},{"value":"C","label":"保薦人必須自費購買該發行人的全部剩餘資產"},{"value":"D","label":"保薦人必須向所有潛在零售投資者退還報名費"}],"answer":"B","explanation":"指南 2-10 頁 3.6(h) 節及 MBLR 3A.17 明確規定：若保薦人在上市完成前終止委聘，保薦人必須迅速向聯交所如實報告其停止擔任保薦人的原因，以便監管機構評估申請人是否存在未披露的重大合規疑點。","reference":"MBLR 3A.17; HKSI Paper 5 Guide Topic 2 Section 3.6(h)"},{"id":"T1-139","topic":"Topic 1","subtopic":"Corporate Governance - Whistleblowing Committee Level","difficulty":"Level 1","question":"根據《企業管治守則》守則條文，發行人所建立的舉報政策（Whistleblowing Policy）中，僱員及外界人士應能夠向哪一個董事會委員會直接提出保密及匿名投訴？","options":[{"value":"A","label":"薪酬委員會"},{"value":"B","label":"審核委員會（Audit Committee）"},{"value":"C","label":"執行委員會"},{"value":"D","label":"投資策略委員會"}],"answer":"B","explanation":"指南 1-14 頁 2.8(q) 節指明：守則條文要求發行人建立舉報政策與系統，讓僱員及商業夥伴能以保密及匿名方式直接向「審核委員會」（Audit Committee）反映任何涉嫌不當行為。","reference":"MBLR Appendix C1; HKSI Paper 5 Guide Topic 1 Section 2.8(q)"},{"id":"T1-140","topic":"Topic 1","subtopic":"ESG Code - Consistency Reporting Principle","difficulty":"Level 2","question":"根據聯交所 ESG Code 的四大原則之一「一致性」（Consistency）原則，發行人在編制 ESG 數據時的核心要求是：","options":[{"value":"A","label":"每年必須強制更換不同的統計指標與單位以體現創新"},{"value":"B","label":"發行人應採用前後一致的披露統計方法與測算模型，以便利於不同時期之間 ESG 數據進行有意義的橫向與縱向比較"},{"value":"C","label":"所有指標數值必須與公司股價波動完全一致"},{"value":"D","label":"只能引用未經審計的網絡社群評分"}],"answer":"B","explanation":"指南 1-16 頁 2.15(d) 節指明：一致性原則要求發行人採用前後一致的方法（Consistent methodologies），以利於利害關係人及投資者在不同時間跨度下對 ESG 表現與數據進行具實質意義的追蹤與比較。","reference":"MBLR Appendix C2; HKSI Paper 5 Guide Topic 1 Section 2.15(d)"},{"id":"T1-141","topic":"Topic 1","subtopic":"CFA Code - Sponsor Independence 1% Shareholding Test","difficulty":"Level 2","question":"根據《上市規則》第 3A.07 條及相關指引，評估保薦人是否獨立於上市申請人時，若保薦人集團實益持有該發行人已發行股份的比例達到多少，其獨立性通常會被否定？","options":[{"value":"A","label":"達到 0.01% 或以上"},{"value":"B","label":"達到或超過 5% 的有投票權股份或經濟權益"},{"value":"C","label":"達到 30% 以上"},{"value":"D","label":"達到 100% 全資控股"}],"answer":"B","explanation":"指南 2-16 頁 3.30(a) 節及保薦人獨立性指引指出：若持有發行人 5% 或以上股份權益，通常會直接損害獨立性判定（在評估 INED 時，持有逾 1% 亦會引發質疑，逾 5% 則通常不被視為獨立）。","reference":"MBLR 3A.07, 3.13; HKSI Paper 5 Guide Topic 2 Section 3.4, 3.30"},{"id":"T1-142","topic":"Topic 1","subtopic":"Model Code for Securities Transactions - Blackout Periods","difficulty":"Level 2","question":"根據《上市規則》附錄 C3《標準守則》（Model Code），上市發行人董事在下列哪段法定期限（禁售期/Blackout Period）內嚴禁買賣本公司任何上市證券？","options":[{"value":"A","label":"在全年業績公布之日前 60 天內，以及半年業績公布之日前 30 天內（或相關財政期結束至業績公布之日，以較短者為準）"},{"value":"B","label":"在公司股票上市滿 10 週年當天"},{"value":"C","label":"在每年香港農曆新年假期前 5 天"},{"value":"D","label":"董事在任期內任何時候皆嚴禁買賣本公司證券"}],"answer":"A","explanation":"指南 2-17 頁 3.33 節明確指明：董事禁售期規定為：年度業績公告前 60 天內、半年度業績公告前 30 天內（或由財政期結束至業績公告日，以較短者為準），董事絕對不得買賣本公司證券。","reference":"MBLR Appendix C3; HKSI Paper 5 Guide Topic 2 Section 3.33"},{"id":"T1-143","topic":"Topic 1","subtopic":"Model Code - Adoption of Own Code by Listed Issuer","difficulty":"Level 2","question":"上市公司若不直接採用聯交所附錄 C3 的《標準守則》，而選擇自行制定內部董事證券交易守則，根據《上市規則》第 3.17 條，該內部守則的條款：","options":[{"value":"A","label":"可以比聯交所《標準守則》更加寬鬆"},{"value":"B","label":"其嚴格程度必須不遜於（No less exacting than）聯交所《標準守則》所訂立的標準"},{"value":"C","label":"必須允許董事在持有未公開重大重組內幕消息時自由買賣"},{"value":"D","label":"無須在公司年報或中期報告中作出任何披露"}],"answer":"B","explanation":"指南 2-18 頁 3.35 節指出：發行人可採納本身的董事交易守則，但其條款的嚴格程度必須「不遜於」（No less exacting than）《標準守則》所載標準；只要符合該標準，違反自身內部代碼不自動構成違規，但發行人必須於年報披露合規情況。","reference":"MBLR 3.17, Appendix C3; HKSI Paper 5 Guide Topic 2 Section 3.35"},{"id":"T1-144","topic":"Topic 1","subtopic":"Model Code - Directors Breach Disclosure in Annual Report","difficulty":"Level 2","question":"若上市發行人的某位執行董事在財政年度內違反了《標準守則》於禁售期內違規減持股票，發行人在編制其年報及中期報告時必須：","options":[{"value":"A","label":"對外保持絕對緘默以維護股價穩定"},{"value":"B","label":"在年報及中期報告中具體披露該項違規的詳細情況，並說明發行人為處理與糾正該項違規所採取的補救措施（Remedial steps）"},{"value":"C","label":"強制將該董事的所有薪金扣除歸入公司資本公積"},{"value":"D","label":"立即向聯交所申請自願永久撤銷上市地位"}],"answer":"B","explanation":"指南 2-18 頁 3.34 節指明：若董事出現任何未遵守交易準則的事件，發行人必須在其年報及中期報告中披露該項不合規的詳細情況，以及發行人為處理此問題所採取的補救步驟說明。","reference":"MBLR Appendix C3; HKSI Paper 5 Guide Topic 2 Section 3.34"},{"id":"T1-145","topic":"Topic 1","subtopic":"Corporate Governance - Board Evaluation Frequency","difficulty":"Level 1","question":"根據《企業管治守則》守則條文，董事會應以何種頻率對自身的整體運作績效進行正式評估？","options":[{"value":"A","label":"每十年一次"},{"value":"B","label":"至少每兩年進行一次（At least every two years）"},{"value":"C","label":"每月一次並送交聯交所存檔"},{"value":"D","label":"自願性質，完全毋須進行任何評估"}],"answer":"B","explanation":"指南 1-13 頁 2.8(b) 節指明：守則條文規定董事會應至少每兩年（At least every two years）對其績效進行一次正式的評估（Formal evaluation of its performance）。","reference":"MBLR Appendix C1; HKSI Paper 5 Guide Topic 1 Section 2.8(b)"},{"id":"T1-146","topic":"Topic 1","subtopic":"Corporate Governance - Induction for Newly Appointed Directors","difficulty":"Level 1","question":"根據《企業管治守則》守則條文，當新董事獲委任加入上市發行人董事會時，發行人應當為其提供：","options":[{"value":"A","label":"公司全套原始源代碼硬盤"},{"value":"B","label":"全面、正式且切合需要的就任指引與培訓（Comprehensive, formal and tailored induction）"},{"value":"C","label":"無條件借貸 1,000 萬港元作為就職迎新禮金"},{"value":"D","label":"豁免遵守香港任何刑事法律的免責信件"}],"answer":"B","explanation":"指南 1-13 頁 2.8(k) 節指明：守則條文要求發行人應在新董事獲委任時，為其安排全面、正式且特設的就任指引（Tailored induction），確保其深入了解公司運作架構及法定董事責任。","reference":"MBLR Appendix C1; HKSI Paper 5 Guide Topic 1 Section 2.8(k)"},{"id":"T1-147","topic":"Topic 1","subtopic":"Companies Ordinance - Public vs Guarantee Companies Liability","difficulty":"Level 2","question":"根據香港《公司條例》（Cap. 622）第 9 條，擔保有限公司（Guarantee Company）與一般股份有限公司的核心法律結構差異在於：","options":[{"value":"A","label":"擔保有限公司發行無限制面額的優先股"},{"value":"B","label":"擔保有限公司沒有股本（Does not have a share capital），其成員的法律責任限於其章程細則所訂明在公司清盤時承諾分擔的款額"},{"value":"C","label":"擔保有限公司可以在聯交所主板自由發行流通普通股上市"},{"value":"D","label":"擔保有限公司成員承擔無限個人破產責任"}],"answer":"B","explanation":"指南 1-23 頁 4.10 節指出：擔保有限公司並無股本（No share capital），成員責任僅以公司清盤時其各自承諾出資的擔保額度為限。此類公司不可在聯交所上市（上市發行人必須為具備股本的公眾公司）。","reference":"Companies Ordinance s.9; HKSI Paper 5 Guide Topic 1 Section 4.10"},{"id":"T1-148","topic":"Topic 1","subtopic":"SFO Part XV - Attributed Interests (Family & Trust)","difficulty":"Level 3","question":"在 SFO 第 XV 部權益披露架構下，某上市發行人的執行董事個人直接持有公司 2% 股份。其配偶持有公司 1.5% 股份，其未滿 18 歲的未成年子女持有 0.8% 股份，且該董事設立的一項全權信託持有 2.5% 股份。該董事在第 XV 部下被視為擁有的法定股份申報權益總額為：","options":[{"value":"A","label":"僅限於其個人名下的 2%"},{"value":"B","label":"全部合併歸屬（Attributed interests），合計為 6.8%"},{"value":"C","label":"2% 加上信託的 2.5%，合計為 4.5%"},{"value":"D","label":"0%，因為單獨每項均未超過 5%"}],"answer":"B","explanation":"指南 1-24 頁 3.31 節及 SFO ss. 316, 344 指出：董事須披露全部權益（無最低門檻），且其配偶、未成年子女持有的權益，以及其作為創立人/受託人的信託權益，依法全部歸屬（Attributed）計算至該董事名下。因此總權益為 2% + 1.5% + 0.8% + 2.5% = 6.8%。","reference":"SFO ss. 316, 344; HKSI Paper 5 Guide Topic 1 Section 3.31"},{"id":"T1-149","topic":"Topic 1","subtopic":"Market Misconduct - Inducing Transactions by Reckless Omission","difficulty":"Level 3","question":"某上市發行人在其通函中預測下一年度淨利潤將增長 200%，但罔顧了其最大單一客戶已於一個月前正式發出終止合作協議通知的重大事實，導致大量投資者在二級市場追高買入該股票。該發行人及其知情董事觸犯了 SFO 下的何種市場失當行為？","options":[{"value":"A","label":"正常的商業樂觀預期陳述"},{"value":"B","label":"披露虛假或具誤導性資料以誘使進行交易（ss. 277/298），因為遺漏該重大事實（Omission of a material fact）使整體陳述產生重大誤導"},{"value":"C","label":"合法的借殼上市預期管理"},{"value":"D","label":"無過錯的技術性審計調整"}],"answer":"B","explanation":"指南 1-22 至 1-23 頁 3.24 節及 SFO ss. 277, 298：披露重大虛假或誤導性資料包括「重大事實的遺漏」（Omission of a material fact）。明知或罔顧此重大不利遺漏而發布誤導性盈利預測，誘使他人交易證券，構成嚴重的市場失當行為及刑事罪行。","reference":"SFO ss. 277, 298; HKSI Paper 5 Guide Topic 1 Section 3.24"},{"id":"T1-150","topic":"Topic 1","subtopic":"CFA Code - Fit and Proper Ongoing Assessment","difficulty":"Level 2","question":"證監會在依據 SFO 第 129 條評定機構融資顧問及其保薦人是否持續具備「適當人選」（Fit and Proper）資格時，會將下列哪一項作為核心考核基準？","options":[{"value":"A","label":"該中介人是否能保證其保薦的所有上市公司市值每年翻倍"},{"value":"B","label":"遵守《機構融資顧問操守準則》（CFA Code）、證監會各項指引、財務健全狀況、從業人員的勝任能力、品行聲譽及誠信水平"},{"value":"C","label":"該機構在香港主要商務區擁有的實體自置物業數量"},{"value":"D","label":"該機構向香港稅務局繳交的年度薪俸稅總額"}],"answer":"B","explanation":"指南 1-31 頁 4.4 節及 SFO s. 129 明確規定：證監會以 CFA Code 及其他守則指引作為衡量機構融資顧問適當人選資格的基準；任何違反行為準則、財務實力不足、誠信缺失或勝任能力欠缺，均會直接損害其持牌適當人選資格，引發紀律制裁。","reference":"SFO s.129; CFA Code para 1; HKSI Paper 5 Guide Topic 1 Section 4.4"},{"id":"T2-001","topic":"Topic 2","subtopic":"Main Board Quantitative Tests - Profit Test","difficulty":"Level 2","question":"某新申請人擬申請在香港聯交所主板上市，並選擇採用「盈利測試」（Profit Test）。根據主板上市規則（MBLR 8.05(1)），該申請人在營業紀錄期內的股東應佔盈利法定門檻要求為：","options":[{"value":"A","label":"最近一年盈利不低於 2,000 萬港元，前兩年累計不低於 3,000 萬港元"},{"value":"B","label":"最近一個財政年度盈利不低於 3,500 萬港元，前兩個財政年度累計不低於 4,500 萬港元（三年累計至少 8,000 萬港元）"},{"value":"C","label":"三年累計盈利不低於 5,000 萬港元，且每年必須維持盈利年增長 20% 以上"},{"value":"D","label":"最近一年盈利不低於 5,000 萬港元，且無須審計前兩年盈利"}],"answer":"B","explanation":"依據 MBLR 8.05(1) 及指南 2-49 頁 9.5(a) 節，主板盈利測試要求：具備 3 年營業紀錄期，最近一個財政年度股東應佔盈利不低於 3,500 萬港元，且前兩個財政年度累計不低於 4,500 萬港元，三年累計利潤至少為 8,000 萬港元。","reference":"MBLR 8.05(1); HKSI Paper 5 Guide Topic 2 Section 9.5(a)"},{"id":"T2-002","topic":"Topic 2","subtopic":"Main Board Quantitative Tests - Market Cap/Revenue/Cash Flow Test","difficulty":"Level 2","question":"某申請人擬透過「市值／收益／現金流量測試」（MBLR 8.05(2)）申請主板上市。該公司必須在上市時及營業紀錄期內符合下列哪組法定指標？","options":[{"value":"A","label":"上市時市值至少 5 億港元、最近一年收益至少 1 億港元、三年累計經營業務現金淨流入至少 3,000 萬港元"},{"value":"B","label":"上市時市值至少 20 億港元、最近一個經審計財政年度收益至少 5 億港元、前三個財政年度累計經營業務現金淨流入至少 1 億港元"},{"value":"C","label":"上市時市值至少 40 億港元、最近一年收益至少 5 億港元、現金流量無須為正數"},{"value":"D","label":"上市時市值至少 15 億港元、三年平均收益至少 2 億港元、經營現金流為正數即可"}],"answer":"B","explanation":"根據 MBLR 8.05(2) 及指南 2-49 頁 9.5(b) 節，該測試要求：(1) 上市時市值至少 20 億港元；(2) 最近一個經審計財政年度收益至少 5 億港元；及 (3) 前三個財政年度經營業務產生的正現金流入累計至少 1 億港元。","reference":"MBLR 8.05(2); HKSI Paper 5 Guide Topic 2 Section 9.5(b)"},{"id":"T2-003","topic":"Topic 2","subtopic":"Main Board Quantitative Tests - Market Cap/Revenue Test","difficulty":"Level 2","question":"某大型互聯網平台公司目前經營性現金流暫時為負，但業務規模龐大，擬依據「市值／收益測試」（MBLR 8.05(3)）申請主板上市。該公司在上市時的預期市值及最近一年收益最低要求為：","options":[{"value":"A","label":"市值至少 10 億港元，收益至少 2 億港元"},{"value":"B","label":"市值至少 40 億港元，最近一個經審計財政年度收益至少 5 億港元"},{"value":"C","label":"市值至少 80 億港元，最近一個經審計財政年度收益至少 10 億港元"},{"value":"D","label":"市值至少 20 億港元，收益無最低限制"}],"answer":"B","explanation":"根據 MBLR 8.05(3) 及指南 2-49 頁 9.5(c) 節，純「市值／收益測試」要求申請人在上市時具備至少 40 億港元的預期市值，且最近一個經審計財政年度的收益不低於 5 億港元（此測試對現金流無強制要求）。","reference":"MBLR 8.05(3); HKSI Paper 5 Guide Topic 2 Section 9.5(c)"},{"id":"T2-004","topic":"Topic 2","subtopic":"GEM Quantitative Tests - Cash Flow Test","difficulty":"Level 2","question":"某小型企業計劃在聯交所 GEM 板塊上市並選擇採用「現金流測試」（Cash flow test）。根據 GEM 上市規則（GLR 11.14），該企業必須符合下列哪項財務要求？","options":[{"value":"A","label":"上市時市值至少 5,000 萬港元，前一年現金流入至少 1,000 萬港元"},{"value":"B","label":"上市時市值至少 1.5 億港元，且在刊發上市文件前兩個財政年度的日常業務營運現金淨流入合計至少 3,000 萬港元"},{"value":"C","label":"上市時市值至少 2.5 億港元，前三年現金流入合計至少 5,000 萬港元"},{"value":"D","label":"上市時市值至少 5 億港元，現金流入不限"}],"answer":"B","explanation":"根據 GLR 11.14 及指南 2-49 頁 9.6(a) 節，GEM 現金流測試要求：(1) 上市時預期市值至少 1.5 億港元；及 (2) 在緊接刊發上市文件前兩個財政年度，日常業務營運產生的正現金流入累計不少於 3,000 萬港元（在營運資金變動及已付稅項前）。","reference":"GLR 11.14; HKSI Paper 5 Guide Topic 2 Section 9.6(a)"},{"id":"T2-005","topic":"Topic 2","subtopic":"GEM Quantitative Tests - R&D Test","difficulty":"Level 3","question":"根據 GEM 最新上市架構下的「市值／收益／研發測試」（GLR 11.14），一間具備高成長潛力但未產生足夠正現金流的高新技術企業，其在研發開支及收益上的硬性指標包括：","options":[{"value":"A","label":"前兩個財政年度收益累計至少 1,000 萬港元，研發開支累計至少 500 萬港元"},{"value":"B","label":"前兩個財政年度收益累計至少 1 億港元且維持按年增長；前兩個財政年度研發開支累計至少 3,000 萬港元，且每年研發開支佔總營運開支至少 15%；上市時市值至少 2.5 億港元"},{"value":"C","label":"研發開支必須佔總資產的 50% 以上，上市時市值至少 5 億港元"},{"value":"D","label":"僅需在上市前一年投入 1,000 萬港元研發，市值至少 1 億港元"}],"answer":"B","explanation":"依據指南 2-49 至 2-50 頁 9.6(b) 節及 GLR 11.14：GEM 研發測試要求：(1) 兩年營業紀錄期且管理層維持穩定；(2) 兩年收益累計至少 1 億港元且按年增長；(3) 兩年研發開支合計至少 3,000 萬港元；(4) 每年研發開支佔總營運開支至少 15%；(5) 上市時市值至少 2.5 億港元。","reference":"GLR 11.14; HKSI Paper 5 Guide Topic 2 Section 9.6(b)"},{"id":"T2-006","topic":"Topic 2","subtopic":"Main Board vs GEM - Minimum Market Capitalisation","difficulty":"Level 1","question":"根據聯交所現行規則，新申請人在上市時的法定最低預期市值（Expected Market Capitalisation）要求，主板與 GEM 分別為：","options":[{"value":"A","label":"主板 2 億港元；GEM 1 億港元"},{"value":"B","label":"主板 5 億港元；GEM 1.5 億港元"},{"value":"C","label":"主板 10 億港元；GEM 2 億港元"},{"value":"D","label":"主板 5 億港元；GEM 5,000 萬港元"}],"answer":"B","explanation":"指南 2-47 頁 9.4(b) 節指明：新申請人於上市時的預期市值，主板最低門檻為 5 億港元（MBLR 8.09(2)）；GEM 則為至少 1.5 億港元（GLR 11.23(6)）。","reference":"MBLR 8.09(2); GLR 11.23(6); HKSI Paper 5 Guide Topic 2 Section 9.4(b)"},{"id":"T2-007","topic":"Topic 2","subtopic":"Trading Record Period - Main Board vs GEM","difficulty":"Level 1","question":"一般情況下，新上市申請人必須具備的常規營業紀錄期（Trading record period），主板與 GEM 的最低法定年限要求分別為：","options":[{"value":"A","label":"主板至少 5 個財政年度；GEM 至少 3 個財政年度"},{"value":"B","label":"主板至少 3 個財政年度；GEM 至少 2 個財政年度"},{"value":"C","label":"主板至少 2 個財政年度；GEM 至少 1 個財政年度"},{"value":"D","label":"主板與 GEM 均統一為至少 1 個財政年度"}],"answer":"B","explanation":"指南 2-46 頁 9.3(b) 節指出：主板常規要求的最低營業紀錄期為三個完整財政年度（MBLR 8.05）；GEM 則為至少兩個完整財政年度（GLR 11.12A）。特專科技或生物科技等特定板塊享有專項豁免。","reference":"MBLR 8.05; GLR 11.12A; HKSI Paper 5 Guide Topic 2 Section 9.3(b)"},{"id":"T2-008","topic":"Topic 2","subtopic":"Ownership and Management Continuity","difficulty":"Level 2","question":"對於申請主板上市的新申請人，在遵守控股股東「所有權及控制權連續性」（Ownership continuity and control）以及管理層連續性方面，聯交所的常規要求為：","options":[{"value":"A","label":"過去 3 年內所有權完全不變，管理層最近 6 個月不變"},{"value":"B","label":"至少在最近一個經審計財政年度維持所有權與控制權連續性，並在整個 3 年營業紀錄期內維持管理層連續性"},{"value":"C","label":"三年營業紀錄期內所有股東均不得轉讓任何股份"},{"value":"D","label":"全體董事在過去 5 年內不得有任何變動"}],"answer":"B","explanation":"指南 2-46 至 2-47 頁 9.3(c) 節及 MBLR 8.05 規定：常規主板申請人必須在至少最近一個財政年度具備所有權和控制權的延續性（由控股股東或單一大股東持有），並在三個財政年度的營業紀錄期內維持管理層的延續性。","reference":"MBLR 8.05; HKSI Paper 5 Guide Topic 2 Section 9.3(c)"},{"id":"T2-009","topic":"Topic 2","subtopic":"Public Float - Tiered Requirement","difficulty":"Level 3","question":"根據聯交所現行上市規則架構，關於上市時新發行人的「公眾持股量」（Public Float）最低百分比要求，下列敘述何者最正確？","options":[{"value":"A","label":"不論發行人市值多大，公眾持股量一律嚴格固定為 25%，絕無例外"},{"value":"B","label":"市值不超過 60 億港元的較小型公司，公眾持股量為 25%；若發行人市值規模極大（例如超過 300 億港元），聯交所可酌情接納較低的公眾持股百分比，最低可至 10%"},{"value":"C","label":"只要有 100 名股東持有股份，公眾持股比例可低至 1%"},{"value":"D","label":"控股股東持有的股份亦可全數計入公眾持股量"}],"answer":"B","explanation":"指南 2-47 頁 9.4(c) 節及 MBLR 8.08 指明：常規標準為 25%（適用於市值不超過 60 億港元者）；對於市值龐大的發行人（如超過 300 億港元），聯交所可依據階梯式門檻接納介乎 10% 至 25% 之間的較低公眾持股比例。","reference":"MBLR 8.08; HKSI Paper 5 Guide Topic 2 Section 9.4(c)"},{"id":"T2-010","topic":"Topic 2","subtopic":"Free Float Requirement","difficulty":"Level 2","question":"根據聯交所《上市規則》第 8.08A 條引進的「自由流通量」（Free Float）要求，新申請人在掛牌上市時，公眾持有的自由流通股份必須滿足下列哪項條件？","options":[{"value":"A","label":"佔已發行股份（不含庫存股）至少 10% 且預期市值至少 5,000 萬港元；或者預期市值至少達 6 億港元"},{"value":"B","label":"市值至少 1,000 萬港元，股數至少 100 萬股"},{"value":"C","label":"必須在掛牌當天即時全部在市場拋售完畢"},{"value":"D","label":"僅適用於創業板，主板完全豁免自由流通量規定"}],"answer":"A","explanation":"指南 2-47 頁 9.4(c) 節引述 MBLR 8.08A 規定：發行人於上市時由公眾持有並立即可供買賣的證券，必須：(i) 代表尋求上市的已發行股份至少 10% 且預期市值至少 5,000 萬港元；或 (ii) 該等證券的預期市值至少達 6 億港元。","reference":"MBLR 8.08A; HKSI Paper 5 Guide Topic 2 Section 9.4(c)"},{"id":"T2-011","topic":"Topic 2","subtopic":"Shareholder Spread - Main Board vs GEM","difficulty":"Level 1","question":"新申請人在香港掛牌上市時，必須具備足夠的股東分佈（Shareholder Spread）。主板與 GEM 要求的最低股東人數分別為：","options":[{"value":"A","label":"主板至少 1,000 人；GEM 至少 500 人"},{"value":"B","label":"主板至少 300 名股東；GEM 至少 100 名股東"},{"value":"C","label":"主板至少 100 名股東；GEM 至少 50 名股東"},{"value":"D","label":"主板至少 50 名股東；GEM 至少 20 名股東"}],"answer":"B","explanation":"指南 2-47 頁 9.4(e) 節指明：新申請上市的證券類別，主板發行人必須具備至少 300 名股東（MBLR 8.08(2)）；GEM 發行人則視乎情況，必須具備至少 100 名股東（GLR 11.23(2)）。","reference":"MBLR 8.08(2); GLR 11.23(2); HKSI Paper 5 Guide Topic 2 Section 9.4(e)"},{"id":"T2-012","topic":"Topic 2","subtopic":"Top 3 Public Shareholders Concentration Limit","difficulty":"Level 2","question":"為防止股權過度集中並確保市場具備充足流動性，聯交所主板及 GEM 規則對「三大公眾股東」（Three largest public shareholders）的持股比例設有何種上限？","options":[{"value":"A","label":"三大公眾股東實益擁有的股份不得超過公眾持股總量的 20%"},{"value":"B","label":"在上市時，三大公眾股東實益擁有的證券合計不得超過公眾持股總額的 50%"},{"value":"C","label":"三大公眾股東可合法持有公眾股的 95%"},{"value":"D","label":"三大公眾股東必須簽署一致行動協議"}],"answer":"B","explanation":"指南 2-48 頁 9.4(f) 節指明：主板（MBLR 8.08(3)）及 GEM（GLR 11.23(8)）均嚴格規定，在上市時，由三大公眾股東實益擁有的證券合計不得超過公眾持股量總額的 50%（Not more than 50% of the securities in public hands）。","reference":"MBLR 8.08(3); GLR 11.23(8); HKSI Paper 5 Guide Topic 2 Section 9.4(f)"},{"id":"T2-013","topic":"Topic 2","subtopic":"Who is Excluded from Public Float","difficulty":"Level 2","question":"根據聯交所《上市規則》第 8.24 條，在計算發行人的公眾持股量（Public float）時，下列哪一類人士持有的股份**不得**計入公眾人士持股？","options":[{"value":"A","label":"持股僅 0.05% 的無關聯散戶零售投資者"},{"value":"B","label":"發行人的「核心關連人士」（包括董事、行政總裁、大股東及其緊密聯繫人），或受發行人直接/間接資助認購股份的人士"},{"value":"C","label":"認購金額達 1 億港元但無任何董事席位的獨立養老基金"},{"value":"D","label":"透過滬港通買入該公司股份的內地合格投資者"}],"answer":"B","explanation":"指南 2-48 頁 9.4(h) 節註釋明確指出：發行人的核心關連人士（董事、行政總裁、大股東及緊密聯繫人）、直接或間接獲發行人或核心關連人士提供財務資助購買股份者、慣常聽取發行人指示者，以及庫存股份，一律不得被視為公眾人士持股。","reference":"MBLR 8.24; HKSI Paper 5 Guide Topic 2 Section 9.4(h) Note"},{"id":"T2-014","topic":"Topic 2","subtopic":"Preferential Allocation to Employees","difficulty":"Level 2","question":"在新股公開發售（IPO）中，發行人擬向其現有僱員、前僱員或其家屬提供優先配售股份。根據《上市規則》第 10.01 條，該項優先分配在比例及價格上有何法定限制？","options":[{"value":"A","label":"最多可配發發售股份的 50%，且可以市價之一折供僱員認購"},{"value":"B","label":"經聯交所批准並適當披露後，最多可將發售股份的 10% 進行優先分配（僅限分配基準優先，作價及其他條款絕不得享有折扣優惠）"},{"value":"C","label":"嚴禁向任何僱員提供任何優先認購安排"},{"value":"D","label":"優先配售無額度限制，且無須在招股書中作任何說明"}],"answer":"B","explanation":"指南 2-48 至 2-49 頁 9.4(j) 節及 2-60 頁 9.54 節指明：公開要約原則上不得提供任何優先待遇，但經聯交所預先批准並披露，發行人最多可將發售股份的 10% 以「優先基準分配」予僱員或家屬；但發行價與條款必須與公眾認購者完全相同，絕無價格折扣。","reference":"MBLR 10.01; HKSI Paper 5 Guide Topic 2 Section 9.4(j), 9.54"},{"id":"T2-015","topic":"Topic 2","subtopic":"Sponsor Coupling Requirement","difficulty":"Level 3","question":"香港聯交所主板 IPO 全面推行「保薦人兼整體協調人綑綁」（Sponsor Coupling）規定。根據《上市規則》第 3A 章及《操守準則》，該制度的核心合規要求為：","options":[{"value":"A","label":"申請人只能聘請外資投資銀行作為唯一的整體協調人"},{"value":"B","label":"在涉及建檔或配售的主板 IPO 中，發行人委聘的每一名「獨立保薦人」（Independent Sponsor），必須同時獲委任為整體協調人（Overall Coordinator），或由該獨立保薦人同集團的成員法團出任整體協調人"},{"value":"C","label":"保薦人嚴禁參與承銷團的任何簿記建檔及配售工作"},{"value":"D","label":"保薦人必須與全體承銷商承擔連帶虧損賠償"}],"answer":"B","explanation":"指南 2-11 頁 3.8–3.9 節指明：主板 IPO 實施保薦人綑綁（Sponsor coupling）制度，發行人委聘的每名獨立保薦人，必須同時獲委任為整體協調人（OC），或由其同集團公司出任 OC。獨立保薦人在接受保薦委聘前，必須確認發行人已滿足此綑綁要求。","reference":"MBLR 3A.43; Code of Conduct; HKSI Paper 5 Guide Topic 2 Section 3.8-3.9"},{"id":"T2-016","topic":"Topic 2","subtopic":"Sponsor Coupling - Termination & Two Months Moratorium","difficulty":"Level 3","question":"在主板 IPO 審核過程中，若發行人終止了唯一的獨立保薦人兼整體協調人（OC）的委任，導致保薦人綑綁要求不再被滿足。發行人委任新合資格機構後，其上市申請面臨何種程序後果？","options":[{"value":"A","label":"可以直接沿用原申請繼續推進，上市聆訊時間不受影響"},{"value":"B","label":"必須自新委任符合綑綁要求之日起計不少於兩個月（Not less than two months），方可重新提交新的上市申請"},{"value":"C","label":"該發行人被永久列入失信黑名單，終身不得在港上市"},{"value":"D","label":"僅需向聯交所繳付 10,000 港元行政罰款即可在當週掛牌"}],"answer":"B","explanation":"指南 2-11 至 2-12 頁 3.13 節明確指明：若在呈交上市申請後整體協調人遭解聘，導致不再滿足保薦人綑綁要求，發行人必須在新委任符合要求後，自委任日起計不少於 2 個月（Not less than two months）重新呈交新的上市申請。","reference":"MBLR 3A; HKSI Paper 5 Guide Topic 2 Section 3.13"},{"id":"T2-017","topic":"Topic 2","subtopic":"Compliance Adviser Appointment Period","difficulty":"Level 2","question":"根據《上市規則》第 3A.19 條，新上市公司在股票成功掛牌上市之日起，必須委聘合規顧問（Compliance Adviser）。該常規法定委聘期至少須持續至何時？","options":[{"value":"A","label":"直至上市後滿 6 個月為止"},{"value":"B","label":"至少持續至發行人刊發其上市後「首個完整財政年度」（First full financial year）的財務業績之日為止"},{"value":"C","label":"持續滿 10 年為止"},{"value":"D","label":"直至控股股東解除全部禁售期為止"}],"answer":"B","explanation":"指南 2-12 頁 3.15 節及 MBLR 3A.19（GLR 6A.19）規定：合規顧問的委聘期必須由公司股份開始上市之日起，至少持續至公司就其在上市後首個完整財政年度（First full financial year）公布財務業績之日為止。","reference":"MBLR 3A.19; GLR 6A.19; HKSI Paper 5 Guide Topic 2 Section 3.15"},{"id":"T2-018","topic":"Topic 2","subtopic":"Compliance Adviser - Independence Requirement","difficulty":"Level 2","question":"關於發行人委任的「合規顧問」（Compliance Adviser），其在獨立性方面的法定監管要求是：","options":[{"value":"A","label":"合規顧問必須符合比獨立財務顧問（IFA）更嚴格的獨立性標準，且不得為原上市保薦人"},{"value":"B","label":"合規顧問必須公正客觀地執行職務（Perform duties with impartiality），但並不被強制要求必須具備獨立性（Does not need to be independent，通常由原上市保薦人兼任）"},{"value":"C","label":"合規顧問必須由香港特區審計署官員直接擔任"},{"value":"D","label":"合規顧問必須持有發行人至少 20% 的股權"}],"answer":"B","explanation":"指南 2-12 頁 3.17 節及 MBLR 3A.25（GLR 6A.25）指出：合規顧問必須以公正客觀態度（Impartiality）履行職責，但無須具備獨立性（Does not need to be independent）。實務中絕大多數發行人直接聘用原上市保薦人擔任合規顧問。","reference":"MBLR 3A.25; GLR 6A.25; HKSI Paper 5 Guide Topic 2 Section 3.17"},{"id":"T2-019","topic":"Topic 2","subtopic":"Board Composition - INED Minimum Ratio","difficulty":"Level 2","question":"根據主板上市規則第 3.10 條及第 3.10A 條，上市發行人董事會中獨立非執行董事（INEDs）的人數與比例必須同時符合下列哪項標準？","options":[{"value":"A","label":"至少 1 名 INED，且佔董事會至少 10%"},{"value":"B","label":"至少 3 名 INED，且 INED 必須佔董事會成員總數至少三分之一（At least one-third of the board）"},{"value":"C","label":"至少 5 名 INED，且必須過半數"},{"value":"D","label":"至少 2 名 INED，且比例無限制"}],"answer":"B","explanation":"指南 2-15 頁 3.27 節指明：發行人董事會必須委任至少 3 名獨立非執行董事（INEDs），且 INED 所佔人數比例必須至少達到董事會全體成員的三分之一（MBLR 3.10, 3.10A）。","reference":"MBLR 3.10, 3.10A; HKSI Paper 5 Guide Topic 2 Section 3.27"},{"id":"T2-020","topic":"Topic 2","subtopic":"INED Qualifications - Financial Expertise","difficulty":"Level 1","question":"根據《上市規則》第 3.10(2) 條，在發行人董事會全體獨立非執行董事中，至少有幾名 INED 必須具備適當的專業資格或會計／相關財務管理專長？","options":[{"value":"A","label":"至少一名（At least one）"},{"value":"B","label":"全體獨立非執行董事均必須具備"},{"value":"C","label":"至少兩名"},{"value":"D","label":"無須任何一名具備，只要聘請外部審計師即可"}],"answer":"A","explanation":"指南 2-15 頁 3.27 節明確指明：在至少 3 名獨立非執行董事中，必須至少有一名（At least one）獨立非執董具備適當的專業資格，或具備適當的會計或相關財務管理專長（MBLR 3.10(2)）。","reference":"MBLR 3.10(2); HKSI Paper 5 Guide Topic 2 Section 3.27"},{"id":"T2-021","topic":"Topic 2","subtopic":"INED Independence Criteria - Shareholding Ceiling","difficulty":"Level 2","question":"根據《上市規則》第 3.13 條評定獨立性因素時，若一名獲提名的獨立非執行董事候選人持有發行人已發行股份（不含庫存股）達到多少比例時，其獨立性通常會直接被聯交所質疑或否定？","options":[{"value":"A","label":"持有超過 0.1%"},{"value":"B","label":"持有超過發行人已發行股份的 1%（若持股達 5% 或以上，通常絕不被視為獨立）"},{"value":"C","label":"持有超過 10%"},{"value":"D","label":"持有超過 30%"}],"answer":"B","explanation":"指南 2-16 頁 3.30(a) 節及 MBLR 3.13(1) 指出：若擬任 INED 持有發行人超過 1% 的股份，其獨立性即可能受到質疑；若持股達到 5% 或以上，聯交所通常斷定其不具備獨立性。","reference":"MBLR 3.13(1); HKSI Paper 5 Guide Topic 2 Section 3.30(a)"},{"id":"T2-022","topic":"Topic 2","subtopic":"INED Cooling-off Period - Professional Advisers","difficulty":"Level 2","question":"某會計師事務所過去一直為某擬上市公司提供日常審計與稅務諮詢服務。該會計師事務所的一位前合夥人擬出任該上市公司的獨立非執行董事。根據《上市規則》第 3.13(3) 條，該人士自終止合夥人身份或停止提供服務起，須度過多長的冷卻期（Cooling-off period）方可被視為獨立？","options":[{"value":"A","label":"6 個月"},{"value":"B","label":"2 年（Two years immediately prior to the date of proposed appointment）"},{"value":"C","label":"5 年"},{"value":"D","label":"終身不得出任"}],"answer":"B","explanation":"指南 2-16 頁 3.30(c) 節及 MBLR 3.13(3) 規定：若該人士在擬獲委任日期前兩年內（Within two years），曾為該發行人、母公司、附屬公司或核心關連人士提供專業服務的專業顧問機構擔任董事、合夥人或僱員，其獨立性將受否定。","reference":"MBLR 3.13(3); HKSI Paper 5 Guide Topic 2 Section 3.30(c)"},{"id":"T2-023","topic":"Topic 2","subtopic":"Definition of Controlling Shareholder","difficulty":"Level 2","question":"根據香港聯交所《上市規則》第 1.01 條，「控股股東」（Controlling Shareholder）的法定門檻定義為：","options":[{"value":"A","label":"任何單獨或共同有權行使或控制行使 5% 或以上表決權的人士"},{"value":"B","label":"任何有權行使或控制行使發行人 30% 或以上有表決權股份（不含庫存股）的人士，或有權控制發行人董事會過半數成員組成的人士"},{"value":"C","label":"任何持有公司 50% 以上股權並全權兼任董事長的人士"},{"value":"D","label":"公司創辦人及其直系親屬，不論其持股比例多寡"}],"answer":"B","explanation":"指南 2-18 頁 3.40 節及 MBLR 1.01 明確指出：控股股東是指任何有權行使、或控制行使發行人 30% 或以上投票權（不計庫存股份）的人士或一組人士，或能夠控制董事會過半數組成的人士。","reference":"MBLR 1.01; HKSI Paper 5 Guide Topic 2 Section 3.40"},{"id":"T2-024","topic":"Topic 2","subtopic":"Controlling Shareholder Lock-up Periods","difficulty":"Level 2","question":"根據主板上市規則第 10.07 條，在新上市發行人股份掛牌交易後，其控股股東所受到的法定禁售期（Lock-up Period）限制為：","options":[{"value":"A","label":"掛牌後 3 年內一股不得減持"},{"value":"B","label":"在上市首 6 個月內不得處置任何股份；在隨後的第 2 個 6 個月內，不得處置股份以致其不再成為控股股東（失去 30% 控制地位）"},{"value":"C","label":"上市首 12 個月內可隨意套現全部持股"},{"value":"D","label":"只要獲得保薦人書面同意，首日掛牌即可全數清倉"}],"answer":"B","explanation":"指南 2-18 頁 3.40 節註釋及 MBLR 10.07 指明：控股股東禁售期分為兩階段：首 6 個月全面禁售（不得出售任何權益）；次 6 個月相對禁售（出售後不得喪失控股股東地位，即持股不得跌破 30% 或喪失控制權）。","reference":"MBLR 10.07; HKSI Paper 5 Guide Topic 2 Section 3.40 Note"},{"id":"T2-025","topic":"Topic 2","subtopic":"Authorised Representatives - Main Board vs GEM","difficulty":"Level 2","question":"上市發行人必須委派兩名「授權代表」（Authorised Representatives）作為與聯交所溝通的主要聯絡人。主板與 GEM 對授權代表人選的要求為：","options":[{"value":"A","label":"主板：兩名董事，或一名董事與公司秘書；GEM：必須從執行董事及公司秘書中委任兩名個人"},{"value":"B","label":"主板必須由兩名獨立非執董擔任；GEM 必須由外聘法律顧問擔任"},{"value":"C","label":"主板及 GEM 均必須由全職保薦人代表長期擔任"},{"value":"D","label":"主板：外聘會計師與董事長；GEM：由總裁一人獨任"}],"answer":"A","explanation":"指南 2-19 頁 3.44 節指明：主板授權代表必須為兩名董事，或一名董事聯同公司秘書（MBLR 3.05）；GEM 則必須從執行董事與公司秘書中委派兩名個人出任（GLR 5.24）。","reference":"MBLR 3.05; GLR 5.24; HKSI Paper 5 Guide Topic 2 Section 3.44"},{"id":"T2-026","topic":"Topic 2","subtopic":"Company Secretary Qualifications","difficulty":"Level 2","question":"根據主板上市規則第 3.28 條，發行人委任的公司秘書（Company Secretary）必須具備聯交所認可的學術或專業資格，下列哪一項屬於法定自動認可資格之一？","options":[{"value":"A","label":"具備特許金融分析師（CFA）持證人資格"},{"value":"B","label":"香港公司治理公會（HKCGI）會員、香港執業律師／大律師、或香港會計師公會（HKICPA）認可的執業會計師"},{"value":"C","label":"持有全日制金融學學士學位"},{"value":"D","label":"在香港銀行業擔任分行行長滿 3 年"}],"answer":"B","explanation":"指南 2-20 至 2-21 頁 3.53 節及 MBLR 3.28 明確規定，公司秘書認可專業資格為：(1) 香港公司治理公會會員；(2) 香港律師或大律師；或 (3) 執業會計師（CPA）；或具備聯交所認可的相關經驗。","reference":"MBLR 3.28; HKSI Paper 5 Guide Topic 2 Section 3.53"},{"id":"T2-027","topic":"Topic 2","subtopic":"Company Secretary - Annual Training Hours","difficulty":"Level 1","question":"根據《上市規則》第 3.29 條，上市發行人的公司秘書在每個財政年度內，必須完成不少於多少小時的相關專業培訓？","options":[{"value":"A","label":"不少於 5 小時"},{"value":"B","label":"不少於 15 小時（No less than 15 hours）"},{"value":"C","label":"不少於 30 小時"},{"value":"D","label":"不少於 60 小時"}],"answer":"B","explanation":"指南 2-21 頁 3.56 節及 MBLR 3.29 規定：發行人的公司秘書在每個財政年度內，必須接受不少於 15 個小時的相關專業培訓（Relevant professional training）。","reference":"MBLR 3.29; HKSI Paper 5 Guide Topic 2 Section 3.56"},{"id":"T2-028","topic":"Topic 2","subtopic":"Removal of Auditors - Circular and Representation","difficulty":"Level 2","question":"根據《上市規則》第 13.88 條，上市發行人若擬在核數師任期屆滿前將其解聘（Removal of auditor），發行人必須履行下列哪項法定程序？","options":[{"value":"A","label":"只需由行政總裁直接發出電郵解約，毋須召開股東大會"},{"value":"B","label":"必須經股東大會通過決議案批准；且在股東大會舉行前至少 10 個營業日向全體股東印發通函，並允許該核數師出席大會進行陳述"},{"value":"C","label":"必須強制提呈香港廉政公署調查存案"},{"value":"D","label":"只要獲得聯交所口頭同意即可在翌日撤換"}],"answer":"B","explanation":"指南 2-21 頁 3.57 節指出：在任期屆滿前罷免核數師，必須經股東大會決議案批准；載有罷免建議及核數師書面申述的通函，必須在股東大會前至少 10 個營業日寄發予股東，並准許該核數師出席大會發言。","reference":"MBLR 13.88; HKSI Paper 5 Guide Topic 2 Section 3.57"},{"id":"T2-029","topic":"Topic 2","subtopic":"Share Repurchases - Explanatory Statement Contents","difficulty":"Level 3","question":"根據《上市規則》第 10.06(1)(b) 條，上市發行人若擬尋求股東批准購回本身股份的一般性授權，必須向股東寄發說明函件（Explanatory Statement）。該函件必須載有下列哪項關鍵資訊？","options":[{"value":"A","label":"全體非執行董事家庭住址"},{"value":"B","label":"擬購回股份總數、購回理由、資金來源、對營運資金的重大不利影響、過去 12 個月內該股份在聯交所交易的最高及最低價格，以及購回股份擬註銷或作為庫存股持有的意圖"},{"value":"C","label":"保證股價在購回後上漲 100% 的董事會書面擔保"},{"value":"D","label":"所有債權人簽署的免除債務確認書"}],"answer":"B","explanation":"指南 2-24 至 2-25 頁 5.5 節詳述說明函件必備內容：購回股份上限、理由、資金來源、對營運資金或資產負債比率之影響、董事意向、過去 12 個月按月最高/最低市價，以及購回後擬註銷或持作庫存股之意向。","reference":"MBLR 10.06(1)(b); HKSI Paper 5 Guide Topic 2 Section 5.5"},{"id":"T2-030","topic":"Topic 2","subtopic":"Share Repurchases - 5% Price Cap Rule","difficulty":"Level 2","question":"根據《上市規則》第 10.06(2)(a) 條，上市發行人在聯交所場內進行股份購回時，在買入作價上受到何種最高價格限制？","options":[{"value":"A","label":"購回價不得高於當日開盤價的 10%"},{"value":"B","label":"購回價不得高於該股份在之前 5 個交易日平均收市價的 5% 或以上（Not higher by 5% or more than the average closing market price for the 5 preceding trading days）"},{"value":"C","label":"必須嚴格等於每股資產淨值（NAV）"},{"value":"D","label":"無作價限制，可由董事會任意出價"}],"answer":"B","explanation":"指南 2-25 頁 5.6(a) 節及 MBLR 10.06(2)(a) 指明：發行人在場內回購股份時，若購買價較該股份在之前 5 個交易日的平均收市價高出 5% 或以上，則不得進行購回。","reference":"MBLR 10.06(2)(a); HKSI Paper 5 Guide Topic 2 Section 5.6(a)"},{"id":"T2-031","topic":"Topic 2","subtopic":"Share Repurchases - Blackout Period Restrictions","difficulty":"Level 2","question":"根據《上市規則》第 10.06(2)(e) 條，發行人在下列哪一特定期間內，嚴禁在聯交所場內購回其本身的任何股份？","options":[{"value":"A","label":"在董事會批准任何年度、半年度或季度業績會議召開日前 30 天起，至公布業績當日止的期間內"},{"value":"B","label":"在公司股價跌破發行價的任何營業日"},{"value":"C","label":"在每年 12 月最後一個交易日"},{"value":"D","label":"在控股股東離境度假期間"}],"answer":"A","explanation":"指南 2-25 頁 5.6(e) 節及 MBLR 10.06(2)(e) 規定：在擁有內幕消息時，或在董事會通過業績會議之日前 30 天內（或刊發業績期限，以較早者為準）至公布業績當日止，嚴禁回購本身股份。","reference":"MBLR 10.06(2)(e); HKSI Paper 5 Guide Topic 2 Section 5.6(e)"},{"id":"T2-032","topic":"Topic 2","subtopic":"Core Shareholder Protection Standards (Appendix A1)","difficulty":"Level 2","question":"香港聯交所《上市規則》附錄 A1（Appendix A1）載列了適用於所有發行人（無論是在香港、百慕達、開曼群島或中國內地註冊成立）的核心股東保障基準。下列哪一項屬於該附錄所規定的核心基準？","options":[{"value":"A","label":"全體海外公司股東必須親身前往香港登記處現場領取實物股票"},{"value":"B","label":"發行人必須以普通決議案（過半數）通過即可罷免任何董事、必須以特別決議案（75%）修訂憲制文件，且香港結算（HKSCC）有權委派多於一名代表出席股東大會"},{"value":"C","label":"控股股東有權在股東大會上否決全體公眾股東的發言權"},{"value":"D","label":"發行人每年必須派發不低於利潤 90% 的股息"}],"answer":"B","explanation":"指南 2-28 頁 6.2 節及 MBLR Appendix A1 規範了核心股東保障：包括普通決議案罷免董事、特別決議案修訂章程、委聘/罷免核數師之股東大會權限，以及 HKSCC 委派代表或受委代表行使表決權的權利。","reference":"MBLR Appendix A1; HKSI Paper 5 Guide Topic 2 Section 6.2"},{"id":"T2-033","topic":"Topic 2","subtopic":"PRC Issuers - Service of Process Agent in Hong Kong","difficulty":"Level 1","question":"根據《上市規則》第 19A.13 條，在中國內地註冊成立並在香港發行 H 股的上市公司，在整個上市存續期內必須維持何種本地代理人安排？","options":[{"value":"A","label":"在香港維持一名全職常駐的首席執行官"},{"value":"B","label":"委任並隨時維持一名獲授權代表其在香港接受法律程序文件及通知送達的代理人（Service of process agent）"},{"value":"C","label":"將全部固定資產存管於香港最高法院"},{"value":"D","label":"由香港律政司派員入駐董事會"}],"answer":"B","explanation":"指南 2-29 頁 6.9 節及 MBLR 19A.13 明確指出：PRC 發行人（H 股公司）在上市期間，必須隨時委聘並維持一名獲授權在香港代其接受法律程序文件與通知的人士（Person authorised to accept service of process）。","reference":"MBLR 19A.13; HKSI Paper 5 Guide Topic 2 Section 6.9"},{"id":"T2-034","topic":"Topic 2","subtopic":"PRC Issuers - Accounting Standards Permitted","difficulty":"Level 2","question":"根據主板上市規則第 19A.10 條，在聯交所上市的中國內地註冊發行人（PRC Issuers），其會計師報告除香港財務報告準則（HKFRS）及國際財務報告準則（IFRS）外，亦可採用下列哪種準則編制？","options":[{"value":"A","label":"美國公認會計原則（US GAAP）"},{"value":"B","label":"中國企業會計準則（China Accounting Standards for Business Enterprises, CASBE）"},{"value":"C","label":"日本會計準則（J-GAAP）"},{"value":"D","label":"英國本地會計準則（UK GAAP）"}],"answer":"B","explanation":"指南 2-29 頁 6.7 節及 MBLR 19A.10 規定：PRC 發行人的會計師報告必須符合與香港相當之準則，但聯交所正式認可其採用中國企業會計準則（CASBE）編制財務報表，並由獲財政部及證監會認可的內地執業會計師事務所審計。","reference":"MBLR 19A.10; HKSI Paper 5 Guide Topic 2 Section 6.7"},{"id":"T2-035","topic":"Topic 2","subtopic":"PRC Issuers - CSRC Filing Notification","difficulty":"Level 2","question":"根據境內企業境外上市備案新制及《上市規則》第 9.11(23b) 條，內地企業向聯交所遞交主板上市聆訊前，必須提交下列哪項監管證明文件？","options":[{"value":"A","label":"國家商務部發出的外匯保證金收據"},{"value":"B","label":"中國證監會（CSRC）發出的完成境外發行上市備案程序的通知書副本（Notification on completion of PRC filing procedures）"},{"value":"C","label":"上海證券交易所簽發的免審批批覆"},{"value":"D","label":"全體內地職工大會的公證書"}],"answer":"B","explanation":"指南 2-30 頁 6.11(a) 節及 2-59 頁 9.48(d) 節指明：凡受 CSRC 境外上市備案新規管轄的申請人，在上市委員會聆訊前至少四個淨營業日，必須向聯交所呈交 CSRC 發出的完成境內備案程序的備案通知書副本。","reference":"MBLR 9.11(23b); HKSI Paper 5 Guide Topic 2 Section 6.11(a), 9.48(d)"},{"id":"T2-036","topic":"Topic 2","subtopic":"Prospectus - Professional Investors Exemption","difficulty":"Level 2","question":"根據 CWUMPO 附表 17（Seventeenth Schedule），某非上市公司若擬在香港發售其債權證或股權，但在要約發出時僅限於向特定人士發售。下列哪類要約完全法定豁免遵守招股章程登記要求？","options":[{"value":"A","label":"向全港所有退休公務員發出的認購要約"},{"value":"B","label":"專門僅向符合 SFO 定義的「專業投資者」（Professional Investors, PIs）發出的要約"},{"value":"C","label":"透過報刊廣告向隨機 500 名香港居民發出的要約"},{"value":"D","label":"向持牌保險代理人名下所有客戶發出的要約"}],"answer":"B","explanation":"指南 2-31 頁 7.2 節及 CWUMPO 附表 17 指出：向符合 SFO 附表 1 界定的「專業投資者」（PIs）發出的要約，屬於招股章程制度的安全港豁免項目之一，不被視為向公眾發售，無須登記招股章程。","reference":"CWUMPO 17th Schedule; SFO Schedule 1; HKSI Paper 5 Guide Topic 2 Section 7.2"},{"id":"T2-037","topic":"Topic 2","subtopic":"Prospectus Liability - Expert Consent (CWUMPO)","difficulty":"Level 3","question":"根據 CWUMPO 第 38C 條、第 40 條及第 342B 條，招股章程中若載有專家（如保薦人意見、申報會計師報告或物業估值師報告）的陳述，該專家承擔何種法律責任？","options":[{"value":"A","label":"專家自動對整份招股章程中的所有商業章節承擔無限制連帶刑事責任"},{"value":"B","label":"專家必須在章程刊發前書面同意載入其報告且未撤回同意，但專家僅對其自身作為專家所作出的陳述／報告部分承擔責任，不對非其出具的其他失實陳述自動負責"},{"value":"C","label":"只要收取了專業服務費，專家完全享有法定免責權"},{"value":"D","label":"專家報告只能作為私人備忘錄，不得正式載入章程"}],"answer":"B","explanation":"指南 2-33 頁 7.21 節及 CWUMPO ss. 38C, 40(1) 指出：專家必須事先出具書面同意書且未撤回同意；專家僅就招股章程中作為其自身報告或陳述的內容承擔失實陳述責任，對招股章程其他未經其背書的內容不自動承擔責任。","reference":"CWUMPO ss. 38C, 40(1), 342B; HKSI Paper 5 Guide Topic 2 Section 7.21"},{"id":"T2-038","topic":"Topic 2","subtopic":"Methods of Listing - Offer for Subscription vs Offer for Sale","difficulty":"Level 2","question":"在香港 IPO 發售模式中，「發售認購」（Offer for subscription）與「發售現股」（Offer for sale）的核心商業與法律區別為：","options":[{"value":"A","label":"發售認購由發行人發售其本身的新證券以募集新資金；發售現股由現有股東發售其已發行股份，發行人本身無法籌得任何新資本"},{"value":"B","label":"發售現股由交易所直接包銷，發售認購由證監會包銷"},{"value":"C","label":"發售認購無須刊發招股章程，發售現股必須刊發"},{"value":"D","label":"發售現股僅能在 GEM 板塊進行"}],"answer":"A","explanation":"指南 2-38 頁 8.4–8.7 節指明：發售認購（MBLR 7.02）是由發行人發行新股，籌得的資金歸發行人所有；發售現股（MBLR 7.06）由現有股東出售老股，資金歸出售股東所有，發行人本身不籌集任何新資金。","reference":"MBLR 7.02, 7.06; HKSI Paper 5 Guide Topic 2 Section 8.4-8.7"},{"id":"T2-039","topic":"Topic 2","subtopic":"Methods of Listing - Placing Restrictions (Connected Clients)","difficulty":"Level 3","question":"根據主板上市規則附錄 F1（Appendix F1 配售指引），在上市配售過程中，嚴禁將配售股份分配予下列哪一類對象？","options":[{"value":"A","label":"未持有公司任何股份的獨立海外機構基金"},{"value":"B","label":"發行人的董事或現有股東（及其緊密聯繫人）、未披露真實實益擁有人名稱的代名人公司、以及承銷商／整體協調人的「關連客戶」（Connected clients）"},{"value":"C","label":"合格境外機構投資者（QFII）"},{"value":"D","label":"持有香港身份證的普通專業投資者"}],"answer":"B","explanation":"指南 2-39 頁 8.12 節及 MBLR Appendix F1 明確禁止向以下人士配售：(a) 董事、現有股東或其緊密聯繫人；(b) 未披露背後實益擁有人的代名人；(c) 整體協調人、承銷辛迪加成員或分銷商的關連客戶（如僱員、董事、同集團實體等）。","reference":"MBLR Appendix F1; HKSI Paper 5 Guide Topic 2 Section 8.12"},{"id":"T2-040","topic":"Topic 2","subtopic":"Methods of Listing - Introduction","difficulty":"Level 2","question":"以「介紹形式」（Introduction）申請在聯交所上市，其顯著特徵是該證券在上市時不涉及任何新資金籌集。下列哪種場景最常適用以介紹形式上市？","options":[{"value":"A","label":"一間剛成立且完全無任何股東的初創企業"},{"value":"B","label":"該等證券已在另一認可交易所上市、或由某上市公司將其附屬公司股份實物分派（Distribution in specie）予現有股東、或透過成立新控股公司換股上市"},{"value":"C","label":"發行人擬透過公開市場向散戶大額集資 50 億港元"},{"value":"D","label":"發行人的股權高度集中在兩名個人手中且流動性極低"}],"answer":"B","explanation":"指南 2-39 至 2-40 頁 8.15–8.16 節及 MBLR 7.13 指出：介紹形式適用於證券已廣泛分佈、具備充足市場流通性的情形，不涉及新集資。典型場景為：(a) 已在其他交易所上市；(b) 實物分派現有上市證券；(c) 設立控股公司進行股權交換。","reference":"MBLR 7.13; HKSI Paper 5 Guide Topic 2 Section 8.15-8.16"},{"id":"T2-041","topic":"Topic 2","subtopic":"Anti-dilution Rules - 25% Theoretical Dilution Limit","difficulty":"Level 3","question":"根據《上市規則》第 7.27B 條之防稀釋規定，上市發行人不得進行特別授權配股、供股或公開發售，若該交易在過去 12 個月內連同其他集資活動累計會導致：","options":[{"value":"A","label":"控股股東持股量下降超過 5%"},{"value":"B","label":"發行人的股份價格出現 25% 或以上的理論稀釋效應（Theoretical dilution of 25% or more）"},{"value":"C","label":"每股資產淨值下降超過 10%"},{"value":"D","label":"公眾持股比例上升至 50% 以上"}],"answer":"B","explanation":"指南 2-41 頁 8.25 節及 MBLR 7.27B 明確規定：發行人不得進行特定授權配售、供股或公開發售，若該提議連同前 12 個月內的其他股本發行，合計會導致發行人股價出現 25% 或以上的理論稀釋效應（除非具備特殊情況，如陷入財務困境的救援方案）。","reference":"MBLR 7.27B; HKSI Paper 5 Guide Topic 2 Section 8.25"},{"id":"T2-042","topic":"Topic 2","subtopic":"Rights Issue & Open Offer - Controlling Shareholders Abstention","difficulty":"Level 2","question":"當上市發行人擬進行大規模供股（Rights issue）或公開發售（Open offer）且未被防稀釋規則直接禁止時，在提呈股東大會批准的表決安排上：","options":[{"value":"A","label":"控股股東有權全數行使表決權支持該方案"},{"value":"B","label":"控股股東及其聯繫人必須放棄表決贊成該決議案（Abstain from voting in favour）；若無控股股東，則執行董事及行政總裁必須放棄贊成表決"},{"value":"C","label":"全體公眾散戶股東嚴禁參與投票"},{"value":"D","label":"決議案只需經董事會一致同意，無須任何股東大會"}],"answer":"B","explanation":"指南 2-41 至 2-42 頁 8.27 節指明：供股或公開發售若須經股東大會批准，控股股東及其聯繫人必須放棄表決贊成該決議案（若無控股股東，則董事及最高行政人員須放棄投票贊成），以確保獨立少數股東的表決權。","reference":"MBLR 7.19A, 7.24A; HKSI Paper 5 Guide Topic 2 Section 8.27"},{"id":"T2-043","topic":"Topic 2","subtopic":"Transfer from GEM to Main Board - Streamlined Transfer","difficulty":"Level 3","question":"根據主板上市規則第 9B 章，一間合資格 GEM 發行人若擬透過「簡化機制」（Streamlined transfer）轉移至主板上市，其必須符合下列哪組特定標準？","options":[{"value":"A","label":"在 GEM 上市滿 1 年，且過去 1 年無虧損紀錄"},{"value":"B","label":"在 GEM 上市滿 3 個完整財政年度、三年內所有權與主營業務無根本改變、符合成交量加權平均市值要求，且在申請前 250 個交易日的參考期內，至少 50% 的交易日每日成交額達 50,000 港元或以上"},{"value":"C","label":"無須任何交易量要求，只要獲得聯交所行政總裁特批即可"},{"value":"D","label":"市值必須達到 100 億港元以上"}],"answer":"B","explanation":"指南 2-43 頁 8.36 節及 MBLR Chapter 9B 規定簡化轉板要件：(1) 在 GEM 上市滿 3 個完整財政年度；(2) 滿意成交量加權平均市值；(3) 3 年內所有權控制權連續且無主業根本改變；(4) 250 個交易日參考期內，至少 50% 交易日的每日成交額不低於 50,000 港元。","reference":"MBLR Chapter 9B; HKSI Paper 5 Guide Topic 2 Section 8.36"},{"id":"T2-044","topic":"Topic 2","subtopic":"Streamlined Transfer - Exemption from Sponsor","difficulty":"Level 2","question":"合資格 GEM 發行人若完全符合 MBLR 第 9B 章簡化機制的要求轉移至主板上市，其可享受下列哪項重大監管豁免？","options":[{"value":"A","label":"完全免除繳納任何主板上市年費"},{"value":"B","label":"獲豁免委任上市保薦人（Sponsor）及整體協調人（OC），且獲豁免刊發招股章程標準的上市文件（Exempt from publishing listing documents and prospectuses）"},{"value":"C","label":"在主板上市後永久免除公布任何季度或年度業績"},{"value":"D","label":"獲豁免遵守香港任何反洗錢法規"}],"answer":"B","explanation":"指南 2-44 頁 8.37 節指明：符合條件的合資格發行人透過簡化機制轉板，可獲豁免委任保薦人及保薦人整體協調人，並獲豁免遵守有關申請程序及刊發上市文件或招股章程的要求（僅需刊登符合規定的公告）。","reference":"MBLR 9B; HKSI Paper 5 Guide Topic 2 Section 8.37"},{"id":"T2-045","topic":"Topic 2","subtopic":"Application Proof - Moratorium on Returned Applications","difficulty":"Level 3","question":"根據主板上市規則第 9.03 條，若聯交所上市科審閱新申請人提交的上市申請版本（Application Proof）後，認為該版本「並非大致完備」（Not substantially complete）而退回申請，申請人將面臨何種法規後果？","options":[{"value":"A","label":"發行人在 24 小時內補交資料後即可重啟審批"},{"value":"B","label":"施加為期 8 個星期的法定暫停期（8-week moratorium），期間不得重新呈交申請，且聯交所可在其網站上公開披露該保薦人的名稱"},{"value":"C","label":"保薦人的第 6 類牌照自動永久吊銷"},{"value":"D","label":"申請人全體股東的所有個人銀行賬戶被凍結"}],"answer":"B","explanation":"指南 2-57 頁 9.43 節及 MBLR 9.03(3) 規定：若上市文件申請版本被退回，申請人須承擔 8 個星期的重新呈交暫停期（8-week moratorium），且聯交所會公開退回名單並披露保薦人名稱，對保薦人聲譽構成重大打擊。","reference":"MBLR 9.03(3); HKSI Paper 5 Guide Topic 2 Section 9.43"},{"id":"T2-046","topic":"Topic 2","subtopic":"Application Lapse Period (6 Months)","difficulty":"Level 2","question":"根據主板上市規則第 9.03 條，新申請人在提交 Form A1 表格後，若自呈交之日起超過多少個月仍未完成上市程序，該上市申請將被視為自動失效（Lapsed）？","options":[{"value":"A","label":"超過 3 個月"},{"value":"B","label":"超過 6 個月（More than 6 months）"},{"value":"C","label":"超過 12 個月"},{"value":"D","label":"超過 24 個月"}],"answer":"B","explanation":"指南 2-58 頁 9.46 節及 MBLR 9.03 指明：自提交 Form A1 起若超過 6 個月未完成上市，申請自動失效（Lapsed）；若擬重啟，必須重新提交 Form A1 並再次繳納上市首次費用。","reference":"MBLR 9.03; HKSI Paper 5 Guide Topic 2 Section 9.46"},{"id":"T2-047","topic":"Topic 2","subtopic":"FINI Platform (Fast Interface for New Issuance)","difficulty":"Level 2","question":"香港中央結算有限公司全面推行 FINI（Fast Interface for New Issuance）網上平台。在新股發售與上市流程中，FINI 平台的強制適用範圍與主要功能是：","options":[{"value":"A","label":"僅供零售散戶實時買賣二手股票"},{"value":"B","label":"作為所有新上市股份接納買賣的強制性線上平台，集中收集及處理新股認購資訊、監控重複申請，並大幅將新股定價至上市的時間縮短至 T+2"},{"value":"C","label":"專門用於上市公司刊發所有年度股息支票"},{"value":"D","label":"用於取代高等法院審理清盤案件的網上法庭系統"}],"answer":"B","explanation":"指南 2-59 頁 9.50 節註釋指明：FINI 是香港結算營運的強制性平台，所有新股上市均須透過該平台處理認購資料收集、防範重複認購、結算及上市程序，顯著壓縮新股發行至掛牌的時間跨度。","reference":"HKSI Paper 5 Guide Topic 2 Section 9.50 Note"},{"id":"T2-048","topic":"Topic 2","subtopic":"Profit Forecast in Prospectus - Sponsor Duty","difficulty":"Level 3","question":"根據主板上市規則第 11.17 條至第 11.19 條，若新上市發行人在招股章程中載列盈利預測（Profit Forecast），保薦人負有何種特定報告義務？","options":[{"value":"A","label":"保薦人必須以自身資本對該盈利預測金額進行全額兜底擔保"},{"value":"B","label":"保薦人必須出具報告，明確說明其已審查該預測，並信納該盈利預測是董事經審慎周詳查詢後（Made by directors after due care and careful enquiry）作出的"},{"value":"C","label":"保薦人無須出具任何報告，僅需申報會計師審查計算公式即可"},{"value":"D","label":"保薦人必須要求發行人將未來三年利潤全數存入託管戶口"}],"answer":"B","explanation":"指南 2-61 頁 9.62 節及 MBLR 11.17–11.19 規定：招股書載有盈利預測時，申報會計師須審閱會計政策及計算；保薦人亦必須出具報告，確認其信納董事是在作出盡職及審慎查詢後（Due care and careful enquiry）方作出該項預測。","reference":"MBLR 11.17-11.19; HKSI Paper 5 Guide Topic 2 Section 9.62"},{"id":"T2-049","topic":"Topic 2","subtopic":"Post Hearing Information Pack (PHIP)","difficulty":"Level 2","question":"根據聯交所上市程序，關於「聆訊後資料集」（Post Hearing Information Pack, PHIP）的公開發布時間要求，下列何者正確？","options":[{"value":"A","label":"必須在上市掛牌後 30 天方可刊登"},{"value":"B","label":"在通過上市委員會聆訊後，且不得遲於向機構投資者開始進行簿記建檔（Book-building）之時，必須在聯交所披露易網站發布 PHIP"},{"value":"C","label":"PHIP 僅需在發行人辦公大樓公告欄張貼"},{"value":"D","label":"若集資額低於 10 億港元則永久免除發布 PHIP"}],"answer":"B","explanation":"指南 2-62 頁 9.71 節指明：申請人在通過上市聆訊後，不得遲於向機構投資者展開簿記建檔之時（No later than the start of institutional book-building），必須在香港交易所網站刊登近乎定稿的上市文件（即 PHIP）。","reference":"MBLR; HKSI Paper 5 Guide Topic 2 Section 9.71"},{"id":"T2-050","topic":"Topic 2","subtopic":"Hong Kong Depositary Receipts (HDRs) - GEM Restriction","difficulty":"Level 1","question":"根據香港聯交所《上市規則》第 19B 章，關於香港預託證券（HDRs）的上市板塊安排，下列敘述何者正確？","options":[{"value":"A","label":"HDR 僅能在 GEM 上市，嚴禁在主板掛牌"},{"value":"B","label":"海外發行人可申請將 HDR 在聯交所主板掛牌交易，但 GEM 板塊完全不設有發行 HDR 的任何條文（No provision for listing of HDRs on GEM）"},{"value":"C","label":"HDR 可以在主板及 GEM 自由跨板雙重上市"},{"value":"D","label":"HDR 僅能以非上市私募形式流轉"}],"answer":"B","explanation":"指南 2-62 頁 9.72 節註釋指明：主板第 19B 章載有香港預託證券（HDRs）架構，允許合資格海外企業發行 HDR 掛牌；但 GEM 規則並無預託證券的上市條文，因此 HDR 不得在 GEM 上市。","reference":"MBLR Chapter 19B; HKSI Paper 5 Guide Topic 2 Section 9.72"},{"id":"T2-051","topic":"Topic 2","subtopic":"Biotech Companies (Chapter 18A) - Minimum Market Capitalisation","difficulty":"Level 1","question":"根據主板上市規則第 18A 章，未有收益或盈利的生物科技公司（Biotech Company）申請在聯交所主板上市時，其在上市時的最低預期市值要求為：","options":[{"value":"A","label":"至少 5 億港元"},{"value":"B","label":"至少 10 億港元"},{"value":"C","label":"至少 15 億港元（At least HK$1.5 billion）"},{"value":"D","label":"至少 40 億港元"}],"answer":"C","explanation":"依據 MBLR 18A.03 及指南 2-50 頁 9.10 節，生物科技公司獲豁免一般財務資格測試，但上市時的預期市值必須至少達到 15 億港元（At least HK$1.5 billion）。","reference":"MBLR 18A.03; HKSI Paper 5 Guide Topic 2 Section 9.10"},{"id":"T2-052","topic":"Topic 2","subtopic":"Biotech Companies - Working Capital Requirement","difficulty":"Level 2","question":"根據主板上市規則第 18A 章，生物科技新申請人必須具備充足的營運資金。該營運資金必須足以應付自刊發上市文件之日起計至少 12 個月內集團成本的多少比例？","options":[{"value":"A","label":"至少 100%"},{"value":"B","label":"至少 125%（At least 125% of the group's costs）"},{"value":"C","label":"至少 150%"},{"value":"D","label":"至少 200%"}],"answer":"B","explanation":"指南 2-50 頁 9.10 節指明：未有盈利的生物科技公司必須證明其具備充足營運資金，足以應付集團由上市文件刊發之日起計至少 12 個月內集團成本的至少 125%（At least 125% of the group's costs）。","reference":"MBLR 18A.03(4); HKSI Paper 5 Guide Topic 2 Section 9.10"},{"id":"T2-053","topic":"Topic 2","subtopic":"Biotech Companies - Trading Record & Management Continuity","difficulty":"Level 2","question":"根據主板上市規則第 18A 章，申請上市的生物科技公司在管理層大致相同的情況下，必須具備多長的營業紀錄期？","options":[{"value":"A","label":"至少 1 個完整財政年度"},{"value":"B","label":"至少 2 個財政年度（Two-year trading record period under substantially the same management）"},{"value":"C","label":"至少 3 個完整財政年度"},{"value":"D","label":"完全免除任何營業紀錄期要求"}],"answer":"B","explanation":"指南 2-50 頁 9.10 節及 MBLR 18A.03(3) 指出：生物科技公司適用的營業紀錄期要求為至少兩個財政年度，且在該兩年間須在「大致相同的管理層」（Substantially the same management）管治下營運。","reference":"MBLR 18A.03(3); HKSI Paper 5 Guide Topic 2 Section 9.10"},{"id":"T2-054","topic":"Topic 2","subtopic":"Biotech Companies - Core Product Criteria","difficulty":"Level 2","question":"根據第 18A 章及聯交所新上市指引，生物科技公司申請上市的核心前提之一，是其必須已研發出至少一款「核心產品」（Core Product）。該核心產品必須已達到下列哪項開發階段？","options":[{"value":"A","label":"僅停留在實驗室概念構想階段"},{"value":"B","label":"研發進展已超越概念階段，擁有所需知識產權，且其商業化銷售依法需要獲得監管當局審批（如臨床試驗通過第一階段）"},{"value":"C","label":"已在全港各大藥房實現超過 1 億港元的年度零售額"},{"value":"D","label":"已在海外完成私有化退市"}],"answer":"B","explanation":"指南 2-50 頁 9.9 節指明：合資格生物科技公司必須將核心產品研發超越概念階段（Beyond the concept stage）、擁有知識產權，且該產品受監管當局法規規管須取得官方上市許可，並曾獲至少一名資深投資者提供有實質意義的第三方投資。","reference":"MBLR 18A.01; HKSI Paper 5 Guide Topic 2 Section 9.9"},{"id":"T2-055","topic":"Topic 2","subtopic":"Biotech Companies - Fundamental Change Prohibition","difficulty":"Level 2","question":"根據主板上市規則第 18A 章，未有盈利的生物科技公司在成功上市後，受到下列哪項持續責任約束？","options":[{"value":"A","label":"上市後首三年內嚴禁委任任何新的獨立非執行董事"},{"value":"B","label":"未經聯交所事先批准，發行人不得進行任何會導致其主營業務發生根本性改變（Fundamental change of its business）的收購、出售或其他交易"},{"value":"C","label":"每年必須將所有營運資金折算為實物黃金存管"},{"value":"D","label":"必須每個月委任獨立估值師進行重組核數"}],"answer":"B","explanation":"指南 2-51 頁 9.11 節及 MBLR 18A.10 規定：生物科技發行人在未符合常規主板財務資格前，若未經聯交所事先批准，嚴禁進行任何會導致其業務性質出現根本轉變的交易，以防借殼或偏離生科研發初衷。","reference":"MBLR 18A.10; HKSI Paper 5 Guide Topic 2 Section 9.11"},{"id":"T2-056","topic":"Topic 2","subtopic":"Weighted Voting Rights (Chapter 8A) - Maximum Voting Ratio","difficulty":"Level 1","question":"根據主板上市規則第 8A 章（不同投票權架構/WVR），一股特權股（WVR share）所能附帶的最高投票權，不得超過一股普通股投票權的多少倍？","options":[{"value":"A","label":"不超過 2 倍"},{"value":"B","label":"不超過 5 倍"},{"value":"C","label":"不超過 10 倍（Ten times that of an ordinary share）"},{"value":"D","label":"不超過 20 倍"}],"answer":"C","explanation":"依據 MBLR 8A.10 及指南 2-51 頁 9.14 節，不同投票權股份所附帶的表決權，最高不得超過普通股每股附帶表決權的十倍（Ten times that of an ordinary share）。","reference":"MBLR 8A.10; HKSI Paper 5 Guide Topic 2 Section 9.14"},{"id":"T2-057","topic":"Topic 2","subtopic":"Weighted Voting Rights - Minimum Economic Interest","difficulty":"Level 2","question":"根據第 8A 章，不同投票權（WVR）受益人在發行人上市時，合計必須實益持有該發行人已發行股本中至少多少比例的底層「經濟利益」（Economic Interest）？","options":[{"value":"A","label":"至少 5%"},{"value":"B","label":"至少 10%（At least 10% of the underlying economic interest）"},{"value":"C","label":"至少 25%"},{"value":"D","label":"至少 50%"}],"answer":"B","explanation":"指南 2-51 頁 9.14 節及 MBLR 8A.12 指明：在上市時，全體 WVR 股份的實益擁有人合計必須持有發行人股本中至少 10% 的實質經濟利益（Economic interest）。","reference":"MBLR 8A.12; HKSI Paper 5 Guide Topic 2 Section 9.14"},{"id":"T2-058","topic":"Topic 2","subtopic":"Weighted Voting Rights - Listing Prohibition","difficulty":"Level 2","question":"關於主板 WVR 股份本身的上市與交易資格，根據《上市規則》第 8A 章，下列敘述何者正確？","options":[{"value":"A","label":"WVR 特權股份可以自由在聯交所公開掛牌交易並供公眾散戶買賣"},{"value":"B","label":"不同投票權股份本身不得尋求在聯交所上市交易（WVR shares cannot be admitted to listing）；只有普通股類別可掛牌買賣"},{"value":"C","label":"WVR 股份必須在 GEM 板塊雙重掛牌"},{"value":"D","label":"WVR 股份在上市滿 6 個月後自動上市交易"}],"answer":"B","explanation":"指南 2-51 頁 9.14 節及 MBLR 8A.08 明確規定：不同投票權股份本身不符合上市資格（Cannot be admitted to listing），公開掛牌並在二級市場流通的僅限於普通投票權股份。","reference":"MBLR 8A.08; HKSI Paper 5 Guide Topic 2 Section 9.14"},{"id":"T2-059","topic":"Topic 2","subtopic":"Weighted Voting Rights - Non-WVR Minimum Voting Power","difficulty":"Level 2","question":"根據《上市規則》第 8A.09 條，為保障非 WVR 股東的發言權，在發行人的股東大會上，非不同投票權股份（普通股）的持有人所享有的投票權總額，至少必須佔全體投票權的：","options":[{"value":"A","label":"至少 5%"},{"value":"B","label":"至少 10%（At least 10% of the votes eligible to be cast）"},{"value":"C","label":"至少 25%"},{"value":"D","label":"至少 50%"}],"answer":"B","explanation":"指南 2-51 頁 9.14 節及 MBLR 8A.09 指明：在發行人的股東大會上，有資格由非 WVR 股份持有人投出的表決權比例，至少必須佔全體合資格投票權總數的 10%（At least 10% of the votes）。","reference":"MBLR 8A.09; HKSI Paper 5 Guide Topic 2 Section 9.14"},{"id":"T2-060","topic":"Topic 2","subtopic":"Weighted Voting Rights - Who Can Hold WVR Shares","difficulty":"Level 2","question":"根據主板上市規則第 8A 章，個人不同投票權股份（WVR shares）的持有人資格受到何種限制？","options":[{"value":"A","label":"任何持有公司 1% 股份的普通顧問均可獲配發 WVR 股份"},{"value":"B","label":"WVR 股份只能發行予發行人的現任董事會成員（Members of the issuer's board of directors）"},{"value":"C","label":"所有機構基金經理均自動享有持有 WVR 股份的特權"},{"value":"D","label":"WVR 股份必須由公司的全體工會成員共同共有"}],"answer":"B","explanation":"指南 2-51 頁 9.15 節及 MBLR 8A.11 規定：個人特權 WVR 股份只能發行予身為發行人董事會成員的個人；若該人士身故、不再出任董事或將股權轉讓，特權投票權隨即終止。","reference":"MBLR 8A.11; HKSI Paper 5 Guide Topic 2 Section 9.15"},{"id":"T2-061","topic":"Topic 2","subtopic":"Weighted Voting Rights - Cessation & Conversion","difficulty":"Level 3","question":"當持有 WVR 股份的董事將其名下的特權股出售予第三方，或該董事辭任／退任發行人董事會席位時，根據第 8A 章，該等 WVR 股份的法律地位將會：","options":[{"value":"A","label":"該等特權投票權永久保留並可自由轉移予新買家"},{"value":"B","label":"特權投票權即時失效，該等股份必須按照一對一基準（One-to-one basis）自動轉換為普通股"},{"value":"C","label":"股份自動被發行人無償沒收為庫存股"},{"value":"D","label":"自動轉換為三倍利息的無擔保可換股債券"}],"answer":"B","explanation":"指南 2-51 頁 9.15 節及 MBLR 8A.17 規定：當 WVR 董事不再擔任董事或將特權股的實益經濟利益轉讓時，該等 WVR 股份的額外投票特權即時終止，並須按 1:1 比例轉換為一般普通股。","reference":"MBLR 8A.17; HKSI Paper 5 Guide Topic 2 Section 9.15"},{"id":"T2-062","topic":"Topic 2","subtopic":"Weighted Voting Rights - Prohibition of New Creation Post-IPO","difficulty":"Level 2","question":"在具備 WVR 架構的發行人掛牌上市後，關於後續發行新的特權 WVR 股份，聯交所《上市規則》第 8A 章的硬性規定是：","options":[{"value":"A","label":"發行人每年均可透過股東大會普通決議案增發 20% 的新 WVR 股份"},{"value":"B","label":"在獲准上市後，發行人嚴禁進一步發行或創設任何新的 WVR 股份（No new WVR shares may be created），因此已發行的 WVR 股份數目只會減少而不會增加"},{"value":"C","label":"只要行政總裁書面簽署同意，隨時可創設新類別特權股"},{"value":"D","label":"僅能在收購合併時向要約人發行新特權股"}],"answer":"B","explanation":"指南 2-51 頁 9.15 節及 MBLR 8A.13 明確指出：上市後發行人不得增加已發行 WVR 股份的數目，亦不得增發任何附帶特權投票權的新股份。因此，WVR 股份在上市後只會逐年遞減或維持不變，絕不能增加。","reference":"MBLR 8A.13; HKSI Paper 5 Guide Topic 2 Section 9.15"},{"id":"T2-063","topic":"Topic 2","subtopic":"Weighted Voting Rights - Reserved Matters (One Share One Vote)","difficulty":"Level 3","question":"根據《上市規則》第 8A.24 條，為保護非 WVR 股東，在股東大會審議特定「保留事項」（Reserved matters）時，WVR 股份的特權投票權必須被凍結，全體股東必須嚴格按「一股一票」基準投票。下列哪一項屬於該等法定保留事項？","options":[{"value":"A","label":"批准日常經營中購買原材料的商業合同"},{"value":"B","label":"修訂章程細則、更改任何股份類別的權利、委聘或罷免獨立非執行董事、或委聘/罷免核數師及清盤決議案"},{"value":"C","label":"通過公司的每月管理賬目"},{"value":"D","label":"審批員工飯堂的年度採購預算"}],"answer":"B","explanation":"指南 2-51 頁 9.16 節及 MBLR 8A.24 列明核心保留事項：(1) 修改憲制文件；(2) 變更任何股份類別權利；(3) 委任或罷免獨立非執行董事；(4) 委任或罷免核數師；(5) 公司主動清盤。就此等事項，WVR 股東每股只能享有一票表決權。","reference":"MBLR 8A.24; HKSI Paper 5 Guide Topic 2 Section 9.16"},{"id":"T2-064","topic":"Topic 2","subtopic":"Special Purpose Acquisition Companies (Chapter 18B) - De-SPAC Deadlines","difficulty":"Level 2","question":"根據主板上市規則第 18B 章，特殊目的收購公司（SPAC）在上市後，必須在多長時間內宣布 De-SPAC 交易，以及完成 De-SPAC 交易？","options":[{"value":"A","label":"上市後 6 個月內宣布，12 個月內完成"},{"value":"B","label":"上市之日起 24 個月內公布 De-SPAC 交易條款，並在上市之日起 36 個月內完成該項收購（經股東大會批准最多可延長 6 個月）"},{"value":"C","label":"上市後 5 年內宣布，10 年內完成"},{"value":"D","label":"無任何時間限制，由發起人自由安排"}],"answer":"B","explanation":"指南 2-52 頁 9.18 節及 MBLR 18B.67, 18B.70 規定：SPAC 必須在上市後 24 個月內公布 De-SPAC 交易條款，並在 36 個月內完成收購（經聯交所批准並獲股東大會同意最多可延長 6 個月）。","reference":"MBLR 18B.67, 18B.70; HKSI Paper 5 Guide Topic 2 Section 9.18"},{"id":"T2-065","topic":"Topic 2","subtopic":"SPAC Promoters Licensing Requirements","difficulty":"Level 3","question":"根據主板第 18B 章對 SPAC 發起人（SPAC Promoters）及董事的資格規定，下列何者正確？","options":[{"value":"A","label":"所有發起人均可為無牌個人，無須任何持牌要求"},{"value":"B","label":"至少一名 SPAC 發起人必須為持牌法團（持有第 6 類機構融資或第 9 類資產管理牌照），且至少兩名 SPAC 董事必須為持牌人（其中至少一人為持牌發起人的代表）"},{"value":"C","label":"全體發起人必須為退休的大律師"},{"value":"D","label":"SPAC 董事嚴禁持有任何證監會發放的個人牌照"}],"answer":"B","explanation":"指南 2-52 頁 9.19 節及 MBLR 18B.10–18B.14 指明：至少一名發起人必須為證監會第 6 類或第 9 類持牌法團；SPAC 董事會中至少兩名董事必須為持牌個人（且至少一人為持牌發起人的代表）。","reference":"MBLR 18B.10-18B.14; HKSI Paper 5 Guide Topic 2 Section 9.19"},{"id":"T2-066","topic":"Topic 2","subtopic":"SPAC Initial Offering Size","difficulty":"Level 1","question":"根據主板上市規則第 18B.15 條，SPAC 在其首次公開發售中，所籌集的總資金總額（Gross funds raised）不得少於：","options":[{"value":"A","label":"港幣 1 億元"},{"value":"B","label":"港幣 5 億元"},{"value":"C","label":"港幣 10 億元（HK$1 billion）"},{"value":"D","label":"港幣 50 億元"}],"answer":"C","explanation":"依據 MBLR 18B.15 及指南 2-52 頁 9.21 節，SPAC 首次公開發售募集的總集資金額不得少於 10 億港元（Gross funds raised must be not less than HK$1 billion）。","reference":"MBLR 18B.15; HKSI Paper 5 Guide Topic 2 Section 9.21"},{"id":"T2-067","topic":"Topic 2","subtopic":"SPAC - Professional Investors Only Restriction","difficulty":"Level 2","question":"在 SPAC 完成 De-SPAC 交易前，其證券的推介發售與二級市場交易，在對象上有何嚴格限制？","options":[{"value":"A","label":"可以隨意向香港全體零售散戶進行公開路演與推介"},{"value":"B","label":"必須設有嚴格安排，確保 SPAC 證券只可推介予專業投資者（PIs），且二級市場買賣僅限專業投資者參與，散戶嚴禁交易"},{"value":"C","label":"僅限向外國政府主權基金發售"},{"value":"D","label":"僅限向年滿 65 歲的香港永久性居民發售"}],"answer":"B","explanation":"指南 2-52 至 2-53 頁 9.21 節及 MBLR 18B.03 規定：在 De-SPAC 交易前，SPAC 證券嚴禁向公眾散戶推介，發行與二級市場買賣均僅限於符合 SFO 定義的專業投資者（Professional Investors, PIs）。","reference":"MBLR 18B.03; HKSI Paper 5 Guide Topic 2 Section 9.21"},{"id":"T2-068","topic":"Topic 2","subtopic":"SPAC - 100% Escrow Account Requirement","difficulty":"Level 2","question":"根據主板上市規則第 18B 章，SPAC 首次公開發售所募集的全部款項必須如何妥善存管？","options":[{"value":"A","label":"存入發起人的個人私人儲蓄戶口進行高風險加密貨幣投資"},{"value":"B","label":"必須百分之百（100%）以現金或現金等價物形式，存管於設在香港的獨立隔離託管賬戶（Ring-fenced escrow account domiciled in Hong Kong）內"},{"value":"C","label":"全數匯往開曼群島無抵押放貸"},{"value":"D","label":"全數用於支付發起人的日常海外差旅開支"}],"answer":"B","explanation":"指南 2-53 頁 9.22 節及 MBLR 18B.16 指明：發行 SPAC 股份籌得的全部資金，必須存放在位於香港的獨立隔離託管賬戶內（Ring-fenced escrow account），該款項僅可用於股份贖回、完成 De-SPAC 交易或在清盤除牌時向股東退款。","reference":"MBLR 18B.16; HKSI Paper 5 Guide Topic 2 Section 9.22"},{"id":"T2-069","topic":"Topic 2","subtopic":"Successor Company - New Listing Standards","difficulty":"Level 3","question":"當 SPAC 物色到合適目標資產並推進 De-SPAC 交易時，該項收購完成後的「繼承公司」（Successor Company）在上市資格層面必須滿足：","options":[{"value":"A","label":"完全豁免任何審核，自動享有永久上市地位"},{"value":"B","label":"必須符合聯交所主板新上市申請人的所有常規上市要求（包括營業紀錄期、財務測試等），委聘保薦人，並編制達到招股章程標準的上市文件"},{"value":"C","label":"僅需由發起人簽署一份合規承諾書即可"},{"value":"D","label":"繼承公司只能轉移至 GEM 上市交易"}],"answer":"B","explanation":"指南 2-53 頁 9.23–9.24 節及 MBLR 18B.36 指出：繼承公司（Successor Company）必須符合適用於所有新上市申請人的同一套上市要求，且必須委聘至少一名獨立保薦人按新上市標準進行審查及呈交文件。","reference":"MBLR 18B.36; HKSI Paper 5 Guide Topic 2 Section 9.23-9.24"},{"id":"T2-070","topic":"Topic 2","subtopic":"De-SPAC - Independent Third Party Investment (PIPE)","difficulty":"Level 3","question":"根據主板第 18B 章，De-SPAC 交易必須引入獨立第三方投資者（PIPE 投資者）。關於該獨立第三方投資的最低法定投資金額，下列敘述何者正確？","options":[{"value":"A","label":"投資總額不得少於 50 萬港元"},{"value":"B","label":"合計投資金額不得少於 5 億港元，或目標資產協定估值之特定規定百分比（介乎 7.5% 至 25%）的較低者；且至少 50% 須來自不少於三名資深投資者"},{"value":"C","label":"必須由發起人的全資直系親屬出資"},{"value":"D","label":"無任何最低投資金額規定"}],"answer":"B","explanation":"指南 2-53 頁 9.25 節及 MBLR 18B.40–18B.44 指出：獨立第三方投資額須不低於 5 億港元或特定百分比（7.5%–25%）的較低者；且該最低投資額中至少 50% 必須來自不少於三名資深投資者（Sophisticated investors）。","reference":"MBLR 18B.40-18B.44; HKSI Paper 5 Guide Topic 2 Section 9.25"},{"id":"T2-071","topic":"Topic 2","subtopic":"De-SPAC - Promoters 12 Months Lock-up","difficulty":"Level 2","question":"在 De-SPAC 交易順利完成且繼承公司股份掛牌上市後，SPAC 發起人（Promoters）名下的實益股份權益將面臨多長的法定禁售期？","options":[{"value":"A","label":"3 個月"},{"value":"B","label":"6 個月"},{"value":"C","label":"12 個月（Period of 12 months from the completion of the De-SPAC Transaction）"},{"value":"D","label":"終身禁售"}],"answer":"C","explanation":"指南 2-54 頁 9.28 節及 MBLR 18B.26 明確規定：在 De-SPAC 交易完成後，SPAC 發起人在繼承公司中的實益權益受制於為期 12 個月的禁售期限制（Period of 12 months）。","reference":"MBLR 18B.26; HKSI Paper 5 Guide Topic 2 Section 9.28"},{"id":"T2-072","topic":"Topic 2","subtopic":"Specialist Technology Companies (Chapter 18C) - Commercial vs Pre-Commercial","difficulty":"Level 2","question":"根據主板上市規則第 18C 章（特專科技公司/STCs），區分「商業化公司」（Commercial Company）與「未商業化公司」（Pre-Commercial Company）的關鍵收益門檻為：","options":[{"value":"A","label":"最近一個經審計財政年度的特專科技業務收益達到 5,000 萬港元"},{"value":"B","label":"最近一個經審計財政年度由特專科技業務產生的收益達到至少 2.5 億港元（At least HK$250 million）"},{"value":"C","label":"最近一年總收益達到 10 億港元"},{"value":"D","label":"最近三年淨利潤累計達到 8,000 萬港元"}],"answer":"B","explanation":"指南 2-55 頁 9.33 節及 MBLR 18C.01 指明：特專科技公司在最近一個經審計財政年度，特專科技業務收益達 2.5 億港元或以上者為「商業化公司」；未達此門檻者則為「未商業化公司」。","reference":"MBLR 18C.01; HKSI Paper 5 Gu
