剩餘兩名無利益衝突的 INED 組成，且通函中須交代排除原因"},{"value":"C","label":"整個 IBC 自動解散，由全體執行董事代為審議"},{"value":"D","label":"該名 INED 必須辭去所有董事職務"}],"answer":"B","explanation":"指南 3-11 頁 3.20 節及 Takeovers Code Rule 2.1 指明：若非執行董事與要約人存在職務關聯或利益牽連，該董事被視為不具備獨立性，必須被排除在獨立董事委員會之外；剩餘的無衝突非執董可繼續組成 IBC 履行職責。","reference":"Takeovers Code Rule 2.1; HKSI Paper 5 Guide Topic 3 Section 3.20"},{"id":"T3-207","topic":"Topic 3","subtopic":"Frustrating Actions - Unsolicited Competing Bids Cooperation","difficulty":"Level 2","question":"受要約公司正在面對第一位要約人的敵意全面收購（Hostile Offer）。此時第二位潛在競購方（白衣騎士/White Knight）主動接洽受要約公司董事會並請求進行盡職調查。根據《收購守則》一般原則 3 及第 6 條（Rule 6），受要約公司董事會：","options":[{"value":"A","label":"嚴禁向第二位競購方提供任何資料"},{"value":"B","label":"有權且通常有義務向真誠的潛在競購方提供對等資料，以利於促成更高報價的競爭性要約，使全體股東受益；但向第二位買方提供的任何資料，若先前未提供給第一位買方，亦必須按要求對等提供予第一位買方"},{"value":"C","label":"向白騎士提供資料構成受禁防礙行動"},{"value":"D","label":"必須強制將公司所有資產無償託管給第二位買方"}],"answer":"B","explanation":"指南 3-6 頁 2.7 節（原則 3）及 Takeovers Code Rule 6 規定：目標公司向真誠潛在要約人提供機密資料不違反資訊平等原則；但 Rule 6 規定，受要約公司向一名真誠要約人提供的任何內部資料，若另一名真誠要約人提出請求，受要約公司必須對等地向其提供同等資料（Equality of information between offerors）。","reference":"Takeovers Code Rule 6; HKSI Paper 5 Guide Topic 3 Section 2.7"},{"id":"T3-208","topic":"Topic 3","subtopic":"Rule 15.4 - Extension of Offer When Acceptance Threshold Lowered","difficulty":"Level 3","question":"在附帶 80% 接納條件的自願要約中，要約人在要約期內決定將該接納條件放寬下調至 50%（使要約更容易成為無條件）。根據《收購守則》第 15.4 條，在要約人宣布將接納條件下調之日起，要約必須：","options":[{"value":"A","label":"在宣布下調當天下午即刻關閉"},{"value":"B","label":"自宣布下調接納條件之日起，要約必須維持向全體股東開放接納至少十四天（Must remain open for not less than 14 days），以確保股東有充分時間在知悉門檻降低後決定是否接納"},{"value":"C","label":"自動將要約價調高 50%"},{"value":"D","label":"必須經全體債權人一致簽字確認"}],"answer":"B","explanation":"Takeovers Code Rule 15.4 規定：當要約人放寬或調低接納條件百分比時（例如由 80% 降至 50%），要約自該通告發布日起必須至少維持開放 14 天，防止要約人在調低門檻後突擊宣布生效關閉要約，保障股東公平決策權。","reference":"Takeovers Code Rule 15.4; HKSI Paper 5 Guide Topic 3 Section 4.49"},{"id":"T3-209","topic":"Topic 3","subtopic":"Whitewash Waiver - Interim Buy-back Disqualification","difficulty":"Level 3","question":"某上市發行人在籌備清洗豁免方案期間，若發行人本身在市場上進行了場內股份購回（Share Buy-back）。該項股份回購在《收購守則》附錄六下的影響為：","options":[{"value":"A","label":"對清洗豁免無任何影響"},{"value":"B","label":"該回購會改變公司總股本基數並實質推高主要股東的持股百分比，若在未經執行人員事先同意下進行，通常會直接損害或導致清洗豁免申請被執行人員否決"},{"value":"C","label":"發行人股票自動被聯交所除牌"},{"value":"D","label":"全體董事被自動判處 2 年監禁"}],"answer":"B","explanation":"Takeovers Code Schedule VI para 3 及實務指引：發行人在清洗豁免待決期間進行股份回購，會干擾股權架構及投票權計算基準；若未經執行人員事先批准，該等回購會破壞清洗豁免的審批基礎，導致豁免不予批出。","reference":"Takeovers Code Schedule VI; HKSI Paper 5 Guide Topic 3 Section 4.36"},{"id":"T3-210","topic":"Topic 3","subtopic":"Off-market Buy-back - Cash Alternative in Asset-settled Buy-backs","difficulty":"Level 3","question":"上市發行人若擬透過「場外協議回購」向某控股股東回購其名下股份，且發行人擬以旗下一項非上市物業資產作為支付對價（非現金結算）。根據《股份回購守則》第 2 條及實務規範，該交易在保障股東公允性上的要求為：","options":[{"value":"A","label":"發行人可以任意估定該物業價值，無須任何獨立報告"},{"value":"B","label":"必須由獨立專業估值師對該物業出具正式估值報告，獨立財務顧問必須確認該資產交換對無利害關係股東而言公平合理，且該交易必須經執行人員核准並獲無利害關係股東 75% 投票贊成"},{"value":"C","label":"該非現金回購在香港成文法下屬絕對非法"},{"value":"D","label":"該物業產權必須自動轉移給香港特區政府"}],"answer":"B","explanation":"指南 3-35 頁 6.4 節及《股份回購守則》Rule 2 指明：以非現金資產作為對價的場外回購涉及資產估值重大風險，必須包含獨立專業估值報告及 IFA 的公允性評估，並經無利害關係股東以 75% 特別多數審批通過。","reference":"Share Buy-backs Code Rule 2; HKSI Paper 5 Guide Topic 3 Section 6.4"},{"id":"T3-211","topic":"Topic 3","subtopic":"Acting in Concert - Financial Accommodations by Commercial Banks","difficulty":"Level 2","question":"在評估一致行動關係時，某持牌商業銀行為要約人提供一筆常規商業抵押貸款以資助其收購要約。根據《收購守則》定義註釋，該商業銀行在何種情況下**不會**被視為要約人的一致行動人士？","options":[{"value":"A","label":"只要該貸款是銀行在其日常業務過程中（In the ordinary course of business）、按正常商業條款提供的常規貸款，且銀行除作為正常放貸人外未享有任何股權利益或控制權協議"},{"value":"B","label":"該銀行必須承諾免除要約人全部貸款利息"},{"value":"C","label":"該銀行必須為要約人承擔 50% 的投資虧損"},{"value":"D","label":"商業銀行在任何情況下均自動被視為一致行動方"}],"answer":"A","explanation":"指南 3-22 頁 4.21 節及 Takeovers Code Definitions Class (9) Note 指明：銀行在日常業務中按正常商業信貸條款（Ordinary course of business on normal commercial terms）向要約人提供融資，依法明確排除於一致行動推定之外，保障金融中介機構常規放貸業務。","reference":"Takeovers Code Definitions Class 9 Note; HKSI Paper 5 Guide Topic 3 Section 4.21"},{"id":"T3-212","topic":"Topic 3","subtopic":"Privatisation - Scheme Voting CCASS Nominee Voting Mechanics","difficulty":"Level 3","question":"在協議安排（Scheme of Arrangement）私有化表決中，大量公眾投資者透過中央結算系統（CCASS）將股份登記在香港中央結算（代理人）有限公司名下。在法庭會議投票表決時，香港中央結算的投票方式為：","options":[{"value":"A","label":"香港中央結算只能統一投全體贊成票或全體反對票"},{"value":"B","label":"香港中央結算獲賦權可依照不同底層投資者的具體指示，將其名下代表的股份分別投出「贊成票」及「反對票」（Split voting），並按各自代表的股份表決權價值分別計入 75% 贊成及 10% 反對測試中"},{"value":"C","label":"透過 CCASS 持股的投資者完全喪失投票權"},{"value":"D","label":"香港中央結算的投票權自動歸屬要約人"}],"answer":"B","explanation":"指南 2-28 頁 6.2(g) 節、3-12 頁 3.23 節及《公司條例》s. 674 指明：代理人法團（如 HKSCC Nominees）有權進行分拆投票（Split vote），按背後不同實益擁有人的指示分別投贊成及反對票，真實反映公眾股東價值比重。","reference":"Companies Ordinance s.674; Takeovers Code Rule 2.10; HKSI Paper 5 Guide Topic 3 Section 3.23"},{"id":"T3-213","topic":"Topic 3","subtopic":"Mandatory Offer - Free Creep Rule Application over 50%","difficulty":"Level 2","question":"控股股東單獨持有上市公司 52% 股份。該股東在接下來的 12 個月內，在二級市場連續買入合計達 8% 的股份（使持股增至 60%）。該增持行為在《收購守則》下的法律結果為：","options":[{"value":"A","label":"因 12 個月內增持超過 2%，強制觸發全面收購要約義務"},{"value":"B","label":"完全不觸發任何全面要約義務，因為其在增持前已經持有超過 50% 投票權，可享有自由增購而無 2% 爬行率限制（Free creep over 50%）"},{"value":"C","label":"該股東必須在 24 小時內將該 8% 股份退還市場"},{"value":"D","label":"必須經收購上訴委員會專項審批"}],"answer":"B","explanation":"指南 3-21 頁 4.18 節及 Takeovers Code Rule 26.1 指明：持有 30% 至 50% 之間者受 2% 爬行條款約束；一旦持股合法超過 50%，該大股東已享有法定絕對控制權，後續進一步增購任何份額股份均不再受 2% 爬行限制，亦不觸發全面要約。","reference":"Takeovers Code Rule 26.1; HKSI Paper 5 Guide Topic 3 Section 4.18"},{"id":"T3-214","topic":"Topic 3","subtopic":"Frustrating Actions - Directors Indemnification against Hostile Bid Costs","difficulty":"Level 2","question":"受要約公司董事會若在要約期內，議決動用受要約公司的資金為全體董事購買異常高額的個人訴訟抗辯責任保險，以抵禦敵意要約人的法律行動。該決議在《收購守則》第 4 條下的合規審查為：","options":[{"value":"A","label":"純屬正常福利，完全免受審查"},{"value":"B","label":"若該保險安排屬於非正常業務過程中訂立的重大合同、或費用異常高昂且旨在阻礙要約，可能構成第 4 條受禁防礙行動，董事會必須事先諮詢執行人員"},{"value":"C","label":"任何公司保險合約均自動構成刑事罪行"},{"value":"D","label":"由全體股東個人出資購買方為合法"}],"answer":"B","explanation":"Takeovers Code Rule 4(c) 及指南 3-14 頁 3.30 節指明：要約期內訂立任何非正常業務過程的重大合約（Contracts outside ordinary course of business）均受 Rule 4 嚴格審查，突擊為董事購買鉅額專屬訴訟抗辯保險可能被視為防礙行動，須事先諮詢執行人員。","reference":"Takeovers Code Rule 4; HKSI Paper 5 Guide Topic 3 Section 3.30"},{"id":"T3-215","topic":"Topic 3","subtopic":"Takeovers Code - Treatment of Treasury Shares in 30% Trigger","difficulty":"Level 3","question":"在計算某股東在上市公司的投票權是否達到 30%（或 2% 爬行率）時，上市發行人自身所持有的「庫存股份」（Treasury Shares）：","options":[{"value":"A","label":"庫存股份所附帶的投票權全數計入大股東名下"},{"value":"B","label":"庫存股份在持有期間不具備投票權，因此在計算投票權總額時，庫存股份必須自已發行股份總數中予以「扣除」（Excluded from denominator），大股東的表決權百分比是以扣除庫存股後的有效有表決權股本為分母計算"},{"value":"C","label":"庫存股份視為公眾獨立股東投票權"},{"value":"D","label":"庫存股份按每股 3 票計入分母"}],"answer":"B","explanation":"指南 2-18 頁 3.40 節、2-26 頁 5.9 節及 Takeovers Code 指明：發行人持有的庫存股（Treasury shares）無表決權，因此在計算《收購守則》下的 30% 觸發點或 2% 爬行率時，分母必須剔除庫存股，按實際具有表決權的股份總額計算各股東的持股比例。","reference":"Takeovers Code Definitions; MBLR 10.06; HKSI Paper 5 Guide Topic 2 Section 5.9; Topic 3 Section 4.18"},{"id":"T3-216","topic":"Topic 3","subtopic":"Rule 18.3 - Competitive Bids and Free Price Adjustments","difficulty":"Level 3","question":"甲要約人發表了每股 8.00 港元的不加價最終價格聲明（無保留條款）。隨後乙要約人宣布以每股 9.00 港元發起競爭要約。根據《收購守則》第 18.3 條，甲要約人在此特定情況下的法規狀態為：","options":[{"value":"A","label":"甲要約人永遠不得加價，必須在原價失效退場"},{"value":"B","label":"根據《收購守則》第 18.3 條，若第三方提出競爭性要約，原先發表了最終價格聲明的要約人自動獲免除該聲明的約束（Released from no increase statement），有權提出新的更高報價以維護市場公允競爭"},{"value":"C","label":"甲要約人必須向乙要約人支付賠償金"},{"value":"D","label":"兩家要約人自動被強制合併"}],"answer":"B","explanation":"Takeovers Code Rule 18.3 明確規定：即使要約人先前發表了不提高價格聲明（且未預先保留權利），一旦有第三方競爭要約人正式公布提出要約，原要約人自動獲守則解除該最終聲明的約束，准許其調高價格進行正常市場競購。","reference":"Takeovers Code Rule 18.3; HKSI Paper 5 Guide Topic 3 Section 3.11"},{"id":"T3-217","topic":"Topic 3","subtopic":"Whitewash Waiver - Circular Notice Dispatch within 21 Days","difficulty":"Level 2","question":"受要約公司在宣布擬申請清洗豁免的發行方案後，根據《收購守則》附錄六，受要約公司將清洗豁免通函寄發予股東的法定時限通常為：","options":[{"value":"A","label":"自公告之日起計 21 天之內（Within 21 days of the date of the announcement of the proposals）"},{"value":"B","label":"在 6 個月之後"},{"value":"C","label":"在 24 小時之內"},{"value":"D","label":"無任何時間限制"}],"answer":"A","explanation":"Takeovers Code Schedule VI para 2 及指南 3-25 頁 4.37 節指明：清洗豁免通函適用於一般要約文件的 21 天寄發時限規限，受要約公司必須在公布建議後 21 天內向股東寄發通函，若涉及編制複雜報告，須向執行人員申請延期許可。","reference":"Takeovers Code Schedule VI para 2; HKSI Paper 5 Guide Topic 3 Section 4.37"},{"id":"T3-218","topic":"Topic 3","subtopic":"Acting in Concert - Substantial Shareholders Presumption Scope","difficulty":"Level 2","question":"根據《收購守則》定義 Class (1) 條款，若某法團持有另一家公司多少比例的投票權，兩家公司依法被推定為一致行動人士？","options":[{"value":"A","label":"持有 5% 或以上"},{"value":"B","label":"持有 20% 或以上有投票權的股份（Holding 20% or more of the voting rights）"},{"value":"C","label":"必須持有 50% 以上"},{"value":"D","label":"持有 1 股即可"}],"answer":"B","explanation":"指南 3-22 頁 4.21 節及 Takeovers Code Definitions Class (1) 明確指明：在一致行動推定架構中，相聯法團（Associated companies）的持股門檻為 20%（不同於上市規則關連人士的 30% 或大股東的 10%）；持有某法團 20% 或以上投票權者，兩者被推定為一致行動。","reference":"Takeovers Code Definitions Class 1; HKSI Paper 5 Guide Topic 3 Section 4.21"},{"id":"T3-219","topic":"Topic 3","subtopic":"Offer Timetable - Announcement of Acceptance Levels Day 39","difficulty":"Level 2","question":"在收購要約進行期間，若要約人並未修訂要約條款，受要約公司刊發其未經審核季度業績或重大資產重組公告的最遲截止日（Day 39 規則）為：","options":[{"value":"A","label":"要約文件寄發之日起計第 39 天（Day 39），此後目標公司不得公布任何未經審計的新財務資訊"},{"value":"B","label":"在要約結束後 30 天"},{"value":"C","label":"在要約首日開盤前"},{"value":"D","label":"無時間限制"}],"answer":"A","explanation":"Takeovers Code Rule 39 及指南 3-30 頁 4.49 節指明：Day 39 是受要約公司發布新重大資訊（如未經審計業績、盈利預測、資產重估）的最後期限；在此日期後受要約公司不得刊發新實質資料，以確保要約人及股東在 Day 46 及 Day 60 前具備確定評估基準。","reference":"Takeovers Code Rule 39; HKSI Paper 5 Guide Topic 3 Section 4.49"},{"id":"T3-220","topic":"Topic 3","subtopic":"Compulsory Acquisition - 90% Independent Shares Calculation Basis","difficulty":"Level 3","question":"要約人在自願全面要約前已持有目標公司 30% 股份。目標公司剩餘 70% 股份由公眾股東持有。要約人若擬依據《公司條例》行使強制擠出權（Squeeze-out），要約人在該要約中必須收購的股份數額為：","options":[{"value":"A","label":"達到目標公司總股本的 90% 即可（即再收購 60%）"},{"value":"B","label":"必須在該要約所涉及的股份（即該 70% 無利害關係股份）中收購達到至少 90%（即收購達到 70% × 90% = 63% 的目標公司總股本）"},{"value":"C","label":"收購達到該 70% 中的 50% 即可"},{"value":"D","label":"必須收購全體股東名下的 100% 股份"}],"answer":"B","explanation":"指南 3-33 頁 5.3 節及《公司條例》s. 693 嚴格規定：90% 擠出門檻不是指發行人總股本的 90%，而是指「該要約所涉及的股份」（Shares to which the offer relates，即扣除要約人要約前已持有股份後的剩餘股份）的至少 90%，防止大股東憑藉既有持股輕易擠出少數股東。","reference":"Companies Ordinance s.693; HKSI Paper 5 Guide Topic 3 Section 5.3"},{"id":"T3-221","topic":"Topic 3","subtopic":"Rule 20.1 - Settlement Currency and Manner","difficulty":"Level 2","question":"根據《收購守則》第 20.1 條，要約人在向已接納要約的股東支付現金收購代價時，在款項支付與貨幣形式上必須：","options":[{"value":"A","label":"可以由要約人任意選擇以非流通虛擬加密貨幣支付"},{"value":"B","label":"必須以要約文件中列明的法定貨幣（通常為港元），透過妥為簽發的支票郵寄或直接電子轉賬全額支付予登記股東"},{"value":"C","label":"可以延期分期 10 年支付"},{"value":"D","label":"必須扣除 30% 作為要約人行政管理費"}],"answer":"B","explanation":"Takeovers Code Rule 20.1 及指南 3-31 頁 4.52 節指明：要約代價結算必須按文件訂明的法定貨幣在 7 個營業日內全額付清，不得無故扣減或改發不可自由兌換的非現金等價物，確保交割確定性。","reference":"Takeovers Code Rule 20.1; HKSI Paper 5 Guide Topic 3 Section 4.52"},{"id":"T3-222","topic":"Topic 3","subtopic":"Whitewash Waiver - Whitewash Exemption for Share Buy-backs Specific Steps","difficulty":"Level 3","question":"上市公司擬實施一項場外股份回購，該回購將導致大股東持股被動跨越 30%。該大股東為免觸發強要責任，依據《收購守則》第 32 條及附錄六申請清洗豁免時，其在大會投票上的安排為：","options":[{"value":"A","label":"大股東可投票贊成股份回購決議案，但須放棄清洗豁免決議案"},{"value":"B","label":"大股東及其一致行動人士必須就回購決議案以及清洗豁免決議案「兩者均放棄表決權」（Must abstain from voting on both resolutions）"},{"value":"C","label":"大股東享有專屬表決權"},{"value":"D","label":"大會決議案自動由董事會取代"}],"answer":"B","explanation":"指南 3-26 頁 4.39 節及 Takeovers Code Rule 32 / Schedule VI 規定：回購引發的清洗豁免中，受惠大股東在回購案及豁免案中均具備直接利害關係，必須在兩項決議案上全數迴避並放棄表決權，交由獨立股東定奪。","reference":"Takeovers Code Rule 32, Schedule VI; HKSI Paper 5 Guide Topic 3 Section 4.39"},{"id":"T3-223","topic":"Topic 3","subtopic":"Rule 22 Disclosure - Dealings by Connected Clients in Ordinary Course","difficulty":"Level 2","question":"擔任受要約公司財務顧問的銀行，其旗下的經紀業務客戶（非自營，純代客下單且該客戶非要約相關人）在市場買賣受要約公司股份。該等純代客經紀交易：","options":[{"value":"A","label":"必須由該客戶在電視公開宣告"},{"value":"B","label":"純代客買賣（Agency trades for non-connected clients）通常無須作為財務顧問自身的交易進行 Rule 22 申報，除非該客戶本身為持有 5% 以上股份的關連人士"},{"value":"C","label":"經紀行必須拒絕受理所有客戶委託"},{"value":"D","label":"自動導致財務顧問牌照被吊銷"}],"answer":"B","explanation":"Takeovers Code Rule 22 Note 2 指明：財務顧問作為中介經紀商，為一般無關聯第三方客戶執行的純代理交易（Agency trades），無須作為顧問自身的持倉進行申報，申報僅針對自身自營、關聯實體或持股 5% 以上的關連客戶。","reference":"Takeovers Code Rule 22 Note 2; HKSI Paper 5 Guide Topic 3 Section 4.53"},{"id":"T3-224","topic":"Topic 3","subtopic":"Takeovers Code - Re-transmission of Misleading Statements (SFO s. 391)","difficulty":"Level 2","question":"在收購過程中，機構融資顧問若參與發布了載有重大虛假陳述的公開通訊文件，除違反《收購守則》外，該顧問依據《證券及期貨條例》第 391 條將承擔何種法律責任？","options":[{"value":"A","label":"完全不承擔任何法定民事責任"},{"value":"B","label":"須對任何因合理信賴該虛假或誤導性陳述而蒙受金錢損失的投資者承擔民事賠償責任（Civil liability to pay damages）"},{"value":"C","label":"僅需向香港消費者委員會備案"},{"value":"D","label":"該責任由香港交易所全額墊付"}],"answer":"B","explanation":"指南 1-23 頁 3.26 節、2-34 頁 7.25 節及 SFO s. 391 指明：參與發布載有重大虛假或誤導性資料的公開通訊，任何人因信賴該資料而受損均可依據 SFO 第 391 條直接提起民事索償訴訟，顧問機構面臨連帶損害賠償追索。","reference":"SFO s.391; HKSI Paper 5 Guide Topic 1 Section 3.26; Topic 2 Section 7.25"},{"id":"T3-225","topic":"Topic 3","subtopic":"Target Response - Material Contracts Inspection Availability","difficulty":"Level 2","question":"根據《收購守則》附錄三，受要約公司在其董事會通函刊發後，必須在其網站上展示的重大合約（Material Contracts）的歷史時間範圍為：","options":[{"value":"A","label":"在要約期開始前兩年內訂立的非正常業務過程的重大合約（Contracts entered into within two years prior to offer period）"},{"value":"B","label":"公司自成立以來簽署的所有採購發票"},{"value":"C","label":"僅限於要約當天簽署的合約"},{"value":"D","label":"無須展示任何合約"}],"answer":"A","explanation":"Takeovers Code Schedule III para 1 指明：通函刊發後供公眾在網站查閱的重大合約，涵蓋受要約公司在要約期開始前兩年內（Not in the ordinary course of business entered into within 2 years）簽訂的所有非日常重大合約，以利投資者評估目標公司資產負擔。","reference":"Takeovers Code Schedule III; HKSI Paper 5 Guide Topic 3 Section 3.14"},{"id":"T3-226","topic":"Topic 3","subtopic":"Acting in Concert - Joint Voting in General Meetings Practice","difficulty":"Level 3","question":"三名股東各自持有上市公司 9% 股份（合計 27%）。在過去三年的歷次股東大會上，該三名股東均依照共同意向推舉並促使全體董事會成員當選。現其中一名股東在市場增持 4% 股份（使三人合計持股達 31%）。在《收購守則》下，執行人員的判定為：","options":[{"value":"A","label":"因三人各自持股均低於 30%，故絕對不觸發任何責任"},{"value":"B","label":"若有事實證據顯示該三名股東長期協同合作控制董事會組成，執行人員獲賦權判定彼等屬於「一致行動人士」，其集合持股跨越 30% 將觸發強制全面要約義務"},{"value":"C","label":"三人持股自動被法院沒收"},{"value":"D","label":"增持股東可享有兩年免責豁免"}],"answer":"B","explanation":"指南 3-21 至 3-22 頁 4.20–4.21 節及 Takeovers Code Definitions：一致行動判定在於實質行為而非形式；長期協同投票控制董事會組成是認定一致行動關係的核心客觀證據，集合持股跨越 30% 即構成控制權轉移並觸發 Rule 26 強要。","reference":"Takeovers Code Definitions, Rule 26.1; HKSI Paper 5 Guide Topic 3 Section 4.20"},{"id":"T3-227","topic":"Topic 3","subtopic":"General Principle 8 - Freedom to Advise Shareholders Safeguards","difficulty":"Level 2","question":"根據《收購守則》一般原則 8，受要約公司董事會若與潛在要約人簽署一份條款，約定「受要約公司董事會承諾在任何情況下均不得向股東建議接納任何其他第三方的收購方案」。該條款在《守則》下的效力為：","options":[{"value":"A","label":"屬於完全合法有效的排他性商業承諾"},{"value":"B","label":"嚴重違反一般原則 8，因為董事不得訂立任何會限制其向股東提供獨立公正建議之自由的協議（Restricting their freedom to advise shareholders），該承諾損害董事受託責任且不被守則認可"},{"value":"C","label":"自動成為香港成文法的一部分"},{"value":"D","label":"由全體工會成員投票決定是否執行"}],"answer":"B","explanation":"指南 3-7 頁 2.7 節（一般原則 8）明確指明：受要約公司董事應審慎行事，嚴禁簽署任何限制其自由向股東提供建議的承諾（Commitments restricting freedom to advise shareholders），否則構成對股東受託責任的實質背叛，違反收購守則原則。","reference":"Takeovers Code General Principle 8; HKSI Paper 5 Guide Topic 3 Section 2.7"},{"id":"T3-228","topic":"Topic 3","subtopic":"Takeovers Appeal Committee - Grounds for Overturning Sanctions","difficulty":"Level 3","question":"收購上訴委員會（TAC）在審理針對收購委員會施加的「冷淡對待令」的上訴時，在何種嚴格法定標準下方會變更或推翻該制裁？","options":[{"value":"A","label":"只要上訴人承諾繳納 500 萬港元手續費即可推翻"},{"value":"B","label":"僅當 TAC 裁定該制裁措施在案件具體情況下確屬「不公平或過度嚴苛」（Unfair or excessive）時，方有權減輕或推翻該項處分"},{"value":"C","label":"TAC 必須在每次開庭時推翻委員會的原審裁定"},{"value":"D","label":"上訴人家庭成員提出請願即可自動撤銷"}],"answer":"B","explanation":"指南 1-7 頁 1.18 節及 3-40 頁 7.30 節指明：TAC 的法定管轄權限是嚴格受限的，其唯一職責為審斷制裁措施是否不公或過度（Unfair or excessive），只有在此特定標準成立時方能變更處分幅度，確保原審委員會威權不受隨意侵蝕。","reference":"Takeovers Code Introduction para 1.9; HKSI Paper 5 Guide Topic 1 Section 1.18; Topic 3 Section 7.30"},{"id":"T3-229","topic":"Topic 3","subtopic":"Mandatory Offer - Exemption for Placing of Top-up Shares at a Discount","difficulty":"Level 3","question":"在先舊後新配售（Placing and Top-up）交易中，大股東先以每股 10.00 港元配售舊股，隨後在 14 天內按每股 9.00 港元的價格（即折價）認購公司新發行的股份以補足持股。該折價認購在《收購守則》下的法律後果為：","options":[{"value":"A","label":"依法自動享有豁免，折價幅度無限制"},{"value":"B","label":"大股東認購新股的價格低於其配售舊股的價格，使大股東獲得了不當折價利益，喪失 Rule 26 註釋 6 的自動豁免資格，認購完成後將觸發強制全面要約義務"},{"value":"C","label":"大股東必須將差額全額補交給香港交易所"},{"value":"D","label":"該認購合同自動無效"}],"answer":"B","explanation":"Takeovers Code Rule 26.1 Note 6 指明：先舊後新豁免要求新股認購價必須等於舊股配售價（扣除相關開支後）；若大股東以更低價格認購新股，實質構成了對大股東的折價利益輸送，不獲常規豁免，將觸發全面收購要約。","reference":"Takeovers Code Rule 26.1 Note 6; HKSI Paper 5 Guide Topic 3 Section 4.40"},{"id":"T3-230","topic":"Topic 3","subtopic":"Share Buy-backs Code - Maintenance of Public Float Post-Buyback","difficulty":"Level 2","question":"根據香港《上市規則》第 10.06(2)(f) 條及《股份回購守則》，上市發行人在執行股份購回時，在公眾持股量（Public float）方面受到何種剛性約束？","options":[{"value":"A","label":"發行人可以回購至公眾持股量為零"},{"value":"B","label":"若回購股份會直接導致在聯交所上市的該類股份由公眾人士持有的百分比跌破法定最低要求（如 25%），發行人嚴禁進行任何股份購回"},{"value":"C","label":"公眾持股量不足時聯交所會代為包銷"},{"value":"D","label":"回購不受任何公眾持股量規則約束"}],"answer":"B","explanation":"指南 2-25 頁 5.6(f) 節及 MBLR 10.06(2)(f) 明確規定：發行人不得進行會導致公眾持股量跌破規定最低百分比的任何股份購回（Adherence to minimum public shareholding requirement），確保市場維持基本流通性。","reference":"MBLR 10.06(2)(f); HKSI Paper 5 Guide Topic 2 Section 5.6(f)"},{"id":"T3-231","topic":"Topic 3","subtopic":"Whitewash Waiver - Mandatory Shareholder Circular Contents","difficulty":"Level 2","question":"受要約公司就清洗豁免（Whitewash Waiver）向股東刊發的通函中，必須由獨立財務顧問（IFA）發表的專項意見內容包括：","options":[{"value":"A","label":"保證新發行股份在上市首日股價上漲的承諾書"},{"value":"B","label":"確認該發行方案及清洗豁免對獨立股東而言是否公平合理（Fair and reasonable），並明確向獨立股東提出如何在大會上投票的具體推薦意見"},{"value":"C","label":"建議全體股東集體辭任香港公職"},{"value":"D","label":"由全體承銷商簽署的無條件免責書"}],"answer":"B","explanation":"指南 3-25 頁 4.37 節及 Takeovers Code Schedule VI para 2 指明：清洗豁免通函中，IFA 負有法定核心職能，必須獨立客觀評估注資方案及免除強要對股東的得失，明確出具是否屬公平合理的結論及明確的投票建議。","reference":"Takeovers Code Schedule VI; HKSI Paper 5 Guide Topic 3 Section 4.37"},{"id":"T3-232","topic":"Topic 3","subtopic":"Dealings Disclosure - Definition of Day for Rule 22 Disclosures","difficulty":"Level 2","question":"在《收購守則》第 22 條交易披露中，若某受規管人士在週五下午進行了相關證券買賣，其向證監會提交 Rule 22 申報表格的最遲時限為：","options":[{"value":"A","label":"週六上午 9:00"},{"value":"B","label":"緊接其後的下一個營業日（通常為下週一）中午十二時正（12:00 noon on the next business day）"},{"value":"C","label":"下週五下午 5:00"},{"value":"D","label":"當月最後一個營業日"}],"answer":"B","explanation":"Takeovers Code Rule 22.1 指明：披露時限為進行交易之日緊接之後的下一個營業日（Next business day）中午 12:00 前；週五進行的交易，申報截止時間為下一個營業日（週一，若非假期）中午 12:00 前。","reference":"Takeovers Code Rule 22.1; HKSI Paper 5 Guide Topic 3 Section 4.53"},{"id":"T3-233","topic":"Topic 3","subtopic":"Mandatory Offer - Joint and Several Cash Resource Commitments","difficulty":"Level 2","question":"在有多名出資人的財團要約架構中，財務顧問在出具充足資金確認函時，必須確保：","options":[{"value":"A","label":"出資承諾只要由其中一名無資產的空殼實體出具即可"},{"value":"B","label":"收購所需全部現金總額已獲各出資方完全承諾，且融資合約具備不可撤銷約束力，確保任何個別出資人的違約均不會影響要約人全面履行向接納股東支付現金的法定義務"},{"value":"C","label":"融資款項可由受要約公司代為墊付"},{"value":"D","label":"資金可在收購滿十年後才到賬"}],"answer":"B","explanation":"指南 3-9 頁 3.10 節及 Takeovers Code Rule 3.5 指明：財務顧問出具確認函時，必須穿透審查融資協議的終局有效性，確保資金承諾不可撤回且足以覆蓋 100% 要約代價，防範收購因個別財團成員毀約而中途暴雷。","reference":"Takeovers Code Rule 3.5; HKSI Paper 5 Guide Topic 3 Section 3.10"},{"id":"T3-234","topic":"Topic 3","subtopic":"Rule 31.1 - The Executive's Discretion to Grant Consent for New Offer","difficulty":"Level 3","question":"要約失效後 12 個月內，原要約人若擬提前再次提出收購要約。根據《收購守則》第 31.1 條，證監會執行人員通常僅在下列哪種例外情形下才會批出許可（Grant consent）？","options":[{"value":"A","label":"只要要約人向執行人員支付額外手續費"},{"value":"B","label":"新要約獲得受要約公司董事會的全面推薦同意（Recommended by the board of the offeree company），或有第三方提出了競爭性收購要約"},{"value":"C","label":"受要約公司股價連續下跌超過 50%"},{"value":"D","label":"原要約人更換了全體財務顧問"}],"answer":"B","explanation":"Takeovers Code Rule 31.1 Note 1 指明：12 個月冷卻期旨在保護目標公司免受反覆騷擾；執行人員通常僅在：(1) 新要約獲受要約公司董事會一致推薦支持；或 (2) 有第三方競爭要約出現等特定例外下，方會破例批准其在 12 個月內提呈新要約。","reference":"Takeovers Code Rule 31.1 Note 1; HKSI Paper 5 Guide Topic 3 Section 4.54"},{"id":"T3-235","topic":"Topic 3","subtopic":"Whitewash Waiver - No Disqualifying Dealings Warranty by Directors","difficulty":"Level 2","question":"在提呈清洗豁免的通函中，擬增持股份的認購人及其董事必須向股東作出的正式保證承諾為：","options":[{"value":"A","label":"保證認購人在未來一年內不轉讓任何非上市資產"},{"value":"B","label":"明確確認並保證其自身及其一致行動人士在商討開始至最後實際可行日期期間，概無進行任何受禁的受要約公司股份買賣（No disqualifying transactions）"},{"value":"C","label":"承諾全體董事已放棄個人休假"},{"value":"D","label":"保證受要約公司每年向慈善機構捐款"}],"answer":"B","explanation":"Takeovers Code Schedule VI 及指南 3-25 頁 4.36 節指明：清洗通函必須載入具法律約束力的陳述，由認購人正式確認在法定回溯期內概無進行任何導致豁免失效的買賣交易，並承擔虛假陳述的法律責任。","reference":"Takeovers Code Schedule VI; HKSI Paper 5 Guide Topic 3 Section 4.36"},{"id":"T3-236","topic":"Topic 3","subtopic":"Acting in Concert - Directors Resignation during Offer Negotiations","difficulty":"Level 3","question":"受要約公司的一名執行董事在收購談判關鍵階段突發提出辭職，並聲稱其辭職後即不再受《收購守則》約束。根據《收購守則》第 7 條及相關指引：","options":[{"value":"A","label":"該董事只要完成辭職登記，即可隨意在市場買賣股票而無須申報"},{"value":"B","label":"未經執行人員事先同意，受要約公司董事在要約期結束前不得辭職；且該董事即使離任，在其任內獲悉的內幕消息及相聯責任依然持續有效，其在離任後短時間內的交易依然受高度監管與審查"},{"value":"C","label":"該董事辭職自動導致要約徹底失效"},{"value":"D","label":"公司秘書有權直接沒收該董事的全部私人存款"}],"answer":"B","explanation":"指南 3-8 頁 3.3 節及 Takeovers Code Rule 7 規定：受要約公司董事在要約期間不得擅自辭職（須獲執行人員許可）；且離任人員對其任內持有的機密資料依然受 SFO 內幕交易及守則誠信義務嚴格管轄，不可藉辭職規避監管。","reference":"Takeovers Code Rule 7; HKSI Paper 5 Guide Topic 3 Section 3.3"},{"id":"T3-237","topic":"Topic 3","subtopic":"Compulsory Acquisition - Registration of Acquired Shares in Squeeze-out","difficulty":"Level 2","question":"要約人成功行使法定強制擠出權（Squeeze-out）後，受要約公司在股東名冊變更及股票過戶上履行的法定程序為：","options":[{"value":"A","label":"受要約公司有權拒絕辦理過戶並將股份充公"},{"value":"B","label":"要約人將收購代價全額交付受要約公司代為存管於獨立信託賬戶後，受要約公司必須將要約人登記為該等被強制收購股份的持有人，並向少數股東寄發領款通知"},{"value":"C","label":"該等被收購股份必須強制永久註銷"},{"value":"D","label":"必須經全體香港市民投票認可後方可過戶"}],"answer":"B","explanation":"指南 3-33 頁 5.3 節及《公司條例》s. 699 指明：在強制收購程序中，要約人將對價送交公司信託保管，受要約公司即有法定義務執行股份過戶登記手續，將要約人登記為 100% 股東，並代未領款股東保管對價。","reference":"Companies Ordinance s.699; HKSI Paper 5 Guide Topic 3 Section 5.3"},{"id":"T3-238","topic":"Topic 3","subtopic":"Rule 14 - Equity Share Capital without Voting Rights Offers","difficulty":"Level 2","question":"根據《收購守則》第 14 條，受要約公司若存在無表決權股本（Equity share capital without voting rights）。要約人對有投票權股份提出全面要約時，對該等無表決權股本：","options":[{"value":"A","label":"要約人依法完全不承擔任何要約義務"},{"value":"B","label":"要約人必須向該等無表決權股本持有人提出相若要約（Comparable offer），確保各類股權資產持有人均享有退出的公平機會"},{"value":"C","label":"無表決權股本必須在要約公布當天強制轉為債權"},{"value":"D","label":"要約人必須按十倍溢價全額回購"}],"answer":"B","explanation":"指南 3-5 頁 2.3 節及 Takeovers Code Rule 14 明確指明：雖然一般要約針對有表決權股本，但 Rule 14 明確規定，若存在無投票權的股本權益（Equity share capital），要約人必須同時向其提出相若對等要約（Comparable offer）。","reference":"Takeovers Code Rule 14; HKSI Paper 5 Guide Topic 3 Section 2.3"},{"id":"T3-239","topic":"Topic 3","subtopic":"Takeovers Code Disciplinary - Private Reprimand Confidentiality","difficulty":"Level 1","question":"收購及合併委員會（Panel）在紀律裁決中對輕微違規者施加「不公開譴責／私下訓誡」（Private reprimand）處分時，該處分的保密要求為：","options":[{"value":"A","label":"處分函件在發出後自動登報公開"},{"value":"B","label":"私下訓誡不向公眾公開（Not made public），僅向受處分當事人正式送達並記錄於證監會內部監管檔案中"},{"value":"C","label":"受處分者必須在社交平台自行公開"},{"value":"D","label":"該處分僅能由香港警務處執行"}],"answer":"B","explanation":"指南 3-39 頁 7.28 節及 Takeovers Code Introduction 指明：私下譴責（Private reprimand）屬於非公開紀律處分形式，用於情節相對輕微、未對市場造成實質損害的違規，其內容不對外公開通報。","reference":"Takeovers Code Introduction; HKSI Paper 5 Guide Topic 3 Section 7.28"},{"id":"T3-240","topic":"Topic 3","subtopic":"Rule 2.10 - Cross-border Scheme of Arrangement Dual Primary Issuers","difficulty":"Level 3","question":"某大型科技公司在香港聯交所及紐約證券交易所同時擁有「雙重主要上市」（Dual-primary listing）地位，且註冊成立於開曼群島。該公司若透過協議安排進行私有化退市，該交易在監管適用上的原則為：","options":[{"value":"A","label":"因其在美國主要上市，香港《收購守則》全面自動豁免"},{"value":"B","label":"雙重主要上市地位意味著香港為其主要監管市場之一，該私有化交易必須全面嚴格遵守香港《收購守則》（包括 Rule 2.10 投票門檻）及開曼公司法，且須同時遵守美國證券交易委員會（SEC）的退市規則"},{"value":"C","label":"僅需遵守開曼群島法律，香港及美國法規均無效"},{"value":"D","label":"由全體美國散戶投票決定香港退市"}],"answer":"B","explanation":"指南 3-5 頁 2.1 節註釋及雙重上市合規架構：雙重主要上市（Dual primary）企業將香港視作第一上市地，香港《收購守則》具備完全法律適用效力，必須同時遵從香港守則、海外上市規則及註冊地公司法，協調多地法規程序。","reference":"Takeovers Code Introduction para 1.1; HKSI Paper 5 Guide Topic 3 Section 2.1"},{"id":"T3-241","topic":"Topic 3","subtopic":"Acting in Concert - Financial Advisers Corporate Finance Chinese Wall Failures","difficulty":"Level 3","question":"在指南回顧的個案一（INT-A 案例）中，證監會特別指出 INT-A 雖然違反了 Rule 22 交易披露及研究報告禁令，但其機構融資團隊與交易團隊之間：","options":[{"value":"A","label":"完全沒有設立任何物理屏障"},{"value":"B","label":"並無證據顯示機密資料跨越了顧問團隊周圍的「中國牆」（No transmission that breached the Chinese wall），此項事實成為證監會在決定處分時未將其定性為內幕交易的重要考量因素"},{"value":"C","label":"兩團隊由同一名經紀人全權兼任"},{"value":"D","label":"中國牆制度在該機構被依法認定無效"}],"answer":"B","explanation":"指南 1-41 頁 4.61 節明確引述個案一調查事實：證監會確認違規主要源於合規內控失誤，並無資訊洩漏跨越中國牆（No breach of Chinese wall），因此未引發內幕交易刑事指控，處分局限於公開譴責。","reference":"HKSI Paper 5 Guide Topic 1 Section 4.61"},{"id":"T3-242","topic":"Topic 3","subtopic":"Whitewash Waiver - Circular Notice Period Strict Calculation","difficulty":"Level 2","question":"上市公司就清洗豁免（Whitewash Waiver）寄發通函時，為確保符合法定通知期（如至少 14 天淨日），通函寄發日及股東大會召開日當天在計算時：","options":[{"value":"A","label":"兩天均全數計入該 14 天通知期內"},{"value":"B","label":"依照香港法律常規，通常必須為「淨日」（Clear days），即寄發當日及會議舉行當日兩者均不得計入規定的最低通知天數之內"},{"value":"C","label":"週六及週日必須雙倍計算"},{"value":"D","label":"僅計算銀行工作日"}],"answer":"B","explanation":"公司法及上市通函實務指明：法定通知期採用「淨日」（Clear days）標準計算，即通函送達寄發當日以及大會召開當日均須被排除在計算之外，確保股東實質享有完整的法定天數審閱通函內容。","reference":"Companies Ordinance; Takeovers Code Schedule VI; HKSI Paper 5 Guide Topic 3 Section 4.37"},{"id":"T3-243","topic":"Topic 3","subtopic":"Rule 24.2 - Purchases in Securities Exchange Offers","difficulty":"Level 3","question":"在以股份交換方式進行的自願要約（Securities Exchange Offer）中，要約人若在要約期內在二級市場以現金買入了受要約公司的股份。根據《收購守則》第 24.2 條，該項現金買入的後果為：","options":[{"value":"A","label":"該買入被聯交所自動判定為無效"},{"value":"B","label":"若該現金買入涉及受要約公司帶有 10% 或以上投票權的股份，要約人必須立即在其股份交換要約中引入「現金選擇」（Cash alternative），現金作價不低於該最高買入價"},{"value":"C","label":"要約人必須將收購對價全部換算為美元結算"},{"value":"D","label":"要約人全體高管必須即時辭任"}],"answer":"B","explanation":"Takeovers Code Rule 24.2 及指南 3-27 頁 4.42 節規定：在換股要約期間，要約人大額以現金在市場買入目標股份，會打破純換股架構的公平性；一旦達 10% 門檻，要約人依法必須為全體股東提供全額現金替代選擇（Cash alternative）。","reference":"Takeovers Code Rule 24.2; HKSI Paper 5 Guide Topic 3 Section 4.42"},{"id":"T3-244","topic":"Topic 3","subtopic":"Rule 31.1 - The 12-Month Restriction Scope following Lapsed Offer","difficulty":"Level 2","question":"某要約人的收購要約宣告失效後，在隨後的 12 個月受禁期內，原要約人及其一致行動人士受到下列哪項嚴格禁止？","options":[{"value":"A","label":"嚴禁在香港任何餐館聚餐"},{"value":"B","label":"嚴禁對該受要約公司提出任何新收購要約、亦嚴禁購入任何證券致使其持股達到或超過該受要約公司 30% 的有投票權股份"},{"value":"C","label":"嚴禁在二級市場買賣任何其他非關聯藍籌股"},{"value":"D","label":"全體員工必須暫停工作 12 個月"}],"answer":"B","explanation":"指南 3-31 頁 4.54 節及 Takeovers Code Rule 31.1 指明：12 個月禁制期包括兩大核心禁止：(1) 不得提出新要約；(2) 不得收購股份致持股達到或跨越 30%（即不得在此期間內強行奪取目標公司控制權）。","reference":"Takeovers Code Rule 31.1; HKSI Paper 5 Guide Topic 3 Section 4.54"},{"id":"T3-245","topic":"Topic 3","subtopic":"Takeovers Code Rulings - Non-disclosure of Executive Consultations","difficulty":"Level 2","question":"當事人及其顧問向證監會執行人員尋求保密非正式指導時，在雙方溝通對話的機密性維護上，當事人負有何種義務？","options":[{"value":"A","label":"當事人可在社交平台發布執行人員的內部對話摘要"},{"value":"B","label":"諮詢過程必須維持嚴格機密（Strict confidentiality），當事人不得向外界披露諮詢細節以試探市場反應，以防引發虛假猜測與市場異動"},{"value":"C","label":"諮詢內容必須強制向海外媒體通報"},{"value":"D","label":"當事人有權單方面公開執行人員的私人電郵"}],"answer":"B","explanation":"指南 3-3 頁 1.6 節及 Takeovers Code Introduction 指明：向執行人員尋求指引必須建立在極度保密的基礎上，嚴禁當事人利用諮詢資訊對外放風炒作，維護監管溝通的嚴肅性與市場穩定秩序。","reference":"Takeovers Code Introduction; HKSI Paper 5 Guide Topic 3 Section 1.6"},{"id":"T3-246","topic":"Topic 3","subtopic":"Acting in Concert - Joint Bidders Agreement on Future Board Seats","difficulty":"Level 3","question":"兩名無關聯股東（各自持股 16%）口頭協商：雙方將在未來的董事會改選中互相提名對方為執行董事，並共同主導公司未來的業務擴張方向。在《收購守則》下，該口頭諒解的合規性質為：","options":[{"value":"A","label":"口頭諒解不具法律合約效力，完全不構成一致行動"},{"value":"B","label":"該口頭諒解（Understanding）旨在共同取得或鞏固對公司的實質控制權，依法直接構成「一致行動人士」（Concert parties），兩者持股合併達到 32%，構成觸發 Rule 26 強制全面要約的違法行為"},{"value":"C","label":"純屬正常董事候選人交流"},{"value":"D","label":"自動導致兩人被取消董事候選資格"}],"answer":"B","explanation":"指南 3-21 頁 4.20 節及 Takeovers Code Definitions 明確規定：一致行動的協議或諒解包括「非正式的口頭協議或默契」（Informal oral agreements or understandings）；只要實質目的在於共同控制公司，即直接構成一致行動並依法合併持股計算強要責任。","reference":"Takeovers Code Definitions; HKSI Paper 5 Guide Topic 3 Section 4.20"},{"id":"T3-247","topic":"Topic 3","subtopic":"Compulsory Acquisition - Squeeze-out Payment Escrow Account","difficulty":"Level 2","question":"在要約人依據《公司條例》強制擠出剩餘少數股東股份時，要約人支付給受要約公司的收購代價款項，受要約公司必須如何處理？","options":[{"value":"A","label":"直接轉入受要約公司的主營業務日常流動資金賬戶使用"},{"value":"B","label":"受要約公司必須將該筆代價存入設在香港的「獨立信託賬戶」（Separate trust account），專為該等尚未領款的剩餘少數股東代為保管"},{"value":"C","label":"全額購買高風險加密貨幣理財產品"},{"value":"D","label":"作為特別花紅分派給受要約公司現任管理層"}],"answer":"B","explanation":"《公司條例》s. 699 及指南 3-33 頁 5.3 節規定：公司代被擠出小股東收取的收購款項，依法必須存管於獨立信託賬戶（Held on trust in a separate bank account），受要約公司負有受託人責任確保款項安全直至小股東前來領取。","reference":"Companies Ordinance s.699; HKSI Paper 5 Guide Topic 3 Section 5.3"},{"id":"T3-248","topic":"Topic 3","subtopic":"Rule 17 - Right of Withdrawal when Offer Document Becomes Unconditional","difficulty":"Level 2","question":"根據《收購守則》第 17 條，已提呈接納的股東在 Day 42 之後行使其法定撤回接納權（Right of withdrawal）。若在該股東遞交撤回通知當天下午，要約人正式宣布該要約在接納上成為無條件，該撤回通知的效力為：","options":[{"value":"A","label":"撤回通知自動作廢，該股東的股份被強制按要約交割"},{"value":"B","label":"若股東在要約正式宣布成為無條件「之前」已有效送達撤回通知，該撤回合法有效，其股份必須退還；宣布成為無條件後，撤回權隨即終止"},{"value":"C","label":"股東必須向要約人支付 10% 撤回違約金"},{"value":"D","label":"該股票被自動凍結三年"}],"answer":"B","explanation":"Takeovers Code Rule 17 規定：股東在 Day 42 後享有的撤回權持續至要約宣布成為無條件之時為止；只要在宣布無條件前有效送達撤回指令，撤回即屬有效，宣布無條件後接納成為不可撤回。","reference":"Takeovers Code Rule 17; HKSI Paper 5 Guide Topic 3 Section 4.50"},{"id":"T3-249","topic":"Topic 3","subtopic":"Whitewash Waiver - Annual Review of Creeping Margins","difficulty":"Level 3","question":"某大股東依據清洗豁免取得 40% 股份滿 12 個月後，該大股東在隨後的新一個 12 個月週期內，其自由增購的法定額度為：","options":[{"value":"A","label":"該大股東可在新週期內自由買入 10% 股份"},{"value":"B","label":"在新週期內，該大股東依然處於 30% 至 50% 的控制區間，因此依然嚴格受制於「每 12 個月內最多增購 2%」的爬行條款規限，直至其持股合法跨越 50% 為止"},{"value":"C","label":"大股東永遠失去在二級市場增持的權利"},{"value":"D","label":"只要獲得董事長個人簽字即可自由增持"}],"answer":"B","explanation":"指南 3-21 頁 4.18(b) 節、3-26 頁 4.38 節及 Takeovers Code Rule 26.1(b) 指明：爬行條款在股東持股介乎 30% 至 50% 之間是常態化持續適用的；前一個 12 個月結束後，在新滾動 12 個月週期內依然受 2% 上限嚴格約束，直至持股超過 50% 具備絕對控制權為止。","reference":"Takeovers Code Rule 26.1(b); HKSI Paper 5 Guide Topic 3 Section 4.18, 4.38"},{"id":"T3-250","topic":"Topic 3","subtopic":"Conclusion of Topic 3 - Disciplinary Hearing Evidence Standards","difficulty":"Level 2","question":"收購及合併委員會（Panel）在召開紀律處分聆訊裁定某人是否違反《收購守則》時，委員會所採用的法定證據舉證標準（Standard of proof）通常為：","options":[{"value":"A","label":"刑事法庭適用的毫無合理疑點標準（Beyond reasonable doubt）"},{"value":"B","label":"民事審裁適用的相對可能性衡量標準（Balance of probabilities），並視乎指控的嚴重程度要求具備相稱的確鑿說服力證據"},{"value":"C","label":"只要有匿名舉報即可直接定罪"},{"value":"D","label":"全憑委員會主席的個人直覺裁判"}],"answer":"B","explanation":"指南 3-38 頁 7.14 節及香港行政審裁常規：收購委員會屬於非法定民事專家審裁機構，其舉證標準採用民事訴訟的「相對可能性衡量標準」（Balance of probabilities），即只要證據顯示違規發生的可能性高於未發生的可能性，即可認定違規並施加相應紀律制裁。","reference":"Takeovers Code Introduction para 1.8; HKSI Paper 5 Guide Topic 3 Section 7.14"},{"id":"T4-001","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"根據香港《上市規則》，上市公司發行可換股債券（Convertible Bonds, CB）時，若換股權獲全面行使，發行人最遲須於何時向聯交所申請將配發及發行的新股上市及買賣？","options":[{"value":"A","label":"債券發行日當天"},{"value":"B","label":"在換股權獲行使並配發新股前，且須事先獲得上市委員會的原則性批准"},{"value":"C","label":"換股權全數行使完成後的 14 個營業日內"},{"value":"D","label":"下一個財政年度結束前與年報一併申請"}],"answer":"B","explanation":"上市公司在發行任何附有換股權之證券（包括可換股債券）前，必須先就該等可換股證券轉換時將予發行的新股份向聯交所取得上市批准（Listing Approval），確保持有人行使換股權時新股得以及時合規掛牌買賣。","reference":""},{"id":"T4-002","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"上市公司依據《上市規則》第 13.36(2)(b) 條之「一般性授權（General Mandate）」發行可換股債券時，其換股價格（Conversion Price）的基準定價通常受何種折讓限制？","options":[{"value":"A","label":"基準價折讓不得高於 10%"},{"value":"B","label":"基準價折讓不得高於 20%（除非具備證明公司處於嚴重財政困境等特殊情況）"},{"value":"C","label":"只要獨立股東批准，折讓幅度完全不設上限"},{"value":"D","label":"必須嚴格按照發行日前 30 個交易日的平均收市價，不得有任何折讓"}],"answer":"B","explanation":"根據《上市規則》第 13.36(5) 條規定，按一般性授權發行證券（包括換股時發行之新股），發行價或換股基準價較基準價（基準日前一個交易日收市價或前五個交易日平均收市價較高者）的折讓幅度不得超過 20%，除非能向聯交所證明公司處於嚴重財務困難等特殊情況。","reference":""},{"id":"T4-003","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"上市公司發行之可換股債券中常見的「重設條款（Reset Clause）」（即若股價下跌則向下調整換股價），在一般性授權架構下受到何種監管限制？","options":[{"value":"A","label":"聯交所完全禁止任何形式的換股價向下重設機制"},{"value":"B","label":"只要向下重設後的價格不低於面值即可無限次自動調整"},{"value":"C","label":"若重設機制可能導致依據一般性授權發行之新股上限被突破，或重設後之換股價較初次訂約基準折讓超過 20%，則不符合一般性授權常規限制，須受特別授權規範或聯交所嚴格審查"},{"value":"D","label":"僅需向公司註冊處備案即可，毋須理會上市規則"}],"answer":"C","explanation":"聯交所對附帶無限制向下調價（Reset）條款的可換股債券持審慎監管態度。若重設條款可能導致換股時發行之股份總數超出原本一般性授權的額度，或實質折讓突破常規限制，發行人必須取得特別授權或事前徵詢聯交所指引。","reference":""},{"id":"T4-004","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"依據《上市規則》第十七章，關於「股份獎勵計劃（Share Award Scheme）」與「購股權計劃（Share Option Scheme）」統整後的監管架構，上市發行人所有由新股資助的股份計劃，其授出上限（Scheme Mandate Limit）合計不得超過該計劃批准日已發行股份總數的多少百分比？","options":[{"value":"A","label":"5%"},{"value":"B","label":"10%"},{"value":"C","label":"15%"},{"value":"D","label":"20%"}],"answer":"B","explanation":"根據經修訂的《上市規則》第十七章，發行人所有由發行新股資助的股份計劃（包括購股權計劃及股份獎勵計劃）合計的「計劃授權限額（Scheme Mandate Limit）」不得超過批准該限額股東大會當日已發行股份總數的 10%。","reference":""},{"id":"T4-005","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"依據《上市規則》第十七章，股份激勵計劃中的「服務提供者分項限額（Service Provider Sublimit）」設立的主要目的為何？","options":[{"value":"A","label":"確保服務提供者獲得的獎勵股份高於公司核心董事"},{"value":"B","label":"防止發行人過度攤薄股東權益以酬謝非僱員第三方（如外部顧問、服務提供商），並要求獨立股東在股東大會上分項單獨批准該上限"},{"value":"C","label":"替代承銷商之佣金支出"},{"value":"D","label":"專供關連人士套現避稅使用"}],"answer":"B","explanation":"為加強對外部服務提供者（Service Providers）參與股份激勵之監管，第十七章規定發行人必須在 10% 總限額內獨立劃定「服務提供者分項限額」，且該限額須在股東大會上經股東獨立表決批准，並在通函中充分披露釐定理由。","reference":""},{"id":"T4-006","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"若上市公司向個別合資格參與者授出股份獎勵或購股權，導致該參與者在任何 12 個月內獲授及將獲授的所有新股合共超過已發行股份總額的 1%（即「1% 個人限額」），發行人必須遵守下列哪項程序？","options":[{"value":"A","label":"僅需董事會全體一致通過即可"},{"value":"B","label":"必須在股東大會上取得獨立股東批准，且該參與者及其緊密聯繫人必須放棄表決權"},{"value":"C","label":"提請香港高等法院出具裁定書"},{"value":"D","label":"將超額部分轉交聯交所信託託管"}],"answer":"B","explanation":"根據《上市規則》第十七章規定，若在任何 12 個月期間內向任何個別參與者授出的期權或獎勵合計超過公司已發行股本的 1%，該項授出必須另行刊發通函並獲股東大會獨立股東批准，受惠人士及其緊密聯繫人須放棄表決權。","reference":""},{"id":"T4-007","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"在《上市規則》第十七章下，股份獎勵或購股權的歸屬期（Vesting Period）原則上不得少於多久？","options":[{"value":"A","label":"6 個月"},{"value":"B","label":"12 個月"},{"value":"C","label":"24 個月"},{"value":"D","label":"36 個月"}],"answer":"B","explanation":"根據新規，股份激勵或購股權的歸屬期原則上最短不得少於 12 個月，僅在薪酬委員會明確批准且符合監管列明之具體豁免範疇（例如提早離職安排、業績目標提前達成或接替離職補償等）時，方可採行較短的歸屬期並予充分披露。","reference":""},{"id":"T4-008","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"根據香港《上市規則》第十八章C（Chapter 18C - 特專科技公司），商用化公司（Commercial Companies）於上市時的預期最低市值要求為：","options":[{"value":"A","label":"40 億港元"},{"value":"B","label":"60 億港元"},{"value":"C","label":"80 億港元"},{"value":"D","label":"100 億港元"}],"answer":"B","explanation":"根據 18C 規定（及聯交所最新實施的暫行調整優化標準），已商業化特專科技公司（Commercial Companies，即具備至少 2.5 億港元經審計特專科技業務收入）上市時的最低市值門檻已優化為 60 億港元（未商業化公司則為 100 億港元）。","reference":""},{"id":"T4-009","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"特專科技公司（18C）若屬於「未商業化公司（Pathfinder / Pre-Commercial Companies）」，其上市時的最低預期市值要求為多少？","options":[{"value":"A","label":"60 億港元"},{"value":"B","label":"80 億港元"},{"value":"C","label":"100 億港元"},{"value":"D","label":"150 億港元"}],"answer":"C","explanation":"聯交所 18C 章節規定，未達到法定收益門檻（經審計財政年度收益不足 2.5 億港元）的未商業化特專科技公司，於掛牌上市時的最低預期市值門檻為 100 億港元。","reference":""},{"id":"T4-010","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"依據《上市規則》第 18C 章，特專科技公司申請上市前，必須獲得來自「資深獨立投資者（Sophisticated Independent Investors, SII）」的實質資助。下列何者符合資深獨立投資者的關鍵特徵？","options":[{"value":"A","label":"申請人控股股東的配偶設立的私人離岸投資實體"},{"value":"B","label":"管理資產規模龐大且獨立於發行人之創投基金（VC）、私募股權（PE）基金或領先科技產業企業"},{"value":"C","label":"發行人主要核心研發主管個人"},{"value":"D","label":"上市申請人下屬全資子公司的僱員持股合夥企業"}],"answer":"B","explanation":"SII 必須具備高水平投資經驗、資產管理規模或行業地位，且必須完全獨立於發行人、控股股東及核心關連人士，旨在透過具聲譽的專業市場資本驗證發行人的技術公允估值。","reference":""},{"id":"T4-011","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"可換股債券之持有人在破產清算中的受償順序（Priority of Claims），相較於公司普通股股東與純粹無抵押高級債權人，其地位為何？","options":[{"value":"A","label":"優於普通股股東，但等同或劣後於無抵押高級債權人（視條款是否設有次級條款 Subordination 而定）"},{"value":"B","label":"劣後於所有普通股股東"},{"value":"C","label":"享有絕對最高優先受償權，優於所有有抵押債權人"},{"value":"D","label":"與普通股股東處於完全相同順位"}],"answer":"A","explanation":"在未行使換股權前，可換股債券本質屬於債務工具。在清盤受償順位上，債權人（包括 CB 持有人）優先於普通股股東，若為普通無抵押 CB，則與一般高級無抵押債權人平級；若合約約定次級（Subordinated），則劣後於高級債權人，但仍先於股權資本。","reference":""},{"id":"T4-012","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"當上市公司發行可換股債券並賦予債券持有人「認沽期權（Put Option，即要求發行人提早贖回債券之權利）」時，在公司流動性風險管理層面應最關注何種指標？","options":[{"value":"A","label":"存貨週轉天數"},{"value":"B","label":"最早贖回行使期（First Put Date）之現金覆蓋率與再融資風險"},{"value":"C","label":"應收票據貼現率"},{"value":"D","label":"股東權益報酬率（ROE）的微幅波動"}],"answer":"B","explanation":"附有投資者回售權（Put Option）的 CB 存在再融資暴險。若發行人在 First Put Date 到期時股價低迷導致投資者集體要求贖回，發行人必須面臨巨大現金償付壓力，故須緊密監控可動用流動資金儲備及替換融資安排。","reference":""},{"id":"T4-013","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"在股份獎勵計劃中，若上市公司委託獨立受託人（Trustee）在二級市場購買現有股份以設立獎勵池，與直接發行新股相比，其主要差異在於：","options":[{"value":"A","label":"委託受託人在二級市場買入現有股份不會對現有股東權益產生股份稀釋（Dilution Effect）"},{"value":"B","label":"二級市場購買股份需要召開股東大會以特別決議案全數批准"},{"value":"C","label":"發行新股不會影響公司總股本"},{"value":"D","label":"二級市場購買股份的受託人可以在股東大會上自由行使股份投票權不受限制"}],"answer":"A","explanation":"透過信託架構在二級市場購入現有流通股（Existing Shares）進行獎勵，公司股本總數不變，不會對現有股東造成股權攤薄效應；依據規則，由信託人持有的該等未歸屬股份在股東大會上通常須放棄行使表決權。","reference":""},{"id":"T4-014","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"依據《上市規則》第十七章，由上市公司直接持有的「主要附屬公司（Principal Subsidiary）」若擬採納其自身的股份激勵計劃，該附屬公司計劃：","options":[{"value":"A","label":"完全豁免遵守《上市規則》第十七章規範"},{"value":"B","label":"視同母公司股份計劃，同樣須受第十七章關於限額、披露及股東批准架構之約束"},{"value":"C","label":"僅需取得附屬公司工會同意"},{"value":"D","label":"僅需向香港勞工處登記備案"}],"answer":"B","explanation":"經修訂的第十七章明確擴大監管範圍，上市公司重要附屬公司（Principal Subsidiaries）設立的股份激勵計劃，因涉及潛在分拆或攤薄上市公司在核心資產的權益，同樣受《上市規則》第十七章的相應規範管轄。","reference":""},{"id":"T4-015","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"特專科技公司（18C）要求未商業化公司在上市申請前三個會計年度中，研發開支（R&D Expenditures）佔其經營總開支的最低比例通常為：","options":[{"value":"A","label":"15%"},{"value":"B","label":"30%"},{"value":"C","label":"50%"},{"value":"D","label":"75%"}],"answer":"C","explanation":"根據 18C 規則，未商業化特專科技公司由於未形成充足商業收入，聯交所要求其展現高度研發投入，申請前三個會計年度每年研發開支佔該年總營運開支的比例原則上須至少達到 50%（若為商業化公司則為至少 15%）。","reference":""},{"id":"T4-016","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"根據香港《公司條例》（第 622 章），香港註冊成立之上市公司若欲進行「股份回購（Share Buy-back）」，回購資金依法必須來自於：","options":[{"value":"A","label":"可分派利潤（Distributable Profits）或為此目的新發行股份之所得款項"},{"value":"B","label":"任何法定資本公積金且毋須遵循減資程序"},{"value":"C","label":"客戶信託專戶款項"},{"value":"D","label":"銀行非承諾性透支額度（Uncommitted Overdraft Facilities）"}],"answer":"A","explanation":"香港《公司條例》嚴格落實資本維持原則（Capital Maintenance Doctrine），公司回購自身股份之資金來源必須為可供分派的利潤，或專門為回購目的而發行新股所得之收益；若自資本中撥款回購，則必須符合嚴格的償付能力陳述及公佈程序。","reference":""},{"id":"T4-017","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"上市公司在場內進行股份回購時，必須嚴格遵守《上市規則》第 10.06 條規定。下列哪項敘述符合該條款限制？","options":[{"value":"A","label":"回購價格可無限制高於市場最高買入價"},{"value":"B","label":"回購價不得高於股份在該次回購前 5 個交易日內平均收市價的 5% 或以上"},{"value":"C","label":"上市公司可在年度業績公佈前一個月內隨意進場回購"},{"value":"D","label":"回購後的股份可無限期以庫存形式保留且享有分紅權利"}],"answer":"B","explanation":"《上市規則》第 10.06(2)(a) 條明確限制，在聯交所場內回購股份時，購買價不得高於緊接回購前五個交易日在聯交所錄得之平均收市價 5% 或以上。","reference":""},{"id":"T4-018","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"聯交所自 2024 年 6 月起全面引入「庫存股份（Treasury Shares）」監管框架。關於發行人庫存股份之權利，下列敘述何者正確？","options":[{"value":"A","label":"庫存股份在股東大會上享有完整投票權"},{"value":"B","label":"庫存股份享有股息分派權及配股優先認購權"},{"value":"C","label":"發行人持有庫存股份期間，其附帶的表決權、股息及分派權利依法被暫停行使（Suspended）"},{"value":"D","label":"庫存股份會自動計入公眾持股量（Public Float）之分子中"}],"answer":"C","explanation":"在香港引入的庫存股份框架下，發行人本身作為自身股份的持有人，持有期間不享有股東表決權、股息分派權或配股認購權，且庫存股份不得計入公眾持股量計算。","reference":""},{"id":"T4-019","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"可換股債券常設定「反攤薄調整條款（Anti-dilution Provisions）」，若上市公司進行紅股發行（Bonus Issue）或股份拆細（Share Subdivision），換股價格通常會：","options":[{"value":"A","label":"等比例上調"},{"value":"B","label":"相應下調，以確保債券持有人的換股經濟權益不被稀釋"},{"value":"C","label":"保持不變，由債券持有人承擔稀釋損失"},{"value":"D","label":"立即自動轉為普通優先股"}],"answer":"B","explanation":"當發行人送紅股或拆細時，流通股份總數增加，每股公允價值下降；根據標準反攤薄條款公式，換股價格將相應下調，使債券行權後可換取的股數相應增加，保障其潛在權益公允性。","reference":""},{"id":"T4-020","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"依據《香港公司收購及合併守則》第 13 條，當要約人對目標公司所有普通股提出全面要約時，要約人對目標公司流通在外的可換股債券：","options":[{"value":"A","label":"完全毋須理會，可任由其違約"},{"value":"B","label":"必須向可換股債券持有人提出「同等條件要約（Comparable Offer）」或相稱收購建議"},{"value":"C","label":"強制按面值 10% 進行清退"},{"value":"D","label":"自動將其換股權永久凍結"}],"answer":"B","explanation":"《收購守則》第 13 條規定，當目標公司存在附有轉換權的證券（如可換股債券）或認股權證時，要約人必須向該等證券持有人提出可比較的同等條件要約（Comparable Offer），保障可換股工具持有人的權益。","reference":""},{"id":"T4-021","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"根據《上市規則》，上市公司向關連人士（Connected Person）單獨發行可換股債券，在上市監管層面構成何種交易？","options":[{"value":"A","label":"僅屬於無須披露的日常業務營運"},{"value":"B","label":"關連交易（Connected Transaction），須遵守獨立財務顧問（IFA）意見、獨立董事委員會評估及獨立股東大會批准等規定"},{"value":"C","label":"視同單純銀行借款，完全豁免股東大會批准"},{"value":"D","label":"只要換股價高於市價即可豁免所有通函披露要求"}],"answer":"B","explanation":"向關連人士發行證券（包括可換股債券）構成關連交易。因其賦予關連人士轉換為上市股權之權利，必須按《上市規則》第十四A章嚴格履行公告、通函、聘請獨立財務顧問及獨立股東大會批准程序。","reference":""},{"id":"T4-022","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"特專科技公司（18C）若在上市時未有足夠商業化記錄，其控股股東（Controlling Shareholders）在上市後的禁售期（Lock-up Period）限制通常為：","options":[{"value":"A","label":"6 個月"},{"value":"B","label":"第一期 12 個月，第二期再限制 12 個月（累計 24 個月）"},{"value":"C","label":"3 個月"},{"value":"D","label":"毋須遵守任何禁售期"}],"answer":"B","explanation":"針對未商業化特專科技公司，因業務不確定性與風險較高，聯交所對其控股股東實施較一般主板（一般為 6+6 個月）更嚴格的鎖定期限制，通常為 12 個月內不得出售任何股份，其後 12 個月內不得喪失控制權（合計 24 個月）。","reference":""},{"id":"T4-023","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"在結構化融資中，「永續可換股債券（Perpetual Convertible Bonds）」在國際會計準則（IFRS 9 / IAS 32）下被分類為權益工具（Equity）而非金融負債（Financial Liability）的關鍵判定標準是：","options":[{"value":"A","label":"債券票面利率超過 10%"},{"value":"B","label":"發行人具備無條件避免交付現金或其他金融資產予持有人的合約權利（如可無限期遞延派息且無固定到期日）"},{"value":"C","label":"債券持有人為發行人的主要往來銀行"},{"value":"D","label":"該工具在聯交所主板掛牌買賣"}],"answer":"B","explanation":"根據 IAS 32，若金融工具的發行人擁有無條件的合約權利避免以交付現金或其他金融資產履行合約義務（例如發行人擁有自主決定無限遞延支付利息的權利且無到期日），則該工具在資產負債表上應被歸類為「權益工具」，有利於優化資產負債率。","reference":""},{"id":"T4-024","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"根據香港《上市規則》，當可換股債券持有人行使換股權導致發行人之公眾持股量（Public Float）低於法定最低要求（通常為 25%）時，下列處置方式何者符合監管規定？","options":[{"value":"A","label":"聯交所會立即強制將該發行人註銷退市"},{"value":"B","label":"發行人及主要股東必須採取積極糾正措施（如大股東減持、配售新股等）以恢復公眾持股比例，並向聯交所及市場披露"},{"value":"C","label":"聯交所將公眾持股比例門檻永久調低至 1%"},{"value":"D","label":"沒收換股持有人的所有換得股份"}],"answer":"B","explanation":"若換股行為導致公眾持股量跌破 25%（或指定百分比），發行人及控股股東有責任採取即時補救措施恢復公眾持股量，聯交所有權在公眾持股不足期間對該股份實施暫停買賣。","reference":""},{"id":"T4-025","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"股份獎勵計劃中，若以信託形式持有已歸屬或未歸屬的股份，受託人（Trustee）在收購守則（Takeovers Code）下進行要約表決時，通常應如何行使表決權？","options":[{"value":"A","label":"受託人必須自主替所有受益人按其自身商業利益決定表決"},{"value":"B","label":"對於未歸屬股份，受託人通常不得在股東大會行使投票權；對於已歸屬但未提取股份，應按相關受益人的具體指示行使表決"},{"value":"C","label":"強制投票支持要約人"},{"value":"D","label":"強制投票反對任何收購方案"}],"answer":"B","explanation":"依據監管通例與受託架構要求，未歸屬（Unvested）的激勵股份受託人不得行使表決權以避免管理層操控；已歸屬（Vested）並由信託代持的股份，受託人應恪盡信託責任，嚴格按實質受益人的明確指示進行表決。","reference":""},{"id":"T4-026","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"某上市公司擬發行本金額為 5 億港元、票面利率 2%、5 年期之可換股債券，約定固定換股價為每股 5.00 港元。若債券全數獲轉換，發行人需發行多少股新股？","options":[{"value":"A","label":"2,500,000,000 股"},{"value":"B","label":"100,000,000 股"},{"value":"C","label":"50,000,000 股"},{"value":"D","label":"25,000,000 股"}],"answer":"B","explanation":"轉換股份數量 = 債券面值總額 / 換股價 = 500,000,000 港元 / 5.00 港元/股 = 100,000,000 股（1 億股）。","reference":""},{"id":"T4-027","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"下列何種衍生結構條款通常包含在可換股債券中，用以保護「發行人」在標的股價暴漲時得以及時迫使持有人行使換股權或接受贖回？","options":[{"value":"A","label":"投資者回售權（Put Option）"},{"value":"B","label":"強制發行人贖回權 / 發行人贖回條款（Soft Call / Issuer Early Redemption Call Option）"},{"value":"C","label":"股息保護豁免條款（Dividend Waiver Clause）"},{"value":"D","label":"跨市場套利條款（Arbitrage Facility）"}],"answer":"B","explanation":"「提前贖回權（Issuer Call Option，常附帶條件如在連續 30 個交易日中有 20 個交易日收市價達換股價之 130%）」賦予發行人在股價大幅攀升時提早按面值贖回的權利，迫使投資者選擇轉換為高價值股票（Forced Conversion），避免長期支付債息。","reference":""},{"id":"T4-028","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"特專科技公司（18C）若擬發行具備同股不同權（Weighted Voting Rights, WVR）架構之股份，其必須同時滿足下列何種原則？","options":[{"value":"A","label":"僅需公司估值達到 5 億港元"},{"value":"B","label":"必須符合《上市規則》第八A章中關於特殊投票權受益人資格、最低經濟利益及企業管治常規等全面規定"},{"value":"C","label":"特專科技公司完全豁免遵守第八A章之所有治理守則"},{"value":"D","label":"WVR 受益人可以為任何外部財務顧問機構"}],"answer":"B","explanation":"18C 特專科技公司若採用不同投票權架構上市，仍必須嚴格遵循《上市規則》第 8A 章（WVR）的全部制度限制，包括受益人必須為關鍵執行董事、持有至少 10% 經濟利益上限及超級投票權比例上限（1 股最多 10 票）等。","reference":""},{"id":"T4-029","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"依據《證券及期貨條例》（SFO）第 XV 部，可換股債券持有人何時產生對相關底層股份的權益披露（Disclosure of Interests, DI）義務？","options":[{"value":"A","label":"僅在最終行使換股權並收到實物股票之日"},{"value":"B","label":"在取得、持有或處置該等附帶轉換權之債券的衍生權益達到法定披露門檻（5%）時，即須在 3 個營業日內履行披露義務"},{"value":"C","label":"僅在公司清盤時"},{"value":"D","label":"任何情況下均毋須申報，因 CB 尚未轉為流通股"}],"answer":"B","explanation":"根據香港 SFO 第 XV 部，透過股本衍生工具（包括可換股債券、期權、認股權證）持有的相關股份「淡倉」或「好倉」權益均屬申報範圍。只要衍生工具所對應的股份權益達到 5% 門檻，即觸發法定 3 個營業日內的申報義務。","reference":""},{"id":"T4-030","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"股份獎勵計劃若包含「回扣 / 追回機制（Clawback Mechanism）」，其主要法規與治理意涵為何？","options":[{"value":"A","label":"強制員工每年退還 10% 現金薪酬"},{"value":"B","label":"當公司發生嚴重財務重述、重大失當行為或違法事件時，發行人有權追回或取消已授予或已歸屬之激勵股份"},{"value":"C","label":"規避香港稅務局之薪俸稅扣繳"},{"value":"D","label":"保障管理層在公司被收購時獲得保證雙倍賠償"}],"answer":"B","explanation":"《上市規則》第十七章要求發行人在股份激勵條款中訂明追回機制（Clawback），使公司在合資格參與者出現欺詐、嚴重失當、重大財務報表錯誤重述等情事時，有法律依據註銷或追討其股權獎勵，強化企業管治。","reference":""},{"id":"T4-031","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"在香港資本市場發行「雙幣雙股（Dual-Counter Model）」的上市公司，其股份在櫃台轉換或交易結算時的主要特徵為：","options":[{"value":"A","label":"港幣櫃台與人民幣櫃台所代表的公司股權權益本質完全不同"},{"value":"B","label":"港幣櫃台與人民幣櫃台屬於同一類別股份，享有相同權益，且股東可在兩個櫃台間進行跨櫃台股份轉換（Inter-counter Transfer）"},{"value":"C","label":"人民幣櫃台股份不得在香港中央結算系統（CCASS）辦理結算"},{"value":"D","label":"人民幣櫃台交易僅限於合格境外機構投資者（QFII）參與"}],"answer":"B","explanation":"雙櫃台模式下，港幣計價及人民幣計價的股票均代表發行人的同一類別普通股，股東享有相同的投票權與分紅權，並可透過香港結算系統進行跨櫃台自由轉移。","reference":""},{"id":"T4-032","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"上市公司將購股權（Share Options）贈予顧問或外部業務夥伴時，薪酬委員會（Remuneration Committee）必須在通函中就下列何者提供具體評估意見？","options":[{"value":"A","label":"該顧問是否為公司創辦人的直系親屬"},{"value":"B","label":"該外部人士獲授股份的合理性、其對發行人長期發展之實際貢獻，以及為何不採現金報酬之合規論證"},{"value":"C","label":"該顧問在二級市場的股票交易記錄"},{"value":"D","label":"外部顧問個人私人銀行賬戶存款餘額"}],"answer":"B","explanation":"根據《上市規則》第十七章，向服務提供者或顧問授出股份獎勵時，發行人的薪酬委員會必須逐案審查該授出的客觀依據，包括其對集團成長的持續貢獻、無形價值及授予條件之合理性，並在公告與通函中披露。","reference":""},{"id":"T4-033","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"在可換股債券的資本結構中，「負面押記（Negative Pledge）」條款的主要功能為何？","options":[{"value":"A","label":"保證債券持有人每年享有固定利息收入"},{"value":"B","label":"限制發行人及其主要附屬公司日後在其資產上增設抵押權益，以防損害現有債券持有人的未受償資產分配權利"},{"value":"C","label":"強制發行人不得增發任何普通股"},{"value":"D","label":"賦予債券持有人提名半數董事的特權"}],"answer":"B","explanation":"「負面押記（Negative Pledge）」是債券合約中的核心保護性條款，旨在防止借款人（發行人）將其核心資產為其他新增債權人設立抵押權，從而降低現有債權人在違約時的資產受償優先順序。","reference":""},{"id":"T4-034","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"依據香港《上市規則》，上市公司若擬透過「實物分派（Distribution in Specie）」方式將其持有的非上市附屬公司股權分派予股東，必須符合何種監管審查程序？","options":[{"value":"A","label":"完全毋須理會，董事會單獨決議即可發放"},{"value":"B","label":"視同資產處置，需依照第十四章（重大交易）評估五項資產比率，若構成須予公佈的交易或關連交易，須遵守公告、通函及股東大會批准程序"},{"value":"C","label":"自動視為破產清算處置"},{"value":"D","label":"僅需向香港消費者委員會申報"}],"answer":"B","explanation":"實物分派資產在《上市規則》第十四章下被視為資產出售/處置行為。發行人須計算相關百分比率，若超過門檻（如非常重大出售事項或涉及關連人士），必須符合公告、通函、股東大會批准及獨立財務顧問等審批要求。","reference":""},{"id":"T4-035","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"特專科技公司（18C）在招股文件中，相較於傳統商業製造業，必須披露哪一項具備產業特性的專門風險披露？","options":[{"value":"A","label":"貴金屬礦產之開採儲量核實報告"},{"value":"B","label":"關鍵技術知識產權（IP）之排他所有權、專利訴訟風險及對核心技術人員之依賴性分析"},{"value":"C","label":"房地產土地使用權證取得之城鄉規劃證明"},{"value":"D","label":"船運提單留置權爭議"}],"answer":"B","explanation":"18C 企業的核心資產高度集中於前沿技術研發，因此聯交所要求其重點披露研發管線、專利技術排他性、知識產權侵權訴訟風險、核心研發團隊流失風險及研發成果轉化不及預期等專屬風險。","reference":""},{"id":"T4-036","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"上市公司採納庫存股份制度後，若擬將持有的「庫存股份轉讓（Transfer of Treasury Shares）」給特定投資者，在《上市規則》下該行為受何種規則約束？","options":[{"value":"A","label":"不受任何限制，等同於日常買賣商品"},{"value":"B","label":"視同配發及發行新股，須依賴一般性授權或取得特別授權，並受預先防範股權攤薄及定價折讓限制之約束"},{"value":"C","label":"自動豁免所有上市規則"},{"value":"D","label":"只能無償贈送給當地政府機構"}],"answer":"B","explanation":"根據香港庫存股份監管架構，發行人將庫存股份轉讓（出售）被視為與發行新股實質相同的集資行為，因此轉讓庫存股必須佔用一般性授權額度或經股東大會特別授權，定價亦受折讓上限（一般不大於 20%）之規管。","reference":""},{"id":"T4-037","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"若某可換股債券設有「交割選擇權（Cash Settlement Option）」，允許發行人在債券持有人行使換股權時，自主選擇支付等值現金而非交付實體新股。此種結構在金融工程中稱為：","options":[{"value":"A","label":"淨額股份交割可換股債券（Net Share Settled Convertible Bonds / Cash Settled CB）"},{"value":"B","label":"深度實值期權"},{"value":"C","label":"零息抵押貸款"},{"value":"D","label":"優先清償可轉讓票據"}],"answer":"A","explanation":"現金結算可換股債券允許發行人以相當於換股標的市值之現金結清轉換權益，此機制旨在幫助發行人管理潛在的股份稀釋率，但同時考驗發行人在行權期的現金流儲備。","reference":""},{"id":"T4-038","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"依據《上市規則》第十七章，發行人向其附屬公司的董事授出由新股資助的股份獎勵時，該授出事項：","options":[{"value":"A","label":"完全豁免第十四章A關連交易之任何申報"},{"value":"B","label":"屬於向關連人士授出證券，若未符合全面豁免條件，須經上市公司獨立非執行董事批准，超逾限額者更需經股東大會批准"},{"value":"C","label":"違反刑法，屬非法轉移利潤"},{"value":"D","label":"僅需在三年後的年報中載明"}],"answer":"B","explanation":"附屬公司董事屬於上市發行人層面的關連人士。向其授出股份獎勵構成關連交易，必須符合第十七章及第十四A章的關連交易審批程序（如全體 INED 事先批准、超逾特定門檻須刊發通函並取得獨立股東批准）。","reference":""},{"id":"T4-039","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"可換股債券的投資分析中，「Delta（對沖值）」主要用來衡量：","options":[{"value":"A","label":"債券價格隨無風險利率變動的敏感度"},{"value":"B","label":"可換股債券之理論價值相對於底層標的股票價格變動的變動比率"},{"value":"C","label":"信用違約交換（CDS）利差的波動率"},{"value":"D","label":"預期公司破產清算的回收率"}],"answer":"B","explanation":"在衍生工具分析中，CB 的 Delta 衡量標的股票價格每變動 1 單位時，可換股債券價格所預期產生的變動幅度，數值介於 0（純債性）至 1（純股性）之間。","reference":""},{"id":"T4-040","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"特專科技公司（18C）在其年度報告中，相較於一般商業公司，被強制要求額外詳細披露下列何項運營進度？","options":[{"value":"A","label":"所有客戶的私人住址名冊"},{"value":"B","label":"特專科技業務研發里程碑進展、研發開支具體分配明細及商業化路徑的實質達成情況"},{"value":"C","label":"每一名外包清潔工的工資單據"},{"value":"D","label":"董事會全體成員的個人消費流水"}],"answer":"B","explanation":"18C 公司享有未商業化或低收益上市的彈性通道，相應地，聯交所強制其在上市後的年報與中期報告中持續詳細披露其特專科技產品的研發階段進展、商業化驗證情況及研發資金運用，保障投資者知情權。","reference":""},{"id":"T4-041","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"根據香港《公司收購、合併及股份購回守則》，上市公司進行場外股份回購（Off-market Share Buy-back）時，必須獲得何種表決批准？","options":[{"value":"A","label":"董事會過半數贊成即可，毋須股東批准"},{"value":"B","label":"在已召開的股東大會上，經出席大會的無利害關係股東（Disinterested Shareholders）以至少 75% 的票數通過特別決議案批准"},{"value":"C","label":"香港高等法院行政命令直接確認"},{"value":"D","label":"香港金管局總裁單方面核准函"}],"answer":"B","explanation":"依據《股份購回守則》第 2 條，場外回購（非聯交所競價場內進行之特定合約回購）必須事先獲得證監會執行人員認可，並在股東大會上獲得出席之無利害關係股東以四分之三（75%）以上多數票通過特別決議案批准。","reference":""},{"id":"T4-042","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"債券發行人若在可換股債券條款中設定「交集交叉違約（Cross-Default）」條款，其法律效果為：","options":[{"value":"A","label":"只要發行人的任何其他指定金融債務出現違約或被加速到期，本可換股債券亦立即構成違約並賦予持有人要求提前償還的權利"},{"value":"B","label":"債券持有人必須替發行人償還其他銀行的不良貸款"},{"value":"C","label":"違約時自動將所有債權人轉為終身無薪董事"},{"value":"D","label":"豁免發行人所有借款本息"}],"answer":"A","explanation":"交叉違約條款（Cross-Default）保護債權人，一旦債務人在外部其他重大借貸合約中發生實質違約或被債權人宣告提早到期，將引發骨牌效應，本可換股債券持有人有權同步宣告債券到期並行使清償索賠，防範劣後被動受損。","reference":""},{"id":"T4-043","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"依據香港《上市規則》，上市公司在行使購股權計劃時，所定立的「行使價（Exercise Price）」不得低於下列何者之最高者？","options":[{"value":"A","label":"授出日收市價、授出日前 5 個交易日平均收市價及股份面值"},{"value":"B","label":"過去 52 週最高股價"},{"value":"C","label":"授出日前一日收市價的 50%"},{"value":"D","label":"發行人上一年度的每股資產淨值（NAV）"}],"answer":"A","explanation":"根據《上市規則》第十七章，新股期權的行使價基準不得具有激勵折讓，其行使價必須至少為下列各項中的最高者：(i) 股份在授出日於聯交所日報表所示的收市價；(ii) 股份在緊接授出日前五個交易日於日報表所示的平均收市價；以及 (iii) 股份的面值。","reference":""},{"id":"T4-044","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"在資本重組（Capital Reorganisation）中，上市公司若進行「股本削減（Capital Reduction）」配合發行可換股工具，依據香港法律其必須通過何種司法或法定流程以保護債權人權益？","options":[{"value":"A","label":"僅需行政總裁口頭承諾"},{"value":"B","label":"依據《公司條例》通過股東特別決議案，並完成高等法院確認程序或遵循獨立償付能力陳述（Solvency Statement）及刊憲通知債權人流程"},{"value":"C","label":"獲得破產受託人的書面豁免"},{"value":"D","label":"向聯合國貿易委員會遞交報備"}],"answer":"B","explanation":"根據香港《公司條例》（第 622 章），公司減資必須嚴格遵循法定程序保護債權人，可採行經法院確認之傳統減資途徑，或採取由全體董事簽署「償付能力陳述書」、獲股東特別決議通過並完成債權人公告與刊憲反對期的「償付能力途徑」。","reference":""},{"id":"T4-045","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"特專科技公司（18C）所涉「特專科技行業（Specialist Technology Industries）」現行認可範疇，不包含下列哪一項傳統業務？","options":[{"value":"A","label":"新一代信息技術（如量子計算、人工智能）"},{"value":"B","label":"先進硬件（如半導體、光電子）"},{"value":"C","label":"傳統房地產住宅開發與一般物業物業管理服務"},{"value":"D","label":"先進材料、新能源與節能環保技術"}],"answer":"C","explanation":"18C 章節明確界定特專科技涵蓋五大前沿領域：新一代信息技術、先進硬件及軟件、先進材料、新能源及節能環保、新食品及農業技術。傳統房地產物業開發及基礎物業管理不符合特專科技板塊定位。","reference":""},{"id":"T4-046","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"可換股債券的「換股溢價（Conversion Premium）」定義通常為：","options":[{"value":"A","label":"換股價格相對於發行前基準股票市價的高出百分比"},{"value":"B","label":"債券票面利率與銀行基準利率之差"},{"value":"C","label":"發行人的承銷手續費率"},{"value":"D","label":"債券到期贖回價相對於面值的折讓幅度"}],"answer":"A","explanation":"換股溢價反映投資者在轉換時相較於定價基準日市場股價所願意支付的溢價水平。公式為：換股溢價率 = [(初始換股價 - 基準股價) / 基準股價] * 100%。","reference":""},{"id":"T4-047","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"在股份獎勵計劃中，若受激勵對象在激勵股份全數歸屬前自願離職，依據一般標準激勵條款，其尚未歸屬（Unvested）的股份通常將如何處置？","options":[{"value":"A","label":"自動全數加速歸屬予該離職員工"},{"value":"B","label":"立即失效並沒收（Lapse / Forfeiture），相關份額退回獎勵池或由信託註銷"},{"value":"C","label":"強制轉讓予該員工之配偶"},{"value":"D","label":"拍賣並將款項捐贈慈善機構"}],"answer":"B","explanation":"股份獎勵旨在鼓勵核心人才長期服務。若參與者在股份滿足歸屬條件前主動辭任，未歸屬之份額一般依規章立即作廢（Lapse），該等股份回流信託池或予以處理。","reference":""},{"id":"T4-048","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"根據《上市規則》第 13.09 條及《證券及期貨條例》第 XIVA 部（內幕消息披露制度），上市公司獲主要機構投資者主動提出承銷可換股債券的初步非約束性條款清單時，在何種情況下得暫免披露該資訊？","options":[{"value":"A","label":"任何情況下均永久毋須披露"},{"value":"B","label":"該交易正處於保密磋商與籌備階段、發行人已採取切實嚴密的保密措施，且未發生任何市場洩密或股價異動"},{"value":"C","label":"僅需向內部員工大會口頭通報即可免除對外披露"},{"value":"D","label":"只要發行人資產淨值為正即可豁免"}],"answer":"B","explanation":"根據 SFO 第 XIVA 部的安全港機制（Safe Harbours），若談判涉及未完成的商議或融資籌劃，且發行人和相關方嚴格維持高度保密狀態、並未發生洩密異動，發行人可暫時豁免刊發內幕消息公告。","reference":""},{"id":"T4-049","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"在香港聯交所主板，發行人若發行「認股權證（Warrants）」以換取現金，該認股權證的行使期限依法通常不得超過自發行日起計多久？","options":[{"value":"A","label":"1 年"},{"value":"B","label":"3 年"},{"value":"C","label":"5 年"},{"value":"D","label":"10 年"}],"answer":"C","explanation":"根據《上市規則》第十五章（附認股權證之證券及非無條件認股權證），非上市或上市認股權證之行使期原則上不得超過五年，避免長期衍生權益對公司股本結構產生不可預期的無限期攤薄風險。","reference":""},{"id":"T4-050","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"發行人發行可換股債券並由第三方母公司或金融機構提供擔保（Guaranteed Convertible Bonds），在結構化信貸上該擔保通常採行「無條件不可撤銷之連帶責任保證（Unconditional and Irrevocable Guarantee）」，這代表：","options":[{"value":"A","label":"債券持有人必須先完成對發行人的所有破產清盤訴訟後，方可向擔保人索償"},{"value":"B","label":"一旦發行人發生違約付息或違約贖回，債券受託人/持有人有權跳過發行人，直接要求擔保人即時承擔全額償付義務"},{"value":"C","label":"擔保人在發行人違約時僅承擔精神慰撫責任"},{"value":"D","label":"擔保責任在發行滿 1 年後自動解除"}],"answer":"B","explanation":"連帶責任保證（Joint and Several Liability Guarantee）下，主債務人（發行人）一旦發生合約違約，擔保人即時負有一手履約賠償責任，債權人毋須先行耗盡對發行人的司法追索即可直接向擔保人要求全額代償。","reference":""},{"id":"T4-051","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"根據國際財務報告準則（IFRS 9 / IAS 32），發行人發行包含轉股權的傳統可換股債券（非衍生金融負債結算）時，在初始確認時應如何進行會計拆分？","options":[{"value":"A","label":"將全部發行所得款項直接確認為單一權益工具"},{"value":"B","label":"先以無轉股權之類似純債務工具市場利率折現計算「負債成分（Liability Component）」的公允價值，再將發行總額扣除該負債成分後的剩餘價值分配予「權益成分（Equity Component）」"},{"value":"C","label":"將全部發行金額先列為權益，每年根據股價波動重估計入損益"},{"value":"D","label":"先評估轉股期權價值列為流動資產，剩餘部分列為長期借款"}],"answer":"B","explanation":"依據 IAS 32「複合金融工具（Compound Financial Instruments）」處理原則，發行人須採用「剩餘價值法（Residual Method）」：先按市場上無換股權的同等級債券折現率計算負債成分現值，發行總收入減去負債成分後的餘額全數劃入權益（股份溢價/資本公積儲備），且後續權益成分不因股價變動重新計量。","reference":""},{"id":"T4-052","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"若某可換股債券設有以「外幣」計價之固定換股價（即發行人的功能性貨幣與換股貨幣不同），在國際會計準則下，該換股權期權（Conversion Option）通常如何分類與計量？","options":[{"value":"A","label":"滿足「以固定金額換固定股數（Fixed-for-Fixed）」原則，全數歸類為權益工具"},{"value":"B","label":"不滿足 Fixed-for-Fixed 原則，必須被視為「嵌入式衍生金融負債（Embedded Derivative Financial Liability）」，後續每一資產負債表日均須按公允價值重估且公允價值變動計入當期損益（FVTPL）"},{"value":"C","label":"自動視為免稅股東權益，毋須作任何重估"},{"value":"D","label":"歸類為無形資產，按五年直線法攤銷"}],"answer":"B","explanation":"由於換股價涉及外幣，當折算為發行人功能性貨幣時，轉換所得股份對應的本幣金額並非固定，違反了 IAS 32 的「Fixed-for-Fixed」條件。因此該換股期權不能列為權益，必須作為衍生金融負債處理，每期期末按公允價值評估並將變動損益計入利潤表。","reference":""},{"id":"T4-053","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"特專科技公司（18C）於未商業化階段上市後，若擬向聯交所申請轉為「商業化公司（Commercial Company）」，其必須符合下列哪項核心財務標準？","options":[{"value":"A","label":"經審計的最近一個財政年度，特專科技業務所產生的收益至少達到 2.5 億港元"},{"value":"B","label":"市值連續 30 個交易日超過 200 億港元且無虧損"},{"value":"C","label":"經營性現金流淨額必須連續三年為正"},{"value":"D","label":"獲得至少三家國際主權基金的控股權收購承諾"}],"answer":"A","explanation":"根據香港《上市規則》第 18C.10 條，未商業化特專科技公司若其特專科技業務在隨後一個經審計的財政年度實現不少於 2.5 億港元的收益，並滿足營運資金等常規規定，可向聯交所申請移除相關限制，正式轉為商業化公司。","reference":""},{"id":"T4-054","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"特專科技公司若未能在上市後規定期限內達到商業化收益門檻，在《上市規則》監管框架下將面臨何種後續監管措施？","options":[{"value":"A","label":"董事會全體成員立即喪失出任董事資格五年"},{"value":"B","label":"聯交所可給予補救期；若在補救期屆滿時仍無法證明具備充足業務運作與資產價值，聯交所有權暫停其股份買賣或啟動取消上市地位程序"},{"value":"C","label":"公司所有銀行賬戶由破產管理署即時接管"},{"value":"D","label":"強制將公司無償移交給香港科技園託管"}],"answer":"B","explanation":"聯交所對 18C 未商業化公司設有持續經營與業務進展考核。若公司在指定年限內無法達成商業化里程碑或持續業務停滯，聯交所將依據持續上市資格條款實施審查，要求限期補救，逾期未改善者可暫停交易乃至除牌。","reference":""},{"id":"T4-055","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"跨境併購交易中常採用的「或有價值權利（Contingent Value Rights, CVR）」或「業績對賭機制（Earn-out Provisions）」，在併購交割後的財務角色為何？","options":[{"value":"A","label":"買方無條件向賣方發行固定本金的高收益無擔保債券"},{"value":"B","label":"根據標的資產在約定期限內是否達成特定營收、淨利潤或監管審批等里程碑，決定後續追加支付對價的或有履約工具"},{"value":"C","label":"賣方無償返還全部收購款項之懲罰條款"},{"value":"D","label":"作為豁免反洗錢反恐審查的金融擔保憑證"}],"answer":"B","explanation":"Earn-out 與 CVR 是橋接買賣雙方估值分歧的重要結構化工具。買方先支付基礎對價，剩餘部分視標的公司未來是否達成指定業績目標（如 FDA 藥物上市許可、約定利潤額）而確定是否支付及支付規模。","reference":""},{"id":"T4-056","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"依據《香港公司收購及合併守則》第 25 條，上市公司在重大收購併購中，若向特定股東提供「附帶有利條件的特別交易（Special Deals with Favourable Conditions）」，該安排必須滿足何種程序？","options":[{"value":"A","label":"僅需取得公司財務總監書面認可"},{"value":"B","label":"必須獲得證監會執行人員的同意，並在股東大會上取得獨立股東的特別決議批准"},{"value":"C","label":"只要該交易金額低於 1 億港元即可完全豁免申報"},{"value":"D","label":"該安排依法絕對禁止，在任何情況下均不可豁免或批准"}],"answer":"B","explanation":"《收購守則》第 25 條嚴格貫徹股東平等待遇原則。收購人或其一致行動人不得向個別股東提供其他人無法享受的優厚安排；若確有商業必要，必須取得證監會執行人員事先核准，並由獨立財務顧問出具意見且經獨立股東投票通過。","reference":""},{"id":"T4-057","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"依據香港稅務法例，香港居民僱員行使上市公司授出之購股權（Share Options）時，應在何種時點確認薪俸稅（Salaries Tax）納稅義務？","options":[{"value":"A","label":"董事會決議採納購股權計劃之日"},{"value":"B","label":"購股權正式獲授（Grant Date）當日"},{"value":"C","label":"僱員正式行使購股權（Exercise Date）之日，按行權日股票市價與行權價之差額計入應課稅入息"},{"value":"D","label":"僱員未來在二級市場將股份售出套現之日"}],"answer":"C","explanation":"根據香港《稅務條例》第 9(1)(d) 條，僱員或董事因受僱而獲授購股權，其應稅事件（Taxable Event）發生在「行使、轉讓或放棄」期權之日。課稅基準為行權當日股份公開市價減去實際支付的行使代價之差額。","reference":""},{"id":"T4-058","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"若上市公司採用「股份獎勵（Share Awards）」方式激勵香港僱員，受託人直接將股份過戶至僱員個人證券賬戶，其稅務入息確認時點通常為：","options":[{"value":"A","label":"僱員退休離職之日"},{"value":"B","label":"該批股份正式歸屬（Vesting Date）且僱員取得無條件受益權之日，按歸屬日股票市價評稅"},{"value":"C","label":"董事會訂立獎勵方案當日"},{"value":"D","label":"公司註銷庫存股份之日"}],"answer":"B","explanation":"限制性股份獎勵在授予時附帶歸屬限制；當滿足服務年限或業績條件、股份正式歸屬給僱員時，僱員即取得實質經濟利益，稅務局以歸屬日（Vesting Date）的股份公平市值（減去僱員支付的任何對價）作為受僱薪俸收入徵稅。","reference":""},{"id":"T4-059","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"目標公司面對敵意收購（Hostile Takeover）時採取的「毒丸防禦（Poison Pill / Shareholder Rights Plan）」，在香港資本市場實務中難以直接落實的核心法規阻礙為何？","options":[{"value":"A","label":"香港普通法全面禁止發行任何衍生工具"},{"value":"B","label":"《香港公司收購及合併守則》第 4 條之「阻撓行動（Frustrating Action）」規定，未經股東大會批准，目標公司董事不得發行新股或採取實質阻礙要約進行的行動"},{"value":"C","label":"聯交所要求所有上市公司每年必須更換全體董事"},{"value":"D","label":"香港金管局禁止非銀行實體發行股份認購權證"}],"answer":"B","explanation":"《收購守則》第 4 條對目標公司董事會設有嚴格的不阻撓行動限制（Frustrating Actions）。一旦收到要約或獲悉要約即將提出，未經股東在股東大會上批准，董事會不得配發新股、發行可換股證券或售出重大資產，因此美式未經股東預先批准的董事會「毒丸」在香港受到嚴厲制約。","reference":""},{"id":"T4-060","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"在併購防禦中，「白衣騎士（White Knight）」策略的主要操作手法是：","options":[{"value":"A","label":"目標公司主動尋求並引入友善的第三方投資者，對目標公司提出競爭性要約或認購具有投票權的關鍵股權以挫敗敵意收購人"},{"value":"B","label":"目標公司董事集體辭職並清算所有實體資產"},{"value":"C","label":"目標公司透過法院向敵意收購人實施人身限制令"},{"value":"D","label":"目標公司直接向全體散戶無償贈送現金資產"}],"answer":"A","explanation":"白衣騎士（White Knight）指被敵意收購的目標公司為抵制不友好收購人，主動物色一個關係友好、認同公司長期價值的第三方買家提出更高要約或策略投資，以此擊退惡意收購者。","reference":""},{"id":"T4-061","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"發行附有「下設換股價重設（Downward Reset）」機制的稀釋性證券時，常引發市場上的「死亡螺旋（Death Spiral Convertible）」，其形成的主因為何？","options":[{"value":"A","label":"債券持有人集體拒絕收取任何利息"},{"value":"B","label":"股價下跌觸發換股價下調，導致可換股數激增；持有人借券拋售壓低股價，進一步觸發換股價再度向下重設，造成股本無限制惡性稀釋與股價暴跌"},{"value":"C","label":"發行人被監管機構即時停牌並罰款"},{"value":"D","label":"銀行收回發行人的所有信用額度"}],"answer":"B","explanation":"無底線下調換股價的可轉債（Death Spiral）會引發惡性循環：投資者先沽空標的股票壓低市價，換股價相應向下重設，債券換取更多新股平倉並繼續拋售，導致現有股東權益面臨災難性稀釋，故聯交所對無限制向下重設條款審查極為嚴格。","reference":""},{"id":"T4-062","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"依據《國際財務報告準則第 2 號》（IFRS 2），以權益結算（Equity-settled）的股份支付交易，其公允價值應以何日之數據為計量基準且後續不作公允價值重估？","options":[{"value":"A","label":"股份正式歸屬日（Vesting Date）"},{"value":"B","label":"授予日（Grant Date）"},{"value":"C","label":"服務期滿日（Service Expiry Date）"},{"value":"D","label":"行使期屆滿日（Lapse Date）"}],"answer":"B","explanation":"根據 IFRS 2，以權益結算的股份支付（如發行新股資助的期權或獎勵），以「授予日（Grant Date）」的公允價值計量，並在等待期（Vesting Period）內直線分攤計入費用與權益儲備，後續資產負債表日不對授予日的公允價值變更進行回溯重估。","reference":""},{"id":"T4-063","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"若上市公司實施由「現金結算（Cash-settled）」的股份增值權（Stock Appreciation Rights, SARs），在 IFRS 2 下的會計處理為何？","options":[{"value":"A","label":"僅需在期末以附註披露，不入賬"},{"value":"B","label":"初始確認為負債，且在後續每個報告期末及結算日，均必須重新計量該負債的公允價值，公允價值變動計入當期損益"},{"value":"C","label":"全數直接計入保留盈餘，永不轉入利潤表"},{"value":"D","label":"視同非流動無形資產逐年攤銷"}],"answer":"B","explanation":"現金結算股份支付（如 SARs）代表企業承擔未來支付現金的合約義務，在資產負債表上列為負債。每期期末必須依最新股票市價與行權條件重新評估該負債公允價值，差額記入當期各期損益。","reference":""},{"id":"T4-064","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"特專科技公司（18C）若擬將首次公開招股（IPO）募集資金用於核心技術的併購，招股書必須詳實披露的內容為：","options":[{"value":"A","label":"擬收購資產的具體遴選標準、技術協同效應評估、研發整合規劃及對商業化進程之推動時程"},{"value":"B","label":"併購顧問團隊的個人所得稅申報記錄"},{"value":"C","label":"被收購方所在地所有競爭對手客戶的名單"},{"value":"D","label":"併購完成後保證不進行任何機構裁員之書面協議"}],"answer":"A","explanation":"聯交所要求特專科技公司募集資金用途必須高度透明且圍繞核心研發戰略。若涉及技術併購，必須深入說明併購目標與現有技術架構的整合可行性、知識產權權屬合規性及對縮短商業化週期的實質幫助。","reference":""},{"id":"T4-065","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"在發行可換股債券時，若包含「發行人強制贖回條款（Clean-up Call）」，該條款通常允許發行人在何種情況下提早贖回剩餘債券？","options":[{"value":"A","label":"債券持有人人數少於 50 人時"},{"value":"B","label":"尚未轉換或贖回的可轉債本金總額已低於初始發行總額的特定極低比例（例如 10%）時，允許發行人將剩餘債券全部贖回註銷"},{"value":"C","label":"國際評級機構調降評級時"},{"value":"D","label":"標的股票停牌超過三個交易日時"}],"answer":"B","explanation":"Clean-up Call 條款旨在降低發行人的行政管理負擔。當市場上絕大部分可轉債已經行使換股或被贖回、流通在外本金餘額不足原發行規模的 10% 時，發行人有權按約定面值加應計利息提早贖回剩餘份額以終結該批債務。","reference":""},{"id":"T4-066","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"依據《香港公司收購及合併守則》，收購防禦手段中的「皇冠上的明珠（Crown Jewel Defense）」是指：","options":[{"value":"A","label":"目標公司將其最核心、最具盈利能力或收購人最渴望取得的資產或業務予以出售或抵押，以降低自身的被收購吸引力"},{"value":"B","label":"向政府捐贈歷史文化遺產"},{"value":"C","label":"公司註冊辦公室搬遷至倫敦金融城"},{"value":"D","label":"全面發行由黃金實物支撐的數字貨幣"}],"answer":"A","explanation":"「皇冠上的明珠（Crown Jewel）」防禦指目標公司出售或剝離收購方最感興趣的核心資產，使收購人喪失併購動機。但在香港市場，此種操作極易觸發《收購守則》第 4 條的「阻撓行動」，若未獲獨立股東批准依法不得執行。","reference":""},{"id":"T4-067","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"關於上市公司「認股權證（Warrants）」與「股票期權（Stock Options）」的法律與發行本質差異，下列敘述何者正確？","options":[{"value":"A","label":"認股權證只能由交易所發行，股票期權由公司發行"},{"value":"B","label":"上市公司發行認股權證行權時，公司配發新股並直接獲得增量資本；而在交易所買賣的標準化股票期權合約是投資者之間的衍生工具交易，行權不為上市公司帶來任何新資本"},{"value":"C","label":"認股權證行權不會擴大公司的發行股本"},{"value":"D","label":"兩者在公司法律與會計核算上沒有任何本質區別"}],"answer":"B","explanation":"認股權證（Company Warrants）由上市公司自身發行，行權時公司發行新股，直接擴大股本並增加公司現金儲備；而交易所場內期權（Exchange-traded Options）是投資者間的衍生金融合約，交易與行權均不影響上市公司的總股本與直接資產。","reference":""},{"id":"T4-068","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"依據《上市規則》第十七章，發行人股份計劃中授出的期權或獎勵，其「業績目標（Performance Targets）」在何種情況下可以被免除或設為「無業績目標」？","options":[{"value":"A","label":"任何情況下均嚴格禁止免除業績目標"},{"value":"B","label":"若薪酬委員會認為符合發行人最佳利益且授出對象能為公司帶來長期價值，可不設定量業績目標，但必須在公告及通函中詳細披露薪酬委員會未設定業績目標的理由及審核基準"},{"value":"C","label":"只要期權行使價溢價 50% 即可自動免除"},{"value":"D","label":"獲得行政總裁個人書面擔保後即可免除"}],"answer":"B","explanation":"《上市規則》第十七章並未強制所有股份激勵必須綁定業績指標，但要求發行人保持高度透明度。若未設業績目標，董事會及薪酬委員會必須在相關披露文件中清晰闡述其商業合理性，並向股東論證該安排如何符合公司整體利益。","reference":""},{"id":"T4-069","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"依據《證券及期貨條例》（SFO），上市公司發行包含衍生架構之可換股債券，若其條款設計實質上意圖製造該股票交易活躍或操縱標的股價之虛假表象，將面臨何種法律後果？","options":[{"value":"A","label":"僅需補繳印花稅"},{"value":"B","label":"觸犯 SFO 第 XIII / XIV 部之市場失當行為（如虛假交易、操縱證券市場），涉案人員須承擔民事審裁處制裁或面臨最高 10 年監禁的刑事指控"},{"value":"C","label":"僅由聯交所處以不超過 1 萬港元的違規罰金"},{"value":"D","label":"相關合約自動視為慈善捐贈"}],"answer":"B","explanation":"利用可換股債券的定價、洗售或配合二級市場拉抬打壓股價，均屬於嚴重的市場失當行為（Market Misconduct）。證監會依法可提起民事市場失當行為審裁處訴訟，或直接由律政司提出刑事檢控，最高可判處 10 年監禁及 1,000 萬港元罰款。","reference":""},{"id":"T4-070","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"在可換股債券結構中，「變動換股率（Floating Conversion Ratio / Market-linked Conversion）」可轉債的主要特點為：","options":[{"value":"A","label":"換股價格固定為發行日收市價"},{"value":"B","label":"換股價格根據轉換日前特定交易日的股票市價按固定折讓率浮動計算，確保投資者換得固定市場價值的股份"},{"value":"C","label":"債券利率隨香港銀行同業拆息（HIBOR）每週重置"},{"value":"D","label":"持有人只能換取外國主權債券"}],"answer":"B","explanation":"浮動換股率可轉債（Floating Ratio Convertible）規定轉換時的股份定價與行權前夕的市價直接掛鈎（如取前 10 天均價的 90%）。這保護了投資者在股價下跌時仍能取得等值股票，但對發行人股東帶來難以預測的極端股權攤薄暴險。","reference":""},{"id":"T4-071","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"特專科技公司（18C）若屬於「未商業化公司」，其招股書必須向公眾投資者特別披露的營運資金證明（Working Capital Statement）期限要求為：","options":[{"value":"A","label":"至少滿足自招股書刊發之日起未來 6 個月的資金需求"},{"value":"B","label":"至少滿足自招股書刊發之日起至少未來 12 個月的資金需求（並計入本次全球發售所得款項之合理預期）"},{"value":"C","label":"至少滿足未來 5 年的現金流支出"},{"value":"D","label":"毋須提供任何營運資金證明"}],"answer":"B","explanation":"根據聯交所常規及 18C 指引，未商業化特專科技公司必須在招股書中載入保薦人及董事確認的營運資金充足陳述，確認發行人在計入全球發售所得款項後，具備足夠營運資金支持自招股文件刊發之日起至少未來 12 個月的經營及研發需求。","reference":""},{"id":"T4-072","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"跨境融資中的「紅籌架構（Red-chip Structure）」境內居民個人若透過離岸可換股工具持有境外上市公司權益，根據中國外匯管理法規，其必須在境內完成何項外匯備案手續？","options":[{"value":"A","label":"國家稅務總局境外所得免稅登記"},{"value":"B","label":"國家外匯管理局（SAFE）「37 號文」境內居民個人境外投資外匯登記（及其後續變更登記）"},{"value":"C","label":"中國人民銀行反洗錢免審備案"},{"value":"D","label":"中國商務部跨境擔保備案"}],"answer":"B","explanation":"根據中國國家外匯管理局發布的《關於境內居民通過特殊目的公司境外投融資及返程投資外匯管理有關問題的通知》（匯發〔2014〕37 號），境內居民個人以境內外合法資產或權益向境外特殊目的公司出資或融資變更時，必須在銀行辦妥 37 號文登記。","reference":""},{"id":"T4-073","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"上市公司依據《上市規則》第十七章設立由新股資助的股份計劃時，該計劃自股東大會批准採納之日起計，其「法定有效運作期限」上限通常為多久？","options":[{"value":"A","label":"3 年"},{"value":"B","label":"5 年"},{"value":"C","label":"10 年"},{"value":"D","label":"永久有效"}],"answer":"C","explanation":"根據《上市規則》第十七章規定，股份計劃（包括購股權計劃及股份獎勵計劃）自採納生效之日起，有效期原則上最長不得超過 10 年。期滿後發行人不得再依據該計劃授出任何新期權或獎勵，但已授出的期權依合約條款繼續有效。","reference":""},{"id":"T4-074","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"根據《香港公司收購及合併守則》第 31.1 條，若某項自願全面要約（Voluntary General Offer）未能成功並最終失效，在未經證監會執行人員同意的情況下，要約人及其一致行動人在要約失效後多久內不得再次對同一目標公司提出要約？","options":[{"value":"A","label":"3 個月"},{"value":"B","label":"6 個月"},{"value":"C","label":"12 個月"},{"value":"D","label":"24 個月"}],"answer":"C","explanation":"《收購守則》第 31.1 條設立「12 個月冷卻期（Cooling-off Period）」。若收購要約撤回或失效，要約人及其一致行動人士自要約失效日起 12 個月內，不得就目標公司股份提出新要約，亦不得購入取得足以觸發強制全面要約義務的股份份額。","reference":""},{"id":"T4-075","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"在結構化債券合約中，「資產負債率契約（Gearing Ratio Covenant）」通常對發行人施加何種法律約束？","options":[{"value":"A","label":"限制發行人的研發技術轉讓"},{"value":"B","label":"約定發行人的計息債務總額與股東權益（或總資產）的比率不得超過特定上限，若違反且未在寬限期內補救則構成違約事件"},{"value":"C","label":"限制發行人董事的個人信用卡信用額度"},{"value":"D","label":"約定發行人的每年產品退貨率不高於 1%"}],"answer":"B","explanation":"財務契約（Financial Covenants）是保護固定收益債券及可轉債投資者的核心條款，資產負債率/槓桿比率契約限制企業過度舉債，一旦指標突破合約上限且未能在約定 Cure Period 內糾正，受託人有權宣告債券違約並立即加速到期。","reference":""},{"id":"T4-076","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"根據《國際會計準則第 33 號》（IAS 33），上市公司計算「攤薄每股盈利（Diluted EPS）」時，其發行在外的可換股債券應採用何種假設方法進行調整？","options":[{"value":"A","label":"歷史成本計量法"},{"value":"B","label":"反向回購假設法"},{"value":"C","label":"「假設轉換法（If-Converted Method）」：假設債券在期初（或發行日）即已全數轉換為普通股，分子加上稅後利息支出，分母加上假設換股後的新增普通股加權平均數"},{"value":"D","label":"破產清算現金分配法"}],"answer":"C","explanation":"IAS 33 規定計算 Diluted EPS 時，具稀釋性的可轉債採用 If-Converted Method：假設債券在當期最早可行權日已轉換，將因換股而節省的稅後利息回加至歸屬於普通股東的利潤（分子），同時在分母中加入該債券可換得的股份加權平均數。","reference":""},{"id":"T4-077","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"當某可換股債券在計算每股盈利時，調整後的稀釋每股盈利「高於」基本每股盈利（Basic EPS），該可換股債券在 IAS 33 下應被認定為：","options":[{"value":"A","label":"深度實值金融資產"},{"value":"B","label":"具備高度稀釋性工具"},{"value":"C","label":"「具反稀釋性工具（Anti-dilutive）」，在最終計算列報的稀釋每股盈利中不得將其計入調整範圍"},{"value":"D","label":"流動性違約資產"}],"answer":"C","explanation":"根據 IAS 33，當潛在普通股的納入會增加每股收益或減少每股虧損時，該工具構成「反稀釋（Anti-dilutive）」。為遵循審慎原則，計算稀釋每股盈利時嚴格禁止納入反稀釋性工具，應以基本每股盈利為準列報。","reference":""},{"id":"T4-078","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"依據香港《上市規則》第 14.06 條，上市公司進行反向收購（Reverse Takeover, RTO，即借殼上市）時，聯交所將如何處置該收購交易？","options":[{"value":"A","label":"僅需刊發普通須予披露交易公告即可完成"},{"value":"B","label":"視同新上市申請，發行人（或被注入資產）必須完全符合《上市規則》第八章所有新上市要求（包括業務記錄、管理層穩定性及保薦人盡職審查），並刊發符合招股書規格的上市通函"},{"value":"C","label":"直接沒收上市公司控股股東的股權"},{"value":"D","label":"豁免聘請獨立財務顧問與保薦人"}],"answer":"B","explanation":"聯交所對反向收購（RTO）採取嚴格穿透監管。任何重大收購連同控股權轉變（或在控制權變動後 36 個月內進行的大規模資產注入），實質上使發行人規避了 IPO 審查，聯交所強制將其視為「新上市申請（New Listing Application）」，各項財務指標與合規門檻等同 IPO。","reference":""},{"id":"T4-079","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"在併購實務中，「跳樓價期權 / 突圍期權（Break Fee / Termination Fee）」條款的合規邊界，在《香港公司收購及合併守則》第 20.3 條下的主要規範是：","options":[{"value":"A","label":"終止費用可以無限大，以徹底阻嚇競爭對手"},{"value":"B","label":"終止費用金額通常不得超過要約價值（Offer Value）的 1%，且目標公司董事會與財務顧問必須確認該費用符合全體股東利益"},{"value":"C","label":"終止費用只能以公司固定資產作為實物支付"},{"value":"D","label":"終止協議簽訂後不得向公眾披露"}],"answer":"B","explanation":"《收購守則》第 20.3 條規定，終止費（Break Fee）為防止不當損害目標公司股東利益，金額必須微小且合理，通常最高不超過要約總價值的 1%，並須在公告中披露其條款與確認該安排對股東公允合理。","reference":""},{"id":"T4-080","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"股份獎勵計劃受託人（Trustee）在資本市場運作中，若於發行人即將刊發年度業績的「黑期 / 禁售期（Black-out Period）」內在二級市場進場買賣該發行人股份，該行為在監管層面：","options":[{"value":"A","label":"完全自由，受託人不受上市規則黑期約束"},{"value":"B","label":"嚴格受限，受託人若接獲發行人指示或資金進場，發行人及其受託人同樣不得在內幕消息未公佈前或黑期內進行任何股份買賣，否則發行人構成違規且可能涉嫌內幕交易"},{"value":"C","label":"只要買入金額低於 500 萬港元即可豁免"},{"value":"D","label":"只要事前通報公司審計委員會即可在黑期內任意交易"}],"answer":"B","explanation":"《上市規則》第 10.06 條及標準守則（Model Code）規範發行人回購與董事交易。股份激勵信託雖由受託人名義持有，但若受託人的買入係根據公司指令或注入資金運作，在業績公佈前的禁售期（Black-out Period）或存在內幕消息時，一律不得在市場上購股，避免違反內幕交易與上市合規規範。","reference":""},{"id":"T4-081","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"根據香港《上市規則》第十八章C，未商業化特專科技公司上市申請時，其「核心研發人員」持股比例或股權激勵安排應達到的監管預期是：","options":[{"value":"A","label":"核心研發人員必須全數交出股份由政府監管"},{"value":"B","label":"必須證明關鍵發明人、首席架構師等核心團隊持有實質性股權或具有長期未歸屬期權，以確保技術穩定性與利益一致性"},{"value":"C","label":"核心研發人員在上市前不得享有任何期權激勵"},{"value":"D","label":"研發人員必須簽署無償轉讓協議將期權轉給包銷商"}],"answer":"B","explanation":"18C 公司高度依賴核心智力資本。聯交所特別審查關鍵研發人員（Key Technology Personnel）的留任機制，要求透過具足夠激勵深度的股權或期權架構（綁定合理 Vesting 條件），確保核心科研人員在上市後持續履職。","reference":""},{"id":"T4-082","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"在私募股權與創投融資的可換股工具中，「完全棘輪條款（Full-Ratchet Anti-dilution）」與「加權平均條款（Weighted-Average Anti-dilution）」的核心差別在於：","options":[{"value":"A","label":"完全棘輪條款直接將換股價格下調至後續融資發行的新股最低價格，而加權平均條款則綜合考量新增發行規模與價格稀釋比例對原換股價進行平滑修正"},{"value":"B","label":"加權平均條款完全不保護投資者"},{"value":"C","label":"完全棘輪條款只保護控股股東的利益"},{"value":"D","label":"加權平均條款強制要求全體董事賠償投資者差價"}],"answer":"A","explanation":"Full-Ratchet 極其嚴苛，只要後續融資單價低於原定價，換股價立即無條件降至該最低發行價；而 Weighted-Average 公式則會依據「新增融資的規模」與「原股本比例」進行加權平滑計算，減緩對普通股東的毀滅性稀釋。","reference":""},{"id":"T4-083","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"依據《香港公司收購及合併守則》第 2 條，當獨立董事委員會（IBC）就收購要約向獨立股東提供推薦意見時，該委員會的組成原則為：","options":[{"value":"A","label":"必須由公司全體執行董事組成"},{"value":"B","label":"必須由公司所有在該項要約中「無直接或間接利害關係」的獨立非執行董事（INEDs）組成"},{"value":"C","label":"必須由收購人提名的代表全權組成"},{"value":"D","label":"只能由持有公司股份超過 5% 的股東代表組成"}],"answer":"B","explanation":"獨立董事委員會（Independent Board Committee, IBC）旨在向無利害關係的獨立股東提供公正意見。因此，IBC 成員必須全數由在要約中無任何重大利害關係的獨立非執行董事出任；若某 INED 存在利益衝突，依法不得加入該委員會。","reference":""},{"id":"T4-084","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"某上市公司發行 3 年期、票面年息 4% 的可換股債券，面值 100 港元。發行時類似風險等級但無轉股權的普通債券市場公允折現率為 8%。若按年付息，該可換股債券在初始確認時每張債券的「負債成分現值」最接近：","options":[{"value":"A","label":"100.00 港元"},{"value":"B","label":"89.69 港元"},{"value":"C","label":"112.50 港元"},{"value":"D","label":"75.00 港元"}],"answer":"B","explanation":"每張債券每年利息 = 100 * 4% = 4 港元。負債現值 PV = 4/(1+0.08)^1 + 4/(1+0.08)^2 + 104/(1+0.08)^3 = 3.70 + 3.43 + 82.56 = 89.69 港元。剩餘的 100 - 89.69 = 10.31 港元確認為權益儲備。","reference":""},{"id":"T4-085","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"發行人將可換股債券於到期日前提前贖回並註銷時，若支付的贖回代價高於當時負債成分的賬面價值，該差額的財務會計處理應為：","options":[{"value":"A","label":"全數作為公司營業外收入列報"},{"value":"B","label":"將贖回總對價先行分拆至負債與權益兩部分：分攤至負債的贖回損益計入當期損益，分攤至權益的差額則直接計入權益科目（資本公積）"},{"value":"C","label":"直接沖減公司的實收註冊資本"},{"value":"D","label":"列入遞延資產分十年攤銷"}],"answer":"B","explanation":"依據 IAS 32 指引，提前清償複合金融工具時，發行人支付的代價與交易費用須在負債與權益成分之間按當日公允價值進行分攤。負債成分的差額確認為重組終止損益（Profit or Loss），權益成分的差額直接在權益儲備內結轉。","reference":""},{"id":"T4-086","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"上市公司依據《上市規則》回購自身股份時，若將回購股份於結算後直接註銷，其股本與資產負債表結構將發生何種變化？","options":[{"value":"A","label":"總資產減少（現金流出），已發行股份數相應減少，總權益等額縮減"},{"value":"B","label":"總資產增加，股本總數不變"},{"value":"C","label":"負債總額暴增，股東權益大幅攀升"},{"value":"D","label":"不產生任何資產負債表實質變化"}],"answer":"A","explanation":"傳統回購註銷以現金支付回購代價，資產端銀行存款減少；權益端對應的面值扣減股本（或香港無面值制下的股本總額），超出面值或成本的溢價自可供分派利潤或股份溢價中扣除，總股本與淨資產同步縮減。","reference":""},{"id":"T4-087","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"跨境融資架構中的「雙重結構性票據（Dual-Tranche Structured Notes）」常將普通債券與場外衍生期權打包。發行人在此類結構中對沖股票價格波動風險最常用的金融工程手段是：","options":[{"value":"A","label":"買入看跌期權（Put Option）或訂立股票遠期合約（Equity Forward / Collar Strategy）"},{"value":"B","label":"無限制進行高頻量化投機"},{"value":"C","label":"立即在二級市場進行全額股份回購並銷毀"},{"value":"D","label":"變賣海外子公司廠房以換取現金"}],"answer":"A","explanation":"在結構化發行中，發行人或投行通常利用衍生工具組合（如買入買權 Call Spread、訂立領子期權 Collar 或透過 Delta Dynamic Hedging）鎖定潛在股價波動對自身股本稀釋或現金結付責任帶來的市場風險。","reference":""},{"id":"T4-088","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"依據《香港公司收購及合併守則》第 26 條，觸發「強制全面要約（Mandatory General Offer, MGO）」的關鍵法定門檻（Creeping Rule 及 Initial Threshold）分別為：","options":[{"value":"A","label":"持股達到 20%，或在 20%-30% 之間每年增持超過 1%"},{"value":"B","label":"一個人或一致行動人士持股達到或超過 30%，或持有 30% 至 50% 之間每年增持超過 2%（自由增購率）"},{"value":"C","label":"持股達到 50% 以上，且每年增持超過 5%"},{"value":"D","label":"持股達到 10% 即自動觸發"}],"answer":"B","explanation":"《收購守則》第 26.1 條規定兩大強制要約觸發點：(1) 持有具投票權股份首次達到 30%；(2) 若原已持有 30% 至 50% 的投票權，在任何 12 個月期間內增持超過 2%（即 Creeping Rule 自由爬行條款）。","reference":""},{"id":"T4-089","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"在收購交易中，要約人若以「可換股優先股（Convertible Preferred Shares）」作為收購對價支付給目標公司股東，此種對價結構的優勢是：","options":[{"value":"A","label":"要約人完全毋須在香港公司註冊處辦理股本變更"},{"value":"B","label":"既避免了要約人即時承受巨額現金支付與高負債壓力，又賦予目標公司股東固定的優先股息回報與未來分享合併後公司股價升值的選擇權"},{"value":"C","label":"目標公司股東依法完全免除香港印花稅"},{"value":"D","label":"徹底規避證監會的所有審查管轄"}],"answer":"B","explanation":"以可換股優先股作為併購對價（Equity Consideration），可減輕買方現金流負擔，同時其優先股息與清償順位為賣方提供下行保護，轉股權則提供上行資本收益彈性，是平衡各方估值與風險預期的經典併購對價模式。","reference":""},{"id":"T4-090","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"特專科技公司（18C）若在上市後連續虧損且特專科技業務停滯，若擬更換其主營業務轉型為一般房地產物業投資，聯交所將如何處置？","options":[{"value":"A","label":"聯交所自動予以支持並提供稅收減免"},{"value":"B","label":"該業務巨變將直接觸發「主要業務根本轉變」條款，可能導致公司失去 18C 資格並被視為新上市申請（或因未能維持合適主營業務而被勒令停牌）"},{"value":"C","label":"僅需向香港地政總署報備即可"},{"value":"D","label":"董事會全體通過即可自由轉型，聯交所完全無權介入"}],"answer":"B","explanation":"18C 公司係基於特專科技產業資質獲得豁免盈利門檻上市。若其在上市後放棄或喪失核心特專科技業務，實質上動搖了其上市基礎，聯交所有權依據業務適宜性條款將其停牌或啟動反向收購/除牌審查。","reference":""},{"id":"T4-091","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"依據《上市規則》第十七章，發行人向其控股股東（或其緊密聯繫人）授出任何由新股資助的股份獎勵時，下列哪項審批條件為必須滿足的法律程序？","options":[{"value":"A","label":"董事會普通決議通過即可，且該控股股東有權參與投票"},{"value":"B","label":"必須經薪酬委員會與全體獨立非執行董事批准，並刊發通函經股東大會以投票表決方式通過，該控股股東及其聯繫人必須放棄表決權"},{"value":"C","label":"必須由行政總裁個人名義向法庭提請確認"},{"value":"D","label":"只要該控股股東不收取現金分紅即可免除股東大會審批"}],"answer":"B","explanation":"控股股東為上市公司的核心關連人士。向其授出股份獎勵涉及重大關連交易及潛在股權稀釋，第十七章嚴格規定必須獲得全體 INED 事先同意，並刊發包含獨立財務顧問意見的通函，提呈股東大會由獨立股東投票表決，關連方全數迴避。","reference":""},{"id":"T4-092","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"併購防禦機制中的「金降落傘（Golden Parachute）」協議，其本質特徵與法律風險主要在於：","options":[{"value":"A","label":"為公司全體基層員工發放黃金實物獎金"},{"value":"B","label":"在公司控制權發生變更時，為現有高級管理人員提供異常高額的解聘離職補償金；該條款若過度優厚，極易被指控違反董事信託責任並遭獨立股東或監管機構質疑"},{"value":"C","label":"強制敵意收購人賠償目標公司過去十年的全部廣告支出"},{"value":"D","label":"向聯交所繳納的保證金合約"}],"answer":"B","explanation":"金降落傘條款常被惡意收購防禦方用以抬高收購人接管更換管理層的成本。但在香港普通法體系下，董事負有恪盡信託責任（Fiduciary Duty）之義務，過分誇張的離職補償會被法庭認定為中飽私囊或不當阻撓，可能被裁定無效。","reference":""},{"id":"T4-093","topic":"Topic 4","subtopic":"General","difficulty":"未分類","question":"可換股債券的「凸性（Convexity）」特徵，在固定收益與衍生工具風險管理中代表何種含義？","options":[{"value":"A","label":"債券價格與利率呈嚴格的直線對稱關係"},{"value":"B","label":"當標的股價上漲時，CB 價格加速跟漲；當標的股價下跌時，CB 因債底（Bond Floor）支撐而跌幅趨緩，呈現「非對稱性」的優良回報分佈"},{"value":"C","label":"債券價值只跌不漲的下行風險指標"},{"value":"D","label":"公司違約概率的加速度"}],"answer":"B","explanation":"可轉債兼具債性與股性，具備正向凸性（Convexity）：當股價大幅上漲時，轉股期權進入深度實值，CB 表現出強烈股性向上加速；當股價崩跌時，債券的面值純債價值提供支撐（Bond Floor），下行受限。","
