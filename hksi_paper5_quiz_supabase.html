司條例》ss. 673–674 指明：協議安排私有化屬於司法重組程序，在股東大會以特定多數通過後，必須呈交高等法院進行實質聆訊並取得法庭認可令（Court sanction），方告正式生效。","reference":"Companies Ordinance s.674; HKSI Paper 5 Guide Topic 1 Section 3.63; Topic 2 Section 7.33"},{"id":"T3-097","topic":"Topic 3","subtopic":"Takeovers Code - Dealings Disclosure Deadlines under Rule 22","difficulty":"Level 2","question":"在收購要約期內，受規管人士（如持股 5% 以上大股東或顧問）在交易日進行了目標公司股份交易。根據《收購守則》第 22 條，其向證監會提交交易披露報表的具體時限為：","options":[{"value":"A","label":"在交易發生後 30 天內"},{"value":"B","label":"不得遲於進行該項交易的營業日緊接之後的下一個營業日上午 12 時正（Not later than 12:00 noon on the business day following the date of the transaction）"},{"value":"C","label":"在要約結束當天午夜前"},{"value":"D","label":"在下一財政年度年報發布時"}],"answer":"B","explanation":"Takeovers Code Rule 22.1 指明：Rule 22 交易申報時效極高，凡在要約期進行受規管買賣，必須在交易日之後的下一個營業日中午 12:00 前（Not later than 12:00 noon on next business day）呈交證監會並公開發布。","reference":"Takeovers Code Rule 22.1; HKSI Paper 5 Guide Topic 3 Section 4.53"},{"id":"T3-098","topic":"Topic 3","subtopic":"Exempt Fund Managers and Principal Traders (Rule 22)","difficulty":"Level 3","question":"大型綜合金融機構在擔任收購要約人的財務顧問時，其旗下的自營交易部與基金管理部若擬免除被直接視為要約人一致行動人士的嚴厲買賣限制，可向證監會執行人員申請獲得何種特殊監管地位？","options":[{"value":"A","label":"獲豁免基金經理（EFM）及獲豁免自營買賣商（EPT）地位（Exempt fund manager and exempt principal trader status）"},{"value":"B","label":"外交豁免權地位"},{"value":"C","label":"永久免繳印花稅商戶地位"},{"value":"D","label":"海外主權投資機構地位"}],"answer":"A","explanation":"依據 Takeovers Code Definitions 及實務指引：持牌金融集團可向執行人員申請取得「獲豁免基金經理」（EFM）及「獲豁免自營買賣商」（EPT）認可，證明其設有有效中國牆且獨立營運，其日常代客或做市交易可享有免除一致行動強要關聯的特定豁免待遇。","reference":"Takeovers Code Definitions; HKSI Paper 5 Guide Topic 3 Section 4.21"},{"id":"T3-099","topic":"Topic 3","subtopic":"Equality of Treatment - Share Classes with Different Voting Rights","difficulty":"Level 3","question":"受要約公司發行了具備不同投票權架構的 Class A（普通股）與 Class B（每股 10 票特權股）。要約人對受要約公司提出全面收購要約時，根據《收購守則》第 14 條及一般原則 1，要約人對不同類別股份的作價原則為：","options":[{"value":"A","label":"特權股必須強制按普通股的十倍價格收購"},{"value":"B","label":"要約人必須對每一類別股份均提出要約，且不同類別要約條款必須具備可比性（Comparable offer），作價應以各類別股份所附帶的相對表決權及經濟利益為客觀依據並事先諮詢執行人員"},{"value":"C","label":"要約人可以完全拒絕收購特權股份"},{"value":"D","label":"特權股份必須強制無償註銷"}],"answer":"B","explanation":"指南 3-28 頁 4.45 節及 Takeovers Code Rule 14 規定：存在不同投票權類別時，要約人必須提出相若對等要約（Comparable offer），且不同類別的定價公式應客觀反映投票權及經濟利益對比，必須及早向執行人員提呈以獲取認可。","reference":"Takeovers Code Rule 14; HKSI Paper 5 Guide Topic 3 Section 4.45"},{"id":"T3-100","topic":"Topic 3","subtopic":"Summary of Topic 3 - Core Objectives of Code Administration","difficulty":"Level 2","question":"綜合香港《收購守則》與《股份回購守則》的全面架構，證監會企業融資部、收購委員會及收購上訴委員會在共同管理該等《守則》時，所捍衛的最根本核心宗旨為：","options":[{"value":"A","label":"全面禁止任何外資機構收購香港本土企業"},{"value":"B","label":"確保全體受影響股東獲得公平平等的待遇、確保市場具備充分透明度與及時準確的資訊以作出明智投資決定，並為收購、合併及股份回購活動提供一個井然有序的監管架構（Orderly framework）"},{"value":"C","label":"保證所有上市公司股價在收購要約公布後立即上漲 50%"},{"value":"D","label":"直接代行全體少數股東行使股份投票權"}],"answer":"B","explanation":"指南 1-36 至 1-37 頁 4.35 節、3-3 頁 1.2 節及《守則》導言總結其三大核心基石：(a) 確保股東獲公平同等待遇；(b) 確保及時充分披露以助明智決策，避免虛假市場；(c) 為收購合併及回購提供有序運作的監管框架。","reference":"Takeovers Code Introduction para 1.2; HKSI Paper 5 Guide Topic 1 Section 4.35; Topic 3 Section 1.2"},{"id":"T3-101","topic":"Topic 3","subtopic":"Mandatory Offer - Indirect Holding and Intermediate Entities","difficulty":"Level 3","question":"甲投資者透過全資擁有的海外公司 A 持有香港上市公司乙 25% 的有投票權股份。甲隨後收購了海外公司 B 的 100% 股權，而海外公司 B 獨立持有乙公司 6% 的有投票權股份。根據《收購守則》第 26 條，甲在完成收購海外公司 B 後：","options":[{"value":"A","label":"無須履行任何義務，因為海外公司 A 及 B 是不同司法管轄區的獨立法人"},{"value":"B","label":"必須立即向乙公司全體其他股東發出強制全面收購要約，因為甲直接與間接控制乙公司的投票權總額已達到 31%（跨越 30% 門檻）"},{"value":"C","label":"只要將海外公司 B 轉讓給直系親屬，即可免除全面要約義務"},{"value":"D","label":"僅需在乙公司下一次股東週年大會上作口頭申報"}],"answer":"B","explanation":"根據《收購守則》第 26 條及學習指南 3-21 頁 4.18 節，計算 30% 觸發門檻時，必須穿透所有中間持股實體，將該人士直接及間接控制的所有投票權（連同一致行動人士）合併計算。甲透過海外公司 A 及 B 合計控制乙公司 25% + 6% = 31% 投票權，已跨越 30% 觸發線，必須履行強制全面收購要約義務。","reference":"Takeovers Code Rule 26.1; HKSI Paper 5 Guide Topic 3 Section 4.18"},{"id":"T3-102","topic":"Topic 3","subtopic":"Acting in Concert - Borrowing and Lending of Shares","difficulty":"Level 3","question":"在收購要約期內，某要約人的一致行動人士將其持有的受要約公司股份借予第三方進行借貸交易（Stock Lending）。根據《收購守則》實務指引，借出股份在此背景下的表決權歸屬與合規影響為：","options":[{"value":"A","label":"借出的股份在要約期間被視為自動註銷"},{"value":"B","label":"借出股份的人士通常被視為已暫時失去該等股份的投票權控制；但若其在要約截止前召回該等股份，相關股份仍計入其一致行動持倉，且任何借貸安排必須向執行人員充分披露"},{"value":"C","label":"借入人自動被推定為與要約人一致行動且嚴禁在市場拋售"},{"value":"D","label":"借股行為在收購期間自動構成刑事犯罪"}],"answer":"B","explanation":"依據《收購守則》第 22 條註釋及實務指引：收購期間涉及相關證券的借貸（Stock borrowing and lending）會實質改變投票權分佈，借出方與借入方均負有嚴格的披露責任；借出股份在未被召回期間不得被借出方用於行使表決權以支持要約。","reference":"Takeovers Code Rule 22 Note; HKSI Paper 5 Guide Topic 3 Section 4.53"},{"id":"T3-103","topic":"Topic 3","subtopic":"Dealings Before and During Offer - Restrictions on Selling Target Shares","difficulty":"Level 3","question":"根據《收購守則》第 21.2 條，要約人及其一致行動人士在公布一項收購要約後，於要約期內在市場「出售」（Selling）受要約公司股份受到何種嚴格規限？","options":[{"value":"A","label":"要約人可以隨意在市場拋售受要約公司股份以鎖定利潤"},{"value":"B","label":"要約人及其一致行動人士嚴禁在要約期內出售受要約公司的任何證券，除非事先取得執行人員的正式同意，且必須至少提前 24 小時發布公告通知市場"},{"value":"C","label":"只要出售價格高於要約價即可自由出售"},{"value":"D","label":"要約人僅能將股份出售給受要約公司的獨立董事"}],"answer":"B","explanation":"指南 3-14 頁 3.28 節及 Takeovers Code Rule 21.2 規定：要約人或其一致行動人在要約期內出售目標公司證券原則上被嚴格禁止（防止要約人邊發出要約邊在二級市場套現離場誤導投資者）；若確有特殊需要，必須經執行人員事先批准並給予市場充分預先公告。","reference":"Takeovers Code Rule 21.2; HKSI Paper 5 Guide Topic 3 Section 3.28"},{"id":"T3-104","topic":"Topic 3","subtopic":"Mandatory Offer - Inadvertent Trigger and Disposal Option","difficulty":"Level 3","question":"某投資者因計算失誤，在市場買入股份後不慎使其持股達到 30.1%（非故意觸發 Rule 26 強要義務）。該投資者立即主動向證監會執行人員報告。根據《收購守則》第 26.1 條註釋，執行人員在何種條件下可考慮免除其全面要約義務？","options":[{"value":"A","label":"只要該投資者承諾未來三年內不再買賣該股票即可免除"},{"value":"B","label":"若執行人員信納該觸發純屬無心之失（Inadvertent），且該投資者在極短期限內（通常由執行人員指定的時間內）將超額持股出售給完全無關聯的獨立第三方，使持股降回 30% 以下，且在此期間未行使任何表決權"},{"value":"C","label":"任何情況下均絕對不可免除，該投資者必須發出全面要約"},{"value":"D","label":"該投資者必須向聯交所繳納相當於市值 10% 的罰款"}],"answer":"B","explanation":"指南 3-23 頁 4.25 節及 Takeovers Code Rule 26.1 Note 1 指明：對於純屬疏忽或意外（Inadvertent mistake）導致跨越 30% 或 2% 門檻的情況，若當事人即時自首且迅速在市場將超額股份減持至門檻以下，且在此期間未行使表決權，執行人員可運用酌情權豁免其發出全面要約的責任。","reference":"Takeovers Code Rule 26.1 Note 1; HKSI Paper 5 Guide Topic 3 Section 4.25"},{"id":"T3-105","topic":"Topic 3","subtopic":"Voluntary Offers - Shutting off Acceptance Condition","difficulty":"Level 3","question":"在附帶 50% 最低接納條件的自願全面要約中，要約人若擬在宣布要約成為無條件後加速關閉要約，根據《收購守則》第 15.2 條及第 15.3 條，要約人必須遵循的程序是：","options":[{"value":"A","label":"在跨越 50% 門檻當天下午 4:00 立即停止接納"},{"value":"B","label":"即使要約已在接納上成為無條件，要約必須維持向股東開放接納至少 14 天；若要約人在發出要約時已明確發布了不延長聲明（No extension statement），則要約將於該預設截止日關閉，但仍須確保符合至少 14 天的開放期"},{"value":"C","label":"要約人有權隨時以口頭通知終止要約"},{"value":"D","label":"接納期必須強制持續滿 120 天"}],"answer":"B","explanation":"指南 3-30 頁 4.49 節及 Rule 15.2/15.3 規定：要約在接納上成為無條件後，必須至少維持開放 14 天，除非要約人先前已在通告中明確指出該截止日期為最終截止日（且股東在該決定前已享有至少 14 天通知期），確保少數股東權益不被突襲終止。","reference":"Takeovers Code Rules 15.2, 15.3; HKSI Paper 5 Guide Topic 3 Section 4.49"},{"id":"T3-106","topic":"Topic 3","subtopic":"Target Board - Frustrating Action Asset Disposal Thresholds","difficulty":"Level 3","question":"受要約公司董事會若在要約期內擬出售一項資產，在評估該出售是否構成《收購守則》第 4 條下的受禁「重大資產處置」（Disposal of assets of a material amount）時，執行人員通常參考的量化標準為：","options":[{"value":"A","label":"資產價值佔公司總資產 0.1% 以上即構成重大處置"},{"value":"B","label":"該資產的價值、盈利或收益佔受要約公司相關合併財務指標通常達到 10% 或以上（Normally 10% or more），或該資產對受要約公司而言具備關鍵策略意義"},{"value":"C","label":"必須達到聯交所非常重大出售事項（75%）的標準方構成重大處置"},{"value":"D","label":"僅以資產的實物體積大小作為判定依據"}],"answer":"B","explanation":"Takeovers Code Rule 4 Note 2 指明：在判定第 4 條防礙行動時，重大資產處置（Material amount）通常參照 10% 的相對比率門檻（低於上市規則主要交易的 25% 門檻）；只要資產、利潤或代價相對比率達 10% 或以上，未經股東大會批准即構成受禁防礙行動。","reference":"Takeovers Code Rule 4 Note 2; HKSI Paper 5 Guide Topic 3 Section 3.30"},{"id":"T3-107","topic":"Topic 3","subtopic":"Irrevocable Undertakings by Target Shareholders","difficulty":"Level 2","question":"在收購要約公布前，要約人自受要約公司的主要股東處獲取了「不可撤銷的接納承諾」（Irrevocable Undertakings）。關於此類承諾在《收購守則》下的監管要求，下列何者正確？","options":[{"value":"A","label":"該承諾必須嚴格對公眾保密，嚴禁在任何文件中披露"},{"value":"B","label":"要約公告（Rule 3.5）及要約文件中必須詳盡披露該不可撤銷承諾的具體股數、百分比及所有重大條款（包括在何種條件下該承諾可能失效，如出現更高競爭要約時）"},{"value":"C","label":"不可撤銷承諾在香港法律下屬違法合約，不具任何約束力"},{"value":"D","label":"簽署該承諾的股東自動免繳所有證券印花稅"}],"answer":"B","explanation":"指南 3-6 頁 2.7 節（原則 6）及 Takeovers Code Rule 3.5(f) 規定：不可撤銷承諾必須在正式要約公布中全面透明披露，包括所涉股權數量、有效期限以及是否包含「更高報價即解除承諾」（Out-clause）的關鍵條件，防止形成不對稱資訊市場。","reference":"Takeovers Code Rule 3.5(f); HKSI Paper 5 Guide Topic 3 Section 2.7"},{"id":"T3-108","topic":"Topic 3","subtopic":"Statements of Intention regarding Target Business and Employees","difficulty":"Level 2","question":"根據《收購守則》第 26 條及附錄三，要約人在其要約文件中，就受要約公司業務及僱員安排負有何種強制性「意向聲明」（Statements of Intention）披露責任？","options":[{"value":"A","label":"要約人必須承諾未來十年內不解僱任何目標公司基層員工"},{"value":"B","label":"要約人必須披露其對受要約公司現有業務的持續經營意向、重大固定資產重新部署計劃，以及對受要約公司及其附屬公司管理層與僱員就業待遇的具體意向說明"},{"value":"C","label":"要約人無須披露任何未來計劃，商業計劃純屬內部機密"},{"value":"D","label":"要約人必須承諾將受要約公司總部遷出香港"}],"answer":"B","explanation":"指南 3-6 頁 2.7 節（原則 5）及 Takeovers Code Schedule I 指明：要約文件必須清晰披露要約人對目標公司的意向（Intentions regarding business and employees），使股東在決定是否出售股份時，能充分預知收購對公司業務延續性及員工團隊的實質影響。","reference":"Takeovers Code Schedule I; HKSI Paper 5 Guide Topic 3 Section 2.7"},{"id":"T3-109","topic":"Topic 3","subtopic":"Whitewash Waiver - Retention of Voting Rights by Concert Parties","difficulty":"Level 3","question":"某認購方擬透過認購新股取得目標公司 40% 股權並申請清洗豁免。該認購方在目標公司股東大會召開時，名下持有目標公司原有的 5% 舊股。在清洗豁免決議案的投票表決中，該 5% 舊股的表決權處理方式為：","options":[{"value":"A","label":"該 5% 舊股有權正常投票贊成清洗豁免決議案"},{"value":"B","label":"該 5% 舊股依法必須放棄表決權（Must abstain from voting），因為認購方及其一致行動人士在該項清洗豁免交易中擁有重大利益"},{"value":"C","label":"該 5% 舊股自動轉為支持票"},{"value":"D","label":"該 5% 股份必須在會前無償註銷"}],"answer":"B","explanation":"指南 3-25 頁 4.35 節及 Takeovers Code Schedule VI 指明：清洗豁免的核心制度保護在於由「獨立股東」（Independent shareholders）決定是否免除強要責任。任何將在交易中獲取利益的認購人、要約方及其任何一致行動人士，名下持有的全部既有股份均必須嚴格放棄表決權。","reference":"Takeovers Code Schedule VI; HKSI Paper 5 Guide Topic 3 Section 4.35"},{"id":"T3-110","topic":"Topic 3","subtopic":"Takeovers Code Rulings - Redaction and Publication","difficulty":"Level 2","question":"當收購及合併委員會（Panel）就某項重大收購爭端作出正式紀律裁決或重大原則裁定後，該裁決在市場公示層面的處理程序為：","options":[{"value":"A","label":"裁決列為終身絕密，僅當事人私下知悉"},{"value":"B","label":"委員會通常會發布公開裁決理由書（Panel Statement），在隱去極度敏感的個人商業隱私後向公眾全面刊登，以確立市場執法先例並引導業界合規"},{"value":"C","label":"裁決必須呈交聯合國秘書長備案"},{"value":"D","label":"裁決結果只能以加密代碼形式發布"}],"answer":"B","explanation":"指南 3-4 頁 1.8 節及 3-38 頁 7.15 節指明：收購委員會作出的裁定與理由（Panel Statements）會公開刊載於證監會網站供全體市場參與者查閱，以此確立香港收購法規先例與判例指引，維護市場透明度與預期一致性。","reference":"Takeovers Code Introduction para 1.8; HKSI Paper 5 Guide Topic 3 Section 1.8, 7.15"},{"id":"T3-111","topic":"Topic 3","subtopic":"Mandatory Offer - Calculation of Creeping Margin post-Disposal","difficulty":"Level 3","question":"股東丙持有上市公司 42% 股份。2025 年 8 月，丙在二級市場減持 4% 股份，持股降至 38%。2026 年 2 月（距 2025 年 8 月減持僅 6 個月），丙擬重新在市場買入該公司股份。根據《收購守則》第 26.1(b) 條，丙在 2026 年 2 月最多可買入多少比例的股份而不會觸發強制全面要約？","options":[{"value":"A","label":"最多可買入 2.0%（使持股增至 40.0%）"},{"value":"B","label":"最多可買入 4.0%（恢復至最初的 42.0%）"},{"value":"C","label":"最多可買入 0.0%（因為其持股已高於該 12 個月內的最低點 38%）"},{"value":"D","label":"最多可買入 6.0%"}],"answer":"A","explanation":"根據 Takeovers Code Rule 26.1 Note 4 及指南 3-21 頁 4.18(b) 節：自由增購率是以過去 12 個月內的「最低持股百分比」為基準。在過去 12 個月內，丙的最低持股低點為 38%。自該低點起計，丙在該 12 個月期間內累計增持不得超過 2%。因此，丙在 38% 基礎上最多只能買入 2.0%（持股上限為 40.0%），超過 40.0% 即觸發強要。","reference":"Takeovers Code Rule 26.1 Note 4; HKSI Paper 5 Guide Topic 3 Section 4.18"},{"id":"T3-112","topic":"Topic 3","subtopic":"Acting in Concert - Consortium Bids Structure","difficulty":"Level 3","question":"兩家互相獨立的私募基金機構擬聯合組建財團（Consortium）對某香港上市公司發起私有化要約。兩家機構在財團投資協議中約定各自出資 50% 共同持有收購載體。在《收購守則》下，該兩家私募基金機構的關係為：","options":[{"value":"A","label":"因彼等為獨立競爭對手，依法自動被視為互不相干的獨立人士"},{"value":"B","label":"彼等因協議共同收購受要約公司的投票權以取得控制權，依法直接構成「一致行動人士」（Persons acting in concert），彼等各自持有的全部股份及交易均須合併計算"},{"value":"C","label":"彼等自動構成上市公司的影子董事"},{"value":"D","label":"彼等必須由香港金管局委派聯合清算小組監督"}],"answer":"B","explanation":"指南 3-21 頁 4.20 節及 Takeovers Code Definitions：組建財團共同出資發起收購要約屬於典型的協同行動架構，財團各成員依照協議合作以取得目標公司控制權，依法直接落入「一致行動人士」（Concert parties）核心定義範圍。","reference":"Takeovers Code Definitions; HKSI Paper 5 Guide Topic 3 Section 4.20"},{"id":"T3-113","topic":"Topic 3","subtopic":"Rule 24 - Purchases Resulting in Higher Offer Price","difficulty":"Level 3","question":"某要約人已向市場宣布以每股 10.00 港元發起自願全面要約。在要約期內，該要約人的一致行動人士在聯交所二級市場以每股 10.50 港元的價格買入了受要約公司的股份。根據《收購守則》第 24.1 條，該項市場買賣將引發何種強制法規結果？","options":[{"value":"A","label":"該買入交易無效，買入的股份被聯交所強制退回"},{"value":"B","label":"要約人必須立即將其收購要約價格相應調高至不低於每股 10.50 港元（Must increase the offer price to not less than HK$10.50），且先前已接納每股 10.00 港元要約的股東亦有權享受該調高後的 10.50 港元作價"},{"value":"C","label":"要約人僅需向該二級市場賣家補發感謝信"},{"value":"D","label":"要約人自動被取消投標資格"}],"answer":"B","explanation":"指南 3-27 頁 4.41 節及 Takeovers Code Rule 24.1 規定：要約人或一致行動方在要約期內若以高於當時要約價的價格在市場買入股份，要約人必須即刻將要約價調高至不低於該最高買入價，且所有股東（包括已提呈接納者）均享有同等調高後的對價，落實平等原則。","reference":"Takeovers Code Rule 24.1; HKSI Paper 5 Guide Topic 3 Section 4.41"},{"id":"T3-114","topic":"Topic 3","subtopic":"Rule 31.3 - Six Months Restrictions on Offers at Lower Prices","difficulty":"Level 3","question":"某要約人在成功收購目標公司逾 50% 股份並結束要約後的六個月內，擬進一步在場外向個別剩餘少數股東收購其持股。根據《收購守則》第 31.3 條，要約人在該六個月內買入剩餘股份的作價限制為：","options":[{"value":"A","label":"可以按原要約價之一折收購"},{"value":"B","label":"買入價格不得高於原全面要約的要約價，除非獲得執行人員的事先核准"},{"value":"C","label":"買入價格不得低於原要約價的兩倍"},{"value":"D","label":"完全無任何價格規限"}],"answer":"B","explanation":"Takeovers Code Rule 31.3 規定：在要約期結束後 6 個月內，要約人或其一致行動人除獲執行人員同意外，不得按「高於要約價」（Above the offer price）的價格自任何股東處購入證券，以防要約人故意在要約期結束後以更高溢價獎勵少數特定股東。","reference":"Takeovers Code Rule 31.3; HKSI Paper 5 Guide Topic 3 Section 4.54"},{"id":"T3-115","topic":"Topic 3","subtopic":"Target Board Circular - Offeree Board Views on Offer Price","difficulty":"Level 2","question":"受要約公司董事會向股東刊發的董事會通函中，全體董事在對收購要約條款的推薦意見上，必須明確表態的內容包括：","options":[{"value":"A","label":"全體董事個人的每日股票買賣計劃"},{"value":"B","label":"明確陳述董事會對該要約條款是否公平合理（Fair and reasonable）的正式推薦意見、獨立董事委員會的具體意見函，以及董事會自身是否打算接納該要約的投票意向陳述"},{"value":"C","label":"受要約公司所有商業合同的掃描原件"},{"value":"D","label":"保證要約人在收購後股價翻倍的書面承諾"}],"answer":"B","explanation":"指南 3-11 頁 3.20 節及 Takeovers Code Rule 2.1 指明：受要約公司董事會通函的核心功能為向股東提供決策指引，必須清晰載列董事會對條款公允性的推薦、IBC 意見、IFA 意見，以及董事本人名下持股是否擬接納該要約的意向聲明。","reference":"Takeovers Code Rule 2.1; HKSI Paper 5 Guide Topic 3 Section 3.20"},{"id":"T3-116","topic":"Topic 3","subtopic":"Inducement Fees / Break Fees (Practice Note 17)","difficulty":"Level 3","question":"在收購交易中，受要約公司與潛在要約人約定：若受要約公司董事會轉而推薦第三方競爭要約，受要約公司須向原要約人支付一筆「反向終止費／誘因費」（Break Fee / Inducement Fee）。根據證監會實務指引第 17 項，該誘因費在金額上限上受到的硬性限制為：","options":[{"value":"A","label":"不得超過受要約公司註冊資本的 50%"},{"value":"B","label":"誘因費的金額通常不得超過受要約公司在要約作價下總估值的 1%（Normally not exceed 1% of the offer value），且董事會及財務顧問必須確認該安排符合股東整體利益"},{"value":"C","label":"不得超過 10 萬港元"},{"value":"D","label":"香港《收購守則》嚴格禁止任何形式的終止費"}],"answer":"B","explanation":"Takeovers Code Practice Note 17 規定：受要約公司承諾支付的誘因費（Break fee）會實質阻礙更高報價的競爭對手出現，因此金額嚴格受限於要約總價值的 1%（Not exceed 1% of the offer value），且財務顧問必須向執行人員確認該費用水平屬公允合理。","reference":"Takeovers Code Practice Note 17; HKSI Paper 5 Guide Topic 3 Section 3.29"},{"id":"T3-117","topic":"Topic 3","subtopic":"Whitewash Waiver - Standstill Period Post-Completion","difficulty":"Level 2","question":"根據《收購守則》附錄六，在股東大會批准清洗豁免並完成相關股份配發交割後，獲免除強要責任的認購方及其一致行動人士，在交易完成後多長時間內，**嚴禁**在未獲批准下進一步增購投票權？","options":[{"value":"A","label":"在完成後 24 小時內"},{"value":"B","label":"在該交易完成日起計 12 個月內（Within 12 months following completion），該認購方不得在二級市場增持超過 2%（嚴格受制於爬行限制）"},{"value":"C","label":"終身不得在香港市場買入任何證券"},{"value":"D","label":"無任何限制，完成當日即可自由買入至 100%"}],"answer":"B","explanation":"指南 3-26 頁 4.38 節及 Schedule VI para 4 指明：清洗豁免完成後的 12 個月內，受惠人的持股受 2% 爬行率嚴密監控，不可藉清洗豁免之便在二級市場隨意增持，否則該後續增持將獨立引發 Rule 26 強制全面要約。","reference":"Takeovers Code Schedule VI; HKSI Paper 5 Guide Topic 3 Section 4.38"},{"id":"T3-118","topic":"Topic 3","subtopic":"Rule 2.10 - Disinterested Shares Definition in Scheme","difficulty":"Level 3","question":"在上市公司透過協議安排（Scheme of Arrangement）進行私有化的過程中，在計算《收購守則》第 2.10 條的「無利害關係股份」（Disinterested Shares）總額時，下列哪類股份必須被**剔除**在無利害關係股份之外？","options":[{"value":"A","label":"持股 0.05% 的公眾零售散戶所持有的股份"},{"value":"B","label":"要約人及其一致行動人士持有的股份、以及在私有化方案中享有特殊安排或優惠條件的任何股東所持有的股份"},{"value":"C","label":"透過中央結算系統（CCASS）存管的機構投資者股份"},{"value":"D","label":"全體退休員工持有的已全數繳足股份"}],"answer":"B","explanation":"指南 3-12 頁 3.23 節及 Takeovers Code Rule 2.10 指明：無利害關係股份（Disinterested shares）排除了要約人、其一致行動方、以及與要約存在特殊利益牽連的任何股東名下持股，確保私有化表決純粹由真正中立的獨立公眾股東行使。","reference":"Takeovers Code Rule 2.10; HKSI Paper 5 Guide Topic 3 Section 3.23"},{"id":"T3-119","topic":"Topic 3","subtopic":"Compulsory Acquisition - Non-Accepting Shareholders Court Application (s. 695 CO)","difficulty":"Level 3","question":"根據香港《公司條例》（Cap. 622）第 695 條，當要約人在要約中跨越 90% 門檻並發出法定強制收購通知（Squeeze-out notice）時，不願意被收購的剩餘少數股東享有的司法抗辯救濟途徑為：","options":[{"value":"A","label":"少數股東無權提起任何司法申訴"},{"value":"B","label":"少數股東可在收到通知之日起計兩個月內，向香港高等法院原訟法庭申請頒令禁止強制收購，法庭在證明要約存在欺詐或不公平壓迫時有權撤銷該收購通知"},{"value":"C","label":"向香港警察商業罪案調查科申請行政保護"},{"value":"D","label":"自動獲取要約人 50% 的股權作為法定補償"}],"answer":"B","explanation":"依據《公司條例》s. 695 及指南 3-33 頁 5.3 節：接獲強制收購通知的小股東有權在 2 個月內向原訟法庭申請反對令，法庭有權審查要約是否存在實質不公或欺詐；若無充分不公證據，法庭通常准許擠出程序完成。","reference":"Companies Ordinance s.695; HKSI Paper 5 Guide Topic 3 Section 5.3"},{"id":"T3-120","topic":"Topic 3","subtopic":"Takeovers Code - Telephonic and Electronic Communications Rules","difficulty":"Level 2","question":"在收購進行期間，要約人及其公關顧問若擬透過電話熱線主動致電受要約公司的個別散戶股東進行拉票（Proxy solicitation）或遊說。根據《收購守則》第 8.6 條及實務指引，此類通訊受到的嚴格限制為：","options":[{"value":"A","label":"電話遊說完全不受任何規則約束"},{"value":"B","label":"致電者僅能使用由執行人員預先審批通過的標準對話文本（Approved script），嚴禁向股東提供任何未載於已公開發布要約文件中的額外非公開資料，且通常不可向股東施加不當壓力"},{"value":"C","label":"致電遊說在香港受到絕對刑事禁止"},{"value":"D","label":"通話記錄必須在 24 小時內登報公布"}],"answer":"B","explanation":"Takeovers Code Rule 8.6 及指南 3-6 頁 2.7 節（原則 3）指明：電話聯絡股東必須遵循事先獲執行人員認可的統一講稿（Approved script），防止遊說人員在電話中選擇性披露新資訊或作出未獲證實的誤導性陳述。","reference":"Takeovers Code Rule 8.6; HKSI Paper 5 Guide Topic 3 Section 2.7"},{"id":"T3-121","topic":"Topic 3","subtopic":"Offer Documentation - Display Documents Requirements","difficulty":"Level 2","question":"根據《收購守則》附錄三（Schedule III），在要約文件或受要約公司董事會通函寄發後直至要約期結束期間，要約各方必須在其官方網站上供公眾查閱的「展示文件」（Documents on Display）包括：","options":[{"value":"A","label":"要約各方全體董事的個人護照掃描件"},{"value":"B","label":"受要約公司及要約人的組織章程細則、過去兩年經審計財務報告、各項重大合約（Material contracts）、財務顧問及估值師的書面同意函件，以及任何借股或融資確認文件"},{"value":"C","label":"全體員工過去三年的工資發放明細表"},{"value":"D","label":"保薦人全體負責人員的考卷答題卡"}],"answer":"B","explanation":"Takeovers Code Schedule III 及指南 3-10 頁 3.14 節指明：為維護審查透明度，展示文件（Documents on display）必須涵蓋章程、最近兩年審計年報、重大合約原件、專家同意書及融資協議，供股東及市場全面核實要約基礎。","reference":"Takeovers Code Schedule III; HKSI Paper 5 Guide Topic 3 Section 3.14"},{"id":"T3-122","topic":"Topic 3","subtopic":"Mandatory Offer - Cash Confirmation Responsibility of Financial Adviser","difficulty":"Level 2","question":"要約人的財務顧問在 Rule 3.5 正式要約公布中簽署「財務資源確認函」（Cash confirmation）。若事後證實要約人根本無足夠資金完成收購，該財務顧問將面臨何種監管追責？","options":[{"value":"A","label":"財務顧問享有完全免責特權"},{"value":"B","label":"財務顧問未能履行專業審慎盡調責任，將直接損害其持牌適當人選資格，面臨證監會吊銷牌照、公開譴責、收購委員會施加冷淡對待令，甚至被法庭追究民事賠償責任"},{"value":"C","label":"財務顧問只需向受要約公司贈送辦公文具即可免責"},{"value":"D","label":"所有責任自動轉移給香港中央結算公司"}],"answer":"B","explanation":"指南 3-9 頁 3.10 節及 Takeovers Code Rule 3.5 指明：財務顧問出具資金充裕確認是極嚴肅的專業擔保，若顧問未進行足夠盡調而出具失實確認，構成嚴重市場失當，將面臨牌照撤銷及嚴厲監管制裁。","reference":"Takeovers Code Rule 3.5; HKSI Paper 5 Guide Topic 3 Section 3.10"},{"id":"T3-123","topic":"Topic 3","subtopic":"Rule 32.1 - Effect of Share Buy-backs on 30% Threshold","difficulty":"Level 3","question":"某大股東持有上市公司 29.5% 股份。上市公司在市場進行場內回購並註銷了 2% 的股本。回購註銷後，該大股東的持股比例自動被動上升至 30.1%。該大股東若未取得證監會事先豁免，其在法律上的狀態為：","options":[{"value":"A","label":"依法自動豁免，永遠無須理會"},{"value":"B","label":"依法被視作完成了一項有投票權股份的收購，直接觸發《收購守則》第 26 條項下的強制現金全面要約義務"},{"value":"C","label":"其持有的全部股份自動轉為庫存股份"},{"value":"D","label":"公司註冊處將直接勒令該大股東破產"}],"answer":"B","explanation":"指南 3-26 頁 4.39 節及 Takeovers Code Rule 32.1 明確規定：股份回購註銷導致大股東股權被動跨越 30% 門檻，在《收購守則》下視同主動收購股份，除非獲得專項豁免，否則依法直接觸發強制全面要約義務。","reference":"Takeovers Code Rule 32.1; HKSI Paper 5 Guide Topic 3 Section 4.39"},{"id":"T3-124","topic":"Topic 3","subtopic":"Acting in Concert - Family Relationships Presumption Scope","difficulty":"Level 2","question":"根據《收購守則》定義，在界定自然人股東的一致行動人士時，下列哪一組家庭成員關係依法自動被「推定為一致行動人士」？","options":[{"value":"A","label":"該個人的表兄弟姊妹的配偶"},{"value":"B","label":"該個人的配偶、其未成年子女或成年子女、父母及其兄弟姊妹（Close relatives such as spouse, children, parents and siblings）"},{"value":"C","label":"該個人的中學同學"},{"value":"D","label":"僅限於共同居住在同一住宅的親屬"}],"answer":"B","explanation":"指南 3-22 頁 4.21 節及 Takeovers Code Definitions Class (8) 指明：個人的近親（Close relatives），包括配偶、父母、子女（不分成年或未成年）及兄弟姊妹，依法被推定為一致行動人士，防止透過家庭成員分拆持股以規避 30% 門檻。","reference":"Takeovers Code Definitions Class 8; HKSI Paper 5 Guide Topic 3 Section 4.21"},{"id":"T3-125","topic":"Topic 3","subtopic":"Rule 19.1 - Announcement of Results of Offer at Closing","difficulty":"Level 2","question":"根據《收購守則》第 19.1 條，在收購要約的任何截止日期（Closing Date）當天下午 7:00 前，要約人負有何種法定公告發布義務？","options":[{"value":"A","label":"要約人可隨意在一個月後公布結果"},{"value":"B","label":"要約人必須在當天下午 7:00 前透過聯交所披露易發布正式公告，說明要約是否已成為無條件、或已失效、或接納期已延長，並詳盡列明截至該日收到的有效接納股份數目及持股總額"},{"value":"C","label":"僅需以電話簡訊通知目標公司董事長"},{"value":"D","label":"公告無須披露接納股數"}],"answer":"B","explanation":"Takeovers Code Rule 19.1 規定：在任何要約截止日下午 7:00 前，要約人必須發布正式公告，向市場通報要約結果（宣布無條件、失效或延長），並清楚披露已收到的有效接納百分比，確保市場資訊即時對稱。","reference":"Takeovers Code Rule 19.1; HKSI Paper 5 Guide Topic 3 Section 4.49"},{"id":"T3-126","topic":"Topic 3","subtopic":"Takeovers Code - Conditional Share Purchases by Offeror","difficulty":"Level 3","question":"要約人在要約期內，擬在二級市場大手購入受要約公司的股票。若該要約在當時仍處於「附帶 50% 最低接納條件」的有條件狀態，要約人在市場買入股份的付款與交割受到的約束為：","options":[{"value":"A","label":"要約人在市場購入的股票必須在要約徹底成為無條件後方可付款交割"},{"value":"B","label":"要約人在二級市場的買入必須按聯交所正常的 T+2 結算週期無條件完成現金交割，不得將市場現貨買賣設定為以要約最終成功為先決條件"},{"value":"C","label":"市場買入股份嚴禁計入要約人的持股總量"},{"value":"D","label":"要約人只能在夜間場外交易時段買入"}],"answer":"B","explanation":"依據 Takeovers Code 規則及交易常規：要約人在市場購入正股屬於獨立的市場交易合約，必須正常執行結算交割；該等買入股份可直接計入要約人持倉以協助其跨越 50% 接納門檻，但絕不能向賣方附加要約成功的附帶條件。","reference":"Takeovers Code Rules 21, 26; HKSI Paper 5 Guide Topic 3 Section 3.28"},{"id":"T3-127","topic":"Topic 3","subtopic":"Rule 2.1 - Independent Financial Adviser Independence Declaration to Executive","difficulty":"Level 2","question":"受要約公司委聘獨立財務顧問（IFA）後，該 IFA 必須向證監會執行人員正式提交何種法定合規確認？","options":[{"value":"A","label":"出具其銀行賬戶具備 10 億港元存款的擔保"},{"value":"B","label":"正式提交書面獨立性確認書（Confirmation of Independence），詳細說明其與要約各方在過去兩年內是否存在任何業務往來，並確認其符合《收購守則》第 2.6 條的獨立性標準"},{"value":"C","label":"承諾其全體代表均為香港永久居民"},{"value":"D","label":"無須提交任何申報，全憑發行人自主聘用"}],"answer":"B","explanation":"Takeovers Code Rule 2.6 及指南 3-11 頁 3.19 節指明：IFA 在正式履職前，必須向執行人員遞交正式的獨立性申報函（Declaration of independence），由執行人員審核確認其無利益衝突後，方可向受要約公司獨立股東委員會出具意見信。","reference":"Takeovers Code Rule 2.6; HKSI Paper 5 Guide Topic 3 Section 3.19"},{"id":"T3-128","topic":"Topic 3","subtopic":"Equality of Information - Social Media Restrictions","difficulty":"Level 2","question":"在收購要約進行期間，受要約公司或要約人的董事在個人社交媒體或即時通訊群組中討論該收購案的前景。根據《收購守則》之一般原則 3 及一般原則 6，此類行為的合規風險為：","options":[{"value":"A","label":"只要貼文設定為好友可見，即完全合法合規"},{"value":"B","label":"構成嚴重違法失當，因為該等未經審查的言論可能違反資訊平等原則（Equality of information）、引發虛假或混亂市場，且可能構成未經通關許可的受規管公開陳述"},{"value":"C","label":"任何人在收購期間均嚴禁使用任何智能手機"},{"value":"D","label":"社交媒體言論自動被香港法庭採納為正式要約文件"}],"answer":"B","explanation":"指南 3-6 至 3-7 頁 2.7 節（原則 3 及 6）及 3-9 頁 3.11 節指明：收購期間的所有資訊發布必須嚴格依循官方公告途徑；董事在社交媒體發表未經核證或選擇性言論，極易破壞市場公平對等，引發嚴厲監管追責。","reference":"Takeovers Code General Principles 3, 6; HKSI Paper 5 Guide Topic 3 Section 2.7, 3.11"},{"id":"T3-129","topic":"Topic 3","subtopic":"Privatisation - Long-stop Date Expiry","difficulty":"Level 2","question":"在透過協議安排進行的私有化方案中，要約人通常在通函中訂立「最後截止日期」（Long-stop Date）。若各項先決條件（包括法庭頒令認可）在該最後截止日期屆滿前仍未能全數達成：","options":[{"value":"A","label":"該私有化計劃將告失效（The scheme will lapse），除非要約人與受要約公司協商一致並取得執行人員批准延長該最後截止日"},{"value":"B","label":"受要約公司自動轉為強制無償退市"},{"value":"C","label":"要約人必須強制按兩倍價格收購股份"},{"value":"D","label":"最後截止日純屬裝飾，在法律上無任何約束力"}],"answer":"A","explanation":"依據收購實務及協議安排條款：Long-stop Date 是保護交易各方的商業時限安全閥；若至該日期仍未滿足各項法院或監管條件，計劃自動失效（Lapses），除非雙方同意並獲執行人員許可順延。","reference":"Takeovers Code; HKSI Paper 5 Guide Topic 3 Section 5.3"},{"id":"T3-130","topic":"Topic 3","subtopic":"Conclusion of Takeovers Framework - Sanctions against Unlicensed Persons","difficulty":"Level 3","question":"在指南回顧的個案三（Case 3）中，受處分的主體 C 先生本身並非證監會持牌人。收購及合併委員會（Panel）仍能對其成功施加長達 18 個月的「冷淡對待令」。此案例在香港收購規管層面所確立的重大法律原則是：","options":[{"value":"A","label":"非持牌人士在香港資本市場享有絕對豁免權"},{"value":"B","label":"《收購守則》的管轄權及於所有利用香港證券市場設施進行收購活動的當事人（不論其是否為證監會持牌人），委員會可透過指示持牌中介機構切斷服務的方式，對非持牌違規者有效施加實質嚴厲制裁"},{"value":"C","label":"委員會只能對持牌金融機構進行處分"},{"value":"D","label":"非持牌人士違規自動移交國際刑警組織處理"}],"answer":"B","explanation":"指南 1-42 至 1-43 頁 4.67–4.72 節及 3-39 頁 7.28 節明確總結：個案三確立了《收購守則》的制裁效力及於非持牌人士；證監會透過命令業界中介人集體冷淡對待（Cold shoulder），能徹底剝奪非持牌違規者進入香港市場的權能，展現《守則》的強大實質威懾力。","reference":"Takeovers Code Introduction; HKSI Paper 5 Guide Topic 1 Section 4.72; Topic 3 Section 7.28"},{"id":"T3-131","topic":"Topic 3","subtopic":"Acting in Concert - Registered Shareholder vs Beneficial Owner","difficulty":"Level 2","question":"某香港投資者將其持有的 15% 股份以名義持有人（Nominee）方式登記於其代理人公司名下。該投資者本人同時以實益擁有人身份直接持有該公司另外 16% 股份。在評估是否觸發 Rule 26 強制全面要約時：","options":[{"value":"A","label":"名義持有人名下的 15% 不計入該個人的持倉"},{"value":"B","label":"該個人實益控制的全部表決權（15% + 16% = 31%）必須依法合併計算，其已達到 31% 表決權，觸發強制全面收購要約義務"},{"value":"C","label":"只要名義持有人未出席股東會即可免除要約"},{"value":"D","label":"必須經香港特別行政區高等法院裁決後方可合併"}],"answer":"B","explanation":"指南 3-21 頁 4.18 節及 Takeovers Code Definitions 指明：在收購守則架構下，計算投票權是基於實質「投票控制權」（Control of voting rights）；以名義持有人或信託代持的股份，其背後實益控制人依法必須全額合併計算，達到 30% 即行觸發強要。","reference":"Takeovers Code Rule 26.1; HKSI Paper 5 Guide Topic 3 Section 4.18"},{"id":"T3-132","topic":"Topic 3","subtopic":"Rule 3.5 Announcement - Irrevocability of Offer Commitment","difficulty":"Level 3","question":"要約人一旦依據《收購守則》第 3.5 條（Rule 3.5）正式發布落實發出要約的確定意向公告，要約人隨後能否單方面撤回該要約？","options":[{"value":"A","label":"要約人只要向公眾道歉即可隨意單方面撤回要約"},{"value":"B","label":"公布發出要約屬於不可撤回的承諾（Binding commitment），要約人不得隨意撤回，除非要約中明確列出的某項特定預設先決條件在合理範圍內未獲滿足，且已事先取得執行人員的同意"},{"value":"C","label":"要約人在簽署包銷合約前享有隨意撤回權"},{"value":"D","label":"受要約公司股價下跌 10% 自動導致要約撤回"}],"answer":"B","explanation":"指南 3-6 頁 2.7 節（原則 4）及 Takeovers Code Rule 3.5/Rule 5 規定：發布確定要約公告是極其嚴肅的市場承諾，要約人嚴禁任意撤回要約，除非符合公告中明確列明且獲執行人員接納的客觀先決條件（如監管反壟斷審批未通過）。","reference":"Takeovers Code Rules 3.5, 5; HKSI Paper 5 Guide Topic 3 Section 2.7"},{"id":"T3-133","topic":"Topic 3","subtopic":"Rule 3.5 Announcement - Financial Adviser Confirmation Standard","difficulty":"Level 2","question":"根據《收購守則》第 3.5 條，要約人財務顧問在公告中確認要約人具備充足財務資源時，該確認函件的法定依據必須建立在：","options":[{"value":"A","label":"要約人董事長口頭承諾的私人信譽基礎上"},{"value":"B","label":"財務顧問經過客觀嚴謹的盡職調查，並持有確定不可撤銷的銀行信貸承諾函或充足的現金存款證明（Confirmed financial resources available）"},{"value":"C","label":"受要約公司股價在未來一年的增長預測上"},{"value":"D","label":"全體承銷商代表的私人房產抵押上"}],"answer":"B","explanation":"指南 3-9 頁 3.10 節及 Takeovers Code Rule 3.5 指明：財務顧問出具資金證明必須具備堅實客觀憑證（如已承諾的銀行融資便利、不可撤銷信用證或已存置於託管戶口的現金），絕不可單憑客戶口頭承諾草率簽署。","reference":"Takeovers Code Rule 3.5; HKSI Paper 5 Guide Topic 3 Section 3.10"},{"id":"T3-134","topic":"Topic 3","subtopic":"Acting in Concert - Voting Agreements between Shareholders","difficulty":"Level 3","question":"股東 X（持股 18%）與股東 Y（持股 14%）簽訂了一份具約束力的股東投票協議，約定在受要約公司的所有股東大會上，雙方將就董事會改選及重大業務決策永遠投一致票。該協議在《收購守則》下的法律後果為：","options":[{"value":"A","label":"該協議純屬私人契約，對收購守則無任何影響"},{"value":"B","label":"雙方透過協議合作行使表決權，依法構成「一致行動人士」（Concert parties），兩者持股合併達到 32%（跨越 30% 門檻），該協議簽署時即觸發強制全面收購要約義務"},{"value":"C","label":"雙方的全部股份被強制轉化為無表決權股份"},{"value":"D","label":"雙方必須在 24 小時內解散其全資公司"}],"answer":"B","explanation":"指南 3-21 頁 4.20 節及 Takeovers Code Rule 26.1 指明：透過協議集合投票權以控制公司表決權，直接構成一致行動關係；若協同後的投票權跨越 30%，簽訂協議本身即構成控制權轉移事件，觸發不可避免的 Rule 26 強制全面要約。","reference":"Takeovers Code Rule 26.1; HKSI Paper 5 Guide Topic 3 Section 4.20"},{"id":"T3-135","topic":"Topic 3","subtopic":"Acting in Concert - Indemnity Arrangements as Presumption","difficulty":"Level 2","question":"在收購談判中，潛在要約人向某大股東承諾：若該大股東在市場增持股份協助要約人奪取控制權，要約人將為其承擔未來一切股價下跌產生的投資虧損（Indemnity arrangement）。該承諾在《收購守則》下：","options":[{"value":"A","label":"構成合法的商業對沖合約"},{"value":"B","label":"直接使該大股東被法定推定為與要約人一致行動的人士（Presumed to be acting in concert），且可能觸犯第 25 條受禁特別交易規定"},{"value":"C","label":"由香港保險業監管局全權豁免監管"},{"value":"D","label":"無須在任何公開文件中披露"}],"answer":"B","explanation":"Takeovers Code Definitions Class (9) 及 Rule 25 指明：提供任何形式的彌償保證、保本承諾或虧損分擔協議，直接將雙方利益實質綑綁，依法被直接推定為一致行動人士，且未經批准提供補償涉嫌違反第 25 條特別優惠交易規定。","reference":"Takeovers Code Definitions Class 9, Rule 25; HKSI Paper 5 Guide Topic 3 Section 4.21"},{"id":"T3-136","topic":"Topic 3","subtopic":"Whitewash Waiver - Underwriting of Rights Issue by Major Shareholder","difficulty":"Level 3","question":"某持股 28% 的大股東擬全額包銷（Underwrite）上市公司的供股發行。若其他公眾股東完全不參與供股，該大股東因履行包銷義務可能承接大量未獲認購新股，使其持股上升至 36%。該大股東為免因包銷而觸發全面要約，標準合規流程為：","options":[{"value":"A","label":"在供股完成後向聯交所發出說明信即可免責"},{"value":"B","label":"在供股協議簽署前，向證監會執行人員正式申請清洗豁免（Whitewash waiver），並在股東大會上取得獨立股東的專項決議案批准"},{"value":"C","label":"大股東必須將包銷佣金退還給全體小股東"},{"value":"D","label":"大股東嚴禁擔任任何供股項目的包銷商"}],"answer":"B","explanation":"指南 3-25 頁 4.34 節及 Takeovers Code Schedule VI Note 1 指明：大股東包銷供股是申請清洗豁免的典型場景；大股東必須事先取得執行人員批出的清洗豁免，並經獨立股東在大會上表決通過，方可在履行包銷導致持股突破 30% 時免受強要處分。","reference":"Takeovers Code Schedule VI; HKSI Paper 5 Guide Topic 3 Section 4.34"},{"id":"T3-137","topic":"Topic 3","subtopic":"Whitewash Waiver - Convertible Securities Issue Trigger","difficulty":"Level 3","question":"上市公司擬向戰略投資者發行一批可換股債券（CB）。若按初始轉股價全面轉股，該投資者持股將達到 35%。關於該次可轉債發行的清洗豁免申請，下列法規時點何者正確？","options":[{"value":"A","label":"該投資者可在未來真正決定轉股時才申請清洗豁免"},{"value":"B","label":"發行人及認購方必須在「發行該批可換股工具之時」（At the time of the issue of the convertible securities），即向執行人員申請並取得清洗豁免並獲獨立股東大會批准；若發行時未取得豁免，日後轉股跨越 30% 時將強制觸發全面要約"},{"value":"C","label":"可轉債轉換永遠不會觸發《收購守則》全面要約義務"},{"value":"D","label":"投資者必須將可轉債全部抵押給香港政府"}],"answer":"B","explanation":"Takeovers Code Rule 26 Note 1 on Dispensations 及指南 3-25 頁 4.34 節規定：若發行可轉債在未來轉股時可能觸發 30% 門檻，清洗豁免必須在「發行工具時」即行申請並獲股東大會批准；若發行時未辦理清洗豁免，日後轉股致持股突破 30% 將不可逆地觸發強要。","reference":"Takeovers Code Rule 26 Dispensations; HKSI Paper 5 Guide Topic 3 Section 4.34"},{"id":"T3-138","topic":"Topic 3","subtopic":"Voluntary Offers - No Subjective Conditions Rule (Rule 30.1)","difficulty":"Level 3","question":"根據《收購守則》第 30.1 條，自願全面收購要約人在設定要約生效條件時，受到下列哪項關鍵法定限制？","options":[{"value":"A","label":"要約人可以自由附加任何由要約人主觀判斷決定的先決條件"},{"value":"B","label":"要約不得附帶任何取決於要約人自身主觀判斷（Subjective judgment of the offeror）、或其實現完全取決於要約人自身控制的條件（Conditions depend on subjective judgment），所有條件必須具備客觀驗證標準"},{"value":"C","label":"自願要約不得附加任何監管審批條件"},{"value":"D","label":"接納條件必須設定為 100%"}],"answer":"B","explanation":"Takeovers Code Rule 30.1 及指南 3-27 頁 4.41 節明確指明：要約先決條件必須具備客觀可衡量標準（如監管機構批准、接納達 50% 等），嚴禁附加主觀條件（如「要約人主觀滿意目標公司業績」），以防要約人將條件作為任意悔約的後門。","reference":"Takeovers Code Rule 30.1; HKSI Paper 5 Guide Topic 3 Section 4.41"},{"id":"T3-139","topic":"Topic 3","subtopic":"Offer Timetable - Extension Announcements Day 21 Requirement","difficulty":"Level 2","question":"在首個截止日期（Day 21）當日，要約人若決定延長其全面要約的接納期限。根據《收購守則》第 19 條，要約人發布的延長公告必須載明：","options":[{"value":"A","label":"全體未接納股東的電話號碼"},{"value":"B","label":"明確指明下一個新的截止日期（Next closing date），或者聲明該要約將維持開放直至另行通知為止，且公告必須在當天下午 7:00 前刊登發布"},{"value":"C","label":"承諾為全體股東報銷律師費用"},{"value":"D","label":"僅需口頭告知受要約公司秘書"}],"answer":"B","explanation":"Takeovers Code Rule 19.1 及指南 3-30 頁 4.49 節規定：延長要約時，要約人必須在當天下午 7:00 前刊登公告，交代已收到的接納水平，並明確訂明下一個截止日期或表明持續開放直至另行通知（若已無條件），維護市場秩序。","reference":"Takeovers Code Rule 19.1; HKSI Paper 5 Guide Topic 3 Section 4.49"},{"id":"T3-140","topic":"Topic 3","subtopic":"Offer Timetable - Final Day for Document Despatch in Competitive Situation","difficulty":"Level 3","question":"當市場出現競爭要約時，兩名要約人陷入持久競價。為防止要約程序無限期拖延，根據《收購守則》第 16 條及實務指引，執行人員通常採取的程序處置措施為：","options":[{"value":"A","label":"強制兩名要約人合併為同一家公司"},{"value":"B","label":"依照既定程序（如拍賣程序/Auction procedure）訂立最後結算日，要求雙方在預設截止日前提交最終不可提高的報價（Final offers），並在當天結束所有修訂"},{"value":"C","label":"直接沒收兩名要約人的競購資格"},{"value":"D","label":"命令目標公司即時停業清盤"}],"answer":"B","explanation":"Takeovers Code Rule 16.5 及實務指引：在競爭性要約持續膠著時，執行人員獲授權介入並實施拍賣程序（Auction procedure），在預定截止日強制雙方提交最終密封出價，從而使收購競爭在既定時間表內迎來確定終局。","reference":"Takeovers Code Rule 16.5; HKSI Paper 5 Guide Topic 3 Section 4.49"},{"id":"T3-141","topic":"Topic 3","subtopic":"Dealings Disclosure - Rule 22 Materiality Threshold (5% Associates)","difficulty":"Level 2","question":"在收購要約期內，受要約公司的某位獨立機構股東在交易日買賣了該公司的股票。該機構投資者在何種持股門檻下，負有依據 Rule 22 逐日公開申報其交易的義務？","options":[{"value":"A","label":"持有該公司 0.1% 或以上股份時"},{"value":"B","label":"持有受要約公司（或要約人）任何類別有表決權證券 5% 或以上（Holding 5% or more of any class of relevant securities）時"},{"value":"C","label":"持有 30% 以上股份時"},{"value":"D","label":"僅限於董事需要申報，機構投資者永遠免除申報"}],"answer":"B","explanation":"指南 1-41 頁 4.59 節、3-31 頁 4.53 節及 Takeovers Code Rule 22 指明：持有相關證券 5% 或以上的大股東屬於守則定義下的聯繫人（Class 6 associate），在整個要約期內進行任何相關證券買賣均必須在翌日中午 12:00 前申報備案。","reference":"Takeovers Code Rule 22; HKSI Paper 5 Guide Topic 3 Section 4.53"},{"id":"T3-142","topic":"Topic 3","subtopic":"Dealings Disclosure - Definition of Relevant Securities","difficulty":"Level 2","question":"在《收購守則》第 22 條交易申報規定中，何謂「相關證券」（Relevant Securities）？其法定範圍包括：","options":[{"value":"A","label":"僅限於在香港聯交所掛牌的普通股現貨股票"},{"value":"B","label":"受要約公司（及換股要約中的要約人）的股份、附帶投票權的股本、可換股證券、認股權證、期權合約，以及任何掛鉤該等證券的衍生工具（Derivatives in respect of any such securities）"},{"value":"C","label":"僅限於短期政府國庫券"},{"value":"D","label":"受要約公司的銀行定期存單"}],"answer":"B","explanation":"Takeovers Code Rule 22 Note 1 及指南 3-31 頁 4.53 節指明：相關證券定義極廣，涵蓋正股、可轉債、權證、期權，以及任何實物交割或現金結算的場外股本衍生工具（CFD、互換等），均須嚴格申報。","reference":"Takeovers Code Rule 22 Note 1; HKSI Paper 5 Guide Topic 3 Section 4.53"},{"id":"T3-143","topic":"Topic 3","subtopic":"Share Buy-backs Code - Independent Board Committee Requirement","difficulty":"Level 2","question":"上市發行人若擬推進一項「場外股份回購」（Off-market share buy-back）或「全面要約回購」，在受託人內部治理上，董事會必須履行何種程序？","options":[{"value":"A","label":"只需由被回購股東個人簽署確認書"},{"value":"B","label":"必須成立由全體無利害關係的獨立非執行董事組成的獨立董事委員會（IBC），並委聘合資格獨立財務顧問（IFA）向 IBC 及獨立股東提供公允性意見與投票推薦"},{"value":"C","label":"強制將公司全部流動資金交由法院提存"},{"value":"D","label":"由全體員工一人一票表決"}],"answer":"B","explanation":"指南 3-11 頁 3.20 節及《股份回購守則》Rule 2 指明：場外回購及要約回購涉及資產向特定或全體股東分派，必須遵循與常規收購完全對等的獨立審查機制，即成立 IBC 並委聘 IFA 出具意見通函供獨立股東審議。","reference":"Share Buy-backs Code Rule 2; HKSI Paper 5 Guide Topic 3 Section 3.20"},{"id":"T3-144","topic":"Topic 3","subtopic":"General Principle 5 - Care Responsibility Accuracy","difficulty":"Level 2","question":"根據《收購守則》之「一般原則 5」（General Principle 5），要約人在向股東提供資訊時所承擔的最高文件編制標準為：","options":[{"value":"A","label":"只要文件中未出現侮辱性字眼即可"},{"value":"B","label":"要約人必須給予股東充足資料與時間以獲取專業意見並達致知情決定，嚴禁隱瞞任何攸關資料，且所有文件必須以「最高程度的審慎、責任及準確性」（Highest possible degree of care, responsibility and accuracy）予以編制"},{"value":"C","label":"要約人可以隨意引述未經審核的網絡匿名評論"},{"value":"D","label":"文件長度必須嚴格限制在 5 頁以內"}],"answer":"B","explanation":"指南 3-6 頁 2.7 節（一般原則 5）明確規定：所有收購文件必須以最高程度之審慎、責任及準確度編制，嚴禁隱匿任何重要事實，確保股東在掌握完整公允資訊下權衡要約利弊。","reference":"Takeovers Code General Principle 5; HKSI Paper 5 Guide Topic 3 Section 2.7"},{"id":"T3-145","topic":"Topic 3","subtopic":"General Principle 6 - False Market Prevention Duty","difficulty":"Level 2","question":"根據《收購守則》之「一般原則 6」（General Principle 6），所有與收購要約相關的人士在市場言行上負有何種核心防範義務？","options":[{"value":"A","label":"在交易完成前必須故意發布虛假煙幕消息以迷惑競爭對手"},{"value":"B","label":"必須迅速且全面披露所有攸關資料，採取一切防範措施以避免出現或持續存在「虛假市場」（Avoid the creation or continuance of a false market），且嚴禁向股東或市場作出任何具誤導性的陳述"},{"value":"C","label":"必須強制將每日公司辦公室電話錄音公開發布"},{"value":"D","label":"僅需對持牌經紀商負責，對公眾散戶無任何防假義務"}],"answer":"B","explanation":"指南 3-6 頁 2.7 節（一般原則 6）指明：所有參與者必須採取一切預防措施防止製造虛假市場（False market），迅速披露真實重大進展，嚴禁發表任何誤導性言論誘使交易。","reference":"Takeovers Code General Principle 6; HKSI Paper 5 Guide Topic 3 Section 2.7"},{"id":"T3-146","topic":"Topic 3","subtopic":"Mandatory Offer - Exemption on Involuntary Trigger (Underwriting)","difficulty":"Level 3","question":"商業銀行持牌附屬機構在為上市公司的大規模供股擔任獨立商業包銷商時，因公眾認購嚴重不足被迫包銷，導致該銀行持股被動跨越 30%。在下列哪種條件下，執行人員通常會批出專項豁免免除該銀行的全面要約責任？","options":[{"value":"A","label":"只要該銀行承諾在 24 小時內將該批股份無償註銷"},{"value":"B","label":"該銀行為正常商業包銷商、該包銷安排純屬正常商業執業，且該銀行承諾在執行人員認可的合理期限內將超額股份全數分銷或在市場出售，使其持股降回 30% 以下，且在此期間不謀求行使控制權"},{"value":"C","label":"商業銀行依法享有終身免受《收購守則》規管的特權"},{"value":"D","label":"由金管局總裁簽署命令即可免除"}],"answer":"B","explanation":"Takeovers Code Rule 26 Note 2 on Dispensations 指明：常規金融機構因真誠履行包銷合約而暫時被動跨越 30% 門檻時，若其承諾在指定短期窗口內將股份轉售配發予獨立第三方且不行使控制投票權，執行人員可批出豁免免除其發出全面要約的責任。","reference":"Takeovers Code Rule 26 Dispensations; HKSI Paper 5 Guide Topic 3 Section 4.25"},{"id":"T3-147","topic":"Topic 3","subtopic":"Frustrating Actions - Corporate Contracts and Service Agreements","difficulty":"Level 3","question":"受要約公司董事會若在要約期內，突發決定與全體執行董事簽署長達 10 年且附帶數億港元不可撤銷解約金的「金色降落傘」（Golden Parachute）長期服務合約。該行為在《收購守則》下的定性為：","options":[{"value":"A","label":"受要約公司正常的董事留任福利安排"},{"value":"B","label":"屬於受《收購守則》第 4 條約束的受禁防礙行動（Frustrating action），因為該等異常沉重的解約補償旨在人為大幅抬高收購成本以阻礙要約，未獲股東大會批准屬嚴重違規"},{"value":"C","label":"完全合法且受香港勞工法規優先保護"},{"value":"D","label":"自動導致要約人退場且無須承擔法律責任"}],"answer":"B","explanation":"指南 3-14 頁 3.30 節及 Takeovers Code Rule 4(c) 明文規定：在要約期間簽訂非常規長期服務合約或異常高額解僱補償合約（金色降落傘），被推定為旨在阻礙要約的受禁防礙行動，未經股東大會批准嚴禁簽署實施。","reference":"Takeovers Code Rule 4(c); HKSI Paper 5 Guide Topic 3 Section 3.30"},{"id":"T3-148","topic":"Topic 3","subtopic":"Takeovers Panel Jurisdiction - Judicial Review Boundaries","difficulty":"Level 3","question":"當收購及合併委員會（Panel）在重大收購案件中作出具有約束力的終局裁決後，受影響當事人若向香港高等法院原訟法庭申請「司法覆核」（Judicial Review），高等法院在審查時所貫徹的司法自制原則通常為：","options":[{"value":"A","label":"法院將全面代替委員會重新評定所有收購商業事實與數值"},{"value":"B","label":"法院高度尊重收購委員會作為專業專家審裁機構的專門判斷，司法覆核僅限於審查委員會在程序上是否存在重大違法（Illegality）、不合理（Irrationality）或程序不公（Procedural impropriety），通常不干預其專業商業裁量"},{"value":"C","label":"法院一律在 24 小時內推翻委員會的裁決"},{"value":"D","label":"法院必須將所有訴訟案件移交英國樞密院裁決"}],"answer":"B","explanation":"指南 3-3 頁 1.7 節及香港行政法先例：司法覆核的本質是審查決策程序的合法性而非重審實體商業事實；法院高度尊重收購委員會的專業共識判斷，除非委員會決策存在嚴重超越權限、重大程序不公或極端非理性，否則法院不會輕易推翻其裁決。","reference":"HKSI Paper 5 Guide Topic 3 Section 1.7"},{"id":"T3-149","topic":"Topic 3","subtopic":"Whitewash Waiver - Circular Notice Period (14 Days Rule)","difficulty":"Level 2","question":"上市發行人就清洗豁免（Whitewash Waiver）向全體股東寄發通函並召開股東特別大會時，該通函自寄發日起至股東大會召開日之間的最短法定通知期為：","options":[{"value":"A","label":"不少於 48 小時"},{"value":"B","label":"不少於 14 個整日（或符合適用公司法及章程細則規定的大會法定通知期，通常至少 14 至 21 天）"},{"value":"C","label":"不少於 180 天"},{"value":"D","label":"無須任何預先通知，當天通知即可召開"}],"answer":"B","explanation":"指南 3-25 頁 4.37 節及《上市規則》/公司法規定：清洗豁免通函必須給予股東充足法定通知期審閱（通常普通決議案至少 14 天淨日，特別決議案至少 21 天淨日），確保獨立股東在獲取充分專業諮詢後出席大會表決。","reference":"Takeovers Code Schedule VI; Companies Ordinance; HKSI Paper 5 Guide Topic 3 Section 4.37"},{"id":"T3-150","topic":"Topic 3","subtopic":"Summary of Topic 3 - Panel Review Timetable (Strict Deadlines)","difficulty":"Level 2","question":"綜合《收購守則》的程序規範，當事人若擬就證監會收購執行人員作出的日常裁決提請收購委員會（Panel）進行覆核聆訊，其向委員會秘書處遞交覆核申請書的時效要求為：","options":[{"value":"A","label":"在下一個曆年結束前遞交即可"},{"value":"B","label":"必須嚴格在收到該項裁決後的指定極短期限內（通常在數天之內）迅速提出，以符合收購交易講求極高時間敏感度與商業確定性的本質要求"},{"value":"C","label":"隨時可以提出，無任何時間限制"},{"value":"D","label":"必須在要約徹底失效 10 年後提出"}],"answer":"B","explanation":"指南 3-37 頁 7.7 節及《收購守則》引言規定：收購交易節奏極快，涉及二級市場敏感價格波動；針對執行人員裁決之覆核必須在極短規定期限內迅速提出，以防止監管爭議無限期拖延收購時間表並損害市場秩序。","reference":"Takeovers Code Introduction; HKSI Paper 5 Guide Topic 3 Section 7.7"},{"id":"T3-151","topic":"Topic 3","subtopic":"Equality of Treatment - Share Classes and Convertible Securities Valuation","difficulty":"Level 3","question":"受要約公司發行了普通股以及可按固定比例換取普通股的非上市優先股。要約人擬對普通股提出自願全面要約。根據《收購守則》第 13 條及第 14 條，要約人針對該批非上市優先股所提出的「相若要約」（Comparable offer），其定價通常應遵循何種客觀基準？","options":[{"value":"A","label":"定價必須由香港財政司司長全權指定"},{"value":"B","label":"通常應參照「透視價值」（See-through value），即以普通股的要約價格乘以每股優先股所能轉換的普通股數目，並由獨立財務顧問進行評估並經執行人員認可"},{"value":"C","label":"優先股的要約價嚴禁超過普通股要約價的 50%"},{"value":"D","label":"優先股要約價必須強制設定為每股優先股面值的 10 倍"}],"answer":"B","explanation":"依據《收購守則》第 13 條及學習指南 3-28 頁 4.44–4.45 節，對附帶可轉換權益之證券（如優先股、認股權證、可轉債）提出相若要約時，定價的核心慣例是採用「透視價值」（See-through value），即以標的普通股的要約價乘以轉股比例所得之理論價值，以維持不同類別證券持有人的實質公平待遇。","reference":"Takeovers Code Rules 13, 14; HKSI Paper 5 Guide Topic 3 Section 4.44-4.45"},{"id":"T3-152","topic":"Topic 3","subtopic":"Rule 13 - Out-of-the-money Options Appropriate Offer","difficulty":"Level 3","question":"受要約公司有若干尚未行使的僱員股份期權，其行使價為每股 12.00 港元。要約人對受要約公司普通股提出的全面要約價為每股 10.00 港元（即期權處於價外狀態 / Out-of-the-money）。根據《收購守則》第 13 條，要約人對該等價外期權持有人應當提出何種要約？","options":[{"value":"A","label":"要約人可以完全不理會該等期權持有人且無須發出任何文件"},{"value":"B","label":"要約人仍須提出「適當要約」（Appropriate offer），在此情況下，要約人通常可以像徵性代價（如每手或每份期權 0.01 港元或名義現金代價）提出收購並註銷該等期權"},{"value":"C","label":"要約人必須強制按每股 10.00 港元全額收購該等期權"},{"value":"D","label":"該等期權必須由法院強制沒收"}],"answer":"B","explanation":"指南 3-28 頁 4.44 節及 Takeovers Code Rule 13 指明：即使衍生工具處於「價外」（即行使價高於要約價，透視價值為負數或零），要約人仍負有法定義務提出適當要約（Appropriate offer），實務上通常以名義上的象徵性金額（Nominal amount，例如 0.01 港元）要約收購以註銷該等權證。","reference":"Takeovers Code Rule 13; HKSI Paper 5 Guide Topic 3 Section 4.44"},{"id":"T3-153","topic":"Topic 3","subtopic":"Whitewash Waiver - Competence Criteria of Advisers (Appendix B Competence Guidelines)","difficulty":"Level 2","question":"根據證監會《勝任能力的指引》附錄 B（Appendix B）及指南說明，機構融資顧問在受聘就受《收購守則》約束的交易或清洗豁免事項向客戶提供專業意見時，該顧問機構及其從業員必須：","options":[{"value":"A","label":"僅需持有普通證券經紀人資格"},{"value":"B","label":"符合專門針對《收購守則》諮詢業務的額外勝任能力及經驗要求（Additional competence requirements），並符合特定的持續專業培訓（CPT）規定"},{"value":"C","label":"向香港交易所繳納 500 萬港元押金"},{"value":"D","label":"由全體非執行董事提供個人信用背書"}],"answer":"B","explanation":"指南 1-38 頁 4.45(b) 節指明：就《收購守則》或《股份回購守則》受規管交易提供意見的機構融資顧問，必須符合證監會《勝任能力的指引》附錄 B 所訂明的專門資格、交易經驗、負責人員標準及持續專業培訓（CPT）專項時數要求。","reference":"SFC Guidelines on Competence Appendix B; HKSI Paper 5 Guide Topic 1 Section 4.45"},{"id":"T3-154","topic":"Topic 3","subtopic":"The Creeper Provision - Interaction with Share Capital Changes","difficulty":"Level 3","question":"某大股東在某上市公司持有 35.0% 的投票權。該上市公司隨後因少數股東行使期權而增發新股，導致該大股東的持股比例被稀釋至 34.0%。若該大股東擬在二級市場買入股份以恢復持股比例，在計算 12 個月內 2% 的爬行率時，該大股東自 34.0% 的低點起計，最多可買入：","options":[{"value":"A","label":"可買入 3.0% 股份以超越原先水平"},{"value":"B","label":"在該 12 個月內自 34.0% 起計累計買入不得超過 2.0%（即持股上限為 36.0%），即使其歷史持股曾高達 35.0%"},{"value":"C","label":"可無限制買入以抵消被動稀釋的影響"},{"value":"D","label":"一股都不能買入，否則即觸發全面要約"}],"answer":"B","explanation":"指南 3-21 頁 4.18(b) 節及 Takeovers Code Rule 26.1 Note 4 規定：2% 自由增購率是以 12 個月期間內該人持股的「最低百分比」（34.0%）為絕對基準點；無論該最低點是由於被動稀釋還是主動減持造成，該人在 12 個月內的總增購額均不得超過 2.0%（即不得買入超過 2.0% 的表決權股份）。","reference":"Takeovers Code Rule 26.1 Note 4; HKSI Paper 5 Guide Topic 3 Section 4.18"},{"id":"T3-155","topic":"Topic 3","subtopic":"Mandatory Offer - Placing and Top-up Transactions (Rule 26 Note 6)","difficulty":"Level 3","question":"在香港資本市場常見的「先舊後新配售」（Placing and Top-up）交易中，控股股東先將其持有的 10% 舊股配售予獨立投資者（持股由 45% 降至 35%），隨後按相同價格認購上市公司增發的 10% 新股以補足持股（持股回升至約 43%）。在下列哪種條件下，該控股股東重新認購新股獲豁免觸發全面要約？","options":[{"value":"A","label":"只要配售與認購在 6 個月內完成即可"},{"value":"B","label":"根據《收購守則》第 26.1 條註釋 6，大股東在配售舊股後，必須在十四天之內（Within 14 days）完成認購新股，且其認購後所持股份百分比不得超過其配售前原有的持股百分比，並符合相關豁免申報條件"},{"value":"C","label":"大股東必須全額免收任何配售佣金"},{"value":"D","label":"必須經香港高等法院頒令認可"}],"answer":"B","explanation":"Takeovers Code Rule 26.1 Note 6 及指南 3-26 頁 4.40 節指明：在先舊後新配售中，大股東減持後再增持看似觸發爬行條款，但若新股認購在舊股配售後 14 天內完成，且最終持股比例不超過初始配售前的持股比例，執行人員依法給予常規豁免，不視為違規觸發全面要約。","reference":"Takeovers Code Rule 26.1 Note 6; HKSI Paper 5 Guide Topic 3 Section 4.40"},{"id":"T3-156","topic":"Topic 3","subtopic":"Offer Timetable - Multiple Classes of Shares Day 21 Synchronization","difficulty":"Level 2","question":"當要約人對受要約公司的普通股以及可換股優先股同時提出全面要約時，在要約文件寄發與截止時間表上，兩類要約在程序上的關係為：","options":[{"value":"A","label":"優先股要約必須在普通股要約結束三年後方可開始"},{"value":"B","label":"兩類要約的文件通常合併於同一份要約文件中寄發，且其最早接納截止日期（Day 21）及終局截止日期（Day 60）在時間表上必須保持同步（Synchronized）"},{"value":"C","label":"普通股要約截止日必須比優先股要約早 60 天"},{"value":"D","label":"優先股要約接納期僅能為 24 小時"}],"answer":"B","explanation":"指南 3-28 至 3-30 頁 4.44–4.49 節及 Rule 13/15 指明：對不同類別證券發出的相若要約，其時間表與要約文件通常同步推進，各類別證券的首次截止日及最終截止日保持一致，以防不同類別證券持有人面臨資訊與時間不對稱。","reference":"Takeovers Code Rules 13, 15; HKSI Paper 5 Guide Topic 3 Section 4.44, 4.49"},{"id":"T3-157","topic":"Topic 3","subtopic":"Rule 3.5 Announcement - Conditions Precedent to an Offer","difficulty":"Level 3","question":"要約人在公布發出收購要約時，擬將要約設定為「附帶先決條件的要約」（Pre-conditional Offer，例如須取得海外反壟斷監管審批）。根據《收購守則》第 3.5 條及第 8.2 條，該先決條件在設置與時間表上必須符合何種監管要求？","options":[{"value":"A","label":"要約人可以隨意將先決條件設定為長達 20 年"},{"value":"B","label":"該先決條件必須獲得證監會執行人員的事先同意，公告中必須訂明達成先決條件的最後截止日期（Long-stop date），且要約文件通常僅在該等先決條件全數達成後 7 天內（或 21 天內）方正式寄發"},{"value":"C","label":"先決條件必須包含由要約人全體董事進行投票"},{"value":"D","label":"先決條件在香港全面要約中屬永久違法"}],"answer":"B","explanation":"Takeovers Code Rules 3.5, 8.2 及實務指引：附帶先決條件的要約公告（Pre-conditional announcement）必須經執行人員事先認可，先決條件必須客觀明確且訂有清晰的最後時限（Long-stop date）；要約文件在先決條件全數達成前不得寄發，待條件達成後方啟動正式寄發要約文件時間表。","reference":"Takeovers Code Rules 3.5, 8.2; HKSI Paper 5 Guide Topic 3 Section 4.48"},{"id":"T3-158","topic":"Topic 3","subtopic":"Acting in Concert - Partners in a Partnership","difficulty":"Level 2","question":"根據《收購守則》關於一致行動人士之法定推定類別，在有限合夥基金（Limited Partnership Fund）架構中，下列哪組主體依法被「推定為一致行動人士」？","options":[{"value":"A","label":"有限合夥基金的普通合夥人（General Partner）、該基金本身、以及受同一普通合夥人控制的其他關聯投資基金"},{"value":"B","label":"全體被動有限合夥人（LPs）及其各自的私人家庭保姆"},{"value":"C","label":"有限合夥基金與其所有的海外開戶銀行"},{"value":"D","label":"有限合夥基金與香港稅務局"}],"answer":"A","explanation":"指南 3-22 頁 4.21 節及 Takeovers Code Definitions Class (1) & (2) 指明：合夥企業架構中，普通合夥人（GP）掌握投資與表決控制權，因此 GP 與其管理的合夥基金以及受同一管理架構控制的其他同系實體，依法被推定為一致行動人士。","reference":"Takeovers Code Definitions Class 1 & 2; HKSI Paper 5 Guide Topic 3 Section 4.21"},{"id":"T3-159","topic":"Topic 3","subtopic":"Whitewash Waiver - Voting by Independent Shareholders on Poll","difficulty":"Level 2","question":"根據《收購守則》附錄六，在受要約公司召開股東大會審議清洗豁免決議案時，該項決議案在表決方式上必須嚴格採用：","options":[{"value":"A","label":"大會現場舉手表決（Show of hands）"},{"value":"B","label":"以一股一票的方式進行正式「投票表決」（Voting by poll），且表決結果公告中必須詳細披露贊成與反對的實際股份數額與百分比"},{"value":"C","label":"由董事會主席一人全權決定"},{"value":"D","label":"由公證人在大會門外以抽籤方式決定"}],"answer":"B","explanation":"指南 3-25 頁 4.35 節及 Takeovers Code Schedule VI para 2 明確規定：清洗豁免決議案依法必須以「按股數投票方式」（Voting by poll）表決，嚴禁使用舉手表決，且受惠人與非獨立股東名下持股不得計入，大會結果公告須具體披露票數明細。","reference":"Takeovers Code Schedule VI para 2; HKSI Paper 5 Guide Topic 3 Section 4.35"},{"id":"T3-160","topic":"Topic 3","subtopic":"Share Buy-backs Code - Repurchases by Subsidiaries Treatment","difficulty":"Level 2","question":"上市發行人的全資附屬公司若在公開市場買入其上市母公司的股份，根據《股份回購守則》及《公司條例》，該交易在法規上的定性與約束為：","options":[{"value":"A","label":"視為普通二級市場自營投資，完全不受任何規則約束"},{"value":"B","label":"附屬公司購買其母公司股份在香港《公司條例》（Cap. 622）下原則上受法律嚴格禁止；若符合特定海外法定豁免，該買入在《股份回購守則》下亦被等同視為發行人本身的股份購回（Treated as share buy-back by the issuer）"},{"value":"C","label":"附屬公司購買母公司股票可享受免稅待遇"},{"value":"D","label":"買入的股份自動享有三倍投票權"}],"answer":"B","explanation":"指南 1-30 頁 3.61 節、3-34 頁 6.1 節及《公司條例》s. 140 指明：香港公司法原則上禁止附屬公司持有或買入母公司股份；在海外法例允許的特定架構下，附屬公司買入母公司證券受《股份回購守則》直接管轄，被等同視為母公司本身的回購。","reference":"Companies Ordinance s.140; Share Buy-backs Code; HKSI Paper 5 Guide Topic 3 Section 6.1"},{"id":"T3-161","topic":"Topic 3","subtopic":"Rule 8.3 - Timing of Dispatch of Share Certificates in Offers","difficulty":"Level 2","question":"在收購要約徹底失效（Lapsed）後，受要約公司股東先前已遞交過戶處的股票實體憑證（Share Certificates）及過戶文件，要約人負有何種法定退回時限責任？","options":[{"value":"A","label":"可由要約人保管三年"},{"value":"B","label":"要約人及股份過戶登記處必須在要約失效之日起計十天之內（Within 10 days of the offer lapsing），以郵寄方式將股票憑證等文件退還予相關股東"},{"value":"C","label":"該等股票憑證自動在失效當日銷毀"},{"value":"D","label":"股東必須親身前往要約人辦公室繳費領回"}],"answer":"B","explanation":"Takeovers Code Rule 20.2 及實務規範指明：若全面要約失效，要約人及其過戶處必須在要約失效後 10 天內（Within 10 days），將股東提呈接納時交付的股票證書及轉讓文書妥為退還寄回，解除對少數股東資產的凍結。","reference":"Takeovers Code Rule 20.2; HKSI Paper 5 Guide Topic 3 Section 4.52"},{"id":"T3-162","topic":"Topic 3","subtopic":"Equality of Treatment - Shareholder Irrevocables Compensation Prohibition","difficulty":"Level 3","question":"要約人向受要約公司的某位主要股東索取不可撤銷接納承諾時，私下向該股東支付了一筆相當於每股 0.20 港元的「承諾簽約金」（Commitment fee）。該安排在《收購守則》下的法律定性為：","options":[{"value":"A","label":"合法的商業期權補償費"},{"value":"B","label":"嚴重違反《收購守則》一般原則 1（平等對待原則）及第 25 條（禁止特別交易），因為該費用實質上提高了該股東所獲得的每股變現對價，若未獲批准將導致要約人面臨公開譴責及強制要求向全體股東加價"},{"value":"C","label":"完全符合市場常規，無須披露"},{"value":"D","label":"該簽約金可自香港印花稅中全額抵免"}],"answer":"B","explanation":"指南 3-6 頁 2.7 節（原則 1）及 3-13 至 3-14 頁 3.27 節（Rule 25）明確指出：向簽署不可撤銷承諾的股東支付額外費用或補償，構成了對其他股東的不平等待遇，屬於受禁特別交易，要約人不得以任何名義向特定股東輸送超額代價。","reference":"Takeovers Code General Principle 1, Rule 25; HKSI Paper 5 Guide Topic 3 Section 3.27"},{"id":"T3-163","topic":"Topic 3","subtopic":"Acting in Concert - Board Directors Recommendation Cohesion","difficulty":"Level 2","question":"受要約公司全體執行董事均在董事會通函中簽名支持要約並推薦股東接納。在收購監管下，全體董事共同發表推薦意見這一行為本身：","options":[{"value":"A","label":"直接使全體執行董事被視為與要約人一致行動的人士"},{"value":"B","label":"純屬董事履行其法定受託責任與守則職責（Fiduciary duties），該推薦行為本身不會僅憑此項原因致使董事被視為與要約人一致行動"},{"value":"C","label":"自動剝奪全體董事的個人持股投票權"},{"value":"D","label":"屬於受禁防礙行動"}],"answer":"B","explanation":"Takeovers Code Definitions 及指南 3-7 頁 2.7 節（原則 8）指明：受要約公司董事向股東出具意見函並推薦要約，乃履行董事職責之常態；只要董事自身與要約人不存在私下利益協議，純粹出具接納推薦意見絕不會使其成為要約人的一致行動人士。","reference":"Takeovers Code Definitions; HKSI Paper 5 Guide Topic 3 Section 2.7"},{"id":"T3-164","topic":"Topic 3","subtopic":"Rule 16.2 - Minimum Offer Period after Price Revision","difficulty":"Level 2","question":"根據《收購守則》第 16.2 條，要約人在刊發修訂要約文件（例如提高收購價）之後，該要約必須維持向全體股東開放接納至少多長時間？","options":[{"value":"A","label":"至少 24 小時"},{"value":"B","label":"至少十四天（Must be open for acceptance for not less than 14 days following the date of the revised offer document）"},{"value":"C","label":"至少 60 天"},{"value":"D","label":"接納期不得超過 3 天"}],"answer":"B","explanation":"指南 3-30 頁 4.49 節及 Takeovers Code Rule 16.2 明確指明：無論要約先前已開放多久，一旦要約人修訂要約條款並寄發修訂文件，要約自該修訂文件寄發日起必須維持開放至少 14 天（Not less than 14 days），以確保股東享有充足時間消化新條款。","reference":"Takeovers Code Rule 16.2; HKSI Paper 5 Guide Topic 3 Section 4.49"},{"id":"T3-165","topic":"Topic 3","subtopic":"The Executive - Informal Guidance and Consultation Meetings","difficulty":"Level 1","question":"根據《收購守則》引言第 1.5 段，從業人員在籌劃一項可能涉及《守則》複雜條文或豁免條款的重大收購交易時，證監會企業融資部執行人員所提倡的常規合作方式為：","options":[{"value":"A","label":"在交易公告發布前嚴禁與執行人員取得任何聯繫"},{"value":"B","label":"鼓勵從業人員在交易籌備的早期階段（At an early stage），就任何有疑問的事宜主動向執行人員進行保密非正式諮詢（Consult with the Executive）"},{"value":"C","label":"僅能透過香港警務處轉遞諮詢公函"},{"value":"D","label":"向執行人員繳納保密諮詢費後方可對話"}],"answer":"B","explanation":"指南 1-38 頁 4.42 節、3-3 頁 1.6 節及 3-7 頁 2.9 節反覆強調：《收購守則》強烈鼓勵各方及其顧問在交易的「早期階段」（At an early stage）主動與執行人員溝通諮詢，以確保交易結構設計符合守則精神，避免事後違規爭端。","reference":"Takeovers Code Introduction para 1.5; HKSI Paper 5 Guide Topic 3 Section 2.9"},{"id":"T3-166","topic":"Topic 3","subtopic":"Whitewash Waiver - Interim Dividends Pre-completion Restrictions","difficulty":"Level 3","question":"在等待股東大會審議清洗豁免及完成新股發行交割期間，受要約公司董事會若擬宣布派發一筆異常高額的特別現金股息。在《收購守則》下，該派息提議受到的合規約束為：","options":[{"value":"A","label":"發行人可以隨意派息，與清洗豁免無任何關聯"},{"value":"B","label":"該非常規大額派息實質上構成了對現有資產的重大處置或可能改變要約作價基礎，受要約公司必須事先諮詢執行人員，且可能需要經獨立股東在大會上獨立審批，否則可能損害清洗豁免的審批基礎"},{"value":"C","label":"公司董事長個人可直接沒收該筆股息"},{"value":"D","label":"特別股息在香港上市公司中屬違法分派"}],"answer":"B","explanation":"Takeovers Code Rule 4 及 Schedule VI 規定：在審批清洗豁免或要約期間，目標公司突擊派發非常規重大股息（Abnormal dividend）會實質改變公司每股淨資產與財務基礎，可能被視為防礙行動或損害整體交易公允性，必須事先諮詢執行人員取得許可。","reference":"Takeovers Code Rule 4, Schedule VI; HKSI Paper 5 Guide Topic 3 Section 3.30"},{"id":"T3-167","topic":"Topic 3","subtopic":"Acting in Concert - Financial Accommodations as Concert Indicator","difficulty":"Level 3","question":"甲投資者向乙投資者提供了一筆巨額無息個人信貸，專供乙投資者在市場大手購入丙上市公司的股票。在《收購守則》下，甲與乙之間的關係為：","options":[{"value":"A","label":"純粹屬於私人借貸關係，互不相干"},{"value":"B","label":"提供融資直接協助他人購買目標公司股份以獲取表決權，依法直接使甲與乙被推定為「一致行動人士」（Presumed to be acting in concert），彼等持有的丙公司股份必須全額合併計算"},{"value":"C","label":"甲自動成為丙公司的影子董事"},{"value":"D","label":"乙的借款行為構成洗錢罪行"}],"answer":"B","explanation":"指南 3-22 頁 4.21 節及 Takeovers Code Definitions Class (9) 指明：凡提供財務資助或信貸（Financial accommodation）專供他人收購某公司表決權股份者，出資人與借款人依法直接被推定為一致行動人士，防止透過出資代理人隱匿幕後收購意圖。","reference":"Takeovers Code Definitions Class 9; HKSI Paper 5 Guide Topic 3 Section 4.21"},{"id":"T3-168","topic":"Topic 3","subtopic":"Compulsory Acquisition - Multiple Classes 90% Independence","difficulty":"Level 3","question":"受要約公司發行了普通股及無表決權優先股。要約人在自願要約中對兩類股份均提出了收購要約。要約人若擬行使法定強制收購權（Squeeze-out），根據《公司條例》第 693 條，該 90% 的強制收購門檻在計算時必須：","options":[{"value":"A","label":"將兩類股份總市值合併計算達到 90% 即可"},{"value":"B","label":"必須在「每一類別股份」中各自獨立達到該類別要約所涉及股份的至少 90%（Must achieve 90% in each separate class of shares），方可針對該特定類別行使強制收購權"},{"value":"C","label":"只需在普通股達到 90%，即可強制收購全部優先股"},{"value":"D","label":"由全體優先股股東一人一票表決決定"}],"answer":"B","explanation":"《公司條例》s. 693 及指南 3-33 頁 5.3 節明確指明：強制擠出收購權是按股份類別分別行使的（Class by class）；要約人只有在某特定類別股份中實際收購達到該類別要約股份的 90% 時，方可針對該類別未接納股東行使強制收購權。","reference":"Companies Ordinance s.693; HKSI Paper 5 Guide Topic 3 Section 5.3"},{"id":"T3-169","topic":"Topic 3","subtopic":"Rule 2.10 - Scheme of Arrangement Court Sanction Hearing Oppositions","difficulty":"Level 3","question":"在協議安排私有化獲獨立股東在法院會議通過 75% 贊成及未超 10% 反對後，呈請法院舉行最終認可聆訊（Court sanction hearing）時，少數反對股東享有的權利為：","options":[{"value":"A","label":"反對股東嚴禁在法庭聆訊中委託律師陳詞"},{"value":"B","label":"反對股東有權出席法院聆訊並向法官陳詞提出異議；法庭在審查會議表決程序是否公允、以及該方案是否屬合理商人會認可的公正條款時，將實質考量該等異議陳詞"},{"value":"C","label":"法院認可令由法官秘書自動蓋印，無須實質開庭"},{"value":"D","label":"反對股東出席法庭聆訊必須繳納 100 萬港元手續費"}],"answer":"B","explanation":"指南 1-30 頁 3.63 節、2-35 頁 7.33 節及香港法院司法審查常規：協議安排的法院認可程序是獨立司法防線，異議股東有權在法院聆訊中正式出庭反對（Appear and object）；法官有絕對裁量權評估方案是否實質公平，若存在苛待少數，法庭有權拒絕頒令。","reference":"Companies Ordinance s.674; HKSI Paper 5 Guide Topic 1 Section 3.63; Topic 2 Section 7.33"},{"id":"T3-170","topic":"Topic 3","subtopic":"Takeovers Code - Material Changes in Information Circular 9.1","difficulty":"Level 2","question":"根據《收購守則》第 9.1 條，在要約文件或受要約公司通函刊發後、至要約期結束期間，若原文件中所載的任何資料發生了重大變動（Material changes），各方負有何種及時通報義務？","options":[{"value":"A","label":"可留待交易交割滿半年後在年報中備註"},{"value":"B","label":"各方必須在合理切實可行下盡快向市場刊登補充公告或向股東寄發補充文件（Publish a supplementary announcement or document），全面交代重大變更內容"},{"value":"C","label":"董事會必須集體向香港警方自首"},{"value":"D","label":"該要約自動在 24 小時內撤銷"}],"answer":"B","explanation":"Takeovers Code Rule 9.1 及指南 3-3 頁 1.6 節指明：要約期間資訊時效至高無上，凡已公布文件中的資料出現實質性變更，當事人負有不間斷的法定/守則更新責任，必須迅速發布補充公告或寄發補充通函以消除市場盲點。","reference":"Takeovers Code Rule 9.1; HKSI Paper 5 Guide Topic 3 Section 1.6"},{"id":"T3-171","topic":"Topic 3","subtopic":"Frustrating Actions - Disposal of Material Asset Contract Conditional on Offer Failure","difficulty":"Level 3","question":"受要約公司董事會與第三方簽訂一份重大出售協議，並在合約中約定：「本出售合約僅在當前敵意收購要約徹底失效或撤回時方始生效」。該合約在《收購守則》第 4 條下的性質為：","options":[{"value":"A","label":"完全不屬於防礙行動，因為其在要約期內並未實際交割"},{"value":"B","label":"依然構成受禁防礙行動（Frustrating action），因為該條件設置旨在為要約人製造阻礙或剝奪股東就該要約作出決策的機會，未經股東大會批准屬嚴重違規"},{"value":"C","label":"合法的商業遠期期權"},{"value":"D","label":"由發行人行政總裁個人獨立承擔違約責任"}],"answer":"B","explanation":"Takeovers Code Rule 4 及指南 3-14 頁 3.30 節指明：防礙行動的判定在於實質影響，簽署以要約失敗為生效條件的重大合約，直接旨在挫敗要約人的收購意願，使目標公司在收購後背負重大負擔，未獲股東大會批准同屬違規防礙行動。","reference":"Takeovers Code Rule 4; HKSI Paper 5 Guide Topic 3 Section 3.30"},{"id":"T3-172","topic":"Topic 3","subtopic":"Mandatory Offer - No Conditions Other Than 50% Rule Absolute","difficulty":"Level 3","question":"某買方在場外收購了大股東 32% 的股份（觸發 Rule 26 強要義務）。該買方在刊發全面要約公告時，擬在要約中加入「以目標公司維持現有銀行信貸額度為先決條件」。證監會執行人員對此條件的裁決為：","options":[{"value":"A","label":"無條件批准，因為商業信貸至關重要"},{"value":"B","label":"堅決拒絕批准（Will not permit），因為強制全面要約依法不得附加任何除 50% 接納條件之外的任何商業先決條件或主觀融資條件（No conditions other than 50% acceptance condition）"},{"value":"C","label":"要求買方繳納 1,000 萬港元手續費後方可附加"},{"value":"D","label":"將受要約公司轉移至香港金融管理局代管"}],"answer":"B","explanation":"指南 3-23 頁 4.26 節及 Takeovers Code Rule 26.2 明確指明：強制全面要約是法定收購控制權後的剛性對價義務，除 50% 投票權接納條件外，要約人絕對不可附加任何其他條件（No other conditions permitted），任何附加融資或信貸條件的提議均不獲接納。","reference":"Takeovers Code Rule 26.2; HKSI Paper 5 Guide Topic 3 Section 4.26"},{"id":"T3-173","topic":"Topic 3","subtopic":"Acting in Concert - Joint Venture Partners in New Bidding Vehicle","difficulty":"Level 2","question":"甲公司與乙公司共同出資設立一家合營實體 Newco，各佔 Newco 50% 股權，並由 Newco 發起對香港上市公司丙的全面要約。在《收購守則》下，甲公司與乙公司的身份認定為：","options":[{"value":"A","label":"兩者僅為普通股東，互不相干"},{"value":"B","label":"甲公司與乙公司身為共同發起人，直接構成 Newco 的「一致行動人士」（Concert parties），兩者自身持有的任何丙公司股份均須全額合併計算"},{"value":"C","label":"兩者自動成為丙公司的影子監事"},{"value":"D","label":"兩者享有永久免受收購守則約束的特權"}],"answer":"B","explanation":"指南 3-21 頁 4.20 節及 Takeovers Code Definitions Class (1) 指明：共同設立收購載體出資的股東，依照合營協議積極合作推進要約，各出資方與收購載體直接構成無可爭議的一致行動群組。","reference":"Takeovers Code Definitions; HKSI Paper 5 Guide Topic 3 Section 4.20"},{"id":"T3-174","topic":"Topic 3","subtopic":"The Creeper Provision - Zero Base Margin Rule","difficulty":"Level 3","question":"股東丁在過去 12 個月內已透過自由增購率（Creeper）累計在市場買入了 2.0% 的股份（持股由 32% 增至 34%）。在該 12 個月期限屆滿之前，丁若在二級市場進一步買入哪怕只有一手（0.001%）的股份，該交易的後果為：","options":[{"value":"A","label":"因金額極小，受 de minimis 豁免而不受管轄"},{"value":"B","label":"該買入直接使 12 個月內的累計增幅超過 2%，即時觸發《收購守則》第 26 條項下的強制全面收購要約義務"},{"value":"C","label":"買入股份被聯交所自動凍結 10 天"},{"value":"D","label":"丁的全部持股被依法強制註銷"}],"answer":"B","explanation":"指南 3-21 頁 4.18(b) 節及 Rule 26.1(b) 規定：2% 爬行率是嚴格的法定剛性天花板；一旦在 12 個月內累計增幅突破 2.0%（即使超出 0.001%），即行觸發全面現金收購要約，守則對超額買入無任何微量免責條款。","reference":"Takeovers Code Rule 26.1(b); HKSI Paper 5 Guide Topic 3 Section 4.18"},{"id":"T3-175","topic":"Topic 3","subtopic":"Whitewash Waiver - Expiry of Waiver If Proposals Lapsed","difficulty":"Level 2","question":"證監會執行人員批出的清洗豁免（Whitewash Waiver），在有效期限上受到何種限制？","options":[{"value":"A","label":"清洗豁免一旦批出，永久終身有效"},{"value":"B","label":"清洗豁免受制於底層交易方案的落實；若底層配股或注資協議失效、撤回或未能在規定時限內完成交割，該清洗豁免即告同時失效（The waiver will lapse）"},{"value":"C","label":"清洗豁免有效期固定為 100 年"},{"value":"D","label":"執行人員無權對豁免設定任何時限"}],"answer":"B","explanation":"Takeovers Code Schedule VI 及指南 3-25 頁 4.35 節指明：清洗豁免是附隨於特定發行方案的專項寬免；若方案未獲股東通過或底層合約終止失效，清洗豁免隨即自動失效，不得移轉用於任何其他後續交易。","reference":"Takeovers Code Schedule VI; HKSI Paper 5 Guide Topic 3 Section 4.35"},{"id":"T3-176","topic":"Topic 3","subtopic":"Rule 21.1 - Dealings Restrictions on Target Shares by Offeror during Offer","difficulty":"Level 2","question":"根據《收購守則》第 21.1 條，在要約期內，要約人及其一致行動人士在二級市場買賣受要約公司證券時，受到下列哪項一般原則的約束？","options":[{"value":"A","label":"要約人可以隨意進行盤中日內高頻套利交易"},{"value":"B","label":"要約人及其一致行動人士不得在要約期內以低於要約價的價格在市場買入目標公司股份，且任何買入均須依據 Rule 22 進行逐日透明申報"},{"value":"C","label":"要約人嚴禁在要約期買入任何一股目標公司股票"},{"value":"D","label":"所有交易必須全數在場外以黃金結算"}],"answer":"B","explanation":"Takeovers Code Rule 21.1, 22 及指南 3-24 頁 4.29 節指明：要約人可在市場買入股份以推進要約（但須遵守最高價格規則與 Rule 22 翌日申報）；若以高於要約價買入，須調高要約價，嚴禁進行擾亂市場秩序的虛假買賣。","reference":"Takeovers Code Rules 21.1, 22, 24; HKSI Paper 5 Guide Topic 3 Section 4.29"},{"id":"T3-177","topic":"Topic 3","subtopic":"Takeovers Panel Hearings - Open or Closed Sessions","difficulty":"Level 2","question":"收購及合併委員會（Panel）召開紀律處分聆訊或覆核聆訊時，關於聆訊會議的公開性，守則的程序規定通常為：","options":[{"value":"A","label":"必須在香港大球場公開向全港市民進行電視現場直播"},{"value":"B","label":"聆訊通常以「閉門形式」（In private / closed sessions）進行以維護商業機密與程序嚴謹性，但委員會作出的最終裁決結果及理由書通常會向公眾發表"},{"value":"C","label":"聆訊僅限於透過電郵文字傳閱，嚴禁召開實體會議"},{"value":"D","label":"會議必須由香港警務處處長親自主持"}],"answer":"B","explanation":"指南 3-38 頁 7.14 節及 Takeovers Code Introduction 指明：委員會聆訊通常閉門進行（Held in private），確保當事人能坦誠陳述機密商業資訊；聆訊結束審裁完畢後，委員會會刊發正式公開裁決書公布處分結論。","reference":"Takeovers Code Introduction para 1.8; HKSI Paper 5 Guide Topic 3 Section 7.14"},{"id":"T3-178","topic":"Topic 3","subtopic":"Dealings Disclosure - Definition of Associate under Rule 22","difficulty":"Level 2","question":"在《收購守則》第 22 條交易申報體系中，下列哪類機構依法被界定為受要約公司的「聯繫人」（Associate）？","options":[{"value":"A","label":"受要約公司的常年獨立核數師事務所"},{"value":"B","label":"受聘為受要約公司提供機構融資意見的持牌財務顧問（Financial adviser to the offeree company）"},{"value":"C","label":"受要約公司的辦公大樓物業管理保安公司"},{"value":"D","label":"為受要約公司提供日常快遞服務的物流公司"}],"answer":"B","explanation":"指南 1-41 頁 4.58 節、3-31 頁 4.53 節及 Takeovers Code Definitions 指明：擔任受要約公司財務顧問（包括獨立財務顧問 IFA）的持牌法團，依法直接屬於受要約公司的「聯繫人」（Associate），在要約期進行任何相關證券買賣均須受 Rule 22 申報約束。","reference":"Takeovers Code Definitions; HKSI Paper 5 Guide Topic 1 Section 4.58; Topic 3 Section 4.53"},{"id":"T3-179","topic":"Topic 3","subtopic":"Takeovers Code Disciplinary Sanctions - Reprimand Status","difficulty":"Level 1","question":"在指南回顧的個案一（Case 1）中，持牌金融機構 INT-A 因在擔任受要約公司顧問期間違規進行股份買賣且未作 Rule 22 申報，證監會最終對其施加的制裁為：","options":[{"value":"A","label":"判處 INT-A 董事長監禁 5 年"},{"value":"B","label":"施加「公開譴責」（Public reprimand），證監會在決定處分時考慮了其事後主動自首及配合調查的補救態度"},{"value":"C","label":"吊銷 INT-A 全體僱員的香港身份證"},{"value":"D","label":"沒收 INT-A 所有的客戶託管股票"}],"answer":"B","explanation":"指南 1-41 頁 4.62 節及執法案例一指明：證監會對 INT-A 處以公開譴責（Public reprimand），鑑於其內部監控失誤但主動自首（Self-reported）並糾正合規缺陷，證監會未施加更嚴厲的吊銷牌照處分，展現了相稱性執法原則。","reference":"HKSI Paper 5 Guide Topic 1 Section 4.62"},{"id":"T3-180","topic":"Topic 3","subtopic":"Summary of Topic 3 - The Ultimate Role of Independent Shareholders","difficulty":"Level 2","question":"綜合香港《收購守則》與《股份回購守則》的全部核心機制（包括清洗豁免、私有化協議安排、第 4 條防礙行動例外、第 25 條特別交易），該等重大交易獲准推進的最終決定權始終歸屬於：","options":[{"value":"A","label":"由受要約公司控股股東全權決定"},{"value":"B","label":"由不受利益衝突影響的「無利害關係獨立股東」（Disinterested Independent Shareholders）在獲取充分資訊及專業獨立財務顧問意見後，於股東大會上以投票表決方式作出最終決策"},{"value":"C","label":"由證監會執行董事個人全權代為行使投票權"},{"value":"D","label":"由承銷團各大投資銀行聯名裁定"}],"answer":"B","explanation":"指南 3-6 至 3-7 頁 2.7 節（原則 1、7、9）、3-11 頁 3.20 節、3-25 頁 4.35 節及全局考點總結：《收購守則》的制度設計精髓在於排除內部人與控股方利益干擾，將涉及控制權轉移、稀釋或退市的終極選擇權交予無利害關係的獨立股東，捍衛資本市場公平基石。","reference":"Takeovers Code General Principles; HKSI Paper 5 Guide Topic 3 Summary"},{"id":"T3-181","topic":"Topic 3","subtopic":"Mandatory Offer - Exemption for Corporate Restructuring without Change in Ultimate Control","difficulty":"Level 3","question":"某家族信託透過全資擁有的海外公司 A 持有香港上市公司 40% 的有投票權股份。為優化稅務架構，該家族信託設立了另一間全資擁有的海外公司 B，並將海外公司 A 持有的該 40% 上市公司股份全數轉讓予海外公司 B。該項股份轉讓在《收購守則》下的處理原則為：","options":[{"value":"A","label":"因海外公司 B 是新法人且持股達 40%，必須強制向全體公眾股東發出全面收購要約"},{"value":"B","label":"該重組並未導致上市公司的最終實益控制權（Ultimate control）發生任何實質變更，當事人可向證監會執行人員申請專項豁免（Waiver under Rule 26），執行人員通常會批出豁免免除全面要約責任"},{"value":"C","label":"海外公司 B 必須將 10% 股份在二級市場強制拋售"},{"value":"D","label":"上市公司必須即時停牌一年"}],"answer":"B","explanation":"根據 Takeovers Code Rule 26.1 Note 6 及學習指南 3-23 頁 4.25 節，凡集團內部重組或家族信託架構調整，若未引致最終實益控制人發生任何改變，實質上不構成控制權易手，執行人員通常會依據豁免條款批出免除全面要約責任的特許裁決。","reference":"Takeovers Code Rule 26.1 Note 6; HKSI Paper 5 Guide Topic 3 Section 4.25"},{"id":"T3-182","topic":"Topic 3","subtopic":"Whitewash Waiver - Disqualification by Dealings between Circular and Meeting","difficulty":"Level 3","question":"某擬申請清洗豁免的認購人及其一致行動人士，在受要約公司寄發載有清洗豁免建議的通函之後、但在股東大會召開表決之前的一週內，在二級市場賣出了其持有的受要約公司 0.1% 股份。該項減持交易將導致：","options":[{"value":"A","label":"清洗豁免不受任何影響，因為減持股份有利於公眾流通量"},{"value":"B","label":"直接構成違反《收購守則》附錄六第 3 段的受禁交易（Disqualifying transaction），執行人員將即時撤回或拒絕批出清洗豁免，認購人認購新股跨越 30% 即觸發不可撤銷的強制全面要約"},{"value":"C","label":"只要減持資金全數捐給香港特區政府即可免責"},{"value":"D","label":"該認購人全體董事自動轉為無表決權股東"}],"answer":"B","explanation":"指南 3-25 頁 4.36 節及 Takeovers Code Schedule VI para 3(a) 明確指明：在清洗豁免建議公布至大會表決日期間，認購人及其一致行動方進行任何買賣（包括出售或購買），均屬於喪失資格交易（Disqualifying transactions），執行人員絕不會授予清洗豁免。","reference":"Takeovers Code Schedule VI para 3; HKSI Paper 5 Guide Topic 3 Section 4.36"},{"id":"T3-183","topic":"Topic 3","subtopic":"Acting in Concert - Financial Advisers Proprietary Trading Controls","difficulty":"Level 3","question":"擔任收購要約人財務顧問的綜合證券集團，其旗下的自營交易部門在要約期內擬進行受要約公司股份的買賣。該證券集團若未取得「獲豁免自營買賣商」（EPT）認可資格，該自營交易部門進行的買賣將會：","options":[{"value":"A","label":"被視為一般常規經紀買賣，完全不受《收購守則》限制"},{"value":"B","label":"被視為要約人一致行動人士的交易，其買入價格將直接受制於最高價格規則（可能迫使要約人調高要約價），且其在要約期內的出售受到嚴格禁止，所有交易均須在翌日依 Rule 22 作出公開申報"},{"value":"C","label":"自動導致要約人的要約文件被聯交所銷毀"},{"value":"D","label":"該自營交易員必須被停職一年"}],"answer":"B","explanation":"指南 1-41 頁 4.59 節及 Takeovers Code Definitions Class (5) 指明：非豁免的財務顧問自營部門被推定為與客戶一致行動，其任何交易均被視同要約人本人的買賣，高價買入會拉高要約價，未經批准拋售構成違規，且必須逐日申報 Rule 22 報表。","reference":"Takeovers Code Definitions, Rules 21, 22, 24; HKSI Paper 5 Guide Topic 1 Section 4.59"},{"id":"T3-184","topic":"Topic 3","subtopic":"Rule 16.3 - Revised Offer Lowest Acceptable Price","difficulty":"Level 2","question":"根據《收購守則》第 16.3 條，要約人若修訂其全面要約，其修訂後的要約價格在作價基準上：","options":[{"value":"A","label":"要約人可以任意將要約價格下調 50%"},{"value":"B","label":"修訂後的要約價格不得低於原先的要約價格（The revised offer price must not be at a lower price than original offer），要約條款只能向對股東更有利的方向修訂"},{"value":"C","label":"修訂後價格必須嚴格等於每股資產淨值"},{"value":"D","label":"可以改為向股東派送非上市的紀念品代幣"}],"answer":"B","explanation":"Takeovers Code Rule 16.3 規定：全面要約條款的修訂只能是向上調高或改善條件，嚴禁向股東提出較原要約更不利的降價修訂，以維護市場誠信並防止要約人惡意壓制目標公司股價。","reference":"Takeovers Code Rule 16.3; HKSI Paper 5 Guide Topic 3 Section 4.49"},{"id":"T3-185","topic":"Topic 3","subtopic":"Rule 3.7 Talks Announcement - Obligation on Target When Leak Occurs","difficulty":"Level 2","question":"受要約公司正與潛在要約人進行秘密收購談判。當天受要約公司股價出現無法解釋的暴漲 35%，且成交量急劇放大十倍。根據《收購守則》第 3.7 條，受要約公司董事會負有何種法定/守則緊急義務？","options":[{"value":"A","label":"董事會可對異動保持沉默直至簽署最終合約"},{"value":"B","label":"董事會必須立即刊發初步商討公告（Talks announcement under Rule 3.7），交代公司正與潛在買方進行接洽，並在必要時申請短暫停牌，以防止市場在資訊不對稱下出現虛假混亂"},{"value":"C","label":"董事會必須在當天解散談判團隊"},{"value":"D","label":"董事會必須向聯交所繳納 10 萬港元市場穩定費"}],"answer":"B","explanation":"指南 3-6 頁 2.7 節（原則 6）及 Takeovers Code Rule 3.7 明確規定：當出現股價異常波動或重大傳媒洩密跡象時，機密已告喪失，受要約公司負有嚴格責任立即發出商討公告（Talks announcement），以維護市場知情權。","reference":"Takeovers Code Rule 3.7; HKSI Paper 5 Guide Topic 3 Section 4.4"},{"id":"T3-186","topic":"Topic 3","subtopic":"Takeovers Code - Joint Offerors Responsibility","difficulty":"Level 2","question":"當兩家機構組成聯合要約人（Joint Offerors）向目標公司發起全面收購時，在要約文件中所作出的各項陳述與承諾，兩家機構在《收購守則》下承擔：","options":[{"value":"A","label":"按出資比例承擔分散的有限責任"},{"value":"B","label":"共同及個別承擔法律與監管責任（Jointly and severally responsible for the accuracy of all information），且全體聯合要約人的董事均須簽署全額責任聲明"},{"value":"C","label":"僅由排名在前的首要發起人承擔責任"},{"value":"D","label":"完全免除任何個人連帶責任"}],"answer":"B","explanation":"指南 3-8 頁 3.4–3.5 節及 Takeovers Code Rule 9.3 指明：聯合要約架構下，所有聯合要約人及其董事承擔連帶責任（Joint and several responsibility），確保要約文件內的所有披露與融資承諾具備完全約束力。","reference":"Takeovers Code Rule 9.3; HKSI Paper 5 Guide Topic 3 Section 3.5"},{"id":"T3-187","topic":"Topic 3","subtopic":"Privatisation - Headcount Test in Overseas Jurisdictions (Cayman Islands)","difficulty":"Level 3","question":"某香港上市發行人在開曼群島註冊成立，擬透過開曼公司法下的協議安排（Scheme of Arrangement）實施私有化退市。在表決通過門檻上，除遵守香港《收購守則》第 2.10 條（75% 贊成及 10% 否決線）外，該發行人在開曼群島公司法下：","options":[{"value":"A","label":"完全免除任何開曼群島法律程序"},{"value":"B","label":"仍必須同時符合開曼群島當地公司法規定的法定表決門檻（開曼群島若適用傳統人頭測試，則必須同時獲得出席並投票股東的過半數人數贊成，以及 75% 價值贊成），體現跨境雙重合規架構"},{"value":"C","label":"開曼群島法律自動凌駕於香港收購守則之上"},{"value":"D","label":"開曼群島法院無權審理任何協議安排"}],"answer":"B","explanation":"指南 1-30 頁 3.63 節、3-33 頁 5.3 節及離岸公司法實務：在香港上市的海外註冊公司實施私有化，必須同時滿足香港《收購守則》（Rule 2.10）及註冊地公司法（如開曼公司法）的雙重門檻要求，若海外法例保留人人頭測試，發行人必須在兩套法規下均獲批准方可生效。","reference":"Companies Ordinance s.674; Takeovers Code Rule 2.10; HKSI Paper 5 Guide Topic 3 Section 5.3"},{"id":"T3-188","topic":"Topic 3","subtopic":"Compulsory Acquisition - Squeeze-out Consideration Equality","difficulty":"Level 2","question":"要約人在自願要約中跨越 90% 門檻後，依據《公司條例》向剩餘未接納的少數股東發出強制收購通知（Squeeze-out）。要約人向該等被強制擠出的少數股東所支付的收購代價必須：","options":[{"value":"A","label":"可以按原要約價扣除 20% 行政手續費後支付"},{"value":"B","label":"必須嚴格按照原全面收購要約的相同條款及相同每股作價予以支付（On the same terms as the offer），不得施加任何歧視性折讓"},{"value":"C","label":"強制以要約人自身的非上市無表決權債券結算"},{"value":"D","label":"由要約人自由斟酌決定，法例無任何定價規定"}],"answer":"B","explanation":"指南 3-33 頁 5.3 節及《公司條例》ss. 693–704 規定：法定強制收購是全面要約的後續法定延伸，要約人對剩餘被擠出股東的收購條款與價格，必須與要約文件中向全體股東提供的對價完全一致，貫徹股東平等原則。","reference":"Companies Ordinance ss. 693-704; HKSI Paper 5 Guide Topic 3 Section 5.3"},{"id":"T3-189","topic":"Topic 3","subtopic":"Takeovers Code - Dealings by Connected Clients of Financial Advisers","difficulty":"Level 3","question":"在收購要約期內，要約人聘請的財務顧問機構的某位高管的配偶，在二級市場買賣了受要約公司的股份。該項交易在《收購守則》下的法律地位為：","options":[{"value":"A","label":"純屬家庭內部投資，完全免受監管審查"},{"value":"B","label":"該配偶屬於財務顧問（即要約人聯繫人）的緊密聯繫人，其交易受到《收購守則》第 22 條嚴密監管，必須在翌日中午 12:00 前申報，且若有證據顯示其利用了未公開消息，將面臨嚴厲內幕交易刑事檢控"},{"value":"C","label":"交易自動轉化為自願要約接納書"},{"value":"D","label":"該高管必須在 24 小時內退還其全部年終花紅"}],"answer":"B","explanation":"指南 1-41 頁 4.59 節、3-31 頁 4.53 節及 Takeovers Code Rule 22 指明：財務顧問的高級人員及其家屬在要約期間買賣標的證券，受到極度嚴格的監控，必須申報 Rule 22 表格，且嚴防機密外洩或觸犯內幕交易法定罪行。","reference":"Takeovers Code Rule 22; HKSI Paper 5 Guide Topic 1 Section 4.59; Topic 3 Section 4.53"},{"id":"T3-190","topic":"Topic 3","subtopic":"Whitewash Waiver - Retention of Underwriting Commission","difficulty":"Level 2","question":"大股東在為上市公司供股提供全額包銷並申請清洗豁免時，該大股東自上市公司處收取了正常市場水平的「包銷佣金」（Underwriting commission）。在《收購守則》下，該筆佣金的合規判定為：","options":[{"value":"A","label":"自動構成受禁特別交易，直接使清洗豁免無效"},{"value":"B","label":"若該包銷佣金費率符合正常商業市場常規（Normal commercial terms）、已在供股通函中全面披露、且經獨立財務顧問確認屬公允合理，執行人員通常接納該項包銷安排而不視其為受禁特別優惠"},{"value":"C","label":"大股東收取的佣金必須強制捐給香港公益金"},{"value":"D","label":"佣金金額不得超過 10 港元"}],"answer":"B","explanation":"Takeovers Code Schedule VI 及實務先例指明：大股東擔任包銷商收取正常商業佣金，只要費率公允、與支付給獨立包銷商的費率相當，且在通函中充分披露並獲 IFA 確認，執行人員通常不會認定其為違反第 25 條的特別交易。","reference":"Takeovers Code Schedule VI; HKSI Paper 5 Guide Topic 3 Section 4.34"},{"id":"T3-191","topic":"Topic 3","subtopic":"Rule 19.2 - Closing Day Disclosures Failure Penalties","difficulty":"Level 2","question":"要約人在要約截止日下午 7:00 前，未能按照《收購守則》第 19.1 條刊發要約結果公告。根據第 19.2 條，聯交所及證監會獲賦權採取的即時市場處置措施為：","options":[{"value":"A","label":"直接沒收要約人名下所有資產"},{"value":"B","label":"聯交所可暫停該受要約公司證券的買賣，直至要約人正式刊發符合規定的結果公告為止，以防二級市場在未明要約結果下出現混亂交投"},{"value":"C","label":"要約人在 24 小時內自動獲得 100% 股權"},{"value":"D","label":"命令要約人全體董事在香港法庭受審"}],"answer":"B","explanation":"Takeovers Code Rule 19.2 規定：若要約人未能如期在截止日下午 7:00 前公布結果，聯交所通常會指示受要約公司股份停牌，以維護公平有序市場，直至要約人全面披露接納結果公告為止。","reference":"Takeovers Code Rule 19.2; HKSI Paper 5 Guide Topic 3 Section 4.49"},{"id":"T3-192","topic":"Topic 3","subtopic":"General Principle 2 - Implementing Ability Continuous Obligation","difficulty":"Level 2","question":"根據《收購守則》一般原則 2，要約人在實施收購過程中，若其原本依賴的銀行融資便利在要約期中途被銀行撤銷，要約人負有何種法規義務？","options":[{"value":"A","label":"要約人可以宣布要約自動無效並退場"},{"value":"B","label":"要約人依然承擔落實要約的嚴格責任（Must ensure it can and will continue to be able to implement the offer），要約人必須迅速籌集替代資金履行要約付款，否則要約人及其董事將面臨極嚴厲的紀律處分與冷淡對待令制裁"},{"value":"C","label":"所有股東的股份自動被受要約公司無償回購"},{"value":"D","label":"由香港財政司代為償付收購資金"}],"answer":"B","explanation":"指南 3-6 頁 2.7 節（原則 2 及 4）指明：要約人有絕對責任確保能全面落實要約支付；融資撤銷不得作為要約人免除責任的合法抗辯，要約人若無法交割將構成最嚴重的守則違規，面臨被全面驅逐出市場的處分。","reference":"Takeovers Code General Principles 2, 4; HKSI Paper 5 Guide Topic 3 Section 2.7"},{"id":"T3-193","topic":"Topic 3","subtopic":"Acting in Concert - Collective Investment Schemes within Same Group","difficulty":"Level 3","question":"某大型資產管理集團旗下管理五隻獨立的互惠基金（Mutual Funds）。該五隻基金各自買入了同一家香港上市公司的股份，每隻基金持股比例均為 6.5%（合計達到 32.5%）。在《收購守則》下，該五隻基金的持股判定為：","options":[{"value":"A","label":"因五隻基金投資者不同，各自持股均低於 10%，互不關聯"},{"value":"B","label":"該五隻基金由同一資產管理機構統一管理並行使投票權，依法被推定為一致行動人士，其持股合併達到 32.5%（跨越 30% 門檻），原則上將觸發強制全面要約義務（除非該基金經理具備特定豁免資格並經執行人員認可）"},{"value":"C","label":"五隻基金自動轉為優先股持有人"},{"value":"D","label":"必須經香港高等法院裁判確認"}],"answer":"B","explanation":"指南 3-22 頁 4.21 節及 Takeovers Code Definitions Class (1) & (2) 指明：受同一基金經理統一集中控制表決權的基金群組，其表決權依法必須全額合併計算，集合持股達到 30% 即觸發強要風險，基金經理在增持時必須嚴密監控集團持股上限。","reference":"Takeovers Code Definitions; HKSI Paper 5 Guide Topic 3 Section 4.21"},{"id":"T3-194","topic":"Topic 3","subtopic":"Off-market Buy-back - Circular Standard and Valuation Reports","difficulty":"Level 2","question":"上市發行人就場外股份回購（Off-market Share Buy-back）向股東寄發通函時，根據《股份回購守則》第 2 條及實務指引，通函內除獨立董事委員會意見外，必須包含：","options":[{"value":"A","label":"全體被回購股東個人過去十年的稅單"},{"value":"B","label":"獨立財務顧問就回購條款公平合理性出具的詳細意見函，以及若回購涉及資產置換或非上市股權支付，必須包含由獨立專業估值師出具的正式估值報告"},{"value":"C","label":"保證公司每股淨資產增長 200% 的擔保書"},{"value":"D","label":"僅需刊登一份半頁紙的股東大會通告"}],"answer":"B","explanation":"指南 3-35 頁 6.4 節及《股份回購守則》Rule 2 指明：場外回購通函必須達到全面收購標準，載有詳盡的 IFA 公允性分析報告及相關資產估值證明，確保獨立股東在充分知悉每股內在價值下表決該項回購。","reference":"Share Buy-backs Code Rule 2; HKSI Paper 5 Guide Topic 3 Section 6.4"},{"id":"T3-195","topic":"Topic 3","subtopic":"Compulsory Acquisition - Unconditional as to Acceptances Prerequisite","difficulty":"Level 3","question":"要約人若擬行使《公司條例》項下的法定強制擠出權（Squeeze-out），除了達到 90% 的收購門檻外，在要約自身狀態上的法定前提為：","options":[{"value":"A","label":"要約必須依然處於有條件狀態"},{"value":"B","label":"該收購要約必須已經就接納而言宣布為「無條件」（The offer must have become unconditional as to acceptances），且要約人在發出要約時已向股東明確表露私有化意圖"},{"value":"C","label":"要約人必須先取得香港交易所的豁免函"},{"value":"D","label":"受要約公司必須處於清盤停業狀態"}],"answer":"B","explanation":"指南 3-33 頁 5.3 節及《公司條例》s. 693 規定：行使強制收購權的前提是全面要約在接納上已全面成為無條件（即要約已圓滿生效並落實交割），在此基礎上累計收購達 90% 無利害關係股份後，方可啟動法定擠出通知程序。","reference":"Companies Ordinance s.693; HKSI Paper 5 Guide Topic 3 Section 5.3"},{"id":"T3-196","topic":"Topic 3","subtopic":"Rule 18 - Exception to No Increase Statement under Reservation","difficulty":"Level 3","question":"要約人在刊發「不提高要約價聲明」（No increase statement）時，明確註明「但若出現競爭性要約，要約人保留調高要約價格的權利」。隨後第三方競爭對手正式宣布了更高作價的要約。原要約人在法規上的狀態為：","options":[{"value":"A","label":"原要約人依然被絕對鎖死，嚴禁調高價格"},{"value":"B","label":"由於原要約人在發布聲明時已明確預先保留了在出現競爭對手時調高價格的權利（Reserved the right in a competitive situation），原要約人獲准合法調高其收購要約價格以進行競價"},{"value":"C","label":"原要約人必須立即自願退出收購"},{"value":"D","label":"原要約人必須向第三方競爭對手支付賠償金"}],"answer":"B","explanation":"指南 3-10 頁 3.11(c) 節及 Takeovers Code Rule 18.1 指明：要約人若在發表最終聲明時已明確且無保留地保留了在特定情況（如出現競爭要約）下加價的權利，在該預設觸發事件發生時，要約人可合法解除束縛並宣布調高要約價。","reference":"Takeovers Code Rule 18.1; HKSI Paper 5 Guide Topic 3 Section 3.11"},{"id":"T3-197","topic":"Topic 3","subtopic":"Whitewash Waiver - Creeping Limit Trigger within 12 Months","difficulty":"Level 3","question":"某控股股東透過清洗豁免注資後持有上市公司 38% 股份。8 個月後，該大股東在市場增持了 2.5% 股份（使持股增至 40.5%）。該大股東的法律後果為：","options":[{"value":"A","label":"完全合規，因為增持後的總持股未超過 50%"},{"value":"B","label":"直接突破了 12 個月內 2% 的爬行率上限（增持達 2.5%），該大股東必須立即向上市公司全體其他股東發出強制現金全面收購要約"},{"value":"C","label":"大股東可向聯交所補交 10 萬港元手續費以消除責任"},{"value":"D","label":"超額的 0.5% 股份自動歸屬給香港證監會"}],"answer":"B","explanation":"指南 3-26 頁 4.38 節及 Schedule VI para 4 明確指明：清洗豁免完成後，大股東在 12 個月內的增持受 2% 爬行率嚴格規管；增持 2.5% 直接觸犯 Rule 26.1(b)，即時觸發強制全面要約義務。","reference":"Takeovers Code Rule 26.1(b), Schedule VI; HKSI Paper 5 Guide Topic 3 Section 4.38"},{"id":"T3-198","topic":"Topic 3","subtopic":"Takeovers Code Enforcement - Civil Court Orders Injunctions (s. 213 SFO)","difficulty":"Level 3","question":"若某人嚴重違反《收購守則》的強制全面要約義務且拒不改正，證監會除提請收購委員會施加紀律制裁外，還可依據《證券及期貨條例》第 213 條向法院申請何種命令？","options":[{"value":"A","label":"向高等法院申請禁制令，禁止該違規人士行使其在受要約公司的投票權，或命令限制其股份轉讓以保障公眾投資者利益"},{"value":"B","label":"申請沒收受要約公司全部實體辦公大樓"},{"value":"C","label":"命令香港警務處強制代為行使投票權"},{"value":"D","label":"命令該上市公司全體員工即刻停工"}],"answer":"A","explanation":"指南 3-32 頁 5.2 節及 SFO s. 213 指明：證監會有權向原訟法庭申請各類法定禁制令及資產凍結令，包括禁止違規當事人行使表決權或禁止處置股份，以司法強制力配合收購守則之落實。","reference":"SFO s.213; HKSI Paper 5 Guide Topic 3 Section 5.2"},{"id":"T3-199","topic":"Topic 3","subtopic":"Offer Timetable - Post-Closing Listing Status Restoration","difficulty":"Level 2","question":"全面收購要約截止後，若要約人並未尋求將受要約公司私有化，但因大量接納導致受要約公司的公眾持股量跌至 15%（低於法定 25% 門檻）。要約人及受要約公司董事會負有何種法定責任？","options":[{"value":"A","label":"可無限期維持 15% 公眾持股量"},{"value":"B","label":"要約人及受要約公司董事會必須承諾採取適當步驟（如向獨立第三方配售現股或由發行人發行新股），以在合理期限內恢復規定的最低公眾持股量（Restore public float），防止股票長期停牌"},{"value":"C","label":"受要約公司自動被聯交所強制清盤"},{"value":"D","label":"全體接納股東必須退回全部收購款"}],"answer":"B","explanation":"指南 2-47 頁 9.4(c) 節、3-32 頁 5.1 節及 MBLR 8.08 指明：要約結束後若公眾持股量不足且不私有化，要約人及董事會必須向聯交所作出承諾，在指定時間內採取積極行動（如配售新股或減持）恢復足夠的公眾流通量。","reference":"MBLR 8.08; HKSI Paper 5 Guide Topic 2 Section 9.4; Topic 3 Section 5.1"},{"id":"T3-200","topic":"Topic 3","subtopic":"Conclusion of Topic 3 - The Ultimate Spirit of Fair Treatment","difficulty":"Level 2","question":"綜合香港《收購守則》與《股份回購守則》的全部法規條文與一般原則，在處理任何涉及上市公司控制權變更的交易時，貫穿整個制度設計的最根本指導哲學是：","options":[{"value":"A","label":"無條件保護現任管理層的長期職位安全"},{"value":"B","label":"確保在公司控制權易手時，全體股東（尤其是公眾小股東）均享有同等平等的待遇、獲得充足且未被扣留的資訊與時間進行知情評估，並享有以公平合理價格出售其持股退出的法定權利"},{"value":"C","label":"追求以最低的收購成本實現強制私有化"},{"value":"D","label":"嚴格禁止任何形式的二級市場收購兼併活動"}],"answer":"B","explanation":"指南 3-3 頁 1.2 節、3-6 頁 2.7 節（十項一般原則）及全局考點總結：香港收購守則體系的終極核心在於「股東平等待遇」（Equality of treatment），確保控制權溢價由全體股東共享，杜絕管理層或大股東藉機苛待少數股東。","reference":"Takeovers Code General Principles; HKSI Paper 5 Guide Topic 3 Summary"},{"id":"T3-201","topic":"Topic 3","subtopic":"Whitewash Waiver - Expiry of Whitewash upon Subsequent Creep","difficulty":"Level 3","question":"某控股股東透過清洗豁免（Whitewash Waiver）注資，在受要約公司的持股比例自 28% 上升至 45%。該股東在清洗交易完成滿 14 個月後，在公開市場增持了 1.5% 股份。隨後在增持後的第 4 個月，該股東擬再增持 0.8% 股份。根據《收購守則》第 26.1(b) 條，該項後續增持：","options":[{"value":"A","label":"完全合規，因為清洗豁免賦予其永久自由增購權"},{"value":"B","label":"將觸發強制全面收購要約義務，因為在緊接的滾動 12 個月內，其累計增持將達到 2.3%（1.5% + 0.8%），突破了 2% 的自由增購率限制"},{"value":"C","label":"無須提出全面要約，因為每次單獨增持均低於 2%"},{"value":"D","label":"只要獲得受要約公司獨立非執行董事過半數同意即可免責"}],"answer":"B","explanation":"依據《收購守則》第 26.1(b) 條及學習指南 3-26 頁 4.38 節，清洗豁免完成後，持有 30% 至 50% 投票權的股東即重新受制於常規的「爬行條款」（Creeper）。在任何滾動 12 個月期間內，增持累計不得超過 2%。在該 12 個月內增持 1.5% + 0.8% = 2.3%，超過 2% 門檻，將依法強制觸發全面收購要約。","reference":"Takeovers Code Rule 26.1(b), Schedule VI; HKSI Paper 5 Guide Topic 3 Section 4.38"},{"id":"T3-202","topic":"Topic 3","subtopic":"Acting in Concert - Financial Assistance with Target Shares as Collateral","difficulty":"Level 3","question":"某私人貸款機構向某投資者提供了一筆巨額融資專供其收購某香港上市公司的股權，並以該投資者所購入的全部上市公司股份作為質押抵押品。在何種情況下，該放貸機構會被推定為該投資者的一致行動人士？","options":[{"value":"A","label":"只要貸款機構是香港註冊的持牌放債人，在任何情況下均自動免受一致行動推定"},{"value":"B","label":"若該放貸安排並非按正常商業條款的銀行常規業務進行（如提供極端高槓桿且享有投票權委託協議或利潤分成），該放貸人依法將被推定為一致行動人士"},{"value":"C","label":"放貸人嚴禁收取任何貸款利息"},{"value":"D","label":"借款人必須將所有借款折算為實物黃金存管"}],"answer":"B","explanation":"根據 Takeovers Code Definitions Class (9) 及指南 3-22 頁 4.21 節，常規銀行在日常業務中按正常商業條款提供貸款並收取股份質押，通常不被視為一致行動方；但若融資安排超出正常商業貸款常規、附帶利潤分成或投票權控制約定，出資方將被直接推定為一致行動人士。","reference":"Takeovers Code Definitions Class 9; HKSI Paper 5 Guide Topic 3 Section 4.21"},{"id":"T3-203","topic":"Topic 3","subtopic":"Rule 3.5 Announcement - Detailed Financing Structure Disclosure","difficulty":"Level 2","question":"根據《收購守則》第 3.5 條及附錄三，要約人在其 Rule 3.5 正式要約公布中，就其收購資金來源（Financing of the offer）必須詳盡載明的內容包括：","options":[{"value":"A","label":"全體融資銀行高管的私人家庭住址"},{"value":"B","label":"收購所需最高現金款額、資金來源明細、所有銀行借貸安排的具體條款（包括還款期、利率及擔保資產），以及是否擬將受要約公司的資產用於償還該等貸款本息的明確聲明"},{"value":"C","label":"保證要約人在未來 5 年內不申請任何新貸款的承諾"},{"value":"D","label":"全體債權人簽署的免除利息同意書"}],"answer":"B","explanation":"指南 3-9 頁 3.10 節及 Takeovers Code Rule 3.5(f) 指明：Rule 3.5 公告必須全面透明披露資金來源架構，尤其是借貸融資的關鍵條款，並必須清楚說明要約人是否打算以目標公司的資產或收益來清償該等收購負債，防止隱蔽的槓桿收購掏空目標公司。","reference":"Takeovers Code Rule 3.5; HKSI Paper 5 Guide Topic 3 Section 3.10"},{"id":"T3-204","topic":"Topic 3","subtopic":"Mandatory Offer - Calculation when Holding Exactly 30.0%","difficulty":"Level 2","question":"投資者甲原持有上市公司 29.8% 股份，其在市場購入股份使其持股比例恰好達到「剛好 30.0%」（Exactly 30.0% of the voting rights）。根據《收購守則》第 26.1(a) 條，甲在此刻的法規狀態為：","options":[{"value":"A","label":"無須提出全面要約，因為門檻是「超過 30%」"},{"value":"B","label":"必須立即向全體股東提出強制現金全面收購要約，因為法定觸發門檻是「達到或超過 30%」（30% or more of the voting rights）"},{"value":"C","label":"只要在 24 小時內減持 1 股即可自動免除責任"},{"value":"D","label":"由聯交所上市委員會投票決定是否給予豁免"}],"answer":"B","explanation":"指南 3-21 頁 4.18(a) 節及 Rule 26.1(a) 明文規定：全面要約的法定觸發線為「30% 或以上」（30% or more）；達到剛好 30.0% 即已跨越該法定紅線，觸發不可避免的強制全面收購要約。","reference":"Takeovers Code Rule 26.1(a); HKSI Paper 5 Guide Topic 3 Section 4.18"},{"id":"T3-205","topic":"Topic 3","subtopic":"Voluntary Offers - Withdrawal under Rule 5 Conditions","difficulty":"Level 3","question":"自願全面收購要約人在公布要約後，若擬在要約截止前依據特定條件撤回要約（Withdrawal of offer）。根據《收購守則》第 5 條，要約人撤回要約的法定先決條件為：","options":[{"value":"A","label":"只要要約人自身的股價下跌即可自由撤回"},{"value":"B","label":"必須事先取得證監會執行人員的正式同意（Consent of the Executive），且通常必須證明先前已在要約公布中明確列載的某項特定客觀先決條件或生效條件未能達成"},{"value":"C","label":"要約人向受要約公司支付 100 萬港元違約金即可撤回"},{"value":"D","label":"只要獲得受要約公司行政總裁的書面同意即可"}],"answer":"B","explanation":"指南 3-6 頁 2.7 節（原則 4）及 Takeovers Code Rule 5 規定：公布發出要約後，未獲執行人員同意，要約人不得撤銷或撤回要約；執行人員僅在預先在公告中載明且經認可的客觀先決條件實質無法達成時，方會批出撤回同意。","reference":"Takeovers Code Rule 5; HKSI Paper 5 Guide Topic 3 Section 2.7"},{"id":"T3-206","topic":"Topic 3","subtopic":"Target Response - Conflict of Interest within IBC","difficulty":"Level 3","question":"受要約公司設有三名獨立非執行董事。在要約宣布後，其中一名 INED 同時出任要約人某一附屬公司的獨立非執董。根據《收購守則》第 2.1 條，受要約公司獨立董事委員會（IBC）的組成應當：","options":[{"value":"A","label":"該名 INED 可以繼續留在 IBC 中以促進溝通"},{"value":"B","label":"該名 INED 存在明顯的利益衝突，必須被嚴格排除在 IBC 之外；IBC 僅由
